<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RRG</title>
<style>
:root{--bg:#eef1f5;--card:#fff;--ink:#16202c;--mut:#67727f;--line:#e4e8ee;
--shadow:0 1px 3px rgba(20,30,45,.07),0 6px 20px rgba(20,30,45,.05)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);padding:22px 14px;
font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif}
.wrap{max-width:1080px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;
padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
h1{font-size:19px;margin-bottom:4px}
.sub{font-size:12.5px;color:var(--mut);line-height:1.6}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:12px}
.legend span{display:inline-flex;align-items:center;gap:5px;color:var(--mut)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;
font-size:12.5px;color:var(--mut);margin-bottom:10px}
.controls select,.controls button{font:inherit;color:var(--ink);background:#fff;
border:1px solid var(--line);border-radius:8px;padding:4px 8px;cursor:pointer}
.controls button.on{background:#e8edf7;border-color:#b9c8e8}
.controls input[type=range]{width:180px;accent-color:#2563eb}
#chartbox{position:relative}
.qgroup{margin-left:auto;display:inline-flex;gap:6px}
.selwrap{position:relative;display:inline-flex}
.selarrow{position:absolute;left:9px;top:50%;transform:translateY(-50%);pointer-events:none;font-size:10px;color:#67727f;z-index:1}
.secsel{font-weight:600;max-width:170px;text-align:center;text-align-last:center;padding-left:20px}
.controls .qbtn{font-weight:700;border-width:1.5px;padding:4px 12px}
.qbtn.q-Improving{background:#dbeafe;border-color:#2563eb;color:#1e40af}
.qbtn.q-Leading{background:#dcfce7;border-color:#15803d;color:#14532d}
.qbtn.q-Weakening{background:#fef9c3;border-color:#ca8a04;color:#854d0e}
.qbtn.q-Lagging{background:#ffe4e6;border-color:#be123c;color:#9f1239}
.qbtn.on{box-shadow:0 0 0 2px currentColor inset;filter:saturate(1.3)}
#tip{position:absolute;pointer-events:none;background:#101826;color:#f4f6f9;
padding:7px 10px;border-radius:8px;font-size:12px;line-height:1.55;display:none;
max-width:250px;z-index:5;box-shadow:0 4px 14px rgba(0,0,0,.25)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{color:var(--mut);font-weight:600;text-align:left;border-bottom:1px solid var(--line);
padding:6px 8px;white-space:nowrap}
td{border-bottom:1px solid #f1f4f8;padding:6px 8px;white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.hl{background:#f2f6ff}
tr.pin{background:#fff8e6}
#tbl tbody tr{cursor:pointer}
.qtag{display:inline-flex;align-items:center;gap:5px;font-weight:600}
.note{font-size:12px;color:var(--mut);line-height:1.7}
.svgwrap{overflow-x:auto}
svg text{font-family:inherit}
@media(max-width:640px){body{padding:12px 6px}.card{padding:13px}}
</style>
</head>
<body>
<div class="wrap">

    <div id="chartbox"><div class="svgwrap"><svg id="rrg"></svg></div><div id="tip"></div></div>

  <div class="card">

      <th class="num">체류(주)</th></tr></thead><tbody></tbody></table>
  </div>
  <div class="card note" id="foot"></div>
</div>

   '" font-size="11.5" font-weight="600" fill="#16202c" stroke="#ffffff" stroke-width="3" paint-order="stroke" data-i="'+l.i+'">'+esc(l.t)+'</text>');});

 svg.setAttribute('viewBox','0 0 '+Wpx+' '+Hpx);
 svg.setAttribute('style','width:100%;min-width:640px;height:auto;display:block');
 svg.innerHTML=g.join('');
 renderTable(wi);
 applyVis(-1);
}
function renderTable(wi){
 var tb=document.querySelector('#tbl tbody');var rows='';
 var order={Leading:0,Weakening:1,Lagging:2,Improving:3};
 var arr=D.items.map(function(it,idx){var i=atWeek(it,wi);return {it:it,idx:idx,i:i};})
  .filter(function(r){return r.i>=0;});
 arr.sort(function(a,b){var qa=quad(a.it.r[a.i],a.it.m[a.i]),qb=quad(b.it.r[b.i],b.it.m[b.i]);
  return (order[qa]-order[qb])||(b.it.r[b.i]-a.it.r[a.i]);});
 arr.forEach(function(r){
  var it=r.it,i=r.i,q=quad(it.r[i],it.m[i]);
  var dr=i>0?it.r[i]-it.r[i-1]:0, dm=i>0?it.m[i]-it.m[i-1]:0;
  rows+='<tr data-i="'+r.idx+'"><td><span class="dot" style="background:'+COL[q]+'"></span></td>'+
   '<td>'+esc(it.label)+(it.sub?' <span style="color:#9aa4b0">'+esc(it.sub)+'</span>':'')+'</td>'+
   '<td><span class="qtag" style="color:'+COL[q]+'">'+q+' <span style="color:#67727f;font-weight:400">'+KO[q]+'</span></span></td>'+
   '<td class="num">'+it.r[i].toFixed(2)+'</td><td class="num">'+it.m[i].toFixed(2)+'</td>'+
   '<td class="num">'+(dr>=0?'+':'')+dr.toFixed(2)+'</td>'+
   '<td class="num">'+(dm>=0?'+':'')+dm.toFixed(2)+'</td>'+
   '<td class="num">'+(wi===allWeeks.length-1?it.streak:'-')+'</td></tr>';});
 tb.innerHTML=rows;
 Array.prototype.forEach.call(tb.querySelectorAll('tr'),function(tr){
  tr.addEventListener('mouseenter',function(){applyVis(+tr.getAttribute('data-i'));});
  tr.addEventListener('mouseleave',function(){applyVis(-1);});
  tr.addEventListener('click',function(){togglePin(+tr.getAttribute('data-i'));});});
}
function togglePin(i){
 if(pinned[i])delete pinned[i];else pinned[i]=1;
 applyVis(-1);
}
function applyVis(hov){
 var pc=pinnedCount();
 Array.prototype.forEach.call(svg.querySelectorAll('[data-i]'),function(el){
  if(el.getAttribute('data-hit'))return;
  var i=+el.getAttribute('data-i'),base=el.getAttribute('data-op')||'1',o;
  if(hov>=0){o=(i===hov)?base:'0.1';}
  else if(pc){o=pinned[i]?base:'0.05';}
  else{o=base;}
  el.setAttribute('opacity',o);});
 Array.prototype.forEach.call(document.querySelectorAll('#tbl tbody tr'),function(tr){
  var i=+tr.getAttribute('data-i');
  tr.className=(i===hov)?'hl':(pinned[i]?'pin':'');});
 var btn=document.getElementById('pinClear');
 if(pc){btn.style.display='';btn.textContent='고정 해제 ('+pc+')';}
 else{btn.style.display='none';}
}
svg.addEventListener('mousemove',function(ev){
 var t=ev.target,i=t.getAttribute&&t.getAttribute('data-i');
 if(i===null||i===undefined){tip.style.display='none';applyVis(-1);return;}
 var it=D.items[+i],wi=+wkSlider.value,k=atWeek(it,wi);
 if(k<0)return;
 var q=quad(it.r[k],it.m[k]);
 tip.innerHTML='<b>'+esc(it.label)+'</b>'+(it.sub?' <span style="opacity:.75">'+esc(it.sub)+'</span>':'')+
  '<br>'+esc(wkLabel(it.weeks[k]))+'<br>R '+it.r[k].toFixed(2)+' / M '+it.m[k].toFixed(2)+
  ' <span style="color:'+COL[q]+'">'+q+' '+KO[q]+'</span>'+
  '<br><span style="opacity:.65">클릭하면 이 항목만 고정</span>';
 var bx=document.getElementById('chartbox').getBoundingClientRect();
 tip.style.left=Math.min(ev.clientX-bx.left+14,bx.width-250)+'px';
 tip.style.top=(ev.clientY-bx.top+12)+'px';
 tip.style.display='block'; applyVis(+i);
});
svg.addEventListener('mouseleave',function(){tip.style.display='none';applyVis(-1);});
svg.addEventListener('click',function(ev){
 var t=ev.target,i=t.getAttribute&&t.getAttribute('data-i');
 if(i===null||i===undefined){if(pinnedCount()){pinned={};applyVis(-1);var ss0=document.getElementById('sectorSel');if(ss0)ss0.value='';if(typeof resetQ==='function')resetQ();}return;}
 togglePin(+i);
});
document.getElementById('pinClear').addEventListener('click',function(){
 pinned={};applyVis(-1);var ss1=document.getElementById('sectorSel');if(ss1)ss1.value='';if(typeof resetQ==='function')resetQ();});
// 섹터 강조 드롭다운 — 선택 시 그 섹터 꼬리만 진하게 (기존 pin 메커니즘 재사용)
(function(){var ss=document.getElementById('sectorSel');if(!ss)return;
 var DOT={Leading:'🟢',Weakening:'🟡',Lagging:'🔴',Improving:'🔵'};
 var QORD={Leading:0,Improving:1,Weakening:2,Lagging:3};   // 초록→파랑→노랑→빨강
 D.items.map(function(it,i){var wi=+wkSlider.value,k=atWeek(it,wi);
    var q=(k>=0)?quad(it.r[k],it.m[k]):it.quad;return [it.label,i,q];})
  .sort(function(a,b){return (QORD[a[2]]-QORD[b[2]])||a[0].localeCompare(b[0],'ko');})
  .forEach(function(p){var o=document.createElement('option');o.value=p[1];
    o.textContent=(DOT[p[2]]||'⚪')+' '+p[0];ss.appendChild(o);});
 ss.addEventListener('change',function(){pinned={};resetQ();if(this.value!=='')pinned[+this.value]=1;applyVis(-1);});})();
// 사분면 필터 버튼 — 클릭 시 그 사분면 섹터만 강조 (현재 주차 기준, 토글)
var activeQ=null;
function resetQ(){activeQ=null;Array.prototype.forEach.call(document.querySelectorAll('.qbtn'),function(b){b.classList.remove('on');});}
Array.prototype.forEach.call(document.querySelectorAll('.qbtn'),function(btn){
 btn.addEventListener('click',function(){
  var q=btn.getAttribute('data-q'),ss=document.getElementById('sectorSel');if(ss)ss.value='';
  if(activeQ===q){pinned={};resetQ();applyVis(-1);return;}
  activeQ=q;pinned={};var wi=+wkSlider.value;
  D.items.forEach(function(it,i){var k=atWeek(it,wi);var iq=(k>=0)?quad(it.r[k],it.m[k]):it.quad;if(iq===q)pinned[i]=1;});
  Array.prototype.forEach.call(document.querySelectorAll('.qbtn'),function(b){b.classList.toggle('on',b.getAttribute('data-q')===q);});
  applyVis(-1);});});
tailSel.addEventListener('change',render);
wkSlider.addEventListener('input',render);
document.getElementById('lblBtn').addEventListener('click',function(){
 showLbl=!showLbl;this.className=showLbl?'on':'';render();});
document.getElementById('playBtn').addEventListener('click',function(){
 var btn=this;
 if(playing){clearInterval(playing);playing=null;btn.textContent='▶ 재생';return;}
 var start=+wkSlider.value>=+wkSlider.max?Math.max(0,allWeeks.length-27):+wkSlider.value;
 wkSlider.value=start;btn.textContent='⏸ 정지';
 playing=setInterval(function(){
  var v=+wkSlider.value;
  if(v>=+wkSlider.max){clearInterval(playing);playing=null;btn.textContent='▶ 재생';return;}
  wkSlider.value=v+1;render();},450);
 render();});
(function init(){
 document.getElementById('title').textContent=D.title;
 document.title=D.title;
 if(!Array.prototype.some.call(tailSel.options,function(o){return o.value==String(D.tail);})){
  var o=document.createElement('option');o.textContent=String(D.tail);tailSel.appendChild(o);}
 tailSel.value=String(D.tail);
 document.getElementById('meta').innerHTML=
  '기준 주: <b>'+esc(D.asof)+'</b> ('+esc(D.asofMW||'')+') 종가'+
  (D.asofProg?' <span style="color:#b45309;font-weight:700">이번 주 진행 중</span>':'')+
  ' / 벤치마크: <b>'+esc(D.bench)+'</b> / 주간, z-윈도우 '+
  D.win+'주, EMA'+D.emaSpan+' 평활 / 생성 '+esc(D.generated)+
  '<br>차트의 선이나 점을 <b>클릭하면 그 항목만 고정</b>해서 볼 수 있습니다 (여러 개 가능, 빈 곳 클릭 = 해제. 표의 행 클릭도 동일)';
 var lg=document.getElementById('legend');
 lg.innerHTML=['Leading','Weakening','Lagging','Improving'].map(function(q){
  return '<span><span class="dot" style="background:'+COL[q]+'"></span>'+q+' '+KO[q]+'</span>';
 }).join('')+'<span style="margin-left:auto">회전 방향: 대체로 시계방향 (Improving→Leading→Weakening→Lagging)</span>';
 var fx=[];
 if(D.crossings&&D.crossings.length){
  fx.push('<b>금주 사분면 이동</b>: '+D.crossings.map(function(c){
   return esc(c.label)+' '+c.from+'→'+c.to;}).join(', '));}
 if(D.excluded&&D.excluded.length){
  fx.push('제외: '+D.excluded.map(function(e){return esc(e.label)+'('+esc(e.reason)+')';}).join(', '));}
 if(D.asofProg){
  fx.push('갱신: 이번 주 포인트는 그 주의 최신 종가로 요청 때마다 갱신되며 금요일 마감 후 확정. 과거 주는 확정치.');}
 fx.push('데이터: '+esc(D.src));
 fx.push('공식: JdK RS-Ratio/Momentum 은 원식 비공개(라이선스) — 공개 표준 재구성'+
  '(주간 RS를 '+D.win+'주 롤링 z-정규화, EMA'+D.emaSpan+' 평활, 모멘텀=비율 변화율의 동일 정규화) 사용. '+
  'stockcharts 등 상용 구현과 수치가 완전히 일치하지 않을 수 있음.');
 fx.push('※ 과거 상대강도 통계이며 주가 방향 예측이나 매수/매도 권유가 아님.');
 document.getElementById('foot').innerHTML=fx.join('<br>');
 render();
})();
</script>
</body>
