<script>
const UT=JSON.parse(document.getElementById('utd').textContent);
const qlab=p=>{const[y,m]=p.split('.');return (m/3|0)+'Q'+y.slice(2);};
const pp=v=>`<span class='${v>0?'up':'dn'}'>${v>0?'+':''}${v.toFixed(1)}%p</span>`;
const SEGC=['#2660c4','#f28e2b','#2e9e5b','#8e5cc8','#c0392b','#0f6b66','#b8860b','#7f8c8d'];
// 대표 가동률 = 합계 있으면 합계, 없으면 부문 평균
function rep(e,p){const d=e.series[p];if(!d)return null;
  if(d['합계']!=null)return d['합계'];
  const vs=Object.values(d);return vs.length?vs.reduce((a,b)=>a+b,0)/vs.length:null;}
const rows=[];
for(const tk in UT){
  const e=UT[tk],ps=Object.keys(e.series).sort();
  const lastP=ps[ps.length-1],last=rep(e,lastP);
  if(last==null)continue;
  const prevP=ps[ps.length-2],prev=prevP?rep(e,prevP):null;
  const [y,m]=lastP.split('.');const yoyP=(y-1)+'.'+m;
  const yoyV=e.series[yoyP]?rep(e,yoyP):null;
  rows.push({tk,n:e.name,s:e.sector,last,lastP,qoq:prev!=null?last-prev:null,
             yoy:yoyV!=null?last-yoyV:null,np:ps.length});
}
let tip=null;
function tShow(h,ev){if(!tip){tip=document.createElement('div');tip.id='uttip';document.body.appendChild(tip);}
 tip.innerHTML=h;tip.style.display='block';
 tip.style.left=Math.min(window.innerWidth-210,ev.clientX+14)+'px';
 tip.style.top=(ev.clientY+window.scrollY+10)+'px';}
const tHide=()=>{if(tip)tip.style.display='none';};
const base=[['기업',r=>r.n],['최근',r=>qlab(r.lastP)],['가동률',r=>'<b>'+r.last.toFixed(1)+'%</b>'],
  ['QoQ',r=>r.qoq!=null?pp(r.qoq):'-'],['YoY',r=>r.yoy!=null?pp(r.yoy):'-']];
const TABS={
 yoy:{list:()=>rows.filter(r=>r.yoy!=null&&r.np>=4).sort((a,b)=>b.yoy-a.yoy).slice(0,40)},
 qoq:{list:()=>rows.filter(r=>r.qoq!=null).sort((a,b)=>b.qoq-a.qoq).slice(0,40)},
 high:{list:()=>rows.filter(r=>r.last>=90).sort((a,b)=>(b.yoy??-99)-(a.yoy??-99)).slice(0,40)},
 drop:{list:()=>rows.filter(r=>r.yoy!=null&&r.np>=4).sort((a,b)=>a.yoy-b.yoy).slice(0,40)}};
function rowTip(tk){
  const e=UT[tk],ps=Object.keys(e.series).sort().slice(-4);
  return `<b>${e.name}</b><br>`+ps.map(p=>`${qlab(p)}: ${rep(e,p).toFixed(1)}%`).join('<br>');}
function showTab(k){
  document.querySelectorAll('#tabs .tab').forEach(b=>b.classList.toggle('on',b.dataset.t===k));
  document.getElementById('tabc').innerHTML='<table><tr>'+base.map(c=>`<th>${c[0]}</th>`).join('')
    +'</tr>'+TABS[k].list().map(r=>`<tr class='rowc' data-tk='${r.tk}' onclick='show("${r.tk}")'>`
    +base.map(c=>`<td>${c[1](r)}</td>`).join('')+'</tr>').join('')+'</table>';
  document.querySelectorAll('#tabc tr.rowc').forEach(tr=>{
    tr.addEventListener('mousemove',ev=>tShow(rowTip(tr.dataset.tk),ev));
    tr.addEventListener('mouseleave',tHide);});
}
showTab('yoy');
const q=document.getElementById('q'),sug=document.getElementById('sug');
q.addEventListener('input',()=>{
  const v=q.value.trim();sug.innerHTML='';
  if(!v)return;
  const hits=rows.filter(r=>r.n.includes(v)).slice(0,12);
  sug.innerHTML=hits.map(r=>`<li onclick='show("${r.tk}")'>${r.n} <small>${r.last.toFixed(0)}%</small></li>`).join('');
});
function show(tk){
  const e=UT[tk],ps=Object.keys(e.series).sort();
  const r=rows.find(x=>x.tk===tk);
  document.getElementById('cname').textContent=`${e.name} (${tk}) — 부문별 가동률`;
  document.getElementById('cstats').innerHTML=
    `최근 ${qlab(r.lastP)} 대표 가동률 <b>${r.last.toFixed(1)}%</b> · QoQ ${r.qoq!=null?pp(r.qoq):'-'} · YoY ${r.yoy!=null?pp(r.yoy):'-'} · ${r.np}개 분기`;
  const segs=[];ps.forEach(p=>Object.keys(e.series[p]).forEach(sg=>{if(sg!=='합계'&&!segs.includes(sg))segs.push(sg);}));
  const showSegs=segs.slice(0,8);
  const W=980,H=260,L=50,B=30,T=14,R=8,n=ps.length;
  const mx=115,mn=0;
  const X=i=>L+(W-L-R)*(n===1?0.5:i/(n-1)),Y=v=>T+(H-T-B)*(1-(v-mn)/(mx-mn));
  let s=`<svg id='utsvg' viewBox='0 0 ${W} ${H}' style='width:100%;background:#fbfcfe;border:1px solid #e3e9ef;border-radius:8px'>`;
  for(const g of[25,50,75,100]){const y=Y(g);
    s+=`<line x1='${L}' y1='${y.toFixed(1)}' x2='${W-R}' y2='${y.toFixed(1)}' stroke='${g===100?'#d9c9a3':'#eef1f5'}'/>`;
    s+=`<text x='${L-4}' y='${(y+3).toFixed(1)}' font-size='9' fill='#8a94a0' text-anchor='end'>${g}%</text>`;}
  showSegs.forEach((sg,si)=>{
    const pts=ps.map((p,i)=>e.series[p][sg]!=null?`${X(i).toFixed(1)},${Y(e.series[p][sg]).toFixed(1)}`:null).filter(Boolean);
    if(pts.length<2)return;
    s+=`<polyline points='${pts.join(' ')}' fill='none' stroke='${SEGC[si%8]}' stroke-width='2'/>`;
    ps.forEach((p,i)=>{const v=e.series[p][sg];
      if(v!=null)s+=`<circle cx='${X(i).toFixed(1)}' cy='${Y(v).toFixed(1)}' r='2.4' fill='${SEGC[si%8]}'/>`;});});
  if(!showSegs.length){ // 합계/전사 단일
    const pts=ps.map((p,i)=>`${X(i).toFixed(1)},${Y(rep(e,p)).toFixed(1)}`);
    s+=`<polyline points='${pts.join(' ')}' fill='none' stroke='#2660c4' stroke-width='2'/>`;
  }
  ps.forEach((p,i)=>{if(n<=20||i%2===n%2)s+=`<text x='${X(i).toFixed(1)}' y='${H-12}' font-size='8.5' fill='#8a94a0' text-anchor='middle'>${qlab(p)}</text>`;});
  s+='</svg>';
  const lg="<p style='font-size:.75rem;color:#889;margin:6px 0 0'>"
    +(showSegs.length?showSegs.map((sg,si)=>`<span style='color:${SEGC[si%8]}'>■</span> ${sg}`).join(' · '):'전사 평균')
    +" · 마우스를 올리면 분기별 수치</p>";
  document.getElementById('chart').innerHTML=s+lg;
  const svg=document.getElementById('utsvg');
  svg.addEventListener('mousemove',ev=>{
    const rc=svg.getBoundingClientRect();
    const vx=(ev.clientX-rc.left)*W/rc.width;
    const i=Math.max(0,Math.min(n-1,Math.round(n===1?0:(vx-L)/((W-L-R)/(n-1)))));
    const p=ps[i],d=e.series[p];
    let h=`<b>${qlab(p)}</b>`;
    Object.entries(d).forEach(([sg,v])=>{const si=showSegs.indexOf(sg);
      h+=`<br><span style='color:${si>=0?SEGC[si%8]:'#aab'}'>■</span> ${sg}: <b>${v.toFixed(1)}%</b>`;});
    tShow(h,ev);});
  svg.addEventListener('mouseleave',tHide);
  document.getElementById('chart').scrollIntoView({behavior:'smooth',block:'center'});
}
</script>
