<script>
const D=JSON.parse(document.getElementById('d').textContent);
const PV=JSON.parse(document.getElementById('pv').textContent);
const NAMES=Object.keys(D);
const fmtU=v=>v>=1e9?(v/1e9).toFixed(2)+'B':v>=1e6?(v/1e6).toFixed(0)+'M':(v/1e3).toFixed(0)+'K';
const pct=v=>v==null?'-':`<span class='${v>=0?'up':'dn'}'>${v>=0?'+':''}${(v*100).toFixed(1)}%</span>`;
const last=p=>p.monthly.length?p.monthly[p.monthly.length-1]:null;
// 랭킹 (최신월 YoY 내림차순)
let SORT='yoy';
function rank(){
  const rows=NAMES.map(n=>({n,l:last(D[n]),p:PV[n]||null})).filter(x=>x.l);
  const key=x=>SORT=='pmom'?(x.p&&x.p.mom!=null?x.p.mom:-9):SORT=='pyoy'?(x.p&&x.p.yoy!=null?x.p.yoy:-9):((x.l[SORT]??-9));
  rows.sort((a,b)=>key(b)-key(a));
  let h=`<tr><th>품목 (기업)</th><th data-s='ym'>최신월</th><th data-s='mom'>수출 MoM</th><th data-s='yoy'>수출 YoY</th><th>판가</th><th style='color:#e3b04b'>잠정월</th><th data-s='pmom' style='color:#e3b04b'>잠정 MoM</th><th data-s='pyoy' style='color:#e3b04b'>잠정 YoY</th></tr>`;
  rows.forEach(({n,l,p})=>{
    h+=`<tr onclick='sel(${JSON.stringify(n)})' style='cursor:pointer'><td>${n} <small style='color:#7f8a98'>${D[n].companies||''}</small></td><td>${l.ym}</td><td>${pct(l.mom)}</td><td>${pct(l.yoy)}</td><td>${l.price?'$'+l.price.toLocaleString():'-'}</td><td>${p?p.ym.slice(2):'-'}</td><td>${p?pct(p.mom):'-'}</td><td>${p?pct(p.yoy):'-'}</td></tr>`;});
  document.getElementById('rank').innerHTML=h;
  document.querySelectorAll('#rank th[data-s]').forEach(t=>t.onclick=()=>{SORT=t.dataset.s;rank();});
}
// 사이드 리스트
let LS={key:null,dir:0};
function renderList(f){
  const q=(f||'').trim();
  let ns=NAMES.filter(n=>!q||n.includes(q)||(D[n].companies||'').includes(q));
  if(LS.dir!=0){
    const kv=n=>{const l=last(D[n]);const v=l?l[LS.key]:null;return v==null?(LS.dir==1?-1e9:1e9):v;};
    ns=ns.slice().sort((a,b)=>LS.dir==1?kv(b)-kv(a):kv(a)-kv(b));}
  const mk=LS.dir!=0?LS.key:'yoy';
  let h='';
  ns.forEach(n=>{
    const l=last(D[n]);
    h+=`<div class='it' onclick='sel(${JSON.stringify(n)})'><span>${n}</span><small>${l?pct(l[mk]):''}</small></div>`;});
  document.getElementById('list').innerHTML=h;
  document.querySelectorAll('[data-ls]').forEach(b=>{
    const on=b.dataset.ls==LS.key&&LS.dir!=0;
    b.classList.toggle('on',on);
    b.querySelector('.ar').textContent=on?(LS.dir==1?' ▼':' ▲'):'';});
}
document.querySelectorAll??0;
document.addEventListener('click',e=>{
  const b=e.target.closest('button[data-ls]');if(!b)return;
  if(LS.key!=b.dataset.ls){LS.key=b.dataset.ls;LS.dir=1;}
  else LS.dir=LS.dir==1?2:(LS.dir==2?0:1);
  renderList(document.getElementById('q').value);});
document.getElementById('q').addEventListener('input',e=>renderList(e.target.value));
// 상세 차트
let TIP=null;
function tShow(h,ev){if(!TIP){TIP=document.createElement('div');TIP.id='tip';document.body.appendChild(TIP);}
 TIP.innerHTML=h;TIP.style.display='block';TIP.style.left=Math.min(innerWidth-200,ev.clientX+14)+'px';TIP.style.top=(ev.clientY+scrollY+12)+'px';}
const tHide=()=>{if(TIP)TIP.style.display='none';};
let DRAG=null;
window.addEventListener('mouseup',ev=>{if(!DRAG)return;const d=DRAG;DRAG=null;
  if(d.wm)removeEventListener('mousemove',d.wm);d.sel.style.display='none';
  if(Math.abs(ev.clientX-d.px)<8)return;d.apply(d.i,d.near(ev.clientX),ev.clientX>d.px);});
let CUR=null,Z=null;
function sel(n){CUR=n;Z=null;
  document.querySelectorAll('.it').forEach(e=>e.classList.toggle('on',e.textContent.startsWith(n)));
  document.getElementById('rankbox').style.display='none';
  document.getElementById('detail').style.display='';
  scrollTo({top:0});
  document.getElementById('dtitle').textContent=n;
  document.getElementById('dmeta').innerHTML=`HS ${D[n].hs} · ${D[n].companies||''}`;
  drawZoom();draw();}
const W=980,H=380,L=64,R=60,T=16,B=28;
function draw(){
  const P=D[CUR].monthly;const dv=Z?P.slice(Z[0],Z[1]+1):P;
  if(dv.length<2){document.getElementById('chart').innerHTML="<p class='lg'>데이터 부족</p>";return;}
  const t0=new Date(dv[0].ym+'-01').getTime(),t1=new Date(dv[dv.length-1].ym+'-01').getTime()||t0+1;
  const X=d=>L+14+(W-L-R-14)*((new Date(d.ym+'-01').getTime()-t0)/(t1-t0||1));
  const emax=Math.max(...dv.map(d=>d.exp_usd))*1.08;
  const prices=dv.map(d=>d.price).filter(v=>v);
  const pmn=Math.min(...prices)*.9,pmx=Math.max(...prices)*1.08;
  const Yl=v=>T+(H-T-B)*(1-v/emax), Yr=v=>T+(H-T-B)*(1-(v-pmn)/(pmx-pmn||1));
  let s=`<svg id='sv' viewBox='0 0 ${W} ${H}' style='width:100%;background:#0f1216;border:1px solid #262d38;border-radius:8px;cursor:crosshair'>`;
  for(let g=0;g<=4;g++){const y=T+(H-T-B)*g/4;
    s+=`<line x1='${L}' y1='${y}' x2='${W-R}' y2='${y}' stroke='#1c232d'/>`;
    s+=`<text x='${L-6}' y='${y+4}' font-size='9.5' fill='#7f8a98' text-anchor='end'>$${fmtU(emax*(1-g/4))}</text>`;
    if(prices.length)s+=`<text x='${W-R+6}' y='${y+4}' font-size='9.5' fill='#e3b04b'>$${(pmn+(pmx-pmn)*(1-g/4)).toFixed(0)}</text>`;}
  // 수출 막대
  const bw=Math.max(2,(W-L-R-14)/dv.length*0.66);
  dv.forEach(d=>{const x=X(d)-bw/2,y=Yl(d.exp_usd);s+=`<rect x='${x.toFixed(1)}' y='${y.toFixed(1)}' width='${bw.toFixed(1)}' height='${(H-B-y).toFixed(1)}' fill='#2f6fed' opacity='.55'/>`;});
  // 판가 선
  const pp=dv.filter(d=>d.price).map(d=>[X(d),Yr(d.price)]);
  if(pp.length>1)s+=`<polyline points='${pp.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}' fill='none' stroke='#e3b04b' stroke-width='2'/>`;
  const seen=new Set();
  dv.forEach(d=>{const y=d.ym.slice(0,4);if(seen.has(y))return;seen.add(y);
    s+=`<text x='${X(d).toFixed(1)}' y='${H-10}' font-size='8.5' fill='#7f8a98' text-anchor='middle'>${d.ym.slice(2)}</text>`;});
  s+='</svg>';
  const wrap=document.getElementById('chart');wrap.innerHTML=s;
  s=`<p class='lg'><span style='color:#2f6fed'>▮</span> 월 수출액(좌) · <span style='color:#e3b04b'>―</span> 판가 $/kg(우) · 좌→우 드래그 확대 / 우→좌 축소</p>`;
  wrap.insertAdjacentHTML('beforeend',s);
  const svg=document.getElementById('sv');
  const near=px=>{const r=svg.getBoundingClientRect();const vx=(px-r.left)*W/r.width;let bd=1e18,bi=0;dv.forEach((d,i)=>{const dx=Math.abs(X(d)-vx);if(dx<bd){bd=dx;bi=i;}});return bi;};
  svg.addEventListener('mousemove',ev=>{if(DRAG)return;const d=dv[near(ev.clientX)];
    tShow(`<b>${d.ym}</b><br>수출 $${fmtU(d.exp_usd)}<br>판가 ${d.price?'$'+d.price.toLocaleString()+'/kg':'-'}<br>MoM ${pct(d.mom)} · YoY ${pct(d.yoy)}`,ev);});
  svg.addEventListener('mouseleave',tHide);
  const sbox=document.createElement('div');sbox.style.cssText='position:absolute;display:none;background:rgba(47,111,237,.2);border:1px solid #2f6fed;pointer-events:none;top:0';wrap.appendChild(sbox);
  svg.addEventListener('mousedown',ev=>{ev.preventDefault();tHide();const r=svg.getBoundingClientRect();
    const wm=e=>{const x0=Math.max(0,Math.min(ev.clientX,e.clientX)-r.left),x1=Math.min(r.width,Math.max(ev.clientX,e.clientX)-r.left);sbox.style.display='block';sbox.style.left=x0+'px';sbox.style.width=Math.max(0,x1-x0)+'px';sbox.style.height=r.height+'px';};
    addEventListener('mousemove',wm);
    DRAG={px:ev.clientX,i:near(ev.clientX),near,sel:sbox,wm,apply:(i0,i1,zin)=>{const off=Z?Z[0]:0;
      if(zin){const a=off+Math.min(i0,i1),b=off+Math.max(i0,i1);if(b-a>=1){Z=[a,b];draw();}}
      else{if(!Z)return;const sp=Z[1]-Z[0],c=(Z[0]+Z[1])>>1,ns=Math.min(P.length-1,sp*2||6);let a=Math.max(0,c-(ns>>1)),b=Math.min(P.length-1,a+ns);Z=(a===0&&b===P.length-1)?null:[a,b];draw();}}};});
}

  [['전체',1e5],['5Y',60],['3Y',36],['1Y',12]].forEach(([lbl,mm],bi)=>{

    b.onclick=()=>{z.querySelectorAll('.zb').forEach(x=>x.classList.remove('on'));b.classList.add('on');
      const P=D[CUR].monthly;Z=mm>=1e5?null:[Math.max(0,P.length-mm),P.length-1];draw();};
    z.appendChild(b);});}
