<script>
const D=JSON.parse(document.getElementById('drd').textContent);
const GRP={dram:["DDR5 16Gb","DDR5 16Gb eTT","DDR4 16Gb","DDR4 8Gb","DDR4 8Gb eTT"],
           nand:["NAND 512Gb TLC","NAND 256Gb TLC","NAND 128Gb TLC"]};
const LC={"DDR5 16Gb":"#990f3d","DDR5 16Gb eTT":"#c9748f","DDR4 16Gb":"#0f5499","DDR4 8Gb":"#5b8db8","DDR4 8Gb eTT":"#9dbdd4","NAND 512Gb TLC":"#008b6f","NAND 256Gb TLC":"#4aa88f","NAND 128Gb TLC":"#8cc6b3"};
const days=Object.keys(D).sort();
let GK='dram',VMODE='line',TIP=null;
const val=(d,k)=>(D[d]||{})[k];
// KPI: 전 품목 최신 + 30일 변화
let kh='';
[...GRP.dram,...GRP.nand].forEach(k=>{
  const gd=days.filter(d=>val(d,k)!=null);
  if(!gd.length)return;
  const v=val(gd[gd.length-1],k), pv=val(gd[Math.max(0,gd.length-31)],k);
  const chg=pv?((v/pv-1)*100):null;
  kh+=`<div class='kpi'><small>${k}</small><b>$${v}</b> <span class='n ${chg>=0?"up":"dn"}'>${chg!=null?(chg>=0?'+':'')+chg.toFixed(1)+'% /30d':''}</span></div>`;});
document.getElementById('kpis').innerHTML=kh;
function tShow(h,ev){if(!TIP){TIP=document.createElement('div');TIP.id='drtip';document.body.appendChild(TIP);}
 TIP.innerHTML=h;TIP.style.display='block';
 TIP.style.left=Math.min(window.innerWidth-230,ev.clientX+14)+'px';
 TIP.style.top=(ev.clientY+window.scrollY+10)+'px';}
const tHide=()=>{if(TIP)TIP.style.display='none';};
const W=980,H=360,L=52,B=34,T=14,R=20,RL=168;
function draw(){
  if(VMODE==='table'){tableView();return;}
  const ks=GRP[GK];
  const ds=days.filter(d=>ks.some(k=>val(d,k)!=null));
  if(!ds.length){document.getElementById('chart').innerHTML='<p class=lg>데이터 없음</p>';return;}
  const t0=new Date(ds[0]).getTime(), t1=new Date(ds[ds.length-1]).getTime()||t0+1;
  const X=d=>L+14+(W-L-RL-28)*((new Date(d).getTime()-t0)/(t1-t0||1));
  let mx=0;ds.forEach(d=>ks.forEach(k=>{const v=val(d,k);if(v&&v>mx)mx=v;}));
  mx*=1.08;
  const Y=v=>T+(H-T-B)*(1-v/mx);
  let s=`<svg id='drsvg' viewBox='0 0 ${W} ${H}' style='width:100%;background:#f6f8fb;border:1px solid #d9e0e8;border-radius:8px'>`;
  for(let g=1;g<=4;g++){const y=T+(H-T-B)*g/4;
    s+=`<line x1='${L}' y1='${y}' x2='${W-RL}' y2='${y}' stroke='#e2e7ed'/>`;
    s+=`<text x='${L-6}' y='${T+(H-T-B)*(1-g/4)+4}' font-size='9' fill='#8a94a0' text-anchor='end'>$${(mx*g/4).toFixed(1)}</text>`;}
  const ends=[];
  ks.forEach(k=>{
    const pts=ds.map(d=>{const v=val(d,k);return v!=null?[X(d),Y(v),v]:null;}).filter(Boolean);
    if(!pts.length)return;
    if(pts.length>1)s+=`<polyline points='${pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}' fill='none' stroke='${LC[k]}' stroke-width='2'/>`;
    const e=pts[pts.length-1];
    s+=`<circle cx='${e[0].toFixed(1)}' cy='${e[1].toFixed(1)}' r='3.2' fill='${LC[k]}'/>`;
    ends.push([e[1],k,e[2]]);});
  ends.sort((a,b)=>a[0]-b[0]);
  for(let i=1;i<ends.length;i++)if(ends[i][0]-ends[i-1][0]<14)ends[i][0]=ends[i-1][0]+14;
  ends.forEach(([y,k,v])=>{
    s+=`<text x='${W-RL+10}' y='${(y+4).toFixed(1)}' font-size='11' fill='${LC[k]}' font-weight='700'>${k.replace(' TLC','')} $${v}</text>`;});
  const seen=new Set();
  let lastLX=-99;
  ds.forEach(d=>{const ym=d.slice(0,7);if(seen.has(ym))return;seen.add(ym);
    const x=X(d);
    if(x-lastLX<46)return;
    lastLX=x;
    s+=`<text x='${x.toFixed(1)}' y='${H-12}' font-size='8.5' fill='#8a94a0' text-anchor='middle'>${ym.slice(2).replace('-','.')}</text>`;});
  s+='</svg>';
  document.getElementById('chart').innerHTML=s+"<p class='lg'>현물 세션 평균가 ($/칩) · DRAMeXchange + Wayback 백필</p>";
  const svg=document.getElementById('drsvg');
  svg.addEventListener('mousemove',ev=>{
    const rc=svg.getBoundingClientRect();
    const vx=(ev.clientX-rc.left)*W/rc.width;
    let bd=1e18,bx=null;
    ds.forEach(d=>{const dx=Math.abs(X(d)-vx);if(dx<bd){bd=dx;bx=d;}});
    if(!bx)return;
    let h=`<b>${bx}</b>`;
    ks.forEach(k=>{const v=val(bx,k);if(v!=null)h+=`<br><span style='color:${LC[k]}'>●</span> ${k}: $${v}`;});
    tShow(h,ev);});
  svg.addEventListener('mouseleave',tHide);
}
function setGrp(g){GK=g;VMODE='line';
  document.getElementById('gdram').classList.toggle('on',g==='dram');
  document.getElementById('gnand').classList.toggle('on',g==='nand');
  document.getElementById('vbtn').textContent='🔢 표로 보기';draw();}
function tableView(){
  const ks=[...GRP.dram,...GRP.nand];
  const ds=[...days].reverse().slice(0,120);
  let h="<div class='tblwrap'><table><tr><th>날짜</th>"+ks.map(k=>`<th>${k}</th>`).join('')+"</tr>";
  ds.forEach(d=>{h+=`<tr><td>${d}</td>`+ks.map(k=>{const v=val(d,k);
    return `<td>${v!=null?'$'+v:'-'}</td>`;}).join('')+`</tr>`;});
  h+="</table><p class='lg'>최근 120일</p></div>";
  document.getElementById('chart').innerHTML=h;
}
function toggleView(){VMODE=VMODE==='table'?'line':'table';
  document.getElementById('vbtn').textContent=VMODE==='table'?'📈 차트로 보기':'🔢 표로 보기';draw();}
async function chartPng(){
  const svg=document.getElementById('drsvg');if(!svg)return null;
  const xml=new XMLSerializer().serializeToString(svg);
  const img=new Image();
  await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;
    img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(xml);});
  const S=2,TH=36;
  const cv=document.createElement('canvas');cv.width=W*S;cv.height=(H+TH)*S;
  const cx=cv.getContext('2d');cx.scale(S,S);
  cx.fillStyle='#ffffff';cx.fillRect(0,0,W,H+TH);
  cx.fillStyle='#232b34';cx.font="700 15px 'Apple SD Gothic Neo',sans-serif";
  cx.fillText((GK==='dram'?'DRAM':'NAND')+' 현물가 ($) — '+days[days.length-1],14,23);
  cx.drawImage(img,0,TH,W,H);
  return new Promise(r=>cv.toBlob(r,'image/png'));
}
async function copyChart(ev){
  const b=await chartPng();if(!b)return;const btn=ev.target;
  try{await navigator.clipboard.write([new ClipboardItem({'image/png':b})]);btn.textContent='✓';}
  catch(e){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='dram_spot.png';a.click();btn.textContent='⬇';}
  setTimeout(()=>btn.textContent='📷 복사',1500);
}
async function dlChart(){const b=await chartPng();if(!b)return;
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='dram_spot.png';a.click();}
draw();
</script>
