<script>
const S=JSON.parse(document.getElementById('d').textContent);
let SRC='energytrend', CUR=null;
const CATORD=['폴리실리콘','웨이퍼','셀','모듈','프로젝트','PV유리','잉곳','기타'];
const pct=v=>v==null?'-':`<span class='${v>0?'up':v<0?'dn':'fl'}'>${v>0?'+':''}${v.toFixed(1)}%</span>`;
// 탭 (소스)
const tabs=document.getElementById('tabs');
[['energytrend','EnergyTrend'],['infolink','InfoLink'],['sunsirs','폴리실리콘 일별']].forEach(([k,lbl],i)=>{
  if(!S[k]||!Object.keys(S[k]).length)return;
  const b=document.createElement('button');b.className='tab'+(i===0?' on':'');b.textContent=lbl;
  b.onclick=()=>{SRC=k;tabs.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');render();};
  tabs.appendChild(b);});
// 밸류체인 요약 카드 (대표 품목: 카테고리별 최신 avg)
function chainCards(){
  const items=S[SRC];const byCat={};
  Object.entries(items).forEach(([nm,o])=>{if(!o.pts.length)return;
    (byCat[o.cat]=byCat[o.cat]||[]).push([nm,o]);});
  let h='';
  CATORD.filter(c=>byCat[c]).forEach(c=>{
    // 대표 = 그 카테고리 첫 품목
    const [nm,o]=byCat[c][0];const last=o.pts[o.pts.length-1];
    h+=`<div class='cc' onclick='sel(${JSON.stringify(nm)})' style='cursor:pointer'><small><span class='cat'>${c}</span></small>`+
       `<b>${last.avg} <span style='font-size:.7rem;color:#8ba295'>${o.cur}</span></b>`+
       `<div class='n'>${pct(last.chg)} · ${nm.slice(0,22)}</div></div>`;});
  document.getElementById('chain').innerHTML=h;
}
// 사이드 리스트 (카테고리 정렬)
function renderList(){
  const items=S[SRC];
  const arr=Object.entries(items).sort((a,b)=>CATORD.indexOf(a[1].cat)-CATORD.indexOf(b[1].cat)||a[0].localeCompare(b[0]));
  let h='',lastCat='';
  arr.forEach(([nm,o])=>{
    if(o.cat!==lastCat){h+=`<div style='color:#7fbf8f;font-size:.7rem;font-weight:700;padding:6px 9px 2px'>${o.cat}</div>`;lastCat=o.cat;}
    const last=o.pts[o.pts.length-1];
    h+=`<div class='it' onclick='sel(${JSON.stringify(nm)})'><span>${nm.slice(0,30)}</span><small>${last?pct(last.chg):''}</small></div>`;});
  document.getElementById('list').innerHTML=h;
}
function render(){chainCards();renderList();if(CUR&&!S[SRC][CUR])CUR=null;if(CUR)sel(CUR);}
// 차트
let TIP=null;
function tShow(h,ev){if(!TIP){TIP=document.createElement('div');TIP.id='tip';document.body.appendChild(TIP);}
 TIP.innerHTML=h;TIP.style.display='block';TIP.style.left=Math.min(innerWidth-190,ev.clientX+14)+'px';TIP.style.top=(ev.clientY+scrollY+12)+'px';}
const tHide=()=>{if(TIP)TIP.style.display='none';};
let DRAG=null;
window.addEventListener('mouseup',ev=>{if(!DRAG)return;const d=DRAG;DRAG=null;
  if(d.wm)removeEventListener('mousemove',d.wm);d.sel.style.display='none';
  if(Math.abs(ev.clientX-d.px)<8)return;d.apply(d.i,d.near(ev.clientX),ev.clientX>d.px);});
let Z=null;
function sel(nm){CUR=nm;Z=null;const o=S[SRC][nm];if(!o)return;
  document.querySelectorAll('.it').forEach(e=>e.classList.toggle('on',e.textContent.startsWith(nm.slice(0,30))));
  document.getElementById('ptitle').textContent=nm;
  document.getElementById('pmeta').innerHTML=`<span class='cat'>${o.cat}</span> · ${o.cur} · ${o.pts.length}주`;
  drawZoom();draw();}
const W=980,H=360,L=56,R=20,T=16,B=28;
function draw(){
  const o=S[SRC][CUR];const P=o.pts;const dv=Z?P.slice(Z[0],Z[1]+1):P;
  if(dv.length<2){document.getElementById('chart').innerHTML="<p class='lg'>데이터 부족 (1주치만 존재 — Wayback 복원/누적 시 추이 생성)</p>";return;}
  const t0=new Date(dv[0].d).getTime(),t1=new Date(dv[dv.length-1].d).getTime()||t0+1;
  const X=d=>L+12+(W-L-R-12)*((new Date(d.d).getTime()-t0)/(t1-t0||1));
  const vs=dv.map(p=>p.avg);const mn=Math.min(...vs)*0.96,mx=Math.max(...vs)*1.04;
  const Y=v=>T+(H-T-B)*(1-(v-mn)/(mx-mn||1));
  let s=`<svg id='sv' viewBox='0 0 ${W} ${H}' style='width:100%;background:#0f1310;border:1px solid #2a3830;border-radius:8px;cursor:crosshair'>`;
  for(let g=0;g<=4;g++){const v=mn+(mx-mn)*g/4,y=Y(v);
    s+=`<line x1='${L}' y1='${y.toFixed(0)}' x2='${W-R}' y2='${y.toFixed(0)}' stroke='#1c261f'/>`;
    s+=`<text x='${L-6}' y='${(y+4).toFixed(0)}' font-size='9.5' fill='#7f9488' text-anchor='end'>${v.toFixed(2)}</text>`;}
  const pts=dv.map(p=>[X(p),Y(p.avg)]);
  s+=`<polyline points='${pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}' fill='none' stroke='#f5b301' stroke-width='2.2'/>`;
  if(pts.length<40)pts.forEach(p=>{s+=`<circle cx='${p[0].toFixed(1)}' cy='${p[1].toFixed(1)}' r='2.5' fill='#f5b301'/>`;});
  const seen=new Set();
  dv.forEach(p=>{const ym=p.d.slice(0,7);if(seen.has(ym))return;seen.add(ym);
    if(dv.length>60&&(+ym.slice(5))%3!==1)return;
    s+=`<text x='${X(p).toFixed(1)}' y='${H-10}' font-size='8.5' fill='#7f9488' text-anchor='middle'>${ym.slice(2)}</text>`;});
  s+='</svg>';
  const wrap=document.getElementById('chart');wrap.innerHTML=s;
  wrap.insertAdjacentHTML('beforeend',`<p class='lg'>평균 스팟가격 (${o.cur}) · 좌→우 드래그 확대 / 우→좌 축소</p>`);
  const svg=document.getElementById('sv');
  const near=px=>{const r=svg.getBoundingClientRect();const vx=(px-r.left)*W/r.width;let bd=1e18,bi=0;dv.forEach((p,i)=>{const dx=Math.abs(X(p)-vx);if(dx<bd){bd=dx;bi=i;}});return bi;};
  svg.addEventListener('mousemove',ev=>{if(DRAG)return;const p=dv[near(ev.clientX)];
    tShow(`<b>${p.d}</b><br>평균 ${p.avg} ${o.cur}<br>주간 ${pct(p.chg)}`,ev);});
  svg.addEventListener('mouseleave',tHide);
  const sb=document.createElement('div');sb.style.cssText='position:absolute;display:none;background:rgba(245,179,1,.18);border:1px solid #f5b301;pointer-events:none;top:0';wrap.appendChild(sb);
  svg.addEventListener('mousedown',ev=>{ev.preventDefault();tHide();const r=svg.getBoundingClientRect();
    const wm=e=>{const x0=Math.max(0,Math.min(ev.clientX,e.clientX)-r.left),x1=Math.min(r.width,Math.max(ev.clientX,e.clientX)-r.left);sb.style.display='block';sb.style.left=x0+'px';sb.style.width=Math.max(0,x1-x0)+'px';sb.style.height=r.height+'px';};
    addEventListener('mousemove',wm);
    DRAG={px:ev.clientX,i:near(ev.clientX),near,sel:sb,wm,apply:(i0,i1,zin)=>{const off=Z?Z[0]:0;
      if(zin){const a=off+Math.min(i0,i1),b=off+Math.max(i0,i1);if(b-a>=1){Z=[a,b];draw();}}
      else{if(!Z)return;const sp=Z[1]-Z[0],c=(Z[0]+Z[1])>>1,ns=Math.min(P.length-1,sp*2||6);let a=Math.max(0,c-(ns>>1)),b=Math.min(P.length-1,a+ns);Z=(a===0&&b===P.length-1)?null:[a,b];draw();}}};});
}
function drawZoom(){const z=document.getElementById('zoom');z.innerHTML='';
  [['전체',1e5],['2Y',730],['1Y',365],['6M',182],['3M',91]].forEach(([lbl,dd],bi)=>{
    const b=document.createElement('button');b.className='zb'+(bi===0?' on':'');b.textContent=lbl;
    b.onclick=()=>{z.querySelectorAll('.zb').forEach(x=>x.classList.remove('on'));b.classList.add('on');
      const P=S[SRC][CUR].pts;const cut=new Date(Date.now()-dd*864e5).toISOString().slice(0,10);
      const a=P.findIndex(p=>p.d>=cut);Z=(dd>=1e5||a<=0)?null:[a,P.length-1];draw();};
    z.appendChild(b);});}
