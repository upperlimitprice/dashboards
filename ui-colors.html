<!doctype html><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'>
<title>메인 테마 × 누적막대 색상 시안 10종</title>
<style>
body{font-family:'Apple SD Gothic Neo',sans-serif;background:#e9ecef;color:#1c2530;margin:0}
.wrap{max-width:1160px;margin:0 auto;padding:20px 16px}
h1{font-size:1.25rem;margin:6px 0 2px}
.sub{color:#667;font-size:.8rem;margin:0 0 16px}
.opt{border-radius:16px;margin:0 0 22px;overflow:hidden;border:1px solid #c8d0d8;box-shadow:0 2px 10px rgba(20,30,45,.06)}
.head{display:flex;align-items:baseline;gap:10px;padding:12px 18px;background:#fff;border-bottom:1px solid #e2e7ec}
.num{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:#243a52;color:#fff;font-weight:700;font-size:.95rem;flex:none;align-self:center}
.head b{font-size:1.02rem}
.head small{color:#667;font-size:.78rem}
.mock{padding:22px 24px 18px}
.mtitle{font-size:1.02rem;font-weight:700;margin:0 0 3px}
.msub{font-size:.68rem;margin:0 0 12px}
.kpis{display:flex;gap:10px;margin:0 0 12px;flex-wrap:wrap}
.kpi{border-radius:11px;padding:9px 14px;min-width:128px}
.kpi small{display:block;font-size:.63rem;margin-bottom:2px}
.kpi b{font-size:.98rem}
.chartbox{border-radius:12px;padding:12px 14px 8px}
.lg{font-size:.68rem;margin-top:6px;line-height:1.8}
.sw{display:flex;gap:5px;margin-top:10px}
.sw i{width:38px;height:16px;border-radius:4px;display:block}
svg{display:block;width:100%}
</style>
<div class='wrap'>
<h1>🎨 메인 테마 × 누적막대 색상 — 시안 10종</h1>
<p class='sub'>페이지 배경·카드·글자 톤(메인 색 체계)과 막대 팔레트를 함께 바꾼 조합입니다 · 각 시안은 실제 트래커 페이지 축소 목업 · 번호로 선택 (라이트 1~5 · 다크 6~10)</p>
<div id='opts'></div>
</div>
<script>
const THEMES=[
 {n:1,t:'클래식 라이트 (현행 골격) × 모던 커머셜',d:'현행 회백 배경 유지, 막대만 정돈된 비즈니스 톤으로',
  bg:'#f4f6f8',card:'#ffffff',bd:'#ccd5dd',tx:'#1c2530',dim:'#66727f',acc:'#243a52',kpi:'#ffffff',
  bars:['#3B6FB6','#E8873A','#3FA07A','#8B6BC7','#D8556B','#2FA3B8','#C9A227','#808FB3'],grid:'#e8edf2'},
 {n:2,t:'아이보리 페이퍼 × 딥 주얼',d:'따뜻한 종이 질감 배경 + 묵직한 보석 톤 — 증권사 지면 리포트 감성',
  bg:'#f6f2ea',card:'#fffdf8',bd:'#ddd3c2',tx:'#2a2620',dim:'#8a8171',acc:'#7a4a21',kpi:'#fbf7ef',
  bars:['#2B62A8','#C46A2E','#288A5B','#6E4FA3','#A83A4E','#188EA6','#9A7B1E','#5C6B7A'],grid:'#eee7da'},
 {n:3,t:'쿨 그레이 스튜디오 × 노르딕 뮤트',d:'차분한 청회색 배경 + 저채도 파스텔 — 눈이 가장 편한 조합',
  bg:'#eceff3',card:'#f9fafc',bd:'#c9d2dc',tx:'#232b34',dim:'#75818e',acc:'#3d5a80',kpi:'#f2f5f8',
  bars:['#5E86C2','#DE8B4B','#6BAE78','#9F7EC4','#D26F82','#4FA3B2','#BFA84A','#98A2AE'],grid:'#e2e7ed'},
 {n:4,t:'퓨어 화이트 하이컨트라스트 × 볼드 프라이머리',d:'순백 배경 + 가는 검정 테두리 + 선명한 원색 — 신문 인포그래픽 스타일',
  bg:'#ffffff',card:'#ffffff',bd:'#222831',tx:'#111417',dim:'#5c6570',acc:'#111417',kpi:'#f7f8f9',
  bars:['#1560BD','#F2790F','#0F8A4C','#7D3AC1','#D7263D','#0FA3B1','#B8860B','#6C757D'],grid:'#eceff1'},
 {n:5,t:'세이지 그린 톤 × 어스 팔레트',d:'옅은 세이지 배경 + 그린 액센트 + 흙·숲 계열 막대 — 차분한 자연 톤',
  bg:'#f0f4ef',card:'#fbfdfa',bd:'#c8d5c6',tx:'#22302a',dim:'#6f7f74',acc:'#2e6b4f',kpi:'#f4f8f3',
  bars:['#2E6B4F','#C97B3D','#5B8FA8','#8A6BB1','#B5484D','#6FA35E','#B0902E','#7C8B85'],grid:'#e4ebe3'},
 {n:6,t:'미드나잇 네이비 (VS 현행) × 소프트 비비드',d:'현행 VS 리포트 다크 골격, 막대는 다크에서 또렷한 소프트 비비드',
  bg:'#12141d',card:'#1b1e29',bd:'#2c3143',tx:'#e8ecf3',dim:'#9aa5b8',acc:'#5b9bff',kpi:'#1f2330',
  bars:['#5B9BFF','#F2A45C','#43C98A','#A58BF2','#FF6B5E','#57C7D4','#D4B106','#8B95AB'],grid:'#242a3c'},
 {n:7,t:'딥 오션 블루 × 블루램프+앰버',d:'짙은 청남색 배경 + 파랑 농도 램프와 앰버 강조 — 주력 부문 강조형',
  bg:'#0d1b2a',card:'#152638',bd:'#28405a',tx:'#e6eef6',dim:'#8fa6bc',acc:'#64b5f6',kpi:'#182c40',
  bars:['#2E6DB0','#5590CE','#7FB0DF','#A9CBEA','#E8871E','#5A7CA0','#C9A227','#8C6D4F'],grid:'#1f3349'},
 {n:8,t:'차콜 터미널 × CVD-세이프 비비드',d:'무채색 차콜 + 색약 안전 표준 원색 — 트레이딩 터미널 감성',
  bg:'#17181c',card:'#1f2126',bd:'#33363d',tx:'#e9eaec',dim:'#9a9fa8',acc:'#e0a526',kpi:'#24262c',
  bars:['#3D9BE9','#E69F00','#00B884','#E37DB4','#F1602D','#7BC8F0','#D0B62E','#9B8974'],grid:'#292b31'},
 {n:9,t:'다크 그린 포레스트 × 웜 콘트라스트',d:'짙은 녹색 기운 다크 + 따뜻한 대비 막대 — 블룸버그 단말기 무드',
  bg:'#101714',card:'#182019',bd:'#2b3a2e',tx:'#e7efe9',dim:'#93a698',acc:'#57c98a',kpi:'#1d2a20',
  bars:['#57C98A','#E8A13C','#5B9BD5','#C77FB8','#E06055','#3FB8AF','#C9C34A','#8FA08F'],grid:'#223026'},
 {n:10,t:'소프트 슬레이트 × 뮤트 파스텔 (다크 저자극)',d:'중간 명도 슬레이트 + 뮤트 파스텔 — 다크지만 부드러운 톤',
  bg:'#22262f',card:'#2a2f3a',bd:'#3b4250',tx:'#e5e9f0',dim:'#a5aebc',acc:'#8fb4e3',kpi:'#2f3541',
  bars:['#8FB4E3','#E3A878','#93C79B','#B99FDB','#DE8E9B','#7FC4CE','#CFC078','#9AA3B2'],grid:'#333947'},
];
const SEG=['상선','해양 및 특수선','플랜트','E&I','EP 및 특수선','기타'];
const D=[];for(let i=0;i<14;i++){const b=180000+i*9500;
  D.push([b*(0.60+0.10*Math.sin(i/3)),b*0.24,i>7?b*0.05:0,i<9?b*0.03:0,i>11?b*0.22:0,b*0.012]);}
const QL=[];for(let y=23;y<=26;y++)for(let k=1;k<=4;k++)QL.push(k+'Q'+y);
function stack(th){
  const W=920,H=210,L=46,R=10,T=10,B=24,n=D.length;
  const tots=D.map(r=>r.reduce((a,b)=>a+b,0)),mx=Math.max(...tots)*1.08;
  const X=i=>L+(W-L-R)*(i+0.5)/n,bw=(W-L-R)/n*0.62;
  let s=`<svg viewBox='0 0 ${W} ${H}'>`;
  for(let g=0;g<=3;g++){const y=T+(H-T-B)*g/3;
    s+=`<line x1='${L}' y1='${y}' x2='${W-R}' y2='${y}' stroke='${th.grid}'/>`;
    s+=`<text x='${L-6}' y='${y+3}' font-size='9' fill='${th.dim}' text-anchor='end'>${Math.round(mx*(1-g/3)/10000)}조</text>`;}
  D.forEach((row,i)=>{let y0=H-B;
    row.forEach((v,si)=>{if(!v)return;const hp=(H-T-B)*v/mx;y0-=hp;
      s+=`<rect x='${(X(i)-bw/2).toFixed(1)}' y='${y0.toFixed(1)}' width='${bw.toFixed(1)}' height='${Math.max(0,hp-0.7).toFixed(1)}' fill='${th.bars[si]}' rx='0.5'/>`;});});
  QL.slice(0,n).forEach((q,i)=>{const last=i===n-1;
    s+=`<text x='${X(i).toFixed(1)}' y='${H-8}' font-size='${last?9:8.5}' font-weight='${last?700:400}' fill='${last?th.tx:th.dim}' text-anchor='middle'>${q}</text>`;});
  return s+'</svg>';
}
document.getElementById('opts').innerHTML=THEMES.map(th=>{
  const kpi=(lb,v,dl,up)=>`<div class='kpi' style='background:${th.kpi};border:1px solid ${th.bd}'>
    <small style='color:${th.dim}'>${lb}</small><b style='color:${th.tx}'>${v}</b>
    <span style='font-size:.66rem;color:${up?"#e05c50":"#4b8ce0"}'> ${dl}</span></div>`;
  return `<div class='opt'>
  <div class='head'><span class='num'>${th.n}</span><b>${th.t}</b><small>${th.d}</small></div>
  <div class='mock' style='background:${th.bg}'>
    <p class='mtitle' style='color:${th.tx}'>📋 수주잔고 트래커</p>
    <p class='msub' style='color:${th.dim}'>기준 2026-08-12 · DART 정기보고서 전수 파싱 · 분기말 수주잔고, 억원</p>
    <div class='kpis'>
      ${kpi('2Q26 잔고 (QoQ)','35.4조','+2.1조',true)}
      ${kpi('신규수주 추정','4.8조','−0.6조',false)}
      ${kpi('잔고/매출 커버리지','2.9x','+0.2x',true)}
    </div>
    <div class='chartbox' style='background:${th.card};border:1px solid ${th.bd}'>
      ${stack(th)}
      <div class='lg' style='color:${th.dim}'>${SEG.map((sg,i)=>`<span style='color:${th.bars[i]}'>■</span> ${sg}`).join(' · ')}</div>
    </div>
    <div class='sw'>${th.bars.map(c=>`<i style='background:${c}'></i>`).join('')}</div>
  </div></div>`;}).join('');
</script>
