<script>
const D=JSON.parse(document.getElementById('grd').textContent);
const GPUS=["H100 SXM","H200","B200","B300","A100 SXM4","RTX 4090","RTX 5090"];
const LC={"H100 SXM":"#3d5a80","H200":"#C0455C","B200":"#C99239","B300":"#8a5fbf","A100 SXM4":"#6BAE78","RTX 4090":"#9F7EC4","RTX 5090":"#4FA3B2"};
const days=Object.keys(D).sort();
const v5=(d,g)=>((D[d]||{}).v5||{})[g];
const lastD=[...days].reverse().find(d=>D[d].v5);
let kh='';
GPUS.forEach(g=>{const v=v5(lastD,g);if(v==null)return;
  const past=[...days].filter(d=>d<=lastD&&D[d].v5).slice(-31)[0];
  const pv=v5(past,g);
  const chg=pv?((v/pv-1)*100):null;
  kh+=`<div class='kpi'><small>${g}</small><b>$${v}</b> <span class='n'>${chg!=null?(chg>=0?'+':'')+chg.toFixed(1)+'% /30d':''}</span></div>`;});
const lastAny=D[days[days.length-1]];
if(lastAny.sd)kh+=`<div class='kpi'><small>Silicon Data H100 지수</small><b>$${lastAny.sd}</b></div>`;
if(lastAny.fab)kh+=`<div class='kpi'><small>fabryka 정규화 지수</small><b>$${lastAny.fab}</b></div>`;
document.getElementById('kpis').innerHTML=kh;
let VMODE='line',TIP=null;
function tShow(h,ev){if(!TIP){TIP=document.createElement('div');TIP.id='grtip';document.body.appendChild(TIP);}
 TIP.innerHTML=h;TIP.style.display='block';
 TIP.style.left=Math.min(window.innerWidth-230,ev.clientX+14)+'px';
 TIP.style.top=(ev.clientY+window.scrollY+10)+'px';}
const tHide=()=>{if(TIP)TIP.style.display='none';};
const W=980,H=360,L=52,B=34,T=14,R=20;
function frame(mx){
  let s=`<svg id='grsvg' viewBox='0 0 ${W} ${H}' style='width:100%;background:#f6f8fb;border:1px solid #d9e0e8;border-radius:8px'>`;
  for(let g=1;g<=4;g++){const y=T+(H-T-B)*g/4;
    s+=`<line x1='${L}' y1='${y}' x2='${W-R}' y2='${y}' stroke='#e2e7ed'/>`;
    s+=`<text x='${L-6}' y='${T+(H-T-B)*(1-g/4)+4}' font-size='9' fill='#8a94a0' text-anchor='end'>$${(mx*g/4).toFixed(1)}</text>`;}
  return s;
}
function legend(extra){
  return "<p class='lg'>"+GPUS.map(g=>`<span style='color:${LC[g]}'>●</span> ${g}`).join(' · ')
    +" · DC급 8GPU 노드 온디맨드 중앙값 (vast.ai/500.farm 일간 실측)"+(extra||'')+"</p>";
}
function drawLine(){
  const ds=days.filter(d=>D[d].v5);
  const t0=new Date(ds[0]).getTime(), t1=new Date(ds[ds.length-1]).getTime()||t0+1;
  const X=d=>L+18+(W-L-R-36)*((new Date(d).getTime()-t0)/(t1-t0||1));
  let mx=0;ds.forEach(d=>GPUS.forEach(g=>{const v=v5(d,g);if(v&&v>mx)mx=v;}));
  mx*=1.08;
  const Y=v=>T+(H-T-B)*(1-v/mx);
  let s=frame(mx);
  GPUS.forEach(g=>{
    const pts=ds.map(d=>{const v=v5(d,g);return v!=null?[X(d),Y(v)]:null;}).filter(Boolean);
    if(pts.length>1)s+=`<polyline points='${pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}' fill='none' stroke='${LC[g]}' stroke-width='1.8'/>`;
    else pts.forEach(p=>{s+=`<circle cx='${p[0].toFixed(1)}' cy='${p[1].toFixed(1)}' r='2.5' fill='${LC[g]}'/>`;});});
  const seen=new Set();
  ds.forEach(d=>{const ym=d.slice(0,7);if(seen.has(ym))return;seen.add(ym);
    const mo=+ym.slice(5);
    if(ds.length>400&&mo%2===0)return;
    s+=`<text x='${X(d).toFixed(1)}' y='${H-12}' font-size='8.5' fill='#8a94a0' text-anchor='middle'>${ym.slice(2).replace('-','.')}</text>`;});
  s+='</svg>';
  document.getElementById('chart').innerHTML=s+legend();
  hover(ds,X);
}
function drawBars(){
  const ds=days.filter(d=>D[d].v5);
  const wk={};
  ds.forEach(d=>{const dt=new Date(d);const mon=new Date(dt);mon.setDate(dt.getDate()-((dt.getDay()+6)%7));
    const k=mon.toISOString().slice(0,10);(wk[k]=wk[k]||[]).push(d);});
  const wks=Object.keys(wk).sort().slice(-40);
  const rows=wks.map(k=>{
    const r={d:k};
    GPUS.forEach(g=>{const vs=wk[k].map(d=>v5(d,g)).filter(v=>v!=null).sort((a,b)=>a-b);
      r[g]=vs.length?vs[vs.length>>1]:null;});
    return r;});
  let mx=0;rows.forEach(r=>GPUS.forEach(g=>{if(r[g]&&r[g]>mx)mx=r[g];}));
  mx*=1.08;
  const Y=v=>T+(H-T-B)*(1-v/mx);
  const n=rows.length,gw=(W-L-R)/n,bw=Math.max(1.5,Math.min(5,gw/(GPUS.length+1.5)));
  let s=frame(mx);
  rows.forEach((r,i)=>{
    const x0=L+gw*i+gw/2-(bw*GPUS.length+GPUS.length-1)/2;
    GPUS.forEach((g,j)=>{const v=r[g];if(v==null)return;
      s+=`<rect x='${(x0+j*(bw+1)).toFixed(1)}' y='${Y(v).toFixed(1)}' width='${bw}' height='${(H-B-Y(v)).toFixed(1)}' fill='${LC[g]}' rx='1'/>`;});
    if(i%4===0){const d=new Date(r.d);
      s+=`<text x='${(L+gw*i+gw/2).toFixed(1)}' y='${H-12}' font-size='8' fill='#8a94a0' text-anchor='middle'>${(d.getMonth()+1)}/${d.getDate()}</text>`;}});
  s+='</svg>';
  document.getElementById('chart').innerHTML=s+legend(' · 주간 중앙값(최근 40주)');
  const svg=document.getElementById('grsvg');
  svg.addEventListener('mousemove',ev=>{
    const rc=svg.getBoundingClientRect();
    const vx=(ev.clientX-rc.left)*W/rc.width;
    const i=Math.max(0,Math.min(n-1,Math.floor((vx-L)/gw)));
    const r=rows[i];
    let h=`<b>${r.d} 주</b>`;
    GPUS.forEach(g=>{if(r[g]!=null)h+=`<br><span style='color:${LC[g]}'>●</span> ${g}: $${r[g]}`;});
    tShow(h,ev);});
  svg.addEventListener('mouseleave',tHide);
}
function hover(ds,X){
  const svg=document.getElementById('grsvg');
  svg.addEventListener('mousemove',ev=>{
    const rc=svg.getBoundingClientRect();
    const vx=(ev.clientX-rc.left)*W/rc.width;
    let bd=1e18,bx=null;
    ds.forEach(d=>{const dx=Math.abs(X(d)-vx);if(dx<bd){bd=dx;bx=d;}});
    if(!bx)return;
    let h=`<b>${bx}</b>`;
    GPUS.forEach(g=>{const v=v5(bx,g);if(v!=null)h+=`<br><span style='color:${LC[g]}'>●</span> ${g}: $${v}`;});
    tShow(h,ev);});
  svg.addEventListener('mouseleave',tHide);
}
function tableView(){
  const ds=[...days].reverse().filter(d=>D[d].v5).slice(0,120);
  let h="<div class='tblwrap'><table><tr><th>날짜</th>"+GPUS.map(g=>`<th>${g}</th>`).join('')+"</tr>";
  ds.forEach(d=>{h+=`<tr><td>${d}</td>`+GPUS.map(g=>{const v=v5(d,g);
    return `<td>${v!=null?'$'+v:'-'}</td>`;}).join('')+`</tr>`;});
  h+="</table><p class='lg'>일간 중앙값 $/GPU-hr · 최근 120일</p></div>";
  document.getElementById('chart').innerHTML=h;
}
function draw(){
  if(VMODE==='table'){tableView();return;}
  if(VMODE==='bars'){drawBars();return;}
  drawLine();
}
function toggleWM(){VMODE=VMODE==='line'?'bars':'line';
  document.getElementById('wmbtn').textContent=VMODE==='line'?'📊 주간 막대로':'📈 데일리 선으로';draw();}
function toggleView(){VMODE=VMODE==='table'?'line':'table';
  document.getElementById('vbtn').textContent=VMODE==='table'?'📈 차트로 보기':'🔢 표로 보기';
  document.getElementById('wmbtn').textContent='📊 주간 막대로';draw();}
async function chartPng(){
  const svg=document.getElementById('grsvg');if(!svg)return null;
  const xml=new XMLSerializer().serializeToString(svg);
  const img=new Image();
  await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;
    img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(xml);});
  const S=2,TH=36;
  const cv=document.createElement('canvas');cv.width=W*S;cv.height=(H+TH)*S;
  const cx=cv.getContext('2d');cx.scale(S,S);
  cx.fillStyle='#ffffff';cx.fillRect(0,0,W,H+TH);
  cx.fillStyle='#232b34';cx.font="700 15px 'Apple SD Gothic Neo',sans-serif";
  cx.fillText('AI 가속기 렌탈 시세 ($/GPU-hr) — '+days[days.length-1],14,23);
  cx.drawImage(img,0,TH,W,H);
  return new Promise(r=>cv.toBlob(r,'image/png'));
}
async function copyChart(ev){
  const b=await chartPng();if(!b)return;const btn=ev.target;
  try{await navigator.clipboard.write([new ClipboardItem({'image/png':b})]);btn.textContent='✓ 복사됨';}
  catch(e){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='gpu_rent.png';a.click();btn.textContent='⬇ 저장됨';}
  setTimeout(()=>btn.textContent='📷 이미지 복사',1800);
}
async function dlChart(){const b=await chartPng();if(!b)return;
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='gpu_rent.png';a.click();}
draw();
</script>
