<title>수급 오실레이터</title>
<style>
body{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:#f4f6f8;margin:0;color:#1c2530}
.wrap{max-width:1060px;margin:0 auto;padding:28px 16px 70px}
h1{font-size:1.3rem;margin-bottom:4px} .sub{color:#67737f;font-size:.85rem}
.bar{display:flex;gap:10px;margin:18px 0;flex-wrap:wrap}
input,select{font:inherit;padding:9px 12px;border:1.5px solid #ccd5dd;border-radius:9px;background:#fff}
input{flex:1;min-width:230px}
.card{background:#fff;border:1px solid #ccd5dd;border-radius:12px;padding:16px}
.ttl{font-weight:800;font-size:1.05rem;margin-bottom:2px}
.meta{color:#67737f;font-size:.8rem;margin-bottom:8px}
.legend{font-size:.8rem;color:#444;margin-bottom:6px}
.legend b.mc{color:#111}.legend b.os{color:#c0392b}
#msg{color:#67737f;padding:30px;text-align:center}
</style>
<div class='wrap'>
<h1>📊 수급 오실레이터</h1>
<p class='sub'>시가총액(검정, 좌축) vs 수급 오실레이터(빨강, 우축) · 오실레이터 = 5일 (외국인+기관 순매수합)/시총의 MACD(12·26·9) 히스토그램 · 평일 자동 갱신</p>
<div class='bar'>
<input id='q' list='names' placeholder='종목명 또는 코드 검색 (예: 삼성전자, 005930)' autocomplete='off'>
<datalist id='names'></datalist>
<select id='per'><option value='39'>39일</option><option value='78' selected>78일 (기본)</option><option value='156'>156일</option><option value='0'>전체</option></select>
</div>
<div class='card'>
<div class='ttl' id='nm'>—</div>
<div class='meta' id='mt'>종목을 검색하세요</div>
<div class='legend'><b class='mc'>━ 시가총액</b> &nbsp; <b class='os'>━ 수급오실레이터</b> (0선 점선)</div>
<div id='chart'><div id='msg'>종목명을 입력하면 차트가 표시됩니다</div></div>
</div>
</div>
<script>
let IDX=null, cacheShard={}, cur=null;
const $=id=>document.getElementById(id);
fetch('osc/index.json').then(r=>r.json()).then(d=>{
  IDX=d;
  $('names').innerHTML=d.stocks.map(s=>`<option value="${s[1]}">${s[0]}</option>`).join('');
  $('mt').textContent=`총 ${d.stocks.length.toLocaleString()}종목 · 최신 데이터 ${fmtD(d.dates[d.dates.length-1])}`;
  $('q').value='삼성전자'; show();
});
function fmtD(d){return d.slice(0,4)+'-'+d.slice(4,6)+'-'+d.slice(6);}
function find(q){
  q=q.trim(); if(!q||!IDX) return null;
  return IDX.stocks.find(s=>s[1]===q)||IDX.stocks.find(s=>s[0]===q)
    ||IDX.stocks.find(s=>s[1].toLowerCase().includes(q.toLowerCase()));
}
async function show(){
  const hit=find($('q').value); if(!hit) return;
  const [tk,name,sh]=hit;
  if(!cacheShard[sh]) cacheShard[sh]=await fetch(`osc/s${sh}.json`).then(r=>r.json());
  cur={tk,name,rec:cacheShard[sh][tk]}; draw();
}
function draw(){
  if(!cur) return;
  const {tk,name,rec}=cur, per=+$('per').value;
  let pts=[];
  for(let i=0;i<rec.m.length;i++) if(rec.m[i]!=null)
    pts.push({d:IDX.dates[rec.s+i], m:rec.m[i], o:rec.o[i]});
  if(per>0) pts=pts.slice(-per);
  $('nm').textContent=`${name} (${tk})`;
  const lastM=pts[pts.length-1].m, lastO=pts[pts.length-1].o;
  $('mt').textContent=`${fmtD(pts[0].d)} ~ ${fmtD(pts[pts.length-1].d)} · 시총 ${lastM>=10000?(lastM/10000).toFixed(1)+'조':lastM.toLocaleString()+'억'} · 오실레이터 ${(lastO*100).toFixed(3)}%p`;
  const W=1000,H=430,L=74,R=74,T=16,B=42;
  const mv=pts.map(p=>p.m), ov=pts.map(p=>p.o);
  // 시총 축: 4등분 나이스 스케일 (1/2/2.5/5×10^n 단위로 반올림)
  const lo=Math.min(...mv), hi=Math.max(...mv);
  const rough=(hi-lo)/4||lo*0.1||1, pow=Math.pow(10,Math.floor(Math.log10(rough)));
  const step=[1,2,2.5,5,10].map(x=>x*pow).find(x=>x>=rough);
  const m0=Math.floor(lo/step)*step, m1=m0+step*Math.max(4,Math.ceil((hi-m0)/step));
  const oM=Math.max(Math.abs(Math.min(...ov)),Math.abs(Math.max(...ov)))*1.1||1e-6;
  const X=i=>L+i*(W-L-R)/Math.max(1,pts.length-1);
  // 겹침 최소화: 시총 = 상단 58% 밴드, 오실레이터 = 하단 32% 밴드로 분리
  const PH=H-T-B, mB=T+PH*0.58, oT=T+PH*0.68;
  const Ym=v=>T+(mB-T)*(1-(v-m0)/(m1-m0));
  const Yo=v=>oT+(H-B-oT)*(1-(v+oM)/(2*oM));
  let s=`<svg viewBox='0 0 ${W} ${H}' style='width:100%;background:#fff'>`;
  const nDiv=Math.round((m1-m0)/step);
  for(let k=0;k<=nDiv;k++){const v=m0+step*k,y=Ym(v);
    s+=`<line x1='${L}' y1='${y}' x2='${W-R}' y2='${y}' stroke='#eef1f4'/>`;
    s+=`<text x='${L-6}' y='${y+4}' font-size='11' fill='#67737f' text-anchor='end'>${v>=10000?(v/10000).toFixed(v>=100000?0:1)+'조':Math.round(v).toLocaleString()}</text>`;}
  for(const w of [oM,0,-oM]){const y=Yo(w);
    s+=`<line x1='${L}' y1='${y}' x2='${W-R}' y2='${y}' stroke='${w===0?'#f2c9c4':'#f7ecea'}' ${w===0?"stroke-dasharray='4 4'":''}/>`;
    s+=`<text x='${W-R+6}' y='${y+4}' font-size='11' fill='#c0392b'>${(w*100).toFixed(2)}%</text>`;}
  const st=Math.max(1,Math.floor(pts.length/8));
  for(let i=0;i<pts.length;i+=st) s+=`<text x='${X(i)}' y='${H-14}' font-size='10.5' fill='#9aa4ad' text-anchor='middle'>${pts[i].d.slice(4,6)}/${pts[i].d.slice(6)}</text>`;
  s+=`<polyline points='${pts.map((p,i)=>X(i).toFixed(1)+','+Ym(p.m).toFixed(1)).join(' ')}' fill='none' stroke='#111' stroke-width='1.9'/>`;
  s+=`<polyline points='${pts.map((p,i)=>X(i).toFixed(1)+','+Yo(p.o).toFixed(1)).join(' ')}' fill='none' stroke='#c0392b' stroke-width='1.9'/>`;
  s+='</svg>';
  $('chart').innerHTML=s;
}
$('q').addEventListener('change',show);
$('q').addEventListener('keydown',e=>{if(e.key==='Enter')show();});
$('per').addEventListener('change',draw);
</script>
