<title>수급 오실레이터</title>
<style>
body{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:#f4f6f8;margin:0;color:#1c2530}
.wrap{max-width:1060px;margin:0 auto;padding:28px 16px 70px}
h1{font-size:1.3rem;margin-bottom:4px} .sub{color:#67737f;font-size:.85rem}
.bar{display:flex;gap:10px;margin:18px 0;flex-wrap:wrap}
input,select{font:inherit;padding:9px 12px;border:1.5px solid #ccd5dd;border-radius:9px;background:#fff}
input{flex:1;min-width:230px}
.card{background:#fff;border:1px solid #ccd5dd;border-radius:12px;padding:16px}
.ttl{font-weight:800;font-size:1.05rem;margin-bottom:2px}
.meta{color:#67737f;font-size:.8rem;margin-bottom:8px}
.legend{font-size:.8rem;color:#444;margin-bottom:6px}
.legend b.mc{color:#111}.legend b.os{color:#c0392b}
#msg{color:#67737f;padding:30px;text-align:center}
.btn{font:inherit;padding:9px 14px;border:1.5px solid #1f6fd6;border-radius:9px;background:#fff;color:#1f6fd6;font-weight:700;cursor:pointer}
.btn:hover{background:#eef5fe}
#chips{margin:2px 0 6px}
.chip{display:inline-block;font-size:.7rem;color:#1f6fd6;border:1px solid #bcd6f5;border-radius:20px;padding:2px 9px;margin-right:5px;background:#f3f8ff}
#modal{position:fixed;inset:0;background:rgba(20,26,34,.45);display:none;align-items:center;justify-content:center;z-index:10}
#modal .box{background:#fff;border-radius:14px;max-width:560px;width:92%;max-height:82vh;display:flex;flex-direction:column;padding:20px}
#modal h3{margin:0 0 10px;font-size:1.05rem}
#slist{overflow-y:auto;border:1px solid #e2e8ee;border-radius:9px;padding:8px 12px;flex:1}
#slist label{display:flex;justify-content:space-between;padding:6px 2px;font-size:.88rem;cursor:pointer}
#slist small{color:#8a94a0}
#modal .foot{display:flex;justify-content:space-between;margin-top:14px}
.btn2{font:inherit;padding:9px 16px;border-radius:9px;border:1.5px solid #ccd5dd;background:#fff;cursor:pointer}
.btn2.pri{background:#1f6fd6;color:#fff;border-color:#1f6fd6;font-weight:700}
#tabs{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 4px}
.tab{font:inherit;font-size:.85rem;padding:8px 13px;border:1.5px solid #ccd5dd;border-radius:20px;background:#fff;cursor:pointer;color:#444}
.tab.on{background:#1f3b73;color:#fff;border-color:#1f3b73;font-weight:700}
.minigrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.mini{background:#fff;border:1px solid #ccd5dd;border-radius:10px;padding:10px 12px;cursor:pointer}
.mini:hover{border-color:#1f6fd6}
.mini .mh{font-size:.8rem;font-weight:700;display:flex;justify-content:space-between}
.mini .mh small{color:#8a94a0;font-weight:400}
.mini .mb{font-size:.68rem;color:#8a94a0;margin-top:2px}
</style>
<div class='wrap'>
<h1>📊 수급 오실레이터 <small id='upd' style='font-size:.72rem;font-weight:400;color:#9aa4ad'></small></h1>
<p class='sub'>시가총액(검정, 좌축) vs 수급 오실레이터(빨강, 우축) · 오실레이터 = 5일 (외국인+기관 순매수합)/시총의 MACD(12·26·9) 히스토그램 · 평일 자동 갱신</p>
<div id='tabs'>
<button class='tab on' data-t='main'>메인</button>
<button class='tab' data-t='사모펀드'>사모펀드 순매수 상위</button>
<button class='tab' data-t='투신'>투신 순매수 상위</button>
<button class='tab' data-t='연기금'>연기금 순매수 상위</button>
<button class='tab' data-t='외국인'>외국인 순매수 상위</button>
<button class='tab' data-t='sectors'>섹터별 모아보기</button>
<button class='tab' data-t='bottom'>🔻 바닥 변곡 근접</button>
</div>
<div class='bar'>
<select id='sec'><option value=''>섹터 전체</option></select>
<select id='per'><option value='30'>30일</option><option value='60'>60일</option><option value='78' selected>78일 (기본)</option><option value='120'>120일</option><option value='0'>전체</option></select>
<input id='q' list='names' placeholder='종목명 또는 코드 검색 (예: 삼성전자, 005930)' autocomplete='off'>
<datalist id='names'></datalist>
<button id='cmp' class='btn'>⚖ 섹터 비교</button>
</div>
<div class='card'>
<div class='ttl' id='nm'>—</div>
<div id='chips'></div>
<div class='meta' id='mt'>종목을 검색하세요</div>
<div class='legend'><b class='mc'>━ 시가총액</b> &nbsp; <b class='os'>━ 수급오실레이터</b> (0선 점선)</div>
<div id='chart'><div id='msg'>종목명을 입력하면 차트가 표시됩니다</div></div>
</div>
<div id='gridPage' style='display:none'>
<p class='sub' id='gridSub'></p>
<div id='grid' class='minigrid'></div>
</div>
</div>
<div id='modal'><div class='box'>
<h3>⚖ 섹터 비교 — 여러 섹터 오실레이터 한 번에 보기</h3>
<div class='sub' style='margin-bottom:8px'>비교할 섹터 선택 (최대 12개)</div>
<div id='slist'></div>
<div class='foot'><button class='btn2' onclick="document.getElementById('modal').style.display='none'">닫기</button>
<button class='btn2 pri' id='cmpGo'>비교 차트 보기</button></div>
</div></div>
<script>
let IDX=null, SEC=null, cacheShard={}, cur=null;
const $=id=>document.getElementById(id);
Promise.all([fetch('osc/index.json?v='+Date.now()).then(r=>r.json()), fetch('osc/sectors.json').then(r=>r.json())]).then(([d,sec])=>{
  IDX=d; SEC=sec;
  const wi=[],idx=[];
  sec.forEach((x,i)=>(x.c.startsWith('WI')&&!x.c.startsWith('WI0')?wi:idx).push(`<option value='${i}'>${x.n} (${x.t.length})</option>`));
  $('sec').innerHTML="<option value=''>섹터 전체</option><optgroup label='WI26 업종'>"+wi.join('')+"</optgroup><optgroup label='KRX / WISE / WMI 지수'>"+idx.join('')+"</optgroup>";
  $('slist').innerHTML=sec.map((x,i)=>`<label><span><input type='checkbox' value='${i}'> ${x.n}</span><small>(${x.t.length}종목)</small></label>`).join('');
  fillNames();
  $('mt').textContent=`총 ${d.stocks.length.toLocaleString()}종목 · ${sec.length}섹터 · 최신 데이터 ${fmtD(d.dates[d.dates.length-1])}`;
  if(d.updated) $('upd').textContent=`최종 업데이트 ${d.updated}`;
  $('q').value='삼성전자'; show();
});
function fillNames(){
  const si=$('sec').value;
  const pool=si===''?IDX.stocks:IDX.stocks.filter(s=>SEC[+si].t.includes(s[0]));
  $('names').innerHTML=pool.map(s=>`<option value="${s[1]}">${s[0]}</option>`).join('');
}
function fmtD(d){return d.slice(0,4)+'-'+d.slice(4,6)+'-'+d.slice(6);}
function find(q){
  q=q.trim(); if(!q||!IDX) return null;
  const si=$('sec').value;
  const pool=si===''?IDX.stocks:IDX.stocks.filter(s=>SEC[+si].t.includes(s[0]));
  return pool.find(s=>s[1]===q)||pool.find(s=>s[0]===q)
    ||pool.find(s=>s[1].toLowerCase().includes(q.toLowerCase()))||IDX.stocks.find(s=>s[1]===q);
}
async function show(){
  const hit=find($('q').value); if(!hit) return;
  const [tk,name,sh]=hit;
  if(!cacheShard[sh]) cacheShard[sh]=await fetch(`osc/s${sh}.json`).then(r=>r.json());
  cur={tk,name,rec:cacheShard[sh][tk]}; 
  $('chips').innerHTML=(hit[3]||[]).map(c=>{const x=SEC.find(y=>y.c===c);return x?`<span class='chip'>${x.n}</span>`:'';}).join('');
  draw();
}
function showSector(i){
  const x=SEC[i];
  cur={tk:x.c,name:x.n+' (합산)',rec:x};
  $('chips').innerHTML=`<span class='chip'>${x.t.length}종목 합산</span>`;
  draw();
}
function draw(){
  if(!cur) return;
  const {tk,name,rec}=cur, per=+$('per').value;
  let pts=[];
  for(let i=0;i<rec.m.length;i++) if(rec.m[i]!=null)
    pts.push({d:IDX.dates[rec.s+i], m:rec.m[i], o:rec.o[i]});
  if(per>0) pts=pts.slice(-per);
  $('nm').textContent=`${name} (${tk})`;
  const lastM=pts[pts.length-1].m, lastO=pts[pts.length-1].o;
  $('mt').textContent=`${fmtD(pts[0].d)} ~ ${fmtD(pts[pts.length-1].d)} · 시총 ${lastM>=10000?(lastM/10000).toFixed(1)+'조':lastM.toLocaleString()+'억'} · 오실레이터 ${(lastO*100).toFixed(3)}%p`;
  const W=1000,H=496,L=78,R=78,T=16,B=82,PH=H-T-B;
  const mv=pts.map(p=>p.m), ov=pts.map(p=>p.o);
  const nice=r=>{const p=Math.pow(10,Math.floor(Math.log10(r)));return [1,2,2.5,5,10].map(x=>x*p).find(x=>x>=r);};
  // 좌축(시총): 0부터 시작, 라운드 눈금 ~8등분 (엑셀 방식)
  const mHi=Math.max(...mv), mStep=nice(mHi/8), nDiv=Math.ceil(mHi/mStep*1.0001)+0;
  const m1=mStep*nDiv;
  // 우축(오실레이터): 라운드 눈금, 그리드 수를 좌축과 동일하게 맞춤
  const oLo=Math.min(...ov,0), oHi=Math.max(...ov,0);
  let oStep=nice(Math.max((oHi-oLo)/nDiv,1e-7));
  let o0=Math.floor(oLo/oStep)*oStep;
  while(o0+nDiv*oStep<oHi*1.0001){oStep=nice(oStep*1.01);o0=Math.floor(oLo/oStep)*oStep;}
  const o1=o0+nDiv*oStep;
  const X=i=>L+i*(W-L-R)/Math.max(1,pts.length-1);
  const Ym=v=>T+PH*(1-v/m1);
  const Yo=v=>T+PH*(1-(v-o0)/(o1-o0));
  let s=`<svg viewBox='0 0 ${W} ${H}' style='width:100%;background:#fff'>`;
  for(let k=0;k<=nDiv;k++){
    const y=T+PH*(1-k/nDiv), mvv=mStep*k, ovv=o0+oStep*k;
    s+=`<line x1='${L}' y1='${y}' x2='${W-R}' y2='${y}' stroke='#eef1f4'/>`;
    s+=`<text x='${L-6}' y='${y+4}' font-size='11' fill='#444' text-anchor='end'>${mvv>=10000?(mvv/10000).toLocaleString(undefined,{maximumFractionDigits:1})+'조':Math.round(mvv).toLocaleString()}</text>`;
    s+=`<text x='${W-R+6}' y='${y+4}' font-size='11' fill='#c0392b'>${(ovv*100).toFixed(2)}%</text>`;
  }
  if(o0<0&&o1>0) s+=`<line x1='${L}' y1='${Yo(0)}' x2='${W-R}' y2='${Yo(0)}' stroke='#c9ced4' stroke-width='.9'/>`;
  const st=Math.max(1,Math.floor(pts.length/10));
  for(let i=0;i<pts.length;i+=st) s+=`<text x='${X(i)}' y='${H-52}' font-size='10.5' fill='#67737f' text-anchor='middle' transform='rotate(-35 ${X(i)} ${H-52})'>${fmtD(pts[i].d)}</text>`;
  s+=`<polyline points='${pts.map((p,i)=>X(i).toFixed(1)+','+Ym(p.m).toFixed(1)).join(' ')}' fill='none' stroke='#333' stroke-width='3.2'/>`;
  s+=`<polyline points='${pts.map((p,i)=>X(i).toFixed(1)+','+Yo(p.o).toFixed(1)).join(' ')}' fill='none' stroke='#e30613' stroke-width='3.2'/>`;
  s+=`<text x='${W/2-40}' y='${H-8}' font-size='13' fill='#333' font-weight='700' text-anchor='end'>━ ${name} 시가총액</text>`;
  s+=`<text x='${W/2+40}' y='${H-8}' font-size='13' fill='#e30613' font-weight='700'>━ ${name} 오실레이터</text>`;
  s+='</svg>';
  $('chart').innerHTML=s;
}
let TOPS=null, BOTTOM=null;
async function loadShard(sh){
  if(!cacheShard[sh]) cacheShard[sh]=await fetch(`osc/s${sh}.json`).then(r=>r.json());
  return cacheShard[sh];
}
function miniSvg(rec,per){
  let pts=[];
  for(let i=0;i<rec.m.length;i++) if(rec.m[i]!=null) pts.push({m:rec.m[i],o:rec.o[i]});
  if(per>0)pts=pts.slice(-per);
  const W=240,H=110,T=6,B=6,PH=H-T-B;
  const mLo=Math.min(...pts.map(p=>p.m)),mHi=Math.max(...pts.map(p=>p.m));
  const oM=Math.max(...pts.map(p=>Math.abs(p.o)))||1e-6;
  const X=i=>4+i*(W-8)/Math.max(1,pts.length-1);
  const Ym=v=>T+PH*0.55*(1-(v-mLo)/((mHi-mLo)||1));
  const Yo=v=>T+PH*(1-(v+1.15*oM)/(2.3*oM));
  let sv=`<svg viewBox='0 0 ${W} ${H}' style='width:100%'>`;
  sv+=`<line x1='4' y1='${Yo(0)}' x2='${W-4}' y2='${Yo(0)}' stroke='#e8cdca' stroke-dasharray='3 3' stroke-width='.7'/>`;
  sv+=`<polyline points='${pts.map((p,i)=>X(i).toFixed(1)+','+Ym(p.m).toFixed(1)).join(' ')}' fill='none' stroke='#333' stroke-width='1.7'/>`;
  sv+=`<polyline points='${pts.map((p,i)=>X(i).toFixed(1)+','+Yo(p.o).toFixed(1)).join(' ')}' fill='none' stroke='#e30613' stroke-width='1.7'/>`;
  return sv+'</svg>';
}
async function renderGrid(kind){
  const per=+$('per').value||78;
  let items=[], sub='';
  if(kind==='sectors'){
    $('gridSub').textContent=`전체 ${SEC.length}개 섹터·지수 합산 오실레이터 — 카드를 누르면 메인 차트로 이동`;
    $('grid').innerHTML=SEC.map((x,i)=>`<div class='mini' onclick="gotoSector(${i})">
      <div class='mh'><span>${x.n}</span><small>${x.t.length}종목</small></div>
      ${miniSvg(x,per)}<div class='mb'>구성종목 시총합 · 합산 수급</div></div>`).join('');
    return;
  }
  if(kind==='bottom'){
    if(!BOTTOM) BOTTOM=await fetch('osc/bottom.json?v='+Date.now()).then(r=>r.json());
    items=BOTTOM.list.map(x=>({tk:x[0],name:x[1],meta:`바닥평균 대비 ${(x[2]*100).toFixed(0)}% · osc ${(x[3]*100).toFixed(3)}%`}));
    sub=`기준일 ${BOTTOM.date} · 오실레이터가 하락 중이며 과거 저점 변곡점 평균에 근접한 종목 (근접도순, 시총 500억+) — 카드를 누르면 메인 차트로 이동`;
  }else{
    if(!TOPS) TOPS=await fetch('osc/tops.json?v='+Date.now()).then(r=>r.json());
    items=TOPS.top[kind].map(([tk,nm],i)=>({tk,name:nm,meta:`시총대비 순매수 ${i+1}위`}));
    sub=`기준일 ${TOPS.date} · ${kind} 시총대비 순매수 Top20 (수급 페이지와 동일 기준) — 카드를 누르면 메인 차트로 이동`;
  }
  $('gridSub').textContent=sub;
  $('grid').innerHTML='<div id="msg">불러오는 중…</div>';
  const cells=[];
  for(const it of items){
    const stock=IDX.stocks.find(x=>x[0]===it.tk);
    if(!stock){continue;}
    const shd=await loadShard(stock[2]);
    const rec=shd[it.tk];
    if(!rec)continue;
    cells.push(`<div class='mini' onclick="gotoStock('${it.tk}')">
      <div class='mh'><span>${it.name}</span><small>${it.tk}</small></div>
      ${miniSvg(rec,per)}<div class='mb'>${it.meta}</div></div>`);
  }
  $('grid').innerHTML=cells.join('')||'<div id="msg">데이터 없음</div>';
}
function gotoSector(i){
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t==='main'));
  $('gridPage').style.display='none';
  document.querySelector('.card').style.display='';
  $('sec').value=String(i); fillNames(); showSector(i);
  window.scrollTo({top:0});
}
function gotoStock(tk){
  const st=IDX.stocks.find(x=>x[0]===tk);
  if(!st)return;
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t==='main'));
  $('gridPage').style.display='none';
  document.querySelector('.card').style.display='';
  $('q').value=st[1]; $('sec').value=''; fillNames(); show();
  window.scrollTo({top:0});
}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));
  const t=b.dataset.t;
  if(t==='main'){$('gridPage').style.display='none';document.querySelector('.card').style.display='';}
  else{document.querySelector('.card').style.display='none';$('gridPage').style.display='';renderGrid(t);}
}));
$('q').addEventListener('change',show);
$('q').addEventListener('keydown',e=>{if(e.key==='Enter')show();});
$('per').addEventListener('change',()=>{const t=document.querySelector('.tab.on').dataset.t;if(t!=='main')renderGrid(t);else if(cur&&cur.cmp)drawCompare(cur.cmp);else draw();});
$('sec').addEventListener('change',()=>{fillNames();if($('sec').value!=='')showSector(+$('sec').value);});
$('cmp').addEventListener('click',()=>$('modal').style.display='flex');
$('cmpGo').addEventListener('click',()=>{
  const sel=[...document.querySelectorAll('#slist input:checked')].map(e=>+e.value).slice(0,12);
  if(!sel.length)return;
  $('modal').style.display='none';
  cur={cmp:sel}; drawCompare(sel);
});
const PAL=['#1f6fd6','#e30613','#2eaa5e','#f28e2b','#8b1e3f','#00a3a3','#7048c8','#c8a400','#e91e8c','#5f6b7a','#3d8f2f','#1c2530'];
function drawCompare(sel){
  const per=+$('per').value;
  $('nm').textContent='섹터 비교 — 수급 오실레이터';
  $('chips').innerHTML=sel.map((i,k)=>`<span class='chip' style='color:${PAL[k]};border-color:${PAL[k]}'>${SEC[i].n}</span>`).join('');
  const series=sel.map(i=>{
    const x=SEC[i]; let pts=[];
    for(let j=0;j<x.m.length;j++) if(x.o[j]!=null) pts.push({d:IDX.dates[x.s+j],o:x.o[j]});
    if(per>0)pts=pts.slice(-per); return pts;
  });
  const all=series.flat();
  $('mt').textContent=`${fmtD(all[0].d)} ~ ${fmtD(all[all.length-1].d)} · ${sel.length}개 섹터 오실레이터(%)`;
  const W=1000,H=470,L=78,R=30,T=16,B=56,PH=H-T-B;
  const oLo=Math.min(...all.map(p=>p.o),0), oHi=Math.max(...all.map(p=>p.o),0);
  const nice=r=>{const p=Math.pow(10,Math.floor(Math.log10(r)));return [1,2,2.5,5,10].map(x=>x*p).find(x=>x>=r);};
  const stp=nice((oHi-oLo)/8||1e-6), o0=Math.floor(oLo/stp)*stp, o1=Math.ceil(oHi/stp)*stp;
  const nD=Math.round((o1-o0)/stp);
  const Yo=v=>T+PH*(1-(v-o0)/(o1-o0));
  const n=Math.max(...series.map(sr=>sr.length));
  const X=i=>L+i*(W-L-R)/Math.max(1,n-1);
  let s2=`<svg viewBox='0 0 ${W} ${H}' style='width:100%;background:#fff'>`;
  for(let k=0;k<=nD;k++){const v=o0+stp*k,y=Yo(v);
    s2+=`<line x1='${L}' y1='${y}' x2='${W-R}' y2='${y}' stroke='${Math.abs(v)<1e-12?'#c9ced4':'#eef1f4'}'/>`;
    s2+=`<text x='${L-6}' y='${y+4}' font-size='11' fill='#444' text-anchor='end'>${(v*100).toFixed(2)}%</text>`;}
  const base=series.reduce((a,b)=>b.length>a.length?b:a,[]);
  const st=Math.max(1,Math.floor(base.length/10));
  for(let i=0;i<base.length;i+=st) s2+=`<text x='${X(i)}' y='${H-30}' font-size='10.5' fill='#67737f' text-anchor='middle' transform='rotate(-35 ${X(i)} ${H-30})'>${fmtD(base[i].d)}</text>`;
  series.forEach((sr,k)=>{
    const off=n-sr.length;
    s2+=`<polyline points='${sr.map((p,i)=>X(i+off).toFixed(1)+','+Yo(p.o).toFixed(1)).join(' ')}' fill='none' stroke='${PAL[k]}' stroke-width='2'/>`;
  });
  s2+='</svg>';
  $('chart').innerHTML=s2;
}
</script>
