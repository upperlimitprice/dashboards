<title>수급 오실레이터</title>
<style>
body{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:#f4f6f8;margin:0;color:#1c2530}
.wrap{max-width:1060px;margin:0 auto;padding:28px 16px 70px}
h1{font-size:1.3rem;margin-bottom:4px} .sub{color:#67737f;font-size:.85rem}
.bar{display:flex;gap:10px;margin:18px 0;flex-wrap:wrap}
input,select{font:inherit;padding:9px 12px;border:1.5px solid #ccd5dd;border-radius:9px;background:#fff}
input{flex:1;min-width:230px}
.card{background:#fff;border:1px solid #ccd5dd;border-radius:12px;padding:16px}
.ttl{font-weight:800;font-size:1.05rem;margin-bottom:2px}
.meta{color:#67737f;font-size:.8rem;margin-bottom:8px}
.legend{font-size:.8rem;color:#444;margin-bottom:6px}
.legend b.mc{color:#111}.legend b.os{color:#c0392b}
#msg{color:#67737f;padding:30px;text-align:center}
.btn{font:inherit;padding:9px 14px;border:1.5px solid #1f6fd6;border-radius:9px;background:#fff;color:#1f6fd6;font-weight:700;cursor:pointer}
.btn:hover{background:#eef5fe}
#chips{margin:2px 0 6px}
.chip{display:inline-block;font-size:.7rem;color:#1f6fd6;border:1px solid #bcd6f5;border-radius:20px;padding:2px 9px;margin-right:5px;background:#f3f8ff}
#modal{position:fixed;inset:0;background:rgba(20,26,34,.45);display:none;align-items:center;justify-content:center;z-index:10}
#modal .box{background:#fff;border-radius:14px;max-width:560px;width:92%;max-height:82vh;display:flex;flex-direction:column;padding:20px}
#modal h3{margin:0 0 10px;font-size:1.05rem}
#slist{overflow-y:auto;border:1px solid #e2e8ee;border-radius:9px;padding:8px 12px;flex:1}
#slist label{display:flex;justify-content:space-between;padding:6px 2px;font-size:.88rem;cursor:pointer}
#slist small{color:#8a94a0}
#modal .foot{display:flex;justify-content:space-between;margin-top:14px}
.btn2{font:inherit;padding:9px 16px;border-radius:9px;border:1.5px solid #ccd5dd;background:#fff;cursor:pointer}
.btn2.pri{background:#1f6fd6;color:#fff;border-color:#1f6fd6;font-weight:700}
#tabs{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 4px}
.tab{font:inherit;font-size:.85rem;padding:8px 13px;border:1.5px solid #ccd5dd;border-radius:20px;background:#fff;cursor:pointer;color:#444}
.tab.on{background:#1f3b73;color:#fff;border-color:#1f3b73;font-weight:700}
.minigrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.mini{background:#fff;border:1px solid #ccd5dd;border-radius:10px;padding:10px 12px;cursor:pointer}
.mini:hover{border-color:#1f6fd6}
.mini .mh{font-size:.8rem;font-weight:700;display:flex;justify-content:space-between}
.mini .mh small{color:#8a94a0;font-weight:400}
.mini .mb{font-size:.68rem;color:#8a94a0;margin-top:2px}
.duo{display:grid;grid-template-columns:1fr 210px;gap:14px;align-items:start}
@media(max-width:900px){.duo{grid-template-columns:1fr}}
.panel{background:#fff;border:1px solid #ccd5dd;border-radius:12px;padding:12px 14px;position:sticky;top:12px}
.panel h3{margin:0 0 8px;font-size:.85rem;color:#67737f}
.plist{max-height:72vh;overflow-y:auto}
.pitem{display:block;width:100%;text-align:left;font:inherit;font-size:.8rem;padding:6px 4px;border:0;border-bottom:1px solid #f0f3f6;background:none;cursor:pointer;color:#20262e}
.pitem:hover{color:#1f6fd6}
.pitem small{color:#9aa4ad;margin-left:4px}
.navbtn{font:inherit;font-size:1rem;width:34px;height:34px;border:1.5px solid #ccd5dd;border-radius:9px;background:#fff;cursor:pointer;color:#444;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.navbtn:disabled{opacity:.35;cursor:default}
.navbtn:not(:disabled):hover{border-color:#1f6fd6;color:#1f6fd6}
.ozb{font:inherit;font-size:.74rem;padding:3px 10px;border:1px solid #ccd5dd;border-radius:7px;background:#fff;cursor:pointer}
.ozb.on{background:#1f3b73;color:#fff;border-color:#1f3b73}
</style>
<div class='wrap'>
<div id='nav' style='position:fixed;top:10px;left:12px;z-index:20;display:flex;gap:6px'>
<button id='navB' class='navbtn' title='이전'>←</button><button id='navF' class='navbtn' title='앞으로'>→</button>
</div>
<h1>📊 수급 오실레이터 <small id='upd' style='font-size:.72rem;font-weight:400;color:#9aa4ad'></small></h1>
<p class='sub'>시가총액(검정, 좌축) vs 수급 오실레이터(빨강, 우축) · 오실레이터 = 5일 (외국인+기관 순매수합)/시총의 MACD(12·26·9) 히스토그램 · 평일 자동 갱신</p>
<div id='insight' style='display:none;background:#fff;border:1px solid #ccd5dd;border-radius:12px;padding:13px 17px;margin:12px 0 4px;font-size:.85rem;line-height:1.8'></div>
<div id='tabs'>
<button class='tab on' data-t='main'>메인</button>
<button class='tab' data-t='사모펀드'>사모펀드 순매수 상위</button>
<button class='tab' data-t='투신'>투신 순매수 상위</button>
<button class='tab' data-t='연기금'>연기금 순매수 상위</button>
<button class='tab' data-t='외국인'>외국인 순매수 상위 (시총대비)</button>
<button class='tab' data-t='외국인전체'>외국인 순매수 상위 (전체 금액)</button>
<button class='tab' data-t='sectors'>섹터별 모아보기</button>
<button class='tab' data-t='bottom' style='color:#c0392b;font-weight:800'>▲ 상승 변곡 임박</button>

</div>
<div class='bar'>
<select id='sec'><option value=''>섹터 전체</option></select>
<select id='per'><option value='30'>30일</option><option value='60'>60일</option><option value='78' selected>78일 (기본)</option><option value='120'>120일</option><option value='0'>전체</option></select>
<input id='q' list='names' placeholder='종목명 또는 코드 검색 (예: 삼성전자, 005930)' autocomplete='off'>
<datalist id='names'></datalist>
<button id='cmp' class='btn'>⚖ 섹터 비교</button>

<div class='card'>
<div class='ttl' id='nm'>—</div>
<div id='chips'></div>

<span style='color:#67737f'>Zoom</span>
<button class='ozb' data-d='0'>전체</button><button class='ozb' data-d='252'>1년</button>
<button class='ozb' data-d='126'>6m</button><button class='ozb' data-d='63'>3m</button>
<button class='ozb' data-d='21'>1m</button>
</div>
<div class='legend'><b class='mc'>━ 시가총액</b> &nbsp; <b class='os'>━ 수급오실레이터</b> (0선 점선)</div>
<div id='chart'><div id='msg'>종목명을 입력하면 차트가 표시됩니다 (차트에서 드래그=구간 확대, 더블클릭=해제)</div></div>
</div>
<div class='panel' id='recentP'><h3>🕘 최근 검색</h3><div class='plist' id='recentL'></div></div>
</div>
<div id='gridPage' style='display:none'>
<p class='sub' id='gridSub'></p>
<div class='duo'>
<div id='grid' class='minigrid'></div>
<div class='panel'><h3 id='glistT'>종목 리스트</h3><div class='plist' id='glist'></div></div>
</div>
</div>
</div>
<div id='modal'><div class='box'>
<h3>⚖ 섹터 비교 — 여러 섹터 오실레이터 한 번에 보기</h3>
<div class='sub' style='margin-bottom:8px'>비교할 섹터 선택 (최대 12개)</div>
<div id='slist'></div>
<div class='foot'><button class='btn2' onclick="document.getElementById('modal').style.display='none'">닫기</button>
<button class='btn2 pri' id='cmpGo'>비교 차트 보기</button></div>
</div></div>
<script>
let IDX=null, SEC=null, cacheShard={}, cur=null;
const $=id=>document.getElementById(id);
Promise.all([fetch('osc/index.json?v='+Date.now()).then(r=>r.json()), fetch('osc/sectors.json').then(r=>r.json())]).then(([d,sec])=>{
  IDX=d; SEC=sec;
  const wi=[],idx=[];
  sec.forEach((x,i)=>(x.c.startsWith('WI')&&!x.c.startsWith('WI0')?wi:idx).push(`<option value='${i}'>${x.n} (${x.t.length})</option>`));
  $('sec').innerHTML="<option value=''>섹터 전체</option><optgroup label='WI26 업종'>"+wi.join('')+"</optgroup><optgroup label='KRX / WISE / WMI 지수'>"+idx.join('')+"</optgroup>";
  $('slist').innerHTML=sec.map((x,i)=>`<label><span><input type='checkbox' value='${i}'> ${x.n}</span><small>(${x.t.length}종목)</small></label>`).join('');
  fillNames();
  $('mt').textContent=`총 ${d.stocks.length.toLocaleString()}종목 · ${sec.length}섹터 · 최신 데이터 ${fmtD(d.dates[d.dates.length-1])}`;
  if(d.updated){$('upd').textContent=`최종 업데이트 ${d.updated}`;document.title=`수급 오실레이터 · ${d.updated} 업데이트`;}
  renderRecent();
  renderInsight();
  $('q').value='삼성전자'; show();
});
async function renderInsight(){
  try{
    if(!TOPS) TOPS=await fetch('osc/tops.json?v='+Date.now()).then(r=>r.json());
    if(!BOTTOM) BOTTOM=await fetch('osc/bottom.json?v='+Date.now()).then(r=>r.json());
    const W={'사모펀드':2,'투신':1.5,'연기금':1};
    const score=src=>{const m={};for(const a in W)(src[a]||[]).forEach(([tk])=>m[tk]=(m[tk]||0)+W[a]);return m;};
    const bs=score(TOPS.top||{}), ss=score(TOPS.sell||{});
    const nameOf=tk=>{const st=IDX.stocks.find(x=>x[0]===tk);return st?st[1]:tk;};
    const agTag=(src,tk)=>Object.keys(W).filter(a=>(src[a]||[]).some(([t])=>t===tk)).map(a=>a==='사모펀드'?'사모':a).join('·');
    const buys=(BOTTOM.list||[]).filter(x=>bs[x[0]]).map(x=>({tk:x[0],nm:x[1],sc:bs[x[0]],r:x[2],tag:agTag(TOPS.top,x[0])}))
      .sort((a,b)=>b.sc-a.sc||b.r-a.r).slice(0,8);
    const sells=(BOTTOM.top||[]).filter(x=>ss[x[0]]).map(x=>({tk:x[0],nm:x[1],sc:ss[x[0]],r:x[2],tag:agTag(TOPS.sell,x[0])}))
      .sort((a,b)=>b.sc-a.sc||b.r-a.r).slice(0,8);
    const fmt=l=>l.map(x=>`<a href='#' onclick='gotoStock("${x.tk}");return false' style='color:inherit'><b>${x.nm}</b></a> <small style='color:#8a94a0'>(${x.tag} 매수·근접 ${(x.r*100).toFixed(0)}%)</small>`).join(' · ');
    const fmt2=l=>l.map(x=>`<a href='#' onclick='gotoStock("${x.tk}");return false' style='color:inherit'><b>${x.nm}</b></a> <small style='color:#8a94a0'>(${x.tag} 매도·근접 ${(x.r*100).toFixed(0)}%)</small>`).join(' · ');
    let h=`<b>📌 데일리 수급×변곡 인사이트</b> <small style='color:#9aa4ad'>기준일 ${TOPS.date} · 수급 가중치 사모(2)&gt;투신(1.5)&gt;연기금(1) × 변곡 근접도(100%=변곡점 평균 도달)</small><br>`;
    h+=`<span style='color:#c0392b;font-weight:700'>🔴 의미있는 매수타점</span> — 주체 순매수 유입 + 상승 변곡 임박: `+(buys.length?fmt(buys):'해당 없음')+`<br>`;
    h+=`<span style='color:#1f6fd6;font-weight:700'>🔵 의미있는 매도타점</span> — 주체 순매도 이탈 + 하락 변곡 임박: `+(sells.length?fmt2(sells):'해당 없음');
    const el=document.getElementById('insight');
    el.innerHTML=h; el.style.display='';
  }catch(e){}
}
function fillNames(){
  const si=$('sec').value;
  const pool=si===''?IDX.stocks:IDX.stocks.filter(s=>SEC[+si].t.includes(s[0]));
  $('names').innerHTML=pool.map(s=>`<option value="${s[1]}">${s[0]}</option>`).join('');
}
function fmtD(d){return d.slice(0,4)+'-'+d.slice(4,6)+'-'+d.slice(6);}
function find(q){
  q=q.trim(); if(!q||!IDX) return null;
  const si=$('sec').value;
  const pool=si===''?IDX.stocks:IDX.stocks.filter(s=>SEC[+si].t.includes(s[0]));
  return pool.find(s=>s[1]===q)||pool.find(s=>s[0]===q)
    ||pool.find(s=>s[1].toLowerCase().includes(q.toLowerCase()))||IDX.stocks.find(s=>s[1]===q);
}
function pushRecent(tk,name){
  let r=JSON.parse(localStorage.getItem('oscRecent')||'[]');
  r=r.filter(x=>x[0]!==tk); r.unshift([tk,name]); r=r.slice(0,30);
  localStorage.setItem('oscRecent',JSON.stringify(r)); renderRecent();
}
function renderRecent(){
  const r=JSON.parse(localStorage.getItem('oscRecent')||'[]');
  document.getElementById('recentL').innerHTML=r.map(([tk,nm])=>
    `<button class='pitem' onclick='gotoStock("${tk}")'>${nm}<small>${tk}</small></button>`).join('')
    ||"<div class='empty' style='font-size:.75rem;color:#9aa4ad'>검색 이력이 여기 쌓입니다</div>";
}
async function show(){
  const hit=find($('q').value); if(!hit) return;
  const [tk,name,sh]=hit;
  if(!cacheShard[sh]) cacheShard[sh]=await fetch(`osc/s${sh}.json`).then(r=>r.json());
  cur={tk,name,rec:cacheShard[sh][tk]}; pushRecent(tk,name); hpush({t:'main',tk}); 
  $('chips').innerHTML=(hit[3]||[]).map(c=>{const x=SEC.find(y=>y.c===c);return x?`<span class='chip'>${x.n}</span>`:'';}).join('');
  draw();
}
function showSector(i){
  hpush({t:'main',sec:i});
  const x=SEC[i];
  cur={tk:x.c,name:x.n+' (합산)',rec:x};
  $('chips').innerHTML=`<span class='chip'>${x.t.length}종목 합산</span>`;
  draw();
}
function draw(){
  if(!cur) return;
  const {tk,name,rec}=cur;
  const per=(window.ZDAYS!=null)?window.ZDAYS:+$('per').value;
  let pts=[];
  for(let i=0;i<rec.m.length;i++) if(rec.m[i]!=null)
    pts.push({d:IDX.dates[rec.s+i], m:rec.m[i], o:rec.o[i]});
  if(window.ZSEL){pts=pts.filter(p=>p.d>=window.ZSEL[0]&&p.d<=window.ZSEL[1]); if(pts.length<5){window.ZSEL=null;}}
  if(!window.ZSEL&&per>0) pts=pts.slice(-per);
  $('nm').textContent=`${name} (${tk})`;
  const lastM=pts[pts.length-1].m, lastO=pts[pts.length-1].o;
  $('mt').textContent=`${fmtD(pts[0].d)} ~ ${fmtD(pts[pts.length-1].d)} · 시총 ${lastM>=10000?(lastM/10000).toFixed(1)+'조':lastM.toLocaleString()+'억'} · 오실레이터 ${(lastO*100).toFixed(3)}%p`;
  const W=1000,H=496,L=78,R=78,T=16,B=82,PH=H-T-B;
  const mv=pts.map(p=>p.m), ov=pts.map(p=>p.o);
  const nice=r=>{const p=Math.pow(10,Math.floor(Math.log10(r)));return [1,2,2.5,5,10].map(x=>x*p).find(x=>x>=r);};
  // 좌축(시총): 0부터 시작, 라운드 눈금 ~8등분 (엑셀 방식)
  const mHi=Math.max(...mv), mStep=nice(mHi/8), nDiv=Math.ceil(mHi/mStep*1.0001)+0;
  const m1=mStep*nDiv;
  // 우축(오실레이터): 라운드 눈금, 그리드 수를 좌축과 동일하게 맞춤
  const oLo=Math.min(...ov,0), oHi=Math.max(...ov,0);
  let oStep=nice(Math.max((oHi-oLo)/nDiv,1e-7));
  let o0=Math.floor(oLo/oStep)*oStep;
  while(o0+nDiv*oStep<oHi*1.0001){oStep=nice(oStep*1.01);o0=Math.floor(oLo/oStep)*oStep;}
  const o1=o0+nDiv*oStep;
  const X=i=>L+i*(W-L-R)/Math.max(1,pts.length-1);
  const Ym=v=>T+PH*(1-v/m1);
  const Yo=v=>T+PH*(1-(v-o0)/(o1-o0));
  let s=`<svg viewBox='0 0 ${W} ${H}' style='width:100%;background:#fff'>`;
  for(let k=0;k<=nDiv;k++){
    const y=T+PH*(1-k/nDiv), mvv=mStep*k, ovv=o0+oStep*k;
    s+=`<line x1='${L}' y1='${y}' x2='${W-R}' y2='${y}' stroke='#eef1f4'/>`;
    s+=`<text x='${L-6}' y='${y+4}' font-size='11' fill='#444' text-anchor='end'>${mvv>=10000?(mvv/10000).toLocaleString(undefined,{maximumFractionDigits:1})+'조':Math.round(mvv).toLocaleString()}</text>`;
    s+=`<text x='${W-R+6}' y='${y+4}' font-size='11' fill='#c0392b'>${(ovv*100).toFixed(2)}%</text>`;
  }
  if(o0<0&&o1>0) s+=`<line x1='${L}' y1='${Yo(0)}' x2='${W-R}' y2='${Yo(0)}' stroke='#c9ced4' stroke-width='.9'/>`;
  const st=Math.max(1,Math.floor(pts.length/10));
  for(let i=0;i<pts.length;i+=st) s+=`<text x='${X(i)}' y='${H-52}' font-size='10.5' fill='#67737f' text-anchor='middle' transform='rotate(-35 ${X(i)} ${H-52})'>${fmtD(pts[i].d)}</text>`;
  s+=`<polyline points='${pts.map((p,i)=>X(i).toFixed(1)+','+Ym(p.m).toFixed(1)).join(' ')}' fill='none' stroke='#333' stroke-width='3.2'/>`;
  s+=`<polyline points='${pts.map((p,i)=>X(i).toFixed(1)+','+Yo(p.o).toFixed(1)).join(' ')}' fill='none' stroke='#e30613' stroke-width='3.2'/>`;
  s+=`<circle id='hovM' r='5' fill='#333' stroke='#fff' stroke-width='1.6' style='display:none'/>`;
  s+=`<circle id='hovO' r='5' fill='#e30613' stroke='#fff' stroke-width='1.6' style='display:none'/>`;
  s+=`<text x='${W/2-40}' y='${H-8}' font-size='13' fill='#333' font-weight='700' text-anchor='end'>━ ${name} 시가총액</text>`;
  s+=`<text x='${W/2+40}' y='${H-8}' font-size='13' fill='#e30613' font-weight='700'>━ ${name} 오실레이터</text>`;
  s+='</svg>';
  $('chart').innerHTML=s;
  window._XY=i=>[X(i).toFixed(1),Ym(pts[i].m).toFixed(1),Yo(pts[i].o).toFixed(1)];
  bindTip(pts,W,L,R);
}
let TIP=null;
function bindTip(pts,W,L,R){
  if(!TIP){
    TIP=document.createElement('div');
    TIP.style.cssText='position:fixed;display:none;background:#16181d;color:#fff;padding:8px 11px;border-radius:8px;font-size:12px;line-height:1.6;pointer-events:none;z-index:50;box-shadow:0 3px 12px rgba(0,0,0,.25)';
    document.body.appendChild(TIP);
  }
  const box=$('chart');
  box.onmousemove=e=>{
    const r=box.getBoundingClientRect();
    const fx=(e.clientX-r.left)/r.width*W;
    let i=Math.round((fx-L)/(W-L-R)*(pts.length-1));
    i=Math.max(0,Math.min(pts.length-1,i));
    const p=pts[i];
    const mv=p.m>=10000?(p.m/10000).toFixed(2)+'조':p.m.toLocaleString()+'억';
    TIP.innerHTML=`<div style='color:#9aa4ad'>${fmtD(p.d)}</div>`
      +`<div><span style='color:#aaa'>●</span> 시가총액: <b>${mv}</b></div>`
      +`<div><span style='color:#e30613'>●</span> 오실레이터: <b>${(p.o*100).toFixed(3)}%</b></div>`;
    TIP.style.display='block';
    TIP.style.left=Math.min(e.clientX+14,innerWidth-TIP.offsetWidth-8)+'px';
    TIP.style.top=(e.clientY+14)+'px';
    const hm=box.querySelector('#hovM'), ho=box.querySelector('#hovO');
    if(hm&&window._XY){const [xx,ym,yo]=window._XY(i);
      hm.setAttribute('cx',xx);hm.setAttribute('cy',ym);hm.style.display='';
      ho.setAttribute('cx',xx);ho.setAttribute('cy',yo);ho.style.display='';}
  };
  box.onmouseleave=()=>{TIP.style.display='none';
    const hm=box.querySelector('#hovM'), ho=box.querySelector('#hovO');
    if(hm){hm.style.display='none';ho.style.display='none';}};
  // 드래그 박스 줌
  box.style.position='relative';
  let selDiv=box.querySelector('.selbox');
  if(!selDiv){selDiv=document.createElement('div');selDiv.className='selbox';
    selDiv.style.cssText='position:absolute;top:0;bottom:0;background:rgba(31,111,214,.15);border:1px solid #1f6fd6;display:none;pointer-events:none';
    box.appendChild(selDiv);}
  let sx=null;
  const fx2i=cx=>{const r=box.getBoundingClientRect();const fx=(cx-r.left)/r.width*W;
    return Math.max(0,Math.min(pts.length-1,Math.round((fx-L)/(W-L-R)*(pts.length-1))));};
  box.onmousedown=e=>{sx=e.clientX;const r=box.getBoundingClientRect();
    selDiv.style.left=(e.clientX-r.left)+'px';selDiv.style.width='0';selDiv.style.display='block';e.preventDefault();};
  box.onmousemove_orig=box.onmousemove;
  box.onmousemove=e=>{box.onmousemove_orig(e);
    if(sx!=null){const r=box.getBoundingClientRect();
      selDiv.style.left=Math.min(sx,e.clientX)-r.left+'px';
      selDiv.style.width=Math.abs(e.clientX-sx)+'px';}};
  box.onmouseup=e=>{if(sx==null)return;
    const i0=fx2i(Math.min(sx,e.clientX)), i1=fx2i(Math.max(sx,e.clientX));
    selDiv.style.display='none';const _sx=sx;sx=null;
    if(Math.abs(e.clientX-_sx)<=20)return;
    if(e.clientX<_sx){window.ZSEL=null;draw();return;}   // 좌측 드래그 = 줌 해제
    if(i1>i0+2){window.ZSEL=[pts[i0].d,pts[i1].d];draw();}};
  box.ondblclick=()=>{window.ZSEL=null;draw();};
}
let TOPS=null, BOTTOM=null;
async function loadShard(sh){
  if(!cacheShard[sh]) cacheShard[sh]=await fetch(`osc/s${sh}.json`).then(r=>r.json());
  return cacheShard[sh];
}
function inflectCol(rec){
  const o=rec.o.filter(x=>x!=null);
  if(o.length<60) return null;
  const last=o[o.length-1];
  const tr=[],pk=[];
  for(let j=2;j<o.length-2;j++){
    if(o[j]<0&&o[j]<=o[j-1]&&o[j]<=o[j+1]&&o[j]<=o[j-2]&&o[j]<=o[j+2])tr.push(o[j]);
    if(o[j]>0&&o[j]>=o[j-1]&&o[j]>=o[j+1]&&o[j]>=o[j-2]&&o[j]>=o[j+2])pk.push(o[j]);
  }
  if(tr.length>=3&&last<0&&last<=tr.reduce((a,b)=>a+b,0)/tr.length)return '#c0392b';
  if(pk.length>=3&&last>0&&last>=pk.reduce((a,b)=>a+b,0)/pk.length)return '#1f6fd6';
  return null;
}
function miniSvg(rec,per){
  let pts=[];
  for(let i=0;i<rec.m.length;i++) if(rec.m[i]!=null) pts.push({m:rec.m[i],o:rec.o[i]});
  if(per>0)pts=pts.slice(-per);
  const W=240,H=110,T=6,B=6,PH=H-T-B;
  const mLo=Math.min(...pts.map(p=>p.m)),mHi=Math.max(...pts.map(p=>p.m));
  const oM=Math.max(...pts.map(p=>Math.abs(p.o)))||1e-6;
  const X=i=>4+i*(W-8)/Math.max(1,pts.length-1);
  const Ym=v=>T+PH*0.55*(1-(v-mLo)/((mHi-mLo)||1));
  const Yo=v=>T+PH*(1-(v+1.15*oM)/(2.3*oM));
  let sv=`<svg viewBox='0 0 ${W} ${H}' style='width:100%'>`;
  sv+=`<line x1='4' y1='${Yo(0)}' x2='${W-4}' y2='${Yo(0)}' stroke='#e8cdca' stroke-dasharray='3 3' stroke-width='.7'/>`;
  sv+=`<polyline points='${pts.map((p,i)=>X(i).toFixed(1)+','+Ym(p.m).toFixed(1)).join(' ')}' fill='none' stroke='#333' stroke-width='1.7'/>`;
  sv+=`<polyline points='${pts.map((p,i)=>X(i).toFixed(1)+','+Yo(p.o).toFixed(1)).join(' ')}' fill='none' stroke='#e30613' stroke-width='1.7'/>`;
  return sv+'</svg>';
}
async function renderGrid(kind){
  const per=+$('per').value||78;
  let items=[], sub='';
  if(kind==='sectors'){
    $('gridSub').textContent=`전체 ${SEC.length}개 섹터·지수 합산 오실레이터 — 카드를 누르면 메인 차트로 이동`;
    const scol=SEC.map(x=>inflectCol(x));
    // 정렬: 상승 변곡(빨강) → 하락 변곡(파랑) → 나머지
    const ord=SEC.map((x,i)=>i).sort((a,b)=>{
      const rank=c=>c==='#c0392b'?0:c==='#1f6fd6'?1:2;
      return rank(scol[a])-rank(scol[b]);
    });
    $('gridSub').innerHTML+=" · <b style='color:#c0392b'>빨강=상승 변곡 임박</b> / <b style='color:#1f6fd6'>파랑=하락 변곡 임박</b> (변곡 섹터 상단 정렬)";
    $('grid').innerHTML=ord.map(i=>{const x=SEC[i];return `<div class='mini' onclick="gotoSector(${i})">
      <div class='mh'><span${scol[i]?` style='color:${scol[i]}'`:''}>${x.n}</span><small>${x.t.length}종목</small></div>
      ${miniSvg(x,per)}<div class='mb'>구성종목 시총합 · 합산 수급</div></div>`;}).join('');
    $('glistT').textContent=`섹터 리스트 (${SEC.length})`;
    $('glist').innerHTML=ord.map(i=>{const x=SEC[i];return `<button class='pitem' onclick='gotoSector(${i})'${scol[i]?` style='color:${scol[i]};font-weight:700'`:''}>${x.n}<small>${x.t.length}</small></button>`;}).join('');
    return;
  }
  if(kind==='bottom'||kind==='peak'){
    if(!BOTTOM) BOTTOM=await fetch('osc/bottom.json?v='+Date.now()).then(r=>r.json());
    if(kind==='bottom'){
      items=BOTTOM.list.map(x=>({tk:x[0],name:x[1],col:'#c0392b',meta:`상승변곡점 평균 대비 ${(x[2]*100).toFixed(0)}% · osc ${(x[3]*100).toFixed(3)}%`}));
      sub=`기준일 ${BOTTOM.date} · <b style='color:#c0392b'>상승 변곡 임박</b> — 현재 오실레이터가 과거 상승 변곡점(하락→상승 전환) 평균보다 낮은 종목. 평균 대비 %가 클수록(극단) 상승 전환이 더 임박 (전종목, 시총 500억+)`;
    }else{
      items=(BOTTOM.top||[]).map(x=>({tk:x[0],name:x[1],col:'#1f6fd6',meta:`하락변곡점 평균 대비 ${(x[2]*100).toFixed(0)}% · osc ${(x[3]*100).toFixed(3)}%`}));
      sub=`기준일 ${BOTTOM.date} · <b style='color:#1f6fd6'>▼ 하락 변곡 임박</b> — 현재 오실레이터가 과거 하락 변곡점(상승→하락 전환) 평균보다 높은 종목. 평균 대비 %가 클수록 하락 전환이 더 임박 (전종목, 시총 500억+)`;
    }
  }else{
    if(!TOPS) TOPS=await fetch('osc/tops.json?v='+Date.now()).then(r=>r.json());
    if(!BOTTOM) BOTTOM=await fetch('osc/bottom.json?v='+Date.now()).then(r=>r.json());
    const botSet=new Set((BOTTOM.list||[]).map(x=>x[0]));
    const pkSet=new Set((BOTTOM.top||[]).map(x=>x[0]));
    if(!TOPS.top[kind]){$('gridSub').textContent='이 목록은 다음 수급 갱신(평일 16:00) 이후 제공됩니다';$('grid').innerHTML='';return;}
    items=TOPS.top[kind].map(([tk,nm],i)=>({tk,
      col:botSet.has(tk)?'#c0392b':pkSet.has(tk)?'#1f6fd6':null,
      name:nm+(botSet.has(tk)?" <span style='color:#eba7a2;font-weight:600;font-size:.6rem'>●상승변곡</span>":pkSet.has(tk)?" <span style='color:#a8c4ea;font-weight:600;font-size:.6rem'>●하락변곡</span>":""),
      meta:`${kind==='외국인전체'?'금액':'시총대비'} 순매수 ${i+1}위`}));
    sub=`기준일 ${TOPS.date} · ${kind==='외국인전체'?'외국인 전체 금액':kind+' 시총대비'} 순매수 Top20 · <span style='color:#e30613'>●상승 변곡 임박</span> / <span style='color:#1f6fd6'>●하락 변곡 임박</span> — 카드를 누르면 메인 차트로 이동`;
  }
  $('gridSub').innerHTML=sub;
  $('grid').innerHTML='<div id="msg">불러오는 중…</div>';
  const cells=[];
  for(const it of items){
    const stock=IDX.stocks.find(x=>x[0]===it.tk);
    if(!stock){continue;}
    const shd=await loadShard(stock[2]);
    const rec=shd[it.tk];
    if(!rec)continue;
    cells.push(`<div class='mini' onclick="gotoStock('${it.tk}')">
      <div class='mh'><span>${it.name}</span><small>${it.tk}</small></div>
      ${miniSvg(rec,per)}<div class='mb'>${it.meta}</div></div>`);
  }
  $('grid').innerHTML=cells.join('')||'<div id="msg">데이터 없음</div>';
  $('glistT').textContent=`종목 리스트 (${items.length})`;
  $('glist').innerHTML=items.map(it=>`<button class='pitem' onclick='gotoStock("${it.tk}")'${it.col?` style='color:${it.col};font-weight:700'`:''}>${it.name.replace(/<[^>]+>/g,'').replace(/●(상승|하락)변곡/,'')}<small>${it.tk}</small></button>`).join('');
}
function gotoSector(i){
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t==='main'));
  $('gridPage').style.display='none';
  document.querySelector('.duo').style.display='';
  document.querySelector('.bar').style.display='';
  $('sec').value=String(i); fillNames(); showSector(i);
  window.scrollTo({top:0});
}
function gotoStock(tk){
  const st=IDX.stocks.find(x=>x[0]===tk);
  if(!st)return;
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t==='main'));
  $('gridPage').style.display='none';
  document.querySelector('.duo').style.display='';
  document.querySelector('.bar').style.display='';
  $('q').value=st[1]; $('sec').value=''; fillNames(); show();
  window.scrollTo({top:0});
}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));
  const t=b.dataset.t;
  if(t!=='main')hpush({t});
  const bar=document.querySelector('.bar'), duoMain=document.querySelector('.duo');
  if(t==='main'){$('gridPage').style.display='none';duoMain.style.display='';bar.style.display='';}
  else{duoMain.style.display='none';bar.style.display='none';$('gridPage').style.display='';renderGrid(t);}
}));
// 페이지 내 탐색 히스토리 (← →)
let HIST=[], HPOS=-1, NAVIGATING=false;
function hpush(st){
  if(NAVIGATING)return;
  HIST=HIST.slice(0,HPOS+1); HIST.push(st); HPOS=HIST.length-1; hbtn();
}
function hbtn(){$('navB').disabled=HPOS<=0;$('navF').disabled=HPOS>=HIST.length-1;}
function happly(st){
  NAVIGATING=true;
  try{
    if(st.t==='main'){
      document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t==='main'));
      $('gridPage').style.display='none';document.querySelector('.duo').style.display='';document.querySelector('.bar').style.display='';
      if(st.sec!=null){$('sec').value=String(st.sec);fillNames();showSector(st.sec);}
      else if(st.tk){const s2=IDX.stocks.find(x=>x[0]===st.tk);if(s2){$('q').value=s2[1];show();}}
    }else{
      const b=document.querySelector(`.tab[data-t='${st.t}']`);
      if(b)b.click();
    }
  }finally{NAVIGATING=false;hbtn();}
}
$('navB').onclick=()=>{if(HPOS>0){HPOS--;happly(HIST[HPOS]);}};
$('navF').onclick=()=>{if(HPOS<HIST.length-1){HPOS++;happly(HIST[HPOS]);}};
document.querySelectorAll('.ozb').forEach(b=>b.addEventListener('click',()=>{
  window.ZDAYS=+b.dataset.d;

$('sec').addEventListener('change',()=>{fillNames();if($('sec').value!=='')showSector(+$('sec').value);});

$('cmpGo').addEventListener('click',()=>{
  const sel=[...document.querySelectorAll('#slist input:checked')].map(e=>+e.value).slice(0,12);

const PAL=['#1f6fd6','#e30613','#2eaa5e','#f28e2b','#8b1e3f','#00a3a3','#7048c8','#c8a400','#e91e8c','#5f6b7a','#3d8f2f','#1c2530'];
function drawCompare(sel){
  const per=+$('per').value;
  $('nm').textContent='섹터 비교 — 수급 오실레이터';
  $('chips').innerHTML=sel.map((i,k)=>`<span class='chip' style='color:${PAL[k]};border-color:${PAL[k]}'>${SEC[i].n}</span>`).join('');
  const series=sel.map(i=>{
    const x=SEC[i]; let pts=[];
    for(let j=0;j<x.m.length;j++) if(x.o[j]!=null) pts.push({d:IDX.dates[x.s+j],o:x.o[j]});
    if(per>0)pts=pts.slice(-per); return pts;
  });
  const all=series.flat();
  $('mt').textContent=`${fmtD(all[0].d)} ~ ${fmtD(all[all.length-1].d)} · ${sel.length}개 섹터 오실레이터(%)`;
  const W=1000,H=470,L=78,R=30,T=16,B=56,PH=H-T-B;
  const oLo=Math.min(...all.map(p=>p.o),0), oHi=Math.max(...all.map(p=>p.o),0);
  const nice=r=>{const p=Math.pow(10,Math.floor(Math.log10(r)));return [1,2,2.5,5,10].map(x=>x*p).find(x=>x>=r);};
  const stp=nice((oHi-oLo)/8||1e-6), o0=Math.floor(oLo/stp)*stp, o1=Math.ceil(oHi/stp)*stp;
  const nD=Math.round((o1-o0)/stp);
  const Yo=v=>T+PH*(1-(v-o0)/(o1-o0));
  const n=Math.max(...series.map(sr=>sr.length));
  const X=i=>L+i*(W-L-R)/Math.max(1,n-1);
  let s2=`<svg viewBox='0 0 ${W} ${H}' style='width:100%;background:#fff'>`;
  for(let k=0;k<=nD;k++){const v=o0+stp*k,y=Yo(v);
    s2+=`<line x1='${L}' y1='${y}' x2='${W-R}' y2='${y}' stroke='${Math.abs(v)<1e-12?'#c9ced4':'#eef1f4'}'/>`;
    s2+=`<text x='${L-6}' y='${y+4}' font-size='11' fill='#444' text-anchor='end'>${(v*100).toFixed(2)}%</text>`;}
  const base=series.reduce((a,b)=>b.length>a.length?b:a,[]);
  const st=Math.max(1,Math.floor(base.length/10));
  for(let i=0;i<base.length;i+=st) s2+=`<text x='${X(i)}' y='${H-30}' font-size='10.5' fill='#67737f' text-anchor='middle' transform='rotate(-35 ${X(i)} ${H-30})'>${fmtD(base[i].d)}</text>`;
  series.forEach((sr,k)=>{
    const off=n-sr.length;
    s2+=`<polyline points='${sr.map((p,i)=>X(i+off).toFixed(1)+','+Yo(p.o).toFixed(1)).join(' ')}' fill='none' stroke='${PAL[k]}' stroke-width='2'/>`;
  });
  s2+='</svg>';
  $('chart').innerHTML=s2;
}
