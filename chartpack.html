<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>미국 섹터 차트팩</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js"></script>
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#1b1f27;--sub:#5b6472;--line:#e2e5ea;--chip:#eef1f5;--acc:#2f5bd3;--up:#e0393e;--dn:#2f6fe0;--hov:#f0f3f8;--shade:rgba(47,91,211,.12)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1218;--card:#171b23;--ink:#e6e9ef;--sub:#97a0ae;--line:#2a303b;--chip:#222833;--acc:#6f95ff;--up:#ff5a5f;--dn:#4d8dff;--hov:#1e2430;--shade:rgba(111,149,255,.16)}}
:root[data-theme="dark"]{--bg:#0f1218;--card:#171b23;--ink:#e6e9ef;--sub:#97a0ae;--line:#2a303b;--chip:#222833;--acc:#6f95ff;--up:#ff5a5f;--dn:#4d8dff;--hov:#1e2430;--shade:rgba(111,149,255,.16)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;font-size:14px}
a{color:var(--acc);text-decoration:none}
.wrap{max-width:1480px;margin:0 auto;padding:18px 16px 60px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 18px;margin-bottom:12px}
h1{font-size:22px;margin:0}
.meta{color:var(--sub);font-size:12.5px}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-bottom:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:16px;padding:5px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--card);color:var(--sub);padding:5px 10px;font-size:12.5px;cursor:pointer;font-family:inherit}
.seg button.on{background:var(--acc);color:#fff}
input[type=search]{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 10px;font-size:13px;width:170px;font-family:inherit}
.sp{flex:1}
.lbl{font-size:12px;color:var(--sub)}
.box{min-width:0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:14px 0}
.box h2{font-size:16px;margin:0 0 10px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 14px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{color:var(--sub);font-weight:500;cursor:pointer;user-select:none;position:sticky;top:0;background:var(--card)}
th:first-child,td:first-child,th.l,td.l{text-align:left}
td:last-child,th:last-child{padding-right:22px}
tbody tr:hover{background:var(--hov);cursor:pointer}
.ar{font-size:.85em;opacity:.35;margin-left:3px}
.ar.on{opacity:1}
.up{color:var(--up)}.dn{color:var(--dn)}
.sec{margin:22px 0 8px;scroll-margin-top:64px}
.sech{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin-bottom:8px}
.sech h3{font-size:17px;margin:0}
.sech .gtag{font-size:11.5px;color:var(--sub);border:1px solid var(--line);border-radius:10px;padding:1px 8px}
.stat{font-size:12.5px;color:var(--sub)}
.stat b{font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(330px,100%),1fr));gap:12px}
.card{min-width:0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px 10px;cursor:pointer;transition:border-color .15s}
.card:hover{border-color:var(--acc)}
.ch{display:flex;align-items:baseline;gap:8px}
.tk{font-weight:700;font-size:15px}
.nm{color:var(--sub);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.px{font-weight:600;font-size:13.5px;white-space:nowrap}
.desc{color:var(--sub);font-size:12px;margin:3px 0 6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em;line-height:1.3}
.img{width:100%;aspect-ratio:700/340;background:#fff;border-radius:6px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#888;font-size:12px}
.img img{width:100%;height:100%;object-fit:contain;display:block}
.spk{width:100%;aspect-ratio:700/340}
.kv{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:7px;font-size:12px;color:var(--sub)}
.kv span b{font-weight:600}
.trd{display:inline-block;font-size:11px;border-radius:8px;padding:0 7px;margin-left:2px;border:1px solid currentColor}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:none;align-items:center;justify-content:center;padding:16px}
.modal.on{display:flex}
.mbox{background:var(--card);border-radius:14px;width:min(1100px,100%);max-height:94vh;overflow:auto;padding:14px 16px}
.mh{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.mh .x{margin-left:auto;font-size:22px;cursor:pointer;color:var(--sub);background:none;border:0}
#mchart{width:100%;height:520px;margin-top:8px}
.mtools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.hint{font-size:11.5px;color:var(--sub)}
.mfin{margin-top:12px}
.mfin img{width:100%;max-width:900px;background:#fff;border-radius:6px}
.empty{color:var(--sub);padding:30px;text-align:center}
@media (max-width:600px){
 h1{font-size:19px}
 input[type=search]{width:120px}
 #mchart{height:400px}
 th,td{padding:7px 10px}
 .mbox{padding:12px}
}
</style>
</head>

  m.innerHTML=`<div class="box"><div class="tw"><table id="tb"><thead><tr>${TBC.map(([k,n,c])=>`<th class="${c||''}" data-k="${k}">${n}${arrow(TB,k)}</th>`).join('')}</tr></thead><tbody>${rows.map(i=>`<tr data-t="${i.t}"><td class="l"><b>${i.t}</b></td><td class="l" style="max-width:260px;overflow:hidden;text-overflow:ellipsis">${i.name||i.nm||''}</td><td class="l">${i.sec}</td><td>${px(i.px)}</td>${['d1','w1','m1','m3','m6','ytd','y1','hi'].map(k=>`<td>${pc(i[k])}</td>`).join('')}<td>${i.rng??'–'}%</td><td>${pc(i.s50)}</td><td>${pc(i.s200)}</td><td>${i.rsi??'–'}</td><td>${i.vr??'–'}</td></tr>`).join('')}</tbody></table></div></div>`;
  m.querySelectorAll('th').forEach(th=>th.onclick=()=>{sorter(TB,th.dataset.k);render()});
 }else{
  m.innerHTML=secs.map(s=>{let it=s.items.filter(i=>!qset||qset.has(s.sec+'|'+i.t));if(!it.length)return'';
   if(S.sort)it=[...it].sort((a,b)=>(b[S.sort]??-1e9)-(a[S.sort]??-1e9));
   return `<section class="sec" id="sec${s.ix}"><div class="sech"><h3>${s.sec}</h3><span class="gtag">${GN[s.g]}</span><span class="stat">중앙값 1D ${pc(s.med.d1)} · 1W ${pc(s.med.w1)} · 1M ${pc(s.med.m1)} · YTD ${pc(s.med.ytd)} · 50일선 위 <b>${s.a50}%</b> · 200일선 위 <b>${s.a200}%</b></span></div><div class="grid">${it.map(card).join('')}</div></section>`}).join('')||'<div class="empty">검색 결과 없음</div>';
 }
 m.querySelectorAll('[data-t]').forEach(el=>el.onclick=()=>openModal(el.dataset.t));
}
// 모달 차트
const CACHE={};let MC=null,MZ='1y',MP='d';
async function shard(g){if(!CACHE[g])CACHE[g]=fetch(`chartpack/${g}.json`).then(r=>r.json());return CACHE[g]}
const css=k=>getComputedStyle(document.documentElement).getPropertyValue(k).trim();
function smaArr(c,n){const o=[];let s=0;for(let i=0;i<c.length;i++){s+=c[i];if(i>=n)s-=c[i-n];o.push(i>=n-1?+(s/n).toFixed(4):null)}return o}
async function openModal(t){const i=ALL.find(x=>x.t===t);if(!i)return;S.t=t;saveHash();$('#modal').classList.add('on');
 $('#mtk').textContent=t;$('#mnm').textContent=[i.name||i.nm,i.desc].filter(Boolean).join(' — ');
 $('#mkv').innerHTML=`<span>가격 <b>${px(i.px)}</b></span><span>1D ${pc(i.d1,2)}</span><span>1W ${pc(i.w1)}</span><span>1M ${pc(i.m1)}</span><span>3M ${pc(i.m3)}</span><span>YTD ${pc(i.ytd)}</span><span>1Y ${pc(i.y1)}</span><span>52주 고점 ${pc(i.hi)}</span><span>50일선 ${pc(i.s50)}</span><span>200일선 ${pc(i.s200)}</span><span>RSI <b>${i.rsi??'–'}</b></span><span class="lbl">${i.sec}</span>`;
 $('#mlink').href=`https://finviz.com/quote.ashx?t=${encodeURIComponent(t)}`;
 const paintP=()=>{document.querySelectorAll('#mper button').forEach(b=>b.classList.toggle('on',b.dataset.v===MP));$('#mimg').src=fvUrl(t,MP,1000,480)};
 document.querySelectorAll('#mper button').forEach(b=>b.onclick=()=>{MP=b.dataset.v;paintP()});paintP();
 const el=$('#mchart');if(MC){MC.dispose();MC=null}
 let h;try{h=(await shard(i.g))[t]}catch(e){}
 if(!h){el.innerHTML='<div class="empty">일봉 데이터 없음</div>';return}
 el.innerHTML='';MC=echarts.init(el,null,{renderer:'canvas'});
 const up=css('--up'),dn=css('--dn'),ink=css('--ink'),sub=css('--sub'),line=css('--line');
 const n=h.d.length,K=h.d.map((_,k)=>[h.o[k],h.c[k],h.l[k],h.h[k]]);
 const MA=[[20,'#e0a400'],[50,'#e8590c'],[200,'#7b5cd6']];
 MC.setOption({animation:false,backgroundColor:'transparent',textStyle:{fontFamily:'Noto Sans KR'},
  legend:{top:0,textStyle:{color:sub,fontSize:12},data:['일봉','SMA20','SMA50','SMA200']},
  tooltip:{trigger:'axis',axisPointer:{type:'cross'},backgroundColor:css('--card'),borderColor:line,textStyle:{color:ink,fontSize:12},
   formatter:ps=>{const k=ps[0].dataIndex;const pv=k>0?h.c[k-1]:null;const ch=pv?(h.c[k]/pv-1)*100:null;
    return `<b>${h.d[k]}</b><br>시 ${px(h.o[k])} · 고 ${px(h.h[k])}<br>저 ${px(h.l[k])} · 종 <b>${px(h.c[k])}</b> ${pc(ch,2)}<br>`+ps.filter(p=>p.seriesName.startsWith('SMA')&&p.value!=null).map(p=>`${p.marker}${p.seriesName} ${px(p.value)}`).join('<br>')+`<br>거래량 ${h.v[k].toLocaleString()}`}},
  axisPointer:{link:[{xAxisIndex:'all'}]},
  grid:[{left:58,right:34,top:30,height:'62%'},{left:58,right:34,top:'76%',height:'14%'}],
  xAxis:[{type:'category',data:h.d,boundaryGap:true,axisLine:{lineStyle:{color:line}},axisLabel:{color:sub,fontSize:11},min:'dataMin',max:'dataMax'},
         {type:'category',gridIndex:1,data:h.d,axisLabel:{show:false},axisLine:{lineStyle:{color:line}},axisTick:{show:false}}],
  yAxis:[{scale:true,splitLine:{lineStyle:{color:line}},axisLabel:{color:sub,fontSize:11}},{gridIndex:1,scale:true,splitNumber:2,axisLabel:{show:false},splitLine:{show:false}}],
  dataZoom:[{type:'inside',xAxisIndex:[0,1],zoomOnMouseWheel:true,moveOnMouseMove:false},{type:'slider',xAxisIndex:[0,1],height:14,bottom:6,borderColor:line,textStyle:{color:sub}}],
  series:[{name:'일봉',type:'candlestick',data:K,itemStyle:{color:up,color0:dn,borderColor:up,borderColor0:dn}},
   ...MA.map(([p,c])=>({name:'SMA'+p,type:'line',data:smaArr(h.c,p),showSymbol:false,lineStyle:{width:1.3,color:c},itemStyle:{color:c}})),
   {name:'거래량',type:'bar',xAxisIndex:1,yAxisIndex:1,data:h.v.map((v,k)=>({value:v,itemStyle:{color:h.c[k]>=h.o[k]?up:dn,opacity:.55}}))}]});
 const zoomTo=z=>{MZ=z;document.querySelectorAll('#mz button').forEach(b=>b.classList.toggle('on',b.dataset.v===z));
  const days={'1m':21,'3m':63,'6m':126,'1y':252,all:n}[z]||n;MC.dispatchAction({type:'dataZoom',startValue:Math.max(0,n-days),endValue:n-1})};
 document.querySelectorAll('#mz button').forEach(b=>b.onclick=()=>zoomTo(b.dataset.v));zoomTo(MZ);
 // 드래그 확대/축소: 좌→우 = 선택 구간 확대, 우→좌 = 전체
 const zr=MC.getZr();let dg=null;const sel=document.createElement('div');
 sel.style.cssText=`position:absolute;display:none;background:${css('--shade')};border:1px solid ${css('--acc')};pointer-events:none;top:0;height:100%`;
 el.style.position='relative';el.appendChild(sel);
 zr.on('mousedown',e=>{dg={x:e.offsetX,moved:false}});
 zr.on('mousemove',e=>{if(!dg)return;if(Math.abs(e.offsetX-dg.x)>4)dg.moved=true;if(!dg.moved)return;const a=Math.min(dg.x,e.offsetX),b=Math.max(dg.x,e.offsetX);sel.style.display='block';sel.style.left=a+'px';sel.style.width=(b-a)+'px'});
 const fin=e=>{if(!dg)return;const d=dg;dg=null;sel.style.display='none';const x1=e.offsetX??d.x;if(!d.moved||Math.abs(x1-d.x)<8)return;
  if(x1<d.x){zoomTo('all');return}
  const a=MC.convertFromPixel({xAxisIndex:0},d.x),b=MC.convertFromPixel({xAxisIndex:0},x1);const s=Math.max(0,Math.min(a,b)),en=Math.min(n-1,Math.max(a,b));
  if(en-s<3)return;document.querySelectorAll('#mz button').forEach(x=>x.classList.remove('on'));MC.dispatchAction({type:'dataZoom',startValue:s,endValue:en})};
 zr.on('mouseup',fin);zr.on('globalout',e=>{if(dg&&dg.moved)fin(e);else dg=null});
}
function closeModal(){$('#modal').classList.remove('on');S.t='';saveHash();if(MC){MC.dispose();MC=null}}
$('#mx').onclick=closeModal;$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
addEventListener('resize',()=>MC&&MC.resize());
renderOv();render();if(S.t)openModal(S.t);
</script>
