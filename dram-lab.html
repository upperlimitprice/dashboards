<script>
const SER=JSON.parse(document.getElementById('ser').textContent);
const KEYS=['DDR4 16Gb','DDR5 16Gb','NAND 512Gb TLC'];
function scale(w,h,l,r,t,b,logY){
  const all=KEYS.flatMap(k=>SER[k].map(p=>p[1]));
  const t0=new Date(SER['DDR4 16Gb'][0][0]).getTime(), t1=new Date(SER['DDR4 16Gb'].slice(-1)[0][0]).getTime();
  let mn=Math.min(...all), mx=Math.max(...all);
  if(logY){mn=Math.log10(mn*0.9);mx=Math.log10(mx*1.1);}else{mn=0;mx*=1.08;}
  const X=d=>l+(w-l-r)*((new Date(d).getTime()-t0)/(t1-t0));
  const Y=v=>{const vv=logY?Math.log10(v):v;return t+(h-t-b)*(1-(vv-mn)/(mx-mn));};
  return {X,Y,mn,mx};
}
function path(k,X,Y){return SER[k].map((p,i)=>(i?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)).join('');}
function area(k,X,Y,y0){const pts=SER[k];return 'M'+X(pts[0][0]).toFixed(1)+' '+y0+SER[k].map(p=>'L'+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)).join('')+'L'+X(pts[pts.length-1][0]).toFixed(1)+' '+y0+'Z';}
function last(k){return SER[k].slice(-1)[0][1];}
function yrTicks(X,h,b,fill,fs){
  let s='';['2022','2023','2024','2025','2026'].forEach(y=>{
    s+=`<text x='${X(y+'-01-05').toFixed(1)}' y='${h-b+18}' font-size='${fs||10}' fill='${fill}' text-anchor='middle'>${y}</text>`;});
  return s;
}
const V=[];
// ─── 1. 블룸버그 터미널
V.push({t:'터미널 다크 (블룸버그 무드)',d:'순검정 + 앰버/시안 모노라인, 라스트 프라이스 태그, 격자 최소',f:()=>{
  const w=1020,h=380,l=14,r=110,t=30,b=34;
  const {X,Y}=scale(w,h,l,r,t,b,true);
  const C={'DDR4 16Gb':'#ffb400','DDR5 16Gb':'#00e5ff','NAND 512Gb TLC':'#7fff9e'};
  let s=`<svg viewBox='0 0 ${w} ${h}' style='background:#000'>`;
  for(const g of [1,3,10,30,90]){const y=Y(g);if(y<t||y>h-b)continue;
    s+=`<line x1='${l}' y1='${y}' x2='${w-r}' y2='${y}' stroke='#1c1c1c'/><text x='${w-r+6}' y='${y+3}' font-size='9' fill='#555' font-family='monospace'>${g}</text>`;}

    const y=Y(last(k));
    s+=`<rect x='${w-r+22}' y='${y-9}' width='72' height='17' fill='${C[k]}'/><text x='${w-r+27}' y='${y+4}' font-size='10.5' fill='#000' font-family='monospace' font-weight='700'>${last(k).toFixed(1)}</text>`;});

    const y=Y(last(k));
    s+=`<circle cx='${(w-r).toFixed(1)}' cy='${y}' r='3.2' fill='${C[k]}'/>`;

  s+=`<defs><filter id='glow'><feGaussianBlur stdDeviation='3.2' result='b'/><feMerge><feMergeNode in='b'/><feMergeNode in='SourceGraphic'/></feMerge></filter>
  <linearGradient id='gA' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='#ffcf5c' stop-opacity='.28'/><stop offset='1' stop-color='#ffcf5c' stop-opacity='0'/></linearGradient></defs>`;

  s+=`<path d='${area('DDR4 16Gb',X,Y,h-b)}' fill='url(#gA)'/>`;
  KEYS.forEach(k=>{s+=`<path d='${path(k,X,Y)}' fill='none' stroke='${C[k]}' stroke-width='2.2' filter='url(#glow)'/>`;});

  s+=yrTicks(X,h,b,'#5d6da0',10);
  return s+'</svg>';}});

  let s=`<svg viewBox='0 0 ${w} ${h}' style='background:#fbfbf9'>`;
  s+=`<text x='${l}' y='26' font-size='11' fill='#9aa2ab' letter-spacing='3' font-weight='600'>MEMORY SPOT · USD</text>`;
  KEYS.forEach(k=>{s+=`<path d='${path(k,X,Y)}' fill='none' stroke='${C[k]}' stroke-width='1.3'/>`;
    const y=Y(last(k));
    s+=`<circle cx='${(w-r).toFixed(1)}' cy='${y}' r='4' fill='${C[k]}'/>`;

  s+=`<line x1='${l}' y1='${h-b}' x2='${w-r}' y2='${h-b}' stroke='#d8dce0'/>`;
  s+=yrTicks(X,h,b,'#b6bcc3',9.5);

// ─── 5. 이코노미스트
V.push({t:'이코노미스트 스타일',d:'상단 레드바 + 좌상단 볼드 타이틀 + 시그니처 격자·우측 값 라벨',f:()=>{
  const w=1020,h=400,l=16,r=120,t=76,b=34;
  const {X,Y}=scale(w,h,l,r,t,b,false);
  const C={'DDR4 16Gb':'#e3120b','DDR5 16Gb':'#006ba2','NAND 512Gb TLC':'#3ebcd2'};
  let s=`<svg viewBox='0 0 ${w} ${h}' style='background:#ffffff'>`;

  for(let g=0;g<=4;g++){const y=t+(h-t-b)*(1-g/4);const v=(g*scale(w,h,l,r,t,b,false).mx/4);
