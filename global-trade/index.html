<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Global Export Tracker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js"></script>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1c2430;--sub:#6b7480;--line:#e3e6ea;--acc:#2563eb;--up:#d63c3c;--dn:#2f6fd6;--pos:#1a9e5c;--neg:#d63c3c}
@media (prefers-color-scheme: dark){:root{--bg:#0f1318;--card:#171c23;--ink:#e6eaf0;--sub:#98a2b3;--line:#2a313b;--acc:#5b8cff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Pretendard,"Malgun Gothic",sans-serif;padding:16px 16px 40px}
h1{font-size:20px;margin:0 0 4px}.sub{color:var(--sub);font-size:12px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}.row>div{display:flex;flex-direction:column;gap:4px}
label{font-size:11px;color:var(--sub)}select,input,button,textarea{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
button{cursor:pointer}button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}button.sm{padding:4px 9px;font-size:12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.tabs button{border-radius:20px;padding:6px 14px}.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.subtabs button{border-radius:8px;padding:5px 12px}.subtabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0}.tile{background:var(--bg);border-radius:10px;padding:10px 12px}.tile .k{font-size:11px;color:var(--sub)}.tile .v{font-size:18px;font-weight:600;margin-top:2px}
.up{color:var(--up)}.dn{color:var(--dn)}
.chart{width:100%;height:380px}.chart.tall{height:520px}.chart.mini{height:220px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
.toggles{display:flex;flex-wrap:wrap;gap:12px;margin:8px 0;font-size:12px}.toggles label{color:var(--ink);display:flex;gap:4px;align-items:center;font-size:12px}
.tblwrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:8px 16px 8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:right}th:first-child,td:first-child,th.l,td.l{text-align:left}th{cursor:pointer;user-select:none;color:var(--sub);font-weight:600}th .ar{font-size:10px;margin-left:3px;color:var(--sub)}
tr:hover td{background:rgba(37,99,235,.05)}td.hs{font-family:ui-monospace,Menlo,monospace;cursor:pointer;color:var(--acc)}
.dd{position:absolute;background:var(--card);border:1px solid var(--line);border-radius:8px;max-height:280px;overflow:auto;z-index:20;min-width:320px;box-shadow:0 8px 24px rgba(0,0,0,.12)}.dd div{padding:6px 10px;cursor:pointer;font-size:12px}.dd div:hover{background:rgba(37,99,235,.08)}
.spark{width:90px;height:22px;display:inline-block;vertical-align:middle}
.crumb{font-size:12px;color:var(--sub);margin:4px 0 8px}.crumb span{cursor:pointer;color:var(--acc)}
.muted{color:var(--sub);font-size:12px}[hidden]{display:none!important}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:4px 10px;font-size:12px;margin:3px 4px 3px 0}.chip b{font-family:ui-monospace,Menlo,monospace}.chip .x{cursor:pointer;color:var(--sub)}
.star{cursor:pointer;font-size:18px;color:#c9cdd3;user-select:none}.star.on{color:#f5b301}
.badge{display:inline-block;font-size:10px;padding:1px 6px;border-radius:10px;background:var(--bg);border:1px solid var(--line);color:var(--sub);margin-left:4px}
.hm{border-collapse:collapse;font-size:11px}.hm th,.hm td{padding:3px 6px;border:1px solid var(--line);text-align:center;white-space:nowrap}.hm td.n{text-align:left;max-width:260px;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.homecards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.hc{background:var(--bg);border-radius:10px;padding:10px 12px}.hc h4{margin:0 0 6px;font-size:13px}.hc div.r{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;border-bottom:1px dashed var(--line);cursor:pointer}
@media (max-width:480px){body{padding:12px 16px 30px}.chart{height:300px}}
</style>
</head>
<body>
<h1>🧅 Global Export Tracker</h1>
<div class="sub" id="genInfo">데이터 로딩 중…</div>

<div class="card">
  <div class="row">
    <div><label>수집국</label><select id="origin"></select></div>
    <div><label>방향</label><select id="flow"><option value="X">수출</option><option value="M">수입</option></select></div>
    <div style="position:relative;flex:1;min-width:260px"><label>HS코드 / 품목명</label><input id="hsq" placeholder="예: 854232, 메모리, memory" autocomplete="off"><div class="dd" id="dd" hidden></div></div>
    <div><label>&nbsp;</label><button class="pri" id="go">조회</button></div>
    <div><label>&nbsp;</label><button id="addCond" title="현재 조건을 합산 목록에 추가">+ 조건 추가</button></div>
  </div>
  <div class="tabs" style="margin-top:12px">
    <button data-tab="home" class="on">🏠 홈</button><button data-tab="series">📈 시계열</button><button data-tab="combined">➕ 합산</button><button data-tab="surge">🚀 급등 탐색</button><button data-tab="treemap">🗺️ 트리맵/히트맵</button><button data-tab="partner">🌏 상대국</button><button data-tab="hs">🔍 HS코드</button><button data-tab="ppi">📊 PPI</button><button data-tab="my">⭐ 마이페이지</button>
  </div>
</div>

<!-- 홈 -->
<div class="card" id="p-home">
  <div class="row"><div><label>글로벌 수출입 트리맵 · 박스 = 최신월 금액, 색 = YoY(±30% 클리핑)</label></div><div class="subtabs" style="flex-direction:row;gap:6px"><button id="homeX" class="on">수출</button><button id="homeM">수입</button></div><div class="muted" id="homeInfo"></div></div>
  <div class="chart" id="cHome" style="height:300px"></div>
</div>
<div class="card" id="p-home2">
  <div class="row"><div><label>🚀 급등 품목 TOP 5 (3M 평균 ≥ 5M$)</label></div><div><select id="homeSort"><option value="mom">MoM</option><option value="yoy">YoY</option><option value="yoy3">3M YoY</option></select></div></div>
  <div class="homecards" id="homeSurge"></div>
</div>
<div class="card" id="p-home3">
  <div class="row"><div><label>📊 PPI 상승 품목 TOP 5 (YoY)</label></div></div>
  <div class="homecards" id="homePpi"></div>
</div>

<!-- 시계열 -->
<div class="card" id="p-series" hidden>
  <div style="display:flex;justify-content:space-between;align-items:center"><div id="title" style="font-weight:600"></div><div><span class="star" id="favSeries" title="관심 품목">☆</span></div></div>
  <div class="tiles" id="tiles"></div>
  <div class="toggles">
    <label><input type="checkbox" id="tAmt" checked>금액</label><label><input type="checkbox" id="tKg">중량</label><label><input type="checkbox" id="tUp">단가</label>
    <label><input type="checkbox" id="t3m">3M 평균</label><label><input type="checkbox" id="tYoy">YoY 모드</label>
  </div>
  <div class="chart" id="cSeries"></div>
  <details style="margin-top:8px"><summary class="muted">데이터 테이블 · <a href="#" id="csv">CSV 내보내기</a></summary><div class="tblwrap"><table id="tbl"></table></div></details>
</div>

<!-- 합산 -->
<div class="card" id="p-combined" hidden>
  <div class="row"><div><label>합산 조건 (시계열 탭에서 "+ 조건 추가")</label><div id="condChips"></div></div>
    <div><label>&nbsp;</label><button id="condClear">전체 지우기</button></div>
    <div><label>합산 프리셋</label><select id="condPreset"><option value="">-- 불러오기 --</option></select></div>
    <div><label>&nbsp;</label><button id="condSave">★ 프리셋 저장</button></div>
    <div><label>&nbsp;</label><button id="condDel">× 삭제</button></div></div>
  <div class="tiles" id="condTiles"></div>
  <div class="chart" id="cComb"></div>
  <div class="grid2">
    <div><div class="muted">금액 YoY (%)</div><div class="chart mini" id="cComb1"></div></div>
    <div><div class="muted">비중 (%)</div><div class="chart mini" id="cComb2"></div></div>
    <div><div class="muted">중량 (t)</div><div class="chart mini" id="cComb3"></div></div>
    <div><div class="muted">단가 ($/kg)</div><div class="chart mini" id="cComb4"></div></div>
    <div><div class="muted">3M 평균 금액 (USD K)</div><div class="chart mini" id="cComb5"></div></div>
  </div>
</div>

<!-- 급등 -->
<div class="card" id="p-surge" hidden>
  <div class="row">
    <div><label>정렬</label><select id="sSort"><option value="yoy">YoY</option><option value="mom">MoM</option><option value="qoq">QoQ</option><option value="yoy3">3M 누적 YoY</option><option value="v">금액</option></select></div>
    <div><label>HS 접두</label><input id="sHs" placeholder="예: 85, 8542" style="width:110px"></div>
    <div><label>자릿수</label><select id="sLen"><option value="">전체</option><option>6</option><option>8</option><option>9</option><option>10</option><option>11</option></select></div>
    <div><label>3M 평균 하한 (USD K)</label><input id="sMin" type="number" value="1000" style="width:120px"></div>
    <div><label>가속 횟수 ≥</label><input id="sAcc" type="number" value="0" style="width:80px"></div>
    <div><label>MoM ≥ %</label><input id="sMom" type="number" style="width:80px"></div>
    <div><label>QoQ ≥ %</label><input id="sQoq" type="number" style="width:80px"></div>
    <div><label>&nbsp;</label><button class="pri" id="sGo">검색</button></div>
    <div><label>프리셋</label><select id="sPreset"><option value="">-- 불러오기 --</option></select></div>
    <div><label>&nbsp;</label><button id="sPresetSave">저장</button></div><div><label>&nbsp;</label><button id="sPresetDel">× 삭제</button></div>
  </div>
  <div class="muted" id="sInfo" style="margin:8px 0"></div>
  <div class="tblwrap"><table id="sTbl"></table></div>
</div>

<!-- 트리맵/히트맵 -->
<div class="card" id="p-treemap" hidden>
  <div class="row">
    <div class="subtabs" style="flex-direction:row;gap:6px"><button id="tmTabTree" class="on">트리맵</button><button id="tmTabHeat">히트맵</button></div>
    <div><label>색상</label><select id="tmMode"><option value="yoy">금액 YoY</option><option value="up">단가 YoY</option><option value="v">금액 규모</option></select></div>
    <div><label>변화율 기준</label><select id="tmYoyMode"><option value="1m">월별</option><option value="3m">3M</option></select></div>
    <div id="hmCtl" hidden style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end"><div><label>Top N</label><select id="hmTop"><option>30</option><option selected>50</option><option>80</option></select></div><div><label>최소 금액 (USD K/월)</label><input id="hmMin" type="number" value="1000" style="width:110px"></div><div><label>&nbsp;</label><label style="font-size:12px"><input type="checkbox" id="hmDual"> 월별·3M 동반 상승만</label></div><div><label>기준월</label><select id="hmMonth"></select></div></div>
    <div class="muted" id="tmInfo" style="padding-bottom:8px"></div>
  </div>
  <div id="treeWrap"><div class="crumb" id="crumb"></div><div class="chart tall" id="cTree"></div></div>
  <div id="heatWrap" hidden class="tblwrap"></div>
</div>

<!-- 상대국 -->
<div class="card" id="p-partner" hidden>
  <div id="pTitle" style="font-weight:600"></div>
  <div class="muted" id="pInfo"></div>
  <div class="chart" id="cPartner"></div>
  <div class="tblwrap"><table id="pTbl"></table></div>
</div>

<!-- HS 검색 -->
<div class="card" id="p-hs" hidden>
  <div class="row"><div><label>수집국</label><select id="hsOrigin"><option value="">전체</option></select></div><div style="flex:1;min-width:260px"><label>코드 / 한글·영문 품목명</label><input id="hsSearch" placeholder="예: 854232, 메모리, lithium"></div><div><label>&nbsp;</label><button class="pri" id="hsGo">검색</button></div></div>
  <div class="muted" id="hsInfo" style="margin:8px 0"></div>
  <div class="tblwrap"><table id="hsTbl"></table></div>
</div>

<!-- PPI -->
<div class="card" id="p-ppi" hidden>
  <div class="row" style="align-items:flex-end">
    <div><label>국가</label><select id="ppiCountry"></select></div>
    <div><label>보기</label><div class="subtabs" style="display:flex;gap:6px"><button data-pv="grid" class="on">카드</button><button data-pv="surge">급등 탐색</button></div></div>
    <div><label>정렬</label><select id="ppiSort"><option value="yoy_desc">YoY% 높은순</option><option value="yoy_asc">YoY% 낮은순</option><option value="mom_desc">MoM% 높은순</option><option value="mom_asc">MoM% 낮은순</option><option value="qoq_desc">QoQ% 높은순</option><option value="yoy_abs">절대값 급변 (|YoY|)</option><option value="name">시리즈명순</option></select></div>
    <div style="flex:1;min-width:200px"><label>검색</label><input id="ppiQ" placeholder="시리즈명 / ID"></div>
    <div><label>급등락 임계 |YoY| ≥</label><input id="ppiTh" type="number" value="10" style="width:80px"></div>
    <div><label>&nbsp;</label><label style="font-size:12px"><input type="checkbox" id="ppiHl"> 급등락만</label></div>
    <div><label>&nbsp;</label><label style="font-size:12px"><input type="checkbox" id="ppiFav"> 즐겨찾기만</label></div>
    <div><label>&nbsp;</label><label style="font-size:12px"><input type="checkbox" id="ppiLive" checked> 중단 시리즈 제외(6개월+)</label></div>
  </div>
  <div class="row" id="ppiSurgeRow" hidden style="margin-top:6px">
    <div><label>가속 횟수 ≥ (최근 6개월 MoM 양수)</label><input id="ppiAcc" type="number" value="0" min="0" max="6" style="width:80px"></div>
    <div><label>YoY ≥ %</label><input id="ppiMinYoy" type="number" style="width:80px"></div>
    <div><label>MoM ≥ %</label><input id="ppiMinMom" type="number" style="width:80px"></div>
    <div><label>QoQ ≥ %</label><input id="ppiMinQoq" type="number" style="width:80px"></div>
    <div><label>프리셋</label><select id="ppiPreset"><option value="">-- 불러오기 --</option></select></div>
    <div><label>&nbsp;</label><button id="ppiPresetSave">저장</button></div><div><label>&nbsp;</label><button id="ppiPresetDel">× 삭제</button></div>
  </div>
  <div id="ppiCats" class="subtabs" style="display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px"></div>
  <div class="muted" id="ppiInfo" style="margin:6px 0 10px"></div>
  <div id="ppiGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px"></div>
  <div class="tblwrap" id="ppiTblWrap" hidden><table id="ppiTbl"></table></div>
  <div class="muted" style="margin-top:8px"><button id="ppiMore">더 보기</button></div>
</div>
<div id="ppiModal" hidden style="position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px">
  <div class="card" style="width:min(1000px,100%);max-height:92vh;overflow:auto;margin:0"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><div id="ppiMTitle" style="font-weight:600"></div><div style="display:flex;gap:6px;align-items:center"><div class="subtabs" id="ppiPeriod" style="display:flex;gap:4px"><button data-y="3" class="on">3년</button><button data-y="5">5년</button><button data-y="10">10년</button><button data-y="0">전체</button></div><span class="star" id="ppiMFav">☆</span> <button id="ppiMClose">×</button></div></div><div class="muted" id="ppiMSub" style="margin:4px 0 8px"></div><div class="tiles" id="ppiMTiles"></div><div class="chart" id="cPpi"></div><div class="muted" style="margin-top:6px">막대 = YoY%, 선 = 지수. 드래그 확대 · 슬라이더 기간 조절 · 종목 오버레이는 가격 데이터 미연동으로 제공하지 않음.</div></div>
</div>

<!-- 마이페이지 -->
<div class="card" id="p-my" hidden>
  <div class="subtabs" style="display:flex;gap:6px;margin-bottom:10px"><button data-my="trade" class="on">무역 품목</button><button data-my="cond">합산 프리셋</button><button data-my="ppi">PPI</button></div>
  <div class="muted" id="myInfo" style="margin-bottom:8px"></div>
  <div id="myList"></div>
</div>

<script>
const $=s=>document.querySelector(s);
const fmt=n=>n==null?'-':Math.round(n).toLocaleString();
const fk=n=>n==null?'-':'$'+Math.round(n/1000).toLocaleString()+'K';
const fb=n=>n==null?'-':(Math.abs(n)>=1e9?'$'+(n/1e9).toFixed(2)+'B':Math.abs(n)>=1e6?'$'+(n/1e6).toFixed(1)+'M':'$'+Math.round(n/1e3).toLocaleString()+'K');
const fp=n=>n==null?'-':(n>0?'+':'')+n.toFixed(1)+'%';
const cls=n=>n==null?'':(n>0?'up':n<0?'dn':'');
const arrow=n=>n==null?'':(n>0?'🔺':n<0?'🔽':'');
const FLOWK={X:'수출',M:'수입'};
let META,ORIGIN='',FLOW='X',SER,NAMES,SURGE,TREE,curHs='',PPI=null;
const charts={};
function ch(id){if(!charts[id])charts[id]=echarts.init(document.getElementById(id),null,{renderer:'canvas'});return charts[id]}
window.addEventListener('resize',()=>Object.values(charts).forEach(c=>c.resize()));
const dark=matchMedia('(prefers-color-scheme: dark)').matches;const txt=dark?'#e6eaf0':'#1c2430';
const base={textStyle:{color:txt},tooltip:{trigger:'axis',axisPointer:{type:'cross'}},toolbox:{feature:{dataZoom:{yAxisIndex:'none',title:{zoom:'드래그 확대',back:'되돌리기'}},restore:{title:'초기화'},saveAsImage:{title:'저장'}}},dataZoom:[{type:'inside'},{type:'slider',height:18,bottom:6}],grid:{left:70,right:80,top:60,bottom:70}};
const miniBase={textStyle:{color:txt},tooltip:{trigger:'axis'},grid:{left:55,right:20,top:24,bottom:28}};
// ── 로컬 저장 (즐겨찾기·프리셋·메모)
const LS={get:k=>{try{return JSON.parse(localStorage.getItem('gx_'+k)||'null')}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem('gx_'+k,JSON.stringify(v))}catch(e){}}};
const FAV=LS.get('fav')||{trade:{},ppi:{}};const NOTES=LS.get('notes')||{};function saveFav(){LS.set('fav',FAV);LS.set('notes',NOTES)}
const favKey=(o,f,h)=>`${o}|${f}|${h}`;
async function j(u){const r=await fetch(u+'?v='+Date.now());if(!r.ok)throw new Error(u);return r.json()}

// ── 초기화
async function init(){
  META=await j('data/meta.json');
  const os=Object.keys(META.origins);
  $('#origin').innerHTML=os.map(o=>`<option value="${o}">${META.origins[o].label} (${META.origins[o].months[0]}~${META.origins[o].months[1]})</option>`).join('');
  $('#hsOrigin').innerHTML='<option value="">전체</option>'+os.map(o=>`<option value="${o}">${META.origins[o].label}</option>`).join('');
  $('#genInfo').textContent=`생성 ${META.generated} · 수집국 ${os.length}개 · 월별, 금액 USD`;
  const pc=Object.keys(META.ppi||{});
  $('#ppiCountry').innerHTML=pc.map(c=>`<option value="${c}">${META.ppi[c].label} (${META.ppi[c].n}개, ${META.ppi[c].latest||''})</option>`).join('');
  $('#ppiCountry').onchange=e=>loadPpi(e.target.value);
  renderHome();
  await loadOrigin(os.includes('US')?'US':os[0]);
  loadCondPresets();loadSurgePresets();
}
async function loadOrigin(o,flow){
  ORIGIN=o;$('#origin').value=o;const flows=META.origins[o].flows||['X'];
  $('#flow').innerHTML=flows.map(f=>`<option value="${f}">${FLOWK[f]}</option>`).join('');

function ppiParams(){return{acc:$('#ppiAcc').value,yoy:$('#ppiMinYoy').value,mom:$('#ppiMinMom').value,qoq:$('#ppiMinQoq').value,th:$('#ppiTh').value,hl:$('#ppiHl').checked,g:ppiGrp}}
function loadPpiPresets(){const p=LS.get('ppiPresets')||{};$('#ppiPreset').innerHTML='<option value="">-- 불러오기 --</option>'+Object.keys(p).map(k=>`<option>${k}</option>`).join('')}
$('#ppiPreset').onchange=e=>{const p=(LS.get('ppiPresets')||{})[e.target.value];if(!p)return;$('#ppiAcc').value=p.acc;$('#ppiMinYoy').value=p.yoy;$('#ppiMinMom').value=p.mom;$('#ppiMinQoq').value=p.qoq;$('#ppiTh').value=p.th;$('#ppiHl').checked=!!p.hl;ppiGrp=p.g||'';if(PPI)renderPpiCats();renderPpi()};
$('#ppiPresetSave').onclick=()=>{const n=prompt('프리셋 이름');if(!n)return;const p=LS.get('ppiPresets')||{};p[n]=ppiParams();LS.set('ppiPresets',p);loadPpiPresets();$('#ppiPreset').value=n};
$('#ppiPresetDel').onclick=()=>{const n=$('#ppiPreset').value;if(!n)return;const p=LS.get('ppiPresets')||{};delete p[n];LS.set('ppiPresets',p);loadPpiPresets()};
loadPpiPresets();

// ── 마이페이지
let myTab='trade';
document.querySelectorAll('[data-my]').forEach(b=>b.onclick=()=>{myTab=b.dataset.my;document.querySelectorAll('[data-my]').forEach(x=>x.classList.toggle('on',x===b));renderMy()});
async function renderMy(){
  const el=$('#myList');
  if(myTab==='trade'){const ks=Object.keys(FAV.trade);$('#myInfo').textContent=`관심 무역 품목 ${ks.length}개 · 클릭 = 시계열 · 메모는 자동 저장`;
    const rows=await Promise.all(ks.map(async k=>{const f=FAV.trade[k];let s=null,months=null;try{const d=await getSeries(f.o,f.f);s=d.series[f.hs];months=d.months}catch(e){}const L=s?s.v.length-1:0;const y=s?yoy(s.v)[L]:null;return{k,f,s,L,y,m:months?months[L]:''}}));
    el.innerHTML=rows.map(r=>`<div class="tile" style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><div style="cursor:pointer" data-o="${r.f.o}" data-h="${r.f.hs}" data-f="${r.f.f}"><b style="font-family:ui-monospace,Menlo,monospace">${r.f.hs}</b> ${r.f.name.slice(0,40)} <span class="badge">${META.origins[r.f.o]?META.origins[r.f.o].label:r.f.o} ${FLOWK[r.f.f]}</span></div><div>${r.s?`<span class="muted">${r.m}</span> <b>${fk(r.s.v[r.L])}</b> <span class="${cls(r.y)}">${fp(r.y)}</span>`:''} <canvas class="spark" data-s="${r.s?r.s.v.slice(-12).map(v=>v??'').join('|'):''}"></canvas> <button class="sm" data-del="${r.k}">🗑</button></div></div><textarea data-note="${r.k}" placeholder="메모" style="width:100%;margin-top:6px;min-height:36px">${NOTES[r.k]||''}</textarea></div>`).join('')||'<div class="muted">시계열·급등 탐색에서 ★를 눌러 추가하세요.</div>';
    drawSparks(el);el.querySelectorAll('[data-h]').forEach(d=>d.onclick=()=>gotoHs(d.dataset.o,d.dataset.h,d.dataset.f));
  }else if(myTab==='cond'){const p=LS.get('condPresets')||{};$('#myInfo').textContent=`합산 프리셋 ${Object.keys(p).length}개`;
    el.innerHTML=Object.entries(p).map(([n,c])=>`<div class="tile" style="margin-bottom:8px"><div style="display:flex;justify-content:space-between"><b>${n}</b><span><button class="sm" data-load="${n}">불러오기</button> <button class="sm" data-delp="${n}">🗑</button></span></div><div class="muted">${c.map(x=>`${META.origins[x.o]?META.origins[x.o].label:x.o} ${x.hs}`).join(' · ')}</div></div>`).join('')||'<div class="muted">합산 탭에서 저장하세요.</div>';
    el.querySelectorAll('[data-load]').forEach(b=>b.onclick=()=>{COND=JSON.parse(JSON.stringify(p[b.dataset.load]));LS.set('cond',COND);showTab('combined')});
    el.querySelectorAll('[data-delp]').forEach(b=>b.onclick=()=>{delete p[b.dataset.delp];LS.set('condPresets',p);loadCondPresets();renderMy()});
  }else{const ks=Object.keys(FAV.ppi);$('#myInfo').textContent=`관심 PPI ${ks.length}개`;
    el.innerHTML=ks.map(k=>{const f=FAV.ppi[k];return `<div class="tile" style="margin-bottom:8px"><div style="display:flex;justify-content:space-between"><span><span class="badge">${(META.ppi[f.c]||{}).label||f.c}</span> ${f.t.slice(0,60)} <span class="muted">${f.id}</span></span><button class="sm" data-del="${k}">🗑</button></div><textarea data-note="${k}" placeholder="메모" style="width:100%;margin-top:6px;min-height:36px">${NOTES[k]||''}</textarea></div>`}).join('')||'<div class="muted">PPI 탭에서 ★를 눌러 추가하세요.</div>';
  }
  el.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const k=b.dataset.del;delete FAV.trade[k];delete FAV.ppi[k];delete NOTES[k];saveFav();renderMy()});
  el.querySelectorAll('[data-note]').forEach(t=>t.oninput=()=>{NOTES[t.dataset.note]=t.value;saveFav()});
}
init().catch(e=>{$('#genInfo').textContent='로드 실패: '+e.message});
</script>
</body>
</html>
