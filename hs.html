const TABS={
 up:{list:()=>rows.filter(r=>r.yoy3!=null&&r.lv>=1e5).sort((a,b)=>b.yoy3-a.yoy3).slice(0,40)},
 dn:{list:()=>rows.filter(r=>r.yoy3!=null&&r.lv>=1e5).sort((a,b)=>a.yoy3-b.yoy3).slice(0,40)},
 hi:{list:()=>rows.filter(r=>r.hi&&r.nm>=13).sort((a,b)=>(b.yoy3??-999)-(a.yoy3??-999)).slice(0,40)},
 sz:{list:()=>rows.slice().sort((a,b)=>b.lv-a.lv).slice(0,40)}};
function rowTip(k){
  const e=HS[k],ms=Object.keys(e.series).sort().slice(-4);
  return `<b>${e.label}</b><br>`+ms.map(m=>`${m}: ${fmt(e.series[m])}`).join('<br>');}
function showTab(t){
  document.querySelectorAll('#tabs .tab').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  document.getElementById('tabc').innerHTML='<table><tr>'+base.map(c=>`<th>${c[0]}</th>`).join('')
    +'</tr>'+TABS[t].list().map(r=>`<tr class='rowc' data-k='${r.k}' onclick='show(this.dataset.k)'>`
    +base.map(c=>`<td>${c[1](r)}</td>`).join('')+'</tr>').join('')+'</table>';
  document.querySelectorAll('#tabc tr.rowc').forEach(tr=>{
    tr.addEventListener('mousemove',ev=>tShow(rowTip(tr.dataset.k),ev));
    tr.addEventListener('mouseleave',tHide);});
}
showTab('up');
const q=document.getElementById('q'),sug=document.getElementById('sug');
q.addEventListener('input',()=>{
  const v=q.value.trim();sug.innerHTML='';
  if(!v)return;
  const hits=rows.filter(r=>r.n.includes(v)).slice(0,14);
  sug.innerHTML=hits.map(r=>`<li onclick='show("${r.k.replace(/"/g,'&quot;')}")'>${r.n}</li>`).join('');
});
function show(k){
  const e=HS[k],ms=Object.keys(e.series).sort(),n=ms.length;
  const r=rows.find(x=>x.k===k);
  document.getElementById('cname').textContent=e.label+' — 월별 수출액';
  document.getElementById('cstats').innerHTML=
    `최근 ${r.last} <b>${fmt(r.lv)}</b>${r.hi?' 🏆<b style="color:#d63c2f">월 수출 사상 최대</b>':''} · YoY ${r.yoy!=null?pc(r.yoy):'-'} · 최근 3개월 YoY ${r.yoy3!=null?pc(r.yoy3):'-'} · ${n}개월`
    +(e.hs?` · <small class='gray'>HS ${e.hs}${e.region?' · '+e.region:''}</small>`:'');
  const W=980,H=230,L=56,B=26,T=12,R=8;
  const vals=ms.map(m=>e.series[m]),mx=Math.max(...vals)*1.1;
  const X=i=>L+(W-L-R)*(n===1?0.5:i/(n-1)),bw=Math.max(2,Math.min(16,(W-L-R)/n*0.7));
  let s=`<svg id='hssvg' viewBox='0 0 ${W} ${H}' style='width:100%;background:#fbfcfe;border:1px solid #e3e9ef;border-radius:8px'>`;
  for(let g=1;g<=3;g++){const y=T+(H-T-B)*g/3;
    s+=`<line x1='${L}' y1='${y}' x2='${W-R}' y2='${y}' stroke='#eef1f5'/>`;
    s+=`<text x='${L-4}' y='${T+(H-T-B)*(1-g/3)+4}' font-size='9' fill='#8a94a0' text-anchor='end'>${fmt(mx*g/3)}</text>`;}
  ms.forEach((m,i)=>{
    const v=vals[i],py=e.series[(+m.slice(0,4)-1)+m.slice(4)];
    const up=py!=null?v>=py:null;
    const y=T+(H-T-B)*(1-v/mx);
    s+=`<rect x='${(X(i)-bw/2).toFixed(1)}' y='${y.toFixed(1)}' width='${bw.toFixed(1)}' height='${(H-B-y).toFixed(1)}' fill='${up===null?'#8a97a5':up?'#c0392b':'#2660c4'}' opacity='0.85'/>`;
    if(i%6===n%6)s+=`<text x='${X(i).toFixed(1)}' y='${H-10}' font-size='8' fill='#8a94a0' text-anchor='middle'>${m.slice(2,7)}</text>`;});
  s+='</svg>';
  document.getElementById('chart').innerHTML=s
    +"<p style='font-size:.74rem;color:#889;margin:5px 0 0'>막대 색: 전년 동월 대비 증가=빨강 · 감소=파랑 · 회색=비교불가 · 마우스 올리면 월별 수치</p>";
  const svg=document.getElementById('hssvg');
  svg.addEventListener('mousemove',ev=>{
    const rc=svg.getBoundingClientRect();
    const vx=(ev.clientX-rc.left)*W/rc.width;
    const i=Math.max(0,Math.min(n-1,Math.round((vx-L)/((W-L-R)/(n-1)))));
    const m=ms[i],v=e.series[m],py=e.series[(+m.slice(0,4)-1)+m.slice(4)];
    let h=`<b>${m}</b><br>수출 <b>${fmt(v)}</b>`;
    if(py)h+=`<br>YoY ${pc((v-py)/py*100)}`;
    tShow(h,ev);});
  svg.addEventListener('mouseleave',tHide);
  document.getElementById('chart').scrollIntoView({behavior:'smooth',block:'center'});
}
</script>
