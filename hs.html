<script>
const HS=JSON.parse(document.getElementById('hsd').textContent);
const fmt=v=>v>=1e9?'$'+(v/1e9).toFixed(2)+'B':v>=1e6?'$'+(v/1e6).toFixed(1)+'M':v>=1e3?'$'+(v/1e3).toFixed(0)+'K':'$'+v;
const pc=v=>`<span class='${v>0?'up':'dn'}'>${v>0?'+':''}${v.toFixed(1)}%</span>`;
const rows=[];
for(const k in HS){
  const e=HS[k],ms=Object.keys(e.series).sort();
  const last=ms[ms.length-1],lv=e.series[last];
  const sum3=ms.slice(-3).reduce((s,m)=>s+e.series[m],0);
  const py3=ms.slice(-3).map(m=>(+m.slice(0,4)-1)+m.slice(4));
  const pyv=py3.every(p=>e.series[p]!=null)?py3.reduce((s,p)=>s+e.series[p],0):null;
  const yoy3=pyv?(sum3-pyv)/pyv*100:null;
  const pm=(+last.slice(0,4)-1)+last.slice(4);
  const yoy=e.series[pm]!=null?(lv-e.series[pm])/e.series[pm]*100:null;
  const hi=lv>=Math.max(...ms.map(m=>e.series[m]));
  rows.push({k,n:e.label,last,lv,yoy,yoy3,hi,nm:ms.length});
}
let tip=null;
function tShow(h,ev){if(!tip){tip=document.createElement('div');tip.id='hstip';document.body.appendChild(tip);}
 tip.innerHTML=h;tip.style.display='block';
 tip.style.left=Math.min(window.innerWidth-200,ev.clientX+12)+'px';
 tip.style.top=(ev.clientY+window.scrollY+10)+'px';}
const tHide=()=>{if(tip)tip.style.display='none';};
const base=[['트랙',r=>r.n+(r.hi?' 🏆':''),null],['최근월',r=>r.last,null],['수출액',r=>fmt(r.lv),'lv'],
  ['YoY',r=>r.yoy!=null?pc(r.yoy):'-','yoy'],['3M YoY',r=>r.yoy3!=null?'<b>'+(r.yoy3>0?'+':'')+r.yoy3.toFixed(1)+'%</b>':'-','yoy3']];
const TABS={
 up:{pool:()=>rows.filter(r=>r.yoy3!=null&&r.lv>=1e5),def:['yoy3',-1]},
 dn:{pool:()=>rows.filter(r=>r.yoy3!=null&&r.lv>=1e5),def:['yoy3',1]},
 hi:{pool:()=>rows.filter(r=>r.hi&&r.nm>=13),def:['yoy3',-1]},
 sz:{pool:()=>rows.slice(),def:['lv',-1]}};
let CURT='up',SORT={k:null,d:-1};
function setSort(k){if(SORT.k===k)SORT.d=-SORT.d;else SORT={k,d:-1};render();}
function rowTip(k){
  const e=HS[k],ms=Object.keys(e.series).sort().slice(-4);
  return `<b>${e.label}</b><br>`+ms.map(m=>`${m}: ${fmt(e.series[m])}`).join('<br>');}
function showTab(t){CURT=t;SORT={k:null,d:-1};render();}
function render(){
  const t=CURT;
  document.querySelectorAll('#tabs .tab').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  const [dk,dd]=TABS[t].def;
  const key=SORT.k||dk, dir=SORT.k?SORT.d:dd;
  const list=TABS[t].pool().slice().sort((a,b)=>{
    const av=a[key],bv=b[key];
    if(av==null&&bv==null)return 0;
    if(av==null)return 1;
    if(bv==null)return -1;
    return dir===-1?bv-av:av-bv;}).slice(0,60);
  const th=base.map(c=>{
    if(!c[2])return `<th>${c[0]}</th>`;
    const active=key===c[2];
    const arrow=active?(dir===-1?' ▼':' ▲'):' <span style="opacity:.45">⇅</span>';
    return `<th style='cursor:pointer' onclick='setSort("${c[2]}")'>${c[0]}${arrow}</th>`;}).join('');
  document.getElementById('tabc').innerHTML='<table><tr>'+th
    +'</tr>'+list.map(r=>`<tr class='rowc' data-k='${r.k}' onclick='show(this.dataset.k)'>`
    +base.map(c=>`<td>${c[1](r)}</td>`).join('')+'</tr>').join('')+'</table>';
  document.querySelectorAll('#tabc tr.rowc').forEach(tr=>{
    tr.addEventListener('mousemove',ev=>tShow(rowTip(tr.dataset.k),ev));
    tr.addEventListener('mouseleave',tHide);});
}
showTab('up');
const q=document.getElementById('q'),sug=document.getElementById('sug');
let SUGL=[],SEL=-1;
function renderSug(){
  if(!SUGL.length){sug.classList.remove('open');sug.innerHTML='';return;}
  sug.innerHTML=SUGL.map((r,i)=>`<li class='${i===SEL?"sel":""}' data-i='${i}'><span>${r.n}</span><small>${fmt(r.lv)}</small></li>`).join('');
  sug.classList.add('open');
  sug.querySelectorAll('li').forEach(li=>{
    li.addEventListener('mousedown',ev=>{ev.preventDefault();pickSug(+li.dataset.i);});
    li.addEventListener('mouseenter',()=>{SEL=+li.dataset.i;
      sug.querySelectorAll('li').forEach(x=>x.classList.toggle('sel',+x.dataset.i===SEL));});
  });
}
function pickSug(i){
  const r=SUGL[i];if(!r)return;
  q.value=r.n;SUGL=[];renderSug();
  show(r.k);
}
q.addEventListener('input',()=>{
  const v=q.value.trim();
  if(!v){SUGL=[];renderSug();return;}
  SUGL=rows.filter(r=>r.n.includes(v)).slice(0,12);SEL=-1;renderSug();
});
q.addEventListener('keydown',ev=>{
  if(ev.key==='ArrowDown'){ev.preventDefault();if(SUGL.length){SEL=(SEL+1)%SUGL.length;renderSug();}}
  else if(ev.key==='ArrowUp'){ev.preventDefault();if(SUGL.length){SEL=(SEL-1+SUGL.length)%SUGL.length;renderSug();}}
  else if(ev.key==='Enter'){ev.preventDefault();
    if(SUGL.length)pickSug(SEL>=0?SEL:0);}
  else if(ev.key==='Escape'){SUGL=[];renderSug();}
});
q.addEventListener('blur',()=>setTimeout(()=>{SUGL=[];renderSug();},150));
let VMODE='chart',CURKEY=null;
function toggleView(){VMODE=VMODE==='chart'?'table':'chart';
  document.getElementById('vbtn').textContent=VMODE==='chart'?'🔢 표로 보기':'📊 차트로 보기';
  if(CURKEY)show(CURKEY);}
function tableView(k){
  const e=HS[k],ms=Object.keys(e.series).sort().slice(-24);
  let h="<div style='overflow-x:auto'><table><tr><th>구분</th>"+ms.map(m=>`<th>${m.slice(2)}</th>`).join('')+"</tr>";
  h+=`<tr style='font-weight:700;background:#f4f6f9'><td>수출액</td>`+ms.map(m=>`<td>${fmt(e.series[m])}</td>`).join('')+'</tr>';
  h+=`<tr><td>YoY</td>`+ms.map(m=>{const py=e.series[(+m.slice(0,4)-1)+m.slice(4)];
    return `<td>${py?pc((e.series[m]-py)/py*100):'-'}</td>`;}).join('')+'</tr>';
  return h+'</table></div>';
}
function show(k){
  CURKEY=k;
  try{history.replaceState(null,'','#'+encodeURIComponent(k));}catch(_){}
  const e=HS[k],ms=Object.keys(e.series).sort(),n=ms.length;
  const r=rows.find(x=>x.k===k);
  if(VMODE==='table'){
    document.getElementById('cname').textContent=e.label+' — 월별 수출 표';
    document.getElementById('cstats').innerHTML=`최근 ${r.last} <b>${fmt(r.lv)}</b> · YoY ${r.yoy!=null?pc(r.yoy):'-'} · 3M YoY ${r.yoy3!=null?pc(r.yoy3):'-'}`;
    document.getElementById('chart').innerHTML=tableView(k);
    return;}
  document.getElementById('cname').textContent=e.label+' — 월별 수출액';
  document.getElementById('cstats').innerHTML=
    `최근 ${r.last} <b>${fmt(r.lv)}</b>${r.hi?' 🏆<b style="color:#cf4f45">월 수출 사상 최대</b>':''} · YoY ${r.yoy!=null?pc(r.yoy):'-'} · 최근 3개월 YoY ${r.yoy3!=null?pc(r.yoy3):'-'} · ${n}개월`
    +(e.hs?` · <small class='gray'>HS ${e.hs}${e.region?' · '+e.region:''}</small>`:'');
  const W=980,H=230,L=56,B=26,T=12,R=8;
  const vals=ms.map(m=>e.series[m]),mx=Math.max(...vals)*1.1;
  const X=i=>L+(W-L-R)*(n===1?0.5:i/(n-1)),bw=Math.max(2,Math.min(16,(W-L-R)/n*0.7));
  let s=`<svg id='hssvg' viewBox='0 0 ${W} ${H}' style='width:100%;background:#f6f8fb;border:1px solid #d9e0e8;border-radius:8px'>`;
  for(let g=1;g<=3;g++){const y=T+(H-T-B)*g/3;
    s+=`<line x1='${L}' y1='${y}' x2='${W-R}' y2='${y}' stroke='#e2e7ed'/>`;
    s+=`<text x='${L-4}' y='${T+(H-T-B)*(1-g/3)+4}' font-size='9' fill='#8a94a0' text-anchor='end'>${fmt(mx*g/3)}</text>`;}
  ms.forEach((m,i)=>{
    const v=vals[i],py=e.series[(+m.slice(0,4)-1)+m.slice(4)];
    const up=py!=null?v>=py:null;
    const y=T+(H-T-B)*(1-v/mx);
    s+=`<rect x='${(X(i)-bw/2).toFixed(1)}' y='${y.toFixed(1)}' width='${bw.toFixed(1)}' height='${(H-B-y).toFixed(1)}' fill='${up===null?'#8a97a5':up?'#c0392b':'#3f6bab'}' opacity='0.85'/>`;
    if(i%6===n%6)s+=`<text x='${X(i).toFixed(1)}' y='${H-10}' font-size='8' fill='#8a94a0' text-anchor='middle'>${m.slice(2,7)}</text>`;});
  s+='</svg>';
  document.getElementById('chart').innerHTML=s
    +"<p style='font-size:.74rem;color:#889;margin:5px 0 0'>막대 색: 전년 동월 대비 증가=빨강 · 감소=파랑 · 회색=비교불가</p>";
  const svg=document.getElementById('hssvg');
  svg.addEventListener('mousemove',ev=>{
    const rc=svg.getBoundingClientRect();
    const vx=(ev.clientX-rc.left)*W/rc.width;
    const i=Math.max(0,Math.min(n-1,Math.round((vx-L)/((W-L-R)/(n-1)))));
    const m=ms[i],v=e.series[m],py=e.series[(+m.slice(0,4)-1)+m.slice(4)];
    let h=`<b>${m}</b><br>수출 <b>${fmt(v)}</b>`;
    if(py)h+=`<br>YoY ${pc((v-py)/py*100)}`;
    tShow(h,ev);});
  svg.addEventListener('mouseleave',tHide);
  document.getElementById('chart').scrollIntoView({behavior:'smooth',block:'center'});
}
try{const H0=decodeURIComponent(location.hash.slice(1));if(H0&&HS[H0])show(H0);}catch(_){}
</script>
