<!doctype html><html lang="ko" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&text=%F0%9F%87%B0%F0%9F%87%B7%F0%9F%87%AF%F0%9F%87%B5%F0%9F%87%A8%F0%9F%87%B3%F0%9F%87%B9%F0%9F%87%BC%F0%9F%87%BA%F0%9F%87%B8%F0%9F%87%AA%F0%9F%87%BA&display=swap"><!-- 윈도우는 국기 이모지 글꼴이 없어 KR·US 글자로 보임 → 국기 6개만 담은 Noto Color Emoji 부분 글꼴 -->
<title>글로벌 테크 밸류체인</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js"></script>
<style>
:root{--hm-h:#222b39;--hm-hl:#3a465a;--hm-l:transparent;--hm-ll:transparent;--bg:#0e131a;--card:#161c26;--ink:#e6e9ef;--mut:#929cab;--line:#283140;--up:#ff7b7b;--dn:#5eb3f0;--hov:#1b2330;--acc:#3d8bfd;--chip:#1e2633;color-scheme:dark}
:root[data-theme=light]{--hm-h:#eef2f7;--hm-hl:#d3dbe6;--hm-l:#f5f7fa;--hm-ll:#e3e8ef;--bg:#eef1f5;--card:#fff;--ink:#16202c;--mut:#67737f;--line:#e2e7ee;--up:#d03030;--dn:#2366b5;--hov:#f5f8fc;--acc:#1f5fbf;--chip:#f1f4f8;color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--ink);font:14px/1.55 "Noto Color Emoji",-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;padding:18px 16px 60px}
.wrap{max-width:1280px;margin:0 auto}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px}
h1{font-size:19px;margin-bottom:4px}h2{font-size:15px;margin-bottom:8px}h2 .s{font-size:12px;color:var(--mut);font-weight:400;margin-left:6px}.sub{font-size:12.5px;color:var(--mut);line-height:1.65}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.thm{font:inherit;font-size:12px;padding:5px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);cursor:pointer;white-space:nowrap}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 14px}.tabs button{font:inherit;font-size:.86rem;padding:7px 13px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);cursor:pointer}.tabs button.on{background:var(--ink);color:var(--card);border-color:var(--ink);font-weight:700}.tabs button .c{opacity:.6;font-size:.72rem;margin-left:4px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-bottom:14px}.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:default}.tile.cl{cursor:pointer}.tile.cl:hover{border-color:var(--acc)}
.tile .k{font-size:12px;color:var(--mut)}.tile .v{font-size:21px;font-weight:700;margin:2px 0;font-variant-numeric:tabular-nums}.tile .d{font-size:11.5px;color:var(--mut);line-height:1.55}
.up{color:var(--up)}.dn{color:var(--dn)}.mut{color:var(--mut)}
.ctl{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-bottom:8px}.ctl .lb{font-size:.72rem;color:var(--mut);font-weight:700;margin-right:2px}
.ctl button{font:inherit;font-size:.76rem;padding:4px 10px;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--ink);cursor:pointer}.ctl button.on{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:700}.ctl button .c{opacity:.65;font-size:.68rem;margin-left:3px}
#mm{width:100%;height:900px}
.hm{overflow-x:auto}.hm table{border-collapse:separate;border-spacing:3px;font-size:12px;width:100%}.hm th{color:var(--ink);font-weight:600;padding:7px 8px;text-align:center;white-space:nowrap;background:var(--hm-h);border-bottom:2px solid var(--hm-hl);border-radius:6px 6px 0 0;position:sticky;top:0;z-index:1}.hm th.l{text-align:left;color:var(--mut)}
.hm td{padding:6px 7px;border-radius:6px;text-align:center;white-space:nowrap;font-variant-numeric:tabular-nums;cursor:pointer}.hm td.l{text-align:left;cursor:default;color:var(--ink);background:var(--hm-l);box-shadow:inset -2px 0 0 var(--hm-ll)}.hm td.g{font-weight:700;color:var(--mut);padding-top:10px;cursor:default}.hm td small{opacity:.7;font-size:10px;margin-left:2px}.hm td.e{cursor:default;color:var(--mut);opacity:.4}
.search{width:100%;font:inherit;font-size:14px;padding:9px 12px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);margin-bottom:8px}.search:focus{outline:none;border-color:var(--acc)}
.tblwrap{overflow-x:auto}table.t{width:100%;border-collapse:collapse;font-size:12.5px}table.t th{color:var(--mut);font-weight:600;text-align:left;border-bottom:1px solid var(--line);padding:8px 10px;white-space:nowrap;cursor:pointer;user-select:none;position:sticky;top:0;background:var(--card)}
table.t th .ar{font-size:.85em;margin-left:2px}table.t td{border-bottom:1px solid var(--line);padding:7px 10px;vertical-align:middle}table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t th:last-child,table.t td:last-child{padding-right:26px}table.t tr:hover td{background:var(--hov)}
table.t td.co{position:sticky;left:0;background:var(--card);min-width:150px}table.t tr:hover td.co{background:var(--hov)}table.t td.co b{font-size:13px}table.t td.co .tk{font-size:11px;color:var(--mut)}
tr.g1 td{background:var(--chip)!important;font-weight:800;font-size:14px;padding:11px 12px;border-left:5px solid var(--l1c,var(--acc))}tr.g2 td{font-weight:800;color:var(--ink);font-size:13px;padding:12px 12px 7px 22px;background:linear-gradient(90deg,color-mix(in srgb,var(--l1c,var(--acc)) 16%,transparent),transparent 60%)!important;border-left:3px solid var(--l1c,var(--acc));border-top:10px solid var(--card)}tr.g2 td .b{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:9px;background:var(--l1c,var(--acc));color:#fff;margin-right:8px}tr.g2 td .s2{font-weight:400;color:var(--mut);font-size:11.5px;margin-left:6px}tr.co1 td.co{border-left:3px solid var(--l1c,transparent)}
.prod{font-size:12px;color:var(--mut);min-width:150px;max-width:260px}.flag{margin-right:4px}
.spk{display:block}.rv{display:flex;align-items:center;gap:8px;justify-content:flex-end}.rv .num{text-align:right;line-height:1.3}.rv .num small{display:block;font-size:10.5px}
.note{font-size:12px;color:var(--mut);margin-top:8px;line-height:1.75}.more{font:inherit;font-size:12px;margin-top:8px;padding:6px 14px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--acc);cursor:pointer}
tr.hl td{outline:2px solid var(--acc);outline-offset:-2px}
.nav{position:sticky;top:0;z-index:30;display:flex;gap:6px;flex-wrap:wrap;background:var(--bg);padding:8px 0 10px;margin-bottom:4px}.nav button{font:inherit;font-size:.9rem;font-weight:700;padding:8px 16px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);cursor:pointer}.nav button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.view{display:none}.view.on{display:block}
.ins-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 22px}.ins-blk h3{font-size:13.5px;margin-bottom:4px}.ins-blk .hl{font-size:15px;font-weight:700;margin:4px 0 8px;line-height:1.45}.ins-blk ul{padding-left:18px;font-size:13.2px;line-height:1.85}.ins-blk li{margin-bottom:3px}
.chips{display:flex;flex-wrap:wrap;gap:5px;font-size:11.5px}.chips span{padding:2px 8px;border-radius:9px;background:var(--chip);border:1px solid var(--line)}
.issgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:12px}.ic{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--bg)}
.ic h3{font-size:14px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px;cursor:pointer}.ic h3:hover{color:var(--acc)}.ic .it{padding:7px 0;border-top:1px dashed var(--line)}.ic .it:first-of-type{border-top:0}
.ic .it .t{font-size:13px;font-weight:700;line-height:1.45}.ic .it .m{font-size:11px;color:var(--mut);margin-bottom:2px}.ic .it .d{font-size:12px;color:var(--mut);line-height:1.6;margin-top:2px}.ic .mv{font-size:11.5px;color:var(--mut);margin-top:8px;line-height:1.7}
.gobox{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}.gobox div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;cursor:pointer}.gobox div:hover{border-color:var(--acc)}.gobox b{font-size:16px;display:block;margin-bottom:4px}.gobox span{font-size:12.5px;color:var(--mut);line-height:1.6}
/* 전체 보기 국가 타일: 한 줄 7칸 */
.tiles.t7{grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}.tiles.t7 .tile{padding:10px 11px}.tiles.t7 .k{font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tiles.t7 .v{font-size:18px}.tiles.t7 .d{font-size:11px;line-height:1.5}
@media(max-width:1000px){.tiles.t7{grid-template-columns:repeat(4,minmax(0,1fr))}.tiles.t7 .tile:first-child{grid-column:span 2}}
@media(max-width:520px){.tiles.t7{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:900px){.ins-grid{grid-template-columns:1fr}.gobox{grid-template-columns:1fr}.issgrid{grid-template-columns:1fr}}
@media(max-width:640px){h1{font-size:16px}#mm{height:700px}.tile .v{font-size:18px}.prod{min-width:120px}}
/* 기업 팝업 */
td.co b.cn{cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px;text-decoration-color:var(--mut)}td.co b.cn:hover{color:var(--acc)}
.cm-bg{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.55);display:none;align-items:flex-start;justify-content:center;padding:16px}.cm-bg.on{display:flex}
.cm{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;width:100%;max-width:900px;min-width:0;max-height:calc(100dvh - 32px);display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.cm-top{padding:14px 18px 0;border-bottom:1px solid var(--line);position:relative}.cm-x{position:absolute;top:10px;right:10px;font:inherit;font-size:18px;line-height:1;width:34px;height:34px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);cursor:pointer}
.cm-t1{font-size:17px;padding-right:40px;line-height:1.4;overflow-wrap:anywhere}.cm-t1 .tk{font-size:12px;color:var(--mut);font-weight:400}.cm-t2{margin:6px 0 10px}
.cm-tabs{display:flex;gap:4px;flex-wrap:wrap}.cm-tabs button{font:inherit;font-size:13px;padding:7px 14px;border:0;border-bottom:3px solid transparent;background:none;color:var(--mut);cursor:pointer;font-weight:700}.cm-tabs button.on{color:var(--ink);border-bottom-color:var(--acc)}
.cm-bd{overflow-y:auto;padding:14px 18px 20px;font-size:13.5px;line-height:1.75;overflow-wrap:anywhere;min-height:120px}
.cm-ld{color:var(--mut);padding:28px 0;text-align:center}.cm-none{padding:10px 12px;border:1px dashed var(--line);border-radius:10px;color:var(--mut);font-weight:700;margin-bottom:12px}
.cm-bd ul{padding-left:18px;margin:4px 0 8px}.cm-bd li{margin:6px 0}.cm-bd li.sub{margin-left:16px;list-style:circle}.cm-bd p{margin:6px 0}.cm-bd u{text-decoration-color:var(--acc);text-underline-offset:3px}.cm-bd a{color:var(--acc)}
.cm-bd h4,.cm-h{font-size:14px;margin:14px 0 6px}.cm-bd h5{font-size:13px;margin:10px 0 4px;padding-left:8px;border-left:3px solid var(--acc)}
.cm-f{border-collapse:collapse;width:100%}.cm-f th{text-align:left;color:var(--mut);font-weight:600;white-space:nowrap;padding:7px 14px 7px 0;vertical-align:top;width:1%}.cm-f td{padding:7px 0;border-bottom:1px solid var(--line)}.cm-f th{border-bottom:1px solid var(--line)}
.cm-src{font-size:11.5px;color:var(--mut);margin-top:12px;padding-top:8px;border-top:1px solid var(--line)}
.cm-tw{overflow-x:auto;margin:6px 0 10px}.cm-t{border-collapse:collapse;font-size:12.5px;width:100%}.cm-t th,.cm-t td{border-bottom:1px solid var(--line);padding:6px 14px 6px 8px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}.cm-t th{color:var(--mut);font-weight:600}.cm-t th:first-child,.cm-t td:first-child{text-align:left}.cm-t td:last-child,.cm-t th:last-child{padding-right:20px}
.cm-hero{background:linear-gradient(135deg,#0d3a32,#0f6b5c);color:#fff;border-radius:12px;padding:18px 20px;margin-bottom:6px}.cm-hero .ey{font-size:11px;letter-spacing:.08em;color:#ffd47e;font-weight:800}.cm-hero h3{margin:6px 0 4px;font-size:17px}.cm-hero .hq{font-size:12.5px;color:#e6f2ef}
.cm-cc{border:1.5px solid var(--line);border-radius:12px;padding:4px 16px 10px;margin:12px 0}.cm-cc h5{font-size:14px;margin:10px 0 6px;padding-left:9px;border-left:4px solid #0f6b5c}.cm-cc.gold{border-color:#e2c98a;background:color-mix(in srgb,#e2c98a 12%,var(--card))}.cm-cc.gold h5{border-left-color:#b07d1e}
.cm-bd .arr{color:var(--up);font-weight:800;padding:0 3px}.cm-bd .q{background:color-mix(in srgb,#0f6b5c 16%,transparent);border-left:3px solid #0f6b5c;padding:1px 7px;border-radius:4px;font-style:italic}
.cm-q{border:1px solid var(--line);border-radius:12px;margin:10px 0;background:var(--bg)}.cm-q>summary{cursor:pointer;padding:10px 14px;font-size:14px}.cm-q .nw{font-size:11px;padding:1px 7px;border-radius:8px;background:var(--acc);color:#fff;margin-left:4px}.cm-qb{padding:0 14px 12px}
.cm-qna{margin-top:10px;border-top:1px dashed var(--line);padding-top:6px}.cm-qna>summary{cursor:pointer;color:var(--acc);font-weight:700;font-size:13px}.cm-bd p.qq{margin-top:12px}.cm-bd p.aa{color:var(--ink)}
.sb{display:inline-block;font-size:10.5px;font-weight:700;padding:0 6px;border-radius:7px;margin:0 2px;white-space:nowrap;vertical-align:1px;border:1px solid}.sb-nd{color:#d29922;border-color:#d29922}.sb-my{color:#2da44e;border-color:#2da44e}.sb-tg{color:#3d8bfd;border-color:#3d8bfd}.sb-fmp{color:var(--mut);border-color:var(--mut)}.cm-srcs{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 8px}
@media(max-width:640px){.cm-bg{padding:16px}.cm-top{padding:12px 14px 0}.cm-bd{padding:12px 14px 18px}.cm-tabs button{padding:7px 10px}}
</style></head><body><div class="wrap">
<div class="card"><div class="top"><div><h1>🌐 글로벌 테크 밸류체인</h1><div class="sub" id="sub"></div></div><button class="thm" id="thm">☀︎ 라이트</button></div></div>
<div class="nav" id="nav"><button data-v="home">🏠 홈</button><button data-v="map">🧠 트리맵</button><button data-v="list">📋 기업목록</button><button data-v="heat">🔥 히트맵</button></div>

 <div class="tiles" id="pulse"></div>

<div class="view" id="vCtx">
<div class="tabs" id="tabs"></div>

</div>

 <div class="ctl" id="mmCtl"><span class="lb">배치</span><button data-l="LR" class="on">가로 트리</button><button data-l="radial">방사형</button><span class="lb" style="margin-left:10px">펼침</span><button data-d="2" class="on">카테고리</button><button data-d="9">기업까지</button></div>
 <div id="mm"></div><div class="note">전체 보기는 세부 카테고리까지 펼쳐 둡니다(카테고리 노드를 누르거나 '기업까지'로 기업 표시). 기업 노드: 크기=시가총액, 색=YTD(빨강 상승·파랑 하락). 노드를 누르면 접고 펼치며, 기업을 누르면 아래 표에서 해당 행으로 이동하고 기업 팝업이 열립니다. 휠·핀치로 확대, 드래그로 이동.</div></div>
</div>

</div>

 <div class="ctl" id="ctCtl"></div><div class="ctl" id="l1Ctl"></div><div class="ctl" id="l2Ctl"></div>
 <div class="tblwrap"><table class="t" id="tbl"></table></div>

</div>
</div>

  +`<div class="tile"><div class="k">1W 상승 상위 ($1B+)</div><div class="d" style="font-size:12.5px">${mv.up.slice(0,4).map(x=>`${CT[x[2]][0]} ${esc(x[1])} ${fP(x[3])}`).join('<br>')}</div></div><div class="tile"><div class="k">1W 하락 상위 ($1B+)</div><div class="d" style="font-size:12.5px">${mv.dn.slice(0,4).map(x=>`${CT[x[2]][0]} ${esc(x[1])} ${fP(x[3])}`).join('<br>')}</div></div>`;
 $('#issS').textContent=I.asof?`아카이브 최근 30일 기업 언급 ${Object.values(I.msg_count||{}).reduce((a,b)=>a+b,0).toLocaleString()}건에서 정리`:'';
 $('#iss').innerHTML=L1S.filter(l=>l!==NEWL).map(l1=>{const it=(I.issues||{})[l1]||[];const m=(st.l1||{})[l1]||{};const cs=C.filter(c=>c.l1===l1);
  const tops=TAX[l1].map(l2=>[l2,((st.l2||{})[l1+'|'+l2]||{}).w1]).filter(x=>x[1]!=null).sort((a,b)=>b[1]-a[1]);
  return `<div class="ic" style="border-top:3px solid ${l1c(l1)}"><h3 data-l1="${esc(l1)}"><span>${esc(l1)} <span class="mut" style="font-weight:400;font-size:12px">${cs.length}개사 →</span></span><span class="chips"><span>1W ${fP(m.w1)}</span><span>1M ${fP(m.m1)}</span><span>YTD ${fP(m.ytd)}</span></span></h3>
   ${it.length?it.map(x=>`<div class="it"><div class="m">${esc(x.date||'')} · ${CT[x.country]?CT[x.country][0]+' ':''}${esc(x.company||'')}</div><div class="t">${md(x.title||'')}</div>${x.detail?`<div class="d">${md(x.detail)}</div>`:''}</div>`).join(''):'<div class="note">최근 30일 아카이브에 관련 소식이 없습니다.</div>'}
   ${tops.length?`<div class="mv">하위 1W: ${tops.map(([l,v])=>`${esc(l)} ${fP(v)}`).join(' · ')}</div>`:''}</div>`}).join('');
 $('#iss').querySelectorAll('h3[data-l1]').forEach(h=>h.onclick=()=>{S.ct='ALL';S.l1=h.dataset.l1;S.l2=null;go_('list')});
 $('#gobox').innerHTML=[['map','🧠 밸류체인 트리맵','국가별로 대분류 → 세부 카테고리 → 기업 구조와 YTD를 한눈에'],['list','📋 기업 목록 '+CU.length+'개사','제품·시총·YTD·분기 매출 추이·OPM·PER, 국가·카테고리별 필터'],['heat','🔥 카테고리 × 국가 히트맵','어느 밸류체인·어느 나라가 강한지 시총가중 YTD로 비교']].map(([v,t,d])=>`<div data-v="${v}"><b>${t}</b><span>${d}</span></div>`).join('');
 $('#gobox').querySelectorAll('div[data-v]').forEach(b=>b.onclick=()=>go_(b.dataset.v))}
let VIEW='home';
function go_(v){if(location.hash.slice(1)!==v)location.hash=v;else show(v);scrollTo({top:0})}
function show(v){VIEW=['home','map','heat','list'].includes(v)?v:'home';
 document.querySelectorAll('.view').forEach(x=>x.classList.remove('on'));$('#v'+{home:'Home',map:'Map',heat:'Heat',list:'List'}[VIEW]).classList.add('on');if(VIEW==='map'||VIEW==='list')$('#vCtx').classList.add('on');$('#tabs').style.display=VIEW==='list'?'none':'';  // 목록은 표 안 국가 칩 사용
 document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===VIEW));render()}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>go_(b.dataset.v));addEventListener('hashchange',()=>show(location.hash.slice(1)));
function render(){if(VIEW==='home'){renderHome();return}renderTabs();renderTiles();if(VIEW==='heat')renderHM();if(VIEW==='list')renderTable();if(VIEW==='map'){try{renderMM()}catch(e){console.warn(e)}}}
/* 기업 팝업: 회사명 클릭 → semi-chain-co/{ticker}.json 지연 로드 (기업개요·사업내용·어닝콜) */
const CMC={};
function cmTab(k){document.querySelectorAll('#cmTabs button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));document.querySelectorAll('#cmBd .cm-sec').forEach(x=>x.style.display=x.dataset.k===k?'':'none');$('#cmBd').scrollTop=0}
function renderCo(c,d){const sec=(k,h)=>`<div class="cm-sec" data-k="${k}">${h}</div>`;
 const ov=`<table class="cm-f">${(d.facts||[]).map(([a,b])=>`<tr><th>${esc(a)}</th><td>${b}</td></tr>`).join('')}<tr><th>밸류체인</th><td>${esc(c.l1)} › ${esc(c.l2)}</td></tr><tr><th>주요 제품</th><td>${esc(c.products)}</td></tr></table><div class="cm-src">출처: ${esc(d.facts_src)}</div>`;
 const bz=d.biz?`${d.biz.html}<div class="cm-src">출처: ${esc(d.biz.src)} → AI 요약 (${esc(d.biz.date)})</div>`:'<div class="cm-ld">사업내용 준비 중</div>';
 let ec;const cl=d.calls;
 if(cl&&cl.quarters&&cl.quarters.length){ec=(cl.comp?`<div class="cm-hero"><span class="ey">QUARTER-OVER-QUARTER CHANGE ANALYSIS</span><h3>${esc(c.name_ko)} — 최신 분기 변화 분석</h3><div class="hq">비교 분기: ${esc((cl.comp_dates||[]).join(' · '))} · 최신 분기 기준 수치·톤·확신 표현의 변화 (원문 인용 포함)</div></div>${cl.comp}`:'')
  +`<h4 class="cm-h">분기별 어닝콜 노트 · 최근 ${cl.quarters.length}개 분기</h4>`+cl.quarters.map((q,i)=>`<details class="cm-q"${i===0?' open':''}><summary><b>${esc(q.label||'')}</b> <span class="mut">${esc(q.date)}</span>${i===0?'<span class="nw">최신</span>':''}</summary><div class="cm-qb"><h5>핵심포인트</h5>${q.key}<h5>실적/가이던스</h5>${q.perf}${q.qna?`<details class="cm-qna"><summary>QnA 보기</summary>${q.qna}</details>`:''}</div></details>`).join('')
  +'<div class="cm-src">출처: FMP 어닝콜 트랜스크립트 원문 → AI 정리·분기 비교 분석 · 투자 참고용이며 투자 권유가 아닙니다</div>'}
 else ec='<div class="cm-none">어닝콜 트랜스크립트 없음</div>'+(d.ir?`<h4 class="cm-h">IR 실적 요약</h4>${d.ir.html}<div class="cm-src">출처: ${esc(d.ir.src)}</div>`:'<div class="cm-ld">IR 실적 자료 없음</div>');
 const pv=d.priv&&d.priv.quarters&&d.priv.quarters.length?d.priv.quarters.map((q,i)=>`<details class="cm-q"${i===0?' open':''}><summary><b>${esc(q.label)}</b> <span class="mut">자료 ${q.n_items}건${q.fmp?' · FMP 공개 노트와 병합':''}</span></summary><div class="cm-qb"><div class="cm-srcs">${q.sources.map(s=>`<span class="sb sb-${s.label==='노다지'?'nd':s.label.startsWith('텔레그램')?'tg':'my'}">${esc(s.label)} ${s.n}건 · ~${esc(s.last.slice(2))}</span>`).join('')}</div>${q.html}</div></details>`).join('')+'<div class="cm-src">비공개: 노다지 컨콜노트·내 노트(에버노트·노션)·텔레그램 학습 채널 → AI 분기 정리 · ⚠️ = FMP 공개 노트와 다른 내용</div>':'<div class="cm-ld">비공개 노트 없음</div>';
 $('#cmTabs').innerHTML=[['ov','기업개요'],['bz','사업내용'],['ec',cl?'어닝콜':'어닝콜·IR 실적'],...(PVON?[['pv','📒 내 노트·노다지·텔레그램']]:[])].map(([k,l])=>`<button data-k="${k}">${l}</button>`).join('');
 $('#cmTabs').querySelectorAll('button').forEach(b=>b.onclick=()=>cmTab(b.dataset.k));
 $('#cmBd').innerHTML=sec('ov',ov)+sec('bz',bz)+sec('ec',ec)+(PVON?sec('pv',pv):'');cmTab('ov')}
function openCo(c){if(!c)return;const bg=$('#cmBg'),k=c.ticker.replace(/\./g,'_');bg.dataset.k=k;
 $('#cmHd').innerHTML=`<div class="cm-t1"><span class="flag">${CT[c.country][0]}</span><b>${esc(c.name_ko)}</b> <span class="tk">${esc(c.ticker)} · ${esc(c.name_en)}</span></div><div class="cm-t2 chips"><span>${esc(c.l1)} › ${esc(c.l2)}</span><span>시총 ${fB(c.mcap_usd)}</span><span>YTD ${fP(c.ytd)}</span></div>`;
 $('#cmTabs').innerHTML='';$('#cmBd').innerHTML='<div class="cm-ld">불러오는 중…</div>';bg.classList.add('on');document.body.style.overflow='hidden';
 (CMC[k]?Promise.resolve(CMC[k]):PRIV?fetch(`co/co_${c.country}.json`).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(b=>{Object.assign(CMC,b);if(!b[k])throw new Error('none');return b[k]}):fetch(`semi-chain-co/${k}.json`,{cache:'no-cache'}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}))
  .then(d=>PK&&!d.priv?pvLoad(c.country).then(b=>{if(b&&b[k])d.priv=b[k];return d}):d)
  .then(d=>{CMC[k]=d;if(bg.dataset.k===k)renderCo(c,d)}).catch(()=>{if(bg.dataset.k===k)$('#cmBd').innerHTML='<div class="cm-ld">기업 정보 준비 중입니다. 잠시 후 다시 확인해 주세요.</div>'})}
function closeCo(){$('#cmBg').classList.remove('on');$('#cmBg').dataset.k='';document.body.style.overflow=''}
$('#cmX').onclick=closeCo;$('#cmBg').addEventListener('click',e=>{if(e.target.id==='cmBg')closeCo()});addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#cmBg').classList.contains('on'))closeCo()});
$('#tbl').addEventListener('click',e=>{const b=e.target.closest('b.cn');if(b){e.stopPropagation();openCo(C[+b.dataset.ci])}});
show(location.hash.slice(1));addEventListener('resize',()=>MM&&MM.resize());
</script></body></html>
