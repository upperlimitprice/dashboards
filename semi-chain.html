let VIEW='home';
function go_(v){if(location.hash.slice(1)!==v)location.hash=v;else show(v);scrollTo({top:0})}
function show(v){VIEW=['home','map','heat','list'].includes(v)?v:'home';
 document.querySelectorAll('.view').forEach(x=>x.classList.remove('on'));$('#v'+{home:'Home',map:'Map',heat:'Heat',list:'List'}[VIEW]).classList.add('on');if(VIEW==='map'||VIEW==='list')$('#vCtx').classList.add('on');$('#tabs').style.display=VIEW==='list'?'none':'';  // 목록은 표 안 국가 칩 사용
 document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===VIEW));render()}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>go_(b.dataset.v));addEventListener('hashchange',()=>show(location.hash.slice(1)));
