const L1C=['#3d8bfd','#e5534b','#d29922','#2da44e','#a371f7','#56d4dd','#db61a2','#8b949e'];const l1c=l1=>L1C[L1S.indexOf(l1)%L1C.length];
const C=D.companies;C.forEach((c,i)=>c.i=i);
let S={grp:'chain',ct:'ALL',l1:null,l2:null,q:'',sort:null,lay:'LR',dep:2,hl:null};
const root=document.documentElement;const css=v=>getComputedStyle(root).getPropertyValue(v).trim();
const setT=t=>{root.dataset.theme=t;$('#thm').textContent=t==='dark'?'☀︎ 라이트':'☾ 다크';try{localStorage.setItem('semi-theme',t)}catch(e){}};
let t0='dark';try{t0=localStorage.getItem('semi-theme')||'dark'}catch(e){}setT(t0);
$('#thm').onclick=()=>{setT(root.dataset.theme==='dark'?'light':'dark');render()};
const fB=v=>v==null?'–':v>=1000?'$'+(v/1000).toFixed(2)+'T':v>=10?'$'+v.toFixed(0)+'B':'$'+v.toFixed(1)+'B';
const fP=v=>v==null?'<span class="mut">–</span>':`<span class="${v>0?'up':v<0?'dn':''}">${v>0?'+':''}${v.toFixed(1)}%</span>`;
const fM=v=>v==null?'–':v>=1000?'$'+(v/1000).toFixed(2)+'B':'$'+Math.round(v)+'M';
const inCt=c=>S.ct==='ALL'||c.country===S.ct;
const wYtd=a=>{const b=a.filter(c=>c.ytd!=null&&c.mcap_usd);const w=b.reduce((s,c)=>s+c.mcap_usd,0);return w?b.reduce((s,c)=>s+c.ytd*c.mcap_usd,0)/w:null};
const wAvg=(a,k)=>{const b=a.filter(c=>c[k]!=null&&c.mcap_usd);const w=b.reduce((s,c)=>s+c.mcap_usd,0);return w?b.reduce((s,c)=>s+c[k]*c.mcap_usd,0)/w:null};
const sum=a=>a.reduce((s,c)=>s+(c.mcap_usd||0),0);
const ytdCol=v=>{if(v==null)return 'transparent';const a=Math.min(Math.abs(v)/60,1)*.75+.08;return v>=0?`rgba(255,90,90,${a})`:`rgba(70,150,240,${a})`};

$('#sub').innerHTML=`한국·일본·중국·대만·미국·유럽 상장 반도체 밸류체인 <b>${C.length}개사</b> · 8개 대분류 / ${L1S.reduce((s,k)=>s+TAX[k].length,0)}개 세부 카테고리<br>시세 기준 ${D.asof} · YTD 기준 ${D.ytd_base} 종가 · 시총·매출은 당일 환율 USD 환산 · 분기 매출·영업이익은 각 사 보고 통화 기준 (출처 FMP)`;

function renderTabs(){$('#tabs').innerHTML=[['ALL','🌐 전체',C.length],...CO.map(k=>[k,CT[k].join(' '),C.filter(c=>c.country===k).length])].map(([k,l,n])=>`<button data-k="${k}" class="${S.ct===k?'on':''}">${l}<span class="c">${n}</span></button>`).join('');
 $('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{S.ct=b.dataset.k;S.l2=null;setDep(S.ct==='ALL'?2:9);render()})}
function setDep(d){S.dep=d;document.querySelectorAll('#mmCtl [data-d]').forEach(x=>x.classList.toggle('on',+x.dataset.d===d))}

function renderTiles(){let h='';
 if(S.ct==='ALL'){const a=C;h+=`<div class="tile"><div class="k">전체 시가총액</div><div class="v">${fB(sum(a))}</div><div class="d">${a.length}개사 · 시총가중 YTD ${fP(wYtd(a))}</div></div>`;
  CO.forEach(k=>{const b=C.filter(c=>c.country===k);if(!b.length)return;const best=[...b].filter(c=>c.ytd!=null).sort((x,y)=>y.ytd-x.ytd)[0];
   h+=`<div class="tile cl" data-k="${k}"><div class="k">${CT[k].join(' ')} · ${b.length}개사</div><div class="v">${fB(sum(b))}</div><div class="d">YTD ${fP(wYtd(b))}<br>최고 ${best?esc(best.name_ko)+' '+fP(best.ytd):'–'}</div></div>`})}
 else{const a=C.filter(inCt);const s=[...a].filter(c=>c.ytd!=null).sort((x,y)=>y.ytd-x.ytd);const top=a.slice().sort((x,y)=>(y.mcap_usd||0)-(x.mcap_usd||0))[0];
  h+=`<div class="tile"><div class="k">${CT[S.ct].join(' ')} 시가총액</div><div class="v">${fB(sum(a))}</div><div class="d">${a.length}개사 · 최대 ${top?esc(top.name_ko):'–'}</div></div>
  <div class="tile"><div class="k">시총가중 YTD</div><div class="v">${fP(wYtd(a))}</div><div class="d">상승 ${s.filter(c=>c.ytd>0).length} · 하락 ${s.filter(c=>c.ytd<0).length}</div></div>
  <div class="tile"><div class="k">YTD 상위</div><div class="d" style="font-size:12.5px">${s.slice(0,3).map(c=>`${esc(c.name_ko)} ${fP(c.ytd)}`).join('<br>')}</div></div>
  <div class="tile"><div class="k">YTD 하위</div><div class="d" style="font-size:12.5px">${s.slice(-3).reverse().map(c=>`${esc(c.name_ko)} ${fP(c.ytd)}`).join('<br>')}</div></div>`}
 $('#tiles').innerHTML=h;$('#tiles').classList.toggle('t7',S.ct==='ALL');$('#tiles').querySelectorAll('.tile.cl').forEach(t=>t.onclick=()=>{S.ct=t.dataset.k;setDep(9);render();scrollTo({top:0})})}

/* 트리맵 */
let MM;
function treeData(){const a=C.filter(inCt);const mx=Math.max(...a.map(c=>c.mcap_usd||0),1);
 const kids=L1S.map(l1=>{const ch=TAX[l1].map(l2=>{const cs=a.filter(c=>c.l1===l1&&c.l2===l2).sort((x,y)=>(y.mcap_usd||0)-(x.mcap_usd||0));if(!cs.length)return null;
   return {name:`${l2} (${cs.length})`,ytd:wYtd(cs),children:cs.map(c=>({name:`${S.ct==='ALL'?CT[c.country][0]+' ':''}${c.name_ko}  ${c.ytd==null?'':(c.ytd>0?'+':'')+c.ytd.toFixed(0)+'%'}`,ci:c.i,ytd:c.ytd,
    symbolSize:6+Math.sqrt((c.mcap_usd||0)/mx)*22,itemStyle:{color:c.ytd==null?'#777':c.ytd>=0?css('--up'):css('--dn'),borderColor:css('--card')}}))}}).filter(Boolean);
  if(!ch.length)return null;const cs=a.filter(c=>c.l1===l1);return {name:`${l1} · ${fB(sum(cs))}`,ytd:wYtd(cs),children:ch,symbolSize:12}}).filter(Boolean);
 return {name:S.ct==='ALL'?'🌐 글로벌 반도체':CT[S.ct].join(' ')+' 반도체',children:kids,symbolSize:16}}
function renderMM(){const el=$('#mm');const td=treeData();const leaves=C.filter(inCt).length;const lr=S.lay==='LR';
 const nL2=td.children.reduce((s,x)=>s+x.children.length,0);const h=lr?(S.dep>2?Math.max(560,leaves*19+80):Math.max(480,nL2*30+60)):Math.min(Math.max(700,el.clientWidth),1300);el.style.height=h+'px';
 if(MM)MM.dispose();MM=echarts.init(el);  // 트리 데이터가 바뀌면 새로 그림(기존 인스턴스 재사용 시 edge 오류)
 $('#mmS').textContent=`${S.ct==='ALL'?'전체':CT[S.ct][1]} ${leaves}개사`;
 const fs=innerWidth<640?10:11.5;
 MM.setOption({backgroundColor:'transparent',animation:false,tooltip:{trigger:'item',confine:true,formatter:p=>{const d=p.data;if(d.ci!=null){const c=C[d.ci];return `<b>${CT[c.country][0]} ${esc(c.name_ko)}</b> ${esc(c.ticker)}<br>${esc(c.products)}<br>시총 ${fB(c.mcap_usd)} · YTD ${fP(c.ytd)}<br>최근 분기 매출 ${fM(c.rev_last_usd_m)} (YoY ${c.rev_yoy==null?'–':(c.rev_yoy>0?'+':'')+c.rev_yoy+'%'})`}
   return `<b>${esc(d.name)}</b>${d.ytd!=null?'<br>시총가중 YTD '+fP(d.ytd):''}`}},
  series:[{type:'tree',data:[td],layout:lr?'orthogonal':'radial',orient:'LR',roam:true,initialTreeDepth:S.dep,expandAndCollapse:true,
   top:lr?14:'8%',bottom:lr?14:'8%',left:lr?150:'8%',right:lr?(innerWidth<640?150:230):'8%',symbol:'circle',
   lineStyle:{color:css('--line'),width:1.2,curveness:.5},
   label:{position:lr?'left':'inside',verticalAlign:'middle',align:lr?'right':'center',fontSize:fs,color:css('--ink'),
    formatter:p=>p.data.ci!=null?p.name:`{c|${p.name}}`,rich:{c:{fontWeight:700,fontSize:fs+.5,color:css('--ink')}}},
   leaves:{label:{position:lr?'right':'right',align:'left',color:css('--ink')}},
   itemStyle:{color:css('--acc'),borderColor:css('--acc')},emphasis:{focus:'descendant'}}]},true);
 MM.off('click');MM.on('click',p=>{if(p.data&&p.data.ci!=null){S.hl=p.data.ci;S.l1=null;S.l2=null;S.q='';$('#q').value='';go_('list');setTimeout(()=>{const r=document.querySelector(`tr[data-i="${p.data.ci}"]`);if(r)r.scrollIntoView({behavior:'smooth',block:'center'})},200)}})}
$('#mmCtl').querySelectorAll('button').forEach(b=>b.onclick=()=>{if(b.dataset.l){S.lay=b.dataset.l;$('#mmCtl').querySelectorAll('[data-l]').forEach(x=>x.classList.toggle('on',x===b))}else{S.dep=+b.dataset.d;$('#mmCtl').querySelectorAll('[data-d]').forEach(x=>x.classList.toggle('on',x===b))}renderMM()});

/* 히트맵 */
function renderHM(){const cols=['ALL',...CO];let h=`<table><tr><th class="l">카테고리</th>${cols.map(k=>`<th>${k==='ALL'?'전체':CT[k].join(' ')}</th>`).join('')}</tr>`;
 L1S.forEach(l1=>{h+=`<tr><td class="g" colspan="${cols.length+1}">${esc(l1)}</td></tr>`;
  TAX[l1].forEach(l2=>{const a=C.filter(c=>c.l1===l1&&c.l2===l2);if(!a.length)return;
   h+=`<tr><td class="l">${esc(l2)}</td>`+cols.map(k=>{const b=k==='ALL'?a:a.filter(c=>c.country===k);if(!b.length)return '<td class="e">·</td>';const v=wYtd(b);
    return `<td data-k="${k}" data-l1="${esc(l1)}" data-l2="${esc(l2)}" style="background:${ytdCol(v)}" title="${esc(l2)} · ${k==='ALL'?'전체':CT[k][1]} · 시총 ${fB(sum(b))}">${v==null?'–':(v>0?'+':'')+v.toFixed(0)+'%'}<small>(${b.length})</small></td>`}).join('')+'</tr>'})});
 $('#hm').innerHTML=h+'</table>';
 $('#hm').querySelectorAll('td[data-k]').forEach(td=>td.onclick=()=>{S.ct=td.dataset.k;setDep(td.dataset.k==='ALL'?2:9);S.l1=td.dataset.l1;S.l2=td.dataset.l2;go_('list')})}

/* 표 */
function spark(a,w=72,h=22){if(!a||a.length<2)return '';const mn=Math.min(...a),mx=Math.max(...a),r=mx-mn||1;const pts=a.map((v,i)=>`${(i/(a.length-1)*w).toFixed(1)},${(h-2-(v-mn)/r*(h-4)).toFixed(1)}`).join(' ');
 const up=a[a.length-1]>=a[0];return `<svg class="spk" width="${w}" height="${h}"><polyline points="${pts}" fill="none" stroke="${up?css('--up'):css('--dn')}" stroke-width="1.4"/></svg>`}
function bars(c,w=86,h=24){const q=(c.qrev||[]).filter(x=>x.rev!=null);if(q.length<2)return '';const mx=Math.max(...q.map(x=>x.rev),1);const bw=w/q.length;
 const tip=q.map(x=>`${x.q} ${(x.rev/1e6*(c.rev_usd_f||0)).toFixed(0)}M$`).join(' / ');
 return `<svg class="spk" width="${w}" height="${h}"><title>${esc(tip)}</title>${q.map((x,i)=>{const bh=Math.max(1,x.rev/mx*(h-2));return `<rect x="${(i*bw+1).toFixed(1)}" y="${(h-bh).toFixed(1)}" width="${(bw-2).toFixed(1)}" height="${bh.toFixed(1)}" rx="1" fill="${i===q.length-1?css('--acc'):css('--mut')}" opacity="${i===q.length-1?1:.45}"/>`}).join('')}</svg>`}
const COLS=[{h:'회사',k:c=>c.name_ko},{h:'제품·사업',k:c=>c.products},{h:'시가총액',n:1,k:c=>c.mcap_usd},{h:'YTD',n:1,k:c=>c.ytd},{h:'1M',n:1,k:c=>c.m1},{h:'1Y 주가',k:null},{h:'고점 대비',n:1,k:c=>c.from_high},{h:'분기 매출 추이 (최근 8Q)',n:1,k:c=>c.rev_last_usd_m},{h:'매출 YoY',n:1,k:c=>c.rev_yoy},{h:'OPM',n:1,k:c=>c.opm},{h:'PER',n:1,k:c=>c.per}];
function renderL1(){const a=C.filter(inCt);$('#l1Ctl').innerHTML='<span class="lb">대분류</span>'+[[null,'전체',a.length],...L1S.map(l=>[l,l,a.filter(c=>c.l1===l).length])].filter(x=>x[2]).map(([k,l,n])=>`<button data-k="${k??''}" class="${(S.l1??'')===(k??'')?'on':''}">${esc(l)}<span class="c">${n}</span></button>`).join('')+(S.l2&&!S.l1?`<button class="on" data-x="1">${esc(S.l2)} ✕</button>`:'');
 $('#l1Ctl').querySelectorAll('button[data-k]').forEach(b=>b.onclick=()=>{S.l1=b.dataset.k||null;S.l2=null;renderTable()});const x=$('#l1Ctl [data-x]');if(x)x.onclick=()=>{S.l2=null;renderTable()}
 if(S.l1){const b=C.filter(inCt).filter(c=>c.l1===S.l1);$('#l2Ctl').innerHTML='<span class="lb">하위 분류</span>'+[[null,'전체',b.length],...TAX[S.l1].map(l=>[l,l,b.filter(c=>c.l2===l).length])].filter(x=>x[2]).map(([k,l,n])=>`<button data-k="${esc(k??'')}" class="${(S.l2??'')===(k??'')?'on':''}">${esc(l)}<span class="c">${n}</span></button>`).join('');
  $('#l2Ctl').querySelectorAll('button').forEach(b2=>b2.onclick=()=>{S.l2=b2.dataset.k||null;renderTable()})}else $('#l2Ctl').innerHTML=''}
function row(c){return `<tr data-i="${c.i}" class="co1 ${S.hl===c.i?'hl':''}" style="--l1c:${l1c(c.l1)}"><td class="co"><span class="flag">${CT[c.country][0]}</span><b>${esc(c.name_ko)}</b><div class="tk">${esc(c.ticker)} · ${esc(c.name_en)}</div></td><td class="prod">${esc(c.products)}<div class="tk" style="font-size:10.5px">${esc(c.l2)}</div></td>
 <td class="n">${fB(c.mcap_usd)}</td><td class="n">${fP(c.ytd)}</td><td class="n">${fP(c.m1)}</td><td>${spark(c.spark)}</td><td class="n">${fP(c.from_high)}</td>
 <td><div class="rv">${bars(c)}<div class="num">${fM(c.rev_last_usd_m)}<small class="mut">${c.qrev&&c.qrev.length?esc(c.qrev[c.qrev.length-1].q):''}</small></div></div></td>
 <td class="n">${fP(c.rev_yoy)}</td><td class="n">${c.opm==null?'–':c.opm.toFixed(1)+'%'}</td><td class="n">${c.per==null?'–':c.per.toFixed(1)}</td></tr>`}
function renderCt(){const n=k=>k==='ALL'?C.length:C.filter(c=>c.country===k).length;
 $('#ctCtl').innerHTML='<span class="lb">국가</span>'+[['ALL','🌐 전체'],...CO.map(k=>[k,CT[k].join(' ')])].map(([k,l])=>`<button data-k="${k}" class="${S.ct===k?'on':''}">${l}<span class="c">${n(k)}</span></button>`).join('')
  +'<span class="lb" style="margin-left:12px">묶음</span>'+[['chain','밸류체인별'],['ct','국가 → 밸류체인']].map(([k,l])=>`<button data-g="${k}" class="${S.grp===k?'on':''}">${l}</button>`).join('');
 $('#ctCtl').querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{S.ct=b.dataset.k;S.l2=null;setDep(S.ct==='ALL'?2:9);render();$('#tblCard').scrollIntoView()});
 $('#ctCtl').querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{S.grp=b.dataset.g;renderTable()})}
function renderTable(){renderCt();renderL1();const q=S.q.trim().toLowerCase();
 let a=C.filter(inCt).filter(c=>(!S.l1||c.l1===S.l1)&&(!S.l2||c.l2===S.l2)&&(!q||[c.name_ko,c.name_en,c.ticker,c.products,c.l2].join(' ').toLowerCase().includes(q)));
 const hd='<tr>'+COLS.map((c,i)=>`<th class="${c.n?'n':''}" data-i="${i}">${c.h}<span class="ar">${S.sort&&S.sort.c===i?(S.sort.d<0?'▼':'▲'):''}</span></th>`).join('')+'</tr>';let body='';
 if(S.sort){const k=COLS[S.sort.c].k;a=a.slice().sort((x,y)=>{const u=k(x),v=k(y);if(u==null)return 1;if(v==null)return -1;return (u>v?1:u<v?-1:0)*S.sort.d});body=a.map(row).join('')}
 else if(S.grp==='ct')CO.forEach(k=>{const b=a.filter(c=>c.country===k);if(!b.length)return;body+=`<tr class="g1"><td colspan="${COLS.length}">${CT[k].join(' ')} <span class="mut" style="font-weight:400;font-size:12px">· ${b.length}개사 · ${fB(sum(b))} · YTD ${fP(wYtd(b))}</span></td></tr>`;
  L1S.forEach(l1=>TAX[l1].forEach(l2=>{const cs=b.filter(c=>c.l1===l1&&c.l2===l2).sort((x,y)=>(y.mcap_usd||0)-(x.mcap_usd||0));if(!cs.length)return;body+=`<tr class="g2" style="--l1c:${l1c(l1)}"><td colspan="${COLS.length}"><span class="b">${esc(l1)}</span>${esc(l2)}<span class="s2">${cs.length}개사 · ${fB(sum(cs))} · YTD ${fP(wYtd(cs))}</span></td></tr>`+cs.map(row).join('')}))})
 else L1S.forEach(l1=>{const b=a.filter(c=>c.l1===l1);if(!b.length)return;body+=`<tr class="g1" style="--l1c:${l1c(l1)}"><td colspan="${COLS.length}">${esc(l1)} <span class="mut" style="font-weight:400;font-size:12px">· ${b.length}개사 · ${fB(sum(b))} · YTD ${fP(wYtd(b))}</span></td></tr>`;
  TAX[l1].forEach(l2=>{const cs=b.filter(c=>c.l2===l2).sort((x,y)=>(y.mcap_usd||0)-(x.mcap_usd||0));if(!cs.length)return;body+=`<tr class="g2" style="--l1c:${l1c(l1)}"><td colspan="${COLS.length}"><span class="b">${esc(l1)}</span>${esc(l2)}<span class="s2">${cs.length}개사 · ${fB(sum(cs))} · YTD ${fP(wYtd(cs))} · 1W ${fP(wAvg(cs,'w1'))}</span></td></tr>`+cs.map(row).join('')})});
 $('#tbl').innerHTML=hd+body;$('#tS').textContent=`${a.length}개사${S.l2?' · '+S.l2:''}`;
 $('#tbl').querySelectorAll('th').forEach(th=>th.onclick=()=>{const i=+th.dataset.i;if(!COLS[i].k)return;S.sort=!S.sort||S.sort.c!==i?{c:i,d:-1}:S.sort.d<0?{c:i,d:1}:null;renderTable()});
 $('#tNote').innerHTML='정렬: 열 제목 1번 클릭 내림차순 · 2번 오름차순 · 3번 원래 순서(카테고리별 묶음). 분기 매출 막대는 최근 8개 분기(파란 막대=최신), 금액은 USD 환산, 막대에 마우스를 올리면 분기별 값. PER은 최근 4분기 EPS 합 기준(적자·통화 불일치 시 –).'}
$('#q').oninput=e=>{S.q=e.target.value;renderTable()};
const I=D.issues||{};const md=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
function renderHome(){const st=I.market||{};const A=st.all||{};
 const blk=(k,lab,f)=>{const b=(I.insights||{})[k];if(!b)return '';return `<div class="ins-blk"><h3>${lab} <span class="chips" style="display:inline-flex;margin-left:6px"><span>유니버스 ${f} ${fP(A[{daily:'day',weekly:'w1',monthly:'m1'}[k]])}</span></span></h3><div class="hl">${md(b.headline)}</div><ul>${(b.bullets||[]).map(x=>`<li>${md(x)}</li>`).join('')}</ul></div>`};

 const mv=(I.movers||{}).w1||{up:[],dn:[]};

let VIEW='home';
