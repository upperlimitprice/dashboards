<script>
const IDX=JSON.parse(document.getElementById('vidx').textContent);
const cache={};let CUR=null;
const qd=p=>/^\d{4}Q[1-4]$/.test(p)?p[5]+'Q'+p.slice(2,4):p;
const fmt=v=>v==null?'-':Math.abs(v)>=10000?(v/10000).toFixed(2)+'조':Math.round(v).toLocaleString();
const fmtU=v=>v==null?'-':Math.abs(v)>=10000?(v/10000).toFixed(2)+'조':Math.round(v).toLocaleString()+'억';
const pc=v=>v==null?'-':`<span class='${v>0?'up':'dn'}'>${v>0?'+':''}${v.toFixed(1)}%</span>`;
const COLS=['#5E86C2','#DE8B4B','#6BAE78','#9F7EC4','#D26F82','#4FA3B2','#BFA84A','#98A2AE'];
let TIP=null;
function tShow(h,ev){if(!TIP){TIP=document.createElement('div');TIP.id='vstip';document.body.appendChild(TIP);}
 TIP.innerHTML=h;TIP.style.display='block';
 TIP.style.left=Math.min(window.innerWidth-210,ev.clientX+14)+'px';
 TIP.style.top=(ev.clientY+window.scrollY+10)+'px';}
const tHide=()=>{if(TIP)TIP.style.display='none';};
// ── 검색 드롭다운
const q=document.getElementById('q'),sug=document.getElementById('sug');
let SUGL=[],SEL=-1;
function renderSug(){
  if(!SUGL.length){sug.classList.remove('open');sug.innerHTML='';return;}
  sug.innerHTML=SUGL.map((n,i)=>`<li class='${i===SEL?"sel":""}' data-i='${i}'><span>${n}</span><small>${IDX[n][2]}분기</small></li>`).join('');
  sug.classList.add('open');
  sug.querySelectorAll('li').forEach(li=>{li.addEventListener('mousedown',ev=>{ev.preventDefault();pick(+li.dataset.i);});});
}
function pick(i){const n=SUGL[i];if(!n)return;q.value=n;SUGL=[];renderSug();load(n);}
q.addEventListener('input',()=>{const v=q.value.trim();
  if(!v){SUGL=[];renderSug();return;}
  SUGL=Object.keys(IDX).filter(n=>n.includes(v)).slice(0,12);SEL=-1;renderSug();});
q.addEventListener('keydown',ev=>{
  if(ev.key==='ArrowDown'){ev.preventDefault();if(SUGL.length){SEL=(SEL+1)%SUGL.length;renderSug();}}
  else if(ev.key==='ArrowUp'){ev.preventDefault();if(SUGL.length){SEL=(SEL-1+SUGL.length)%SUGL.length;renderSug();}}
  else if(ev.key==='Enter'){ev.preventDefault();if(SUGL.length)pick(SEL>=0?SEL:0);}
  else if(ev.key==='Escape'){SUGL=[];renderSug();}});
q.addEventListener('blur',()=>setTimeout(()=>{SUGL=[];renderSug();},150));
// ── 최근 목록
function recents(){try{return JSON.parse(localStorage.getItem('vsRecent')||'[]');}catch(_){return[];}}
function drawRecent(){
  document.getElementById('recent').innerHTML=recents().map(n=>
    `<a href='#${encodeURIComponent(n)}' class='${CUR===n?"on":""}' onclick='load("${n}");return false;'>${n}<small>${IDX[n]?IDX[n][2]+'분기':''}</small></a>`).join('')||"<a style='pointer-events:none'>없음</a>";}
// ── 차트 헬퍼 (호버 공통)
function hookHover(svgId,qs,htmlAt){
  const svg=document.getElementById(svgId);if(!svg)return;
  const W=+svg.viewBox.baseVal.width,L=64,R=40,n=qs.length;
  svg.addEventListener('mousemove',ev=>{
    const rc=svg.getBoundingClientRect();
    const vx=(ev.clientX-rc.left)*W/rc.width;
    const i=Math.max(0,Math.min(n-1,Math.round(n===1?0:(vx-L-20)/((W-L-R-40)/(n-1)))));
    tShow(htmlAt(i),ev);});
  svg.addEventListener('mouseleave',tHide);
}

  const pmx=Math.max(...[...opmS,...gpmS,...cgrS].filter(v=>v!=null),10)*1.1;
  const pmn=Math.min(...opmS.filter(v=>v!=null),0);
  const Y2=v=>T+(H-T-B)*(1-(v-pmn)/(pmx-pmn));
  [[cgrS,'#8b95ab',1.4,'4,3'],[gpmS,'var(--grn)',2,''],[opmS,'var(--acc)',2.4,'']].forEach(([S,c,w,da])=>{
    const pts=S.map((v,i)=>v==null?null:`${X(i).toFixed(1)},${Y2(v).toFixed(1)}`).filter(Boolean);
    if(pts.length>1)s1+=`<polyline points='${pts.join(' ')}' fill='none' stroke='${c}' stroke-width='${w}' ${da?`stroke-dasharray='${da}'`:''}/>`;
    S.forEach((v,i)=>{if(v!=null)s1+=`<circle cx='${X(i).toFixed(1)}' cy='${Y2(v).toFixed(1)}' r='2.2' fill='${c}'/>`;});});
  s1+=xlabels(W,H,L,R,qs,qd)+'</svg>';
  html+=`<div class='card'><div class='chead'><b>① 손익 요약</b><small>막대=매출(좌) · 선=원가율(회색 점선)/GPM(초록)/OPM(파랑) %</small></div>${s1}
   <details><summary>숫자 표 보기</summary><div class='tblwrap'><table><tr><th>구분</th>${qs.map(q=>`<th>${qd(q)}</th>`).join('')}</tr>
   ${[['매출액',q=>fmt(rev(q))],['매출원가',q=>fmt(g(e.is,q,'매출원가'))],['매출총이익',q=>fmt(g(e.is,q,'매출총이익'))],['판관비',q=>fmt(g(e.is,q,'판매비와관리비'))],['영업이익',q=>fmt(g(e.is,q,'영업이익'))],['순이익',q=>fmt(g(e.is,q,'당기순이익'))],['OPM',q=>{const r=rev(q),v=g(e.is,q,'영업이익');return r&&v!=null?(v/r*100).toFixed(1)+'%':'-';}]].map(([nm2,fn])=>`<tr><td>${nm2}</td>${qs.map(q=>`<td>${fn(q)}</td>`).join('')}</tr>`).join('')}
   </table></div></details></div>`;
  // ② 비용 세부(성격별 %of sales 스택) — cogs+판관 통합 세부
  function stackSec(title,data,note){
    const labs=[];qs.forEach(p=>Object.keys(data&&data[p]||{}).forEach(k=>{if(!/합\s*계|총\s*계/.test(k)&&!labs.includes(k))labs.push(k);}));
    if(!labs.length)return '';
    const lastD=qs.filter(p=>data[p]).slice(-1)[0];
    labs.sort((a,b)=>Math.abs((data[lastD]||{})[b]||0)-Math.abs((data[lastD]||{})[a]||0));
    const top=labs.slice(0,7),rest=labs.slice(7);
    const items=top.concat(rest.length?['기타(합)']:[]);
    const at=(p,it)=>{const d=data[p]||{};
      if(it==='기타(합)')return rest.reduce((s,l)=>s+Math.max(0,d[l]||0),0);
      return Math.max(0,d[it]||0);};
    const pct=(p,it)=>{const r=rev(p);return r?at(p,it)/r*100:0;};
    const tots=qs.map(p=>items.reduce((s,it)=>s+pct(p,it),0));
    const mx=Math.max(...tots,10)*1.12;
    const sid='v'+title.replace(/[^a-z]/gi,'');
    let s=`<svg id='${sid}' viewBox='0 0 ${W} ${H}' style='width:100%'>`;
    s+=axes(W,H,L,B,T,R,mx,0,v=>v.toFixed(0)+'%');
    qs.forEach((p,i)=>{let y0=H-B;const x=(X(i)-bw/2).toFixed(1);
      items.forEach((it,si)=>{const v=pct(p,it);if(!v)return;
        const hp=(H-T-B)*v/mx;y0-=hp;
        s+=`<rect x='${x}' y='${y0.toFixed(1)}' width='${bw.toFixed(1)}' height='${hp.toFixed(1)}' fill='${COLS[si%8]}' opacity='.85'/>`;});});
    s+=xlabels(W,H,L,R,qs,qd)+'</svg>';
    const leg="<div class='lg'>"+items.map((it,si)=>`<span style='color:${COLS[si%8]}'>■</span> ${it}`).join(' · ')+(note?` · ${note}`:'')+"</div>";
    const tbl=`<details><summary>숫자 표 보기 (억원 / %of Sales)</summary><div class='tblwrap'><table><tr><th>항목</th>${qs.map(q=>`<th>${qd(q)}</th>`).join('')}</tr>
     ${items.map(it=>`<tr><td>${it}</td>${qs.map(p=>`<td>${fmt(at(p,it))}<br><small style='color:#67718a'>${pct(p,it)?pct(p,it).toFixed(1)+'%':'-'}</small></td>`).join('')}</tr>`).join('')}</table></div></details>`;
    window['__at_'+sid]={qs,items,at,pct};
    return {html:`${s}${leg}${tbl}`,sid,items,at,pct};
  }
  const cq={};Object.keys(e.q||{}).forEach(k=>{cq[k]=e.q[k];});
  const c2=stackSec('cost',cq,'비용의 성격별 분류(원가·판관 통합 세부) 기준');
  const _rq=Object.keys(cq).sort().slice(-4);
  const fbOnly=_rq.length&&_rq.every(q=>Object.keys(cq[q]).every(k=>k.includes('세부 미공시')));
  if(c2)html+=`<div class='card'><div class='chead'><b>② 비용 세부 — %of Sales</b><small>${fbOnly?"<span style='color:#b06a1e;font-weight:700'>⚠ 성격별 분류 미공시 기업</span> — 매출원가·판관비 총액으로 표시":"성격별 항목 / 매출 대비 비중 스택"}</small></div>${c2.html}</div>`;
  const c3=stackSec('sga',e.sga||{}, '판매비와관리비 주석 세부');
  if(c3)html+=`<div class='card'><div class='chead'><b>③ 판관비 세부 — %of Sales</b><small>주석 항목별</small></div>${c3.html}</div>`;
  const c4=stackSec('seg',e.seg||{}, '사업부별 매출 (베스트에포트)');
  if(c4)html+=`<div class='card'><div class='chead'><b>④ 세그먼트 매출 — %of Sales</b><small>사업부/제품군</small></div>${c4.html}</div>`;
  html+=`<p class='sub'>ⓘ 재고자산(연결/별도) 섹션은 파서 준비 중 · 원가/판관 분리 세부 대신 성격별 통합 세부를 사용</p>`;
  document.getElementById('rep').innerHTML=html;
  document.getElementById('dlvsb').onclick=()=>dlvs(nm,e);
  document.querySelector('.report').scrollIntoView({behavior:'smooth',block:'start'});
  // 호버
  hookHover('v1',qs,i=>{const p=qs[i];
    return `<b>${qd(p)}</b><br>매출 <b>${fmtU(rev(p))}</b><br>원가율 ${cgrS[i]!=null?cgrS[i].toFixed(1)+'%':'-'} · GPM ${gpmS[i]!=null?gpmS[i].toFixed(1)+'%':'-'} · OPM ${opmS[i]!=null?opmS[i].toFixed(1)+'%':'-'}`;});
  [c2,c3,c4].forEach(c=>{if(!c)return;
    hookHover(c.sid,qs,i=>{const p=qs[i];
      let h=`<b>${qd(p)}</b>`;
      c.items.forEach((it,si)=>{const v=c.at(p,it);if(v)h+=`<br><span style='color:${COLS[si%8]}'>■</span> ${it}: ${fmtU(v)} (${c.pct(p,it).toFixed(1)}%)`;});
      return h;});});
}
drawRecent();

window.addEventListener('hashchange',()=>{try{const h=decodeURIComponent(location.hash.slice(1));if(h&&h!==CUR&&IDX[h])load(h);}catch(_){}});
</script>
