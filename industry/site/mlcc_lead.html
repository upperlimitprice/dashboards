*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Segoe UI",sans-serif}
.wrap{max-width:1200px;margin:0 auto;padding:20px 16px 48px}
a{color:var(--s1)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--text2);margin:0}
.meta{color:var(--muted);font-size:12px;text-align:right}
.meta a{color:var(--muted)}
.banner{margin:14px 0 0;padding:10px 12px;border:1px solid var(--border);border-left:3px solid var(--warn);background:var(--surface);border-radius:8px;color:var(--text2);font-size:13px}
.banner b{color:var(--text)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:18px 0}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.kpi .l{color:var(--text2);font-size:12px}
.kpi .v{font-size:24px;font-weight:650;letter-spacing:-.01em;margin:2px 0;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:13px;font-weight:500;color:var(--text2);margin-left:3px}
.kpi .d{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.kpi .d .up{color:var(--up)}.kpi .d .down{color:var(--down)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 14px 10px;min-width:0}
.card h2{font-size:14px;margin:0 0 2px}
.card .note{color:var(--muted);font-size:12px;margin:0 0 6px}
.chart{height:320px;width:100%}
details{margin-top:6px}
summary{cursor:pointer;color:var(--muted);font-size:12px}
.tbl{overflow-x:auto;margin-top:6px}
table{border-collapse:collapse;width:100%;font-size:12px;font-variant-numeric:tabular-nums}
th,td{padding:5px 8px;border-bottom:1px solid var(--grid);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--text2);font-weight:600;position:sticky;top:0;background:var(--surface)}
.section{margin-top:22px}
.section h3{font-size:13px;color:var(--text2);margin:0 0 8px}
ul.notes{color:var(--text2);font-size:13px;padding-left:18px;margin:0}
.empty{padding:40px 16px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--border);border-radius:10px}

<script>
const P = JSON.parse(document.getElementById('page-data').textContent);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmt(v, d=1){ if(v==null||isNaN(v)) return '—'; const a=Math.abs(v); return v.toLocaleString('ko-KR',{maximumFractionDigits: a>=1000?0:d}); }
function fmtAxis(v){ const a=Math.abs(v); if(a>=1e9) return (v/1e9).toFixed(1)+'B'; if(a>=1e6) return (v/1e6).toFixed(1)+'M'; if(a>=1e4) return (v/1e3).toFixed(0)+'K'; return v.toLocaleString('ko-KR'); }

function renderStatic(){
  const app = document.getElementById('app');
  let h = `<div class="top"><div><h1>${esc(P.title)}</h1><p class="sub">${esc(P.subtitle)}</p></div>
    <div class="meta">갱신 ${esc(P.updated)}<br><a href="index.html">← 산업 트래커 목록</a></div></div>`;
  if (P.errors.length) h += `<div class="banner"><b>일부 데이터를 가져오지 못했습니다</b> — ${P.errors.map(esc).join(' · ')}</div>`;
  if (P.kpis.length) h += `<div class="kpis">${P.kpis.map(k => {
      let d = '';
      if (k.delta != null) { const cls = k.delta > 0 ? 'up' : k.delta < 0 ? 'down' : ''; d = `${esc(k.delta_label)} <span class="${cls}">${k.delta>0?'▲':k.delta<0?'▼':''} ${fmt(Math.abs(k.delta))}${esc(k.delta_unit)}</span>`; }
      if (k.asof) d += `${d?' · ':''}${esc(k.asof)}`;
      return `<div class="kpi"><div class="l">${esc(k.label)}</div><div class="v">${fmt(k.value)}<small>${esc(k.unit)}</small></div><div class="d">${d||'&nbsp;'}</div></div>`;
    }).join('')}</div>`;
  if (!P.charts.length && !P.tables.length) h += `<div class="empty">아직 수집된 데이터가 없습니다. 맥미니에서 <code>python run.py ${esc(P.key)}</code> 를 실행하세요.</div>`;
  h += `<div class="grid">${P.charts.map(c => `<div class="card"><h2>${esc(c.title)}</h2>${c.note?`<p class="note">${esc(c.note)}</p>`:''}
      <div class="chart" id="c-${esc(c.id)}" role="img" aria-label="${esc(c.title)}"></div>
      <details><summary>표로 보기</summary><div class="tbl">${chartTable(c)}</div></details></div>`).join('')}</div>`;
  for (const t of P.tables) h += `<div class="section card"><h2>${esc(t.title)}</h2>${t.note?`<p class="note">${esc(t.note)}</p>`:''}<div class="tbl"><table><thead><tr>${t.columns.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${t.rows.map(r=>`<tr>${r.map(v=>`<td>${typeof v==='number'?fmt(v):esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`;
  if (P.notes.length) h += `<div class="section"><h3>메모</h3><ul class="notes">${P.notes.map(n=>`<li>${esc(n)}</li>`).join('')}</ul></div>`;
  if (P.sources.length) h += `<div class="section"><h3>출처</h3><ul class="notes">${P.sources.map(s=>`<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)}</a></li>`).join('')}</ul></div>`;
  app.innerHTML = h;
}
function chartTable(c){
  const rows = c.x.map((x,i)=>[x, ...c.series.map(s=>s.data[i])]).reverse();
  return `<table><thead><tr><th></th>${c.series.map(s=>`<th>${esc(s.name)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((v,j)=>`<td>${j?fmt(v):esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}

const charts = [];
function option(c){
  const pal = [1,2,3,4,5,6,7,8].map(i=>css('--s'+i)), gray = css('--sx');
  const txt2 = css('--text2'), muted = css('--muted'), grid = css('--grid'), surface = css('--surface');
  const n = c.x.length, win = c.window && n > c.window ? c.window : (n > 60 ? 60 : n);
  const zoom = n > win;
  return {
    animation:false, textStyle:{fontFamily:'inherit', color:txt2},
    grid:{left:6, right:14, top:c.series.length>1?34:14, bottom:zoom?44:6, containLabel:true},
    tooltip:{trigger:'axis', axisPointer:{type:c.kind==='bar'?'shadow':'line'}, confine:true,
      valueFormatter:v=>v==null?'—':fmt(v)+(c.unit?' '+c.unit:'')},
    legend:c.series.length>1?{type:'scroll', top:0, icon:'roundRect', itemWidth:10, itemHeight:10, textStyle:{color:txt2}}:undefined,
    dataZoom:zoom?[{type:'inside', startValue:n-win, endValue:n-1},{type:'slider', height:16, bottom:6, startValue:n-win, endValue:n-1, borderColor:grid, textStyle:{color:muted}}]:[],
    xAxis:{type:'category', data:c.x, axisTick:{show:false}, axisLine:{lineStyle:{color:grid}}, axisLabel:{color:muted}},
    yAxis:{type:'value', name:c.unit, nameTextStyle:{color:muted, align:'left'}, splitLine:{lineStyle:{color:grid}}, axisLabel:{color:muted, formatter:fmtAxis}},
    series:c.series.map((s,i)=>{
      const k = s.kind || c.kind, color = s.slot === -1 ? gray : pal[(s.slot ?? i) % 8];
      const o = {name:s.name, type:k==='bar'?'bar':'line', data:s.data, color, emphasis:{focus:'series'}};
      if (k==='bar') Object.assign(o, {barMaxWidth:28, stack:c.stack?'t':undefined,
        itemStyle:{borderRadius:c.stack?0:[4,4,0,0], borderColor:surface, borderWidth:c.stack?1:0}});
      else Object.assign(o, {showSymbol:false, symbolSize:8, connectNulls:true, lineStyle:{width:2},
        stack:c.stack?'t':undefined, areaStyle:k==='area'?{opacity:c.stack?.85:.18}:undefined});
      return o;
    }),
  };
}
function drawCharts(){
  charts.splice(0).forEach(ch=>ch.dispose());
  if (typeof echarts === 'undefined') return;
  for (const c of P.charts){
    const el = document.getElementById('c-'+c.id);
    if (!el) continue;
    const ch = echarts.init(el, null, {renderer:'canvas'});
    ch.setOption(option(c));
    charts.push(ch);
  }
}
renderStatic();
drawCharts();
addEventListener('resize', ()=>charts.forEach(c=>c.resize()));
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', drawCharts);
</script>
