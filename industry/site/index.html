*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Segoe UI",sans-serif}
.wrap{max-width:1200px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:22px;margin:0 0 4px}.sub{color:var(--text2);margin:0 0 18px}
.sub a{color:var(--muted)}

.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:700px){.cards{grid-template-columns:minmax(0,1fr)}}
a.card{display:block;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px}
a.card:hover{border-color:var(--accent)}

.ks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.ks>div{min-width:0;overflow-wrap:anywhere}a.card{min-width:0}
.k .l{color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k .v{font-weight:650;font-variant-numeric:tabular-nums}.k .v small{font-weight:500;color:var(--text2);font-size:11px;margin-left:2px}
.k .d{font-size:11px;font-variant-numeric:tabular-nums}.up{color:var(--up)}.down{color:var(--down)}
.foot{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-top:10px}
.st{font-weight:600}.st.error,.st.skipped,.st.partial{color:var(--warn)}

const card = c => `<a class="card" href="${esc(c.key)}.html">
  <h2>${esc(c.title)}</h2><p>${esc(c.subtitle)}</p>
  <div class="ks">${(c.kpis||[]).slice(0,3).map(k=>`<div class="k"><div class="l">${esc(k.label)}</div><div class="v">${fmt(k.value)}<small>${esc(k.unit)}</small></div><div class="d ${k.delta>0?'up':k.delta<0?'down':''}">${k.delta==null?'&nbsp;':(k.delta>0?'▲':'▼')+' '+fmt(Math.abs(k.delta))+esc(k.delta_unit)+' '+esc(k.delta_label)}</div></div>`).join('')}</div>
  <div class="foot"><span class="st ${esc(c.status)}">${ST[c.status]||esc(c.status)}</span><span>${esc(c.updated||'')}</span></div></a>`;
const byKey = Object.fromEntries(C.map(c => [c.key, c]));
const gi = n => ((INS.groups || {})[n] || []);
document.getElementById('ins').innerHTML = INS.headline ? `<h2>🧭 종합 인사이트 <small>${esc(INS.at || '')} 갱신 · 페이지 KPI 기준</small></h2><div class="hl">${md(INS.headline)}</div><ul>${(INS.bullets||[]).map(b => `<li>${md(b)}</li>`).join('')}</ul>` : '';
document.getElementById('ins').style.display = INS.headline ? '' : 'none';
document.getElementById('cards').innerHTML = GROUPS.map(([name, keys]) => { const cs = keys.map(k => byKey[k]).filter(Boolean);
  return cs.length ? `<section class="grp"><h3>${esc(name)}<small>${cs.length}</small></h3>${gi(name).length ? `<ul class="gi">${gi(name).map(x => `<li>${md(x)}</li>`).join('')}</ul>` : ''}<div class="cards">${cs.map(card).join('')}</div></section>` : ''; }).join('');
</script>
</body>
</html>
