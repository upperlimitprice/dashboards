    }).join('')}</div>`;
  if (!P.charts.length && !P.tables.length) h += `<div class="empty">아직 수집된 데이터가 없습니다. 맥미니에서 <code>python run.py ${esc(P.key)}</code> 를 실행하세요.</div>`;
  h += `<div class="grid">${P.charts.map(c => `<div class="card"><h2>${esc(c.title)}</h2>${c.note?`<p class="note">${esc(c.note)}</p>`:''}
      <div class="chart" id="c-${esc(c.id)}" role="img" aria-label="${esc(c.title)}"></div>
      <details><summary>표로 보기</summary><div class="tbl">${chartTable(c)}</div></details></div>`).join('')}</div>`;
  for (const t of P.tables) h += `<div class="section card"><h2>${esc(t.title)}</h2>${t.note?`<p class="note">${esc(t.note)}</p>`:''}<div class="tbl"><table><thead><tr>${t.columns.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${t.rows.map(r=>`<tr>${r.map(v=>`<td>${typeof v==='number'?fmt(v):esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`;
  if (P.notes.length) h += `<div class="section"><h3>메모</h3><ul class="notes">${P.notes.map(n=>`<li>${esc(n)}</li>`).join('')}</ul></div>`;
  if (P.sources.length) h += `<div class="section"><h3>출처</h3><ul class="notes">${P.sources.map(s=>`<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)}</a></li>`).join('')}</ul></div>`;
  app.innerHTML = h;
}
function chartTable(c){
  const rows = c.x.map((x,i)=>[x, ...c.series.map(s=>s.data[i])]).reverse();
  return `<table><thead><tr><th></th>${c.series.map(s=>`<th>${esc(s.name)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((v,j)=>`<td>${j?fmt(v):esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}

const charts = [];
function option(c){
  const pal = [1,2,3,4,5,6,7,8].map(i=>css('--s'+i)), gray = css('--sx');
  const txt2 = css('--text2'), muted = css('--muted'), grid = css('--grid'), surface = css('--surface');
  const n = c.x.length, win = c.window && n > c.window ? c.window : (n > 60 ? 60 : n);
  const zoom = n > win;
  return {
    animation:false, textStyle:{fontFamily:'inherit', color:txt2},
    grid:{left:6, right:14, top:c.series.length>1?34:14, bottom:zoom?44:6, containLabel:true},
    tooltip:{trigger:'axis', axisPointer:{type:c.kind==='bar'?'shadow':'line'}, confine:true,
      valueFormatter:v=>v==null?'—':fmt(v)+(c.unit?' '+c.unit:'')},
    legend:c.series.length>1?{type:'scroll', top:0, icon:'roundRect', itemWidth:10, itemHeight:10, textStyle:{color:txt2}}:undefined,
    dataZoom:zoom?[{type:'inside', startValue:n-win, endValue:n-1},{type:'slider', height:16, bottom:6, startValue:n-win, endValue:n-1, borderColor:grid, textStyle:{color:muted}}]:[],
    xAxis:{type:'category', data:c.x, axisTick:{show:false}, axisLine:{lineStyle:{color:grid}}, axisLabel:{color:muted}},
    yAxis:{type:'value', name:c.unit, nameTextStyle:{color:muted, align:'left'}, splitLine:{lineStyle:{color:grid}}, axisLabel:{color:muted, formatter:fmtAxis}},
    series:c.series.map((s,i)=>{
      const k = s.kind || c.kind, color = s.slot === -1 ? gray : pal[(s.slot ?? i) % 8];
      const o = {name:s.name, type:k==='bar'?'bar':'line', data:s.data, color, emphasis:{focus:'series'}};
      if (k==='bar') Object.assign(o, {barMaxWidth:28, stack:c.stack?'t':undefined,
        itemStyle:{borderRadius:c.stack?0:[4,4,0,0], borderColor:surface, borderWidth:c.stack?1:0}});
      else Object.assign(o, {showSymbol:false, symbolSize:8, connectNulls:true, lineStyle:{width:2},
        stack:c.stack?'t':undefined, areaStyle:k==='area'?{opacity:c.stack?.85:.18}:undefined});
      return o;
    }),
  };
}
function drawCharts(){
  charts.splice(0).forEach(ch=>ch.dispose());
  if (typeof echarts === 'undefined') return;
  for (const c of P.charts){
    const el = document.getElementById('c-'+c.id);
    if (!el) continue;
    const ch = echarts.init(el, null, {renderer:'canvas'});
    ch.setOption(option(c));
    charts.push(ch);
  }
}
renderStatic();
drawCharts();
addEventListener('resize', ()=>charts.forEach(c=>c.resize()));
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', drawCharts);
</script>
</body>
</html>
