</div><script>
(function(){
  const tip=document.createElement('div');
  tip.style.cssText='position:fixed;display:none;background:#16181d;color:#fff;padding:8px 11px;border-radius:8px;font-size:12px;line-height:1.6;pointer-events:none;z-index:50;box-shadow:0 3px 12px rgba(0,0,0,.25)';
  document.body.appendChild(tip);
  const D=s=>Date.UTC(+s.slice(0,4),+s.slice(4,6)-1,+s.slice(6,8));
  document.querySelectorAll('.chartbox').forEach(box=>{
    let data=JSON.parse(box.dataset.chart), m=JSON.parse(box.dataset.meta), _v=box.dataset.v||'0';
    let span=D(m.d1)-D(m.d0);
    box.addEventListener('mousemove',e=>{
      if((box.dataset.v||'0')!==_v){data=JSON.parse(box.dataset.chart);m=JSON.parse(box.dataset.meta);span=D(m.d1)-D(m.d0);_v=box.dataset.v||'0';}
      const r=box.getBoundingClientRect();
      const fx=(e.clientX-r.left)/r.width*m.w;
      let f=(fx-m.l)/(m.w-m.l-m.r); f=Math.max(0,Math.min(1,f));
      const td=D(m.d0)+f*span;
      let rows='',dt='';
      data.forEach(sr=>{
        let lo=0,hi=sr.p.length-1;
        while(hi-lo>1){const md=(lo+hi)>>1; (D(sr.p[md][0])<=td)?lo=md:hi=md;}
        const pk=(hi<sr.p.length&&Math.abs(D(sr.p[hi][0])-td)<Math.abs(D(sr.p[lo][0])-td))?hi:lo;
        const [d,v]=sr.p[pk]; dt=d;
        const vs=Math.abs(v)>=10000?(v/10000).toFixed(1)+'조':(Math.abs(v)>=100?v.toLocaleString(undefined,{maximumFractionDigits:1}):v.toLocaleString(undefined,{maximumFractionDigits:2}));
        rows+=`<div><span style='color:${sr.c}'>●</span> ${sr.n}: <b>${vs}${sr.u||''}</b></div>`;
      });
      tip.innerHTML=`<div style='color:#9aa4ad'>${dt.slice(0,4)}-${dt.slice(4,6)}-${dt.slice(6,8)}</div>`+rows;
      tip.style.display='block';
      tip.style.left=Math.min(e.clientX+14,innerWidth-tip.offsetWidth-8)+'px';
      tip.style.top=(e.clientY+14)+'px';
    });
    box.addEventListener('mouseleave',()=>tip.style.display='none');
  });
})();
