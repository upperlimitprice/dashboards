<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RRG</title>
<style>
:root{--bg:#eef1f5;--card:#fff;--ink:#16202c;--mut:#67727f;--line:#e4e8ee;
--shadow:0 1px 3px rgba(20,30,45,.07),0 6px 20px rgba(20,30,45,.05)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);padding:22px 14px;
font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif}
.wrap{max-width:1080px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;
padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
h1{font-size:19px;margin-bottom:4px}
.sub{font-size:12.5px;color:var(--mut);line-height:1.6}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:12px}
.legend span{display:inline-flex;align-items:center;gap:5px;color:var(--mut)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;
font-size:12.5px;color:var(--mut);margin-bottom:10px}
.controls select,.controls button{font:inherit;color:var(--ink);background:#fff;
border:1px solid var(--line);border-radius:8px;padding:4px 8px;cursor:pointer}
.controls button.on{background:#e8edf7;border-color:#b9c8e8}
.controls input[type=range]{width:180px;accent-color:#2563eb}
#chartbox{position:relative}
.qgroup{margin-left:auto;display:inline-flex;gap:6px}
.selwrap{position:relative;display:inline-flex}
.selarrow{position:absolute;left:9px;top:50%;transform:translateY(-50%);pointer-events:none;font-size:10px;color:#67727f;z-index:1}
.secsel{font-weight:600;max-width:170px;text-align-last:center;padding-left:20px}
.secsel option{text-align:left}
.controls .qbtn{font-weight:700;border-width:1.5px;padding:4px 12px}
.qbtn.q-Improving{background:#dbeafe;border-color:#2563eb;color:#1e40af}
.qbtn.q-Leading{background:#dcfce7;border-color:#15803d;color:#14532d}
.qbtn.q-Weakening{background:#fef9c3;border-color:#ca8a04;color:#854d0e}
.qbtn.q-Lagging{background:#ffe4e6;border-color:#be123c;color:#9f1239}
.qbtn.on{box-shadow:0 0 0 2px currentColor inset;filter:saturate(1.3)}
#tip{position:absolute;pointer-events:none;background:#101826;color:#f4f6f9;
padding:7px 10px;border-radius:8px;font-size:12px;line-height:1.55;display:none;
max-width:250px;z-index:5;box-shadow:0 4px 14px rgba(0,0,0,.25)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{color:var(--mut);font-weight:600;text-align:left;border-bottom:1px solid var(--line);
padding:6px 8px;white-space:nowrap}
td{border-bottom:1px solid #f1f4f8;padding:6px 8px;white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.hl{background:#f2f6ff}
tr.pin{background:#fff8e6}
#tbl tbody tr{cursor:pointer}
.qtag{display:inline-flex;align-items:center;gap:5px;font-weight:600}
.note{font-size:12px;color:var(--mut);line-height:1.7}
.svgwrap{overflow-x:auto}
svg text{font-family:inherit}
.ins-head{font-size:14.5px;margin-bottom:11px}
.ins-asof{font-size:11.5px;color:var(--mut);font-weight:400;margin-left:7px}
.ins-dist{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:13px;font-size:13px;font-weight:600}
.ins-dist span{display:inline-flex;align-items:center;gap:6px}
.ins-rot{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.rot-chip{font-size:12px;font-weight:600;padding:4px 12px;border-radius:14px;border:1px solid var(--line);background:#fff;color:var(--ink);white-space:nowrap}
.ins-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px 26px}
.ins-blk{font-size:12.5px;line-height:1.85}
.ins-blk .t{font-weight:700;display:block;margin-bottom:3px}
.ins-blk .v{color:#8a95a2;font-weight:400}
@media(max-width:640px){body{padding:12px 6px}.card{padding:13px}.ins-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1 id="title"></h1>
    <div class="sub" id="meta"></div>
    <div class="legend" id="legend"></div>
  </div>
  <div class="card" id="insightCard" style="display:none">

  </div>
  <div class="card">

      <span class="selwrap"><span class="selarrow">▼</span><select id="sectorSel" class="secsel" title="종목 꼬리 강조"><option value="">종목 선택</option></select></span>
    </div>
    <div id="chartbox"><div class="svgwrap"><svg id="rrg"></svg></div><div id="tip"></div></div>
  </div>
  <div class="card">
    <table id="tbl"><thead><tr>
      <th></th><th>이름</th><th>사분면</th><th class="num">RS-Ratio</th>
      <th class="num">RS-Momentum</th><th class="num">주간 ΔR</th><th class="num">주간 ΔM</th>
      <th class="num">체류(주)</th></tr></thead><tbody></tbody></table>
  </div>
  <div class="card note" id="foot"></div>
</div>

    o.textContent=(DOT[p[2]]||'⚪')+' '+p[0];ss.appendChild(o);});
 ss.addEventListener('change',function(){pinned={};resetQ();if(this.value!=='')pinned[+this.value]=1;applyVis(-1);});})();
// 사분면 필터 버튼 — 클릭 시 그 사분면 섹터만 강조 (현재 주차 기준, 토글)
var activeQ=null;
function resetQ(){activeQ=null;Array.prototype.forEach.call(document.querySelectorAll('.qbtn'),function(b){b.classList.remove('on');});}
Array.prototype.forEach.call(document.querySelectorAll('.qbtn'),function(btn){
 btn.addEventListener('click',function(){
  var q=btn.getAttribute('data-q'),ss=document.getElementById('sectorSel');if(ss)ss.value='';
  if(activeQ===q){pinned={};resetQ();applyVis(-1);return;}
  activeQ=q;pinned={};var wi=+wkSlider.value;
  D.items.forEach(function(it,i){var k=atWeek(it,wi);var iq=(k>=0)?quad(it.r[k],it.m[k]):it.quad;if(iq===q)pinned[i]=1;});
  Array.prototype.forEach.call(document.querySelectorAll('.qbtn'),function(b){b.classList.toggle('on',b.getAttribute('data-q')===q);});
  applyVis(-1);});});
tailSel.addEventListener('change',render);
wkSlider.addEventListener('input',render);
document.getElementById('lblBtn').addEventListener('click',function(){
 showLbl=!showLbl;this.className=showLbl?'on':'';render();});
// 차트 이미지 복사: SVG(인라인 속성) → 캔버스(2x) → PNG → 클립보드. 클립보드 미지원 시 PNG 다운로드.
document.getElementById('copyBtn').addEventListener('click',function(){
 var btn=this, done=function(t){btn.textContent=t;setTimeout(function(){btn.textContent='📋 이미지 복사';},1600);};
 var node=svg.cloneNode(true);
 node.setAttribute('xmlns','http://www.w3.org/2000/svg');
 node.setAttribute('width',Wpx);node.setAttribute('height',Hpx);
 node.setAttribute('font-family',"-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif");
 node.removeAttribute('style');
 var cap=document.getElementById('title').textContent+' · '+document.getElementById('weekLbl').textContent;
 var S=2, top=34, cv=document.createElement('canvas');
 cv.width=Wpx*S; cv.height=(Hpx+top)*S;
 var ctx=cv.getContext('2d'); ctx.scale(S,S);
 ctx.fillStyle='#fff'; ctx.fillRect(0,0,Wpx,Hpx+top);
 ctx.fillStyle='#16202c'; ctx.font="700 14px -apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif";
 ctx.fillText(cap,14,22);
 var img=new Image();
 var url=URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(node)],{type:'image/svg+xml;charset=utf-8'}));
 img.onload=function(){
  ctx.drawImage(img,0,top,Wpx,Hpx); URL.revokeObjectURL(url);
  var png=new Promise(function(res){cv.toBlob(res,'image/png');});
  var fname='rrg_'+cap.replace(/[^\w가-힣.-]+/g,'_')+'.png';
  var download=function(){png.then(function(b){var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=fname;a.click();done('⬇️ 다운로드됨');});};
  if(navigator.clipboard&&window.ClipboardItem){
   navigator.clipboard.write([new ClipboardItem({'image/png':png})]).then(function(){done('✅ 복사됨');},download);
  }else{download();}
 };
 img.onerror=function(){done('⚠️ 실패');};
 img.src=url;
});
document.getElementById('playBtn').addEventListener('click',function(){
 var btn=this;
 if(playing){clearInterval(playing);playing=null;btn.textContent='▶ 재생';return;}
 var start=+wkSlider.value>=+wkSlider.max?Math.max(0,allWeeks.length-60):+wkSlider.value;
 wkSlider.value=start;btn.textContent='⏸ 정지';
 playing=setInterval(function(){
  var v=+wkSlider.value;
  if(v>=+wkSlider.max){clearInterval(playing);playing=null;btn.textContent='▶ 재생';return;}
  wkSlider.value=v+1;render();},450);
 render();});
function renderInsight(){
 var ins=D.insight; if(!ins){return;}
 var order=['Leading','Improving','Weakening','Lagging'];
 document.getElementById('insAsof').textContent='기준 '+esc(D.asof)+(D.asofProg?' · 당일 기준(장중 변동)':'');
 var dist=order.map(function(q){return '<span><span class="dot" style="background:'+COL[q]+'"></span>'+
  KO[q]+' <span style="color:'+COL[q]+'">'+(ins.dist[q]||0)+'</span></span>';}).join('');
 var rot;
 if(ins.rotations&&ins.rotations.length){
  rot=ins.rotations.map(function(r){
   return '<span class="rot-chip">'+esc(r.label)+' '+
    '<span style="color:'+COL[r.from]+'">'+KO[r.from]+'</span>→'+
    '<b style="color:'+COL[r.to]+'">'+KO[r.to]+'</b></span>';}).join('');
 }else{rot='<span style="font-size:12px;color:var(--mut)">전일 대비 사분면 이동 없음</span>';}
 function line(arr,fmt){return arr&&arr.length?arr.map(fmt).join('  ·  '):'<span style="color:#9aa4b0">해당 없음</span>';}
 var lead=line(ins.leaders,function(x){return esc(x.label)+' <span class="v">('+x.r+'·'+x.streak+'주)</span>';});
 var impr=line(ins.improving,function(x){return esc(x.label)+' <span class="v">(R'+x.r+'/M'+x.m+')</span>';});
 var lag=line(ins.laggards,function(x){return esc(x.label)+' <span class="v">('+x.r+')</span>';});
 var mu=line(ins.momUp,function(x){return esc(x.label)+' <span style="color:#15803d;font-weight:600">▲'+x.dm.toFixed(2)+'</span>';});
 var md=line(ins.momDown,function(x){return esc(x.label)+' <span style="color:#be123c;font-weight:600">▼'+Math.abs(x.dm).toFixed(2)+'</span>';});
 document.getElementById('insightBody').innerHTML=
  '<div class="ins-dist">'+dist+'</div>'+
  '<div class="ins-rot">'+rot+'</div>'+
  '<div class="ins-grid">'+
   '<div class="ins-blk"><span class="t" style="color:'+COL.Leading+'">🟢 주도 상위 <span class="v">(RS·체류주)</span></span>'+lead+'</div>'+
   '<div class="ins-blk"><span class="t" style="color:'+COL.Improving+'">🔵 개선 주목 <span class="v">(순환매 후보)</span></span>'+impr+'</div>'+
   '<div class="ins-blk"><span class="t" style="color:'+COL.Lagging+'">🔴 부진 경계 <span class="v">(RS 하위)</span></span>'+lag+'</div>'+
   '<div class="ins-blk"><span class="t">⚡ 모멘텀 급변 <span class="v">(주간 ΔM)</span></span>급등 '+mu+'<br>급락 '+md+'</div>'+
  '</div>';
 document.getElementById('insightCard').style.display='';
}
(function init(){
 document.getElementById('title').textContent=D.title;
 document.title=D.title;
 if(!Array.prototype.some.call(tailSel.options,function(o){return o.value==String(D.tail);})){
  var o=document.createElement('option');o.textContent=String(D.tail);tailSel.appendChild(o);}
 tailSel.value=String(D.tail);
 document.getElementById('meta').innerHTML=
  '기준일: <b>'+esc(D.asof)+'</b> ('+esc(D.asofMW||'')+') 종가'+
  (D.asofProg?' <span style="color:#b45309;font-weight:700">당일 기준(장중 변동)</span>':'')+
  ' / 벤치마크: <b>'+esc(D.bench)+'</b> / 일간, z-윈도우 '+
  D.win+'일, EMA'+D.emaSpan+' 평활 / 생성 '+esc(D.generated)+
  '<br>차트의 선이나 점을 <b>클릭하면 그 항목만 고정</b>해서 볼 수 있습니다 (여러 개 가능, 빈 곳 클릭 = 해제. 표의 행 클릭도 동일)';
 var lg=document.getElementById('legend');
 lg.innerHTML=['Leading','Weakening','Lagging','Improving'].map(function(q){
  return '<span><span class="dot" style="background:'+COL[q]+'"></span>'+q+' '+KO[q]+'</span>';
 }).join('')+'<span style="margin-left:auto">회전 방향: 대체로 시계방향 (Improving→Leading→Weakening→Lagging)</span>';
 renderInsight();
 var fx=[];
 if(D.excluded&&D.excluded.length){
  fx.push('제외: '+D.excluded.map(function(e){return esc(e.label)+'('+esc(e.reason)+')';}).join(', '));}
 if(D.asofProg){
  fx.push('갱신: 당일 포인트는 최신 종가로 요청 때마다 갱신되며 장 마감 후 확정. 과거일은 확정치.');}
 fx.push('데이터: '+esc(D.src));
 fx.push('공식: JdK RS-Ratio/Momentum 은 원식 비공개(라이선스) — 공개 표준 재구성'+
  '(주간 RS를 '+D.win+'주 롤링 z-정규화, EMA'+D.emaSpan+' 평활, 모멘텀=비율 변화율의 동일 정규화) 사용. '+
  'stockcharts 등 상용 구현과 수치가 완전히 일치하지 않을 수 있음.');
 fx.push('※ 과거 상대강도 통계이며 주가 방향 예측이나 매수/매도 권유가 아님.');
 document.getElementById('foot').innerHTML=fx.join('<br>');
 render();
})();
</script>
