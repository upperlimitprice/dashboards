<script>
const D={"segs": ["메모리", "파운드리", "팹리스·IP", "전공정 장비", "후공정 장비", "OSAT·테스트", "패키지 기판", "소재", "부품", "클린룸·팹 인프라", "광통신", "IDM(로직·아날로그)", "전력·화합물 반도체", "유통"], "ctry": {"US": {"name": "미국", "flag": "🇺🇸", "tone": {"summary": "AI·메모리 주도: 팹리스 YoY +75%, 메모리 +379%, IDM·소재만 다음 분기 역성장", "segments": [{"seg": "팹리스·IP", "tone": 2, "growth": "매출 QoQ +18.9%, YoY +75.3%, OPM 52.9%(전년 42.8%)", "guide": "엔비디아 3Q 매출 $108B ±2%(약 +12% QoQ), 브로드컴 4Q $34.8B(+93% YoY), 세그먼트 컨센 QoQ +14.2%"}, {"seg": "메모리", "tone": 2, "growth": "매출 QoQ +29.4%, YoY +379.0%, OPM 80.5%(전년 28.1%)", "guide": "마이크론 FQ1 매출 $61.5B ±$1.5B(GM 약 86.25%), 샌디스크 FQ2 $12.2~12.6B, 세그먼트 컨센 QoQ +13.7%"}, {"seg": "IDM(로직·아날로그)", "tone": -1, "growth": "매출 QoQ +5.7%, YoY +25.9%, OPM 26.5%(전년 14.5%)", "guide": "인텔 4Q 매출 $15.0~16.0B(GM 38%, CCPG -20% 이상 QoQ), TI 4Q $5.8~6.3B, 세그먼트 컨센 QoQ -2.1%"}, {"seg": "전공정 장비", "tone": 2, "growth": "매출 QoQ +16.8%, YoY +47.7%, OPM 37.4%(전년 30.6%)", "guide": "AMAT FQ1 매출 $11.1B ±$0.5B(+58% YoY), KLA 12월 분기 $4.7B ±$0.2B, 2027 WFE $200B 초과, 세그먼트 컨센 QoQ +7.4%"}, {"seg": "광통신", "tone": 2, "growth": "매출 QoQ +11.3%, YoY +40.3%, OPM 18.3%(전년 11.5%)", "guide": "코닝 4Q $5.2~5.3B(+약 19% YoY), 패브리넷 FQ2 $1.6~1.65B(+43% YoY), 시에나 FY27 +30% 이상, 세그먼트 컨센 QoQ +9.4%"}, {"seg": "유통", "tone": 0, "growth": "매출 QoQ +7.3%, YoY +39.0%, OPM 4.0%(전년 2.3%), 표본 소수(애로우 1사)", "guide": "애로우 다음 분기 컨센 QoQ -0.4%, 에브넷 FQ2 가이던스 중간값 약 +5% QoQ(14주 분기 효과 조정 시 +12%), 에브넷은 데이터 중복 의심으로 집계 제외"}, {"seg": "전력·화합물 반도체", "tone": 0, "growth": "매출 QoQ +9.3%, YoY +15.5%, OPM 11.6%(전년 4.1%)", "guide": "온세미 4Q $1.715~1.815B(중간값 +2.5% QoQ), 다이오드 4Q 약 $550M(+3.2% QoQ), 세그먼트 컨센 QoQ +1.1%"}, {"seg": "소재", "tone": -1, "growth": "매출 QoQ +7.8%, YoY +27.9%, OPM 19.2%(전년 18.5%)", "guide": "큐니티 4Q 컨센 QoQ -5.2%, 엘리먼트 4Q EBITDA 약 $175~176M(QoQ 약 -$15M), 세그먼트 컨센 QoQ -1.9%"}, {"seg": "부품", "tone": 1, "growth": "매출 QoQ +15.2%, YoY +44.7%, OPM 18.0%(전년 8.2%)", "guide": "울트라 클린 4Q $800~860M(중간값 +9.4% QoQ), 이코르 4Q $345~365M(+8% QoQ), 세그먼트 컨센 QoQ +4.1%"}, {"seg": "파운드리", "tone": 1, "growth": "매출 QoQ +8.0%, YoY +16.4%, OPM 14.7%(전년 11.8%), 표본 소수", "guide": "타워 4Q 매출 중간값 $600M(약 +14% QoQ), 세그먼트 컨센 QoQ +7.4%"}, {"seg": "OSAT·테스트", "tone": 0, "growth": "매출 QoQ +4.9%, YoY +0.2%, OPM 11.3%(전년 8.0%), 표본 소수(앰코 1사)", "guide": "앰코 4Q 매출 $1.9~2.0B, GM 18~19%, 컨센 QoQ -0.3%"}, {"seg": "후공정 장비", "tone": 1, "growth": "매출 QoQ +5.9%, YoY +74.7%, OPM 26.5%(전년 11.9%)", "guide": "테라다인 4Q $1.25~1.35B(+약 20% YoY), 코후 2027 매출 +30~40%, 세그먼트 컨센 QoQ +3.3%"}], "best": ["팹리스·IP", "메모리", "광통신"], "worst": ["IDM(로직·아날로그)", "소재", "유통"]}, "md": "## 미국\n\n### 한눈에\n- **AI 인프라와 메모리가 실적을 이끌었다.** 메모리 매출은 **YoY +379%**, OPM은 **80.5%**였다. 팹리스·IP는 **YoY +75.3%**(합계 **$163.6B**, OPM **52.9%**)였고, 후공정 장비는 **+74.7%**, 전공정 장비는 **+47.7%**였다.\n- **AI 노출이 적은 곳은 성장이 약했다.** OSAT(앰코)은 **YoY +0.2%**, 전력·화합물 반도체는 **+15.5%**, 파운드리는 **+16.4%**에 그쳤다. 울프스피드(**-21%**), 퀄컴(**-8%**), 스카이웍스(**-5%**)는 역성장했다.\n- **다음 분기 가이던스는 AI 쪽이 계속 강하다.** 다음 분기 컨센서스 매출 QoQ는 팹리스 **+14.2%**, 메모리 **+13.7%**, 광통신 **+9.4%**, 전공정 장비 **+7.4%**다. 엔비디아는 3Q **$108B**, 마이크론은 FQ1 **$61.5B**로 각각 사상 최대 매출을 가이드했다.\n- **약한 곳은 IDM과 소재다.** 컨센서스 QoQ는 IDM **-2.1%**, 소재 **-1.9%**다. 인텔은 PC(CCPG)가 **QoQ -20% 이상** 줄어들 것으로 봤다. 메모리 가격 급등이 PC·모바일 수요와 고객사 마진을 누르는 현상은 여러 업종에서 공통으로 언급됐다.\n- **수요보다 공급이 병목이다.** 엔비디아는 FY28 매출 **+70%**를 가이드했지만 공급 제약이 없다면 수요는 약 2배라고 했다. 장비 업체들은 2027 WFE를 **$200B 초과**로 본다. 마이크론은 메모리 수급이 2027~28년에 더 타이트해질 것으로 전망했다.\n\n### 밸류체인별 실적과 가이던스\n\n#### 팹리스·IP — 🟢강한 상향\n- **실적:** 29사 합계 매출 **$163,571M**이다. QoQ **+18.9%**, YoY **+75.3%**(기업 중앙값 +36.5%), OPM **52.9%**(전년 42.8%)를 기록했다.\n  - **엔비디아:** 매출 **$96.2B**(QoQ +17.9%, YoY +105.9%), 데이터센터 **$89B**, GM **75%**\n  - **브로드컴:** 매출 **$29.6B**(YoY +85.5%), AI 반도체 **$16.7B**, Non-GAAP 영업마진 **67.9%**\n  - **AMD:** 매출 **$13.4B**(QoQ +16.0%, YoY +44.7%). 수집된 콜은 2Q분(데이터센터 YoY +107%)이다.\n  - **퀄컴:** 매출 **$10.3B**(YoY **-8.4%**)\n- **가이던스·전망:**\n  - **엔비디아:** 3Q 매출 **$108B ±2%**(약 +12% QoQ), GM **74%**(Q4 71~72%가 바닥), FY28 **+약 70%**\n  - **브로드컴:** 4Q 매출 **$34.8B**(+93% YoY), AI 반도체 **$21.7B**(+236%). AI 매출은 FY27 약 **$115B**, FY28 약 **$230B**로 제시했다.\n  - **마벨:** Q3 **$3.15B ±5%**(+15% QoQ), FY28 약 **$18B**(+50%)\n  - **AMD:** 2027 데이터센터 **+100% 초과**. 4Q 컨센서스는 QoQ **+27.1%**다.\n  - **퀄컴:** FY27 핸드셋 시장 **low-teens 감소**, Apple향 매출은 12월 분기 약 **-50%**\n  - **세그먼트 컨센서스:** QoQ **+14.2%**\n- **해석:** 하이퍼스케일러 CapEx(2026년 약 **$8,000억** → 2027년 **$1.3조**)와 ASIC·네트워킹 수요가 성장을 이끈다. 반면 모바일 칩 업체들은 메모리 원가 상승과 Apple 물량 이탈로 부진하다.\n\n#### 메모리 — 🟢강한 상향 (표본 소수)\n- **실적:** 2사 합계 매출 **$65,260M**이다. QoQ **+29.4%**, YoY **+379.0%**, OPM **80.5%**(전년 28.1%)를 기록했다.\n  - **마이크론:** FQ4 매출 **$54.2B**(QoQ +31%, YoY +379%), GM **87%**, OPM **82.3%**. DRAM 가격은 high-teens %, NAND 가격은 약 30% 올랐다.\n  - **샌디스크:** FQ1 매출 **$11.0B**(QoQ +23%, YoY +378%), GPM **85.1%**, 데이터센터 **QoQ +61%**\n- **가이던스·전망:**\n  - **마이크론:** FQ1 매출 **$61.5B ±$1.5B**, GM 약 **86.25%**, EPS **$38.15**. 회사는 FQ1이 GM 저점이고 FY27에는 매 분기 매출이 순차 성장한다고 했다.\n  - **샌디스크:** FQ2 매출 **$12.2~12.6B**, GPM **84.5~85.5%**. 장기계약(NBM)이 FY27 비트의 약 **50%**를 커버한다.\n  - **세그먼트 컨센서스:** QoQ **+13.7%**\n- **해석:** HBM, 데이터센터 SSD, KV 캐시 수요가 공급을 크게 넘어선다. 마이크론은 2027~28년 수급이 더 타이트해진다고 보며, 균형 회복 시점은 보이지 않는다고 했다.\n\n#### IDM(로직·아날로그) — 🟠둔화\n- **실적:** 4사 합계 매출 **$28,211M**이다. QoQ **+5.7%**, YoY **+25.9%**, OPM **26.5%**(전년 14.5%)를 기록했다.\n  - **인텔:** 매출 **$16.5B**(YoY +20.9%), DCAI **$7.3B**(YoY 약 +80%), CCPG **$8.1B**(QoQ -9%)\n  - **TI:** 매출 **$6.1B**(QoQ +11%, YoY +28%), OPM **47%**, 데이터센터 YoY **+95%**\n  - **ADI:** 매출 **$4.02B**(YoY +40%), OPM **50%**\n  - **마이크로칩:** 매출 **$1.62B**(YoY +42.2%)\n- **가이던스·전망:**\n  - **인텔:** 4Q 매출 **$15.0~16.0B**(중간값 $15.5B), GM **38%**. Fab 28 사고로 매출 **-$3억**, GM **-200bp** 영향이 있고, CCPG는 QoQ **-20% 이상**이다.\n  - **TI:** 4Q **$5.8~6.3B**. 계절적 감소 대비로는 강한 보합이다.\n  - **ADI:** Q4 **$4.3B ±$0.1B**, OPM **52%**\n  - **컨센서스:** 마이크로칩 QoQ **-0.7%**, 세그먼트 **-2.1%**\n- **해석:** 서버 CPU, 데이터센터, 산업용은 강하다. 하지만 인텔의 PC 재고 조정(PC TAM 2026년 **-12%**, 2027년 **-10%** 가정)이 세그먼트 전체를 끌어내린다.\n\n#### 전공정 장비 — 🟢강한 상향\n- **실적:** 9사 합계 매출 **$24,438M**이다. QoQ **+16.8%**, YoY **+47.7%**, OPM **37.4%**(전년 30.6%)를 기록했다.\n  - **AMAT:** 매출 **$10.4B**(QoQ +14%, YoY +53%), Non-GAAP OPM **35.3%**\n  - **램리서치:** 매출 **$8.22B**(QoQ +22%, YoY +54%), OPM **40.2%**\n  - **KLA:** 매출 **$4.14B**(YoY +29%), OPM **46.1%**\n  - **온투:** YoY **+88%**\n- **가이던스·전망:**\n  - **AMAT:** FQ1(14주) 매출 **$11.1B ±$0.5B**(+58% YoY), GM 약 **50.8%**\n  - **램리서치:** 12월 분기 **$8.6B ±$0.4B**, OPM **40.5%**\n  - **KLA:** 12월 분기 **$4.7B ±$0.2B**\n  - **WFE:** 2026년 **mid-$150B**, 2027년 **$200B 초과**(AMAT 기준 **+30% 이상**)\n  - **세그먼트 컨센서스:** QoQ **+7.4%**\n- **해석:** DRAM·HBM, 선단 로직, 어드밴스드 패키징 투자가 동시에 늘고 있다. 고객사 가시성은 2028년까지 확보됐다. 다만 램리서치는 중국 비중(**35%**)이 12월 분기에 크게 줄 것으로 예고했다.\n\n#### 광통신 — 🟢강한 상향\n- **실적:** 14사 합계 매출 **$14,644M**이다. QoQ **+11.3%**, YoY **+40.3%**(중앙값 +50.3%), OPM **18.3%**(전년 11.5%)를 기록했다.\n  - **코닝:** 코어 매출 **$5.1B**(+19% YoY), 광통신 부문 **+44%**\n  - **루멘텀:** 매출 **$1.26B**(YoY +136.5%)\n  - **패브리넷:** 매출 **$1.47B**(YoY +51%), 데이터센터 **+78%**\n  - **AXT:** 매출 **$73.4M**(YoY +162%), GM **56.1%**\n- **가이던스·전망:**\n  - **코닝:** 4Q **$5.2~5.3B**(+약 19% YoY)\n  - **패브리넷:** FQ2 **$1.6~1.65B**(+43% YoY)\n  - **시에나:** Q4 **$1.75B ±$50M**, 백로그 **$8.5B**(FY 말 $10B 이상 전망), FY27 매출 **+30% 이상**($8.3~8.4B)\n  - **AXT:** Q4 약 **$90M**\n  - **비아비:** FQ2 **$505~515M**\n  - **컨센서스:** 루멘텀 QoQ **+24.4%**, 세그먼트 **+9.4%**\n- **해석:** 800G에서 1.6T로의 전환, scale-across(데이터센터 간 연결), OCS·CPO 신규 매출원이 수요를 끌어올린다. InP 기판과 레이저 공급 부족이 이어지고 있다.\n\n#### 유통 — 🟡중립 (표본 소수)\n- **실적:** 애로우 1사만 집계됐다. 매출 **$10,718M**, QoQ **+7.3%**, YoY **+39.0%**, OPM **4.0%**(전년 2.3%)다. 직전 분기 콜 기준 GC 매출은 **$7.4B**, Non-GAAP EPS는 **$5.45**(+124% YoY)였다.\n- **데이터 주의:** 에브넷은 최근 분기 매출이 애로우와 같은 값으로 수집돼 데이터 중복이 의심된다. 그래서 집계에서 제외했다.\n- **가이던스·전망:**\n  - **애로우:** 컨센서스 QoQ **-0.4%**\n  - **에브넷:** FQ2 가이던스 중간값 기준 약 **+5% QoQ**. FQ1이 14주였던 효과를 조정하면 +12%다.\n- **해석:** 메모리 가격 인상이 매출을 부풀리고 있다. 에브넷은 성장분의 약 1/3이 메모리 가격 효과라고 밝혔다. 물량 기준 모멘텀은 보합에 가깝다.\n\n#### 전력·화합물 반도체 — 🟡중립\n- **실적:** 6사 합계 매출 **$3,843M**이다. QoQ **+9.3%**, YoY **+15.5%**, OPM **11.6%**(전년 4.1%)를 기록했다.\n  - **온세미:** 매출 **$1.72B**(YoY +11%), AI 데이터센터 **$180M**(YoY +175%)\n  - **다이오드:** 매출 **$533M**(YoY +35.8%)\n  - **비샤이:** 매출 **$979M**(YoY +23.8%)\n  - **울프스피드:** 매출 **$155M**(YoY **-21%**, OPM -72.8%)\n- **가이던스·전망:**\n  - **온세미:** 4Q **$1.715~1.815B**(중간값 +2.5% QoQ), 비GAAP GM **41.5~43.5%**. 자동차 매출은 한 자릿수 후반 % 감소를 예상한다.\n  - **비샤이:** 4Q **$990M ±$15M**, GM **26%**\n  - **다이오드:** 4Q 약 **$550M ±3%**(+40.4% YoY), GM **37%**\n  - **세그먼트 컨센서스:** QoQ **+1.1%**\n- **해석:** 매출 성장은 완만하지만 가동률과 가격 개선으로 마진이 오르고 있다. AI 데이터센터 전력 수요(온세미 2027년 **2배** 전망)가 자동차 부진을 상쇄한다.\n\n#### 소재 — 🟠둔화\n- **실적:** 4사 합계 매출 **$3,773M**이다. QoQ **+7.8%**, YoY **+27.9%**, OPM **19.2%**(전년 18.5%)를 기록했다.\n  - **큐니티:** 매출 **$1.56B**(YoY +21.9%)\n  - **엔테그리스:** 매출 **$1.01B**(YoY +24.6%)\n  - **엘리먼트:** 매출 **$995M**(YoY +51.7%, 메탈 패스스루 포함)\n  - **포트로닉스:** 매출 **$216M**(YoY +2.7%)\n- **가이던스·전망:**\n  - **엔테그리스:** 4Q는 3Q 가이던스 중간값 대비 **약 +4%**(8월 기준 전망)\n  - **엘리먼트:** 4Q EBITDA 약 **$175~176M**(QoQ 약 -$15M, 계절성), 연간 EBITDA 약 **$720M**(상향)\n  - **포트로닉스:** FQ4 **$207~227M**\n  - **컨센서스:** 큐니티 QoQ **-5.2%**, 세그먼트 **-1.9%**\n- **해석:** 첨단 노드와 HBM용 소재는 강하다. 그러나 4분기 계절성이 겹치고, 포토마스크는 디자인 릴리즈 지연이 이어져 단기 모멘텀이 약하다.\n\n#### 부품 — 🟢상향\n- **실적:** 5사 합계 매출 **$3,478M**이다. QoQ **+15.2%**, YoY **+44.7%**, OPM **18.0%**(전년 8.2%)를 기록했다.\n  - **MKS:** 매출 **$1.41B**(YoY +43%)\n  - **울트라 클린:** 매출 **$759M**(YoY +48.8%)\n  - **어드밴스드 에너지:** 매출 **$696M**(YoY +50.3%, OPM 24.4%)\n  - **이코르:** 매출 **$329M**(YoY +37%)\n- **가이던스·전망:**\n  - **울트라 클린:** Q4 **$800~860M**(중간값 +9.4% QoQ)\n  - **이코르:** Q4 **$345~365M**(+8% QoQ)\n  - **어드밴스드 에너지:** Q4 **$735M ±$25M**, 2027 매출 **약 +30%**\n  - **폼팩터:** Q4 약 **$285M ±$10M**\n  - **컨센서스:** MKS QoQ **-0.7%**, 세그먼트 **+4.1%**\n- **해석:** 장비 램프를 그대로 따라가고 있다. MFC 등 핵심 부품이 부족하지만 고객사 포캐스트는 2027 WFE **$200B 이상**을 지지한다.\n\n#### 파운드리 — 🟢상향 (표본 소수)\n- **실적:** 2사 합계 매출 **$2,425M**이다. QoQ **+8.0%**, YoY **+16.4%**, OPM **14.7%**(전년 11.8%)를 기록했다.\n  - **글로벌파운드리스:** 매출 **$1.90B**(YoY +12.5%)\n  - **타워:** 매출 **$526M**(YoY +33%), SiPho 매출 약 **$240M**\n- **가이던스·전망:**\n  - **타워:** 4Q 매출 중간값 **$600M**(약 +14% QoQ), 2026년 **$2.0B**, 4Q SiPho 연환산 런레이트 **$1.1B 초과**\n  - **컨센서스:** 글로벌파운드리스 QoQ **+5.5%**, 세그먼트 **+7.4%**\n- **해석:** 실리콘 포토닉스가 성장을 이끈다. 반면 스마트모바일 매출은 메모리 가격 상승 영향으로 연간 low-teens % 감소가 예상된다.\n\n#### OSAT·테스트 — 🟡중립 (표본 소수)\n- **실적:** 앰코 1사만 집계됐다. 매출 **$1.99B**, QoQ **+4.9%**, YoY **+0.2%**, GM **18.3%**, OPM **11.3%**다. 부문별로는 컴퓨팅이 QoQ **+25%**, 커뮤니케이션이 **-8%**였다.\n- **가이던스·전망:** 4Q 매출 **$1.9~2.0B**, GM **18~19%**다. 컴퓨팅은 QoQ low double-digit 증가(YoY +50% 이상), 컨슈머는 **-10%대 중반**을 예상한다. 2026년 CapEx는 약 **$2.5B**이고, 컨센서스는 QoQ **-0.3%**다.\n- **해석:** 2.5D·HDFO 같은 AI 패키징은 강하다. 하지만 모바일·컨슈머 약세가 이를 상쇄해 전체 매출은 보합이다.\n\n#### 후공정 장비 — 🟢상향\n- **실적:** 4사 합계 매출 **$1,842M**이다. QoQ **+5.9%**, YoY **+74.7%**(중앙값 +96.2%), OPM **26.5%**(전년 11.9%)를 기록했다.\n  - **테라다인:** 매출 **$1.31B**(YoY +69.8%, QoQ -1.7%), 메모리 테스트 **$301M**(사상 최대)\n  - **쿨리케앤소파:** 매출 **$330M**(YoY +122.6%)\n  - **에어 테스트:** 매출 **$33.0M**(YoY +200%)\n- **가이던스·전망:**\n  - **테라다인:** 4Q **$1.25~1.35B**(+약 20% YoY), GM **57.5~58.5%**. 2027년 1분기도 4분기 대비 성장할 것으로 봤다.\n  - **코후:** Q4 **$178M ±$7M**(+46% YoY), 2027 **+30~40%**\n  - **에어 테스트:** FY27 **$150M**(+200%)\n  - **컨센서스:** 쿨리케앤소파 QoQ **+14.0%**, 세그먼트 **+3.3%**\n- **해석:** AI 칩 테스트 강도가 높아지고 HBM 수요가 늘고 있다. 테라다인에 따르면 반도체 CapEx 중 테스트 비중은 2025년 6.4%에서 2026년 8.1%로 올랐다. 단기 QoQ는 완만하지만 2027년 가시성이 높다.\n\n### 가이던스 톤 정리\n- **좋았던 곳**\n  - **팹리스·IP**\n    - 엔비디아: 3Q **$108B**, FY28 **+약 70%**\n    - 브로드컴: 4Q **$34.8B**(+93% YoY), AI 매출 FY27 **$115B**\n    - 마벨: FY28 **$18B**\n    - 세그먼트 컨센서스: QoQ **+14.2%**\n  - **메모리**\n    - 마이크론: FQ1 **$61.5B**, GM **86.25%**\n    - 샌디스크: FQ2 **$12.2~12.6B**\n    - 세그먼트 컨센서스: QoQ **+13.7%**\n  - **광통신**\n    - 시에나: FY27 **+30% 이상**, 백로그 **$8.5B**\n    - 패브리넷: FQ2 **+43% YoY**\n    - 루멘텀 컨센서스: QoQ **+24.4%**\n  - **전공정 장비**\n    - AMAT: FQ1 **$11.1B**(+58% YoY)\n    - 2027 WFE: **$200B 초과**\n- **나빴던 곳**\n  - **IDM**\n    - 인텔: 4Q **$15~16B**, GM **38%**, CCPG **QoQ -20% 이상**\n    - 세그먼트 컨센서스: QoQ **-2.1%**\n  - **소재**\n    - 큐니티 컨센서스: QoQ **-5.2%**\n    - 엘리먼트: 4Q EBITDA QoQ 약 **-$15M**\n    - 세그먼트 컨센서스: QoQ **-1.9%**\n  - **유통(표본 소수)·OSAT(표본 소수)**\n    - 애로우 컨센서스: QoQ **-0.4%**\n    - 앰코: 4Q **$1.9~2.0B**(컨센서스 QoQ **-0.3%**)\n    - 에브넷은 데이터 중복이 의심돼 집계에서 제외했다.\n  - **개별 약세**\n    - 퀄컴: FY27 핸드셋 시장 low-teens % 감소\n    - 울프스피드: GM 마이너스 지속"}, "TW": {"name": "대만", "flag": "🇹🇼", "tone": {"summary": "대만 3Q 메모리 YoY+385%·파운드리 +50%, 4Q TSMC +14% 가이던스로 AI 상향 지속", "segments": [{"seg": "파운드리", "tone": 2, "growth": "매출 QoQ +17.1%, YoY +49.6%, OPM 56.4%(전년 47.6%)", "guide": "TSMC 4Q 매출 $52.3~54.3B(중간값 +14% QoQ, +58% YoY), GM 65~67% 가이던스; 4사 컨센 +14.0% QoQ"}, {"seg": "유통", "tone": 0, "growth": "매출 QoQ +5.9%, YoY +89.5%, OPM 2.7%", "guide": "회사 가이던스 미제시; 컨센 +2.2% QoQ(3사), WT마이크로 +10.2% vs WPG -7.1%"}, {"seg": "팹리스·IP", "tone": 1, "growth": "매출 QoQ +16.8%, YoY +52.0%, OPM 20.2%(전년 13.5%)", "guide": "미디어텍 4Q 매출 NT$2,101~2,218억(+25~32% QoQ), GM 45%±1.5%p; 노바텍 NT$280~292억; 컨센 +14.7%(16사)"}, {"seg": "OSAT·테스트", "tone": 1, "growth": "매출 QoQ +23.6%, YoY +41.6%, OPM 14.8%(전년 8.5%)", "guide": "ASE 2026년 ATM 매출 +35%, LEAP US$35억 초과 전망; 8사 컨센 +6.4% QoQ"}, {"seg": "메모리", "tone": 1, "growth": "매출 QoQ +48.6%, YoY +384.6%, OPM 67.7%(전년 8.0%)", "guide": "난야 4Q 두 자릿수 계약가 상승, GPM 80%대 유지 가능, 출하는 flat; 4사 컨센 +10.5% QoQ"}, {"seg": "패키지 기판", "tone": 2, "growth": "매출 QoQ +26.2%, YoY +44.3%, OPM 17.0%(전년 7.3%)", "guide": "컨센 +14.5% QoQ(3사), 젠딩 +17.6%; 젠딩 2026년 CapEx NT$800억 초과, 2027년 고성장 지속 전망"}, {"seg": "클린룸·팹 인프라", "tone": 1, "growth": "매출 QoQ +12.3%, YoY +46.2%, OPM 16.7%", "guide": "회사 가이던스 미제시; 컨센 +8.2% QoQ(3사), 마켓텍 +10.6%, 액터 +10.0%, 미를 -19.6%"}, {"seg": "소재", "tone": 0, "growth": "매출 QoQ +1.6%, YoY +19.6%, OPM 13.4%", "guide": "컨센 +11.0% QoQ(2사, 표본 소수); 키닉 4Q26부터 일부 제품 약 10% 가격 인상"}, {"seg": "후공정 장비", "tone": -1, "growth": "매출 QoQ +32.8%, YoY +146.4%, OPM 35.9%", "guide": "회사 가이던스 미제시; 컨센 -4.7% QoQ(3사), 크로마 -5.4%, GMM -32.3%"}, {"seg": "부품", "tone": 0, "growth": "매출 QoQ +14.8%, YoY +52.0%, OPM 20.0%", "guide": "회사 가이던스 미제시; 컨센 +3.9% QoQ(4사), 폭스세미콘 +1.5%, 윈웨이 +1.6%, CHPT +17.6%"}, {"seg": "광통신", "tone": 1, "growth": "매출 QoQ +29.1%, YoY +72.4%, OPM 33.8%(전년 14.7%)", "guide": "회사 가이던스 미제시; 컨센 +8.9% QoQ(3사), 연기(랜드마크) +15.9%"}, {"seg": "전력·화합물 반도체", "tone": 0, "growth": "매출 QoQ +8.9%, YoY +29.3%, OPM 8.6%(전년 -5.2%)", "guide": "윈세미 4Q 매출 low-single digit QoQ 증가 가이던스; 컨센 +12.3%(2사, 표본 소수)"}, {"seg": "전공정 장비", "tone": 1, "growth": "매출 QoQ +7.0%, YoY +28.3%, OPM 29.4%", "guide": "회사 가이던스 미제시; 컨센 +16.8% QoQ(GPTC 1사, 표본 소수)"}], "best": ["파운드리", "패키지 기판", "메모리"], "worst": ["후공정 장비", "유통", "부품"]}, "md": "## 대만\n\n### 한눈에\n- **메모리가 가장 강했다**: 매출 YoY **+384.6%**, QoQ **+48.6%**, OPM은 **67.7%**로 전년 8.0%에서 크게 올랐다. 난야테크 OPM은 **80%**다.\n- **AI 축도 강했다**: 파운드리 YoY **+49.6%**(OPM **56.4%**), 패키지 기판 QoQ **+26.2%**, OSAT QoQ **+23.6%**, 광통신 QoQ **+29.1%**를 기록했다.\n- **약했던 곳**: 소재는 QoQ **+1.6%**에 그쳤고, 유통은 OPM **2.7%**로 이익률이 얇다. 팹리스 안에서는 ASMedia와 엘란이 YoY **-33%**로 부진했다.\n- **가이던스 톤은 전반적으로 상향**이다. TSMC는 4Q 매출 **$52.3~54.3B**(중간값 기준 QoQ **+14%**)를, 미디어텍은 4Q **+25~32%** QoQ를 제시했다. 반대로 후공정 장비는 컨센서스가 **-4.7%** QoQ로 역성장이다.\n\n### 밸류체인별 실적과 가이던스\n\n#### 파운드리 — 🟢강한 상향\n- **실적**: 매출 **$48,659M**, QoQ **+17.1%**, YoY **+49.6%**, OPM **56.4%**(전년 47.6%).\n  - TSMC: 매출 **$46.7B**(USD 기준 QoQ **+16.2%**, NT$ 기준 +17.6%)로 가이던스 상단을 넘었다. GM **66.4%**, OPM **58.7%**. 7nm 이하 비중은 **79%**, HPC는 QoQ **+22%**에 비중 **68%**다. 집계 환산치는 $45,286M로 회사 발표치와 차이가 있다.\n  - UMC: 매출 **TWD 742.4억**(QoQ **+8%**), GM **34%**, 가동률 **92%**.\n  - PSMC: 매출 **$647M**, QoQ **+23.4%**, YoY **+80.2%**, OPM **36.7%**.\n  - 뱅가드(VIS): GM **33.6%**(+1.3%p)로 가이던스에 부합했다.\n- **가이던스·전망**\n  - TSMC 4Q: 매출 **$52.3~54.3B**(중간값 기준 QoQ **+14%**, YoY **+58%**), GM **65~67%**, OPM **56.5~58.5%**.\n  - TSMC 연간: FY26 매출 성장률 전망을 **약 +44%**로 올렸다. 2026 CapEx **$60~64B**를 재확인했고, 2027년 N2 패밀리 캐파를 **2배 이상**으로 늘릴 계획이다.\n  - UMC: 4Q 웨이퍼 출하 low single digit 증가, GM 전분기와 유사. **2027년 블렌디드 ASP는 YoY 약 +10%**로 제시했다.\n  - VIS: 4Q 출하 **0~2%** QoQ.\n  - 컨센서스 **+14.0%** QoQ(4사). TSMC 10월 매출은 **NT$5,868.9억**으로 3Q 월평균보다 **+17.8%** 높다.\n- **해석**: TSMC는 AI 수요를 \"극도로 견조\"하다고 표현했고 N2 램프가 성장을 이끈다. 다만 N2 램프와 해외 팹 희석으로 GM은 낮아지는 중이며, 해외 팹 희석 폭은 향후 **3~4%p**로 커질 전망이다. 성숙 공정(UMC, VIS)은 성장률이 한 자릿수에 그쳐 TSMC와 격차가 크다.\n\n#### 유통 — 🟡중립\n- **실적**: 매출 **$35,050M**, QoQ **+5.9%**, YoY **+89.5%**, OPM **2.7%**.\n  - WT마이크로: **$18,102M**, QoQ **+1.1%**, YoY **+81.6%**, OPM **2.4%**.\n  - WPG: **$15,456M**, QoQ **+11.8%**, YoY **+108.6%**, OPM **2.8%**.\n  - 탑코: OPM **6.9%**.\n- **가이던스·전망**: 회사 가이던스 미제시.\n  - 컨센서스는 **+2.2%** QoQ(3사)다. 기업별로는 WT마이크로 **+10.2%**, WPG **-7.1%**로 갈린다.\n  - 10월 매출도 같은 방향으로 갈렸다. WT마이크로는 3Q 월평균 대비 **+35.7%**, WPG는 **-11.8%**, 와리는 **-6.9%**다.\n- **해석**: 메모리 가격 상승분이 넘어오면서 매출 규모는 커졌다. 하지만 이익률이 2%대에 머물러 이익으로 이어지는 정도가 약하고, 다음 분기 성장도 둔화된다.\n\n#### 팹리스·IP — 🟢상향\n- **실적**: 매출 **$13,157M**, QoQ **+16.8%**, YoY **+52.0%**(중앙값 +25.4%), OPM **20.2%**(전년 13.5%).\n  - 미디어텍: **$5,093M**, QoQ **+10.4%**, YoY **+18.3%**, OPM **16.1%**.\n  - 파이슨: **$2,609M**, YoY **+374.6%**, OPM **38.2%**.\n  - 알칩: **$794M**, QoQ **+242.8%**.\n  - GUC: **$568M**, YoY **+117.7%**.\n- **가이던스·전망**\n  - 미디어텍 4Q: 매출 **NT$2,101~2,218억**(QoQ **+25~32%**, YoY **+40~48%**), GM **45%±1.5%p**, 영업비용률 **26%±2%p**. 다만 10월 매출은 3Q 월평균 대비 -1.8%로, 가이던스가 4Q 후반에 몰려 있다.\n  - 노바텍 4Q: 매출 **NT$280~292억**, GM **37~39%**, OPM **17~19%**. 컨센서스는 **-6.1%**다.\n  - 알칩: N3 가속기가 대량 출하 단계에 들어갔고, 2027년에도 주력 매출원이 될 것으로 본다.\n  - 컨센서스: 전체 **+14.7%**(16사), GUC **+21.3%**, 하이맥스 **-24.0%**, 리얼텍 **-0.3%**.\n- **해석**: ASIC(알칩, GUC)과 스토리지 컨트롤러(파이슨)는 AI와 메모리 사이클에 올라타 강하다. 반면 디스플레이와 PC 인터페이스 쪽(하이맥스, 노바텍, ASMedia, 엘란)은 약세라 섹터 안에서 양극화가 뚜렷하다.\n\n#### OSAT·테스트 — 🟢상향\n- **실적**: 매출 **$9,475M**, QoQ **+23.6%**, YoY **+41.6%**, OPM **14.8%**(전년 8.5%).\n  - ASE: **$7,400M**, QoQ **+27.8%**, YoY **+44.8%**, OPM **13.6%**.\n  - 파워텍: **$768M**, QoQ **+9.6%**, OPM **17.7%**.\n  - 아덴텍: YoY **+48.5%**, OPM **34.8%**.\n- **가이던스·전망**\n  - ASE: 4Q 가이던스 자료가 공시됐지만 발췌본에는 수치가 없다. 7월 콜 기준 전망은 아래와 같다.\n    - 2026년 ATM 매출 **+35%**\n    - LEAP 매출은 US$35억을 **수억 달러** 웃돌고, **2027년에는 2배**가 목표\n    - EMS 4Q 매출은 3Q와 비슷\n    - 같은 콜의 3Q GPM 가이던스는 원문 오기로 추정된다.\n  - 컨센서스: 전체 **+6.4%**(8사), KYEC **+13.0%**, 칩모스 **-2.7%**, 칩본드 **-5.9%**.\n  - ASE 10월 매출은 3Q 월평균 대비 **+8.9%**.\n- **해석**: 리딩엣지 패키징·테스트(LEAP)가 이익 개선을 이끈다. 3Q에는 메모리 부품가가 EMS 매출에 그대로 반영된 효과도 있었다. 4Q 성장률은 한 자릿수로 정상화된다.\n\n#### 메모리 — 🟢상향\n- **실적**: 매출 **$7,381M**, QoQ **+48.6%**, YoY **+384.6%**, OPM **67.7%**(전년 8.0%).\n  - 난야테크: **NT$1,336억**(QoQ **+61.9%**, YoY **+611.7%**), GPM **85.7%**, OPM **80%**. ASP는 QoQ +60% 이상 올랐고 출하는 mid-single digit 감소했다.\n  - 윈본드: **$2,495M**, QoQ **+37.6%**, OPM **53.2%**.\n  - 매크로닉스: **$735M**, YoY **+195.1%**, OPM **53.4%**.\n- **가이던스·전망**\n  - 난야테크 4Q: ASP 점진적 추가 상승, 두 자릿수 계약가 상승, **GPM 80%대 유지 \"가능\"**. 비트 출하는 신규 팹 가동 전까지 flat이다. 가동 시점은 콜에서 2H27, IR 자료에서 Q4'27로 표기가 다르다.\n  - 난야테크 신규 팹: CapEx **NT$3,460억**.\n  - 윈본드: 수급 타이트가 2027년까지 이어지고, SLC NAND 가격도 2027년까지 우호적일 것으로 본다.\n  - 컨센서스: 전체 **+10.5%**(4사), 윈본드 **+15.4%**, AP메모리 **-4.9%**.\n- **해석**: 출하가 늘 수 없어 성장은 가격 주도로만 나온다. 그래서 QoQ 성장률은 +48.6%에서 +10.5%로 둔화되지만, 공급 부족이 2027년까지 이어진다는 전망이라 이익률은 높은 수준을 유지할 가능성이 크다.\n\n#### 패키지 기판 — 🟢강한 상향\n- **실적**: 매출 **$4,491M**, QoQ **+26.2%**, YoY **+44.3%**, OPM **17.0%**(전년 7.3%).\n  - 젠딩: **$1,959M**, QoQ **+33.4%**, OPM **13.5%**.\n  - 유니마이크론: **$1,596M**, YoY **+54.9%**, OPM **20.0%**.\n  - 킨서스: OPM **22.1%**.\n- **가이던스·전망**: 회사의 4Q 수치 가이던스는 미제시.\n  - 젠딩: 4Q는 모바일 성수기다. 2027년에는 광모듈, AI 서버, IC 기판이 고성장을 이어갈 것으로 보며, 2026년 CapEx는 **NT$800억 초과**다.\n  - 컨센서스: 전체 **+14.5%**(3사), 젠딩 **+17.6%**, 유니마이크론 **+11.3%**, 킨서스 **+11.9%**.\n  - 10월 매출(3Q 월평균 대비): 젠딩 **+26.3%**, 난야PCB **+15.2%**.\n- **해석**: AI 서버용 ABF 수요와 계절적 성수기가 겹쳤고, 10월 매출이 이미 컨센서스를 뒷받침하고 있다.\n\n#### 클린룸·팹 인프라 — 🟢상향\n- **실적**: 매출 **$3,142M**, QoQ **+12.3%**, YoY **+46.2%**, OPM **16.7%**.\n  - L&K: **$989M**, QoQ **+27.3%**.\n  - UIS: **$834M**, YoY **+43.0%**.\n  - 마켓텍: **$664M**, YoY **+91.1%**.\n  - 액터: OPM **18.9%**.\n- **가이던스·전망**: 회사 가이던스 미제시.\n  - 컨센서스: 전체 **+8.2%**(3사), 마켓텍 **+10.6%**, 액터 **+10.0%**, 미를 **-19.6%**.\n  - 10월 매출(3Q 월평균 대비): L&K **+5.6%**, UIS **+6.6%**.\n  - 구덩: 애리조나 피닉스 파일럿 런을 4Q 중 진행한다.\n- **해석**: TSMC를 비롯한 대형 고객의 CapEx 확대가 수주로 이어지고 있다. TSMC는 2026~2028년 CapEx를 직전 3년 대비 대폭 늘릴 예정이다.\n\n#### 소재 — 🟡중립\n- **실적**: 매출 **$2,475M**, QoQ **+1.6%**, YoY **+19.6%**, OPM **13.4%**.\n  - 시노아메리칸실리콘: **$633M**, QoQ **-1.1%**.\n  - 글로벌웨이퍼스: **$451M**, QoQ **-2.3%**, YoY **+2.6%**, OPM **9.8%**.\n  - 솔라어플라이드: YoY **+47.4%**.\n- **가이던스·전망**: 컨센서스는 **+11.0%**(2사, **표본 소수**)다.\n  - 글로벌웨이퍼스: 컨센서스 **+12.3%**. 다만 10월 매출은 3Q 월평균 대비 **-3.9%**다.\n  - 키닉: 일부 제품을 4Q26부터 **약 10% 인상**한다. 캐파는 4Q26 **월 8만 개 이상**, 4Q27 **월 11만 개**가 목표다.\n- **해석**: 실리콘 웨이퍼는 회복이 늦어 섹터 성장을 끌어내리고, 소재 안에서는 패키징 소재만 상대적으로 양호하다.\n\n#### 후공정 장비 — 🟠둔화\n- **실적**: 매출 **$784M**, QoQ **+32.8%**, YoY **+146.4%**, OPM **35.9%**.\n  - 크로마: **$543M**, YoY **+179.7%**, OPM **40.0%**.\n  - GMM: QoQ **+101.5%**.\n  - 올링: QoQ **+41.2%**.\n- **가이던스·전망**: 회사 가이던스 미제시.\n  - 컨센서스: 전체 **-4.7%**(3사), 크로마 **-5.4%**, GMM **-32.3%**, CSun **+15.1%**.\n  - 올링 10월 매출은 3Q 월평균 대비 **-11.7%**.\n- **해석**: 3Q에 장비 인도가 몰려 기저가 높아졌다. 단기적으로는 매출 공백이 생길 전망이다.\n\n#### 부품 — 🟡중립\n- **실적**: 매출 **$664M**(표본 6/7사), QoQ **+14.8%**, YoY **+52.0%**, OPM **20.0%**.\n  - 윈웨이: **$138M**, YoY **+152.6%**.\n  - MPI: **$179M**, YoY **+72.9%**.\n  - 폭스세미콘: OPM **14.5%**.\n- **가이던스·전망**: 회사 가이던스 미제시.\n  - 컨센서스: 전체 **+3.9%**(4사), 폭스세미콘 **+1.5%**, 윈웨이 **+1.6%**, CHPT **+17.6%**.\n  - 10월 매출(3Q 월평균 대비): 윈웨이 **-27.1%**, CCP **-29.6%**, MPI **+13.5%**.\n  - 한민테스트: 3Q에 상장 전 직원 주식 관련 일회성 비용 **약 NT$11.18억**이 반영됐다. 기본 EPS 영향은 약 NT$32.58이다.\n- **해석**: 프로브카드는 견조하지만 테스트 소켓은 10월에 둔화가 확인됐다.\n\n#### 광통신 — 🟢상향\n- **실적**: 매출 **$552M**, QoQ **+29.1%**, YoY **+72.4%**, OPM **33.8%**(전년 14.7%).\n  - 광성(EZconn): **$149M**, YoY **+95.6%**.\n  - 연균광전: **$114M**, YoY **+102.4%**.\n  - 연기(랜드마크): YoY **+182.6%**, OPM **49.4%**.\n- **가이던스·전망**: 회사 가이던스 미제시.\n  - 컨센서스: 전체 **+8.9%**(3사), 랜드마크 **+15.9%**, 전신(VPEC) **+2.6%**.\n  - 10월 매출(3Q 월평균 대비): 광성 **+12.1%**, 랜드마크 **+9.5%**.\n- **해석**: 데이터센터 광연결 수요로 레이저와 광부품의 마진이 크게 좋아졌다.\n\n#### 전력·화합물 반도체 — 🟡중립\n- **실적**: 매출 **$301M**, QoQ **+8.9%**, YoY **+29.3%**, OPM **8.6%**(전년 -5.2%로 흑자 전환).\n  - 윈세미: **$178M**, YoY **+30.6%**.\n  - GCS: YoY **+55.4%**, OPM **19.3%**.\n- **가이던스·전망**\n  - 윈세미 4Q 매출: **low-single digit** QoQ 증가.\n  - 에피실: 2H26 매출 HoH **+3~5%**. 가동률은 2Q에 **95%**였다.\n  - 컨센서스 **+12.3%**(2사, **표본 소수**).\n- **해석**: AI 데이터센터 전력 수요로 가동률은 회복됐다. 다만 회사 가이던스는 한 자릿수 성장에 그친다.\n\n#### 전공정 장비 — 🟢상향\n- **실적**: 매출 **$249M**, QoQ **+7.0%**, YoY **+28.3%**, OPM **29.4%**.\n  - GPTC: QoQ **+28.7%**, OPM **22.0%**.\n  - TRI: QoQ **-1.6%**, OPM **35.2%**.\n  - 사이언테크: YoY **+8.9%**.\n- **가이던스·전망**: 회사 가이던스 미제시.\n  - 컨센서스: **+16.8%**(GPTC 1사, **표본 소수**).\n  - 10월 매출(3Q 월평균 대비): 사이언테크 **+7.2%**, TRI **-4.1%**.\n- **해석**: 표본이 작아 섹터 전체의 신호로 보기는 어렵다.\n\n### 가이던스 톤 정리\n- **좋았던 곳**\n  - 파운드리: TSMC 4Q 매출 **$52.3~54.3B**(QoQ **+14%**, YoY **+58%**), FY26 **+44%**. UMC는 2027 ASP **+10%**.\n  - 패키지 기판: 컨센서스 **+14.5%**, 젠딩 10월 매출이 3Q 월평균 대비 **+26.3%**.\n  - 메모리: 난야 4Q 두 자릿수 계약가 상승과 **GPM 80%대** 유지 가능. 컨센서스 **+10.5%**.\n  - 팹리스: 미디어텍 4Q **+25~32%** QoQ, GUC 컨센서스 **+21.3%**.\n- **나빴던 곳**\n  - 후공정 장비: 컨센서스 **-4.7%**, GMM **-32.3%**.\n  - 유통: 컨센서스 **+2.2%**, WPG **-7.1%**, WPG 10월 매출은 3Q 월평균 대비 **-11.8%**.\n  - 부품: 컨센서스 **+3.9%**, 윈웨이 10월 매출은 3Q 월평균 대비 **-27.1%**.\n  - 팹리스 비AI: 하이맥스 컨센서스 **-24.0%**, 노바텍 **-6.1%**."}, "KR": {"name": "한국", "flag": "🇰🇷", "tone": {"summary": "메모리 주도 3Q26 매출 QoQ +19.6%·OPM 63.6%, 4Q 메모리·장비 가이던스 상향", "segments": [{"seg": "메모리", "tone": 2, "growth": "QoQ +19.6%, YoY +171.3%, OPM 63.6%(전년 21.3%)", "guide": "SK하이닉스 4Q DRAM 출하 QoQ +20% 중반, 삼성전자 4Q DRAM 판매량 QoQ +10% 중후반 가이던스"}, {"seg": "패키지 기판", "tone": 1, "growth": "QoQ +11.3%, YoY +24.6%, OPM 8.0%(전년 4.8%)", "guide": "LG이노텍 4Q 매출 6조7,180억원(+5.5% QoQ), 영업이익 1,894억원 전망(IBK). 심텍 '26년 제품군 매출 3,293억원(YoY +63%) 가이던스"}, {"seg": "팹리스·IP", "t **가이던스 톤**: 메모리 4Q 출하 가이던스(SK하이닉스 DRAM QoQ **+20% 중반**, 삼성전자 **+10% 중후반**)와 장비 컨센서스(전공정 **+28.1%**, 후공정 **+18.3%**)는 상향이다. 반면 팹리스(컨센 **-8.5%**)와 소재(**-6.9%**)는 둔화 신호다.\n- 데이터 주의: 집계는 2026-09 결산 기업만 포함한다. 하나마이크론·솔브레인·피에스케이 등 2026-06 결산 기업은 세그먼트 집계에서 빠져 있다.\n\n### 밸류체인별 실적과 가이던스\n\n#### 메모리 — 🟢강한 상향 (표본 소수, 2사)\n- ① 실적: QoQ **+19.6%**, YoY **+171.3%**, OPM **63.6%**(전년 21.3%). 삼성전자 매출 **$146,295M**(QoQ +13.9%, YoY +126.9%, OPM 55.0%), SK하이닉스 **$78,384M**(QoQ +31.9%, YoY **+327.9%**, OPM **79.7%**).\n- ② 가이던스·전망: SK하이닉스 4Q B/G는 DRAM 출하 **QoQ +20% 중반**, 다른 한 항목은 mid-single%다. 4Q에 HBM4가 출하·매출 비중에서 HBM3E를 넘어선다. 2027년 HBM 협상은 마무리됐고, 주요 고객 14곳과 장기공급계약(LTA)을 맺었다. 국내 생산능력에서 321단 비중은 4Q 50% 이상으로 늘어난다. CapEx는 2026년 **40조원 후반**이고 2027년에는 늘어날 전망이다. 회사는 2030년까지 수요가 공급을 웃돈다고 본다. 삼성전자의 4Q26 DRAM 판매량 가이던스는 **QoQ +10% 중후반**이다. 대신증권은 DRAM 판매가 YoY +20%, 2027년 메모리 영업이익 **608조원**을 전망한다. iM증권은 삼성전자 HBM 매출이 '26년 28조원에서 '28년 **215조원**으로 늘어난다고 본다.\n- ③ 해석: HBM4 출하 확대와 범용 DRAM 가격 상승이 함께 진행되고 있다. LTA로 '27~'28년 물량 가시성도 높아졌다. 남은 리스크는 '27년 상반기까지 이어질 '28년 업황 지속성 우려 정도다(iM증권).\n\n#### 패키지 기판 — 🟢상향\n- ① 실적: QoQ **+11.3%**, YoY **+24.6%**, OPM **8.0%**(전년 4.8%). 회사별로는 차이가 크다.\n  - LG이노텍: 매출 **$4,771M**(QoQ +15.2%, YoY +18.6%)이지만 OPM은 **1.5%**에 그쳤다. IBK는 3Q 영업이익 948억원이 기존 전망보다 크게 부진했다고 평가했다.\n  - 삼성전기: **$2,820M**(YoY +30.3%, OPM **18.4%**)\n  - 대덕전자: $313M(YoY **+46.1%**, OPM 21.0%)\n  - 심텍: $402M(YoY +43.7%, OPM 19.0%)\n  - SKC: OPM **-7.8%**\n- ② 가이던스·전망:\n  - LG이노텍: IBK는 4Q 매출 **6조7,180억원**(QoQ +5.5%), 영업이익 **1,894억원**(QoQ 2배)을 예상한다. SK증권 NDR에 따르면 4Q도 하이싱글 마진이 전망되고 BT·디스플레이소재는 두 자릿수 마진이 이어진다. 환율 민감도는 10원당 월 30억원 수준이다.\n  - 삼성전기: 4Q에도 수요가 강하고 가격이 오를 전망이다(IBK). Ibiden은 공급 3사의 생산능력을 모두 합쳐도 ABF 수요에 못 미친다고 봤다.\n  - 심텍: 한 제품군은 하반기 매출 약 **1,912억원**(HoH +38%), '26년 **3,293억원**(YoY +63%) 가이던스다. 다른 제품군은 하반기 **1,558억원**(HoH +168%), '26년 **2,140억원**이다. SoCAMM 전용 공장은 2027년 4Q부터 본격 가동해 연 **5,000억원 이상**의 생산능력을 확보할 전망이다(메리츠).\n  - 컨센서스 미집계(0사).\n- ③ 해석: AI 서버용 ABF 대면적화, SoCAMM·GDDR 수요로 기판 업황은 호황이다. 다만 모바일 비중이 높은 LG이노텍이 세그먼트 이익률을 끌어내리고 있다.\n\n#### 팹리스·IP — 🟡중립\n- ① 실적: QoQ **+12.3%**, YoY **+65.6%**, OPM **20.8%**(전년 0.7%). 메모리 연계 기업이 급증했다.\n  - 제주반도체: **$259M**(YoY +211.8%, OPM **46.2%**)\n  - 파두: **$108M**(QoQ +96.1%, YoY **+460.8%**, OPM 25.2%)\n  - 피델릭스: $63M(YoY **+576.0%**, OPM 56.4%)\n  - LX세미콘: **$252M**(QoQ -16.2%, YoY -14.8%, OPM **-4.6%**)로 역성장했다.\n- ② 가이던스·전망: 회사 가이던스는 미제시다. 4Q 컨센 매출은 QoQ **-8.5%**(2사)로, LX세미콘 **-12.0%**, 파두 **-0.2%**다. 증권사 추정으로는 사피엔반도체 4Q 매출 129억원·영업이익 10억원(유진), 텔레칩스 '26F 매출 **2,405억원**(+24.7%)·영업이익 171억원(한국IR협의회)이 있다.\n- ③ 해석: 메모리 컨트롤러·특수 메모리 팹리스는 메모리 사이클의 수혜를 받고 있다. 디스플레이 구동칩은 부진하다. 컨센서스로 보면 4Q는 숨 고르기 국면이다.\n\n#### 클린룸·팹 인프라 — 🟡중립\n- ① 실적: QoQ **-2.0%**, YoY **+25.7%**(중앙값 +81.5%), OPM **7.1%**(전년 5.0%).\n  - 에스에프에이: **$322M**(QoQ +7.6%, YoY +9.2%, OPM 5.1%)\n  - 케이씨: $188M(YoY **+43.7%**, OPM 10.1%)\n  - 신성이엔지: $119M(QoQ **-21.5%**, OPM 0.4%)\n  - 로체시스템즈: $39M(YoY **+204.3%**)\n  - 씨앤지하이테크: QoQ -38.7%\n- ② 가이던스·전망: 회사 가이던스 미제시, 컨센 0사. 참고로 SFA는 연초 IR에서 '25년 말 수주잔고 **9,118억원**과 '26년 신규수주 확대를 제시했다. 아스플로 IR은 '26~'28년 누적 장비투자 **$374B**(연평균 약 9%)를 인용했다.\n- ③ 해석: 프로젝트 인식 시점 때문에 분기별 변동이 크다. 용인 클러스터 등 '27년 국내 인프라 투자 확대(SK하이닉스)가 중기 수요 근거다.\n\n#### 전공정 장비 — 🟢상향\n- ① 실적: QoQ **+25.5%**, YoY **+45.3%**, OPM **20.9%**(전년 10.4%).\n  - 원익IPS: **$253M**(QoQ **+56.0%**, YoY +25.8%, OPM 19.7%)\n  - 테스: $93M(YoY +83.7%)\n  - 브이엠: $64M(YoY **+133.2%**, OPM **35.2%**)\n  - 고영: $80M(YoY +76.8%)\n- ② 가이던스·전망: 4Q 컨센 매출은 QoQ **+28.1%**(1사, 주성엔지니어링, 3Q QoQ +30.4%)다. 고객사인 SK하이닉스는 '26 CapEx **40조원 후반**과 '27년 증가를 예고했다. 회사 가이던스는 미제시다.\n- ③ 해석: 선단 전환(321단 NAND, DRAM 미세화)과 신규 팹 투자가 증착·식각 수요를 견인하고 있다. 매출 증가가 이익률 두 배 개선으로 이어졌다.\n\n#### 소재 — 🟡중립\n- ① 실적: QoQ **+4.0%**, YoY **+19.2%**, OPM **17.3%**(전년 15.1%).\n  - 동진쎄미켐: **$278M**(QoQ +6.9%, YoY +23.6%, OPM 16.5%)\n  - 한솔케미칼: $181M(QoQ -2.2%, YoY +5.2%, OPM 20.1%)\n  - 덕산하이메탈: $75M(YoY **+61.9%**)\n  - 에스앤에스텍: QoQ -6.6%\n- ② 가이던스·전망: 4Q 컨센 매출은 QoQ **-6.9%**(1사, 동진쎄미켐)다. 덕산하이메탈 IR은 FC-BGA·GPU용 MSB와 2.5D용 CSB의 동반 성장을 언급했지만 수치는 없다. 회사 가이던스는 미제시다.\n- ③ 해석: 소재는 가동률에 연동돼 꾸준히 성장하지만 메모리 가격 사이클 대비 레버리지가 낮다. 4Q 컨센은 소폭 역성장이다.\n\n#### 후공정 장비 — 🟢상향\n- ① 실적: QoQ **+1.8%**, YoY **+54.0%**, OPM **32.9%**(전년 24.0%).\n  - 디아이: **$163M**(QoQ +29.1%, YoY +99.6%)\n  - 한미반도체: $136M(QoQ **-27.9%**, YoY +8.9%, OPM **50.2%**)\n  - 테크윙: $66M(QoQ +54.6%, YoY **+110.2%**)\n  - 프로텍: $59M(YoY +53.2%, OPM 31.3%)\n- ② 가이던스·전망: 4Q 컨센 매출은 QoQ **+18.3%**(2사)로, 한미반도체 **+21.1%**, 테크윙 **+12.4%**다. 테크윙 IR은 고객사의 메모리 팹·패키지 투자 확대가 **2026년 4Q~2027년**까지 이어진다고 전망했다.\n- ③ 해석: HBM4 양산 확대로 본딩·테스트 장비 수요가 이어지고 있다. 한미반도체의 3Q 감소는 출하 시점 영향으로 보이며, 4Q 컨센은 반등을 반영한다.\n\n#### OSAT·테스트 — 🟡중립\n- ① 실적: QoQ **+12.0%**, YoY **+55.7%**인데 OPM은 **0.3%**(전년 2.3%)로 악화됐다.\n  - 한양디지텍: **$207M**(YoY +54.6%, OPM 0.5%)\n  - SFA반도체: $111M(YoY +53.6%, OPM **-4.4%**)\n  - 에이팩트: $44M(YoY **+107.1%**, OPM 8.6%)\n  - 큐알티: YoY -0.5%\n- ② 가이던스·전망: 회사 가이던스 미제시, 3Q 결산사 컨센 0사. 2Q 결산사의 3Q 컨센은 하나마이크론 **-12.1%**(2Q 매출 $512M, OPM 20.8%), 엘비세미콘 **-11.7%**다. 네패스는 HBM4 양산 물량 증가에 따른 수요 증가를 언급했다.\n- ③ 해석: 물량은 늘었지만 원가 부담으로 이익이 남지 않는 구조다. 상위 OSAT의 컨센서스도 역성장이다.\n\n#### 파운드리 — 🟢상향 (표본 소수, 1사)\n- ① 실적: DB하이텍 **$302M**(QoQ **-2.7%**, YoY +7.7%, OPM **22.3%**)\n- ② 가이던스·전망: 증권사는 하반기 매출을 3Q 4,167억원(+4% q-q), 4Q **4,536억원**(+9% q-q)으로 전망한다. 다만 USD 기준 3Q 실적은 QoQ -2.7%여서 그 경로를 밑돌았다. '26년 두 차례 가격 인상에 이어 3차 인상이 기대되고, '27년에도 2회 인상이 전망된다. IR 인용으로는 글로벌 8인치 '26 capa가 YoY **-6%**, 4Q 성숙공정 가동률이 **91%**다(Sigmaintell). 회사가 직접 낸 분기 매출 가이던스는 미제시다.\n- ③ 해석: 8인치 공급 축소와 풀가동이 이어져 가격 인상분이 그대로 이익으로 연결되는 구조다.\n\n#### 전력·화합물 반도체 — 🟡중립 (표본 소수, 2사)\n- ① 실적: QoQ **+8.7%**, YoY **+25.6%**, OPM **7.1%**(전년 1.2%). 서울반도체 **$226M**(QoQ +3.5%, YoY +17.7%, OPM 1.6%), RFHIC **$53M**(QoQ **+38.0%**, YoY +75.5%, OPM **30.5%**).\n- ② 가이던스·전망: 서울반도체는 환율 영향을 반영해 4Q 매출 **2,700~2,900억원**을 제시했다. 3Q 원화 실적이 자료에 없어 QoQ 방향은 판단을 유보한다.\n- ③ 해석: RFHIC의 고성장과 서울반도체의 저마진이 엇갈린다. 서울반도체의 중기 근거는 xEV 판매 비중 확대(2025년 20% 내외에서 2030년 약 40%, IEA 인용)다.\n\n#### 부품 — 🟢상향\n- ① 실적: QoQ **+7.4%**, YoY **+32.4%**, OPM **27.2%**(전년 22.9%).\n  - 티씨케이: **$82M**(QoQ +16.1%, YoY +38.9%, OPM 27.4%)\n  - 하나머티리얼즈: $71M(YoY +35.8%, OPM 28.6%)\n  - ISC: $54M(QoQ -1.6%, OPM 30.4%)\n  - 샘씨엔에스: $24M(YoY **+54.9%**, OPM **34.7%**)\n- ② 가이던스·전망: 회사 가이던스 미제시, 3Q 결산사 컨센 0사. 증권사 추정과 2Q 결산사 컨센은 다음과 같다.\n  - 마이크로투나노: '26F 매출 **394억원**(+77.1%), '27F **496억원**. 3Q 컨센은 -33.0%다.\n  - 리노공업: 3Q 컨센 **-30.9%**지만 4Q는 기대치 이상(LS증권)으로 본다.\n  - 티에스이: 3Q 컨센 -0.8%\n- ③ 해석: NAND 321단 전환과 DRAM 증산이 프로브카드·소모성 부품 수요를 떠받친다. 고마진 구조도 유지되고 있다.\n\n#### 광통신 — 🟡중립 (표본 소수, 1사)\n- ① 실적: 오이솔루션 **$16M**(QoQ +10.2%, YoY **+65.7%**, OPM **0.6%**). 전년 -22.1%에서 흑자로 돌아섰다.\n- ② 가이던스·전망: 회사 가이던스 미제시. 2Q 결산사의 3Q 컨센은 대한광통신 **+29.1%**, 에치에프알 **+19.9%**다.\n- ③ 해석: 적자는 벗어났지만 규모가 작고 이익률이 낮아 아직 추세를 판단하기 어렵다.\n\n### 가이던스 톤 정리\n- **좋았던 곳**\n  - **메모리**: SK하이닉스 4Q DRAM 출하 QoQ **+20% 중반**, 삼성전자 4Q DRAM 판매량 **+10% 중후반**. SK하이닉스 CapEx는 '26년 **40조원 후반**이고 '27년에 늘어난다. 회사는 2030년까지 공급 부족을 전망한다.\n  - **후공정 장비**: 4Q 컨센 QoQ **+18.3%**(한미반도체 +21.1%, 테크윙 +12.4%). 테크윙은 고객 투자가 '27년까지 지속된다고 본다.\n  - **전공정 장비**: 주성엔지니어링 4Q 컨센 **+28.1%**에 고객사 '27년 CapEx 증가가 더해진다.\n  - **패키지 기판·파운드리**: LG이노텍 4Q 영업이익 **1,894억원**(QoQ 2배, IBK), 심텍 '26년 제품군 매출 **+63%**, DB하이텍 4Q **4,536억원**(+9% q-q, 증권사)\n- **나빴던 곳**\n  - **팹리스·IP**: 4Q 컨센 QoQ **-8.5%**. LX세미콘은 -12.0%이고 3Q OPM -4.6%다.\n  - **OSAT·테스트**: OPM **0.3%**(전년 2.3%)로 악화됐다. 하나마이크론 3Q 컨센 **-12.1%**, 엘비세미콘 **-11.7%**다.\n  - **소재**: 동진쎄미켐 4Q 컨센 **-6.9%**\n  - **클린룸·팹 인프라**: 3Q QoQ **-2.0%**이고 회사 가이던스가 없다."}, "JP": {"name": "일본", "flag": "🇯🇵", "tone": {"summary": "AI 수요로 장비·메모리 급증(후공정 YoY +62%), 다음 분기 컨센서스는 대부분 0~-3% 숨고르기", "segments": [{"seg": "소재", "tone": 1, "growth": "매출 QoQ +4.3%, YoY +14.4%, OPM 18.2%(전년 13.0%)", "guide": "레조낙 FY26 코어OP 2,500억엔(직전 전망 대비 +28%), 닛산화학 OP 724억엔(직전 668억엔)으로 상향. 컨센서스는 QoQ -0.4%"}, {"seg": "광통신", "tone": 1, "growth": "매출 QoQ +8.7%, YoY +20.3%, OPM 12.6%(전년 8.3%)", "guide": "후루카와 FY26 OP 950억→1,360억엔, 미쓰비시전기 매출 6.55조엔(+2,800억엔)으로 상향. 컨센서스는 QoQ -2.1%"}, {"seg": "메모리", "tone": 2, "growth": "키옥시아 매출 QoQ +40.3%, YoY +453.2%, OPM 80.5%", "gu 도체다.** YoY **+9.5%**, OPM **8.2%**에 그쳤고, 산켄전기는 YoY -1%로 적자였다. 소재는 레조낙(YoY **-6%**)이 표본 중 하위였다.\n- **가이던스는 상향이 대부분이지만, 다음 분기 컨센서스는 숨고르기다.** 회사들은 연간 실적 전망 상향을 잇달아 발표했다. 반면 다음 분기 컨센서스는 부품 **-3.2%**, 광통신 **-2.1%**, 후공정 **-1.9%** 등 대부분 0%에서 -3% 범위다. 컨센서스가 플러스인 곳은 메모리(+9.8%), 팹리스(+14.3%), 패키지 기판(+4.0%)이다.\n\n### 밸류체인별 실적과 가이던스\n\n#### 소재 — 🟢상향\n- **실적:** 매출 **$26,568M**, QoQ **+4.3%**, YoY **+14.4%**(중앙값 +18.6%), OPM **18.2%**(전년 13.0%).\n  - 아사히카세이: **$5,404M**, YoY +15.4%, OPM 9.7%. 상반기 매출은 1조6,896억엔(**+13.7%**), 영업이익은 1,654억엔(**+54.0%**)이다.\n  - 신에츠화학: **$4,746M**, QoQ +14.5%, OPM **28.0%**.\n  - JX금속: YoY **+32.1%**, OPM 25.6%.\n  - 간토덴카: YoY **+57%**.\n  - 레조낙: QoQ **-11.9%**, YoY -5.6%(표본 하위).\n- **가이던스·전망:**\n  - 레조낙: FY26 코어영업이익 **2,500억엔**(직전 전망 대비 **+28%**), EBITDA 마진 27.4%(+3.0pt).\n  - 아사히카세이: 3기 연속 최고익 전망으로 상향, 배당 48엔(+6엔).\n  - 닛산화학: 영업이익 668억 → **724억엔**(최고익).\n  - 미쓰이금속: FY26 영업이익 **990억엔**(+50억엔).\n  - JX금속: 구리 가격 전제(LME 619센트/lb)를 반영해 상향.\n  - 도쿄오카공업: 상향.\n  - 신에츠화학·닛폰산소: 통기 전망 유지. 닛폰산소 코어영업이익은 +15.5%, 진척률 52.3%다.\n  - 컨센서스: 다음 분기 QoQ **-0.4%**(23사).\n- **해석:** 반도체·전자재료 비중이 높은 기업(레조낙 반도체·전자재료, 닛산화학, 도쿄오카공업)이 상향을 이끌었다. 화학·범용 부문 비중이 큰 기업은 상향 폭이 작다.\n\n#### 광통신 — 🟢상향\n- **실적:** 매출 **$25,778M**, QoQ **+8.7%**, YoY **+20.3%**(중앙값 +23.9%), OPM **12.6%**(전년 8.3%).\n  - 미쓰비시전기: **$10,189M**, YoY +14.7%, OPM 12.3%.\n  - 스미토모전기: **$8,977M**, YoY +17.1%, OPM 8.5%.\n  - 후지쿠라: **$2,913M**, QoQ +15.8%, YoY **+59.9%**, OPM **28.0%**.\n  - 산텍: YoY **+79%**, OPM 39.2%.\n- **가이던스·전망:**\n  - 미쓰비시전기: FY26 매출 **6조5,500억엔**(+2,800억엔), 조정 영업이익 **7,100억엔**(+900억엔).\n  - 후루카와전기: FY26 영업이익 950억 → **1,360억엔**, FY27 **1,700억엔** 목표를 1년 앞당겼다.\n  - 스미토모전기: 정보통신 부문이 과거 최고익(FY25 774억엔)을 크게 웃돌 전망이다.\n  - 후지쿠라: 매출 전망은 상향했다. 이익 전망은 하반기 환율 전제를 160엔에서 156엔으로 조정했다.\n  - SWCC: 상향.\n  - 산텍: 배당 +50엔.\n  - 컨센서스: 다음 분기 QoQ **-2.1%**. 하마마츠포토닉스는 -17.2%다.\n- **해석:** 데이터센터용 광섬유·케이블 수요가 강해 연간 전망 상향이 이어졌다. 다음 분기 컨센서스는 높은 기저와 엔고 전제 때문에 소폭 감소다.\n\n#### 메모리 — 🟢강한 상향\n- **실적(표본 소수, 1사):** 키옥시아 매출 **$15,521M**, QoQ **+40.3%**, YoY **+453.2%**, OPM **80.5%**(전년 19.2%).\n- **가이던스·전망:** 회사 가이던스 미제시. 다음 분기 컨센서스는 QoQ **+9.8%**다. 2032년까지 일본 내 약 **5조엔**(310억 달러 이상) 투자를 예상한다.\n- **해석:** 이익률이 전년 19.2%에서 80.5%로 뛰어 가격 상승 효과가 크다. 컨센서스도 추가 성장을 반영한다. 스크린 콜에서도 NAND WFE **약 +20%** 전망이 나왔다.\n\n#### 부품 — 🟡중립\n- **실적:** 매출 **$12,175M**, QoQ **+12.1%**, YoY **+21.0%**(중앙값 +25.2%), OPM **14.6%**(전년 12.9%).\n  - TDK: **$5,129M**, QoQ +10.6%, YoY +26.6%, OPM 14.9%.\n  - 알프스알파인: **$1,909M**, QoQ +28.2%, OPM **4.6%**.\n  - 마이크로닉스재팬: YoY **+89.4%**, OPM 34.9%.\n  - 마루와: YoY +74%, OPM 40.7%.\n- **가이던스·전망:**\n  - TDK: 10/30 통기 전망 수정, 중간배당 25엔(+5엔).\n  - 타이요유덴: FY 매출 **4,360억엔**(+23%), 영업이익 **540억엔**(+170%). AI 서버용 하이엔드 제품이 이끈다.\n  - 야마이치전자: 매출 675억엔, 영업이익 162억엔으로 상향.\n  - 마이크로닉스재팬: 배당 208엔.\n  - 알프스알파인: 통기 전망 유지. 하반기 매출은 모바일·게임 약세로 상반기보다 줄 전망이다.\n  - 토토: 3Q가 홍수 영향을 받았다.\n  - 컨센서스: 다음 분기 QoQ **-3.2%**로 전 세그먼트 중 최저다. TDK -5.4%, 알프스알파인 -5.7%, 마이크로닉스재팬 -8.7%다.\n- **해석:** AI 서버와 테스트용 부품(MLCC 하이엔드, 프로브카드, 소켓)은 강하다. 모바일·게임·자동차 노출이 큰 기업의 하반기 둔화가 이를 상쇄한다.\n\n#### 전공정 장비 — 🟢강한 상향\n- **실적:** 매출 **$9,631M**, QoQ **+20.8%**, YoY **+35.6%**(중앙값 +23.8%), OPM **25.5%**(전년 19.5%).\n  - 도쿄일렉트론(TEL): **$5,852M**, QoQ +27.7%, YoY **+48.4%**, OPM **31.6%**.\n  - 스크린홀딩스: **$1,168M**, QoQ **+53.3%**, OPM 21.5%.\n  - 고쿠사이일렉트릭: YoY +35.5%, OPM 23.6%.\n  - 레이저텍: QoQ **-33.8%**, YoY -25.5%.\n- **가이던스·전망:**\n  - TEL: CY27 WFE 전망을 **$210B 이상**으로 상향했다. 기존 FY27 전망은 코터/디벨로퍼 **+50% 초과**, 에칭 **+25% 초과**다. 4Q부터 가격 개정 효과가 반영된다.\n  - 스크린홀딩스: 연간 매출 **7,430억엔**, 영업이익 **1,565억엔**. WFE는 CY26 **약 +20%**, CY27도 비슷한 성장을 전망했다. capex 전망은 430억에서 580억엔으로 올렸다.\n  - 고쿠사이일렉트릭: 2Q 수주 약 **1,670억엔**. FY28/3 매출 **약 +40%**를 제시했다.\n  - 레이저텍: FY27 수주 전망 **4,000~5,000억엔**(기존 3,000~4,000억엔). 통기 매출 2,900억엔, 영업이익 1,250억엔은 유지했다.\n  - 울박: 상향.\n  - 컨센서스: 다음 분기 QoQ **+0.1%**. TEL -3.6%, 스크린 +9.0%, 니콘 +11.7%다.\n- **해석:** DRAM·NAND·첨단 로직 투자가 모두 늘면서 WFE 전망이 다시 올라갔다. 레이저텍은 분기 매출이 줄었지만 수주 전망을 높여 실적 공백은 일시적인 것으로 보인다.\n\n#### 후공정 장비 — 🟢강한 상향\n- **실적:** 매출 **$4,341M**, QoQ **+29.7%**, YoY **+61.6%**(중앙값 +28.5%), OPM **50.7%**(전년 38.6%).\n  - 어드반테스트: **$2,990M**, QoQ +30.0%, YoY **+81.7%**, OPM **55.8%**.\n  - 디스코: **$893M**, YoY +36.4%, OPM 47.2%.\n  - 도쿄세이미츠: QoQ +51.7%, YoY +20.5%.\n- **가이던스·전망:**\n  - 어드반테스트: SoC 테스터 매출 전망을 크게 올렸다. 하반기 매출은 상반기 대비 약 **+28%**(환율 조정), 하반기 OPM은 7월 전망보다 **약 +3%p**, OPM은 **50%대 초반**에서 안착할 전망이다. SoC 점유율은 66%이며 **70% 이상**이 목표다. 생산능력은 5천에서 1만 대로 늘리는 중이며 2만 대를 검토한다. 정량적 CY27 전망은 2027년 1월에 제시한다.\n  - 도쿄세이미츠: 통기 매출 **1,920억엔**, 배당 304엔 → 316엔.\n  - 토와: 통기 매출 **710억엔**(+30.6%), 영업이익 102.4억 → **131.5억엔**.\n  - 디스코: 회사 가이던스 미제시. 컨센서스 +3.2%.\n  - 컨센서스: 다음 분기 QoQ **-1.9%**. 도쿄세이미츠는 -22.7%다.\n- **해석:** AI SoC는 테스트 시간이 길고, ATE TAM은 연 50% 이상 성장하고 있다. 어드반테스트는 DDR 가격 인상을 리프라이싱으로 상쇄할 계획이다.\n\n#### 전력·화합물 반도체 — 🟡중립\n- **실적:** 매출 **$3,215M**, QoQ **+12.4%**, YoY **+9.5%**(중앙값 +10.3%), OPM **8.2%**(전년 6.9%).\n  - 후지전기: **$2,003M**, QoQ +17.1%, YoY +8.4%, OPM 10.8%.\n  - 롬: **$900M**, YoY +12.3%, OPM 5.5%.\n  - 신덴겐: OPM 1.0%.\n  - 산켄전기: YoY **-1.0%**, OPM **-2.5%**.\n- **가이던스·전망:**\n  - 후지전기: 상향, 기말배당 130엔.\n  - 롬: 통기 전망 수정(하반기 환율 153엔 전제).\n  - 신덴겐: 하반기 기초 전망 유지.\n  - 산켄전기: 경상이익 전망 유지.\n  - 컨센서스: 다음 분기 QoQ **+1.6%**. 롬 -4.1%, 산켄 +20.5%다.\n- **해석:** AI 관련 비중이 낮아 일본 밸류체인 중 성장률과 이익률이 가장 낮다. 회복세는 완만하다.\n\n#### 유통 — 🟢상향\n- **실적(표본 소수, 1사):** 마크니카 매출 **$2,740M**, QoQ +11.3%, YoY **+49.0%**, OPM **3.9%**.\n- **가이던스·전망:** AI 관련 수요로 통기 실적을 상향했고 연간 배당을 **90엔**으로 올렸다. 2Q 마진 7.1%가 하반기 **8%대 후반**으로 회복하는 것을 전제한다. 다음 분기 컨센서스는 QoQ **-0.2%**다.\n- **해석:** 매출은 급증했지만 마진 회복은 아직 회사 전제에 머물러 있다.\n\n#### IDM(로직·아날로그) — 🟢상향\n- **실적(표본 소수, 1사):** 르네사스 매출 **$2,728M**, QoQ +4.2%, YoY **+30.0%**. ⚠️ 영업이익 데이터 오류로 이익률은 제외했다.\n- **가이던스·전망:** 이번 자료에 4Q 회사 가이던스는 없다. 직전 콜의 3Q 가이던스는 매출 **4,300억엔**(+6.1% QoQ, +28.7% YoY), GPM 57.5%, OPM 32.5%였다. 7월부터 일부 제품 가격을 올렸고 효과는 하반기부터 나온다. 4Q 컨센서스는 QoQ **+3.7%**다.\n- **해석:** 자동차 수요(중국 신제품, 28nm MCU, 일본 재고 보충)와 데이터센터가 성장을 이끈다. 유통 재고주수(WOI)는 줄고 있다.\n\n#### 클린룸·팹 인프라 — 🟢상향\n- **실적:** 매출 **$1,840M**, QoQ **+12.1%**, YoY **, OPM **28.0%**(전년 16.4%). 이노라이트 단독 매출 **$4,162M(YoY +171.8%)**이고, 4Q 컨센서스도 **QoQ +9.4%**로 성장이 이어질 것으로 본다.\n- **메모리는 이익 사이클 정점권**: YoY **+153.4%**, OPM **45.3%**(전년 11.3%). 다만 4Q 컨센서스가 **QoQ -13.1%**로 꺾여 가이던스 기준으로는 가장 약한 섹터다. 팹리스·IP도 4Q 컨센서스가 **-5.3%**인데, 스토리지 컨트롤러 기업의 기저 부담 탓이다.\n- **장비는 3Q 성장이 부진했지만 4Q 반등 기대**: 전공정 장비 YoY **+6.3%**, OPM **12.7%**(전년 16.3%)로 부진했다. 반면 4Q 컨센서스는 **QoQ +27.0%**(3사)로 가장 높다.\n- **파운드리는 회사 가이던스가 컨센서스보다 높다**: SMIC 4Q 가이던스 **+4~6% QoQ, GM 26~28%**로 컨센서스 +0.9%를 웃돈다. 화홍반도체 4Q 가이던스는 **$1,080~1,090M**.\n- **전력·화합물, 클린룸, IDM은 YoY 한 자릿수**로 저성장이다. AI·메모리 밸류체인과 비(非)AI 레거시 사이의 양극화가 뚜렷하다.\n\n### 밸류체인별 실적과 가이던스\n\n#### 광통신 — 🟢강한 상향\n- **실적**: 매출 **$16,474M**, QoQ **+10.0%**, YoY **+67.6%**(기업 중앙값 +80.3%), OPM **28.0%**(전년 16.4%).\n  - 중제욱창(이노라이트): 매출 **$4,162M**, QoQ +24.6%, YoY **+171.8%**, OPM 42.3%\n  - 장비광섬유(YOFC): **$1,396M**, QoQ **+52.4%**, YoY +139.4%, OPM 42.6%\n  - 신이성(이옵토링크): **$1,640M**, QoQ **-13.0%**, YoY +80.3%, OPM 44.0%\n  - 형통광전: **$3,348M**, QoQ -7.8%, YoY +27.1%, OPM 15.4%\n  - YoY 상위는 원걸과기 +284%, 태성광 +161%. 하위는 중천과기(ZTT) +22%, 형통광전 +27%.\n- **가이던스·전망**: **회사 가이던스 미제시**. 4Q 컨센서스는 세그먼트 **QoQ +9.4%**(9사)다.\n  - 상향: 이노라이트 **+33.0%**, 영정주식 +32.1%, 박창과기 +24.1%, 광신과기 +10.3%\n  - 하향: 원걸과기 **-36.1%**, 형통광전 -7.5%, 중천과기 -4.9%\n- **해석**: 트랜시버·광부품이 성장을 이끈다. 이노라이트 IR은 AI capex 확대 전망을 근거로 들었다. 반면 통신사향 비중이 큰 광섬유·케이블 대형사(형통·ZTT)는 4Q 역성장이 예상돼 세그먼트 안에서도 차이가 크다.\n\n#### 팹리스·IP — 🟠둔화\n- **실적**: 매출 **$7,698M**, QoQ **+11.9%**, YoY **+53.3%**(중앙값 **+29.8%**), OPM **23.4%**(전년 16.4%).\n  - 더밍리: **$1,745M**, YoY **+356.6%**, OPM 29.8%\n  - 하이곤: **$878M**, QoQ +15.6%, YoY +45.5%, OPM 22.6%\n  - 캄브리콘: **$529M**, YoY **+104.5%**, OPM 38.1%\n  - 몬타주: **$312M**, YoY +46.0%, OPM **47.9%**\n  - 약세: 자광궈신 YoY -23.9%, 맥스센드 OPM -38.3%\n- **가이던스·전망**: 4Q 컨센서스는 **QoQ -5.3%**(12사)다.\n  - 하향: 더밍리 **-32.9%**, 잉게닉 -20.4%, SG마이크로 -2.2%\n  - 상향: 하이곤 **+23.9%**, 베리실리콘 **+29.1%**, 몬타주 +16.5%\n  - 암로직: 연간 매출이 기존 예고 범위(**YoY +25~45%**) 상단에 이를 전망이며 **100억 위안** 돌파를 목표로 한다.\n  - 록칩: 4Q에 RK182X 물량이 늘고 RK3572 대규모 출하가 시작된다.\n  - 몬타주: 4Q 인터커넥트 칩 출하 예상치를 공시했다(발췌상 수치 확인 불가).\n- **해석**: 합산 YoY와 중앙값의 격차가 커서 성장이 더밍리 등 메모리 관련 소수 기업에 쏠려 있다. 4Q 감소는 스토리지 컨트롤러 기업이 정점을 지나는 영향이다. AI 가속기·인터커넥트(하이곤·몬타주)는 계속 상향 중이라 세그먼트 전체로는 혼조 속 둔화다.\n\n#### OSAT·테스트 — 🟡중립 (표본 3사)\n- **실적**: 매출 **$3,976M**, QoQ **+7.7%**, YoY **+22.0%**, OPM **11.0%**(전년 7.0%).\n  - JCET: **$1,712M**, QoQ +10.3%, YoY +13.5%, OPM 7.4%\n  - 통푸미전: **$1,325M**, YoY +25.0%, OPM **18.1%**\n  - 화천과기: **$938M**, YoY **+36.1%**, OPM 7.7%\n- **가이던스·전망**: **회사 가이던스 미제시**. 4Q 컨센서스는 **QoQ +0.7%**(3사)다. 기업별로는 JCET **+11.5%**, 통푸미전 -0.1%, 화천과기 **-18.0%**.\n- **해석**: 이익률은 개선됐지만 4Q 매출은 횡보가 예상된다. 기업 간 차이가 크다.\n\n#### 전공정 장비 — 🟢강한 상향\n- **실적**: 매출 **$3,837M**, QoQ **+8.5%**, YoY **+6.3%**(중앙값 +17.1%), OPM **12.7%**(전년 16.3%, 하락).\n  - 나우라: **$1,694M**, QoQ +14.9%, YoY **+1.3%**, OPM 15.8%\n  - AMEC: **$545M**, QoQ -3.7%, YoY +17.2%, OPM 12.0%\n  - 피오테크: **$346M**, QoQ +28.2%, YoY +1.8%, OPM 22.2%\n  - CFMEE: YoY **+142.1%**\n  - 징성기전: YoY -20.7%, 적자\n- **가이던스·전망**: **회사 가이던스 미제시**. 4Q 컨센서스는 **QoQ +27.0%**로 3사 기준이며, 나우라·AMEC 컨센서스는 자료에 없다. 기업별로는 피오테크 **+32.5%**, ACM상하이 **+28.7%**, 화해청과 +16.5%.\n- **해석**: 3Q는 대형사 YoY 정체와 마진 하락으로 약했다. 4Q는 매출 인식이 몰리는 시기여서 큰 반등이 예상된다. 다만 컨센서스 표본이 3사뿐이라 해석에 주의가 필요하다.\n\n#### 파운드리 — 🟢상향 (표본 소수: 2/3사)\n- **실적**: 집계 매출 **$3,693M**(SMIC·넥스칩), QoQ **+7.3%**, YoY **+30.9%**, OPM **20.8%**(전년 13.3%).\n  - SMIC: **$3,190M**, QoQ +6.1%, YoY **+33.9%**, OPM 22.3%\n  - 넥스칩: **$503M**, QoQ +10.2%, YoY +14.4%, OPM 11.2%\n  - 화홍반도체: **$987M**, QoQ +9.9%, OPM 23.0%. *2026년부터 보고통화가 CNY에서 USD로 바뀌어 YoY 비교와 집계에서 빠졌다.* 3Q 매출(화리미전 제외)은 **$803.4M**로 직전 가이던스 상단 $770M~를 넘었다.\n- **가이던스·전망**:\n  - SMIC 4Q: 매출 **+4~6% QoQ**, GM **26~28%** (컨센서스 +0.9%)\n  - 화홍반도체 4Q: 매출 **$1,080~1,090M**, GM **25~26%**. 3Q 매출 $987M과 같은 기준인지(화리미전 포함 여부)는 확인이 필요하다.\n  - 넥스칩: 4Q 가이던스는 발췌에 없다. 3Q 가이던스는 RMB 3.2~3.3B, GM 25~27%였고, 4Q 컨센서스는 **+1.5%**.\n  - 세그먼트 4Q 컨센서스는 **QoQ +1.0%**.\n- **해석**: SMIC 가이던스가 컨센서스를 웃돌고 마진 가이던스도 높아, 현지화 수요에 따른 가동률 강세가 4Q에도 이어진다는 신호다.\n\n#### 메모리 — 🔴악화 (표본 소수: 2사)\n- **실적**: 매출 **$3,501M**, QoQ **+8.4%**, YoY **+153.4%**, OPM **45.3%**(전년 11.3%).\n  - 기가디바이스: **$1,309M**, QoQ +18.4%, YoY **+225.6%**, OPM **59.6%**\n  - 롱시스: **$2,193M**, QoQ +3.2%, YoY +123.7%, OPM 36.8%\n- **가이던스·전망**: **회사 가이던스 미제시**. 4Q 컨센서스는 **QoQ -13.1%**(2사)로, 롱시스 -12.4%, 기가디바이스 -14.3%다. 참고로 잉게닉 IR은 \"DRAM 공급 부족이 2H26에 완화되지 않을 것\"이라고 밝혔다.\n- **해석**: 가격 급등으로 이익률이 정점권에 있다. 시장은 4Q부터 매출 역성장을 예상하고 있어 사이클 피크 우려가 반영됐다.\n\n#### 소재 — 🟢상향\n- **실적**: 매출 **$3,093M**, QoQ **+10.9%**, YoY **+19.2%**(중앙값 +29.9%), OPM **-1.7%**(전년 -4.9%).\n  - TCL중환: **$1,379M**, QoQ +18.5%, OPM **-18.8%**\n  - SICC: YoY **+102.9%**\n  - 강풍전자: **$259M**, YoY +44.4%, OPM 14.3%\n  - NSIG: YoY +39.8%, OPM **-30.1%**\n  - 야커과기: QoQ -13.1%, YoY +1.6%\n- **가이던스·전망**: **회사 가이던스 미제시**. 4Q 컨센서스는 **QoQ +12.5%**(5사)다. 기업별로는 딩롱 **+17.5%**, NSIG +14.4%, 안지미전자 +12.2%, 리앙웨이 +10.4%, 화터가스 +3.8%. 딩롱은 고급 웨이퍼 포토레지스트 주력 제품 2종을 4Q에 출시할 계획이다.\n- **해석**: 웨이퍼 업체(TCL중환·NSIG)의 적자로 세그먼트 전체는 아직 적자다. 반면 케미컬·CMP 소재는 OPM이 30%대(딩롱 35.5%, 안지미 36.0%)로 높고 4Q 성장도 예상된다.\n\n#### 패키지 기판 — 🟡중립 (표본 소수: 2사)\n- **실적**: 매출 **$1,980M**, QoQ **+21.0%**, YoY **+60.2%**, OPM **19.6%**(전년 12.7%).\n  - 선난서킷: **$1,570M**, QoQ +20.4%, YoY **+66.3%**, OPM 21.2%\n  - 싱썬과기: **$409M**, QoQ +23.1%, YoY +40.3%, OPM 13.5%\n- **가이던스·전망**: **회사 가이던스 미제시**. 4Q 컨센서스는 **QoQ -0.4%**로, 선난서킷 -3.8%, 싱썬과기 **+12.7%**다.\n- **해석**: 3Q가 급증한 뒤라 4Q는 높은 수준에서 횡보할 것으로 본다.\n\n#### 전력·화합물 반도체 — 🟢상향\n- **실적**: 매출 **$1,612M**, QoQ **+4.6%**, YoY **+1.5%**(중앙값 +14.3%), OPM **10.5%**(전년 6.8%).\n  - 양지에과기: **$400M**, YoY **+40.9%**, OPM 21.4%\n  - 화룬마이크로: **$504M**, YoY +18.9%, OPM 13.3%\n  - 산안광전: **$535M**, YoY **-26.1%**, OPM 2.3%\n  - *윙텍(문태과기)은 ODM 사업 매각으로 매출이 급감해 집계에서 뺐다.*\n- **가이던스·전망**: **회사 가이던스 미제시**. 4Q 컨센서스는 **QoQ +5.6%**(3사)로, 스타파워 +14.7%, 화룬마이크로 +4.4%, 양지에과기 +3.1%다.\n- **해석**: 완만한 회복 국면이다. 산안광전 역성장이 합산 YoY를 끌어내렸다.\n\n#### 클린룸·팹 인프라 — 🟡중립 (표본 3사)\n- **실적**: 매출 **$554M**, QoQ **+20.2%**, YoY **+6.9%**, OPM **11.2%**.\n  - 정범과기: **$241M**, YoY +26.3%, OPM 4.4%\n  - 야샹집성: **$220M**, YoY +2.9%, OPM **24.9%**\n  - 지순과기: **$93M**, QoQ +55.7%, YoY -18.1%, 적자\n- **가이던스·전망**: **회사 가이던스 미제시**. 4Q 컨센서스는 **QoQ +2.6%**로 지순과기 1사 기준이다.\n- **해석**: 분기별로 프로젝트 인식이 들쭉날쭉하고, 연간 성장은 한 자릿수에 그친다.\n\n#### IDM(로직·아날로그) — 🟢상향 (표본 소수: 1사)\n- **실적**: 실란 매출 **$551M**, QoQ **-1.8%**, YoY **+8.8%**, OPM **2.4%**(전년 0.7%).\n- **가이던스·전망**: **회사 가이던스 미제시**. 4Q 컨센서스는 **QoQ +12.0%**.\n- **해석**: 매출 반등이 기대되지만 이익률이 2%대로 낮아 수익성 회복은 아직 제한적이다.\n\n#### 후공정 장비 — 🟢상향 (표본 소수: 1사)\n- **실적**: 장천과기 매출 **$372M**, QoQ **+19.2%**, YoY **+53.9%**, OPM **32.5%**(전년 24.0%).\n- **가이던스·전망**: **회사 가이던스 미제시**. 4Q 컨센서스는 **QoQ +11.9%**.\n- **해석**: 테스트 장비(ATE) 수요가 늘어 고성장과 마진 개선이 함께 나타나고 있다.\n\n### 가이던스 톤 정리\n- **좋았던 곳**\n  - **전공정 장비**: 4Q 컨센서스 **QoQ +27.0%**(3사). 피오테크 +32.5%, ACM상하이 +28.7%.\n  - **광통신**: 4Q 컨센서스 **QoQ +9.4%**(9사). 이노라이트 **+33.0%**, 영정주식 +32.1%, 박창과기 +24.1%.\n  - **파운드리**: SMIC 4Q 가이던스 **+4~6% QoQ, GM 26~28%**로 컨센서스 +0.9%를 웃돈다. 화홍반도체 4Q 가이던스는 **$1,080~1,090M, GM 25~26%**.\n  - **소재**: 4Q 컨센서스 **+12.5%**(5사). **IDM**(+12.0%)과 **후공정 장비**(+11.9%)도 상향이지만 둘 다 1사 표본이다.\n- **나빴던 곳**\n  - **메모리**: 4Q 컨센서스 **QoQ -13.1%**. 기가디바이스 -14.3%, 롱시스 -12.4%로, OPM 45.3% 정점 뒤 역성장이 예상된다.\n  - **팹리스·IP**: 4Q 컨센서스 **QoQ -5.3%**. 더밍리 **-32.9%**, 잉게닉 -20.4%가 하락을 이끌고, AI 칩(하이곤 +23.9%)과는 엇갈린다.\n  - **광통신 내 광섬유·케이블과 광 칩**: 원걸과기 **-36.1%**, 형통광전 -7.5%, 중천과기 -4.9%.\n  - **OSAT 화천과기**: 4Q 컨센서스 **-18.0%**."}, "EU": {"name": "유럽", "flag": "🇪🇺", "tone": {"summary": "유럽 전공정장비 YoY +53.6%·4Q 컨센 +23.5%, AI향 상향 우세·소재/후공정 정체", "segments": [{"seg": "전공정 장비", "tone": 2, "growth": "매출 QoQ +23.8%, YoY +53.6%, OPM 42.7%(전년 31.8%)", "guide": "ASML 4Q 매출 €142~152억(Q3 €117억), FY26 €440~450억(+약 36%) / ASM 4Q €1.23B ±5%, FY27 €5.7B 초과 / 컨센 4Q QoQ +23.5%"}, {"seg": "광통신", "tone": 2, "growth": "매출 QoQ +6.6%, YoY +18.9%, OPM 6.9%(전년 10.9%)", "guide": "노키아 4Q 매출 QoQ +20~24% 가정, 2027 Optical+IP +25~30% / 프리스미안 FY26 EBITDA 중간값 €31억으로 상향 / 컨센 QoQ +10.4%"}, {"seg": "IDM(로직·아날로그)", "tone": 1, "growth": "매출 QoQ +8.0%, YoY +18.6%, OPM 21.1%(전년 16.9%)", "guide": "NXP 4Q 매출 $3.85B ±$100M(+2% QoQ, +15% YoY) / ST 4Q 매출 QoQ +10.5% ±350bp, GM 약 39.0% / 컨센 QoQ +6.1%"}, {"seg": "전력·화합물 반도체", "tone": 1, "growth": "매출 QoQ +12.8%, YoY +19.4%, OPM 16.5%(전년 13.7%)", "guide": "인피니언 1Q FY27 매출 약 €4.6B(4Q €4.706B), 부문이익률 약 23%, FY27 매출 성장 20% 초과 / 컨센 QoQ -1.3%"}, {"seg": "팹리스·IP", "tone": 0, "growth": "매출 QoQ +10.2%, YoY +23.8%, OPM 15.4%(전년 12.9%)", "guide": "노르딕 4Q 매출 $215~235M(3Q $235M 대비 소폭 하락) / 멜렉시스 H2 €445~455M 재확인 / ARM 연간 로열티 성장 high teens로 하향 시사 / 컨센 QoQ +4.2%"}, {"seg": "부품", "tone": 1, "growth": "QoQ 산출 불가(반기 보고), YoY +49.4%, OPM 25.5%(전년 14.0%)", "guide": "인피콘 FY26 매출 $820~850M으로 상향(기존 $750~780M) / 테크노프로브 4Q €270M ±3%(3Q €323.3M, ERP 전환 영향) / 컨센 없음"}, {"seg": "패키지 기판", "tone": 1, "growth": "매출 QoQ +24.3%, YoY +52.4%, OPM 21.4%(전년 3.7%)", "guide": "회사 가이던스 미제시, AT&S 다음 분기 컨센 매출 QoQ +9.6%"}, {"seg": "후공정 장비", "tone": 0, "growth": "매출 QoQ +3.9%, YoY +51.1%, OPM 35.2%(전년 19.3%)", "guide": "BESI 4Q 매출 QoQ 보합(±5%), GM 63~65% / 쥐스 4Q 매출 전환 예정 약 €125M, FY26 €425~485M / 컨센 QoQ +1.1%"}, {"seg": "소재", "tone": 0, "growth": "매출 QoQ +10.5%, YoY +18.3%, OPM -13.5%(전년 -10.5%)", "guide": "실트로닉 FY26 매출 전년 수준으로 소폭 상향(Q4 EUR/USD 1.14 가정) / 컨센 4Q QoQ +4.3%"}, {"seg": "파운드리", "tone": 1, "growth": "매출 QoQ -2.7%, YoY -14.9%, OPM 2.2%(전년 10.4%)", "guide": "X-FAB 4Q 매출 $205~215M, EBITDA 마진 19~22% / 3Q 수주 QoQ +30%, B/B 1.12 / 컨센 QoQ +11.6%"}], "best": ["전공정 장비", "광통신", "전력·화합물 반도체"], "worst": ["소재", "후공정 장비", "팹리스·IP"]}, "md": "## 유럽\n\n### 한눈에\n- **전공정 장비가 실적과 가이던스 모두 가장 강했다.** 5사 매출 합계 **$14,680M**, **YoY +53.6%**, OPM **42.7%**(전년 31.8%)다. ASML이 4Q 매출 **€142~152억**을 제시했고(Q3 €117억), 다음 분기 컨센서스도 **QoQ +23.5%**다.\n- **AI 인프라 관련 체인의 고성장이 뚜렷하다.** 부품 **YoY +49.4%**(OPM 25.5%, 전년 14.0%), 패키지 기판 **+52.4%**, 후공정 장비 **+51.1%**를 기록했다. 광통신은 YoY **+18.9%**로 성장했지만 OPM이 **6.9%**로 전년 10.9%에서 낮아졌다.\n- **약했던 곳은 파운드리와 소재다.** 파운드리(X-FAB)는 **YoY -14.9%**로 유일하게 역성장했고, 소재(실트로닉)는 OPM **-13.5%**로 적자가 이어졌다.\n- **가이던스는 대체로 상향 쪽이다.** ASML·ASM·노키아·프리스미안·인피콘·인피니언(FY27 매출 **+20% 초과**)이 실적 전망을 올리거나 강하게 제시했다. 반면 BESI(4Q 보합), 노르딕(4Q 소폭 하락), 테크노프로브(4Q 일시 감소)는 단기 숨고르기를 예고했다.\n\n### 밸류체인별 실적과 가이던스\n\n#### 전공정 장비 — 🟢강한 상향\n- **실적**: 집계 매출 QoQ **+23.8%**, YoY **+53.6%**(기업 중앙값 +44.9%), OPM **42.7%**(전년 31.8%).\n  - **ASML**: Q3 매출 **€117억**으로 사상 최대이며 가이던스 상단이다. 시스템 매출 €84억 중 EUV가 €41억이고, 설치기반 매출은 €33억으로 가이던스를 **€4억** 웃돌았다. GM은 **57.5%**, 시스템 매출 비중은 로직 54%·메모리 46%.\n  - **ASM인터내셔널**: 매출 **€1.16B**(YoY +44%, QoQ +14%, 고정환율), GM **52.0%**, 영업이익률 **33.4%**. 1.4nm 매출이 처음 기여했다.\n  - **익스트론**: 매출 **€184M**(YoY +54%), GM 48%, EBIT 마진 **31%**. 옵토(InP) 수요가 램프업을 이끌었다.\n  - **마이크로닉**: 매출 약 **SEK 2.4bn**(+38%), EBIT 마진 26%, 수주잔고는 사상 최대인 약 SEK 5.5bn.\n- **가이던스·전망**\n  - ASML: 4Q 매출 **€142~152억**, GM 약 57%. FY26은 **€440~450억**(+약 36%)이며 EUV +45% 이상, 메모리 +약 75%. DUV 이머전 출하는 당초 감소 계획에서 2025년 수준으로 상향했다.\n  - ASM: 4Q **€1.23B ±5%**, FY26 매출 약 **+35%**. FY27은 **€5.7B 초과**로, 2030년 목표를 3년 앞당긴 수준이다.\n  - 익스트론: FY26 매출 **€560M ±30M** 재확인(9M 누적 €358M), 선수금 **€309M**. 마이크로닉: FY26 매출 **SEK 9.75bn**으로 상향.\n  - 컨센서스 4Q 매출 QoQ **+23.5%**(5사).\n- **해석**: 메모리(DRAM) 투자가 본격화했고 선단 로직(2nm·1.4nm) 수요도 겹쳐 2027년까지 가시성이 높다. 다만 PVA테플라는 YoY **+10%**로 하위에 머물렀다.\n\n#### 광통신 — 🟢강한 상향\n- **실적**: 집계 매출 QoQ **+6.6%**, YoY **+18.9%**, OPM **6.9%**(전년 10.9%).\n  - **프리스미안**: 매출 **$7,095M**(YoY +27.6%), 유기성장 **+13%**, 조정 EBITDA **€8.51억**(마진 ~17%). Digital Solutions의 광섬유 부문은 35~40% 성장했다.\n  - **노키아**: 매출 +9%, 비교가능 영업이익률 **11.7%**(+220bp). Optical **+18%**, IP **+43%**, AI·클라우드 고객 매출 **+123%**.\n  - **예놉티크**: 매출 **$332M**(QoQ +14.8%, YoY +18.0%), OPM 17.9%.\n- **가이던스·전망**\n  - 노키아: 4Q 매출 QoQ **+20~24%** 가정. 2027년 Optical+IP 합산 성장률 **25~30%**를 처음 제시했다.\n  - 프리스미안: FY26 EBITDA 중간값 **€31억**으로 상향, FCF €17억 → **€18억**. Q4 EBITDA 약 **€9.18억**으로 사상 처음 Q4가 Q3를 웃돌 전망이다.\n  - 예놉티크: 2026 매출 성장 **+5~9%** 유지, EBITDA 마진은 약 **22%**로 상향.\n  - 컨센서스 QoQ **+10.4%**(3사).\n- **해석**: 데이터센터향 광섬유·광전송 수요가 계절성을 지울 만큼 강하다. 프리스미안의 데이터센터 매출은 약 €25억이다. 집계 OPM 하락은 노키아의 구조조정 비용(2026년 약 €1.1bn)과 믹스 영향이 크다.\n\n#### IDM(로직·아날로그) — 🟢상향 (표본 소수)\n- **실적**: 집계 매출 QoQ **+8.0%**, YoY **+18.6%**, OPM **21.1%**(전년 16.9%).\n  - **NXP**: 매출 **$3.79B**(YoY +19%, QoQ +8%), Non-GAAP GPM **58.6%**, OPM **37.1%**. 산업·IoT +39%, 통신인프라 +54%.\n  - **ST마이크로**: 매출 **$3,757M**(QoQ +7.7%, YoY +17.9%)로 가이던스 중간값을 150bp 웃돌았다.\n- **가이던스·전망**\n  - NXP: 4Q 매출 **$3.85B ±$100M**(QoQ +2%, YoY +15%), GPM **59%**. 2027년은 두 자릿수 성장에 GPM 60%이며, 데이터센터 매출은 올해 $500M을 넘을 전망이다.\n  - ST: 4Q 매출 QoQ **+10.5% ±350bp**, GM 약 **39.0%**.\n  - 컨센서스 QoQ **+6.1%**.\n  - 참고: ams오스람은 최근 분기가 2Q라 집계에서 빠졌다. Q3 가이던스는 매출 €7.7억~8.7억.\n- **해석**: 산업·데이터센터 회복과 가격 환경 안정이 이익률을 끌어올리고 있다. NXP는 2026년 가격이 중립이라고 밝혔다.\n\n#### 전력·화합물 반도체 — 🟢상향 (표본 소수)\n- **실적**: 집계 매출 QoQ **+12.8%**, YoY **+19.4%**, OPM **16.5%**(전년 13.7%).\n  - **인피니언**: Q4 FY26 매출 **€4.706B**로 사상 최대, 부문이익률 **23.8%**. 직전 Q3 PSS 부문은 YoY **+34%**, 이익률 24.9%였다.\n- **가이던스·전망**: 1Q FY27 매출 약 **€4.6B**, 부문이익률 약 **23%**. FY27은 매출 성장 **20% 초과**, 수익성 **+5%p**. AI 데이터센터 전력 매출은 FY26 €16억 이상이며, FY27 데이터센터 전망은 약 €30억 수준으로 상향을 시사했다. 컨센서스 QoQ **-1.3%**.\n- **해석**: 다음 분기는 계절성으로 소폭 감소하지만, 데이터센터 전력 수요가 공급을 웃돌아 연간 전망은 강하다.\n\n#### 팹리스·IP — 🟡중립\n- **실적**: 집계 매출 QoQ **+10.2%**, YoY **+23.8%**(중앙값 +27.1%), OPM **15.4%**(전년 12.9%).\n  - **ARM**: 매출 **$1,443M**(QoQ +11.9%, YoY +27.1%).\n  - **노르딕**: 매출 **$235M**(YoY +32%)으로 사상 최대, GPM 52.8%.\n  - **멜렉시스**: 매출 €223.7M(YoY **+4%**), OPM 18.5%.\n  - **세큐앙스**: 매출 $9.1M(YoY +183%).\n- **가이던스·전망**\n  - 노르딕: 4Q 매출 **$215~235M**로 3Q보다 소폭 낮다.\n  - 멜렉시스: H2 매출 **€445~455M**, OPM 약 18% 재확인.\n  - 엘모스: FY26 매출 성장 **12% ±2%p**.\n  - ARM: 7월 콜에서 연간 로열티 성장을 high teens로 하향 시사. 최신 분기 가이던스 수치는 자료에 없고, 컨센서스는 QoQ +6.6%다.\n  - 세큐앙스: 4Q 매출 **$9.5~11M**.\n  - 집계 컨센서스 QoQ **+4.2%**.\n- **해석**: 데이터센터 로열티(ARM)와 BLE(노르딕)는 강하다. 반면 자동차 비중이 큰 멜렉시스는 저성장이고 스마트폰은 약세여서 혼조다.\n\n#### 부품 — 🟢상향 (반기 보고 기업 혼재, QoQ 제외)\n- **실적**: 집계 YoY **+49.4%**, OPM **25.5%**(전년 14.0%). QoQ와 컨센서스는 산출 불가다.\n  - **테크노프로브**: Q3 매출 **€323.3M**(YoY +130%, QoQ +16.7%), EBITDA 마진 **52.6%**.\n  - **VAT그룹**: YoY **+45.9%**. 2Q 수주는 CHF 5억 이상, B/B 1.7x.\n  - **인피콘**: YoY +42.4%, OPM 25.5%.\n  - **메르센**: YoY +15.7%.\n- **가이던스·전망**\n  - 인피콘: FY26 매출 **$820~850M**(기존 $750~780M), 영업이익률 **21~22%**(기존 19~20%)로 상향.\n  - VAT: 3Q 매출 CHF 3.55억~3.85억, 연말 분기 출하 런레이트 **CHF 4.5억 이상**.\n  - 테크노프로브: 4Q 매출 **€270M ±3%**. ERP 전환 영향이 약 €50M이며, 생산능력은 2027년 말 약 €2B/년으로 늘린다.\n  - 메르센: EBITDA 마진 16.0~16.5% 확인.\n- **해석**: WFE 확대와 AI 테스트 수요로 수주와 마진이 동반 개선 중이다. 테크노프로브의 4Q 감소는 일시적 운영 요인이다.\n\n#### 패키지 기판 — 🟢상향 (표본 소수)\n- **실적**: AT&S 매출 **$754M**(QoQ +24.3%, YoY +52.4%), OPM **21.4%**(전년 3.7%).\n- **가이던스·전망**: 회사 가이던스 미제시(최신 IR 발췌 없음). 컨센서스 매출 QoQ **+9.6%**.\n- **해석**: 이익률이 한 자릿수 초반에서 20%대로 급반등해 고부가 기판 가동률 개선이 뚜렷하다.\n\n#### 후공정 장비 — 🟡중립 (표본 소수)\n- **실적**: 집계 매출 QoQ **+3.9%**, YoY **+51.1%**, OPM **35.2%**(전년 19.3%).\n  - **BESI**: 매출 **€283.4M**(YoY +113.5%), 수주 €342.6M, 순이익률 37.8%.\n  - **쥐스마이크로텍**: 매출 $107M(QoQ -16.5%, YoY **-18.4%**), OPM 4.2%.\n- **가이던스·전망**\n  - BESI: 4Q 매출 **QoQ 보합(±5%)**, GM 63~65%, OPEX QoQ +5~10%.\n  - 쥐스: 4Q 매출 전환분 약 **€125M**, FY26 €425~485M. 2027년 매출로 이어질 수주 €415~435M를 확보했다.\n  - 컨센서스 QoQ **+1.1%**(1사).\n- **해석**: 수주 모멘텀(하이브리드 본딩, 쥐스 9M 수주 €633.5M)은 강하다. 다만 고객 납기 요청으로 다음 분기 매출은 정체 구간이다.\n\n#### 소재 — 🟡중립 (표본 소수)\n- **실적**: 실트로닉 매출 **$393M**(QoQ +10.5%, YoY +18.3%), OPM **-13.5%**(전년 -10.5%).\n- **가이던스·전망**: FY26 매출 가이던스를 **전년 수준**으로 소폭 상향했다(Q4 EUR/USD 1.14 가정, 달러 강세와 수요 증가 반영). 컨센서스 4Q QoQ **+4.3%**.\n- **참고(집계 외)**: IQE는 FY26 매출 **+30% 초과** 가이던스를 유지했다.\n- **해석**: 웨이퍼 물량은 회복 중이지만 적자 폭이 커져 수익성 회복은 아직이다.\n\n#### 파운드리 — 🟢상향 (표본 소수)\n- **실적**: X-FAB 매출 **$194.4M**(QoQ -2.7%, YoY **-14.9%**), OPM **2.2%**(전년 10.4%), EBITDA 마진 19.3%.\n- **가이던스·전망**: 4Q 매출 **$205~215M**, EBITDA 마진 **19~22%**. 3Q 수주는 $224.7M(QoQ **+30%**), B/B **1.12**. Site B 폐쇄로 2027년 매출이 약 $50M 줄어든다. 컨센서스 QoQ **+11.6%**.\n- **해석**: 자동차 매출이 YoY -19%로 저점권이다. 다만 수주 반등과 SiC·포토닉스가 회복 신호를 주고 있다.\n\n### 가이던스 톤 정리\n- **좋았던 곳**\n  - 전공정 장비: ASML 4Q **€142~152억**, FY26 **€440~450억**. ASM FY27 **€5.7B 초과**. 컨센서스 QoQ **+23.5%**.\n  - 광통신: 노키아 4Q QoQ **+20~24%**, 2027 Optical+IP **+25~30%**. 프리스미안 FY26 EBITDA **€31억**으로 상향.\n  - 전력·화합물: 인피니언 FY27 매출 **+20% 초과**, 수익성 **+5%p**.\n  - 부품: 인피콘 FY26 매출 **$820~850M**으로 상향, VAT 연말 런레이트 **CHF 4.5억+**.\n  - IDM: ST 4Q **+10.5% QoQ**, NXP 2027 두 자릿수 성장·GPM 60%.\n- **나빴던 곳**\n  - 소재: 실트로닉 OPM **-13.5%**로 적자 확대. 가이던스는 전년 수준에 그쳤다.\n  - 후공정 장비: BESI 4Q **보합**, 컨센서스 QoQ **+1.1%**. 쥐스는 YoY **-18.4%**.\n  - 팹리스·IP: 노르딕 4Q **$215~235M**로 QoQ 하락(컨센서스 -9.0%), 멜렉시스 YoY **+4%** 저성장, ARM 로열티 전망 하향 시사.\n  - 파운드리: YoY **-14.9%**, 2027년 Site B 폐쇄로 매출 약 **$50M** 감소. 다만 4Q 가이던스는 회복세다."}}, "cells": {"CN|팹리스·IP": {"n": 21, "na": 21, "rev": 7698, "yoy": 53.3, "qoq": 11.9, "med": 29.8, "opm": 23.4, "opm1": 16.4, "dopm": 7.0, "cons": -5.3, "cn": 12, "tone": -1, "g": "매출 $7,698M, QoQ +11.9%, YoY +53.3%(중앙값 +29.8%), OPM 23.4%", "gd": "4Q 컨센 QoQ -5.3%(12사), 더밍리 -32.9%·잉게닉 -20.4% vs 하이곤 +23.9%·베리실리콘 +29.1%"}, "CN|파운드리": {"n": 2, "na": 3, "rev": 3693, "yoy": 30.9, "qoq": 7.3, "med": 24.2, "opm": 20.8, "opm1": 13.3, "dopm": 7.4, "cons": 1.0, "cn": 2, "tone": 1, "g": "매출 $3,693M(2사), QoQ +7.3%, YoY +30.9%, OPM 20.8%", "gd": "SMIC 4Q 매출 +4~6% QoQ·GM 26~28% 가이던스, 화홍 4Q 매출 $1,080~1,090M·GM 25~26% 가이던스"}, "CN|메모리": {"n": 2, "na": 2, "rev": 3501, "yoy": 153.4, "qoq": 8.4, "med": 174.7, "opm": 45.3, "opm1": 11.3, "dopm": 34.0, "cons": -13.1, "cn": 2, "tone": -2, "g": "매출 $3,501M, QoQ +8.4%, YoY +153.4%, OPM 45.3%(전년 11.3%)", "gd": "4Q 컨센 QoQ -13.1%(2사), 롱시스 -12.4%·기가디바이스 -14.3%"}, "CN|IDM(로직·아날로그)": {"n": 1, "na": 1, "rev": 551, "yoy": 8.8, "qoq": -1.8, "med": 8.8, "opm": 2.4, "opm1": 0.7, "dopm": 1.8, "cons": 12.0, "cn": 1, "tone": 1, "g": "매출 $551M, QoQ -1.8%, YoY +8.8%, OPM 2.4%", "gd": "실란 4Q 컨센 QoQ +12.0%(1사)"}, "CN|전력·화합물 반도체": {"n": 4, "na": 4, "rev": 1612, "yoy": 1.5, "qoq": 4.6, "med": 14.3, "opm": 10.5, "opm1": 6.8, "dopm": 3.7, "cons": 5.6, "cn": 3, "tone": 1, "g": "매출 $1,612M, QoQ +4.6%, YoY +1.5% cons": 3.4, "note": ""}, {"t": "Q", "n": "큐니티", "c": "US", "s": "소재", "l": "2026-09", "rev": 1556, "qoq": 8.9, "yoy": 21.9, "opm": 21.5, "cons": -5.2, "note": ""}, {"t": "PLAB", "n": "포트로닉스", "c": "US", "s": "소재", "l": "2026-08", "rev": 216, "qoq": 2.9, "yoy": 2.7, "opm": 21.1, "cons": 0.4, "note": ""}, {"t": "ESI", "n": "엘리먼트 솔루션즈", "c": "US", "s": "소재", "l": "2026-09", "rev": 995, "qoq": 1.8, "yoy": 51.7, "opm": 11.4, "cons": -2.7, "note": ""}, {"t": "AMKR", "n": "앰코", "c": "US", "s": "OSAT·테스트", "l": "2026-09", "rev": 1991, "qoq": 4.9, "yoy": 0.2, "opm": 11.3, "cons": -0.3, "note": ""}, {"t": "ARW", "n": "애로우 일렉트로닉스", "c": "US", "s": "유통", "l": "2026-10", "rev": 10718, "qoq": 7.3, "yoy": 39.0, "opm": 4.0, "cons": -0.4, "note": ""}], "cov": {"US": [81, 83], "TW": [93, 94], "KR": [59, 141], "JP": [74, 91], "CN": [78, 79], "EU": [26, 32]}, "synth": "## 종합 인사이트\n\n> **한 줄 결론:** 메모리(YoY +153~453%)와 AI 장비·칩이 3Q를 이끌었고 4Q 가이던스도 상향(TSMC +14%, ASML €142~152억)이다. 예외는 중국 메모리와 비AI다\n\n### 핵심 인사이트\n\n1. **성장은 '메모리 × 전 국가'와 'AI 연산·장비'에 몰렸다**\n   - 메모리 YoY는 대만 **+384.6%**(QoQ +48.6%), 미국 **+379.0%**(QoQ +29.4%), 한국 **+171.3%**(합계 **$224.7B**)다. 일본 키옥시아는 **+453.2%**다(표본 1사).\n   - AI 축에서는 미국 팹리스가 **YoY +75.3%**(합계 **$163.6B**), 대만 파운드리가 **+49.6%**, 중국 광통신이 **+67.6%**를 기록했다.\n   - 후공정 장비 YoY는 대만 **+146.4%**, 미국 **+74.7%**, 일본 **+61.6%**다. AI 칩과 HBM 테스트 수요가 가장 가파르게 늘었다.\n   - **시사점:** 이번 분기 성장은 국가보다 밸류체인 위치가 갈랐다. 메모리, AI 칩, 테스트 장비에 노출된 곳이 이겼다.\n\n2. **이익률 레버리지는 메모리가 압도적이다. 매출이 늘어도 마진이 떨어진 곳도 있다**\n   - 메모리 OPM은 대만 8.0%→**67.7%**, 미국 28.1%→**80.5%**, 한국 21.3%→**63.6%**, 일본 19.2%→**80.5%**로 올랐다.\n   - 장비도 개선됐다. 한국 전공정은 10.4%→**20.9%**로 두 배가 됐고, 유럽 전공정은 31.8%→**42.7%**, 일본 후공정은 38.6%→**50.7%**다.\n   - 반대로 한국 OSAT는 매출 YoY +55.7%에도 OPM이 2.3%→**0.3%**로 떨어졌다. 유럽 광통신은 10.9%→**6.9%**, 중국 전공정 장비는 16.3%→**12.7%**로 낮아졌다. 대만 유통은 매출 YoY +89.5%인데 OPM은 **2.7%**다.\n   - **시사점:** 마진은 가격 결정력을 가진 곳에만 붙는다. 공급이 부족한 메모리와 핵심 장비가 그렇다. 원가를 넘겨받는 하류(OSAT, 유통, 모바일 부품)는 매출만 커졌다.\n\n3. **가이던스: 최상단은 장비·파운드리·AI 칩, 최하단은 중국 메모리·팹리스**\n   - **좋았던 곳**\n     - 유럽 전공정 장비 컨센서스는 QoQ **+23.5%**다. ASML은 4Q **€142~152억**(Q3 €117억), ASM은 FY27 **€5.7B 초과**를 제시했다.\n     - TSMC는 4Q **$52.3~54.3B**(QoQ +14%)와 FY26 **약 +44%**를 내놨다.\n     - 엔비디아는 3Q **$108B**, 마이크론은 FQ1 **$61.5B**로 모두 사상 최대를 가이드했다.\n     - 중국 전공정(3사)은 **+27.0%**, 한국 전공정(1사)은 **+28.1%**다.\n   - **나빴던 곳**\n     - 중국 메모리 컨센서스 **-13.1%**(2사)\n     - 한국 팹리스 **-8.5%**, 중국 팹리스 **-5.3%**\n     - 대만 후공정 장비 **-4.7%**\n     - 일본 부품 **-3.2%**\n     - 미국 IDM **-2.1%**(인텔 CCPG QoQ **-20% 이상**)\n   - **시사점:** 4Q 모멘텀은 공정 장비(ASML, 국내외 증착·식각)와 선단 파운드리가 가장 확실하다. 3Q에 기저가 높아진 후공정 장비와 메모리 연관 팹리스는 쉬어간다.\n\n4. **사이클 위치: 메모리는 '물량 없이 가격으로 오르는' 국면이고, 장비 capex는 2027년까지 가시성이 있다. 비AI는 메모리 원가에 눌린다**\n   - **메모리:** 마이크론은 FQ1을 GM 저점으로 보고 2027~28년 수급이 더 타이트해진다고 했다. SK하이닉스는 2030년까지 수요가 공급을 웃돈다고 보고 주요 고객 14곳과 LTA를 맺었다. 반면 난야의 비트 출하는 flat이라 성장은 가격 주도다.\n   - **Capex:** 하이퍼스케일러 CapEx는 2026년 약 **$8,000억**에서 2027년 **$1.3조**로 늘어난다. 2027 WFE 전망은 미국 장비사 **$200B 초과**, TEL **$210B 이상**이다. SK하이닉스는 '26 CapEx **40조원 후반**에서 '27년에 늘린다.\n   - **비AI:** 인텔은 PC TAM을 2026년 **-12%**, 2027년 **-10%**로 가정했다. 퀄컴은 FY27 핸드셋 시장 low-teens 감소를 예상한다. 온세미는 자동차 매출이 한 자릿수 후반 % 줄 것으로 봤다. 전력반도체 YoY는 일본 **+9.5%**, 중국 **+1.5%**에 그친다.\n   - **시사점:** AI 인프라는 수요보다 공급이 병목인 확장 국면이다. 엔비디아는 공급 제약이 없다면 수요가 약 2배라고 했다. 메모리 가격 급등은 PC·모바일 수요를 깎는 역풍으로 번지고 있다.\n\n5. **국가 간 괴리: 중국 메모리만 꺾이고, 일본은 연간 상향과 분기 컨센서스가 엇갈리며, 중국 장비는 3Q에 뒤처졌다**\n   - **메모리 컨센서스:** 중국 **-13.1%** vs 미국 **+13.7%**, 대만 **+10.5%**, 일본 **+9.8%**(1사). 한국은 4Q DRAM 출하 가이던스가 SK하이닉스 **+20% 중반**, 삼성 **+10% 중후반**이다. 중국 표본(기가디바이스, 롱시스)은 DRAM 대형사와 사업 구조가 다르다는 점에 유의해야 한다. 같은 중국의 잉게닉 IR은 DRAM 공급 부족이 2H26에 풀리지 않는다고 했다.\n   - **일본:** 레조낙(+28%), 후루카와, TEL, 레이저텍 등이 연간 전망을 올렸다. 그런데 다음 분기 컨센서스는 부품 **-3.2%**, 광통신 **-2.1%**, 후공정 **-1.9%**, 전공정 **+0.1%**로 숨고르기다. 엔고 전제(156엔)도 반영됐다.\n   - **장비 YoY:** 중국 전공정은 **+6.3%**(나우라 +1.3%)로 미국 **+47.7%**, 유럽 **+53.6%**, 한국 **+45.3%**와 격차가 크다. 램리서치는 12월 분기에 중국 비중(**35%**)이 크게 줄 것으로 예고했다.\n   - **시사점:** 같은 세그먼트라도 국가에 따라 사이클 위치가 다르다. 중국 메모리와 일본 단기 컨센서스는 비중 판단에서 따로 봐야 한다.\n\n6. **AI의 2차 수혜(광통신·기판·테스트)가 확산 중이다. 다만 마진은 업체마다 다르다**\n   - **광통신:** YoY는 대만 **+72.4%**(OPM 33.8%), 중국 **+67.6%**(OPM 28.0%), 미국 **+40.3%** vs 일본 **+20.3%**, 유럽 **+18.9%**다. 컨센서스는 미국·중국 모두 **+9.4%**다.\n   - **패키지 기판:** 대만은 QoQ **+26.2%**에 컨센서스 **+14.5%**, 유럽 AT&S(1사)는 OPM 3.7%→**21.4%**다. 한국은 OPM **8.0%**인데, LG이노텍 1.5%가 끌어내렸다.\n   - **테스트:** 어드반테스트는 하반기 매출이 상반기 대비 **약 +28%**다. 테라다인에 따르면 반도체 CapEx 중 테스트 비중은 6.4%에서 **8.1%**로 올랐다.\n   - **시사점:** 트랜시버·레이저, ABF 기판, SoC 테스터처럼 공급이 부족한 품목은 마진을 올리고 있다. 통신사향 광섬유와 모바일 기판은 2차 수혜에서 빠져 있다.\n\n7. **리스크·체크포인트**\n   - **메모리 원가 전가:** 퀄컴의 Apple향 매출이 12월 분기 약 **-50%**로 줄고, 타워 스마트모바일은 low-teens % 감소가 예상된다. 수요 파괴가 어디까지 번지는지 봐야 한다.\n   - **공급 병목:** InP 기판·레이저, MFC 부족과 TSMC 해외 팹 GM 희석(향후 **3~4%p**)이 있다.\n   - **사이클 지속성:** '28년 업황 지속성 우려가 '27년 상반기까지 이어질 수 있다(iM증권). 중국 메모리 컨센서스 -13.1%가 선행 신호인지 확인해야 한다.\n   - **향후 이벤트:** 어드반테스트는 2027년 1월에 정량적 CY27 전망을 낸다. 마이크론 FQ1의 GM 저점 여부, ASML 4Q 실적 vs **€142~152억**도 체크포인트다.\n   - **데이터 한계**\n     - 에브넷은 데이터 중복이 의심돼 집계에서 제외했다.\n     - 르네사스 OPM은 데이터 오류로 제외했다.\n     - 한국은 6월 결산사(하나마이크론, 솔브레인 등)가 집계에서 빠졌다.\n     - 화홍반도체는 보고통화 변경으로 집계에서 빠졌다.\n\n### 국가별 한 줄 성적표\n\n| 국가 | 가장 강한 섹터(수치) | 가장 약한 섹터(수치) | 가이던스 톤 | 한 줄 코멘트 |\n|---|---|---|---|---|\n| 미국 | 메모리 YoY **+379.0%**, OPM **80.5%** (표본 2사) | IDM 컨센 QoQ **-2.1%** (인텔 CCPG -20% 이상) | 좋음 | 엔비디아 **$108B**, 마이크론 **$61.5B**로 사상 최대 가이드. IDM·소재만 컨센 역성장 |\n| 대만 | 메모리 YoY **+384.6%**, OPM **67.7%** / 파운드리 OPM **56.4%** | 후공정 장비 컨센 **-4.7%** (GMM -32.3%) | 좋음 | TSMC 4Q **+14%**, 미디어텍 **+25~32%** QoQ. 비AI 팹리스·웨이퍼는 소외 |\n| 한국 | 메모리 **$224.7B**, YoY **+171.3%**, OPM **63.6%** (표본 2사) | OSAT OPM **0.3%** / 팹리스 컨센 **-8.5%** | 좋음 | 메모리 출하 상향과 장비 컨센(전공정 +28.1%, 후공정 +18.3%)이 이끈다. 이익은 메모리에 극단적으로 쏠려 있다 |\n| 일본 | 후공정 장비 YoY **+61.6%**, OPM **50.7%** | 전력·화합물 YoY **+9.5%**, OPM **8.2%** | 혼조 | 연간 전망 상향이 잇따르지만 다음 분기 컨센은 대부분 **0~-3%**다(부품 -3.2%) |\n| 중국 | 광통신 YoY **+67.6%**, OPM **28.0%** | 메모리 컨센 **-13.1%** (표본 2사) | 혼조 | 장비 컨센 **+27.0%**와 SMIC +4~6% 가이드는 상향. 메모리·스토리지 팹리스는 피크아웃 |\n| 유럽 | 전공정 장비 YoY **+53.6%**, 컨센 **+23.5%** | 파운드리 YoY **-14.9%** (1사) / 소재 OPM **-13.5%** (1사) | 좋음 | ASML FY26 **€440~450억**, 인피니언 FY27 **+20% 초과**. BESI·노르딕은 단기 정체 |\n\n### 4Q26~1H27 섹터 선호도\n\n| 순위 | 국가·세그먼트 | 근거(실적·가이던스 수치) | 판단 |\n|---|---|---|---|\n| 1 | 한국·메모리 (표본 2사) | YoY **+171.3%**, OPM **63.6%**. 4Q DRAM 출하는 SK하이닉스 **+20% 중반**, 삼성 **+10% 중후반**. LTA 14곳, 2030년까지 공급 부족 전망 | 비중확대 |\n| 2 | 대만·파운드리 | YoY **+49.6%**, OPM **56.4%**. TSMC 4Q **$52.3~54.3B**(+14% QoQ), FY26 **+44%**, 2027 N2 캐파 2배 이상 | 비중확대 |\n| 3 | 미국·메모리 (표본 2사) | YoY **+379.0%**, OPM **80.5%**. 마이크론 FQ1 **$61.5B**, GM 86.25%, FY27 매 분기 순차 성장. 컨센 **+13.7%** | 비중확대 |\n| 4 | 유럽·전공정 장비 | YoY **+53.6%**, OPM **42.7%**. ASML 4Q **€142~152억**, ASM FY27 **€5.7B 초과**. 컨센 **+23.5%** | 비중확대 |\n| 5 | 미국·팹리스·IP | YoY **+75.3%**, OPM **52.9%**. 엔비디아 3Q **$108B**, 브로드컴 AI 4Q **$21.7B**(+236%). 컨센 **+14.2%** | 비중확대 |\n| 6 | 미국·전공정 장비 | YoY **+47.7%**, OPM **37.4%**. AMAT FQ1 **$11.1B**(+58% YoY), 2027 WFE **$200B 초과**. 컨센 **+7.4%** | 비중확대 |\n| 7 | 대만·패키지 기판 / 미·중 광통신 | 대만 기판은 QoQ **+26.2%**, 컨센 **+14.5%**, 젠딩 10월 **+26.3%**. 광통신은 중국 YoY **+67.6%**(OPM 28.0%), 미국 시에나 FY27 **+30% 이상**이고 컨센은 양국 **+9.4%** | 비중확대 |\n| 8 | 일본·후공정/전공정 장비 | 후공정 OPM **50.7%**, 어드반테스트 하반기 매출이 상반기 대비 **약 +28%**. TEL은 WFE **$210B 이상**. 다음 분기 컨센은 후공정 **-1.9%**, 전공정 **+0.1%** | 중립 (연간은 상향, 단기는 숨고르기) |\n| 9 | 미국·IDM / 한국·팹리스 | 미국 IDM 컨센 **-2.1%**. 인텔 GM **38%**, CCPG **-20% 이상**. 한국 팹리스 컨센 **-8.5%**(LX세미콘 -12.0%, OPM -4.6%) | 축소 |\n| 10 | 중국·메모리 (표본 2사) | YoY **+153.4%**, OPM **45.3%**로 정점권. 4Q 컨센 **-13.1%**(기가디바이스 -14.3%, 롱시스 -12.4%) | 축소 |"};

 const tc=getComputedStyle(document.documentElement).getPropertyValue('--ink').trim(), up=getComputedStyle(document.documentElement).getPropertyValue('--up').trim(), dn=getComputedStyle(document.documentElement).getPropertyValue('--dn').trim();

 const base={grid:{left:8,right:64,top:36,bottom:24,containLabel:true},tooltip:{trigger:'axis',axisPointer:{type:'shadow'},formatter:ps=>{const s=ps[0].name,e=D.cells[c+'|'+s];return `<b>${s}</b> (n=${e.n})<br>QoQ ${f1(e.qoq)} · YoY ${f1(e.yoy)}<br>OPM ${e.opm==null?'–':e.opm.toFixed(1)+'%'} (전년 ${e.opm1==null?'–':e.opm1.toFixed(1)+'%'})<br>컨센 QoQ ${f1(e.cons)}`;}},
  yAxis:{type:'category',data:segs,axisLabel:{color:tc,fontSize:11}},xAxis:{type:'value',axisLabel:{color:tc,formatter:v=>v+'%'},splitLine:{lineStyle:{opacity:.25}}},dataZoom:dz(),textStyle:{color:tc},toolbox:{right:10,feature:{dataZoom:{yAxisIndex:'none'},restore:{}}}};
 chA.setOption(Object.assign({},base,{title:{text:'3Q 매출 성장률 (YoY 진한색 · QoQ 연한색)',textStyle:{fontSize:13,color:tc}},legend:{show:false},series:[bar('qoq','QoQ'),bar('yoy','YoY')]}),true);
 chB.setOption(Object.assign({},base,{title:{text:'영업이익률 (전년 동기 → 최근)',textStyle:{fontSize:13,color:tc}},legend:{top:18,right:70,textStyle:{color:tc,fontSize:11}},grid:{left:8,right:64,top:46,bottom:24,containLabel:true},
  series:[{name:'전년 동기',type:'bar',data:segs.map(s=>D.cells[c+'|'+s].opm1),itemStyle:{color:'#9ca3af'}},{name:'최근 분기',type:'bar',data:segs.map(s=>D.cells[c+'|'+s].opm),itemStyle:{color:getComputedStyle(document.documentElement).getPropertyValue('--acc').trim()},label:{show:true,position:'right',fontSize:10,color:tc,formatter:p=>p.value==null?'':p.value.toFixed(1)+'%'}}]}),true);
 const tj=D.ctry[c].tone;
 $('segs').innerHTML=`<div class="sg" style="grid-column:1/-1"><b class="t">${D.ctry[c].flag} ${tj.summary}</b><br>👍 가이던스 좋음: ${tj.best.join(', ')} · 👎 나쁨: ${tj.worst.join(', ')}</div>`+
  tj.segments.slice().sort((a,b)=>b.tone-a.tone).map(s=>{const t=TONE[s.tone];return `<div class="sg"><b class="t">${s.seg}</b><span class="tone ${t[1]}">${t[0]}</span><br>📊 ${s.growth}<br>🧭 ${s.guide}</div>`;}).join('');
 $('cmd').innerHTML='<details><summary style="cursor:pointer;font-weight:700">'+D.ctry[c].name+' 상세 분석 전문 펼치기</summary>'+md(D.ctry[c].md)+'</details>';}
country(cur);
addEventListener('resize',()=>{chA.resize();chB.resize();});
// 기업 테이블 (정렬: 1클릭 내림차순 → 2클릭 오름차순 → 3클릭 원상태)
const COLS=[['n','기업'],['c','국가'],['s','밸류체인'],['l','결산'],['rev','매출($M)'],['qoq','QoQ'],['yoy','YoY'],['opm','OPM'],['cons','컨센 QoQ'],['note','비고']];
let sk=null,sd=0;
C.forEach(c=>$('fC').insertAdjacentHTML('beforeend',`<option value="${c}">${D.ctry[c].name}</option>`));
D.segs.forEach(s=>$('fS').insertAdjacentHTML('beforeend',`<option>${s}</option>`));
function tbl(){
 $('ct').querySelector('thead').innerHTML='<tr>'+COLS.map(([k,l])=>`<th onclick="srt('${k}')">${l}<span class="ar">${sk===k?(sd===1?'▼':'▲'):'↕'}</span></th>`).join('')+'</tr>';
 const fc=$('fC').value,fs=$('fS').value,q=$('fQ').value.trim();
 let r=D.comps.filter(x=>(!fc||x.c===fc)&&(!fs||x.s===fs)&&(!q||x.n.includes(q)||x.t.toLowerCase().includes(q.toLowerCase())));
 if(sk&&sd){r=r.slice().sort((a,b)=>{const x=a[sk],y=b[sk];if(x==null)return 1;if(y==null)return -1;return (typeof x==='string'?x.localeCompare(y):x-y)*(sd===1?-1:1);});}
 else r=r.slice().sort((a,b)=>b.rev-a.rev);
 $('ct').querySelector('tbody').innerHTML=r.map(x=>`<tr><td>${x.n} <span class="note">${x.t}</span></td><td>${D.ctry[x.c].name}</td><td>${x.s}</td><td>${x.l}</td><td>${x.rev.toLocaleString()}</td><td class="${cls(x.qoq)}">${f1(x.qoq)}</td><td class="${cls(x.yoy)}">${f1(x.yoy)}</td><td>${x.opm==null?'–':x.opm.toFixed(1)+'%'}</td><td class="${cls(x.cons)}">${f1(x.cons)}</td><td>${x.note}</td></tr>`).join('');}
function srt(k){if(sk!==k){sk=k;sd=1;}else{sd=sd===1?-1:0;if(!sd)sk=null;}tbl();}
['fC','fS','fQ'].forEach(i=>$(i).addEventListener('input',tbl));tbl();
$('meth').innerHTML=md(`## 데이터와 방법
- **대상**: 글로벌 반도체 밸류체인 520개사(미국 83·대만 94·한국 141·일본 91·중국 79·유럽 32). 분류는 밸류체인 맵 기준 14개 세그먼트.
- **실적**: FMP·네이버 분기 재무, 해외 IR 자료 추출치, 한국 DART 정기보고서(당일 제출분 포함), 대만은 월매출 3개월 합으로 3Q 매출 보충(영업이익 없음).
- **집계**: 최근 분기 결산이 2026년 7~10월인 기업만, 동일 기업의 전 분기·전년 동기와 비교해 USD 환산 합산. 대형사 비중이 커서 기업 중앙값을 함께 표기.
- **가이던스**: 어닝콜 정리 노트·IR 자료 전망 문장·국내 증권사 리포트와 다음 분기 애널리스트 컨센서스. 톤은 다음 분기·연간 전망 기준 5단계.
- **한계**: 한국은 3Q 보고서 제출 마감(11/16) 전이라 141사 중 ${D.cov.KR[0]}사만 3Q 반영(삼성전자·SK하이닉스 포함). 화홍(보고통화 변경)·윙텍(사업 매각)·에브넷(데이터 중복 의심)은 집계 제외, 반기 보고 유럽 부품사는 QoQ 제외. 메모리는 표본 1~2사인 국가가 많음.`);
</script></body></html>
