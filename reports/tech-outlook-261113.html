*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif}

h2{font-size:20px;margin:0 0 12px}h3{font-size:17px;margin:22px 0 10px}h4{font-size:15.5px;margin:18px 0 6px}
.md blockquote{margin:0 0 14px;padding:12px 16px;border-left:4px solid var(--acc);background:var(--chip);border-radius:8px;font-size:16px}

.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 14px}.tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;font-size:13.5px;cursor:pointer}
.tabs button.on{background:var(--acc);border-color:var(--acc);color:#fff}

.lg{font-size:12px;color:var(--mut);margin-top:8px}
.det{margin-top:12px;padding:14px 16px;border-radius:12px;background:var(--chip);font-size:13.5px;display:none}

.tone{display:inline-block;border-radius:999px;padding:1px 9px;font-size:11.5px;font-weight:700;margin-left:6px;color:#fff}
.t2{background:#b91c1c}.t1{background:#ef4444}.t0{background:#9ca3af}.tm1{background:#3b82f6}.tm2{background:#1d4ed8}

.tbl td:first-child,.tbl th:first-child,.tbl td:nth-child(2),.tbl th:nth-child(2),.tbl td:nth-child(3),.tbl th:nth-child(3){text-align:left}
.tbl td:last-child,.tbl th:last-child{padding-right:26px;text-align:left;white-space:normal;min-width:180px;color:var(--mut);font-size:12px}
.tbl th{position:sticky;top:0;background:var(--card);cursor:pointer;user-select:none;z-index:1}
.tbl th .ar{font-size:.85em;color:var(--mut);margin-left:3px}
.flt{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}.flt select,.flt input{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 10px;font-size:13px}
.note{font-size:12.5px;color:var(--mut)}
@media (max-width:760px){.grid2{grid-template-columns:1fr}.hero h1{font-size:21px}.card{padding:16px 14px}.ch{height:360px}}

<script>
const D={"segs": ["메모리", "파운드리", "팹리스·IP", "전공정 장비", "후공정 장비", "OSAT·테스트", "패키지 기판", "소재", "부품", "클린룸·팹 인프라", "광통신", "IDM(로직·아날로그)", "전력·화합물 반도체", "유통"], "ctry": {"US": {"name": "미국", "flag": "🇺🇸", "tone": {"summary": "AI 수요로 전 밸류체인 성장: 메모리 YoY +379%, 팹리스 +75%. 가이던스는 대체로 상향", "segments": [{"seg": "팹리스·IP", "tone": 2, "growth": "매출 $163.6B, QoQ +18.9%, YoY +75.3%, 영업이익률 52.9%(전년 42.8%)", "guide": "엔비디아 3Q 매출 $108B ±2%, FY28 매출 +70% 전망. 브로드컴 4Q 매출 $34.8B(+93% YoY), AI 매출 $21.7B(+236%). 다음 분기 컨센서스 QoQ +14.2%", "quote": {"text": "We expect to grow revenue by approximately 70% in fiscal 2028.", "ko": "2028 회계연도 매출은 약 70% 성장할 것으로 예상합니다.", "by": "Colette Kress, 엔비디아", "src": "어닝콜 2026-08-26 (FY2027 Q2)"}}, {"seg": "메모리", "tone": 2, "growth": "매출 $65.3B, QoQ +29.4%, YoY +379.0%, 영업이익률 80.5%(전년 28.1%). 표본 2사", "guide": "마이크론 FQ1 매출 $61.5B ±$1.5B, GM 약 86.25%. 샌디스크 FQ2 매출 $12.2~12.6B, GPM 84.5~85.5%. 컨센서스 QoQ +13.7%", "quote": {"text": "We do expect conditions to be tight on NAND overall even as the industry is expected to grow in the mid-20% range in calendar '27 and '28.", "ko": "업계가 2027·2028년에 20%대 중반 성장할 것으로 예상되는 가운데서도 NAND 수급 전반은 타이트할 것으로 예상합니다.", "by": "Manish Bhatia, 마이크론", "src": "어닝콜 2026-09-30 (FY2026 Q4)"}}, {"seg": "IDM(로직·아날로그)", "tone": 0, "growth": "매출 $28.2B, QoQ +5.7%, YoY +25.9%, 영업이익률 26.5%(전년 14.5%)", "guide": "인텔 4Q 매출 $15.0~16.0B, GM 38%(Fab 28 사고로 -$3억 반영). TI 4Q $5.8~6.3B(계절성 대비 강한 보합). ADI Q4 $4.3B ±$0.1B. 컨센서스 QoQ -2.1%", "quote": {"text": "Turning to our outlook for the fourth quarter, we expect TI's revenue in the range of $5.8 billion to $6.3 billion and earnings per share to be in the range of $2.45 to $2.79.", "ko": "4분기 전망으로, TI 매출은 58억~63억 달러, EPS는 2.45~2.79달러 범위를 예상합니다.", "by": "Julie C. Knecht, 텍사스 인스트루먼트", "src": "어닝콜 2026-10-21 (FY2026 Q3)"}}, {"seg": "전공정 장비", "tone": 2, "growth": "매출 $24.4B, QoQ +16.8%, YoY +47.7%, 영업이익률 37.4%(전년 30.6%)", "guide": "AMAT FQ1 매출 $11.1B ±$0.5B(+58% YoY). 램리서치 12월 분기 $8.6B ±$0.4B. KLA 12월 분기 $4.7B ±$0.2B. WFE 2026년 $150B 중반, 2027년 $200B 초과 전망. 컨센서스 QoQ +7.4%", "quote": {"text": "For calendar year 2026, we expect WFE in the mid $150 billion range.", "ko": "2026년 WFE는 1,500억 달러 중반대로 예상합니다.", "by": "Tim Archer, 램리서치", "src": "어닝콜 2026-10-21 (FY2027 Q1)"}}, {"seg": "광통신", "tone": 2, "growth": "매출 $14.6B, QoQ +11.3%, YoY +40.3%, 영업이익률 18.3%(전년 11.5%)", "guide": "코닝 4Q 매출 $5.2~5.3B(+약 19% YoY). 시에나 Q4 $1.75B ±$50M, 연말 백로그 $10B+, FY27 매출 최소 +30%. 패브리넷 Q2 $1.6~1.65B. 컨센서스 QoQ +9.4%", "quote": {"text": "We expect to double our sales from 20 billion to $40 billion by the end of 2030, to grow EPS much faster than sales and to improve our financial profile even further.", "ko": "2030년 말까지 매출을 200억 달러에서 400억 달러로 두 배로 늘리고, EPS는 매출보다 훨씬 빠르게 성장시키며, 재무 구조를 더 개선할 것으로 예상합니다.", "by": "Edward A. Schlesinger, 코닝", "src": "어닝콜 2026-10-27 (FY2026 Q3)"}}, {"seg": "유통", "tone": 1, "growth": "매출 $10.7B, QoQ +7.3%, YoY +39.0%, 영업이익률 4.0%(전년 2.3%). 표본 1사(애로우), 에브넷은 데이터 중복 의심으로 집계 제외", "guide": "애로우 4Q 매출 $11.55~12.15B(중간값 +36% YoY), GC 중간값 +5% QoQ. 컨센서스 QoQ -0.4%", "quote": {"text": "We expect sales for the fourth quarter to be between $11.55 billion and $12.15 billion, representing an increase of 36% year-over-year at the midpoint of the range.", "ko": "4분기 매출은 115.5억~121.5억 달러로, 범위 중간값 기준 전년 대비 36% 증가를 예상합니다.", "by": "Rajesh Agrawal, 애로우 일렉트로닉스", "src": "어닝콜 2026-11-05 (FY2026 Q3)"}}, {"seg": "전력·화합물 반도체", "tone": 1, "growth": "매출 $3.8B, QoQ +9.3%, YoY +15.5%, 영업이익률 11.6%(전년 4.1%)", "guide": "온세미 4Q $1.715~1.815B(중간값 +2.5% QoQ). 다이오드 4Q 약 $550M ±3%(+40.4% YoY). 비샤이 4Q $990M ±$15M, GM 26.0%. 컨센서스 QoQ +1.1%", "quote": {"text": "With a strong backlog and demand pipeline, we are guiding more than 3% quarter over quarter growth compared to our usual 5% to 6% down.", "ko": "백로그와 수요 파이프라인이 탄탄해, 통상 5~6% 감소하는 시기임에도 전분기 대비 3% 이상 성장을 가이던스로 제시합니다.", "by": "Emily Yang, 다이오드", "src": "어닝콜 2026-11-05 (FY2026 Q3)"}}, {"seg": "소재", "tone": 1, "growth": "매출 $3.8B, QoQ +7.8%, YoY +27.9%, 영업이익률 19.2%(전년 18.5%)", "guide": "큐니티 FY26 매출 $5.77~5.83B로 상향(4Q 약 +26% YoY). 엔테그리스 Q4 $1.025~1.055B, GM 49.2~49.7%. 컨센서스 QoQ -1.9%", "quote": {"text": "We are raising our full year revenue expectations by $200 million and adjusted EPS by $0.50 at the midpoint.", "ko": "중간값 기준 연간 매출 전망을 2억 달러, 조정 EPS 전망을 0.50달러 상향합니다.", "by": "Ken Rizvi, 큐니티", "src": "어닝콜 2026-11-04 (FY2026 Q3)"}}, {"seg": "부품", "tone": 1, "growth": "매출 $3.5B, QoQ +15.2%, YoY +44.7%, 영업이익률 18.0%(전년 8.2%)", "guide": "울트라 클린 Q4 $800~860M(중간값 +9.4% QoQ). 어드밴스드 에너지 Q4 $735M ±$25M, 2027년 매출 약 +30%. 이코르 Q4 $345~365M. 컨센서스 QoQ +4.1%", "quote": {"text": "Based on the visibility our customers are sharing with us, we now expect 2027 wafer fab equipment spending to be above $200 billion.", "ko": "고객들이 공유하는 가시성을 바탕으로, 2027년 WFE 지출은 2,000억 달러를 넘을 것으로 예상합니다.", "by": "James Xiao, 울트라 클린", "src": "어닝콜 2026-10-27 (FY2026 Q3)"}}, {"seg": "파운드리", "tone": 1, "growth": "매출 $2.4B, QoQ +8.0%, YoY +16.4%, 영업이익률 14.7%(전년 11.8%). 표본 2사", "guide": "타워 4Q 매출 중간값 $600M, 2026년 연 $2.0B, 2027년 혼합 가격 +20%. 글로벌파운드리스는 4Q 가이던스 수치 미확인(컨센서스 +5.5%). 세그먼트 컨센서스 QoQ +7.4%", "quote": {"text": "Our fourth quarter 2026 mid-range revenue guidance is $600 million, which achievement would result in a 2026 full year revenue of $2 billion against a full year 2025 revenue of $1.57 billion.", "ko": "2026년 4분기 매출 가이던스 중간값은 6억 달러입니다. 달성하면 2026년 연간 매출은 20억 달러가 되며, 2025년 연간 매출은 15.7억 달러였습니다.", "by": "Russell Ellwanger, 타워 세미컨덕터", "src": "어닝콜 2026-11-02 (FY2026 Q3)"}}, {"seg": "OSAT·테스트", "tone": 0, "growth": "매출 $2.0B, QoQ +4.9%, YoY +0.2%, 영업이익률 11.3%(전년 8.0%). 표본 1사", "guide": "앰코 4Q 매출 $1.9~2.0B, GM 18~19%, 컴퓨팅 YoY +50% 이상. 컨센서스 QoQ -0.3%", "quote": {"text": "Q4 revenue is expected to be between $1.9 billion and $2 billion.", "ko": "4분기 매출은 19억~20억 달러로 예상됩니다.", "by": "Megan Faust, 앰코", "src": "어닝콜 2026-10-26 (FY2026 Q3)"}}, {"seg": "후공정 장비", "tone": 1, "growth": "매출 $1.8B, QoQ +5.9%, YoY +74.7%, 영업이익률 26.5%(전년 11.9%)", "guide": "테라다인 4Q $1.25~1.35B(YoY 약 +20%), 2027년 1분기도 4분기 대비 성장. 코후 Q4 약 $178M, 2027년 +30~40%. 에어 테스트 FY27 매출 $150M으로 상향. 컨센서스 QoQ +3.3%", "quote": {"text": "For 2027, we expect revenue growth of approximately 30% to 40%, driven primarily by conversion of our high-performance computing opportunity funnel.", "ko": "2027년 매출은 주로 HPC 기회 파이프라인의 전환에 힘입어 약 30~40% 성장할 것으로 예상합니다.", "by": "Luis Müller, 코후", "src": "어닝콜 2026-10-28 (FY2026 Q3)"}}], "best": ["메모리", "팹리스·IP", "전공정 장비"], "worst": ["IDM(로직·아날로그)", "OSAT·테스트", "전력·화합물 반도체"]}, "md": "## 미국\n\n### 한눈에\n- **AI 연산·메모리 쪽 성장이 가장 강함.** 메모리 매출은 **YoY +379.0%**, 영업이익률 **80.5%**(전년 28.1%)이고, 팹리스·IP는 매출 **$163.6B**, **YoY +75.3%**, 영업이익률 **52.9%**입니다.\n- **장비 체인도 강함.** 전공정 장비 **YoY +47.7%**, 후공정 장비 **+74.7%**, 부품 **+44.7%**입니다. 램리서치와 KLA는 WFE를 **2026년 $150B 중반, 2027년 $200B 초과**로 전망했습니다.\n- **상대적으로 약한 곳.** OSAT(앰코) **YoY +0.2%**, 전력·화합물 **+15.5%**(울프스피드 -21%), 파운드리 **+16.4%**입니다. 퀄컴(-8%)과 스카이웍스(-5%)는 역성장했습니다.\n- **가이던스는 대체로 상향.** 엔비디아는 3Q **$108B**와 FY28 **+70%**, 브로드컴은 4Q AI 매출 **$21.7B(+236%)**, 마이크론은 FQ1 **$61.5B**를 제시했습니다. 반면 IDM은 컨센서스 QoQ **-2.1%**로 인텔 PC 재고조정 영향을 받고 있습니다.\n- **공통 변수는 메모리 가격 급등과 공급 제약.** 메모리 업체 이익은 극대화됐지만, PC·모바일과 일부 고객사 마진(엔비디아 GM 하향, 퀄컴)에는 부담입니다.\n\n### 밸류체인별 실적과 가이던스\n\n#### 팹리스·IP — 실적 🟢🟢 · 가이던스 🟢강한 상향\n- **실적**: QoQ **+18.9%**, YoY **+75.3%**(기업 중앙값 +36.5%), 영업이익률 **52.9%**(전년 42.8%). 엔비디아는 매출 **$96.2B**(YoY +105.9%, OPM 66.2%)이고 데이터센터가 **$89B**입니다. 브로드컴은 **$29.6B**(YoY +85.5%), 이 중 AI 반도체가 **$167억**입니다. AMD는 **$13.4B**(YoY +44.7%)입니다. 반면 퀄컴은 **$10.3B**(YoY **-8.4%**)입니다.\n- **가이던스·전망**\n  - 엔비디아: 3Q 매출 **$108B ±2%**, GM **74% ±50bp**, 이후 Q4에 **71~72%**로 바닥을 찍을 전망입니다. FY28 매출은 **약 +70%**로 제시했는데, 공급 제약을 반영한 수치이고 수요 기준으로는 약 2배라고 했습니다.\n  - 브로드컴: 4Q 매출 **$34.8B(+93% YoY)**, AI 매출 FY26 **$58B**, FY27 약 **$115B**, FY28 약 **$230B**를 제시했습니다.\n  - AMD: 2027년 서버 매출 **2배**를 전망했습니다.\n  - 마벨: Q3 매출 **$3.15B ±5%**를 가이던스로 냈습니다.\n  - 퀄컴: 12월 분기 데이터센터 매출이 **$650M를 넘을** 것으로 봤습니다.\n  - 컨센서스: 다음 분기 QoQ **+14.2%**(26사).\n- **해석**: 하이퍼스케일러 CapEx(2026년 약 **$8,000억** → 2027년 **$1.3조**)와 네오클라우드·소버린 AI가 가속기·ASIC 수요를 이끌고 있습니다. 모바일 비중이 높은 업체만 메모리발 수요 둔화로 뒤처졌습니다.\n> 💬 \"We expect to grow revenue by approximately 70% in fiscal 2028.\" — Colette Kress, 엔비디아 (어닝콜 2026-08-26)\n> → 2028 회계연도 매출은 약 70% 성장할 것으로 예상합니다.\n\n> 💬 \"And together, we expect these deployments to drive our Q4 AI revenue to $21.7 billion, which is up 236% year-on-year.\" — Hock Tan, 브로드컴 (어닝콜 2026-09-02)\n> → 이 배치들을 합쳐 4분기 AI 매출은 전년 대비 236% 증가한 217억 달러가 될 것으로 예상합니다.\n\n#### 메모리 — 실적 🟢🟢 · 가이던스 🟢강한 상향\n- **실적**(표본 소수, 2사): QoQ **+29.4%**, YoY **+379.0%**, 영업이익률 **80.5%**(전년 28.1%).\n  - 마이크론: FQ4 매출 **$54.2B**(YoY +379.3%, OPM 80.7%), GM **87%**. DRAM은 **$39.8B**, NAND는 **$14.1B**입니다.\n  - 샌디스크: FQ1 매출 **$11.0B**(YoY +377.9%), Non-GAAP GPM **85.1%**, 데이터센터 매출 **$48억(QoQ +61%)**.\n- **가이던스·전망**\n  - 마이크론: FQ1 매출 **$61.5B ±$1.5B**, GM **약 86.25%**, EPS **$38.15 ±$1**. FY27에는 매 분기 매출이 순차 성장할 것으로 봤습니다.\n  - 샌디스크: FQ2 매출 **$12.2~12.6B**, GPM **84.5~85.5%**. NBM 계약이 FY27 비트의 **약 50%**를 덮고 있습니다.\n  - 컨센서스: QoQ **+13.7%**.\n- **해석**: HBM, 데이터센터 SSD, KV 캐시 수요가 공급을 앞서고 있습니다. 회사는 CY27·28에 수급이 **2026년보다 더 타이트**해질 것으로 봤습니다.\n> 💬 \"We do expect conditions to be tight on NAND overall even as the industry is expected to grow in the mid-20% range in calendar '27 and '28.\" — Manish Bhatia, 마이크론 (어닝콜 2026-09-30)\n> → 업계가 2027·2028년에 20%대 중반 성장할 것으로 예상되는 가운데서도 NAND 수급 전반은 타이트할 것으로 예상합니다.\n\n#### IDM(로직·아날로그) — 실적 🟢 · 가이던스 🟡중립\n- **실적**: QoQ **+5.7%**, YoY **+25.9%**, 영업이익률 **26.5%**(전년 14.5%).\n  - 인텔: 매출 **$16.5B**(YoY +20.9%), DCAI **$73억(YoY 약 +80%)**, 반면 CCPG는 **QoQ -9%**.\n  - TI: **$6.06B**(YoY +27.7%, OPM 47.5%), 데이터센터 YoY **+95%**.\n  - ADI: **$4.02B**(YoY +39.6%).\n  - 마이크로칩: **$1.62B**(YoY +42.2%).\n- **가이던스·전망**\n  - 인텔: 4Q 매출 **$15.0~16.0B**, GM **38%**. Fab 28 사고 영향(매출 -$3억)이 반영됐고, CCPG는 **QoQ -20% 이상**으로 봤습니다.\n  - TI: 4Q **$5.8~6.3B**로, 통상 계절성(감소)보다 강한 보합입니다.\n  - ADI: Q4 **$4.3B ±$0.1B**, OPM **52%**.\n  - 마이크로칩: 9월 분기에 일회성 매출 약 **$53M**이 있었고 12월 분기에는 반복되지 않는다고 밝혔습니다.\n  - 컨센서스: QoQ **-2.1%**.\n- **해석**: 아날로그는 산업·데이터센터 회복과 가격 인상으로 강합니다. 인텔 클라이언트 재고조정(PC TAM 2026년 **-12%**)과 일회성 효과 소멸이 다음 분기 숫자를 누릅니다.\n> 💬 \"Turning to our outlook for the fourth quarter, we expect TI's revenue in the range of $5.8 billion to $6.3 billion and earnings per share to be in the range of $2.45 to $2.79.\" — Julie C. Knecht, 텍사스 인스트루먼트 (어닝콜 2026-10-21)\n> → 4분기 전망으로, TI 매출은 58억~63억 달러, EPS는 2.45~2.79달러 범위를 예상합니다.\n\n> 💬 \"Based on our current outlook, DCAI revenue is on track to finish 2026 nearly $10 billion above expectations entering the year.\" — David Zinsner, 인텔 (어닝콜 2026-10-29)\n> → 현재 전망으로는 DCAI 매출이 연초 예상보다 100억 달러 가까이 많은 수준으로 2026년을 마칠 것으로 보입니다.\n\n#### 전공정 장비 — 실적 🟢 · 가이던스 🟢강한 상향\n- **실적**: QoQ **+16.8%**, YoY **+47.7%**, 영업이익률 **37.4%**(전년 30.6%).\n  - AMAT: **$10.4B**(YoY +53.1%), non-GAAP OPM **35.3%**.\n  - 램리서치: **$8.22B**(YoY +54.4%), OPM **40.2%**로 사상 처음 40%를 넘었습니다.\n  - KLA: **$4.14B**(YoY +28.9%).\n  - 온투: **$410M**(YoY +87.8%).\n- **가이던스·전망**\n  - AMAT: FQ1(14주) 매출 **$111억 ± $5억(YoY +58%)**, 2027년 WFE **+30% 이상**.\n  - 램리서치: 12월 분기 **$8.6B ±$0.4B**, GM **52.5%**.\n  - KLA: 12월 분기 **$4.7B ±$0.2B**.\n  - 온투: Q4 **$430~450M**, 백로그 **$1.3B+**.\n  - WFE: **2026년 $150B 중반 → 2027년 $200B 초과**.\n  - 컨센서스: QoQ **+7.4%**.\n- **해석**: DRAM·HBM, 선단 로직, 어드밴스드 패키징 투자가 동시에 늘고 있습니다. 병목은 수요가 아니라 클린룸과 부품 공급입니다. 램리서치는 12월 분기 중국 비중의 큰 폭 하락을 예고했습니다.\n> 💬 \"For calendar year 2026, we expect WFE in the mid $150 billion range.\" — Tim Archer, 램리서치 (어닝콜 2026-10-21)\n> → 2026년 WFE는 1,500억 달러 중반대로 예상합니다.\n\n> 💬 \"Revenue was another record at $4.14 billion This, coupled with our December quarter revenue guidance of approximately $4.7 billion demonstrates the growth acceleration we plan for the second half of 26.\" — Richard Wallace, KLA (어닝콜 2026-10-28)\n> → 매출은 또다시 사상 최대인 41.4억 달러였습니다. 12월 분기 매출 가이던스 약 47억 달러와 함께 보면, 2026년 하반기에 계획한 성장 가속이 확인됩니다.\n\n#### 광통신 — 실적 🟢 · 가이던스 🟢강한 상향\n- **실적**: QoQ **+11.3%**, YoY **+40.3%**(중앙값 +50.3%), 영업이익률 **18.3%**(전년 11.5%).\n  - 코닝: **$4.86B**(YoY +18.4%). 광통신 부문은 **+44%**입니다.\n  - 코히런트: **$2.37B**(YoY +49.9%).\n  - 루멘텀: **$1.26B**(YoY **+136.5%**).\n  - AXT: **$73M**(YoY +162.6%).\n- **가이던스·전망**\n  - 코닝: 4Q **$5.2~5.3B(+약 19% YoY)**.\n  - 시에나: Q4 **$1.75B ±$50M**, 연말 백로그 **$10B 이상**, FY27 매출 **최소 +30%($8.3~8.4B)**.\n  - 패브리넷: Q2 **$1.6~1.65B**.\n  - AXT: Q4 **약 $90M**.\n  - 루멘텀: 컨센서스 QoQ **+24.4%**.\n  - 세그먼트 컨센서스: QoQ **+9.4%**.\n- **해석**: 800G에서 1.6T로의 전환, OCS·CPO 램프, AI WAN(DCI) 수요가 동시에 몰리고 있습니다. 엔라이트(**+11%**)처럼 데이터센터 노출이 낮은 곳만 상대적으로 약합니다.\n> 💬 \"We expect to double our sales from 20 billion to $40 billion by the end of 2030, to grow EPS much faster than sales and to improve our financial profile even further.\" — Edward A. Schlesinger, 코닝 (어닝콜 2026-10-27)\n> → 2030년 말까지 매출을 200억 달러에서 400억 달러로 두 배로 늘리고, EPS는 매출보다 훨씬 빠르게 성장시키며, 재무 구조를 더 개선할 것으로 예상합니다.\n\n> 💬 \"…we exited Q3 with an $800 million increase in backlog, to $8.5 billion Orders continue to accelerate … and expect to end the year with more than $10 billion in backlog.\" — Marc D. Graff, 시에나 (어닝콜 2026-09-03)\n> → 3분기 말 백로그는 8억 달러 늘어 85억 달러가 됐고, 수주가 계속 가속돼 연말 백로그는 100억 달러를 넘을 것으로 예상합니다.\n\n#### 유통 — 실적 🟢 · 가이던스 🟢상향\n- **실적**(표본 소수, 1사 — 애로우): QoQ **+7.3%**, YoY **+39.0%**, 영업이익률 **4.0%**(전년 2.3%). GC 매출은 **$7.9B**(QoQ +8%), ECS는 **$2.8B**(YoY +29%)입니다. 에브넷은 최근 분기 매출이 애로우와 똑같이 수집돼 데이터 중복이 의심되므로 집계에서 뺐습니다.\n- **가이던스·전망**\n  - 애로우: 4Q 매출 **$11.55~12.15B(중간값 +36% YoY)**, GC 중간값 **+5% QoQ**. 백로그는 2027년 중반까지 쌓여 있습니다.\n  - 에브넷: 2Q FY27 중간값 **+5% QoQ**(1분기 추가 1주를 조정하면 +12%).\n  - 컨센서스: QoQ **-0.4%**로, 회사 가이던스보다 보수적입니다.\n- **해석**: 성장분의 일부는 메모리 가격 효과입니다(에브넷 기준 약 1/3). 그래도 B/B가 1을 넘고 백로그가 늘어나 가시성은 좋아졌습니다.\n> 💬 \"We expect sales for the fourth quarter to be between $11.55 billion and $12.15 billion, representing an increase of 36% year-over-year at the midpoint of the range.\" — Rajesh Agrawal, 애로우 일렉트로닉스 (어닝콜 2026-11-05)\n> → 4분기 매출은 115.5억~121.5억 달러로, 범위 중간값 기준 전년 대비 36% 증가를 예상합니다.\n\n#### 전력·화합물 반도체 — 실적 🟢 · 가이던스 🟢상향\n- **실적**: QoQ **+9.3%**, YoY **+15.5%**, 영업이익률 **11.6%**(전년 4.1%).\n  - 온세미: **$1.72B**(YoY +11.1%). AI 데이터센터 매출은 **$1.8억(YoY +175%)**입니다.\n  - 비샤이: **$979M**(YoY +23.8%).\n  - 다이오드: **$533M**(YoY +35.8%).\n  - 울프스피드: **$155M**(YoY **-21.2%**, OPM -72.8%).\n- **가이던스·전망**\n  - 온세미: 4Q **$1.715~1.815B**(중간값 +2.5% QoQ, 계절성 상회). 자동차는 한 자릿수 후반 감소, AI 데이터센터는 2027년 **2배**로 봤습니다.\n  - 다이오드: 4Q **약 $550M ±3%(+40.4% YoY)**, GM **37%**.\n  - 비샤이: 4Q **$990M ±$15M**, GM **26.0%**.\n  - 알레그로: FQ3 **$278~288M**.\n  - 컨센서스: QoQ **+1.1%**.\n- **해석**: AI 데이터센터 전원과 산업 회복 덕에 계절적 비수기에도 성장 가이던스가 나왔습니다. 다만 울프스피드 적자와 자동차 정체로 섹터 성장률은 낮은 편입니다.\n> 💬 \"With a strong backlog and demand pipeline, we are guiding more than 3% quarter over quarter growth compared to our usual 5% to 6% down.\" — Emily Yang, 다이오드 (어닝콜 2026-11-05)\n> → 백로그와 수요 파이프라인이 탄탄해, 통상 5~6% 감소하는 시기임에도 전분기 대비 3% 이상 성장을 가이던스로 제시합니다.\n\n> 💬 \"For 2027, we still expect our AI data center revenue to double over 2026 as we continue to ship with new product ramps.\" — Hassane El-Khoury, 온세미 (어닝콜 2026-11-02)\n> → 신제품 램프가 이어지면서 2027년 AI 데이터센터 매출은 여전히 2026년 대비 두 배가 될 것으로 예상합니다.\n\n#### 소재 — 실적 🟢 · 가이던스 🟢상향\n- **실적**: QoQ **+7.8%**, YoY **+27.9%**, 영업이익률 **19.2%**(전년 18.5%).\n  - 큐니티: **$1.56B**(YoY +21.9%).\n  - 엔테그리스: **$1.01B**(YoY +24.6%), 조정 GM 약 **49%**.\n  - 엘리먼트 솔루션즈: **$995M**(YoY +51.7%).\n  - 포트로닉스: **$216M**(YoY +2.7%).\n- **가이던스·전망**\n  - 큐니티: FY26 매출 **$5.77~5.83B**로 **$2억 상향**, 4Q 약 **+26% YoY**.\n  - 엔테그리스: Q4 **$1.025~1.055B**, GM **49.2~49.7%**.\n  - ESI: 연간 EBITDA **약 $720M**으로 상향.\n  - 포트로닉스: FQ4 **$207~227M**.\n  - 컨센서스: QoQ **-1.9%**.\n- **해석**: 선단 노드, HBM, PCB 물량(2026년 성장률 **10%+**)이 수요를 받치고 있습니다. 컨센서스는 계절성 때문에 소폭 감소를 반영하고 있습니다.\n> 💬 \"We are raising our full year revenue expectations by $200 million and adjusted EPS by $0.50 at the midpoint.\" — Ken Rizvi, 큐니티 (어닝콜 2026-11-04)\n> → 중간값 기준 연간 매출 전망을 2억 달러, 조정 EPS 전망을 0.50달러 상향합니다.\n\n#### 부품 — 실적 🟢 · 가이던스 🟢상향\n- **실적**: QoQ **+15.2%**, YoY **+44.7%**, 영업이익률 **18.0%**(전년 8.2%).\n  - MKS: **$1.41B**(YoY +43.0%).\n  - 울트라 클린: **$759M**(YoY +48.8%).\n  - 어드밴스드 에너지: **$696M**(YoY +50.3%).\n  - 폼팩터: **$281M**(YoY +38.4%).\n- **가이던스·전망**\n  - 울트라 클린: Q4 **$800~860M(중간값 +9.4% QoQ)**.\n  - 어드밴스드 에너지: Q4 **$735M ±$25M**, 2026년 약 **+40%**, 2027년 약 **+30%**.\n  - 이코르: Q4 **$345~365M(+8% QoQ)**.\n  - 폼팩터: Q4 **약 $285M**.\n  - 컨센서스: QoQ **+4.1%**.\n- **해석**: 장비 증산의 직접 수혜를 받고 있고, 데이터센터 전원도 함께 성장합니다. MFC 등 부품 부족은 1~2개 분기 더 이어질 전망입니다.\n> 💬 \"Based on the visibility our customers are sharing with us, we now expect 2027 wafer fab equipment spending to be above $200 billion.\" — James Xiao, 울트라 클린 (어닝콜 2026-10-27)\n> → 고객들이 공유하는 가시성을 바탕으로, 2027년 WFE 지출은 2,000억 달러를 넘을 것으로 예상합니다.\n\n#### 파운드리 — 실적 🟢 · 가이던스 🟢상향\n- **실적**(표본 소수, 2사): QoQ **+8.0%**, YoY **+16.4%**, 영업이익률 **14.7%**(전년 11.8%).\n  - 글로벌파운드리스: **$1.90B**(YoY +12.5%).\n  - 타워: **$526M**(YoY +33.0%). SiPho 매출이 약 **$240M**입니다.\n- **가이던스·전망**\n  - 타워: 4Q 중간값 **$600M**, 2026년 연 **$2.0B**, 2027년 혼합 가격 **+20%**. 4Q SiPho 런레이트는 **$1.1B**를 넘을 전망입니다.\n  - 글로벌파운드리스: 4Q 회사 가이던스 수치는 자료에서 확인되지 않습니다(컨센서스 +5.5%).\n  - 세그먼트 컨센서스: QoQ **+7.4%**.\n- **해석**: 실리콘포토닉스 수요가 성장의 핵심입니다. 모바일 비중이 큰 글로벌파운드리스는 메모리 가격 영향으로 상대적으로 둔합니다.\n> 💬 \"This momentum is reflected in increasing customer commitments with several strategic accounts entering into long-term agreements at higher ASPs, resulting in forecasted 20% higher blended prices for 2027 versus 2026.\" — Russell Ellwanger, 타워 세미컨덕터 (어닝콜 2026-11-02)\n> → 이런 모멘텀은 고객 약정 증가로 나타나고 있습니다. 여러 전략 고객이 더 높은 ASP로 장기 계약을 맺어, 2027년 혼합 가격이 2026년보다 20% 높을 것으로 예상됩니다.\n\n#### OSAT·테스트 — 실적 🟡 · 가이던스 🟡중립\n- **실적**(표본 소수, 1사 — 앰코): QoQ **+4.9%**, YoY **+0.2%**, 영업이익률 **11.3%**(전년 8.0%). GM은 **18.3%**입니다. 컴퓨팅은 QoQ **+25%**로 사상 최대였지만, 커뮤니케이션은 **-8%**였습니다.\n- **가이던스·전망**\n  - 앰코: 4Q 매출 **$1.9~2.0B**, GM **18~19%**. 컴퓨팅은 YoY **+50% 이상**이지만 컨슈머는 **-10%대 중반**으로 봤습니다. 2026년 CapEx는 약 **$25억**입니다.\n  - 컨센서스: QoQ **-0.3%**.\n- **해석**: HDFO와 2.5D 같은 AI 패키징은 가속하고 있습니다. 하지만 스마트폰 쪽 약세(SiP 베트남 이전, 메모리 공급 제약)가 이를 상쇄해 전체 매출은 보합입니다.\n 1.9~2.0B**로 보합, YoY 실적 **+0.2%**, 컨센서스 QoQ **-0.3%**.\n  - **전력·화합물 반도체**: 컨센서스 QoQ **+1.1%**, 온세미 4Q 자동차 한 자릿수 후반 감소, 울프스피드 YoY **-21%**에 매출총이익률 마이너스 지속."}, "TW": {"name": "대만", "flag": "🇹🇼", "tone": {"summary": "대만 테크 3Q 전 섹터 YoY 증가, TSMC 4Q +14%·미디어텍 +25~32% 가이던스로 상향 지속", "segments": [{"seg": "파운드리", "tone": 2, "growth": "QoQ +17.1%, YoY +49.6%, OPM 56.4%(전년 47.6%)", "guide": "TSMC 4Q 매출 $52.3~54.3B(중간값 +14% QoQ, +58% YoY), GM 65~67%, FY26 약 +44% / UMC 2027 ASP 약 +10% / 컨센 +14.0% QoQ", "quote": {"text": "Based on the current business outlook, we expect our fourth quarter revenue to be between $52.3 billion and $54.3 billion, which represents a 14% sequential increase or a 58% year-over-year increase at the midpoint.", "ko": "현재 사업 전망을 기준으로 4분기 매출은 523억~543억 달러로 예상하며, 이는 중간값 기준 전분기 대비 14%, 전년 동기 대비 58% 증가에 해당합니다.", "by": "Wendell Huang, TSMC", "src": "어닝콜 2026-10-15"}}, {"seg": "유통", "tone": 0, "growth": "QoQ +5.9%, YoY +89.5%, OPM 2.7%(전년 2.1%)", "guide": "회사 가이던스 미제시. 컨센 4Q +2.2% QoQ(3사): WT마이크로 +10.2%, WPG -7.1%. 10월 월매출은 3Q 월평균 대비 WT마이크로 +35.7%, WPG -11.8%", "quote": null}, {"seg": "팹리스·IP", "tone": 2, "growth": "QoQ +16.8%, YoY +52.0%(중앙값 +25.4%), OPM 20.2%(전년 13.5%)", "guide": "미디어텍 4Q 매출 NT$210.1~221.8B(+25~32% QoQ), GM 45%±1.5%p, 4Q ASIC $2.5B / 노바텍 4Q NT$28~29.2B, OPM 17~19% / 컨센 +14.7% QoQ", "quote": {"text": "We have already commenced initial shipments in September and are confident of delivering $2.5 billion revenue in the fourth quarter.", "ko": "9월에 이미 초기 출하를 시작했으며, 4분기 25억 달러 매출 달성을 확신합니다.", "by": "Rick Tsai, 미디어텍", "src": "어닝콜 2026-10-30"}}, {"seg": "OSAT·테스트", "tone": 1, "growth": "QoQ +23.6%, YoY +41.6%, OPM 14.8%(전년 8.5%)", "guide": "ASE 4Q 연결 매출 +6~8% QoQ, GM 23~24%, OPM 14.5~15.5%, ATM +11~13% / 2027 LEAP 매출 2배 목표 / 컨센 +6.4% QoQ", "quote": {"text": "For our ATM business, in NT dollar terms, our ATM fourth quarter revenue should grow by 11% to 13% quarter-over-quarter.", "ko": "ATM 사업은 대만달러 기준으로 4분기 매출이 전분기 대비 11~13% 증가할 것입니다.", "by": "Joseph Tung, ASE", "src": "어닝콜 2026-10-29"}}, {"seg": "메모리", "tone": 1, "growth": "QoQ +48.6%, YoY +384.6%, OPM 67.7%(전년 8.0%)", "guide": "난야 4Q ASP 점진적 추가 상승, 두 자릿수 계약가 인상, GPM 80%대 유지 가능. 비트 출하는 2H27까지 flat / 컨센 +10.5% QoQ", "quote": {"text": "Plus, we have a very depleted inventory, so likely our bit shipment will remain flat for a few quarter until second half of 2027.", "ko": "게다가 재고가 거의 바닥나 비트 출하는 2027년 하반기까지 몇 분기 동안 flat에 머물 가능성이 큽니다.", "by": "Pei-Ing Lee, 난야테크", "src": "어닝콜 2026-10-12"}}, {"seg": "패키지 기판", "tone": 1, "growth": "QoQ +26.2%, YoY +44.3%, OPM 17.0%(전년 7.3%)", "guide": "회사 수치 가이던스 미제시. 컨센 4Q +14.5% QoQ(3사): 젠딩 +17.6%, 유니마이크론 +11.3%, 킨서스 +11.9%. 젠딩 2026 CapEx NT$800억 이상", "quote": {"text": "2027, optical modules, AI servers, and IC substrates are expected to sustain rapid growth. New capacity backed by over NT$80bn", "ko": "2027년 광모듈, AI 서버, IC 기판은 고성장을 이어갈 전망이다. NT$800억 이상이 투입된 신규 캐파", "by": "젠딩", "src": "IR mops_2026-11-18_495820261110E001"}}, {"seg": "클린룸·팹 인프라", "tone": 1, "growth": "QoQ +12.3%, YoY +46.2%, OPM 16.7%(전년 12.1%)", "guide": "회사 수치 가이던스 미제시. 컨센 4Q +8.2% QoQ(3사): 마켓텍 +10.6%, 액터 +10.0%, 미를 -19.6%. 10월 L&K YoY +62.6%, UIS +56.0%", "quote": {"text": "In 2026, UIS expects to fully benefit from the structural investment wave in the global semiconductor", "ko": "2026년 UIS는 글로벌 반도체의 구조적 투자 사이클 수혜를 온전히 누릴 것으로 예상한다", "by": "UIS", "src": "IR mops_2026-06-11_240420260611E001"}}, {"seg": "소재", "tone": 0, "growth": "QoQ +1.6%, YoY +19.6%, OPM 13.4%(전년 9.7%)", "guide": "컨센 4Q +11.0% QoQ(2사, 표본 소수): 글로벌웨이퍼스 +12.3%, 키닉 +4.4%. 키닉 4Q부터 일부 제품 약 10% 가격 인상", "quote": {"text": "Pricing & Profitability: A ~10% price increase on selected products starting Q4 2026, coupled with a…", "ko": "가격·수익성: 2026년 4분기부터 일부 제품 약 10% 가격 인상, 아울러…", "by": "키닉", "src": "IR mops_2026-11-10_156020261110E001"}}, {"seg": "후공정 장비", "tone": -1, "growth": "QoQ +32.8%, YoY +146.4%, OPM 35.9%(전년 24.1%)", "guide": "회사 가이던스 미제시. 컨센 4Q -4.7% QoQ(3사): 크로마 -5.4%, GMM -32.3%, CSun +15.1%", "quote": null}, {"seg": "부품", "tone": 0, "growth": "QoQ +14.8%, YoY +52.0%, OPM 20.0%(전년 16.0%), 표본 6/7", "guide": "회사 가이던스 미제시. 컨센 4Q +3.9% QoQ(4사): 폭스세미콘 +1.5%, 윈웨이 +1.6%, CHPT +17.6%", "quote": {"text": "NT$4.19 billion, representing 118.13% YoY growth and exceeding full-year 2025 revenue by approximately 73%.", "ko": "NT$41.9억으로 전년 대비 118.13% 증가했으며, 2025년 연간 매출을 약 73% 웃돌았다.", "by": "한민테스트(漢測)", "src": "IR mops_2026-11-12_785620261111E001"}}, {"seg": "광통신", "tone": 1, "growth": "QoQ +29.1%, YoY +72.4%, OPM 33.8%(전년 14.7%)", "guide": "회사 가이던스 미제시. 컨센 4Q +8.9% QoQ(3사): 연기(랜드마크) +15.9%, 전신 +2.6%, 광환 +1.3%", "quote": null}, {"seg": "전력·화합물 반도체", "tone": 0, "growth": "QoQ +8.9%, YoY +29.3%, OPM 8.6%(전년 -5.2%)", "guide": "윈세미 4Q 매출 low-single digit QoQ 증가 / 에피실 2H26 HoH +3~5% / 컨센 +12.3% QoQ(2사, 표본 소수)", "quote": {"text": "We expect 4Q26 consolidated revenue to increase low-single digit QoQ.", "ko": "4Q26 연결 매출은 전분기 대비 한 자릿수 초반 증가를 예상한다.", "by": "윈세미(WIN)", "src": "IR mops_2026-11-05_310520261102E001"}}, {"seg": "전공정 장비", "tone": 0, "growth": "QoQ +7.0%, YoY +28.3%, OPM 29.4%(전년 27.6%)", "guide": "회사 가이던스 미제시. 컨센 4Q +16.8% QoQ(GPTC 1사, 표본 소수). 사이언테크 4Q26 재생 웨이퍼 캐파 월 4만 장 계획", "quote": {"text": "2026 Q4: Wafer Reclaim Capacity 40K/Month at Hukou Plant", "ko": "2026년 4분기: 후커우 공장 재생 웨이퍼 캐파 월 4만 장", "by": "사이언테크", "src": "IR mops_2026-05-12_358320260511E001"}}], "best": ["파운드리", "팹리스·IP", "패키지 기판"], "worst": ["후공정 장비", "유통", "부품"]}, "md": "## 대만\n\n### 한눈에\n- **3Q26에 13개 밸류체인이 모두 YoY 증가했다.** 메모리가 **YoY +384.6%**(OPM **67.7%**)로 가장 강했고, 후공정 장비(**+146.4%**)와 유통(**+89.5%**)이 뒤를 이었다. 규모가 가장 큰 파운드리는 매출 **$48.7B**, **YoY +49.6%**, OPM **56.4%**를 기록했다.\n- **상대적으로 약한 곳**은 소재(QoQ **+1.6%**, YoY **+19.6%**)다. 팹리스 안에서도 ASMedia(**-33.2%**), 엘란(**-33.0%**), 파레이드(**-4.4%**)는 YoY 역성장했다.\n- **가이던스는 AI 선단 쪽이 강하다.** TSMC는 4Q 매출 **$52.3~54.3B(+14% QoQ)**와 FY26 **약 +44%**를 제시했다. 미디어텍은 4Q **+25~32% QoQ**, ASE는 ATM **+11~13% QoQ**를 가이던스로 냈다.\n- **둔화 신호는 후공정 장비에서 나온다.** 컨센이 **-4.7% QoQ**로 13개 밸류체인 중 유일하게 감소다. 유통(**+2.2%**)과 부품(**+3.9%**)도 4Q 성장 기대가 낮다. 메모리는 가격은 오르지만 출하량이 2H27까지 flat이라 QoQ 성장률이 **+48.6%에서 +10.5%(컨센)**로 낮아질 전망이다.\n\n### 밸류체인별 실적과 가이던스\n\n#### 파운드리 — 실적 🟢 · 가이던스 🟢강한 상향\n- **실적:** 집계 매출은 QoQ **+17.1%**, YoY **+49.6%**, OPM **56.4%**(전년 47.6%)다.\n  - TSMC: 매출 **$46.7B**(QoQ **+16.2%**, 가이던스 상단 상회), GM **66.4%**, OPM **58.7%**. 7nm 이하 비중은 **79%**, HPC 비중은 **68%**(+22% QoQ)다. 집계상 USD 환산 매출은 $45,286M으로 회사 발표치와 다르다.\n  - UMC: 매출 TWD **742.4억**(QoQ **+8%**), GM **34%**, 가동률 **92%**.\n  - PSMC: YoY **+80.2%**, OPM **36.7%**.\n  - 뱅가드: YoY **+27.2%**, GM **33.6%**.\n- **가이던스·전망:**\n  - TSMC 4Q: 매출 **$52.3~54.3B**(중간값 **+14% QoQ, +58% YoY**), GM **65~67%**(N2 램프·해외 팹 희석으로 -40bp), OPM **56.5~58.5%**. FY26 성장률은 **약 +44%**로 올렸고, 2026 CapEx **$60~64B**를 재확인했다. 2027년 N2 캐파는 **2배 이상**으로 늘린다. 10월 매출은 NT$**5,868.9억**(YoY **+59.7%**)이다.\n  - UMC: 4Q 출하는 low-single digit 증가, GM은 전분기와 비슷하다. 2027년 블렌디드 ASP는 **YoY 약 +10%**로 본다.\n  - 뱅가드: 4Q 웨이퍼 출하 **0~2% QoQ**.\n  - 컨센: 4Q **+14.0% QoQ**(4사). PSMC는 **+19.2%**다.\n- **해석:** AI 가속기 수요 덕에 TSMC 선단공정이 실적과 가이던스를 모두 이끌고 있다. 성숙 공정도 가동률이 90%를 넘어 2027년 가격 인상 국면에 들어설 것으로 보인다.\n> 💬 \"Based on the current business outlook, we expect our fourth quarter revenue to be between $52.3 billion and $54.3 billion, which represents a 14% sequential increase or a 58% year-over-year increase at the midpoint.\" — Wendell Huang, TSMC (어닝콜 2026-10-15)\n> → 현재 사업 전망을 기준으로 4분기 매출은 523억~543억 달러로 예상하며, 이는 중간값 기준 전분기 대비 14%, 전년 동기 대비 58% 증가에 해당합니다.\n\n> 💬 \"Importantly, we expect 2027 to mark a turning point in our blended ASP trajectory, moving from an environment of ASP erosion toward a meaningful positive uplift beginning in the first quarter.\" — Jason Wang, UMC (어닝콜 2026-10-28)\n> → 중요한 점은 2027년이 블렌디드 ASP 흐름의 전환점이 될 것이라는 점입니다. ASP 하락 국면에서 벗어나 1분기부터 의미 있는 상승으로 돌아설 것으로 예상합니다.\n\n#### 유통 — 실적 🟢🟢 · 가이던스 🟡중립\n- **실적:** 집계 매출은 QoQ **+5.9%**, YoY **+89.5%**, OPM **2.7%**(전년 2.1%)다.\n  - WT마이크로: 매출 **$18,102M**(QoQ **+1.1%**, YoY **+81.6%**), OPM **2.4%**.\n  - WPG: **$15,456M**(QoQ **+11.8%**, YoY **+108.6%**), OPM **2.8%**.\n  - 탑코: YoY **+34.9%**, OPM **6.9%**.\n- **가이던스·전망:** 회사 가이던스는 없다.\n  - 컨센: 4Q **+2.2% QoQ**(3사). WT마이크로 **+10.2%**, WPG **-7.1%**로 엇갈린다.\n  - 10월 월매출(3Q 월평균 대비): WT마이크로 **+35.7%**(YoY +112.9%), WPG **-11.8%**, 와리 **-6.9%**.\n- **해석:** 메모리 가격 상승분이 매출에 그대로 반영돼 외형이 크게 늘었다. 다만 마진은 2%대에 머물고, 4Q 성장 기대도 기업별로 차이가 크다.\n\n#### 팹리스·IP — 실적 🟢🟢 · 가이던스 🟢강한 상향\n- **실적:** 집계 매출은 QoQ **+16.8%**, YoY **+52.0%**(중앙값 **+25.4%**), OPM **20.2%**(전년 13.5%)다.\n  - 미디어텍: 매출 NT$**168B**(YoY **+18%**, 가이던스 상회), OPM **16.1%**.\n  - 파이슨: **$2,609M**(YoY **+374.6%**), OPM **38.2%**.\n  - 알칩: **$794M**(QoQ **+242.8%**, YoY **+298.6%**).\n  - GUC: YoY **+117.7%**.\n  - 부진: ASMedia(**-33.2%**), 엘란(**-33.0%**), 누보톤(OPM **-6.5%**, 순손실 NT$**5.59억**).\n- **가이던스·전망:**\n  - 미디어텍 4Q: 매출 NT$**210.1~221.8B**(**+25~32% QoQ**, **+40~48% YoY**), GM **45%±1.5%p**(1%p 하향). 4Q ASIC 매출은 **$2.5B**, 2027년 ASIC 매출은 **약 $16B**(AI ASIC 시장의 약 20%)를 목표로 한다.\n  - 노바텍 4Q: 매출 NT$**28~29.2B**, GM **37~39%**, OPM **17~19%**.\n  - 컨센: 4Q **+14.7% QoQ**(16사). 미디어텍 **+30.5%**, GUC **+21.3%**, 하이맥스 **-24.0%**다. 하이맥스는 3Q 어닝콜 자료가 없어 2Q 콜까지만 반영했다.\n- **해석:** ASIC(미디어텍, 알칩, GUC)과 스토리지 컨트롤러(파이슨)가 성장을 이끈다. 디스플레이·PC 인터페이스 팹리스는 4Q 역성장 컨센이 많아 양극화가 뚜렷하다.\n> 💬 \"We expect our fourth quarter revenue to be in the range of NTD 210.1 billion-NTD 221.8 billion, grow 25%-32% sequentially, and up 40%-48% year-over-year, at a forecasted exchange rate of NTD 31.7 to $1.\" — Rick Tsai, 미디어텍 (어닝콜 2026-10-30)\n> → 4분기 매출은 달러당 31.7대만달러 환율 가정에서 NT$2,101억~2,218억으로, 전분기 대비 25~32%, 전년 대비 40~48% 증가할 것으로 예상합니다.\n\n> 💬 \"For 2027, we expect this program to achieve the high end of our revenue target range of approximately $16 billion, representing around 20% of the total AI accelerator ASIC market.\" — Rick Tsai, 미디어텍 (어닝콜 2026-10-30)\n> → 2027년 이 프로그램은 매출 목표 범위의 상단인 약 160억 달러를 달성해 전체 AI 가속기 ASIC 시장의 약 20%를 차지할 것으로 예상합니다.\n\n#### OSAT·테스트 — 실적 🟢 · 가이던스 🟢상향\n- **실적:** 집계 매출은 QoQ **+23.6%**, YoY **+41.6%**, OPM **14.8%**(전년 8.5%)다.\n  - ASE: **$7,400M**(QoQ **+27.8%**, YoY **+44.8%**), OPM **13.6%**.\n  - 파워텍: **$768M**(YoY **+26.9%**), OPM **17.7%**.\n  - KYEC: YoY **+30.7%**.\n  - 아덴텍: YoY **+48.5%**, OPM **34.8%**.\n- **가이던스·전망:**\n  - ASE 4Q: 연결 매출 **+6~8% QoQ**, GM **23~24%**, OPM **14.5~15.5%**. ATM은 매출 **+11~13% QoQ**, GM **+100~200bp**다.\n  - ASE 2027: LEAP 매출 **2배**, full process **$1B 이상**, CPO **$0.5B 이상**을 기대한다. 10월 매출은 3Q 월평균 대비 **+8.9%**다.\n  - 컨센: 4Q **+6.4% QoQ**(8사). KYEC **+13.0%**, 칩모스 **-2.7%**, 칩본드 **-5.9%**다.\n- **해석:** 선단 패키징(LEAP)과 테스트가 성장 동력이다. 4Q 연결 성장률은 3Q(+27.8%)보다 낮지만, 마진은 계속 오르는 흐름이다.\n> 💬 \"For our ATM business, in NT dollar terms, our ATM fourth quarter revenue should grow by 11% to 13% quarter-over-quarter.\" — Joseph Tung, ASE (어닝콜 2026-10-29)\n> → ATM 사업은 대만달러 기준으로 4분기 매출이 전분기 대비 11~13% 증가할 것입니다.\n\n> 💬 \"And there are some other new projects that we're entering, for example, CPO, and we're expecting over USD 0.5 billion of revenue coming from CPO as well for next year.\" — Joseph Tung, ASE (어닝콜 2026-10-29)\n> → CPO처럼 새로 진입하는 프로젝트들도 있으며, 내년 CPO에서만 5억 달러 이상의 매출을 기대합니다.\n\n#### 메모리 — 실적 🟢🟢 · 가이던스 🟢상향\n- **실적:** 집계 매출은 QoQ **+48.6%**, YoY **+384.6%**, OPM **67.7%**(전년 8.0%)다.\n  - 난야테크: 매출 NT$**1,336억**(QoQ **+61.9%**, YoY **+611.7%**), GPM **85.7%**, OPM **80%**. ASP가 QoQ +60% 이상 올랐고, 출하는 mid-single digit 줄었다.\n  - 윈본드: **$2,495M**(YoY **+278.2%**), OPM **53.2%**.\n  - 매크로닉스: YoY **+195.1%**, OPM **53.4%**.\n- **가이던스·전망:**\n  - 난야 4Q: ASP는 점진적으로 더 오르고 계약가는 두 자릿수 상승한다. **GPM 80%대 유지도 가능**하다고 봤다. 비트 출하는 **2H27까지 flat**이다.\n  - 윈본드: 공급 제약이 2027년까지 이어질 전망이다.\n  - 컨센: 4Q **+10.5% QoQ**(4사). 윈본드 **+15.4%**, AP메모리 **-4.9%**다.\n- **해석:** 공급 부족과 재고 소진으로 가격이 주도하는 호황이 이어진다. 다만 출하량이 늘 수 없어 QoQ 성장률은 3Q보다 크게 낮아질 전망이다.\n> 💬 \"Plus, we have a very depleted inventory, so likely our bit shipment will remain flat for a few quarter until second half of 2027.\" — Pei-Ing Lee, 난야테크 (어닝콜 2026-10-12)\n> → 게다가 재고가 거의 바닥나 비트 출하는 2027년 하반기까지 몇 분기 동안 flat에 머물 가능성이 큽니다.\n\n> 💬 \"Supply remains constrained, with tight conditions expected to persist into 2027\" — 윈본드 (IR mops_2026-11-03_234420261103E001)\n> → 공급 제약이 지속되고 있으며, 타이트한 수급은 2027년까지 이어질 전망이다.\n\n#### 패키지 기판 — 실적 🟢 · 가이던스 🟢상향\n- **실적:** 집계 매출은 QoQ **+26.2%**, YoY **+44.3%**, OPM **17.0%**(전년 7.3%)다.\n  - 젠딩: **$1,959M**(QoQ **+33.4%**, YoY **+36.4%**), OPM **13.5%**.\n  - 유니마이크론: **$1,596M**(YoY **+54.9%**), OPM **20.0%**.\n  - 킨서스: YoY **+40.4%**, OPM **22.1%**.\n  - 난야PCB: YoY **+49.3%**.\n- **가이던스·전망:** 회사 수치 가이던스는 없다.\n  - 컨센: 4Q **+14.5% QoQ**(3사). 젠딩 **+17.6%**, 유니마이크론 **+11.3%**, 킨서스 **+11.9%**다.\n  - 10월 월매출(3Q 월평균 대비): 젠딩 **+26.3%**, 난야PCB **+15.2%**.\n  - 젠딩: 2026 CapEx는 NT$**800억 이상**이고, 2030년 매출 비중 목표를 2028년에 앞당겨 달성할 수 있다고 했다.\n- **해석:** AI 서버, 광모듈, ABF 기판 수요가 겹치며 이익률이 전년보다 **+9.7%p** 개선됐다. 4Q에도 두 자릿수 성장 기대가 유지된다.\n> 💬 \"2027, optical modules, AI servers, and IC substrates are expected to sustain rapid growth. New capacity backed by over NT$80bn\" — 젠딩 (IR mops_2026-11-18_495820261110E001)\n> → 2027년 광모듈, AI 서버, IC 기판은 고성장을 이어갈 전망이다. NT$800억 이상이 투입된 신규 캐파…\n\n#### 클린룸·팹 인프라 — 실적 🟢 · 가이던스 🟢상향\n- **실적:** 집계 매출은 QoQ **+12.3%**, YoY **+46.2%**, OPM **16.7%**(전년 12.1%)다.\n  - L&K: **$989M**(QoQ **+27.3%**, YoY **+33.2%**).\n  - UIS: **$834M**(YoY **+43.0%**).\n  - 마켓텍: **$664M**(YoY **+91.1%**).\n  - 액터: OPM **18.9%**.\n- **가이던스·전망:** 회사 수치 가이던스는 없다.\n  - 컨센: 4Q **+8.2% QoQ**(3사). 마켓텍 **+10.6%**, 액터 **+10.0%**, 미를 **-19.6%**다.\n  - 10월 월매출 YoY: L&K **+62.6%**, UIS **+56.0%**.\n  - 구덩: 애리조나 피닉스 파일럿 런을 4Q에 진행한다.\n- **해석:** TSMC 등 고객사의 CapEx 확대(TSMC 2026 **$60~64B**)가 팹 건설 수주로 이어지고 있다. 2026~2028년 CapEx 상향 기조가 중기 수요를 뒷받침한다.\n> 💬 \"In 2026, UIS expects to fully benefit from the structural investment wave in the global semiconductor\" — UIS (IR mops_2026-06-11_240420260611E001)\n> → 2026년 UIS는 글로벌 반도체의 구조적 투자 사이클 수혜를 온전히 누릴 것으로 예상한다.\n\n#### 소재 — 실적 🟢 · 가이던스 🟡중립\n- **실적:** 집계 매출은 QoQ **+1.6%**, YoY **+19.6%**, OPM **13.4%**(전년 9.7%)다.\n  - 시노아메리칸실리콘: **$633M**(QoQ **-1.1%**, YoY **+9.4%**).\n  - 솔라어플라이드: **$466M**(YoY **+47.4%**), OPM **14.4%**.\n  - 글로벌웨이퍼스: **$451M**(YoY **+2.6%**), OPM **9.8%**.\n  - 키닉: OPM **27.0%**.\n- **가이던스·전망:** 회사 수치 가이던스는 없다.\n  - 컨센: 4Q **+11.0% QoQ**(2사, **표본 소수**). 글로벌웨이퍼스 **+12.3%**, 키닉 **+4.4%**다.\n  - 키닉: 4Q부터 일부 제품 가격을 **약 10%** 올린다. 캐파는 4Q26 **월 8만 개 이상**, 4Q27 **11만 개**가 목표다.\n  - 10월 월매출(3Q 월평균 대비): 시노아메리칸실리콘 **-2.1%**, 글로벌웨이퍼스 **-3.9%**.\n- **해석:** 실리콘 웨이퍼는 회복이 더뎌 YoY 한 자릿수 성장에 그쳤다. 반면 CMP·패키징 소재는 가격 인상과 증설로 상대적으로 강하다.\n> 💬 \"Pricing & Profitability: A ~10% price increase on selected products starting Q4 2026, coupled with a…\" — 키닉 (IR mops_2026-11-10_156020261110E001)\n> → 가격·수익성: 2026년 4분기부터 일부 제품 약 10% 가격 인상, 아울러…\n\n#### 후공정 장비 — 실적 🟢🟢 · 가이던스 🟠둔화\n- **실적:** 집계 매출은 QoQ **+32.8%**, YoY **+146.4%**, OPM **35.9%**(전년 24.1%)다.\n  - 크로마: **$543M**(QoQ **+32.5%**, YoY **+179.7%**), OPM **40.0%**.\n  - 올링: **$101M**(YoY **+94.6%**).\n  - GMM: QoQ **+101.5%**.\n  - CSun: YoY **+93.9%**, OPM **20.1%**.\n- **가이던스·전망:** 회사 가이던스는 없다.\n  - 컨센: 4Q **-4.7% QoQ**(3사). 크로마 **-5.4%**, GMM **-32.3%**, CSun **+15.1%**다.\n  - 10월 월매출(3Q 월평균 대비): 크로마 **+4.7%**(MoM -8.8%), 올링 **-11.7%**.\n- **해석:** AI 테스트·패키징 장비 출하가 3Q에 몰리면서 4Q는 기저 부담이 크다. 13개 밸류체인 중 유일하게 4Q 컨센이 역성장이다.\n\n#### 부품 — 실적 🟢🟢 · 가이던스 🟡중립\n- **실적:** 집계 매출은 QoQ **+14.8%**, YoY **+52.0%**, OPM **20.0%**(전년 16.0%)다. 표본은 6/7사다.\n  - 폭스세미콘: **$205M**(YoY **+22.2%**), OPM **14.5%**.\n  - MPI: **$179M**(YoY **+72.9%**).\n  - 윈웨이: **$138M**(YoY **+152.6%**).\n  - CHPT: OPM **35.2%**.\n  - 한민테스트: YoY 데이터가 없다. 3Q에는 상장 전 직원 주식 관련 일회성 비용 약 NT$**11.18억**이 반영됐다.\n- **가이던스·전망:** 회사 가이던스는 없다.\n  - 컨센: 4Q **+3.9% QoQ**(4사). 폭스세미콘 **+1.5%**, 윈웨이 **+1.6%**, CHPT **+17.6%**다.\n  - 10월 월매출(3Q 월평균 대비): MPI **+13.5%**, 윈웨이 **-27.1%**.\n- **해석:** 프로브카드는 선단 테스트 수요로 견조하다. 반면 테스트 소켓과 장비 부품은 4Q 성장이 거의 없을 것으로 보여 섹터 안에서 흐름이 엇갈린다.\n> 💬 \"NT$4.19 billion, representing 118.13% YoY growth and exceeding full-year 2025 revenue by approximately 73%.\" — 한민테스트(漢測) (IR mops_2026-11-12_785620261111E001)\n> → NT$41.9억으로 전년 대비 118.13% 증가했으며, 2025년 연간 매출을 약 73% 웃돌았다.\n\n#### 광통신 — 실적 🟢🟢 · 가이던스 🟢상향\n- **실적:** 집계 매출은 QoQ **+29.1%**, YoY **+72.4%**, OPM **33.8%**(전년 14.7%)다.\n  - 광성(EZconn): **$149M**(YoY **+95.6%**).\n  - 연균광전: **$114M**(YoY **+102.4%**).\n  - 연기(랜드마크): **$47M**(YoY **+182.6%**), OPM **49.4%**.\n  - 전신: OPM **31.3%**.\n- **가이던스·전망:** 회사 가이던스는 없다.\n  - 컨센: 4Q **+8.9% QoQ**(3사). 랜드마크 **+15.9%**, 전신 **+2.6%**, 광환 **+1.3%**다.\n  - 10월 월매출(3Q 월평균 대비): 광성 **+12.1%**, 광환 **+22.1%**.\n- **해석:** AI 데이터센터의 광 인터커넥트 수요로 레이저·광 부품 업체의 이익률이 두 배 이상 뛰었다. 4Q에도 한 자릿수 후반 성장 기대가 이어진다.\n\n#### 전력·화합물 반도체 — 실적 🟢 · 가이던스 🟡중립\n- **실적:** 집계 매출은 QoQ **+8.9%**, YoY **+29.3%**, OPM **8.6%**(전년 **-5.2%**, 흑자전환)다.\n  - 윈세미: **$178M**(QoQ **+11.4%**, YoY **+30.6%**).\n  - GCS: YoY **+55.4%**, OPM **19.3%**.\n  - 에피실: OPM **4.1%**.\n  - AWSC: QoQ **-2.8%**.\n- **가이던스·전망:**\n  - 윈세미 4Q: 연결 매출 **low-single digit QoQ 증가**.\n  - 에피실: 2H26 매출 **HoH +3~5%**로 사실상 flat이다. 가동률은 2Q **95%**다.\n  - 컨센: 4Q **+12.3% QoQ**(2사, **표본 소수**). GCS **+21.2%**, 에피실 **+8.6%**다.\n- **해석:** 흑자전환은 했지만 최대 기업 윈세미의 가이던스가 낮은 한 자릿수에 그쳐 회사 전망은 중립적이다.\n> 💬 \"We expect 4Q26 consolidated revenue to increase low-single digit QoQ.\" — 윈세미(WIN) (IR mops_2026-11-05_310520261102E001)\n> → 4Q26 연결 매출은 전분기 대비 한 자릿수 초반 증가를 예상한다.\n\n#### 전공정 장비 — 실적 🟢 · 가이던스 🟡중립\n- **실적:** 집계 매출은 QoQ **+7.0%**, YoY **+28.3%**, OPM **29.4%**(전년 27.6%)다.\n  - 사이언테크: **$93M**(YoY **+8.9%**).\n  - TRI: **$88M**(QoQ **-1.6%**, YoY **+40.2%**), OPM **35.2%**.\n  - GPTC(홍쑤): **$67M**(YoY **+48.7%**), OPM **22.0%**.\n- **가이던스·전망:** 회사 가이던스는 없다.\n  - 컨센: 4Q **+16.8% QoQ**. GPTC 1사뿐이라 **표본 소수**다.\n  - 사이언테크: 4Q26에 재생 웨이퍼 캐파 월 4만 장, 장비 신공장(Plant II)을 계획하고 있다.\n  - 10월 월매출(3Q 월평균 대비): 사이언테크 **+7.2%**, TRI **-4.1%**.\n- **해석:** 이익률은 높지만 표본 규모가 작고 기업 간 성장 차이가 커 방향성을 판단하기 어렵다.\n> 💬 \"2026 Q4: Wafer Reclaim Capacity 40K/Month at Hukou Plant\" — 사이언테크 (IR mops_2026-05-12_358320260511E001)\n> → 2026년 4분기: 후커우 공장 재생 웨이퍼 캐파 월 4만 장\n\n### 가이던스 톤 정리\n- **좋았던 곳**\n  - **파운드리**: TSMC 4Q **$52.3~54.3B(+14% QoQ, +58% YoY)**, FY26 **약 +44%**. UMC 2027 ASP **약 +10%**. 컨센은 **+14.0%**다.\n  - **팹리스·IP**: 미디어텍 4Q **+25~32% QoQ**, ASIC은 4Q **$2.5B**, 2027 **약 $16B**. 컨센은 **+14.7%**다.\n  - **패키지 기판**: 컨센 **+14.5%**(젠딩 **+17.6%**), 젠딩 10월 매출은 3Q 월평균 대비 **+26.3%**다.\n  - **OSAT·테스트**: ASE ATM **+11~13% QoQ**, 2027 LEAP **2배** 목표.\n  - **메모리**: 난야는 ASP 추가 상승과 GPM 80%대 유지 가능성을 언급했다. 컨센은 **+10.5%**다.\n- **나빴던 곳**\n  - **후공정 장비**: 컨센 **-4.7% QoQ**(크로마 **-5.4%**, GMM **-32.3%**)로 유일한 역성장 전망이다.\n  - **유통**: 컨센 **+2.2%**이고, WPG는 **-7.1%**, 10월 매출도 3Q 월평균 대비 **-11.8%**다.\n  - **부품**: 컨센 **+3.9%**이고, 윈웨이 10월 매출이 3Q 월평균 대비 **-27.1%**다.\n  - **팹리스 일부**: 하이맥스 컨센 **-24.0%**, 노바텍 **-6.1%**. ASMedia와 엘란은 YoY **-33%**다.\n  - **전력·화합물**: 윈세미 4Q가 **low-single digit** 성장에 그친다."}, "KR": {"name": "한국", "flag": "🇰🇷", "tone": {"summary": "메모리 YoY +171%·OPM 63.6%가 견인, 장비·부품 동반 호조. 4Q는 메모리 중심 상향", "segments": [{"seg": "메모리", "tone": 2, "growth": "매출 $224,680M, QoQ +19.6%, YoY +171.3%, OPM 63.6%(전년 21.3%). SK하이닉스 YoY +327.9%·OPM 79.7%", "guide": "SK하이닉스: 4Q DRAM 출하 20% 중반 QoQ 증가, 2027 DRAM 수요 20% 중반·NAND 10% 후반 성장. 삼성전자: 4Q DRAM 판매량 10% 중후반 QoQ 증가(대신증권)", "quote": {"text": "Consequently, fourth quarter shipment volume is expected to grow meaningfully by mid-20% sequentially.", "ko": "그 결과 4분기 출하량은 전분기 대비 20% 중반으로 의미 있게 증가할 것으로 예상됩니다.", "by": "Woo-Hyun Kim, SK하이닉스", "src": "어닝콜 2026-10-27 (FY2026 Q3)"}}, {"seg": "패키지 기판", "tone": 1, "growth": "매출 $8,968M, QoQ +11.3%, YoY +24.6%, OPM 8.0%(전년 4.8%)", "guide": "LG이노텍 4Q 매출 6조 7,180억원(+5.5% QoQ)·영업이익 1,894억원(QoQ 2배) 전망(IBK). 심텍 SoCAMM 매출 가이던스 약 3,000억원(메리츠)", "quote": {"text": "…패키지솔루션 사업부문은 AI 적용 확대에 따른 반도체 수요 증가로 매출은 전년동기 대비 15% 성장한 1.4조원을 기록하였습니다.", "ko": "", "by": "LG이노텍", "src": "DART 분기보고서 (2026.09)"}}, {"seg": "팹리스·IP", "tone": 0, "growth": "매출 $795M, QoQ +12.3%, YoY +65.6%, OPM 20.8%(전년 0.7%)", "guide": "회사 가이던스 미제시. 다음 분기 컨센 매출 -8.5% QoQ(2사). 파두 4Q -0.2%, LX세미콘 4Q -12.0%", "quote  "src": "DART 분기보고서 (2026.09)"}}, {"seg": "파운드리", "tone": 0, "growth": "DB하이텍 매출 $302M, QoQ -2.7%, YoY +7.7%, OPM 22.3%(표본 소수)", "guide": "회사 가이던스 미제시. IR 수록 증권사 자료: 4Q 매출 4,536억원(+9% q-q) 전망, Q4 8인치 성숙공정 가동률 91%(Sigmaintell)", "quote": {"text": "• 8인치 파운드리, 수요 증가 및 공급 축소로 ‘27년까지 가격 사이클 지속 전망", "ko": "", "by": "DB하이텍 IR 수록 증권사 자료", "src": "IR files_682"}}, {"seg": "전력·화합물 반도체", "tone": 0, "growth": "매출 $280M, QoQ +8.7%, YoY +25.6%, OPM 7.1%(전년 1.2%), 표본 소수", "guide": "서울반도체 4Q 매출 2,700~2,900억원(환율 영향 반영) 가이던스", "quote": {"text": "환율 영향을 반영한 4분기 매출 2700~2900억 원 전망", "ko": "", "by": "서울반도체", "src": "IR kind_20261111_19577"}}, {"seg": "부품", "tone": 1, "growth": "매출 $254M, QoQ +7.4%, YoY +32.4%, OPM 27.2%(전년 22.9%)", "guide": "회사 가이던스 미제시. ISC: 2026 테스트 소켓 시장 +10% 전망, 비메모리 CPU 수요 YoY +100% 이상. 2Q 기준 기업 3Q 컨센: 리노공업 -30.9%, 티에스이 -0.8% QoQ", "quote": {"text": "- 비메모리 CPU 수요가 전년 동기 대비 100% 이상 증가하였으며 이러한 흐름은 올해 전반적으로 지속될 것으로 예상합니다.", "ko": "", "by": "ISC", "src": "DART 반기보고서 (2026.06)"}}, {"seg": "광통신", "tone": 0, "growth": "오이솔루션 매출 $16M, QoQ +10.2%, YoY +65.7%, OPM 0.6%(전년 -22.1%), 표본 소수", "guide": "회사 가이던스 미제시. 2Q 기준 기업 3Q 컨센: 대한광통신 +29.1%, 에치에프알 +19.9% QoQ", "quote": {"text": "…2026년에는 기존 5G 무선네트워크 시장 외 다양한 네트워크 시장에서 매출 증대가 기대되고 있습니다.", "ko": "", "by": "오이솔루션", "src": "DART 분기보고서 (2026.09)"}}], "best": ["메모리", "전공정 장비", "후공정 장비"], "worst": ["팹리스·IP", "소재", "OSAT·테스트"]}, "md": "## 한국\n\n### 한눈에\n- **메모리가 성장을 압도적으로 이끌었다.** 2사 매출 합계는 **$224,680M**로 YoY **+171.3%**, QoQ **+19.6%**이고, 영업이익률은 **63.6%**(전년 21.3%)다. SK하이닉스는 YoY **+327.9%**, OPM **79.7%**를 기록했다. 단, 삼성전자 매출은 전사 기준이다.\n- **장비·부품도 동반 호조였다.** 전공정 장비는 QoQ **+25.5%**, OPM **20.9%**(전년 10.4%)로 이익률이 두 배가 됐다. 후공정 장비는 YoY **+54.0%**, OPM **32.9%**, 부품은 OPM **27.2%**다.\n- **약한 곳:** 파운드리(DB하이텍, 표본 소수)는 QoQ **-2.7%**로 역성장했다. 클린룸·팹 인프라도 QoQ **-2.0%**다. OSAT·테스트는 YoY **+55.7%** 성장에도 OPM이 **0.3%**에 그쳐 이익률이 악화됐다.\n- **가이던스 톤은 메모리만 뚜렷한 상향이다.** SK하이닉스는 4Q DRAM 출하 **20% 중반 QoQ** 증가, 삼성전자는 4Q DRAM 판매량 **10% 중후반** 증가를 제시했다. 장비 쪽 다음 분기 컨센서스는 전공정 **+28.1%**(1사), 후공정 **+18.3%**(2사)다. 반면 팹리스(**-8.5%**)와 소재(**-6.9%**)는 감소 컨센서스다.\n- 데이터 주의: 집계는 3Q26 결산 기업만 포함한다. 2Q26까지만 발표한 기업(하나마이크론·이수페타시스 등)은 개별 수치로만 참고했다.\n\n### 밸류체인별 실적과 가이던스\n\n#### 메모리 — 실적 🟢🟢 · 가이던스 🟢강한 상향\n① **실적** (표본 소수, 2사)\n- 집계: QoQ **+19.6%**, YoY **+171.3%**(중앙값 +227.4%), OPM **63.6%**\n- 삼성전자: 매출 **$146,295M**(QoQ +13.9%, YoY +126.9%, OPM 55.0%), 전사 기준\n- SK하이닉스: 매출 **$78,384M**(QoQ +31.9%, YoY **+327.9%**, OPM **79.7%**)\n\n② **가이던스·전망**\n- SK하이닉스 4Q\n  - DRAM 출하 **20% 중반 QoQ** 증가\n  - IR B/G 표기는 **Mid-20%** 증가 / **Mid-single%** 증가 QoQ\n  - 4Q에 HBM4가 HBM3E를 출하량·매출 비중에서 추월\n  - 321단 NAND 비중을 국내 캐파의 50% 이상으로 확대\n- SK하이닉스 중장기\n  - 2026 CapEx: **40조원대 후반**\n  - 2027 실현 가능 수요 성장률: DRAM **20% 중반**, NAND **10% 후반**\n  - 공급 부족이 2030년까지 지속될 것으로 전망\n- 삼성전자\n  - 4Q DRAM 판매량 **10% 중후반 QoQ** 증가(대신증권)\n  - 2026 CapEx **84.4조원**(+31.7조원)\n  - 2027년 사상 최대 실적 경신을 제시했다. 다만 모바일·PC 수요 조정을 예상했다.\n\n③ **해석:** HBM4 전환과 범용 DRAM 가격 상승이 겹치고, 공급 증가도 제약돼 있다. 이 때문에 물량과 가격이 동시에 오르고 있다. 위험 요인은 2027년 모바일·PC 수요 조정, 그리고 증권사들이 지적한 '28년 업황 지속성 우려다.\n\n④ **기업 코멘트**\n> 💬 \"A situation where supply cannot keep up with demand is expected to persist for some time, a constraint projected to continue through 2030.\" — Woo-Hyun Kim, SK하이닉스 (어닝콜 2026-10-27)\n> → 공급이 수요를 따라가지 못하는 상황이 당분간 지속되며, 이 제약은 2030년까지 이어질 것으로 예상됩니다.\n\n> 💬 \"In 2027, we expect some demand adjustment for mobile and PC applications.\" — Jaejune Kim, 삼성전자 (어닝콜 2026-10-28)\n> → 2027년에는 모바일·PC 응용처에서 일부 수요 조정이 있을 것으로 예상합니다.\n\n#### 패키지 기판 — 실적 🟢 · 가이던스 🟢상향\n① **실적**\n- 집계: QoQ **+11.3%**, YoY **+24.6%**, OPM **8.0%**(전년 4.8%)\n- LG이노텍: **$4,771M**(QoQ +15.2%, YoY +18.6%, OPM 1.5%)\n- 삼성전기: **$2,820M**(QoQ +8.9%, YoY +30.3%, OPM **18.4%**)\n- 대덕전자: **$313M**(YoY **+46.1%**, OPM 21.0%)\n- 심텍: **$402M**(YoY +43.7%, OPM 19.0%)\n- SKC는 OPM **-7.8%**로 적자다.\n\n② **가이던스·전망:** 회사가 숫자로 제시한 가이던스는 제한적이다.\n- LG이노텍: 4Q 매출 **6조 7,180억원**(+5.5% QoQ), 영업이익 **1,894억원**(QoQ 2배) 전망(IBK)\n- 삼성전기: 4Q 수요 강세와 가격 상승을 전망했다(IBK NDR).\n- 심텍: SoCAMM 매출 가이던스 약 **3,000억원**, MCP **700억원 이상**(메리츠). SoCAMM 전용 공장은 2027년 4Q 본격 가동 예정이다.\n\n③ **해석:** AI 서버·데이터센터향 기판(FC-BGA·MLCC)과 메모리 기판(SoCAMM 등) 수요가 견인했다. 다만 LG이노텍은 모바일 비중이 높아 마진이 1%대로 낮다.\n\n④ **기업 코멘트**\n> 💬 \"…패키지솔루션 사업부문은 AI 적용 확대에 따른 반도체 수요 증가로 매출은 전년동기 대비 15% 성장한 1.4조원을 기록하였습니다.\" — LG이노텍 (DART 분기보고서 2026.09)\n\n#### 팹리스·IP — 실적 🟢🟢 · 가이던스 🟡중립\n① **실적**\n- 집계: QoQ **+12.3%**, YoY **+65.6%**, OPM **20.8%**(전년 0.7%)\n- 제주반도체: **$259M**(YoY **+211.8%**, OPM 46.2%)\n- 파두: **$108M**(QoQ +96.1%, YoY **+460.8%**, OPM 25.2%)\n- 피델릭스: **$63M**(YoY **+576.0%**, OPM 56.4%)\n- LX세미콘: **$252M**(QoQ -16.2%, YoY -14.8%, OPM -4.6%)\n\n② **가이던스·전망:** 회사 가이던스 미제시. 다음 분기 컨센서스는 **-8.5% QoQ**(2사)다. 파두 4Q는 -0.2%, LX세미콘 4Q는 **-12.0%**다.\n\n③ **해석:** 메모리 가격 급등 덕에 레거시 메모리·컨트롤러 업체의 매출과 이익이 폭증했다. 반면 디스플레이 구동칩(LX세미콘)은 역성장해 세그먼트 안에서 양극화가 뚜렷하다.\n\n④ **기업 코멘트**\n> 💬 \"세계반도체시장통계기구(WSTS)는 2026년 6월 2일 발표한 춘계 전망에서 2026년 세계 반도체 시장이 전년 대비 89.9% 성장하여 1조 5,100억 달러 규모에 이를 것으로 예측하였으며…\" — 제주반도체 (DART 분기보고서 2026.09)\n\n#### 클린룸·팹 인프라 — 실적 🟢 · 가이던스 🟡중립\n① **실적**\n- 집계: QoQ **-2.0%**, YoY **+25.7%**(중앙값 +81.5%), OPM **7.1%**(전년 5.0%)\n- 에스에프에이: **$322M**(YoY +9.2%, OPM 5.1%)\n- 케이씨: **$188M**(YoY +43.7%, OPM 10.1%)\n- 신성이엔지: **$119M**(QoQ **-21.5%**, OPM 0.4%)\n- 로체시스템즈: **$39M**(YoY **+204.3%**, OPM 17.4%)\n\n② **가이던스·전망:** 회사 가이던스와 컨센서스 모두 미제시. 에스에프에이의 '25년말 수주잔고는 **9,118억원**이다(2026-02 IR).\n\n③ **해석:** 팹 증설 수요로 YoY는 높다. 하지만 프로젝트성 매출이라 분기별 변동이 크고 이익률은 한 자릿수에 머문다.\n\n④ **기업 코멘트**\n> 💬 \"매출은 반도체 소자업체 및 디스플레이 패널업체의 신규 라인 증설에 따른 수요와 대체 수요로 구성되며, 국내뿐 아니라 해외 시장의 투자가 활발하게 진행됨에 따라 매출이 증가하는 추세에 있습니다.\" — 케이씨 (DART 반기보고서 2026.06)\n\n#### 전공정 장비 — 실적 🟢 · 가이던스 🟢상향\n① **실적**\n- 집계: QoQ **+25.5%**, YoY **+45.3%**, OPM **20.9%**(전년 10.4%)\n- 원익IPS: **$253M**(QoQ **+56.0%**, YoY +25.8%, OPM 19.7%)\n- 테스: **$93M**(YoY +83.7%)\n- 고영: **$80M**(YoY +76.8%)\n- 브이엠: **$64M**(YoY **+133.2%**, OPM 35.2%)\n\n② **가이던스·전망:** 회사 가이던스 미제시.\n- 다음 분기 컨센서스: **+28.1% QoQ**(1사, 주성엔지니어링 4Q)\n- 고객사 CapEx\n  - 삼성전자 2026 **84.4조원**(+31.7조원)\n  - SK하이닉스 2026 **40조원대 후반**. 2027년에는 선단 공정 전환과 용인 클러스터 투자로 증가할 전망이다(한화).\n\n③ **해석:** HBM 공급 부족에 대응한 DRAM 중심 증설이 증착·식각 장비 수주로 이어지고 있다. 고객 CapEx 상향이 이미 확정된 점이 긍정적이다.\n\n④ **기업 코멘트**\n> 💬 \"…특히 AI 전방 시장의 폭발적 팽창에 따른 HBM 쇼티지 국면을 타개하기 위해 제조사들이 단행하는 DRAM 중심의 공격적인 투자에 따른 반도체 장비 시장 또한 중장기 적으로 지속 성장할 것으로 전망됩니다.\" — 원익IPS (DART 반기보고서 2026.06)\n\n> 💬 \"For the full year of 2026, we expect total CapEx to reach KRW 84.4 trillion or KRW 31.7 trillion increase from last year.\" — Daniel Oh, 삼성전자 (어닝콜 2026-10-28)\n> → 2026년 연간 총 CapEx는 전년 대비 31.7조원 늘어난 84.4조원에 이를 것으로 예상합니다.\n\n#### 소재 — 실적 🟢 · 가이던스 🟡중립\n① **실적**\n- 집계: QoQ **+4.0%**, YoY **+19.2%**, OPM **17.3%**(전년 15.1%)\n- 동진쎄미켐: **$278M**(YoY +23.6%, OPM 16.5%)\n- 한솔케미칼: **$181M**(QoQ -2.2%, YoY +5.2%, OPM 20.1%)\n- 덕산하이메탈: **$75M**(YoY **+61.9%**)\n- 에스앤에스텍: YoY +0.7%로 정체\n\n② **가이던스·전망:** 회사 가이던스 미제시. 다음 분기 컨센서스는 **-6.9% QoQ**(1사, 동진쎄미켐 4Q)다.\n\n③ **해석:** 가동률에 연동된 소모성 매출이라 성장은 안정적이다. 그러나 메모리 가격 급등의 레버리지는 제한적이다. 패키징 소재(솔더볼)만 AI 패키지 수요로 상대적 고성장 중이다.\n\n④ **기업 코멘트**\n> 💬 \"Growth Theme · AI Infra Expansion → Future MSB(FC-BGA·GPU) + CSB (2.5D Package) joint growth expected\" — 덕산하이메탈 (IR kind_20261109)\n> → 성장 테마 · AI 인프라 확장 → 향후 MSB(FC-BGA·GPU)와 CSB(2.5D 패키지)의 동반 성장 예상\n\n#### 후공정 장비 — 실적 🟢🟢 · 가이던스 🟢상향\n① **실적**\n- 집계: QoQ **+1.8%**, YoY **+54.0%**, OPM **32.9%**(전년 24.0%)\n- 디아이: **$163M**(QoQ +29.1%, YoY **+99.6%**, OPM 27.3%)\n- 한미반도체: **$136M**(QoQ **-27.9%**, YoY +8.9%, OPM **50.2%**)\n- 테크윙: **$66M**(YoY **+110.2%**)\n- 프로텍: **$59M**(YoY +53.2%, OPM 31.3%)\n\n② **가이던스·전망:** 회사 가이던스 미제시. 다음 분기 컨센서스는 **+18.3% QoQ**(2사)다. 한미반도체 4Q는 **+21.1%**, 테크윙 4Q는 **+12.4%**다.\n\n③ **해석:** HBM 고단화와 테스트 시간 증가로 TC 본더·번인·핸들러 수요가 늘고 있다. 한미반도체의 3Q 감소는 4Q에 반등할 것이라는 게 컨센서스다.\n\n④ **기업 코멘트**\n> 💬 \"- 향후전망: 글로벌고객사의메모리Fab 및패키지투자확대가지속되며, 2026년4분기~2027년까지…\" — 테크윙 (IR kind_20261110)\n\n> 💬 \"AI 서버와 데이터센터 투자 확대에 따라 고대역폭 메모리(HBM) 수요가 급증하고 있으며 메모리 칩의 적층도가 고단화 될수록 TC 본더의 중요성은 더욱 커지고 있습니다.\" — 한미반도체 (DART 반기보고서 2026.06)\n\n#### OSAT·테스트 — 실적 🟢🟢 · 가이던스 🟡중립\n① **실적**\n- 집계: QoQ **+12.0%**, YoY **+55.7%**, OPM **0.3%**(전년 2.3%)\n- 한양디지텍: **$207M**(YoY +54.6%, OPM 0.5%)\n- SFA반도체: **$111M**(YoY +53.6%, OPM **-4.4%**)\n- 에이팩트: **$44M**(YoY **+107.1%**, OPM 8.6%)\n- 큐알티: **$14M**(YoY -0.5%)\n\n② **가이던스·전망:** 회사 가이던스 미제시. 2Q 기준 기업의 3Q 컨센서스는 감소 쪽이다.\n- 하나마이크론: **-12.1%**\n- 엘비세미콘: **-11.7%**\n- 두산테스나: **-2.5%**\n\n③ **해석:** 메모리 물량 증가로 매출은 크게 늘었다. 하지만 저마진 모듈 매출과 원가 부담으로 이익률은 오히려 하락했다.\n\n④ **기업 코멘트**\n> 💬 \"최근에는 AI 발 메모리 반도체 수요가 급증하면서, 새로운 다양한 수요처가 발생하고, 특화된 메모리 생산이 확대되면서, 과거 순환하던 경기의 사이클이 구조적으로 변화하여, 당분간 공급 부족 상황이 지속될 것으로 예상하고 있습니다.\" — 에이팩트 (DART 분기보고서 2026.09)\n\n#### 파운드리 — 실적 🟡 · 가이던스 🟡중립\n① **실적** (표본 소수, 1사)\n- DB하이텍: **$302M**(QoQ **-2.7%**, YoY +7.7%, OPM **22.3%**, 전년 21.5%)\n\n② **가이던스·전망:** 회사 가이던스 미제시.\n- IR 수록 증권사 자료: 3Q 매출 4,167억원(+4% q-q), 4Q **4,536억원(+9% q-q)** 전망. 실제 3Q는 USD 기준 QoQ 감소로 이 전망에 미달했다.\n- 다른 IR 수록 자료(KB증권)는 \"컨센서스를 하회할 전망\"이라고 했다.\n- 업황 지표(Sigmaintell): 글로벌 8인치 '26년 캐파 **-6% YoY**, Q4 성숙공정 가동률 **91%** 전망\n- 가격: 3차 가격 인상 기대, 2027년 2회 인상 전망\n\n③ **해석:** 8인치 공급 축소에 따른 가격 인상은 긍정적이다. 하지만 3Q 매출이 역성장해 숫자로는 아직 확인되지 않았다.\n\n④ **기업 코멘트**\n> 💬 \"• 8인치 파운드리, 수요 증가 및 공급 축소로 ‘27년까지 가격 사이클 지속 전망\" — DB하이텍 IR 수록 증권사 자료 (IR files_682)\n\n> 💬 \"웨이퍼 수탁 생산 및 판매를 위한 Foundry 사업은, 최근 당사의 Analog & Power 공정에 대한 수요 증가로 국내 및 해외 전략고객에 대한 제품 생산을 확대하고 있습니다.\" — DB하이텍 (DART 반기보고서 2026.06)\n\n#### 전력·화합물 반도체 — 실적 🟢 · 가이던스 🟡중립\n① **실적** (표본 소수, 2사)\n- 집계: QoQ **+8.7%**, YoY **+25.6%**, OPM **7.1%**(전년 1.2%)\n- 서울반도체: **$226M**(YoY +17.7%, OPM 1.6%)\n- RFHIC: **$53M**(QoQ +38.0%, YoY **+75.5%**, OPM **30.5%**)\n\n② **가이던스·전망:** 서울반도체가 4Q 매출 **2,700~2,900억원**(환율 영향 반영)을 가이던스로 제시했다.\n\n③ **해석:** RFHIC는 방산 레이더용 GaN 수요로 고성장·고마진을 냈다. LED 중심의 서울반도체는 저마진 구조가 이어지고 있다.\n\n④ **기업 코멘트**\n> 💬 \"환율 영향을 반영한 4분기 매출 2700~2900억 원 전망\" — 서울반도체 (IR kind_20261111_19577)\n\n> 💬 \"향후 추진계획 2030년까지 국내/외 민수용 해상 레이더가 반도체 기반 기술로 교체될 전망으로…\" — RFHIC (DART 반기보고서 2026.06)\n\n#### 부품 — 실적 🟢 · 가이던스 🟢상향\n① **실적**\n- 집계: QoQ **+7.4%**, YoY **+32.4%**, OPM **27.2%**(전년 22.9%)\n- 티씨케이: **$82M**(QoQ +16.1%, YoY +38.9%, OPM 27.4%)\n- 하나머티리얼즈: **$71M**(YoY +35.8%, OPM 28.6%)\n- ISC: **$54M**(QoQ -1.6%, OPM 30.4%)\n- 샘씨엔에스: **$24M**(YoY **+54.9%**, OPM **34.7%**)\n\n② **가이던스·전망:** 회사 가이던스 미제시.\n- ISC: 2026 글로벌 테스트 소켓 시장 **+10%**, 3Q부터 SOCAMM2·HBM 중심 수주 증가, 비메모리 CPU 수요 YoY **+100% 이상**\n- 2Q 기준 기업의 3Q 컨센서스\n  - 리노공업 **-30.9%**, 티에스이 -0.8%\n  - 마이크로투나노 -33.0%. 다만 2026F 연간 매출은 394억원(+77.1%)으로 추정된다(한국IR협의회).\n\n③ **해석:** 식각 부품(SiC·실리콘 링)은 가동률 상승의 수혜를 받고 있다. 프로브카드·소켓은 DRAM과 AI 칩 테스트 수요의 수혜다. 이익률 개선 폭이 크다.\n\n④ **기업 코멘트**\n> 💬 \"- 비메모리 CPU 수요가 전년 동기 대비 100% 이상 증가하였으며 이러한 흐름은 올해 전반적으로 지속될 것으로 예상합니다.\" — ISC (DART 반기보고서 2026.06)\n\n> 💬 \"2026년 글로벌 테스트 소켓 시장은 전년 대비 10% 성장할 것으로 전망되나 테스트 소켓은 반도체 생산량과 연계되어…\" — ISC (DART 반기보고서 2026.06)\n\n#### 광통신 — 실적 🟢🟢 · 가이던스 🟡중립\n① **실적** (표본 소수, 1사)\n- 오이솔루션: **$16M**(QoQ +10.2%, YoY **+65.7%**, OPM **0.6%**, 전년 -22.1%)\n\n② **가이던스·전망:** 회사 가이던스 미제시. 2Q 기준 기업의 3Q 컨센서스는 대한광통신 **+29.1%**, 에치에프알 **+19.9%**다.\n\n③ **해석:** 흑자 전환은 했지만 규모가 작다. 데이터센터 광통신 사이클이 실적으로 확인되는 정도는 아직 제한적이다.\n\n④ **기업 코멘트**\n> 💬 \"…2026년에는 기존 5G 무선네트워크 시장 외 다양한 네트워크 시장에서 매출 증대가 기대되고 있습니다.\" — 오이솔루션 (DART 분기보고서 2026.09)\n\n### 가이던스 톤 정리\n**좋았던 곳**\n- **메모리**\n  - SK하이닉스: 4Q DRAM 출하 **20% 중반 QoQ**, 4Q HBM4가 HBM3E 비중 추월, 공급 부족 **2030년까지** 지속 전망\n  - 삼성전자: 4Q DRAM 판매량 **10% 중후반** 증가\n- **전공정 장비:** 다음 분기 컨센서스 **+28.1%**(1사). 고객 CapEx는 삼성전자 2026 **84.4조원**(+31.7조원), SK하이닉스 **40조원대 후반**이며 2027년 추가 증가가 예상된다.\n- **후공정 장비:** 컨센서스 **+18.3%**(한미반도체 **+21.1%**, 테크윙 **+12.4%**). HBM 고단화 수혜다.\n- **패키지 기판·부품:** LG이노텍 4Q 매출 **+5.5% QoQ**·영업이익 2배(IBK 추정), 삼성전기는 가격 상승을 전망했다. 부품은 ISC의 CPU 소켓 수요 **+100% 이상**이 긍정적이다.\n\n**나빴던 곳**\n- **팹리스·IP:** 다음 분기 컨센서스 **-8.5%**. LX세미콘은 3Q **-16.2% QoQ**에 4Q 컨센서스도 **-12.0%**다.\n- **소재:** 다음 분기 컨센서스 **-6.9%**(동진쎄미켐). 메모리 호황 대비 성장(YoY +19.2%)이 낮다.\n- **OSAT·테스트:** OPM **0.3%**(전년 2.3%)로 수익성이 악화됐다. 하나마이크론(**-12.1%**)·엘비세미콘(**-11.7%**)의 3Q 컨센서스도 감소다.\n- **파운드리(표본 소수):** 3Q QoQ **-2.7%**로 증권사 전망(+4%)에 미달했다. 가격 인상 효과는 아직 숫자로 확인되지 않았다."}, "JP": {"name": "일본", "flag": "🇯🇵", "tone": {"summary": "AI 장비·메모리 주도(후공정 YoY+62%), 연간 가이던스 상향 우세·다음 분기 컨센 대체로 보합", "segments": [{"seg": "소재", "tone": 1, "growth": "QoQ +4.3%, YoY +14.4%(중앙값 +18.6%), OPM 18.2%(전년 13.0%)", "guide": "레조낙 FY26 코어OP 2,500억엔(직전 예상 대비 +28%), 닛산화학 OP 668→724억엔 상향. 다음 분기 컨센 매출 -0.4% QoQ", "quote": {"text": "コア営業利益：2,500億円、前回業績予想※対比+28%", "ko": "코어 영업이익 2,500억엔, 직전 실적 예상 대비 +28%", "by": "레조낙", "src": "tdnet 2026-11-11 결산자료"}}, {"seg": "광통신", "tone": 1, "growth": "QoQ +8.7%, YoY +20.3%(중앙값 +23.9%), OPM 12.6%(전년 8.3%)", "guide": "후루카와전기 FY26 영업이익 950→1,360억엔 상향, 미쓰비시전기 FY26 매출 6조5,500억엔(+2,800억엔). 다음 분기 컨센 매출 -2.1% QoQ", "quote": {"text": "We initially forecast consolidated operating profit of JPY 95.0 billion for FY2026, but have revised the forecast upward to JPY 136.0 billion…", "ko": "당초 FY2026 연결 영업이익을 950억엔으로 예상했으나 1,360억엔으로 상향 수정했다", "by": "후루카와전기", "src": "2026-11-09 온라인 설명회 자료"}}, {"seg": "메모리", "tone": 2, "growth": "QoQ +40.3%, YoY +453.2%, OPM 80.5%(전년 19.2%) — 표본 소수(키옥시아 1사)", "guide": "회사 분기 가이던스는 자료에 없음. 다음 분기 컨센 매출 +9.8% QoQ, 2032년까지 일본 내 약 5조엔 투자 계획", "quote": {"text": "…anticipate significant investments in Japan totaling approximately 5 trillion yen (over 31 billion USD) through 2032,", "ko": "…2032년까지 일본 내 약 5조엔(310억 달러 이상) 규모의 대규모 투자를 예상", "by": "키옥시아", "src": "Semi-Annual Securities Report FY2026"}}, {"seg": "부품", "tone": 1, "growth": "QoQ +12.1%, YoY +21.0%(중앙값 +25.2%), OPM 14.6%(전년 12.9%)", "guide": "TDK 다음 분기 수동부품 매출 +3~6%·센서 -4~7% 전망, 스마트폰 생산 10억대 하회 전망. 타이요유덴 FY 매출 4,360억엔·OP 540억엔으로 상향. 다음 분기 컨센 -3.2% QoQ", "quote": {"text": "In Passive Components, we expect revenue to increase 3%-6%, driven by higher sales of various products for the automotive market and AI data centers.", "ko": "수동부품은 자동차·AI 데이터센터향 각종 제품 판매 증가로 매출이 3~6% 늘 것으로 예상한다.", "by": "Tetsuji Yamanishi, TDK", "src": "어닝콜 2026-10-30 (FY2027 Q2)"}}, {"seg": "전공정 장비", "tone": 2, "growth": "QoQ +20.8%, YoY +35.6%(중앙값 +23.8%), OPM 25.5%(전년 19.5%)", "guide": "TEL CY2027 WFE $210B 이상으로 상향, 레이저텍 FY2027 수주 4,000~5,000억엔(기존 3,000~4,000억엔), 고쿠사이 FY28/3 매출 약 +40%. 다음 분기 컨센 +0.1% QoQ", "quote": {"text": "In the same way, in calendar year 2027, we expect a similar level of growth.", "ko": "마찬가지로 2027년에도 비슷한 수준의 성장을 예상한다.", "by": "Masato Goto, 스크린홀딩스", "src": "어닝콜 2026-07-28 (FY2027 Q1)"}}, {"seg": "후공정 장비", "tone": 2, "growth": "QoQ +29.7%, YoY +61.6%(중앙값 +28.5%), OPM 50.7%(전년 38.6%)", "guide": "어드반테스트 하반기 매출 상반기 대비 약 +28%(환율 조정), 하반기 OPM 7월 예상 대비 약 +3pt. 토와 FY 매출 710억엔(+30.6%). 다음 분기 컨센 -1.9% QoQ", "quote": {"text": "So we expect to ship more systems in Q3, and then we expect to ship even higher systems than in Q4.", "ko": "3분기에 더 많은 시스템을 출하하고, 4분기에는 그보다 더 많이 출하할 것으로 예상한다.", "by": "Sanjeev Mohan, 어드반테스트", "src": "어닝콜 2026-10-28 (FY2027 Q2)"}}, {"seg": "전력·화합물 반도체", "tone": 0, "growth": "QoQ +12.4%, YoY +9.5%(중앙값 +10.3%), OPM 8.2%(전년 6.9%)", "guide": "후지전기·롬 FY 상향(롬 하반기 환율 1달러=153엔 전제), 신덴겐 하반기 기존 예상 유지, 산켄 경상이익 예상 유지. 다음 분기 컨센 +1.6% QoQ", "quote": {"text": "For the second half of the fiscal year ending March 31, 2027, the initial forecasts remain…", "ko": "2027년 3월기 하반기는 기존 예상을 유지한다…", "by": "신덴겐공업", "src": "2026-11-09 Announcement of earnings forecast revisions"}}, {"seg": "유통", "tone": 1, "growth": "QoQ +11.3%, YoY +49.0%, OPM 3.9%(전년 3.2%) — 표본 소수(마크니카 1사)", "guide": "마크니카 FY 실적 예상 상향, 연간 배당 90엔으로 증액. 다음 분기 컨센 -0.2% QoQ", "quote": {"text": "…We therefore decided to increase the annual dividend to ¥90 per…", "ko": "…이에 따라 연간 배당을 주당 90엔으로 늘리기로 했다…", "by": "마크니카", "src": "FY2026 결산설명회 자료"}}, {"seg": "IDM(로직·아날로그)", "tone": 1, "growth": "QoQ +4.2%, YoY +30.0%, 이익률은 데이터 오류로 제외 — 표본 소수(르네사스 1사)", "guide": "르네사스 4Q 매출 4,540억엔·GPM 58.0%·OPM 32.0%(1달러=157엔) 가이던스, CY2026 매출 +26.4% YoY 전망. 다음 분기 컨센 +3.7% QoQ", "quote": {"text": "Revenue and profit, JPY 454 billion for revenue and ratio 58.0%, 32.0% for OP and ForEx, dollar is JPY 157 and euro is JPY 178 expected.", "ko": "매출 4,540억엔, 매출총이익률 58.0%, 영업이익률 32.0%, 환율은 달러당 157엔·유로당 178엔을 전제로 한다.", "by": "Shuhei Shinkai, 르네사스", "src": "어닝콜 2026-10-28 (FY2026 Q3)"}}, {"seg": "클린룸·팹 인프라", "tone": 1, "growth": "QoQ +12.1%, YoY +23.9%(중앙값 +22.3%), OPM 16.8%(전년 16.3%)", "guide": "다이후쿠 연간 수주 예상 8,600~9,000억→9,700~10,000억엔으로 상향, 로체 FY 매출 1,800억엔·OP 530억엔(기초 대비 +39%). 다음 분기 컨센 -0.4% QoQ", "quote": {"text": "The full-year orders forecast was revised upward from 860,000–900,000 million yen to 970,000–1,000,000 million yen,", "ko": "연간 수주 예상을 8,600~9,000억엔에서 9,700~10,000억엔으로 상향했다.", "by": "다이후쿠", "src": "FY2026 Q3 결산단신"}}, {"seg": "패키지 기판", "tone": 1, "growth": "QoQ +13.1%, YoY +42.1%, OPM 23.9%(전년 14.3%) — 표본 소수(이비덴 1사)", "guide": "회사 가이던스 미제시(수집 자료는 2024년 자료뿐). 다음 분기 컨센 +4.0% QoQ", "quote": null}, {"seg": "팹리스·IP", "tone": 1, "growth": "QoQ +49.5%, YoY +16.1%(중앙값 +26.1%), OPM 4.4%(전년 4.7%) — 표본 소수(2사)", "guide": "소시오넥스트 FY 예상 상향, 다음 분기 컨센 +14.3% QoQ. 아크셀 9/28 FY 예상 상향", "quote": {"text": "A4. Customer demand for the new data center product has increased significantly from the initial forecast.", "ko": "신규 데이터센터 제품에 대한 고객 수요가 당초 예상보다 크게 늘었다.", "by": "소시오넥스트", "src": "IR Q&A 2026-11-06"}}], "best": ["전공정 장비", "후공정 장비", "메모리"], "worst": ["전력·화합물 반도체", "부품"]}, "md": "## 일본\n\n### 한눈에\n- **AI 반도체 장비와 메모리가 성장을 이끌었다.** 후공정 장비는 YoY **+61.6%**(OPM **50.7%**), 전공정 장비는 YoY **+35.6%**(QoQ **+20.8%**)다. 키옥시아(메모리)는 YoY **+453.2%**, OPM **80.5%**를 기록했다(표본 소수).\n- **광통신과 부품도 YoY 20%대 성장**했다. 광통신 **+20.3%**(후지쿠라 **+59.9%**), 부품 **+21.0%**다. 다만 다음 분기 컨센서스는 각각 **-2.1%**, **-3.2%** QoQ로 숨 고르기를 예상한다.\n- **약한 곳은 전력·화합물 반도체(YoY +9.5%)와 소재(YoY +14.4%)**다. 산켄전기는 OPM **-2.5%**, 레조낙은 YoY **-5.6%**, 레이저텍은 YoY **-25.5%**로 부진했다.\n- **가이던스는 연간 상향이 대세**다. TEL은 CY2027 WFE를 **$210B 이상**으로 올렸고, 레이저텍은 FY2027 수주를 **4,000~5,000억엔**으로, 어드반테스트는 하반기 매출을 상반기 대비 **약 +28%**로 제시했다. 반면 다음 분기 컨센서스는 대부분 세그먼트에서 **-3%~+0%** 수준으로 보합이다.\n\n### 밸류체인별 실적과 가이던스\n\n#### 소재 — 실적 🟡 · 가이던스 🟢상향\n- **실적:** 매출 QoQ **+4.3%**, YoY **+14.4%**(중앙값 +18.6%). OPM은 **18.2%**로 전년 13.0%에서 올랐다.\n  - 아사히카세이: **$5,404M**(YoY +15.4%, OPM 9.7%). 상반기 매출은 1조6,896억엔(+13.7%), OP는 1,654억엔(**+54.0%**)이다.\n  - 신에츠화학: **$4,746M**(YoY +15.6%, OPM **28.0%**).\n  - JX금속: YoY **+32.1%**(OPM 25.6%).\n  - 간토덴카공업: YoY **+56.9%**.\n  - 레조낙: QoQ **-11.9%**, YoY **-5.6%**로 표본 중 유일하게 역성장했다. 다만 OPM은 24.0%다.\n- **가이던스·전망:**\n  - 상향: 레조낙 FY26 코어OP **2,500억엔**(직전 예상 대비 **+28%**, EBITDA 마진 27.4%), 닛산화학 OP 668억엔→**724억엔**(사상 최고), 미쓰이금속 FY OP **990억엔**(+50억엔). 아사히카세이(3기 연속 최고이익 목표), 아지노모토, JX금속, 도쿄오카공업, 린텍, 도요고세이도 상향했다.\n  - 유지: 신에츠화학(통기 예상 유지), 닛폰산소(5월 예상 유지, 코어OP 진척률 52.3%).\n  - 다음 분기 컨센서스: 매출 **-0.4%** QoQ(23사).\n- **해석:** 반도체·전자재료 비중이 높은 기업이 상향을 이끌었다. 레조낙 반도체·전자재료는 상반기 코어OP **+92%**였다. 범용 화학과 웨이퍼(섬코 OPM 1.7%)는 아직 회복이 더뎌 세그먼트 YoY는 보통 수준에 그쳤다.\n\n> 💬 \"コア営業利益：2,500億円、前回業績予想※対比+28%\" — 레조낙 (tdnet 2026-11-11)\n> → 코어 영업이익 2,500억엔, 직전 실적 예상 대비 +28%\n\n> 💬 \"営業利益は、5月発表予想の668億円に対し、７２４億円に上方修正(過去最高益)\" — 닛산화학 (tdnet 2026-11-09)\n> → 영업이익을 5월 발표 예상 668억엔에서 724억엔으로 상향(사상 최고 이익)\n\n#### 광통신 — 실적 🟢 · 가이던스 🟢상향\n- **실적:** 매출 QoQ **+8.7%**, YoY **+20.3%**(중앙값 +23.9%). OPM은 **12.6%**로 전년 8.3%에서 올랐다.\n  - 미쓰비시전기: **$10,189M**(YoY +14.7%, OPM 12.3%).\n  - 스미토모전기: **$8,977M**(YoY +17.1%).\n  - 후지쿠라: **$2,913M**(YoY **+59.9%**, OPM **28.0%**).\n  - 산텍: YoY **+79.1%**(OPM 39.2%).\n- **가이던스·전망:**\n  - 미쓰비시전기: FY26 매출 **6조5,500억엔**(+2,800억엔), 조정OP **7,100억엔**(+900억엔).\n  - 후루카와전기: FY26 OP 950억엔→**1,360억엔**. FY27에 1,700억엔을 당초보다 1년 앞당겨 달성하는 것을 목표로 한다.\n  - 스미토모전기: 정보통신 부문이 과거 최고이익(774억엔)을 대폭 경신할 전망이다.\n  - 후지쿠라: 매출은 상향했지만, 하반기 환율 전제를 160엔→156엔으로 바꾼 영향을 이익에 반영했다.\n  - 다음 분기 컨센서스: **-2.1%** QoQ(10사).\n- **해석:** AI 데이터센터용 광섬유·케이블 수요가 견조해 연간 이익 상향이 잇따랐다. 다음 분기 컨센서스 약세는 계절성과 엔고 전제 영향으로 보인다.\n\n> 💬 \"We initially forecast consolidated operating profit of JPY 95.0 billion for FY2026, but have revised … the forecast upward to JPY 136.0 billion\" — 후루카와전기 (2026-11-09 설명회 자료)\n> → 당초 FY2026 연결 영업이익을 950억엔으로 예상했으나 1,360억엔으로 상향 수정했다\n\n> 💬 \"情報通信セグメントは、過去最高益(2025年度:774億円)を大幅に更新する見通し。\" — 스미토모전기 (2026-11 CEO 설명자료)\n> → 정보통신 부문은 과거 최고이익(2025년도 774억엔)을 크게 경신할 전망\n\n#### 메모리 — 실적 🟢🟢 · 가이던스 🟢강한 상향\n- **실적(표본 소수, 키옥시아 1사):** 매출 **$15,521M**, QoQ **+40.3%**, YoY **+453.2%**. OPM은 **80.5%**로 전년 19.2%에서 급등했다.\n- **가이던스·전망:** 회사의 분기 가이던스 수치는 자료에 없다. 다음 분기 컨센서스는 매출 **+9.8%** QoQ다. 회사는 2032년까지 일본 내 **약 5조엔(310억 달러 이상)** 투자를 예상한다고 밝혔다.\n- **해석:** NAND 가격 상승과 AI 스토리지 수요가 겹쳐 이익률이 이례적인 수준까지 올랐다. 컨센서스도 추가 성장을 예상한다.\n\n> 💬 \"…anticipate significant investments in Japan totaling approximately 5 trillion yen (over 31 billion USD) through 2032,\" — 키옥시아 (Semi-Annual Securities Report FY2026)\n> → …2032년까지 일본 내 약 5조엔(310억 달러 이상) 규모의 대규모 투자를 예상\n\n#### 부품 — 실적 🟢 · 가이던스 🟢상향\n- **실적:** 매출 QoQ **+12.1%**, YoY **+21.0%**(중앙값 +25.2%). OPM은 **14.6%**(전년 12.9%)다.\n  - TDK: **$5,129M**(YoY +26.6%, OPM 14.9%).\n  - 알프스알파인: QoQ +28.2%, YoY +14.3%, OPM **4.6%**.\n  - 마이크로닉스재팬: YoY **+89.4%**(OPM 34.9%).\n  - 마루와: YoY **+74.4%**(OPM 40.7%).\n- **가이던스·전망:**\n  - TDK: 다음 분기 수동부품 매출 **+3~6%**, 센서 **-4~7%**, 니어라인 HDD 헤드 출하 약 **+5%**를 예상한다. 메모리 부족 탓에 스마트폰 생산은 **10억대 미만**으로 줄 것으로 본다. ROIC 전망은 8%→**9.7%**로 올렸다.\n  - 타이요유덴: FY 매출 **4,360억엔**(+23%), OP **540억엔**(+170%)으로 상향했다.\n  - 야마이치전자: 매출 **675억엔**, OP **162억엔**으로 상향했다.\n  - 알프스알파인: 통기 예상을 유지했고, 하반기 매출은 상반기보다 줄 것으로 본다.\n  - 다음 분기 컨센서스: **-3.2%** QoQ(12사).\n- **해석:** AI 서버용 MLCC·인덕터와 프로브카드·소켓 쪽은 강하다. 반면 스마트폰과 게임 수요는 약해 같은 세그먼트 안에서도 명암이 갈린다.\n\n> 💬 \"In Passive Components, we expect revenue to increase 3%-6%, driven by higher sales of various products for the automotive market and AI data centers.\" — Tetsuji Yamanishi, TDK (어닝콜 2026-10-30)\n> → 수동부품은 자동차·AI 데이터센터향 각종 제품 판매 증가로 매출이 3~6% 늘 것으로 예상한다.\n\n> 💬 \"Given the greater impact expected from memory supply shortages, we now project a further 5% point year-on-year decline, taking production below 1.1 billion units.\" — Tetsuji Yamanishi, TDK (어닝콜 2026-10-30)\n> → 메모리 공급 부족 영향이 더 커질 것으로 보여 전년 대비 5%p 추가 감소를 예상하며, 생산은 11억대를 밑돌 전망이다.\n\n#### 전공정 장비 — 실적 🟢 · 가이던스 🟢강한 상향\n- **실적:** 매출 QoQ **+20.8%**, YoY **+35.6%**(중앙값 +23.8%). OPM은 **25.5%**(전년 19.5%)다.\n  - 도쿄일렉트론: **$5,852M**(QoQ +27.7%, YoY **+48.4%**, OPM **31.6%**).\n  - 스크린홀딩스: QoQ **+53.3%**, YoY +34.8%.\n  - 울박: YoY +39.0%.\n  - 레이저텍: QoQ **-33.8%**, YoY **-25.5%**로 역성장했다(OPM 39.1%).\n- **가이던스·전망:**\n  - TEL: CY2027 WFE 전망을 **$210B 이상**으로 올렸다. FY2027 제품별 전망은 도포·현상 장비 **+50% 초과**, 식각 장비 **+25% 초과**다.\n  - 스크린: WFE를 CY2026 **약 +20%**, CY2027도 비슷한 수준으로 본다. FY 가이던스는 매출 **7,430억엔**, OP **1,565억엔**(7월 상향)이고, 설비투자 계획은 430억엔→**580억엔**으로 늘렸다.\n  - 레이저텍: FY2027 수주 전망을 **4,000~5,000억엔**(기초 3,000~4,000억엔)으로 올렸다. FY 매출 2,900억엔, OP 1,250억엔은 유지했다.\n  - 고쿠사이: 2Q 수주는 **약 1,670억엔**이었고, FY28/3 매출은 **약 +40%**를 예상한다.\n  - 시바우라: 매출 990억엔→**1,050억엔**으로 상향했다.\n  - 다음 분기 컨센서스: **+0.1%** QoQ(6사). TEL은 -3.6%, 니콘은 +11.7%다.\n- **해석:** DRAM·HBM과 첨단 로직 투자가 동시에 늘면서 수주와 WFE 전망이 함께 올라갔다. 하반기에는 가격 개정 효과도 기대된다. 레이저텍 매출 부진은 수주 전망 상향과 대비된다.\n\n> 💬 \"As I mentioned a moment ago, for the whole WFE in calendar year 2026, we expect about 20% growth.\" — Masato Goto, 스크린홀딩스 (어닝콜 2026-07-28)\n> → 앞서 말했듯 2026년 전체 WFE는 약 20% 성장을 예상한다.\n\n> 💬 \"Now I'd like to talk about the outlook for orders in FY2027. It is going to be JPY400 billion to JPY500 billion,\" — 레이저텍 (FY 결산설명회 자료)\n> → FY2027 수주 전망을 말씀드리겠다. 4,000억~5,000억엔이 될 것이다.\n\n#### 후공정 장비 — 실적 🟢🟢 · 가이던스 🟢강한 상향\n- **실적:** 매출 QoQ **+29.7%**, YoY **+61.6%**(중앙값 +28.5%). OPM은 **50.7%**(전년 38.6%)다.\n  - 어드반테스트: **$2,990M**(QoQ +30.0%, YoY **+81.7%**, OPM **55.8%**).\n  - 디스코: **$893M**(YoY +36.4%, OPM 47.2%).\n  - 도쿄세이미츠: QoQ **+51.7%**.\n- **가이던스·전망:**\n  - 어드반테스트: SoC 테스터 매출 전망을 크게 올렸다. 하반기 매출은 상반기 대비 **약 +28%**(환율 조정)로, 하반기 OPM은 7월 예상보다 **약 +3pt** 높게 본다. OPM은 50% 초반에 안착할 전망이다. SoC 점유율은 66%에서 **70%+**를 목표로 하고, 생산능력은 5천대→**1만대**로 앞당겨 늘린다.\n  - 토와: FY 매출 **710억엔**(+30.6%), OP **131.5억엔**(기존 102.4억엔)으로 상향했다.\n  - 도쿄세이미츠: FY 매출 **1,920억엔**으로 상향했다(배당 304엔→316엔).\n  - 다음 분기 컨센서스: **-1.9%** QoQ(4사). 도쿄세이미츠 -22.7%, 디스코 +3.2%다.\n- **해석:** AI GPU·ASIC 테스트 시간이 길어지고, 파운드리 파트너가 2029년까지 50%대 중후반 CAGR을 예상하는 등 구조적 성장이 확인된다. DDR 등 부품 가격 상승은 마진 부담 요인이다.\n\n> 💬 \"So we expect to ship more systems in Q3, and then we expect to ship even higher systems than in Q4.\" — Sanjeev Mohan, 어드반테스트 (어닝콜 2026-10-28)\n> → 3분기에 더 많은 시스템을 출하하고, 4분기에는 그보다 더 많이 출하할 것으로 예상한다.\n\n> 💬 \"…the foundry partners who are looking at the CAGRs of mid- to high 50s all the way through '29.\" — Douglas Lefever, 어드반테스트 (어닝콜 2026-10-28)\n> → …파운드리 파트너들은 2029년까지 50%대 중후반 CAGR을 보고 있다.\n\n#### 전력·화합물 반도체 — 실적 🟡 · 가이던스 🟡중립\n- **실적:** 매출 QoQ **+12.4%**, YoY **+9.5%**(중앙값 +10.3%). OPM은 **8.2%**(전년 6.9%)다.\n  - 후지전기: **$2,003M**(QoQ +17.1%, YoY +8.4%, OPM 10.8%).\n  - 롬: **$900M**(YoY +12.3%, OPM 5.5%).\n  - 신덴겐: OPM **1.0%**.\n  - 산켄전기: YoY **-1.0%**, OPM **-2.5%**.\n- **가이던스·전망:**\n  - 후지전기: 연간 예상을 상향했고 기말배당을 **130엔**으로 늘렸다.\n  - 롬: 연간 예상을 상향했다(하반기 환율 **1달러=153엔** 전제).\n  - 신덴겐: 하반기는 기존 예상을 유지했다.\n  - 산켄: 경상이익·순이익 예상을 유지했다.\n  - 다음 분기 컨센서스: **+1.6%** QoQ(4사). 롬은 -4.1%, 산켄은 +20.5%다.\n- **해석:** 산업·자동차향 파워 반도체는 AI 수혜가 제한적이어서 이익률 회복이 더디다. 상향 폭도 다른 세그먼트보다 작다.\n\n> 💬 \"For the second half of the fiscal year ending March 31, 2027, the initial forecasts remain…\" — 신덴겐공업 (2026-11-09 Announcement of earnings forecast revisions)\n> → 2027년 3월기 하반기는 기존 예상을 유지한다…\n\n#### 유통 — 실적 🟢 · 가이던스 🟢상향\n- **실적(표본 소수, 마크니카 1사):** 매출 **$2,740M**, QoQ **+11.3%**, YoY **+49.0%**. OPM은 **3.9%**(전년 3.2%)다.\n- **가이던스·전망:** FY 실적 예상을 상향했고 연간 배당을 **90엔**으로 늘렸다. 설명회 Q&A에서는 2Q 마진 **7.1%**가 하반기에 high-8%대로 회복된다는 가정이 언급됐다. 다음 분기 컨센서스는 **-0.2%** QoQ다.\n- **해석:** AI 관련 반도체 유통 수요가 매출을 끌어올렸다. 다만 유통업 특성상 이익률은 낮은 수준에 머문다.\n\n> 💬 \"…We therefore decided to increase the annual dividend to ¥90 per…\" — 마크니카 (FY2026 결산설명회 자료)\n> → …이에 따라 연간 배당을 주당 90엔으로 늘리기로 했다…\n\n#### IDM(로직·아날로그) — 실적 🟢 · 가이던스 🟢상향\n- **실적(표본 소수, 르네사스 1사):** 매출 **$2,728M**, QoQ **+4.2%**, YoY **+30.0%**. **영업이익 데이터 오류로 이익률은 제외했다.**\n- **가이던스·전망:** 4Q 가이던스는 매출 **4,540억엔**, GPM **58.0%**, OPM **32.0%**다(1달러=157엔, 1유로=178엔). CY2026 매출은 **+26.4%** YoY로 마무리될 것으로 보며, 환율 효과를 빼면 약 +20%다. 다음 분기 컨센서스는 **+3.7%** QoQ다.\n- **해석:** 자동차(28nm MCU, R-Car)는 계획을 웃돌았고, 데이터센터와 산업용 AI·반도체 관련 수요도 늘었다. 7월부터 일부 제품 가격을 올린 효과도 하반기에 반영된다.\n\n> 💬 \"Revenue and profit, JPY 454 billion for revenue and ratio 58.0%, 32.0% for OP and ForEx, dollar is JPY 157 and euro is JPY 178 expected.\" — Shuhei Shinkai, 르네사스 (어닝콜 2026-10-28)\n> → 매출 4,540억엔, 매출총이익률 58.0%, 영업이익률 32.0%, 환율은 달러당 157엔·유로당 178엔을 전제로 한다.\n\n> 💬 \"So if I try to summarize for the full year of 2026 on a year-on-year basis, 26.4% revenue increase is expected for the landing.\" — Shuhei Shinkai, 르네사스 (어닝콜 2026-10-28)\n> → 2026년 연간으로 요약하면 전년 대비 매출 26.4% 증가로 마무리될 전망이다.\n\n#### 클린룸·팹 인프라 — 실적 🟢 · 가이던스 🟢상향\n- **실적:** 매출 QoQ **+12.1%**, YoY **+23.9%**(중앙값 +22.3%). OPM은 **16.8%**(전년 16.3%)다.\n  - 다이후쿠: **$1,241M**(YoY +24.3%, OPM 13.5%).\n  - 로체: YoY **+30.7%**(OPM **30.3%**).\n  - 신포니아: QoQ **+45.4%**.\n- **가이던스·전망:**\n  - 다이후쿠: 연간 수주 예상을 8,600~9,000억엔에서 **9,700~10,000억엔**으로 올렸다(Eisenmann 포함).\n  - 로체: FY 매출 **1,800억엔**(+209억엔), OP **530억엔**(기초 대비 **+39%**)으로 상향했다.\n  - 신포니아: 연간 예상을 상향했다.\n  - 재팬머티리얼: 예상을 유지했다.\n  - 다음 분기 컨센서스: **-0.4%** QoQ(4사). 신포니아 -16.9%다.\n- **해석:** 반도체 팹 증설로 웨이퍼 이송·자동화 장비 수주가 급증하고 있다. 연간 전망 상향 폭이 크다.\n\n> 💬 \"The full-year orders forecast was revised upward from 860,000–900,000 million yen to 970,000–1,000,000 million yen,\" — 다이후쿠 (FY2026 Q3 결산단신)\n> → 연간 수주 예상을 8,600~9,000억엔에서 9,700~10,000억엔으로 상향했다.\n\n> 💬 \"半導体関連装置の受注急増により、通期売上高は209億円増の1,800億円へ上方修正\" — 로체 (tdnet 2026-10-08)\n> → 반도체 관련 장치 수주 급증으로 연간 매출을 209억엔 늘린 1,800억엔으로 상향\n\n#### 패키지 기판 — 실적 🟢 · 가이던스 🟢상향\n- **실적(표본 소수, 이비덴 1사):** 매출 **$872M**, QoQ **+13.1%**, YoY **+42.1%**. OPM은 **23.9%**(전년 14.3%)다.\n- **가이던스·전망:** 회사 가이던스 미제시(수집 자료는 2024년 자료뿐). 다음 분기 컨센서스는 **+4.0%** QoQ다.\n- **해석:** AI 서버용 ABF 기판 수요로 이익률이 1년 새 약 10%p 올랐다. 컨센서스도 성장 지속을 예상한다.\n\n#### 팹리스·IP — 실적 🟢 · 가이던스 🟢상향\n- **실적(표본 소수, 2사):** 매출 QoQ **+49.5%**, YoY **+16.1%**. OPM은 **4.4%**(전년 4.7%)다.\n  - 소시오넥스트: **$378M**(QoQ **+54.7%**, YoY +14.7%, OPM 3.9%).\n  - 아크셀: YoY **+37.5%**.\n- **가이던스·전망:** 소시오넥스트는 FY 예상을 4월 대비 상향했다. 하반기 양산하는 신규 데이터센터 제품의 수요가 크게 늘었다. 다음 분기 컨센서스는 **+14.3%** QoQ다. 아크셀은 9/28 FY 예상을 상향했다.\n- **해석:** 데이터센터 ASIC이 매출을 끌어올리고 있다. 다만 이익률은 아직 낮다.\n\n> 💬 \"A4. Customer demand for the new data center product has increased significantly from the initial forecast.\" — 소시오넥스트 (IR Q&A 2026-11-06)\n> → 신규 데이터센터 제품에 대한 고객 수요가 당초 예상보다 크게 늘었다.\n\n### 가이던스 톤 정리\n**좋았던 곳**\n- **전공정 장비:** TEL은 CY2027 WFE를 **$210B 이상**으로 올렸다. 레이저텍 FY2027 수주는 **4,000~5,000억엔**(+1,000억엔), 고쿠사이 FY28/3 매출은 **약 +40%**, 스크린은 WFE를 CY26·CY27 각 **약 +20%**로 본다.\n- **후공정 장비:** 어드반테스트는 하반기 매출을 상반기 대비 **+28%**로, 하반기 OPM을 7월보다 **+3pt** 높게 본다. 토와 FY 매출은 **710억엔**(+30.6%)이다.\n- **메모리(표본 소수):** 키옥시아 다음 분기 컨센서스는 **+9.8%** QoQ이고, OPM은 **80.5%**다.\n- **클린룸·팹 인프라와 광통신:** 다이후쿠 수주 예상은 **9,700~10,000억엔**, 후루카와 FY OP는 **1,360억엔**(+43%), 미쓰비시전기 조정OP는 **7,100억엔**(+900억엔)이다.\n\n**나빴던 곳**\n- **전력·화합물 반도체:** YoY **+9.5%**로 가장 낮다. 산켄전기는 OPM **-2.5%**, 신덴겐은 OPM **1.0%**이고, 하반기 예상은 대체로 유지에 그쳤다.\n- **부품:** 다음 분기 컨센서스가 **-3.2%** QoQ로 가장 약하다. TDK는 스마트폰 생산 **10억대 미만**과 센서 **-4~7%**를 예상했고, 알프스알파인은 하반기 매출이 상반기보다 줄 것으로 본다.\n- **개별 부진:** 레이저텍 YoY **-25.5%**, 레조낙 YoY **-5.6%**(다만 연간 코어OP는 상향), 도쿄세이미츠 다음 분기 컨센서스 **-22.7%**다."}, "CN": {"name": "중국", "flag": "🇨🇳", "tone": {"summary": "광통신(YoY +68%)·메모리(+153%)가 주도. 4Q 컨센은 광통신·장비 상향, 메모리·팹리스 둔화", "segments": [{"seg": "광통신", "tone": 2, "growth": "매출 $16,474M, QoQ +10.0%, YoY +67.6%, OPM 28.0%(전년 동기 16.4%)", "guide": "회사 가이던스 미제시. 4Q 컨센 매출 +9.4% QoQ(9사), 이노라이트 +33.0%, 형통광전 -7.5%", "quote": {"text": "…expected to reach US$111 billion by 2030, with a CAGR of 31.6% from 2026 to 2030.", "ko": "…2030년까지 1,110억 달러에 이를 것으로 예상되며, 2026~2030년 연평균 성장률은 31.6%이다.", "by": "중제욱창(이노라이트)", "src": "HKEX 공시 2026-09-11"}}, {"seg": "팹리스·IP", "tone": -1, "growth": "매출 $7,698M, QoQ +11.9%, YoY +53.3%, OPM 23.4%(전년 동기 16.4%)", "guide": "4Q 컨센 매출 -5.3% QoQ(12사): 더밍리 -32.9%, 잉게닉 -20.4% vs 하이곤 +23.9%, 몬타주 +16.5%. 암로직은 연간 매출 +25~45% YoY 범위의 상단 제시", "quote": {"text": "展望全年，本年度营业收入有望实现年度预告中25%-45%同比增长的上限，力争突破100 亿元。", "ko": "연간으로는 올해 매출이 연간 , 양지에 +3.1%", "quote": null}, {"seg": "클린룸·팹 인프라", "tone": 0, "growth": "매출 $554M, QoQ +20.2%, YoY +6.9%, OPM 11.2%(전년 동기 9.6%)", "guide": "회사 가이던스 미제시. 4Q 컨센 매출 +2.6% QoQ(지순과기 1사)", "quote": null}, {"seg": "IDM(로직·아날로그)", "tone": 1, "growth": "실란 매출 $551M, QoQ -1.8%, YoY +8.8%, OPM 2.4%", "guide": "회사 가이던스 미제시. 4Q 컨센 매출 +12.0% QoQ(1사)", "quote": null}, {"seg": "후공정 장비", "tone": 1, "growth": "장천과기 매출 $372M, QoQ +19.2%, YoY +53.9%, OPM 32.5%", "guide": "회사 가이던스 미제시. 4Q 컨센 매출 +11.9% QoQ(1사)", "quote": null}], "best": ["광통신", "전공정 장비", "소재"], "worst": ["메모리", "팹리스·IP", "패키지 기판"]}, "md": "## 중국\n\n### 한눈에\n- **AI 인프라가 주도했습니다.** 광통신 매출은 **$16,474M**로 **YoY +67.6%**, 영업이익률은 **28.0%**(전년 동기 16.4%)입니다. 메모리는 **YoY +153.4%**, 영업이익률 **45.3%**로 이익 측면에서 가장 강했습니다. 패키지 기판(**YoY +60.2%**, **QoQ +21.0%**)과 팹리스·IP(**YoY +53.3%**)도 고성장했습니다.\n- **성장이 약했던 곳**은 전공정 장비(**YoY +6.3%**, 영업이익률 16.3%→**12.7%**로 하락)와 전력·화합물 반도체(**YoY +1.5%**, 산안광전 -26.1%)입니다.\n- **4Q 컨센서스는 엇갈립니다.** 상향 쪽은 광통신(**+9.4% QoQ**), 전공정 장비(**+27.0%**, 3사 한정), 소재(**+12.5%**)입니다. 둔화 쪽은 메모리(**-13.1%**)와 팹리스·IP(**-5.3%**)로, 스토리지·메모리 계열이 고점을 지나는 모습입니다.\n- **파운드리는 회사 가이던스가 컨센서스보다 좋습니다.** SMIC의 4Q 가이던스는 매출 **+4~6% QoQ**, GM **26~28%**로 컨센서스 +0.9%를 웃돕니다. 화홍은 매출 **약 $1,080~1,090M**, GM **25~26%**를 제시했습니다.\n\n### 밸류체인별 실적과 가이던스\n\n#### 광통신 — 실적 🟢🟢 · 가이던스 🟢강한 상향\n- **실적**: 17사 매출 **$16,474M**, QoQ **+10.0%**, YoY **+67.6%**(중앙값 +80.3%), 영업이익률 **28.0%**(전년 동기 16.4%)입니다.\n  - 이노라이트(중제욱창): 매출 **$4,162M**, QoQ +24.6%, YoY **+171.8%**, OPM 42.3%\n  - YOFC(장비광섬유): 매출 **$1,396M**, QoQ +52.4%, YoY +139.4%, OPM 42.6%\n  - 이옵토링크(신이성): 매출 $1,640M, QoQ **-13.0%**, YoY +80.3%, OPM 44.0%\n  - 형통광전: 매출 $3,348M, QoQ -7.8%, YoY +27.1%, OPM 15.4%\n- **가이던스·전망**: 회사 가이던스는 미제시입니다. 4Q 컨센서스는 매출 **+9.4% QoQ**(9사)입니다.\n  - 상향: 이노라이트 **+33.0%**, 영정주식 +32.1%, 박창과기 +24.1%, 광신과기 +10.3%\n  - 하향: 원걸과기 **-36.1%**, 형통광전 -7.5%, 중천과기 -4.9%\n- **해석**: 성장의 중심은 AI 데이터센터용 고속 트랜시버(이노라이트)와 광섬유(YOFC)입니다. 4Q에도 컨센서스는 선두 업체 위주로 높은 증가세를 예상합니다. 반면 통신·전력 케이블 비중이 큰 형통광전·중천과기는 역성장이 예상돼 업체 간 격차가 큽니다.\n> 💬 \"…expected to reach US$111 billion by 2030, with a CAGR of 31.6% from 2026 to 2030.\" — 중제욱창(이노라이트) (HKEX 공시 2026-09-11)\n> → \"…2030년까지 1,110억 달러에 이를 것으로 예상되며, 2026~2030년 연평균 성장률은 31.6%이다.\" (발췌만으로는 대상 시장을 특정할 수 없습니다)\n\n#### 팹리스·IP — 실적 🟢🟢 · 가이던스 🟠둔화\n- **실적**: 21사 매출 **$7,698M**, QoQ **+11.9%**, YoY **+53.3%**(중앙값 +29.8%), 영업이익률 **23.4%**(전년 동기 16.4%)입니다.\n  - 더밍리(德明利): 매출 **$1,745M**, YoY **+356.6%**, OPM 29.8%\n  - 하이곤(해광신식): 매출 $878M, QoQ +15.6%, YoY +45.5%\n  - 캄브리콘(한무기): 매출 $529M, YoY **+104.5%**, OPM 38.1%\n  - 몬타주(란치과기): 매출 $312M, YoY +46.0%, OPM **47.9%**\n  - 역성장: 자광궈신 YoY -23.9%, 베스테크닉 -20.0%\n- **가이던스·전망**: 4Q 컨센서스는 매출 **-5.3% QoQ**(12사)입니다.\n  - 하향: 더밍리 **-32.9%**, 잉게닉 -20.4%\n  - 상향: 베리실리콘 +29.1%, 하이곤 **+23.9%**, 몬타주 +16.5%\n  - 암로직은 연간 매출 성장률을 예고 범위(+25~45% YoY)의 **상단**으로 제시하고, 100억 위안 돌파를 목표로 내세웠습니다.\n- **해석**: AI 가속기(하이곤)와 메모리 인터커넥트(몬타주)는 4Q에도 증가가 예상됩니다. 반면 메모리 가격 상승의 수혜를 받았던 스토리지·메모리 IC 업체(더밍리, 잉게닉)는 큰 폭의 QoQ 감소가 예상돼 세그먼트 합계를 끌어내립니다.\n> 💬 \"展望全年，本年度营业收入有望实现年度预告中25%-45%同比增长的上限，力争突破100 亿元。\" — 암로직(정신과기) (3Q26 IR 자료 2026-10-30)\n> → \"연간으로는 올해 매출이 연간 실적 예고에서 제시한 전년 대비 25~45% 성장 범위의 상단을 달성할 것으로 보이며, 100억 위안 돌파를 목표로 한다.\"\n\n> 💬 \"tight supply of DRAM products is not expected to ease in the second half of 2026…\" — 잉게닉 (HKEX 공시 2026-08-28)\n> → \"DRAM 제품의 공급 부족은 2026년 하반기에도 완화되지 않을 것으로 예상된다…\"\n\n#### OSAT·테스트 — 실적 🟢 · 가이던스 🟡중립\n- **실적**: 3사 매출 **$3,976M**, QoQ **+7.7%**, YoY **+22.0%**, 영업이익률 **11.0%**(전년 동기 7.0%)입니다.\n  - JCET(장전과기): 매출 $1,712M, QoQ +10.3%, YoY +13.5%, OPM 7.4%\n  - 통푸미전: 매출 $1,325M, YoY +25.0%, OPM **18.1%**\n  - 화천과기: 매출 $938M, YoY **+36.1%**, OPM 7.7%\n- **가이던스·전망**: 회사 가이던스는 미제시입니다. 4Q 컨센서스는 매출 **+0.7% QoQ**(3사)이며, JCET **+11.5%**, 통푸미전 -0.1%, 화천과기 **-18.0%**입니다.\n- **해석**: 이익률은 개선됐습니다. 다만 4Q는 업체별 차이가 큰 가운데 합계로는 정체가 예상됩니다.\n\n#### 전공정 장비 — 실적 🟡 · 가이던스 🟢강한 상향\n- **실적**: 10사 매출 **$3,837M**, QoQ **+8.5%**, YoY **+6.3%**(중앙값 +17.1%), 영업이익률 **12.7%**(전년 동기 16.3%, 하락)입니다.\n  - 나우라(북방화창): 매출 **$1,694M**, QoQ +14.9%, YoY **+1.3%**, OPM 15.8%\n  - AMEC(중미공사): 매출 $545M, QoQ -3.7%, YoY +17.2%\n  - CFMEE(심기미장): 매출 $101M, YoY **+142.1%**\n  - 징성기전: 매출 $294M, YoY -20.7%, OPM -1.8%\n- **가이던스·전망**: 회사 가이던스는 미제시입니다. 4Q 컨센서스는 매출 **+27.0% QoQ**이지만 3사 한정이며, 피오테크 **+32.5%**, ACM상하이 +28.7%, 화해청과 +16.5%입니다. 나우라·AMEC에는 컨센서스가 없습니다.\n- **해석**: 3Q는 최대 업체 나우라의 YoY 성장이 사실상 멈추고 이익률이 하락해 부진했습니다. 4Q 컨센서스는 증착·세정 업체 위주로 연말 인도 집중을 반영해 반등을 예상합니다. 다만 표본이 제한적입니다.\n\n#### 파운드리 — 실적 🟢 · 가이던스 🟢상향\n- **실적**: 표본 2/3사(SMIC·넥스칩) 매출 **$3,693M**, QoQ **+7.3%**, YoY **+30.9%**, 영업이익률 **20.8%**(전년 동기 13.3%)입니다. 화홍반도체는 2026년부터 보고통화가 바뀌어 YoY 비교와 집계에서 제외했습니다.\n  - SMIC: 매출 **$3,190M**, QoQ +6.1%, YoY **+33.9%**, OPM 22.3%\n  - 화홍: 매출 $987M, QoQ +9.9%, OPM 23.0%\n  - 넥스칩: 매출 $503M, QoQ +10.2%, YoY +14.4%\n- **가이던스·전망**:\n  - SMIC: 4Q 매출 **+4~6% QoQ**, GM **26~28%**. 4Q 컨센서스 +0.9%를 웃돕니다.\n  - 화홍: 4Q 매출 **약 $1,080~1,090M**, GM **25~26%**\n  - 넥스칩: 4Q 컨센서스 +1.5%. 4Q 회사 가이던스는 자료에 없습니다.\n  - 세그먼트 컨센서스: **+1.0% QoQ**(2사)\n- **해석**: 국산화 수요로 가동률이 유지되면서 회사 가이던스가 컨센서스보다 강합니다. 마진 가이던스도 높은 수준입니다.\n> 💬 \"In the fourth quarter, the Company’s revenue is expected to increase 4% to 6% sequentially, and the gross margin is expected to be in the range of 26% to 28%.\" — SMIC(중신궈지) (HKEX 3Q26 실적 공시 2026-11-12)\n> → \"4분기 매출은 전 분기 대비 4~6% 증가하고, 매출총이익률은 26~28% 범위로 예상된다.\"\n\n> 💬 \"We expect revenue to be approximately US$1,080 million to US$1,090 million. … We expect gross margin to be in the range of 25% to 26%.\" — 화홍반도체 (HKEX 공시 2026-11-05, Fourth Quarter 2026 Guidance)\n> → \"매출은 약 10.8억~10.9억 달러, 매출총이익률은 25~26% 범위로 예상한다.\"\n\n#### 메모리 — 실적 🟢🟢 · 가이던스 🔴악화\n- **실적**: 2사(표본 소수) 매출 **$3,501M**, QoQ **+8.4%**, YoY **+153.4%**, 영업이익률 **45.3%**(전년 동기 11.3%)입니다.\n  - 기가디바이스(조역창신): 매출 $1,309M, QoQ +18.4%, YoY **+225.6%**, OPM **59.6%**\n  - 롱시스(강파룡): 매출 $2,193M, QoQ +3.2%, YoY +123.7%, OPM 36.8%\n- **가이던스·전망**: 회사 가이던스는 미제시입니다. 4Q 컨센서스는 매출 **-13.1% QoQ**이며, 롱시스 -12.4%, 기가디바이스 -14.3%입니다.\n- **해석**: 가격 상승 사이클로 이익이 사상 최고 수준까지 올라왔습니다. 그러나 컨센서스는 4Q 매출이 두 자릿수로 감소한다고 보고 있어, 모멘텀 고점 통과 신호로 읽힙니다.\n\n#### 소재 — 실적 🟢 · 가이던스 🟢상향\n- **실적**: 11사 매출 **$3,093M**, QoQ **+10.9%**, YoY **+19.2%**, 영업이익률 **-1.7%**(전년 동기 -4.9%)입니다.\n  - TCL중환: 매출 $1,379M, QoQ +18.5%, OPM **-18.8%**\n  - NSIG(호규실업): YoY +39.8%, OPM -30.1%\n  - SICC(천악선진): YoY **+102.9%**\n  - 안지미전자: OPM 36.0%\n  - 딩롱: OPM 35.5%\n- **가이던스·전망**: 회사 가이던스는 미제시입니다. 4Q 컨센서스는 매출 **+12.5% QoQ**(5사)이며, 딩롱 +17.5%, NSIG +14.4%, 안지미전자 +12.2%, 리앙웨이 +10.4%입니다.\n- **해석**: 웨이퍼 업체(TCL중환, NSIG)의 적자 때문에 세그먼트 합계는 여전히 적자입니다. CMP 소재·습식케미컬 업체는 고마진을 유지하고 있고, 신제품 출시가 4Q 성장 동력입니다.\n> 💬 \"…已布局6款产品，其中两款主流产品计划第四季度推向市场，有望成为高端晶圆光刻胶业务板块新增长…\" — 딩롱 (3Q26 공시 2026-10-28)\n> → \"…제품 6종을 준비했으며, 그중 주력 제품 2종을 4분기에 출시할 계획으로, 하이엔드 웨이퍼 포토레지스트 사업 부문의 새로운 성장 동력이 될 것으로 기대한다…\"\n\n#### 패키지 기판 — 실적 🟢🟢 · 가이던스 🟡중립\n- **실적**: 2사(표본 소수) 매출 **$1,980M**, QoQ **+21.0%**, YoY **+60.2%**, 영업이익률 **19.6%**(전년 동기 12.7%)입니다.\n  - 선난서킷: 매출 **$1,570M**, QoQ +20.4%, YoY **+66.3%**, OPM 21.2%\n  - 싱썬과기: 매출 $409M, QoQ +23.1%, YoY +40.3%\n- **가이던스·전망**: 회사 가이던스는 미제시입니다. 4Q 컨센서스는 매출 **-0.4% QoQ**이며, 선난서킷 -3.8%, 싱썬과기 +12.7%입니다.\n- **해석**: 3Q에는 AI 서버·네트워크용 기판 수요로 큰 폭으로 성장했습니다. 4Q 컨센서스는 높은 기저 때문에 합계 기준 정체를 예상합니다.\n\n#### 전력·화합물 반도체 — 실적 🟡 · 가이던스 🟢상향\n- **실적**: 4사 매출 **$1,612M**, QoQ **+4.6%**, YoY **+1.5%**(중앙값 +14.3%), 영업이익률 **10.5%**(전년 동기 6.8%)입니다. 윙텍은 ODM 사업 매각으로 매출이 급감해 집계에서 제외했습니다.\n  - 양지에과기: 매출 $400M, YoY **+40.9%**, OPM 21.4%\n  - 화룬마이크로: 매출 $504M, YoY +18.9%, OPM 13.3%\n  - 산안광전: 매출 $535M, YoY **-26.1%**, OPM 2.3%\n- **가이던스·전망**: 회사 가이던스는 미제시입니다. 4Q 컨센서스는 매출 **+5.6% QoQ**(3사)이며, 스타파워 +14.7%, 화룬마이크로 +4.4%, 양지에 +3.1%입니다.\n- **해석**: 산안광전의 역성장이 합계 YoY를 끌어내렸습니다. 나머지 업체는 완만한 회복세입니다.\n\n#### 클린룸·팹 인프라 — 실적 🟡 · 가이던스 🟡중립\n- **실적**: 3사 매출 **$554M**, QoQ **+20.2%**, YoY **+6.9%**, 영업이익률 **11.2%**입니다.\n  - 정범과기: 매출 $241M, QoQ +27.8%, YoY +26.3%, OPM 4.4%\n  - 야샹집성: 매출 $220M, OPM 24.9%\n  - 지순과기: 매출 $93M, YoY -18.1%\n- **가이던스·전망**: 회사 가이던스는 미제시입니다. 4Q 컨센서스는 매출 **+2.6% QoQ**로, 지순과기 1사뿐입니다.\n- **해석**: QoQ 반등은 컸지만 YoY 성장은 제한적이고, 4Q 전망을 판단할 근거가 부족합니다.\n\n#### IDM(로직·아날로그) — 실적 🟡 · 가이던스 🟢상향\n- **실적**: 표본 소수(1사)입니다. 실란(사란미) 매출 **$551M**, QoQ **-1.8%**, YoY **+8.8%**, OPM **2.4%**(전년 동기 0.7%).\n- **가이던스·전망**: 회사 가이던스는 미제시입니다. 4Q 컨센서스는 매출 **+12.0% QoQ**입니다.\n- **해석**: 이익률이 아직 낮은 수준이어서, 4Q 반등 전망이 맞는지는 실제 결과로 확인해야 합니다.\n\n#### 후공정 장비 — 실적 🟢🟢 · 가이던스 🟢상향\n- **실적**: 표본 소수(1사)입니다. 장천과기 매출 **$372M**, QoQ **+19.2%**, YoY **+53.9%**, OPM **32.5%**(전년 동기 24.0%).\n- **가이던스·전망**: 회사 가이던스는 미제시입니다. 4Q 컨센서스는 매출 **+11.9% QoQ**입니다.\n- **해석**: 테스트 장비(ATE) 국산화와 OSAT 투자가 맞물려 고성장·고마진이 이어지고 있습니다.\n\n### 가이던스 톤 정리\n**좋았던 곳**\n- **광통신**: 4Q 컨센서스 **+9.4% QoQ**. 이노라이트 **+33.0%**, 박창과기 +24.1%로, 3Q **YoY +67.6%**에 이어 성장이 이어질 전망입니다.\n- **전공정 장비**: 4Q 컨센서스 **+27.0% QoQ**(3사 한정). 피오테크 +32.5%, ACM상하이 +28.7%입니다.\n- **파운드리**: SMIC 가이던스 **+4~6% QoQ**, GM **26~28%**로 컨센서스 +0.9%를 웃돌고, 화홍은 **약 $1,080~1,090M**을 제시했습니다.\n- **소재 +12.5%**, **후공정 장비 +11.9%**, **IDM +12.0%**(표본 소수)도 두 자릿수 증가가 예상됩니다.\n\n**나빴던 곳**\n- **메모리**: 4Q 컨센서스 **-13.1% QoQ**(롱시스 -12.4%, 기가디바이스 -14.3%). 3Q의 **YoY +153.4%**, 영업이익률 **45.3%**가 고점일 가능성이 있습니다.\n- **팹리스·IP**: 4Q 컨센서스 **-5.3% QoQ**. 더밍리 **-32.9%**, 잉게닉 -20.4% 등 메모리 연동 업체가 끌어내립니다(AI 가속기·인터커넥트는 상향).\n- **패키지 기판**: 4Q 컨센서스 **-0.4% QoQ**(선난서킷 -3.8%)로, 3Q **QoQ +21.0%** 이후 정체가 예상됩니다."}, "EU": {"name": "유럽", "flag": "🇪🇺", "tone": {"summary": "유럽 테크 호조: 전공정 장비 YoY +53.6%, ASML 4Q 매출 €142~152억 가이던스", "segments": [{"seg": "전공정 장비", "tone": 2, "growth": "매출 QoQ +23.8%, YoY +53.6%, OPM 42.7%(전년 31.8%)", "guide": "ASML 4Q 매출 €142~152억(3Q €117억 대비 +21~30%), GPM 약 57%, FY26 €440~450억. ASM FY27 €5.7B 초과. 컨센서스 QoQ +23.5%", "quote": {"text": "We expect Q4 total net sales to be between €14.2 billion and €15.2 billion with a gross margin of around 57%.", "ko": "4분기 총매출은 €142억~152억, 매출총이익률은 약 57%로 예상합니다.", "by": "Roger J. Dassen, ASML", "src": "어닝콜 2026-10-14"}}, {"seg": "광통신", "tone": 2, "growth": "매출 QoQ +6.6%, YoY +18.9%, OPM 6.9%(전년 10.9%)", "guide": "노키아 4Q 매출 QoQ +20~24% 가정, Optical+IP 2027년 +25~30%. 프리스미안 FY26 EBITDA 중간값 €3
