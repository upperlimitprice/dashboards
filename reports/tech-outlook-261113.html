"quote": {"text": "INFICON raises the full-year 2026 guidance to sales of USD 820-850 million (previously USD 750-780 million) and an operating income margin of 21-22% (previously 19-20%)", "ko": "인피콘은 2026년 연간 가이던스를 매출 USD 8.2억~8.5억(기존 7.5억~7.8억), 영업이익률 21~22%(기존 19~20%)로 상향합니다.", "by": "인피콘", "src": "IR 보도자료 2026-10-27(3Q26 실적)"}}, {"seg": "패키지 기판", "tone": 1, "growth": "매출 QoQ +24.3%, YoY +52.4%, OPM 21.4%(전년 3.7%) — 표본 소수", "guide": "회사 가이던스 미제시(자료 내). AT&S 다음 분기 컨센서스 매출 QoQ +9.6%", "quote": null}, {"seg": "후공정 장비", "tone": 0, "growth": "매출 QoQ +3.9%, YoY +51.1%, OPM 35.2%(전년 19.3%) — 표본 소수", "guide": "BESI 4Q 매출 QoQ 보합(±5%), GPM 63~65%. 쥐스 4Q 매출 전환 €105~125M, 2027년 주문 €415~435M 확보. 컨센서스 QoQ +1.1%", "quote": {"text": "For 2027, visibility greatly improved with EUR 415 million to EUR 435 million of orders already planned for the fiscal year 2027.", "ko": "2027 회계연도에 이미 배정된 주문이 €4.15억~4.35억에 달해 2027년 가시성이 크게 높아졌습니다.", "by": "Burkhardt Frick, 쥐스마이크로텍", "src": "어닝콜 2026-11-05"}}, {"seg": "소재", "tone": 0, "growth": "매출 QoQ +10.5%, YoY +18.3%, OPM -13.5%(전년 -10.5%) — 표본 소수", "guide": "실트로닉 FY26 매출을 전년 수준으로 소폭 상향(4Q EUR/USD 1.14 가정). 컨센서스 QoQ +4.3%", "quote": {"text": "Siltronic slightly raises sales guidance for 2026", "ko": "실트로닉, 2026년 매출 가이던스 소폭 상향", "by": "실트로닉", "src": "IR 보도자료 2026-11-04(3Q26)"}}, {"seg": "파운드리", "tone": 0, "growth": "매출 QoQ -2.7%, YoY -14.9%, OPM 2.2%(전년 10.4%) — 표본 소수", "guide": "X-FAB 4Q 매출 $205~215M, EBITDA 마진 19~22%(IFRS-15 제외). 2027년 Site B 폐쇄로 매출 약 $50M 감소. 컨센서스 QoQ +11.6%", "quote": {"text": "Looking ahead, we expect our fourth quarter revenue to come in between $205 million and $215 million, with an EBITDA margin of 19% to 22%.", "ko": "4분기 매출은 $2.05억~2.15억, EBITDA 마진은 19~22%로 예상합니다.", "by": "Alba Morganti, X-FAB", "src": "어닝콜 2026-10-29"}}], "best": ["전공정 장비", "전력·화합물 반도체", "광통신"], "worst": ["파운드리", "소재", "후공정 장비"]}, "md": "## 유럽\n\n### 한눈에\n- **장비 쪽 성장이 가장 강했습니다.** 전공정 장비(매출 **$14,680M**)는 **YoY +53.6%**, **QoQ +23.8%**, OPM **42.7%**입니다. 패키지 기판 AT&S(**YoY +52.4%**), 후공정 장비(**+51.1%**), 부품(**+49.4%**)도 50% 안팎으로 성장했습니다. AI·메모리 투자 확대와 선단 로직 전환이 동시에 작용했습니다.\n- **AI 데이터센터가 IDM·전력·광통신까지 끌어올렸습니다.** 인피니언은 FY27 데이터센터 전력 매출을 €22억에서 **약 €40억**으로 제시했습니다. 노키아의 AI·클라우드 고객 매출은 **+123%**, NXP의 데이터센터 매출은 **$500M 초과**가 예상됩니다.\n- **약했던 곳은 파운드리와 소재입니다.** X-FAB(표본 소수)은 **YoY -14.9%**, OPM **2.2%**였습니다. 실트로닉(표본 소수)은 매출이 **+18.3%** 늘었지만 OPM은 **-13.5%**로 적자입니다.\n- **가이던스 톤은 전반적으로 상향입니다.** ASML은 4Q 매출 **€142~152억**(3Q 대비 +21~30%), 인피니언은 FY27 **약 €200억**(+20% 이상), ASM은 FY27 **€5.7B 초과**를 제시했습니다. 다만 후공정(BESI 4Q 보합)과 일부 팹리스(노르딕 4Q QoQ 감소)는 단기적으로 숨 고르기 국면입니다.\n\n### 밸류체인별 실적과 가이던스\n\n#### 전공정 장비 — 실적 🟢🟢 · 가이던스 🟢강한 상향\n- **실적:** 표본 5/5사 합산 매출 **$14,680M**입니다. QoQ **+23.8%**, YoY **+53.6%**(기업 중앙값 +44.9%), OPM **42.7%**(전년 31.8%)입니다.\n  - **ASML:** 3Q 매출 **€117억**(사상 최대)으로 USD 기준 YoY **+55.2%**입니다. EUV €41억, 설치기반 €33억(가이던스를 약 €4억 상회), GPM **57.5%**였습니다.\n  - **ASM인터내셔널:** 매출 **€1.16B**로 YoY **+44%**(고정환율), QoQ **+14%**입니다. 영업이익률은 **33.4%**이며, 1.4nm가 처음 의미 있는 매출을 냈습니다.\n  - **익스트론:** 매출 **€184M**(YoY **+54%**), EBIT 마진 **31%**(전년 13%)입니다. 성장은 InP 광응용 램프가 이끌었습니다.\n  - **마이크로닉:** 매출 **SEK 2.4bn**(YoY **+38%**), EBIT 마진 **26%**, 수주잔고 **SEK 5.5bn**(사상 최대)입니다.\n- **가이던스·전망**\n  - **ASML:** 4Q 매출 **€142~152억**, GPM 약 **57%**, 설치기반 약 €37억입니다. FY26은 **€440~450억**(+약 36%)이며, EUV **+45% 이상**, 메모리 **+약 75%**입니다.\n  - **ASM:** 4Q **€1.23B ±5%**, FY26 매출 **+약 35%**입니다. FY27은 **€5.7B 초과**로, 2030 목표를 3년 앞당긴 수준입니다.\n  - **익스트론:** FY26 **€560M ±30**을 재확인했습니다. 4Q는 3Q보다 산출을 더 늘릴 계획입니다.\n  - **마이크로닉:** FY26 매출을 **SEK 9.75bn**으로 상향했습니다.\n  - **컨센서스:** 다음 분기 QoQ **+23.5%**(5사)입니다.\n- **해석:** 메모리(주로 DRAM) 투자가 본격화했고, 선단 로직(2nm→1.4nm)도 동시에 늘고 있습니다. 여기에 고마진 생산성 업그레이드가 더해져 성장과 마진이 함께 올라갔습니다. 공급망이 빠듯하다는 점이 유일한 제약입니다.\n\n> 💬 \"We expect Q4 total net sales to be between €14.2 billion and €15.2 billion with a gross margin of around 57%.\" — Roger J. Dassen, ASML (어닝콜 2026-10-14)\n> → 4분기 총매출은 €142억~152억, 매출총이익률은 약 57%로 예상합니다.\n\n> 💬 \"We are working closely with our suppliers to secure the capacity and critical components needed to meet rapidly growing customer demand in 2027 and beyond.\" — Hichem M'Saad, ASM인터내셔널 (어닝콜 2026-10-28)\n> → 2027년 이후 빠르게 늘어나는 고객 수요에 대응하려고, 공급사와 긴밀히 협력해 필요한 생산능력과 핵심 부품을 확보하고 있습니다.\n\n#### 광통신 — 실적 🟢 · 가이던스 🟢강한 상향\n- **실적:** 표본 3/3사 합산 매출 **$13,125M**입니다. QoQ **+6.6%**, YoY **+18.9%**인데 OPM은 **6.9%**로 전년(10.9%)보다 낮습니다.\n  - **프리스미안:** 매출 YoY **+27.6%**, 조정 EBITDA **€8.51억**(마진 약 17%), 유기성장 **+13%**입니다. Digital Solutions 마진은 **25%**입니다.\n  - **노키아:** 매출 YoY **+9.7%**입니다. 비교가능 영업이익률은 **11.7%**(+220bp), Optical은 **+18%**, IP는 **+43%**였습니다. FCF는 **-€99M**입니다.\n  - **예놉티크:** 매출 YoY **+18.0%**, OPM **17.9%**입니다.\n- **가이던스·전망**\n  - **노키아:** 4Q 매출 QoQ **+20~24%**를 가정했습니다. Optical+IP의 **2027년 +25~30%** 성장 전망을 처음 제시했습니다. 2026년 FCF 전환율은 **35~55%**입니다.\n  - **프리스미안:** FY26 EBITDA 중간값을 **€31억**, FCF를 **€18억**(기존 €17억)으로 상향했습니다. 4Q EBITDA 약 **€9.18억**으로, 사상 처음 4Q가 3Q를 넘을 전망입니다.\n  - **예놉티크:** 매출 성장률 **+5~9%**는 유지했고, EBITDA 마진은 약 **22%**로 높였습니다(기존 20~21%).\n  - **컨센서스:** QoQ **+10.4%**(3사)입니다.\n- **해석:** 데이터센터 수요가 세 회사 모두를 끌어올렸습니다. 프리스미안의 데이터센터 매출은 **약 €25억**으로 늘었고, 노키아 AI·클라우드 고객 매출은 **+123%**입니다. 합산 이익률이 낮은 것은 노키아 구조조정 비용(2026년 약 **€1.1bn**)과 IP 램프 비용 영향이 큽니다.\n\n> 💬 \"For 2027, we now expect these businesses to grow between 25% and 30% on a combined basis, reflecting the strength of the underlying market and our position to capture that demand.\" — Justin Hotard, 노키아 (어닝콜 2026-10-22)\n> → 2027년에는 이 사업들이 합산 기준 25~30% 성장할 것으로 봅니다. 시장 자체가 강하고, 그 수요를 잡을 수 있는 위치에 있다는 점을 반영한 전망입니다.\n\n> 💬 \"Eight lines will come to fruition in the next eight quarters, one per quarter, starting from the end of Q1 2027.\" — Massimo Battaini, 프리스미안 (어닝콜 2026-10-29)\n> → 2027년 1분기 말부터 앞으로 8개 분기 동안 분기마다 1개씩, 총 8개 라인이 가동에 들어갑니다.\n\n#### IDM(로직·아날로그) — 실적 🟢 · 가이던스 🟢상향\n- **실적(표본 소수 2사):** 합산 매출 **$7,543M**입니다. QoQ **+8.0%**, YoY **+18.6%**, OPM **21.1%**(전년 16.9%)입니다.\n  - **NXP:** 매출 **$3.79B**(YoY **+19%**, QoQ **+8%**)입니다. non-GAAP GPM **58.6%**, OPM **37.1%**였고, 산업·IoT **+39%**, 통신인프라 **+54%**입니다.\n  - **ST마이크로:** 매출 **$3,757M**(QoQ **+7.7%**, YoY **+17.9%**), GM **37.3%**입니다. CECP(통신장비·컴퓨터주변기기)가 YoY **+64%**였습니다.\n- **가이던스·전망**\n  - **NXP:** 4Q 매출 **$3.85B ±$100M**(QoQ **+2%**, YoY **+15%**), GPM **59%**, EPS **$4.36**입니다. 2027년은 매출 **두 자릿수 성장**과 연중 GPM **60%**를 제시했습니다.\n  - **ST:** 4Q 매출 QoQ **+10.5% ±350bp**, GM 약 **39.0% ±200bp**입니다.\n  - **컨센서스:** QoQ **+6.1%**입니다.\n- **해석:** 자동차·산업 회복 위에 AI 데이터센터·저궤도 위성 수요가 더해졌습니다. NXP는 2026년 가격이 하락이 아닌 **중립**이었다며, 가격 환경이 구조적으로 바뀌고 있다고 봤습니다.\n\n> 💬 \"SDV revenue in Q3 is running above $1.5 billion annualized and remains well on track to reach our $2 billion 2027 target.\" — Rafael Sotomayor, NXP반도체 (어닝콜 2026-10-27)\n> → 3분기 SDV 매출은 연환산 $15억을 넘고 있으며, 2027년 목표 $20억 달성 경로에 순조롭게 있습니다.\n\n> 💬 \"Starting from the approximately 39% gross margin expected for Q4 '26, we see a clear path to margin expansion.\" — Lorenzo Grandi, ST마이크로 (어닝콜 2026-10-29)\n> → 4Q26 예상 매출총이익률 약 39%를 출발점으로, 마진이 개선될 경로가 분명히 보입니다.\n\n#### 전력·화합물 반도체 — 실적 🟢 · 가이던스 🟢강한 상향\n- **실적(표본 소수 1사, 인피니언):** 매출 **$5,203M**(QoQ **+12.8%**, YoY **+19.4%**), OPM **16.5%**(전년 13.7%)입니다. 회사 기준 4Q FY26 매출은 **€47.06억**, 부문이익률은 **23.8%**로 사상 최대 분기입니다.\n- **가이던스·전망**\n  - **1Q FY27:** 매출 약 **€46억**, 부문이익률 약 **23%**입니다. 컨센서스는 QoQ **-1.3%**입니다.\n  - **FY27:** 매출 약 **€200억**(**+20% 이상**), 부문이익률 **20%대 중반**(+5%p)입니다. 팹 투자는 **€30~35억**입니다.\n  - **데이터센터:** AI·일반 데이터센터 전력 매출이 €22억에서 약 **€40억**으로 늘 전망입니다.\n- **해석:** 분기만 보면 계절적으로 숨을 고르는 구간입니다. 하지만 연간 가이던스는 강하게 상향됐습니다. AI 서버 전력 수요가 공급을 웃돌아 선착순으로 배분하는 상황이고, SDV도 동력입니다.\n\n> 💬 \"For the 2027 fiscal year, we forecast revenue of around EUR 20 billion.\" — Jochen Hanebeck, 인피니언 (어닝콜 2026-11-10)\n> → 2027 회계연도 매출은 약 €200억으로 전망합니다.\n\n> 💬 \"For 2027, we expect revenue from our power supply solutions for AI and classical data centers to grow from EUR 2.2 billion to reach close to EUR 4 billion.\" — Jochen Hanebeck, 인피니언 (어닝콜 2026-11-10)\n> → 2027년 AI 및 일반 데이터센터용 전원 솔루션 매출은 €22억에서 €40억 가까이로 늘 것으로 예상합니다.\n\n#### 팹리스·IP — 실적 🟢 · 가이던스 🟢상향\n- **실적:** 표본 5/5사 합산 매출 **$2,121M**입니다. QoQ **+10.2%**, YoY **+23.8%**(중앙값 +27.1%), OPM **15.4%**(전년 12.9%)입니다.\n  - **ARM:** 매출 **$1,443M**(QoQ **+11.9%**, YoY **+27.1%**)으로, 직전 가이던스 $1.38B ±$50M을 넘었습니다.\n  - **노르딕:** 매출 **$235M**(YoY **+32%**, 사상 최대), GPM **52.8%**입니다.\n  - **멜렉시스:** 매출 **€223.7M**(YoY **+4%**), 영업이익률 **18.5%**입니다.\n  - **세큐앙스:** 매출 **$9.1M**(YoY **+183%**)인데, 기저가 작습니다.\n- **가이던스·전망**\n  - **ARM:** 다음 분기 OpEx 약 **$825M**, EPS **$0.56 ±0.04**, 라이선스 YoY **+50% 강**입니다. AGI CPU 매출은 FY27~28 누적 최대 **$2B**를 목표로 합니다.\n  - **노르딕:** 4Q **$215~235M**(YoY +27~39%)로 QoQ 소폭 감소합니다.\n  - **멜렉시스:** 하반기 매출 **€445~455M**을 재확인했습니다.\n  - **엘모스:** FY26 매출 성장률 **12% ±2%p**입니다.\n  - **세큐앙스:** 4Q 매출 **$9.5~11M**입니다.\n  - **컨센서스:** QoQ **+4.2%**입니다.\n- **해석:** ARM은 클라우드 AI 로열티와 자체 실리콘으로 성장 폭이 커졌습니다. 반면 자동차 비중이 큰 멜렉시스는 한 자릿수 성장에 그쳐, 같은 세그먼트 안에서도 격차가 큽니다.\n\n> 💬 \"Our confidence in achieving up to $2 billion of revenue in Arm AGI CPU across fiscal 2027 and 2028 has increased over the last 90 days, supported by additional supply and customer mix.\" — Rene Haas, ARM (어닝콜 2026-11-04)\n> → 추가 공급 확보와 고객 믹스에 힘입어, FY27~28 Arm AGI CPU 매출 최대 $20억 달성에 대한 확신이 지난 90일간 높아졌습니다.\n\n> 💬 \"Based on current customer orders and forecasts, we are guiding for revenue of $215 million to $235 million in the fourth quarter, corresponding to a year-on-year growth between 27% and 39% with the midpoint of 33%, a slight reduction sequentially from Q3.\" — Pål Elstad, 노르딕세미컨덕터 (어닝콜 2026-10-22)\n> → 현재 고객 주문과 전망을 기준으로 4분기 매출을 $2.15억~2.35억으로 제시합니다. 전년 대비 27~39%(중간값 33%) 성장이며, 3분기보다는 소폭 낮은 수준입니다.\n\n#### 부품 — 실적 🟢 · 가이던스 🟢상향\n- **실적:** 표본 5/5사 합산 매출 **$1,592M**, YoY **+49.4%**(중앙값 +45.9%), OPM **25.5%**(전년 14.0%)입니다. VAT·메르센·테크노프로브·인피콘·코메트 모두 반기 보고라 분기 수치가 섞여 있어 QoQ는 집계에서 뺐습니다.\n  - **테크노프로브:** 3Q 매출 **€323.3M**(YoY **+130%**, QoQ +16.7%), EBITDA 마진 **52.6%**입니다.\n  - **VAT그룹:** 매출 YoY **+45.9%**입니다. 7월 어닝콜 기준 2Q 수주는 **CHF 5억 이상**(YoY +102%), book-to-bill **1.7x**였습니다.\n  - **코메트:** YoY **+51.8%**입니다.\n  - **인피콘:** YoY **+42.4%**, OPM **25.5%**입니다.\n- **가이던스·전망**\n  - **인피콘:** FY26 매출 **$820~850M**(기존 $750~780M), 영업이익률 **21~22%**(기존 19~20%)로 상향했습니다.\n  - **VAT(7월 기준):** 하반기 매출이 상반기 대비 **+50% 이상**이고, 연말 분기 출하 run-rate는 **CHF 4.5억 이상**입니다.\n  - **테크노프로브:** 4Q 매출 **€270M ±3%**입니다. ERP 전환 영향이 약 €50M이고, 생산능력은 2027년 말 약 **€2B/년**을 목표로 합니다.\n  - **메르센:** EBITDA 마진 **16.0~16.5%**를 확인했습니다.\n  - **컨센서스:** 없음(0사)입니다.\n- **해석:** WFE 확대와 AI용 프로브카드 수요로 이익률이 크게 높아졌습니다. 테크노프로브 4Q 감소는 시스템 전환에 따른 일시 요인입니다.\n\n> 💬 \"INFICON raises the full-year 2026 guidance to sales of USD 820-850 million (previously USD 750-780 million) and an operating income margin of 21-22% (previously 19-20%)\" — 인피콘 (IR 보도자료 2026-10-27)\n> → 인피콘은 2026년 연간 가이던스를 매출 USD 8.2억~8.5억(기존 7.5억~7.8억), 영업이익률 21~22%(기존 19~20%)로 상향합니다.\n\n#### 패키지 기판 — 실적 🟢🟢 · 가이던스 🟢상향\n- **실적(표본 소수 1사, AT&S):** 매출 **$754M**(QoQ **+24.3%**, YoY **+52.4%**), OPM **21.4%**로 전년 3.7%에서 크게 개선됐습니다.\n- **가이던스·전망:** **회사 가이던스 미제시**입니다(자료 내 최신 IR 없음). 다음 분기 컨센서스는 매출 QoQ **+9.6%**입니다.\n- **해석:** 고부가 ABF 기판 수요 회복과 가동률 상승으로 이익이 레버리지를 받은 것으로 보입니다. 다만 회사 코멘트가 없어 이 해석은 확인되지 않았습니다.\n\n#### 후공정 장비 — 실적 🟢🟢 · 가이던스 🟡중립\n- **실적(표본 소수 2사):** 합산 매출 **$421M**입니다. QoQ **+3.9%**, YoY **+51.1%**, OPM **35.2%**(전년 19.3%)입니다.\n  - **BESI:** 매출 **€283.4M**(YoY **+113.5%**), 수주 **€342.6M**, 순이익률 **37.8%**입니다.\n  - **쥐스마이크로텍:** 매출 **$107M**(QoQ **-16.5%**, YoY **-18.4%**), OPM **4.2%**입니다. 공급망 제약으로 3Q 출하 일부가 이연됐습니다.\n- **가이던스·전망**\n  - **BESI:** 4Q 매출 **QoQ 보합(±5%)**, GPM **63~65%**, OPEX QoQ **+5~10%**입니다.\n  - **쥐스:** 4Q 매출 전환 **€105~125M**입니다. 수주잔고는 **€600M 초과**(사상 최대)이고, 2027년 배정 주문이 **€415~435M**입니다.\n  - **컨센서스:** QoQ **+1.1%**(1사)입니다.\n- **해석:** 다음 분기 매출은 정체지만 수주는 강합니다. BESI LTM 수주는 **€1.2B**이고, 하이브리드 본딩 모멘텀도 이어지고 있습니다. 성장 동력은 2027년에 몰려 있습니다.\n\n> 💬 \"In addition, gross margins are anticipated to range between 63% and 65%, and operating expenses are expected to increase between 5% and 10% versus the third quarter due primarily to increased strategic consulting cost.\" — Richard Blickman, BE세미컨덕터 (어닝콜 2026-10-22)\n> → 또한 매출총이익률은 63~65%로 예상합니다. 영업비용은 주로 전략 컨설팅 비용 증가로 3분기 대비 5~10% 늘 전망입니다.\n\n> 💬 \"For 2027, visibility greatly improved with EUR 415 million to EUR 435 million of orders already planned for the fiscal year 2027.\" — Burkhardt Frick, 쥐스마이크로텍 (어닝콜 2026-11-05)\n> → 2027 회계연도에 이미 배정된 주문이 €4.15억~4.35억에 달해 2027년 가시성이 크게 높아졌습니다.\n\n#### 소재 — 실적 🟢 · 가이던스 🟡중립\n- **실적(표본 소수 1사, 실트로닉):** 매출 **$393M**(QoQ **+10.5%**, YoY **+18.3%**)인데, OPM은 **-13.5%**(전년 -10.5%)로 적자가 커졌습니다.\n- **집계 외 참고(최신 분기 2026-06)**\n  - **바커케미:** 3Q 매출 **€14.7억**(+9%)이고, 연간 EBITDA **€6.25~7.5억** 중 상단 절반을 전망합니다.\n  - **IQE:** 상반기 매출 **+43%**, FY26 매출 성장 **30% 초과** 가이던스입니다.\n- **가이던스·전망:** 실트로닉은 FY26 매출을 **전년 수준**으로 소폭 상향했습니다(4Q EUR/USD 1.14 가정, 기존은 전년 대비 감소 범위). 컨센서스는 QoQ **+4.3%**입니다.\n- **해석:** 웨이퍼 물량은 회복되고 있지만, 상향은 환율 효과도 함께 반영한 것입니다. 수익성은 여전히 적자라 회복 속도가 더딥니다.\n\n> 💬 \"…exceeded expectations in Q3 due to favorable FX development and strong wafer demand.\" — 실트로닉 (IR 보도자료 2026-11-04)\n> → …우호적인 환율과 강한 웨이퍼 수요 덕분에 3분기 실적이 예상을 웃돌았습니다.\n\n#### 파운드리 — 실적 🔴 · 가이던스 🟡중립\n- **실적(표본 소수 1사, X-FAB):** 매출 **$194.4M**(QoQ **-2.7%**, YoY **-14.9%**), OPM **2.2%**(전년 10.4%)입니다.\n  - IFRS-15 효과를 빼면 **$200.7M**(QoQ +2%)이고, 자동차 매출은 YoY **-19%**입니다.\n  - 수주는 **$224.7M**(YoY **+38%**), book-to-bill은 **1.12**입니다.\n- **가이던스·전망:** 4Q 매출 **$205~215M**, EBITDA 마진 **19~22%**(IFRS-15 제외)입니다. 2027년에는 Site B 폐쇄로 매출이 약 **$50M** 줄어듭니다. 컨센서스는 QoQ **+11.6%**입니다.\n- **해석:** 바닥을 지나 점진적으로 회복하고 있습니다. 와이드밴드갭(+68%)과 포토닉스 NRE(+약 40%)가 긍정적입니다. 하지만 자동차 부진과 2027년 가시성이 짧다는 점이 부담입니다.\n\n> 💬 \"Looking ahead, we expect our fourth quarter revenue to come in between $205 million and $215 million, with an EBITDA margin of 19% to 22%.\" — Alba Morganti, X-FAB (어닝콜 2026-10-29)\n> → 4분기 매출은 $2.05억~2.15억, EBITDA 마진은 19~22%로 예상합니다.\n\n> 💬 \"And so our visibility in the backlog for the full year 2027 is only going for us through Q4 and partly in Q1.\" — Damien Macq, X-FAB (어닝콜 2026-10-29)\n> → 2027년 연간에 대한 수주잔고 가시성은 4분기, 그리고 1분기 일부까지만 확보돼 있습니다.\n\n### 가이던스 톤 정리\n**좋았던 곳**\n- **전공정 장비:** ASML 4Q **€142~152억**(3Q 대비 +21~30%), FY26 **€440~450억**입니다. ASM은 FY27 **€5.7B 초과**(2030 목표 3년 조기 달성)이고, 컨센서스는 QoQ **+23.5%**입니다.\n- **전력·화합물 반도체(표본 소수):** 인피니언 FY27 매출 약 **€200억**(+20% 이상), 이익률 **20%대 중반**, 데이터센터 전력 매출 **약 €40억**입니다.\n- **광통신:** 노키아 4Q QoQ **+20~24%**, Optical+IP 2027년 **+25~30%**입니다. 프리스미안은 FY26 EBITDA **€31억**으로 상향했고, 예놉티크는 EBITDA 마진을 약 **22%**로 높였습니다.\n- **부품:** 인피콘 FY26 매출 **$820~850M**(기존 $750~780M)으로 상향, 이익률 **21~22%**입니다.\n\n**나빴던 곳**\n- **파운드리(표본 소수):** X-FAB 매출 YoY **-14.9%**, OPM **2.2%**입니다. 4Q **$205~215M**으로 완만하게 회복하지만, 2027년 Site B 폐쇄로 약 **-$50M**이 예상됩니다.\n- **소재(표본 소수):** 실트로닉 OPM **-13.5%**로 적자가 커졌습니다. FY26 매출 상향은 **전년 수준**까지 끌어올린 정도에 그칩니다.\n- **후공정 장비(표본 소수):** BESI 4Q **QoQ 보합**, 쥐스 3Q 매출 YoY **-18.4%**입니다. 다만 쥐스 수주잔고 **€600M 초과**, BESI LTM 수주 **€1.2B**로 2027년 회복 신호는 뚜렷합니다."}}, "cells": {"CN|팹리스·IP": {"n": 21, "na": 21, "rev": 7698, "yoy": 53.3, "qoq": 11.9, "med": 29.8, "opm": 23.4, "opm1": 16.4, "dopm": 7.0, "cons": -5.3, "cn": 12, "tone": -1, "g": "매출 $7,698M, QoQ +11.9%, YoY +53.3%, OPM 23.4%(전년 동기 16.4%)", "gd": "4Q 컨센 매출 -5.3% QoQ(12사): 더밍리 -32.9%, 잉게닉 -20.4% vs 하이곤 +23.9%, 몬타주 +16.5%. 암로직은 연간 매출 +25~45% YoY 범위의 상단 제시", "qt": {"text": "展望全年，本年度营业收入有望实现年度预告中25%-45%同比增长的上限，力争突破100 亿元。", "ko": "연간으로는 올해 매출이 연간 실적 예고에서 제시한 전년 대비 25~45% 성장 범위의 상단을 달성할 것으로 보이며, 100억 위안 돌파를 목표로 한다.", "by": "암로직(정신과기)", "src": "3Q26 IR 자료 2026-10-30"}}, "CN|파운드리": {"n": 2, "na": 3, "rev": 3693, "yoy": 30.9, "qoq": 7.3, "med": 24.2, "opm": 20.8, "opm1": 13.3, "dopm": 7.4, "cons": 1.0, "cn": 2, "tone": 1, "g": "매출 $3,693M(SMIC·넥스칩), QoQ +7.3%, YoY +30.9%, OPM 20.8%(전년 동기 13.3%)", "gd": "SMIC 4Q 매출 +4~6% QoQ, GM 26~28% 가이던스(컨센 +0.9%). 화홍 4Q 매출 약 $1,080~1,090M, GM 25~26% 가이던스", "qt": {"text": "In the fourth quarter, the Company’s revenue is expected to increase 4% to 6% sequentially, and the gross margin is ex % 성장할 것으로 예상합니다.\n\n시사점: 가속기 수요가 공급 제약 속에서도 2028년까지 이어진다는 가이던스가 나왔다. 따라서 성장 축은 당분간 메모리·선단 파운드리·테스트 장비에서 바뀌지 않을 가능성이 크다.\n\n**2. 이익률 레버리지가 극단적이다. 메모리는 1년 새 영업이익률이 40~60%p 올랐고, 체인 하단은 소외됐다**\n- 메모리 OPM은 대만이 8.0%에서 **67.7%**로(**+59.7%p**), 미국이 28.1%에서 **80.5%**로, 한국이 21.3%에서 **63.6%**로 올랐다. 일본 키옥시아(1사)도 19.2%에서 **80.5%**가 됐다.\n- 장비도 마진이 커졌다. 전공정 장비 OPM은 유럽 31.8%→**42.7%**, 한국 10.4%→**20.9%**였고, 일본 후공정 장비는 **50.7%**, 대만 파운드리는 **56.4%**다.\n- 반대로 체인 하단은 마진이 얇다. 한국 OSAT는 YoY +55.7% 성장에도 OPM이 **0.3%**(전년 2.3%)로 떨어졌다. 유통은 대만 **2.7%**, 미국 **4.0%**에 그쳤고, 중국 소재는 **-1.7%**, 유럽 실트로닉(1사)은 **-13.5%**로 적자다.\n> 💬 “Importantly, we expect 2027 to mark a turning point in our blended ASP trajectory, moving from an environment of ASP erosion toward a meaningful positive uplift beginning in the first quarter.” — Jason Wang, UMC (어닝콜 2026-10-28)\n> → 중요한 점은 2027년이 블렌디드 ASP 흐름의 전환점이 될 것이라는 점입니다. ASP 하락 국면에서 벗어나 1분기부터 의미 있는 상승으로 돌아설 것으로 예상합니다.\n\n시사점: 가격 결정력이 메모리에서 성숙 파운드리로 번지고 있다. UMC는 2027 ASP **약 +10%**, 타워는 혼합 가격 **+20%**, DB하이텍은 8인치 가격 사이클을 전망했다. 반면 물량만 받는 모듈·OSAT·유통은 마진 레버리지를 누리지 못하고 있다.\n\n**3. 가이던스 최상위는 TSMC·미디어텍·ASML·마이크론이고, 최하위는 중국 메모리·한국 팹리스·대만 후공정이다**\n- 가장 좋았던 곳\n  - TSMC: 4Q **$52.3~54.3B**(+14% QoQ), FY26 **약 +44%**\n  - 미디어텍: 4Q **+25~32% QoQ**\n  - ASML: 4Q **€142~152억**(3Q 대비 **+21~30%**)\n  - 마이크론: FQ1 **$61.5B**(GM 약 86.25%)\n  - 브로드컴: 4Q AI 매출 **+236%**\n- 가장 나빴던 곳(다음 분기 컨센서스)\n  - 중국 메모리 **-13.1%**(표본 2사)\n  - 한국 팹리스 **-8.5%**, 한국 소재 **-6.9%**\n  - 중국 팹리스 **-5.3%**\n  - 대만 후공정 장비 **-4.7%**(13개 밸류체인 중 유일한 역성장)\n  - 미국 IDM **-2.1%**(인텔 CCPG **-20% 이상**)\n> 💬 “Based on the current business outlook, we expect our fourth quarter revenue to be between $52.3 billion and $54.3 billion, which represents a 14% sequential increase or a 58% year-over-year increase at the midpoint.” — Wendell Huang, TSMC (어닝콜 2026-10-15)\n> → 현재 사업 전망을 기준으로 4분기 매출은 523억~543억 달러로 예상하며, 이는 중간값 기준 전분기 대비 14%, 전년 동기 대비 58% 증가에 해당합니다.\n\n시사점: 4Q 모멘텀은 선단 파운드리·ASIC·EUV처럼 공급자가 소수인 곳에 집중된다. 범용 메모리 연동 팹리스와 3Q에 출하가 몰린 장비는 기저 부담 구간에 들어섰다.\n\n**4. 사이클 위치: 메모리는 '물량 정체, 가격 주도' 후반부, 장비는 2027 증설 가속 초입, 비AI 수요는 약하다**\n- 메모리\n  - 난야는 비트 출하가 **2H27까지 flat**이라고 밝혔다. 대만 메모리 QoQ 성장률은 **+48.6%**에서 **+10.5%**(컨센서스)로 낮아질 전망이다.\n  - 반면 SK하이닉스는 4Q DRAM 출하 **20% 중반 QoQ** 증가와 공급 부족 **2030년까지** 지속을 전망했다.\n- 장비: WFE는 **2026년 $150B 중반 → 2027년 $200B 초과**(램리서치·울트라클린)로 예상되고, TEL은 **$210B 이상**을 제시했다. 하이퍼스케일러 CapEx는 **$8,000억 → $1.3조**로 늘어날 전망이다.\n- 비AI 수요\n  - PC: 인텔 PC TAM 2026년 **-12%**\n  - 자동차: 온세미 자동차 한 자릿수 후반 감소, X-FAB 자동차 YoY **-19%**\n  - 전력·화합물: 일본 **+9.5%**, 중국 **+1.5%**에 그쳤다.\n> 💬 “Plus, we have a very depleted inventory, so likely our bit shipment will remain flat for a few quarter until second half of 2027.” — Pei-Ing Lee, 난야테크 (어닝콜 2026-10-12)\n> → 게다가 재고가 거의 바닥나 비트 출하는 2027년 하반기까지 몇 분기 동안 flat에 머물 가능성이 큽니다.\n\n시사점: 메모리 업체는 가격 탄력이 둔화할 때 이익 성장률이 꺾일 수 있다. 공급 해소용 CapEx를 받는 장비·부품·클린룸은 2027년에 레버리지가 더 크다.\n\n**5. 국가 간 괴리가 크다. 중국은 메모리·장비가 둔화하고, 일본은 연간 상향과 분기 숨 고르기가 엇갈린다**\n- 메모리 다음 분기 컨센서스: 미국 **+13.7%**, 대만 **+10.5%**, 일본 **+9.8%**(1사)와 달리 중국은 **-13.1%**다(롱시스 -12.4%, 기가디바이스 -14.3%).\n- 전공정 장비 YoY: 유럽 **+53.6%**, 미국 **+47.7%**, 일본 **+35.6%**와 달리 중국은 **+6.3%**에 그쳤고 OPM도 16.3%→**12.7%**로 떨어졌다. 나우라는 YoY **+1.3%**였고, 램리서치는 12월 분기 중국 비중의 큰 폭 하락을 예고했다.\n- 일본은 연간 전망이 줄줄이 올라갔다(TEL WFE $210B+, 다이후쿠 수주 **9,700~10,000억엔**). 그런데 다음 분기 컨센서스는 부품 **-3.2%**, 광통신 **-2.1%**, 후공정 **-1.9%**, 전공정 **+0.1%**로 보합 이하다.\n> 💬 “tight supply of DRAM products is not expected to ease in the second half of 2026…” — 잉게닉 (HKEX 공시 2026-08-28)\n> → \"DRAM 제품의 공급 부족은 2026년 하반기에도 완화되지 않을 것으로 예상된다…\"\n\n시사점: 중국 내에서도 회사 코멘트(공급 타이트)와 컨센서스(-13%)가 엇갈린다. 중국 메모리는 니치·레거시 가격의 고점 신호로, 한·미 HBM·데이터센터 메모리와는 별개 사이클로 봐야 한다.\n\n**6. AI 네트워크·패키징이 2차 수혜로 번지고 있다. 광통신과 기판에서 이익률이 두 배가 됐다**\n- 광통신: 대만 YoY **+72.4%**(OPM 14.7%→**33.8%**), 중국 **+67.6%**(OPM 16.4%→**28.0%**, 4Q 컨센서스 **+9.4%**), 미국 **+40.3%**(시에나 백로그 **$10B+**)다.\n- 패키지 기판: 대만 YoY **+44.3%**(OPM 7.3%→**17.0%**, 컨센서스 **+14.5%**), 유럽 AT&S **+52.4%**(1사), 일본 이비덴 **+42.1%**(1사)다.\n- 예외는 유럽 광통신이다. YoY **+18.9%** 성장에도 OPM이 10.9%에서 **6.9%**로 떨어졌다(노키아 구조조정 비용 영향).\n> 💬 “For 2027, we now expect these businesses to grow between 25% and 30% on a combined basis, reflecting the strength of the underlying market and our position to capture that demand.” — Justin Hotard, 노키아 (어닝콜 2026-10-22)\n> → 2027년에는 이 사업들이 합산 기준 25~30% 성장할 것으로 봅니다. 시장 자체가 강하고, 그 수요를 잡을 수 있는 위치에 있다는 점을 반영한 전망입니다.\n\n시사점: 800G→1.6T 전환, CPO(ASE 2027 CPO **$0.5B+**), ABF 기판은 가속기 다음 단계의 확산 수혜다. 대만·중국 선두 업체 위주로 2027년 가시성이 높다.\n\n**7. 리스크·체크포인트: 메모리발 수요 파괴, 공급 병목, 고객 마진 압박**\n- 수요 파괴: TDK는 스마트폰 생산이 **11억대를 밑돌 것**으로 봤다. 퀄컴(**-8.4%**)과 LX세미콘(4Q 컨센서스 **-12.0%**)도 역성장 중이다.\n- 공급 병목: 엔비디아 FY28 **+70%**는 공급 제약을 반영한 수치다(수요 기준으로는 약 2배). 장비는 클린룸·MFC 부품 부족이 1~2개 분기 더 이어질 전망이다.\n- 고객 마진: 엔비디아 GM은 Q4에 **71~72%**로 바닥을 찍을 전망이다. 증권사들은 메모리 업황이 '28년에도 이어질지 우려를 제기했다.\n> 💬 “In 2027, we expect some demand adjustment for mobile and PC applications.” — Jaejune Kim, 삼성전자 (어닝콜 2026-10-28)\n> → 2027년에는 모바일·PC 응용처에서 일부 수요 조정이 있을 것으로 예상합니다.\n\n시사점: 체크할 지표는 세 가지다. ① 1H27 모바일·PC 출하와 메모리 계약가의 상승 속도 둔화 여부, ② 엔비디아·브로드컴 공급 증설 속도, ③ 2027 WFE $200B+가 실제 수주로 확인되는지.\n\n### 국가별 한 줄 성적표\n\n| 국가 | 가장 강한 섹터(수치) | 가장 약한 섹터(수치) | 가이던스 톤 | 한 줄 코멘트 |\n|---|---|---|---|---|\n| 미국 | 메모리 YoY **+379.0%**, OPM **80.5%**(표본 2사) | OSAT·테스트 YoY **+0.2%**(표본 1사) | 좋음 | 엔비디아 3Q **$108B**, 마이크론 FQ1 **$61.5B**, WFE 2027 **$200B+**로 체인 전반이 상향. IDM만 컨센서스 **-2.1%** |\n| 대만 | 메모리 YoY **+384.6%**, 파운드리 **$48.7B**(OPM **56.4%**) | 소재 QoQ **+1.6%**, 후공정 장비 컨센서스 **-4.7%** | 좋음 | 13개 밸류체인 모두 YoY 증가. TSMC **+14%**, 미디어텍 **+25~32%** QoQ로 선단이 주도 |\n| 한국 | 메모리 YoY **+171.3%**, OPM **63.6%**(표본 2사) | 파운드리 QoQ **-2.7%**(1사), OSAT OPM **0.3%** | 좋음(메모리 편중) | SK하이닉스 DRAM 출하 **20% 중반** 증가, 장비 컨센서스 전공정 **+28.1%**(1사)·후공정 **+18.3%**. 팹리스 **-8.5%**, 소재 **-6.9%** |\n| 일본 | 후공정 장비 YoY **+61.6%**, OPM **50.7%** | 전력·화합물 YoY **+9.5%** | 혼조 | 연간 상향은 잇따랐지만(TEL WFE **$210B+**) 다음 분기 컨센서스는 대부분 **-3%~+0%** |\n| 중국 | 광통신 YoY **+67.6%**, OPM **28.0%** | 전력·화합물 YoY **+1.5%**, 전공정 장비 YoY **+6.3%** | 혼조 | 광통신·SMIC(**+4~6%** 가이던스)는 견조. 메모리 컨센서스 **-13.1%**, 팹리스 **-5.3%**로 고점 신호 |\n| 유럽 | 전공정 장비 YoY **+53.6%**, QoQ **+23.8%**, OPM **42.7%** | 파운드리 YoY **-14.9%**(X-FAB, 1사) | 좋음 | ASML 4Q **€142~152억**, 인피니언 FY27 **약 €200억**(+20% 이상). 자동차 노출 업체만 부진 |\n\n### 4Q26~1H27 섹터 선호도\n\n| 순위 | 국가·세그먼트 | 근거(실적·가이던스 수치) | 판단 |\n|---|---|---|---|\n| 1 | 대만 파운드리 | YoY **+49.6%**, OPM **56.4%**. TSMC 4Q **+14% QoQ**·GM **65~67%**, FY26 **약 +44%**. UMC 2027 ASP **약 +10%**. 컨센서스 **+14.0%** | 비중확대 |\n| 2 | 미국 팹리스·IP | **$163.6B**, YoY **+75.3%**, OPM **52.9%**. 엔비디아 3Q **$108B**·FY28 **+70%**, 브로드컴 AI **+236%**. 컨센서스 **+14.2%** | 비중확대 |\n| 3 | 유럽 전공정 장비 | YoY **+53.6%**, OPM **42.7%**. ASML 4Q **+21~30%**, ASM FY27 **€5.7B 초과**. 컨센서스 **+23.5%** | 비중확대 |\n| 4 | 미국 메모리(표본 2사) | YoY **+379.0%**, OPM **80.5%**. 마이크론 FQ1 **$61.5B**, 샌디스크 FQ2 **$12.2~12.6B**. 컨센서스 **+13.7%** | 비중확대 |\n| 5 | 한국 메모리(표본 2사) | YoY **+171.3%**, OPM **63.6%**. SK하이닉스 4Q DRAM 출하 **20% 중반 QoQ**, 4Q HBM4가 HBM3E를 추월. 단, 2027 모바일·PC 조정 우려 | 비중확대 |\n| 6 | 대만 팹리스·IP(ASIC) | YoY **+52.0%**. 미디어텍 4Q **+25~32% QoQ**, ASIC 2027 **약 $16B**. 컨센서스 **+14.7%**(디스플레이·PC 팹리스는 제외) | 비중확대 |\n| 7 | 대만·중국 광통신 | 대만 YoY **+72.4%**(OPM **33.8%**), 중국 YoY **+67.6%**(OPM **28.0%**). 컨센서스 각각 **+8.9%**, **+9.4%** | 비중확대 |\n| 8 | 일본 후공정 장비 | YoY **+61.6%**, OPM **50.7%**. 어드반테스트 하반기 매출 상반기 대비 **약 +28%**. 단기 컨센서스 **-1.9%** | 비중확대 |\n| 9 | 미국 IDM(로직·아날로그) | YoY **+25.9%**, OPM **26.5%**. 인텔 CCPG **-20% 이상**, 컨센서스 **-2.1%**. TI 데이터센터는 **+95%** | 중립 |\n| 10 | 중국 메모리(표본 2사)·메모리 연동 팹리스 | 메모리 YoY **+153.4%**에도 컨센서스 **-13.1%**. 팹리스 컨센서스 **-5.3%**(더밍리 **-32.9%**) | 축소 |"};

 const cap={yoy:120,qoq:40,dopm:30,cons:25}[m];const x=Math.max(-1,Math.min(1,v/cap));
 return x>=0?`rgba(220,38,38,${0.12+0.78*x})`:`rgba(37,99,235,${0.12+0.78*(-x)})`;}

 let h='<table><thead><tr><th></th>'+C.map(c=>`<th>${D.ctry[c].flag} ${D.ctry[c].name}</th>`).join('')+'</tr></thead><tbody>';
 D.segs.forEach(s=>{h+=`<tr><th class="r">${s}</th>`;C.forEach(c=>{const e=D.cells[c+'|'+s];
  if(!e){h+='<td class="na">–</td>';return;}

  const txt=metric==='tone'?(v==null?'–':TONE[v][0]):(metric==='dopm'?(v==null?'–':(v>0?'+':'')+v.toFixed(1)+'%p'):f1(v));
  const dt=metric==='yoy'?DOT(v,50,15):metric==='qoq'||metric==='cons'?DOT(v,15,5):metric==='dopm'?DOPM(v):'';const sub=metric==='tone'?`YoY ${f1(e.yoy)}`:`${dt} n=${metric==='cons'?e.cn:e.n}`;
  h+=`<td style="background:${bg||'var(--chip)'};color:${dark?'#fff':'inherit'}" onclick="det('${c}','${s}')"><div class="v">${txt}</div><div class="s">${sub}</div></td>`;});h+='</tr>';});

 매출 $${e.rev.toLocaleString()}M · QoQ ${DOT(e.qoq,15,5)} <b class="${cls(e.qoq)}">${f1(e.qoq)}</b> · YoY ${DOT(e.yoy,50,15)} <b class="${cls(e.yoy)}">${f1(e.yoy)}</b> (기업 중앙값 ${f1(e.med)}) · 영업이익률 ${DOPM(e.dopm)} ${e.opm==null?'–':e.opm.toFixed(1)+'%'} (전년 ${e.opm1==null?'–':e.opm1.toFixed(1)+'%'}) · 다음 분기 컨센 QoQ ${f1(e.cons)} (${e.cn}사)<br>
 ${e.g?'📊 '+e.g+'<br>':''}${e.gd?'🧭 '+e.gd:''}${e.qt?`<blockquote style="margin:8px 0 0;padding:8px 12px;border-left:3px solid var(--acc);background:var(--card);border-radius:6px">💬 “${e.qt.text}”${e.qt.ko?'<br><span class=note>→ '+e.qt.ko+'</span>':''}<br><span class=note>— ${e.qt.by} · ${e.qt.src}</span></blockquote>`:''}`;}

let cur=C[0];const chA=echarts.init($('chA')),chB=echarts.init($('chB'));
function dz(){return [{type:'inside',yAxisIndex:0,filterMode:'none'},{type:'slider',yAxisIndex:0,width:14,right:4,filterMode:'none'}];}
function country(c){cur=c;
 $('ctabs').innerHTML=C.map(k=>`<button class="${k===c?'on':''}" onclick="country('${k}')">${D.ctry[k].flag} ${D.ctry[k].name}</button>`).join('');
 const segs=D.segs.filter(s=>D.cells[c+'|'+s]).sort((a,b)=>(D.cells[c+'|'+b].yoy??-999)-(D.cells[c+'|'+a].yoy??-999)).reverse();
 const tc=getComputedStyle(document.documentElement).getPropertyValue('--ink').trim(), up=getComputedStyle(document.documentElement).getPropertyValue('--up').trim(), dn=getComputedStyle(document.documentElement).getPropertyValue('--dn').trim();
 const bar=(k,name)=>({name,type:'bar',data:segs.map(s=>{const v=D.cells[c+'|'+s][k];return {value:v==null?null:Math.min(v,400),real:v,itemStyle:{color:v==null?'#999':(v>=0?up:dn),opacity:k==='qoq'?.55:1}};}),label:{show:true,position:'right',fontSize:10,color:tc,formatter:p=>p.data.real==null?'':f1(p.data.real)}});
 const base={grid:{left:8,right:64,top:36,bottom:24,containLabel:true},tooltip:{trigger:'axis',axisPointer:{type:'shadow'},formatter:ps=>{const s=ps[0].name,e=D.cells[c+'|'+s];return `<b>${s}</b> (n=${e.n})<br>QoQ ${f1(e.qoq)} · YoY ${f1(e.yoy)}<br>OPM ${e.opm==null?'–':e.opm.toFixed(1)+'%'} (전년 ${e.opm1==null?'–':e.opm1.toFixed(1)+'%'})<br>컨센 QoQ ${f1(e.cons)}`;}},
  yAxis:{type:'category',data:segs,axisLabel:{color:tc,fontSize:11}},xAxis:{type:'value',axisLabel:{color:tc,formatter:v=>v+'%'},splitLine:{lineStyle:{opacity:.25}}},dataZoom:dz(),textStyle:{color:tc},toolbox:{right:10,feature:{dataZoom:{yAxisIndex:'none'},restore:{}}}};
 chA.setOption(Object.assign({},base,{title:{text:'3Q 매출 성장률 (YoY 진한색 · QoQ 연한색)',textStyle:{fontSize:13,color:tc}},legend:{show:false},series:[bar('qoq','QoQ'),bar('yoy','YoY')]}),true);
 chB.setOption(Object.assign({},base,{title:{text:'영업이익률 (전년 동기 → 최근)',textStyle:{fontSize:13,color:tc}},legend:{top:18,right:70,textStyle:{color:tc,fontSize:11}},grid:{left:8,right:64,top:46,bottom:24,containLabel:true},
  series:[{name:'전년 동기',type:'bar',data:segs.map(s=>D.cells[c+'|'+s].opm1),itemStyle:{color:'#9ca3af'}},{name:'최근 분기',type:'bar',data:segs.map(s=>D.cells[c+'|'+s].opm),itemStyle:{color:getComputedStyle(document.documentElement).getPropertyValue('--acc').trim()},label:{show:true,position:'right',fontSize:10,color:tc,formatter:p=>p.value==null?'':p.value.toFixed(1)+'%'}}]}),true);
 const tj=D.ctry[c].tone;
 $('segs').innerHTML=`<div class="sg" style="grid-column:1/-1"><b class="t">${D.ctry[c].flag} ${tj.summary}</b><br>👍 가이던스 좋음: ${tj.best.join(', ')} · 👎 나쁨: ${tj.worst.join(', ')}</div>`+
  tj.segments.slice().sort((a,b)=>b.tone-a.tone).map(s=>{const t=TONE[s.tone];const e=D.cells[c+'|'+s.seg]||{};return `<div class="sg"><b class="t">${s.seg}</b><span class="tone ${t[1]}">${t[0]}</span><br><span class=note>실적 YoY ${DOT(e.yoy,50,15)} · QoQ ${DOT(e.qoq,15,5)} · 이익률 ${DOPM(e.dopm)}</span><br>📊 ${s.growth}<br>🧭 ${s.guide}${s.quote&&s.quote.text?`<div style="margin-top:8px;padding:8px 10px;border-left:3px solid var(--acc);background:var(--chip);border-radius:6px;font-size:12.5px">💬 “${s.quote.text}”${s.quote.ko?'<br><span class=note>→ '+s.quote.ko+'</span>':''}<br><span class=note>— ${s.quote.by} · ${s.quote.src}</span></div>`:''}</div>`;}).join('');
 $('cmd').innerHTML='<details><summary style="cursor:pointer;font-weight:700">'+D.ctry[c].name+' 상세 분석 전문 펼치기</summary>'+md(D.ctry[c].md)+'</details>';}
country(cur);
addEventListener('resize',()=>{chA.resize();chB.resize();});
// 기업 테이블 (정렬: 1클릭 내림차순 → 2클릭 오름차순 → 3클릭 원상태)
const COLS=[['n','기업'],['c','국가'],['s','밸류체인'],['l','결산'],['rev','매출($M)'],['qoq','QoQ'],['yoy','YoY'],['opm','OPM'],['cons','컨센 QoQ'],['note','비고']];
let sk=null,sd=0;
C.forEach(c=>$('fC').insertAdjacentHTML('beforeend',`<option value="${c}">${D.ctry[c].name}</option>`));
D.segs.forEach(s=>$('fS').insertAdjacentHTML('beforeend',`<option>${s}</option>`));
function tbl(){
 $('ct').querySelector('thead').innerHTML='<tr>'+COLS.map(([k,l])=>`<th onclick="srt('${k}')">${l}<span class="ar">${sk===k?(sd===1?'▼':'▲'):'↕'}</span></th>`).join('')+'</tr>';
 const fc=$('fC').value,fs=$('fS').value,q=$('fQ').value.trim();
 let r=D.comps.filter(x=>(!fc||x.c===fc)&&(!fs||x.s===fs)&&(!q||x.n.includes(q)||x.t.toLowerCase().includes(q.toLowerCase())));
 if(sk&&sd){r=r.slice().sort((a,b)=>{const x=a[sk],y=b[sk];if(x==null)return 1;if(y==null)return -1;return (typeof x==='string'?x.localeCompare(y):x-y)*(sd===1?-1:1);});}
 else r=r.slice().sort((a,b)=>b.rev-a.rev);
 $('ct').querySelector('tbody').innerHTML=r.map(x=>`<tr><td>${x.n} <span class="note">${x.t}</span></td><td>${D.ctry[x.c].name}</td><td>${x.s}</td><td>${x.l}</td><td>${x.rev.toLocaleString()}</td><td class="${cls(x.qoq)}">${f1(x.qoq)}</td><td class="${cls(x.yoy)}">${f1(x.yoy)}</td><td>${x.opm==null?'–':x.opm.toFixed(1)+'%'}</td><td class="${cls(x.cons)}">${f1(x.cons)}</td><td>${x.note}</td></tr>`).join('');}
function srt(k){if(sk!==k){sk=k;sd=1;}else{sd=sd===1?-1:0;if(!sd)sk=null;}tbl();}
['fC','fS','fQ'].forEach(i=>$(i).addEventListener('input',tbl));tbl();

- **집계**: 최근 분기 결산이 2026년 7~10월인 기업만, 동일 기업의 전 분기·전년 동기와 비교해 USD 환산 합산. 대형사 비중이 커서 기업 중앙값을 함께 표기.
- **가이던스**: 어닝콜 정리 노트·IR 자료 전망 문장·국내 증권사 리포트와 다음 분기 애널리스트 컨센서스. 톤은 다음 분기·연간 전망 기준 5단계.
- **한계**: 한국은 3Q 보고서 제출 마감(11/16) 전이라 141사 중 ${D.cov.KR[0]}사만 3Q 반영(삼성전자·SK하이닉스 포함). 화홍(보고통화 변경)·윙텍(사업 매각)·에브넷(데이터 중복 의심)은 집계 제외, 반기 보고 유럽 부품사는 QoQ 제외. 메모리는 표본 1~2사인 국가가 많음.`);
