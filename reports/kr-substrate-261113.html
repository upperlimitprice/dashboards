["2026-11-11", 923000], ["2026-11-12", 886000], ["2026-11-13", 862500]], "q": [{"q": "2025Q4", "rev": 29021.5, "gp": 6026.0, "op": 2395.0, "ni": -1416.0, "src": "DART 정기보고서", "gpm": 20.763916406801854, "opm": 8.252502455076408}, {"q": "2026Q1", "rev": 32091.1, "gp": 6602.9, "op": 2805.7, "ni": 0.0, "src": "DART 정기보고서", "gpm": 20.575486661410796, "opm": 8.742922492529082}, {"q": "2026Q2", "rev": 34572.0, "gp": 8445.0, "op": 4403.7, "ni": 0.0, "src": "DART 정기보고서", "gpm": 24.427282193682746, "opm": 12.737764665046857}, {"q": "2026Q3", "rev": 37632.78, "gp": null, "op": 6909.57, "ni": null, "src": "네이버(잠정)", "gpm": null, "opm": 18.360509109345628}], "g27": 121.64845629630139, "per12": 18.242528211156973, "por12": 13.711069098673985, "sec": "### 삼성전기 (009150.KS)\n\n#### 한눈에\n- **사업 정체성:** 이익의 중심은 MLCC(컴포넌트)입니다. 기판은 패키지솔루션 사업부가 FC-BGA(ABF)와 BGA(BT)를 생산하며, 3Q26 전사 매출의 **약 25%**를 차지했습니다(IBK 2026-11-12). NVIDIA는 GTC Berlin에서 삼성전기를 공식 기판 공급사로 발표했습니다.\n- **실적 모멘텀:** 3Q26 영업이익(잠정)은 **6,910억원**으로 **__전년 대비 +165%__**입니다. OPM은 **18.4%**까지 올랐습니다. FC-BGA는 풀가동 중이며 분기마다 약 10%씩 판가를 올리고 있습니다(iM 2026-10-20).\n- **밸류에이션 위치:** PER은 TTM **53.8배**에서 12M fwd **18.2배**, 18M fwd **14.3배**로 빠르게 낮아집니다. 현재 주가는 2027~2028년 이익이 급증한다는 전제를 반영한 수준입니다.\n\n#### 시가총액·주가\n| 항목 | 수치 |\n|---|---|\n| 시가총액 | **65.7조원** (2026-11-13) |\n| 주가 | **862,500원** |\n| 1M | **__-37.2%__** |\n| 3M | **__-44.6%__** |\n| 6M | -14.6% |\n| YTD | **__+219.4%__** |\n| 1Y | **__+289.4%__** |\n\n해석: 1년 수익률은 +289%로 크게 올랐지만, 최근 3개월 동안 고점 대비 절반 가까이 조정을 받았습니다. 조정의 배경은 AI 투자 둔화와 2028년 이후 공급 과잉 우려입니다(IBK 2026-11-12).\n\n#### 최근 4개 분기 실적\n(단위: 억원, 연결)\n\n| 분기 | 매출 | GPM | OPM | 영업이익 | 출처 |\n|---|---|---|---|---|---|\n| 2025Q4 | 29,022 | 20.8% | 8.3% | 2,395 | DART |\n| 2026Q1 | 32,091 | 20.6% | 8.7% | 2,806 | DART |\n| 2026Q2 | 34,572 | **24.4%** | 12.7% | 4,404 | DART |\n| 2026Q3 | **37,633** | –(잠정) | **18.4%** | **__6,910__** | 네이버(잠정) |\n\n- 매출은 4개 분기 연속 늘었습니다(3Q26 +30.3% YoY, +8.9% QoQ). 영업이익은 2Q26 +57% QoQ에 이어 3Q26도 **__+57% QoQ__** 늘었습니다. 증가 속도가 빨라지는 흐름입니다.\n- 2Q26에 GPM이 20%대 초반에서 **24.4%**로 한 단계 올랐습니다. 패키지 부문 OPM도 1Q26 8.3%에서 3Q26 **20.5%**로 올랐습니다(IBK 2026-11-12). 판가 인상과 고다층 제품 비중 확대가 수익성 개선을 이끌고 있습니다.\n\n#### 수주잔고\n- **트래커 수치(최근·QoQ·YoY·분기매출 대비 배수): 없음.** 기판만 따로 집계한 수주잔고는 공시되지 않습니다.\n- 확인된 패키지기판 공시는 **3,605억원** 1건입니다. 메모리용 BGA와 FC-BGA 물량이고, 2027년 1년 계약이며 매출 대비 3.2%입니다(공시 2026-10-19). 이 금액은 3Q26 패키지 매출 9,390억원의 약 0.38배입니다.\n- MLCC, Silicon Capacitor, 패키지기판을 합한 수주잔고는 약 **5.19조원**입니다(Meritz 2026-11-02). 3Q26 전사 매출의 약 1.4배입니다.\n- **성격:** FC-BGA는 단일판매 공시 대신 고객이 지원금·선수금을 내고 가동률을 보장받아 캐파를 미리 확보하는 구조입니다. 9/28 증설 공시 자체가 3년 뒤 물량 확보를 뜻하며, 회사는 2030년 이후 공급도 고객과 논의 중입니다(iM 2026-09-29). Tesla와는 2029~2033년 장기 공급계약을 맺었습니다(telegram 2026-10).\n\n#### 기판 사업 내용\n**기판 비중:** 3Q26 **약 25.0%**(패키지 9,390억원 / 전사 3조7,633억원, IBK 2026-11-12). 2026E 23.9%(IBK), Meritz는 2026E 23.8%, 2027E 22.4%로 봅니다(Meritz 2026-10-29). 3Q26 패키지 영업이익은 1,924억원(OPM 20.5%)입니다.\n\n| 구분 | 제품군 | 단수(층수) | 사용처 | 주요 고객사 | 매출 비중 | 상태·시점 |\n|---|---|---|---|---|---|---|\n| 현재 매출 | FC-BGA 서버·AI ASIC·네트워크 스위치 | **14~24L.** AWS: Trainium2 16L(70×90mm), Trainium3 18~20L(70×90mm), Trainium4 **24L**(110×130mm). Google: TPU v8 18L(90×100mm), TPU v9 **24L**(130×130mm). 5/27 리포트는 TPU v8을 22~24L로 적어 수치가 다릅니다. Meta MTIA Athena(75×75mm)·Iris(80×90mm) >18L. Broadcom Tomahawk 6 >20L, Tomahawk 7 >22L(둘 다 >100×100mm). Qualcomm Cloud AI 200 14L, Cloud AI 300 16L(5/27 리포트: Cloud AI 100 15L). OpenAI ASIC 14L(Meritz 2026-07-31 표8, 2026-05-27 표4). AI 가속기용은 약 20층으로 일반 제품의 2배 이상이고 면적은 4배 이상입니다(지속가능경영보고서 2025). 서버용 20층(75×75mm)은 KPCA 2022년 발표 자료로 참고만 | AI ASIC, DC 네트워크 스위치, 서버 CPU, LPU | Amazon, AMD, NVIDIA(네트워킹 IC, 2Q26~), Google, Meta, 신규 LPU 고객 | FC-BGA 전체가 패키지 매출의 **65%**(6,100억원, SK 2026-10-29 추정). FC-BGA 중 서버·네트워크 **60% 이상**(IBK) | 풀가동. 분기 약 10% 판가 인상, 3Q26 OPM **약 30%**(iM 2026-10-20) |\n| 현재 매출 | Embedded PCB(서버 CPU용 FC-BGA) | 근거 없음 | 서버 CPU(MLCC 등 부품 내장) | 기존 서버 CPU 고객, 신규 CPU 고객 | FC-BGA에 포함 | 확대. 신규 고객 납품은 4Q26부터 본격화(Meritz 2026-10-29) |\n| 현재 매출 | FC-BGA 전장·PC 6-10-12", 479500], ["2026-10-13", 452500], ["2026-10-14", 441500], ["2026-10-15", 401000], ["2026-10-16", 406500], ["2026-10-19", 422000], ["2026-10-20", 407000], ["2026-10-21", 406500], ["2026-10-22", 395000], ["2026-10-23", 379000], ["2026-10-26", 367000], ["2026-10-27", 374500], ["2026-10-28", 368000], ["2026-10-29", 347500], ["2026-10-30", 326000], ["2026-11-02", 327500], ["2026-11-03", 304000], ["2026-11-04", 309000], ["2026-11-05", 285000], ["2026-11-06", 265000], ["2026-11-09", 264000], ["2026-11-10", 278000], ["2026-11-11", 293000], ["2026-11-12", 287500], ["2026-11-13", 288500]], "q": [{"q": "2025Q4", "rev": 76097.6, "gp": 6550.8, "op": 3247.5, "ni": -2053.2, "src": "DART 정기보고서", "gpm": 8.608418662349404, "opm": 4.267545888438005}, {"q": "2026Q1", "rev": 55348.3, "gp": 5574.3, "op": 2953.2, "ni": 0.0, "src": "DART 정기보고서", "gpm": 10.071312036684054, "opm": 5.335665232717174}, {"q": "2026Q2", "rev": 55272.4, "gp": 5310.0, "op": 2457.5, "ni": 0.0, "src": "DART 정기보고서", "gpm": 9.606964778080924, "opm": 4.446161194375493}, {"q": "2026Q3", "rev": 63671.2, "gp": 3922.5, "op": 948.5, "ni": 0.0, "src": "DART 정기보고서", "gpm": 6.160556106999712, "opm": 1.4896845041400195}], "g27": 31.373488188809375, "per12": 8.032488838761443, "por12": 5.817315181330361, "sec": "### LG이노텍 (011070.KS)\n\n#### 한눈에\n- **사업 정체성:** 매출의 **약 85%가 광학솔루션(카메라모듈)**이다. 기판이 속한 패키지솔루션은 3Q26 매출 비중 **7.6%**에 그친다. 그래도 **RF-SiP 기판 세계 점유율 1위**이고, FC-BGA에는 후발주자로 진입하는 중이다(IBK 2026-10-28; SK 2026-11-12).\n- **실적 모멘텀:** 영업이익률(OPM)은 1H26 4~5%대에서 **__3Q26 1.5%로 급락__**했다. 회사 전체로는 부진하지만 기판은 BT 계열이 풀캐파로 돌면서 판가를 올렸다. FC-BGA는 북미 반도체 3사와의 장기공급계약(LTA)이 마무리 단계다(SK 2026-11-12).\n- **밸류에이션 위치:** 12M fwd 기준 **PER 8.0x, PSR 0.27x**(FMP 컨센서스)다. 주가는 연초 대비 플러스지만 **__6개월 새 -60.6%__**로 고점에서 크게 조정받았다.\n\n#### 시가총액·주가\n- 시가총액은 **6조 7,799억원**, 주가는 **288,500원**이다(2026-11-13 기준).\n\n| 1M | 3M | 6M | YTD | 1Y |\n|---|---|---|---|---|\n| **__-34.7%__** | **__-55.9%__** | **__-60.6%__** | +7.9% | +18.0% |\n\n- 해석: 연초·1년 전보다는 여전히 높지만, 상반기에 급등한 몫을 3개월 사이 대부분 되돌렸다. 단기 낙폭이 7사 가운데서도 큰 축으로 보인다.\n\n#### 최근 4개 분기 실적\n(단위: 억원, 연결. 출처: DART 정기보고서)\n\n| 분기 | 매출 | GPM | OPM | 영업이익 |\n|---|---|---|---|---|\n| 4Q25 | 76,098 | 8.6% | 4.3% | 3,248 |\n| 1Q26 | 55,348 | **10.1%** | **5.3%** | 2,953 |\n| 2Q26 | 55,272 | 9.6% | 4.4% | 2,458 |\n| 3Q26 | 63,671 | **6.2%** | **1.5%** | **949** |\n\n- 1Q26은 영업이익이 전년 대비 **__+136%__**, 2Q26은 전년 114억원에서 2,458억원으로 늘었다. 이 기간 GPM이 10% 안팎까지 올라 상반기는 뚜렷하게 좋아졌다.\n- 3Q26은 매출이 전년 대비 +18.6% 늘었는데도 **__영업이익은 949억원으로 전년 대비 -53%__**였다. GPM 6.2%는 최근 8개 분기 중 가장 낮다. 환율 영향만으로 약 2,000억원의 이익 차이가 났다(SK 2026-11-12; IBK 2026-10-28).\n\n#### 수주잔고\n- 트래커 수치(최근·QoQ·YoY·분기매출 대비 배수): **기판 수주잔고는 공시되지 않아 산출할 수 없다.**\n- 수주의 성격:\n  - **FC-BGA:** 북미 반도체 3사와 LTA를 마무리하고 있고, 추가 고객사와도 협의 중이다. 계약 기간은 평균 4~5년(유안타 2026-10-08) 또는 2032년까지(메리츠 2026-09-21)로 논의된다. 회사는 앞으로 기판 물량 대부분이 LTA 기반이 될 것이라고 밝혔다.\n  - **RF-SiP:** 단독 공급 구조라 프로젝트별 물량이 미리 정해진다.\n  - **볼 지표:** SK증권은 LTA 체결 자체보다 **선수금 규모와 수취 시점**이 중요하다고 본다(SK 2026-11-12).\n- 참고로 회사가 공개한 수주잔고(2025년 19.2조원, 2026년 말 20조원 이상 전망)는 **모빌리티 부문 수치이고 기판과는 무관하다.**\n\n#### 기판 사업 내용\n- **매출 중 기판 비중:**\n  - 3Q26 패키지솔루션 매출은 4,818억원으로 전사 매출의 **7.6%**다(IBK 2026-10-28).\n  - 2026E 비중은 7.9%(IBK 2026-10-28), 유안타는 2026E 8.3%, 2027E 9.6%로 본다(유안타 2026-10-08).\n  - 이 수치에는 디스플레이소재·부품이 섞여 있어 **순수 반도체 기판 비중은 이보다 낮다.**\n- **영업이익 기준 패키지솔루션 비중:** 2026E 21%, 2027E 30%(신한 2026-10-28), **__2028E 41%__**(iM·메리츠 2026-07-28)로 전망된다.\n\n| 구분 | 제품군 | 단수(층수) | 사용처 | 주요 고객사 | 매출 비중 | 상태·시점 |\n|---|---|---|---|---|---|---|\n| 현재 매출 | RF-SiP 기판(BT, mSAP, Cu-Post) | 미공개 | 스마트폰 RF 모듈, 위성통신 등 | 브로드컴·스카이웍스·코보(최종 수요처는 북미 스마트폰 고객사) | 미공개 | 양산·풀캐파. **세계 점유율 1위**. Cu-Post는 단독 공급이며 기술 격차 약 2년, **2026년 Cu-Post 매출 전년 대비 약 2배** 전망(메리츠 2026-05-06·05-18; SK 2026-11-12) |\n| 현재 매출 | FC-CSP 기판(BT) | 미공개 | 메모리(신호 속도 향상·박형화), 모바일 | 메모리 고객사(이름 미공개, 다수 제품 퀄 통과) | 미공개 | 확대 중. LTA 기반 증설 가능성(메리츠 2026-05-18; 신한 2026-10-28) |\n| 현재 매출 | AiP 기판(BT) | 미공개 | 스마트폰 안테나 모듈 | 미공개 | 미공개 | 양산(메리츠 2026-09-21) |\n| 현재 매출 | FC-BGA(ABF) PC CPU용 유 있음) | 유안타 2026-07-08·07-28 |\n\n**증설 계획**\n\n| 대상 | 추가 캐파 | 타임라인 | 투자액 |\n|---|---|---|---|\n| 베트남 하이퐁 패키지기판 신공장(FC-BGA 등) | 미공개 | 2026-06-04 MOU 체결, 2028년 양산 목표 | **1조원 이상(약 10억달러)**(지디넷 2026-10-30; Citi 2026-06-04) |\n| 구미 FC-BGA 추가 라인(공장 내 여유 공간 활용) | 미공개 | 검토 중 | 6,000억원 투자 진행 중(보도 기준, 지디넷 2026-10-30) |\n| ABF 기판 대규모 증설(LTA·선수금 기반) | 미공개 | 빠르면 연내 확정, 2026~2028년 투자. 장비는 선제 발주 중 | **__2조원 이상__**(증권사 추정, SK 2026-11-12; 메리츠 2026-07-28) |\n| FC-CSP 증설(LTA 기반) | 미공개 | 미정 | 미정. 선급금이 따라올 수 있음(메리츠 2026-05-18) |\n\n- 전사 CAPEX는 2026F 1조 240억원, **2027F 1조 4,200억원**으로 추정된다(IBK 2026-10-28).\n\n#### 밸류에이션\n(시총 6조 7,799억원 기준, 단위: 억원)\n\n| 구분 | 매출 | 영업이익 | 순이익 | PER | POR | PSR |\n|---|---|---|---|---|---|---|\n| TTM(4Q25~3Q26) | 250,390 | 9,607 | -2,053* | 10.8x* | 7.1x | 0.27x |\n| 12M fwd | 252,440 | 11,655 | 8,441 | **8.0x** | **5.8x** | 0.27x |\n| 18M fwd | 260,417 | 13,002 | 9,543 | **7.1x** | **5.2x** | 0.26x |\n\n- *TTM PER은 참고용이다. 2026년 분기 순이익이 데이터에 비어 있어(0으로 처리) TTM 순이익이 -2,053억원으로 집계됐고, 그래서 PER 10.8x와 산출 근거가 맞지 않는다.\n- **가중 방식:** 12M fwd는 2026E 1.5개월 + 2027E 10.5개월, 18M fwd는 2027E 8개월 + 2028E 4개월로 가중했다.\n- **추정치 출처:** FMP 컨센서스(2026E 18명, 2027E 25명, 2028E 12명)다. 영업이익 추정은 2026E 9,144억원 → 2027E 1조 2,013억원 → 2028E 1조 4,980억원이다.\n- **보수적 추정과의 차이:** IBK(2026-10-28)는 영업이익을 2026E 8,250억원, 2027E 7,180억원, 2028E 7,620억원으로 본다. **2027E가 컨센서스보다 약 40% 낮아** IBK 기준이면 멀티플이 더 높아진다.\n- **피어 대비 위치:** 이 섹션 데이터에는 피어 수치가 없다. 매출의 85%가 광학이라 **기판 순수주보다 낮은 PSR·PER이 구조적으로 나오는** 위치다. 기판 이익 비중이 커지면 재평가 여지가 있다.\n\n#### 투자 포인트·리스크\n**투자 포인트**\n- **2030년 패키징기판 목표는 __매출 4조원(FC-BGA 2조 + BT 2조), 영업이익 1조원__이다.** 2026E 패키지솔루션 매출 1.9조원의 약 2배다(SK 2026-11-12).\n- FC-BGA 매출 로드맵은 **__2026년 1,000억원 → 2027년 4,000억원 → 2028년 1조원__**이다(SK 2026-07-28). 패키지 내 FC-BGA 비중은 2025년 3%에서 2028년 25%로 오를 전망이다(iM 2026-07-28).\n- BT 계열은 풀캐파 상태에서 BT·ABF 모두 판가를 올렸고 **두 자릿수 마진**을 낸다. Cu-Post는 단독 공급이며 기술 격차가 약 2년이다(메리츠 2026-05-18·09-21; SK 2026-11-12).\n- 북미 반도체 3사와 LTA를 마무리하고 있고, 선수금을 받아 증설하는 구조라 **수요 가시성이 높아졌다**(메리츠 2026-07-28; SK 2026-11-12).\n- 패키지솔루션의 영업이익 기여도는 **2026E 21% → 2028E 41%**로 커질 전망이다. 이익 구성이 바뀌는 데 따른 재평가 여지가 있다(신한 2026-10-28; iM·메리츠 2026-07-28).\n\n**리스크**\n- **FC-BGA는 아직 적자이고 가동률이 50% 미만**이다(2Q26). 후발주자라 대면적·고다층 수율 확보와 고객 인증에 실패할 수 있다(유안타 2026-07-08; SK 2026-11-12).\n- 삼성전기(6.8조원), 이비덴, 신코 등 경쟁사가 공격적으로 증설하고 있어 **2028년 이후 ABF 공급 과잉** 가능성이 있다. 장비 리드타임이 길어져 증설이 늦어질 수도 있다(메리츠 2026-09-21; 2026-10~11 보도).\n- 매출의 약 85%가 광학(아이폰 카메라)이라 **환율과 세트 수요**가 실적을 좌우한다. 3Q26에는 환율 영향으로 약 2,000억원의 이익 차이가 났다(SK 2026-11-12; IBK 2026-10-28).\n- ABF 증설 규모와 시점이 아직 정해지지 않았다. **선수금 규모와 수취 시점**에 따라 재무 부담이 달라진다(SK 2026-11-12).\n- 컨센서스와 보수적 추정(IBK)의 2027E 영업이익 차이가 커서, 실적이 기대에 못 미치면 추정치가 하향될 위험이 있다."}, {"code": "222800", "name": "심텍", "mcap": 47758.0, "px": [["2025-11-13", 53600], ["2025-11-14", 49900], ["2025-11-17", 55900], ["2025-11-18", 54700], ["2025-11-19", 55400], ["2025-11-20", 53900], ["2025-11-21", 49000], ["2025-11-24", 50100], ["2025-11-25", 52400], ["2025-11-26", 53600], ["2025-11-27", 53800], ["2025-11-28", 54200], ["2025-12-01", 52400], ["2025-12-02", 52100], ["2025-12-03", 57200], ["2025-12-04", 53500], ["2025-12-05", 57500], ["2025-12-08", 56500], ["2025-12-09", 53700], ["2025-12-10", 54900], ["2025-12-11", 54100], ["2025-12-12", 53200], ["2025-12-15", 50200], ["2025-12-16", 48900], ["2025-12-17", 52100], ["2025-12-18", 51700], ["2025-12-19", 52300], ["2025-12-22", 51400], ["2025-12-23", 50000], ["2025-12-24", 49100], ["2025-12-26", 49750], ["2025-12-29", 50800], ["2025-12-30", 49350], ["2026-01-02", 50800], ["2026-01-05", 51700], ["2026-01-06", 48150], ["2026-01-07", 43550], ["2026-01-08", 42800], ["2026-01-09", 43100], ["2026-01-12", 46800], ["2026-01-13", 48300], ["2026-01-14", 48000], ["2026-01-15", 52000], ["2026-01-16", 51600], ["2026-01-19", 51200], ["2026-01-20", 49250], ["2026-01-21", 47600], ["2026-01-22", 48650], ["2026-01-23", 50400], ["2026-01-26", 52100], ["2026-01-27", 52500], ["2026-01-28", 59700], ["2026-01-29", 56300], ["2026-01-30", 60500], ["2026-02-02", 59600], ["2026- "2026-10-19", 126700], ["2026-10-20", 124000], ["2026-10-21", 126000], ["2026-10-22", 119500], ["2026-10-23", 113500], ["2026-10-26", 107300], ["2026-10-27", 117200], ["2026-10-28", 127500], ["2026-10-29", 123400], ["2026-10-30", 113500], ["2026-11-02", 120400], ["2026-11-03", 112300], ["2026-11-04", 123000], ["2026-11-05", 100900], ["2026-11-06", 93500], ["2026-11-09", 99900], ["2026-11-10", 106600], ["2026-11-11", 121600], ["2026-11-12", 123900], ["2026-11-13", 126400]], "q": [{"q": "2025Q4", "rev": 3933.6, "gp": 359.4, "op": 102.6, "ni": -269.9, "src": "DART 정기보고서", "gpm": 9.136668700427089, "opm": 2.6082977425259304}, {"q": "2026Q1", "rev": 4223.7, "gp": 438.8, "op": 137.1, "ni": 145.9, "src": "DART 정기보고서", "gpm": 10.388995430546679, "opm": 3.245969173947013}, {"q": "2026Q2", "rev": 5145.6, "gp": 951.5, "op": 628.9, "ni": 593.6, "src": "DART 정기보고서", "gpm": 18.491526741293534, "opm": 12.22209266169154}, {"q": "2026Q3", "rev": 5359.34, "gp": null, "op": 1017.87, "ni": null, "src": "네이버(잠정)", "gpm": null, "opm": 18.99245056294245}], "g27": 83.62931250173204, "per12": 14.123314603924637, "por12": 11.186384457711814, "sec": "### 심텍 (222800.KQ)\n\n#### 한눈에\n- **사업 정체성**: 매출 100%가 반도체용 PCB에서 나오는 회사입니다(패키지기판 76.0%, 모듈 PCB 24.0%, 1H26 누적, DART 2026.06 반기보고서). 메모리향 BT 기판이 중심이며, 엔비디아 Vera Rubin용 **SoCAMM의 퍼스트벤더**입니다(메리츠 2026-11-09).\n- **실적 모멘텀**: SoCAMM·FC-CSP·SiP 비중이 늘고 Tenting 비중이 줄면서 영업이익률이 **__1Q26 3.2% → 3Q26 19.0%__**로 올랐습니다. 4Q26 SoCAMM 매출 가이던스는 1,000억원입니다(메리츠 2026-11-09).\n- **밸류에이션 위치**: TTM 기준으로는 비싸 보입니다(POR 25.3배). 컨센서스 기준으로는 **12M fwd PER 14.1배, 18M fwd PER 11.9배**입니다. 메리츠 영업이익 추정치는 컨센서스보다 높습니다(FMP 컨센서스, 메리츠 2026-11-09).\n\n#### 시가총액·주가\n- **시가총액 4조 7,758억원**, 주가 **126,400원**(2026-11-13)\n\n| 1M | 3M | 6M | YTD | 1Y |\n|---|---|---|---|---|\n| -10.4% | +16.3% | +26.0% | **__+148.8%__** | **+135.8%** |\n\n- 해석: 연초 이후 주가가 2.5배 수준으로 올랐습니다. 최근 1개월 -10.4% 조정 기간은 3Q26 순이익이 컨센서스를 밑돈 시점(2026-11-04)과 겹칩니다.\n\n#### 최근 4개 분기 실적\n(단위: 억원)\n\n| 분기 | 매출 | GPM | OPM | 영업이익 |\n|---|---|---|---|---|\n| 4Q25 | 3,933.6 | 9.1% | 2.6% | 102.6 |\n| 1Q26 | 4,223.7 | 10.4% | 3.2% | 137.1 |\n| 2Q26 | 5,145.6 | 18.5% | 12.2% | 628.9 |\n| 3Q26 | 5,359.3 | –(잠정) | **19.0%** | **1,017.9** |\n\n(4Q25~2Q26: DART 정기보고서 / 3Q26: 네이버 잠정치)\n\n- 3Q26 영업이익은 **__YoY +721%(123.9억 → 1,017.9억원), QoQ +62%__**입니다. 매출 증가율(YoY +43.7%)보다 이익 증가율이 훨씬 커서, 믹스 개선과 판가 효과가 실적을 끌어올리고 있습니다.\n- 반면 3Q26 지배주주순이익은 **253억원으로 컨센서스 532억원을 밑돌았습니다**. 원화 강세에 따른 달러 매출채권 평가손실이 500억원 이상 발생했기 때문입니다(하나 2026-11-04, 메리츠).\n\n#### 수주잔고\n(트래커 기준, 단위: 억원)\n\n| 최근(2026.06) | QoQ | YoY | 분기매출 대비 배수 |\n|---|---|---|---|\n| **5,892.2** | +21.6% | **__+120.3%__** | **1.15배**(2Q26 매출 5,145.6억원 기준) |\n\n- 2026.09 잔고는 아직 공시 전이어서 데이터에 없습니다.\n- DART 기준 1H26 말 잔고는 379,251㎡, 3억 9,236만달러입니다. 수주총액 9억 9,885만달러 가운데 6억 649만달러를 납품했습니다(DART 2026.06 반기보고서).\n- 성격: 일별 P.O 중심의 **단기 수주**입니다. 다만 가시성을 높이는 변화가 있습니다.\n  - 월 수주액이 1.5억달러 수준으로 늘었습니다(DB 2026-11-04).\n  - 수주 가시성이 3개월에서 6개월로 길어졌습니다(iM 2026-08 NDR).\n  - 메모리 3사와 **3~4년 LTA를 협의 중**입니다. 체결되면 연간 양산 물량의 약 60%가 LTA로 공급될 전망입니다(메리츠 2026-11-09).\n\n#### 기판 사업 내용\n- **기판 매출 비중 100%**로, 비기판 사업은 없습니다.\n  - 1H26 누적: Package Substrate 76.0%, Module PCB 24.0%(DART 2026.06)\n  - 3Q26: Substrate 73.4%(3,935억원), Module PCB 26.6%(1,425억원)(메리츠 2026-11-09)\n\n| 구분 | 제품군 | 단수(층수) | 사용처 | 주요 고객사 | 매출 비중 | 상태·시점 |\n|---|---|---|---|---|---|---|\n| 현재 매출 | MCP Substrate(모바일 LPDDR + SoCAMM향 MCP) | 층수 수치는 공개되지 않음. SoCAMM향 MCP는 모바일 MCP보다 층수가 높고 부가가치도 큼(2025-11-26 컨콜노트). 콥데이에서 \"4층이 8층이 되면 단가가 훨씬 올라간다\"는 언급이 있었으나 어느 제품인지 특정하지 않은 ASP 설명 예시임(2026-10-12 콥데이) | 모바일·서버 LPDDR MCP, SoCAMM용 LPDDR5X | 삼성전자, SK하이닉스, Micron | **37.4%**(3Q26, 2,003억원. SoCAMM향 MCP 160억원 포함) | 확대 |\n| 현재 매출 | Module PCB – SoCAMM(SoCAMM2) | 층수 수치는 공개되지 않음. 서버용 DDR5 모듈보다 층수가 높아 캐파를 더 많이 씀(2026-08 텔레그램, 2026-10-12 콥데이) | 엔비디아 Vera Rubin, CPU향 AI 서버 LPDDR 모듈 | 메모리 3사(최종고객 엔비디아) | 7.6%(3Q26, 407억원. 모듈 PCB 내 29%) | **확대. 메모리 3사 모두에서 퍼스트벤더, 고객사별 점유율 50% 이상** |\n| 현재 매출 | Module PCB – 서버/PC/SSD | 층수 수치는 공개되지 않음. SoCAMM보다 층수가 낮음(2026-08 텔레그램). 시안 공장에서 생산 | 서버 RDIMM, PC 모듈, SSD | 삼성전자, SK하이닉스, Micron | 18.2%(3Q26. 서버 461억, PC 256억, SSD 258억원) | 서버는 확대, PC·SSD는 축소 |\n| 현재 매출 | FC-CSP | 기존 양산 **최대 8층**. 슬림 FC-BGA(FC-CSP로 분류)는 **양산 최대 10층·30x30mm, 샘플 최대 14층·50x50mm**, 솔더 간격 양산 120㎛·개발 90㎛(2026-09 텔레그램 기사). 고다층 MSAP는 4층 이상을 뜻함(2022-01 공시, 참고) | SSD 컨트롤러, 서버 RDC, 전장(4Q25~), CXL 컨트롤러 | 메모리·전장 고객사 | 12.4%(3Q26, 667억원) | **__확대(YoY +89%)__**. FC-CSP 내 전장 비중은 2026년 20%, 2027년 30% 전망 |\n| 현재 매출 | Tenting Substrate | 데이터 없음 | 저부가 메모리 패키지 | – | 11.6%(3Q26, 623억원) | 축소(QoQ -22%) |\n| 현재 매출 | GDDR Substrate | 데이터 없음 | 그래픽 메모리 | – | 6.1%(3Q26, 328억원) | 유지·소폭 감소 |\n| 현재 매출 | SiP Substrate | 고다층 MSAP(4층 이상) 범주에 속함(RF-SiP·AiP, 2022-01 공시, 참고). SiP만 따로 적힌 수치는 없고, R&D 항목에 'AiP High Layer 기판개발'이 있음(DART 2026.06) | 모바일 AP향 SiP, RF-SiP | ASE·Amkor 등 OSAT | 5.4%(3Q26, 287억원) | 확대(YoY +54%) |\n| 향후 기대 | SoCAMM 모듈 + MCP(고객 다변화) | 위 SoCAMM 모듈·MCP 행과 같음(수치 미공개) | Vera Rubin 이후 AMD 등 CPU, 중국·북미 메모리 업체 | 메모리 3사, 중국·북미 메모리 업체, AMD(최종고객) | – | 4Q26 모듈 700억 + MCP 300억원. **__2027년 합산 3,700억원 이상__**(회사 가이던스, 메리츠 2026-11-09). iM은 2028년 7,000~8,000억원으로 전망 |\n| 향후 기대 | LPDDR6 기반 차세대 SoCAMM | 미공개 | 차세대 AI 서버 메모리 모듈 | 메모리 고객사 | – | 선행 개발 중(시점 미제시) |\n| 향후 기대 | CXL 컨트롤러용 FC-CSP, CXL 모듈 PCB | 미공개 | 범용 서버 CXL 메모리 확장 | 주요 고객사(설계·개발 완료) | – | 2027년 시장 개화 |\n| 향후 기대 | LPCAMM 컨트롤러 등 | 미공개 | PC·서버 저전력 모듈 | – | – | 2027년 가시화 기대(신한 2026-11-04) |\n| 향후 기대 | 시스템IC(FC-CSP·SiP) 확대 | FC-CSP·SiP 행과 같음 | 전장, 모바일 AP, SSD, 서버 | – | 목표는 **전사 매출의 30% 이상** | 메리츠 추정 2025년 2,024억 → 2026년 3,251억 → 2027년 3,708억원 |\n\n#### 캐파\n**현재 캐파·가동률**\n\n| 항목 | 캐파 | 가동률 | 출처 |\n|---|---|---|---|\n| HDI(Module PCB 등) | 월 44,000㎡ | 1H26 공장 전체 평균 80.41% | DART 2026.06 |\n| SPS(Substrate 등) | 월 97,000㎡ | 1H26 공장 전체 평균 80.41% | DART 2026.06 |\n| 전사 | 월 141,000㎡ | 3Q26 80% 중후반, **4Q26 88% 전망** | 키움·DB 2026-11-04 |\n| SoCAMM 모듈(청주) | 월 4,600㎡. 2027년 모듈 매출 약 3,000억원 규모이며, 라인 배치를 조정하면 최대 4,000억원까지 가능 | – | iM 2026-08-25, 메리츠 2026-11-09 |\n| MSAP | 월 45,000㎡(매출 약 2조원 수준) | – | -11-12", 93400], ["2026-11-13", 93100]], "q": [{"q": "2025Q4", "rev": 3178.9, "gp": 460.6, "op": 289.5, "ni": 326.1, "src": "DART 정기보고서", "gpm": 14.489288747680016, "opm": 9.106923778665577}, {"q": "2026Q1", "rev": 3463.1, "gp": 724.0, "op": 513.0, "ni": 455.0, "src": "DART 정기보고서", "gpm": 20.906124570471544, "opm": 14.813317547861743}, {"q": "2026Q2", "rev": 4009.8, "gp": 1076.4, "op": 702.8, "ni": 1031.8, "src": "DART 정기보고서", "gpm": 26.844231632500374, "opm": 17.527058706169882}, {"q": "2026Q3", "rev": 4181.15, "gp": null, "op": 878.71, "ni": null, "src": "네이버(잠정)", "gpm": null, "opm": 21.015988424237353}], "g27": 50.142160291428354, "per12": 13.044872798538655, "por12": 10.70899461683656, "sec": "### 대덕전자 (353200.KS)\n\n#### 한눈에\n- **매출 100%가 기판인 회사**다. 2025년 매출 1조 653억원 중 PKG(BT·FC-BGA)가 **84.7%**, MLB가 **15.3%**다(SK증권 2026-04-30).\n- 3Q26 매출 4,181억원(**+46% YoY**), 영업이익 879억원으로 OPM **__21.0%__**를 기록하며 3년 만에 20%대 이익률을 되찾았다. 영업이익은 컨센서스를 13% 웃돌았다(네이버 잠정; 신한·메리츠 2026-11).\n- 12M fwd PER은 **13.0배**다. 메리츠 기준 2027E PER은 **9.4배**로, 대만 ABF 피어 평균 17.7배보다 약 47% 낮다(FMP 컨센서스; 메리츠 2026-11-09).\n\n#### 시가총액·주가\n| 항목 | 수치 |\n|---|---|\n| 시가총액 | **4조 5,908억원** |\n| 주가 | **93,100원** (2026-11-13) |\n| 1M | **__-35.8%__** |\n| 3M | -21.8% |\n| 6M | -31.4% |\n| YTD | **+94.2%** |\n| 1Y | +88.1% |\n\n- 해석: 연간으로는 두 배 가까이 올랐지만 최근 1개월에 35.8% 빠졌다. AI 설비투자 지속성 우려와 Ibiden 등 피어 멀티플 하락으로 10월 28일 고점 대비 **48% 급락**한 상태다(메리츠 2026-11-09).\n\n#### 최근 4개 분기 실적\n| 분기 | 매출(억원) | GPM | OPM | 영업이익(억원) |\n|---|---|---|---|---|\n| 4Q25 | 3,179 | 14.5% | 9.1% | 290 |\n| 1Q26 | 3,463 | 20.9% | 14.8% | 513 |\n| 2Q26 | 4,010 | 26.8% | 17.5% | 703 |\n| 3Q26 | 4,181 | –(잠정) | **21.0%** | **879** |\n\n(4Q25~2Q26은 DART 정기보고서, 3Q26은 네이버 잠정치)\n\n- 매출은 4개 분기 연속 늘었다. GPM은 14.5%에서 26.8%로 **__두 분기 만에 12%p 넘게 올랐다__**. 판가 인상과 비메모리 중심 믹스 개선이 환율 하락을 상쇄했다.\n- 3Q26 영업이익은 전년 동기 245억원의 **__약 3.6배__**다. 다만 4Q26은 원화 강세로 회사 가이던스가 전 분기 대비 감익이고, SK증권은 4Q26 영업이익을 약 800억원 초중반으로 추정한다(SK증권 2026-11-02).\n\n#### 수주잔고\n| 항목 | 수치 |\n|---|---|\n| 최근(2026.06) | **3,328억원** |\n| QoQ (vs 2026.03 2,374억원) | **+40.2%** |\n| YoY (vs 2025.06 1,283억원) | **__+159%__** |\n| 분기매출 대비 배수 (2Q26 매출 4,010억원 기준) | 약 **0.83배** |\n\n- 트래커 시계열(억원): 792(2025.03) → 1,283 → 3,110 → 2,168 → 2,374 → 3,328(2026.06).\n- 성격: 사업 조사 자료로는 별도의 수주잔고 수치가 공개되지 않았다. 잔고 규모가 분기 매출에 못 미치는 단기 주문 성격이므로, 실질적인 물량 가시성은 **LTA(장기공급계약)와 고객 선수금** 구조에서 판단해야 한다.\n  - 2026년분 LTA 선수금 협상은 끝났고 2027년분은 협상 중이다. 공급이 부족한 상황이라 회사가 LTA를 골라서 체결하고 있다(메리츠 NDR 2026-11-09).\n  - 선수금이 들어오면서 비유동부채가 전년 대비 **__+674%__** 늘었다(교보증권 2026-11-02).\n\n#### 기판 사업 내용\n- 기판 비중: **100%**(기판 외 사업 없음). 1Q26 기준 PKG 84%(2,908억원), MLB 16%(554억원)이다(SK증권 2026-04-30). 3Q26 MLB 매출은 718억원으로 전사의 약 17%다(신한투자증권 2026-11-02).\n\n| 구분 | 제품군 | 단수(층수) | 사용처 | 주요 고객사 | 매출 비중 | 상태·시점 |\n|---|---|---|---|---|---|---|\n| 현재 매출 | FC-CSP (BT) | **8L 이상**(DART 연구개발 '8L+ PKG용 FCCSP', 2020~2025년 보고서에 반복 기재; 2024-03-20 사업보고서) | SSD 컨트롤러(FC-CSP 내 약 50%), 모바일 AP, 메모리 | 주요 메모리 고객사 | **38%**(1Q26 전사 기준, PKG 대비 45%) | 확대: 준쇼티지·풀캐파, 판가 인상(SK증권 2026-04-30) |\n| 현재 매출 | CSP (BT, 메모리 PKG: DDR5·LPDDR·GDDR) | 공개된 층수 없음 | DRAM 패키지 | 주요 메모리 고객사 | **21%**(1Q26, PKG 대비 25%) | 확대: 2026년 4월 1차 두 자릿수 판가 인상, **2차 인상은 1Q27 반영 예정**(메리츠 NDR 2026-11-09) |\n| 현재 매출 | FC-BGA (ABF) | 전체 개발 스펙은 **20층 이상, 100x100mm 이상, 미세회로 10μm 이하**(SK증권 2026-04-30). 개발 과제로 **26L(120x150mm, 2.7mmT)** 진행(DART 반기보고서 2026-08-13). 네트워크 스위치용 Large Body는 **10층대 1종(2026년 6월 양산), 20층 1종(4Q26 양산 예정)**(컨콜노트 2026-06-16). 메리츠는 9월 말 다른 네트워크 고객사에 면적·층수를 늘린 Large Body를 양산한다고만 했고 층수는 밝히지 않음(메리츠 2026-09-01) | 전장·자율주행, 광모듈, DC 네트워크 스위치(Large Body 2개 모델 6월 말·9월 말 양산, 수율 약 70%) | 북미 EV 업체(대신증권 2026-11-02), 네트워크 스위치 고객 | **23%**(1Q26, PKG 대비 27%). FC-BGA 안에서 전장+광모듈 약 75%(하나증권 2026-11-01) | 확대: 실질 풀가동, Large Body로 믹스 전환 중 |\n| 현재 매출 | MLB (고다층 PCB) | **AI 가속기 20~30층, 방산 10~30층**(컨콜노트 2026-06-16). AI 가속기 Compute Board는 **40층에 근접**(메리츠 2026-09-01). 우주항공 제품 층수는 미공개 | 네트워크, 방산, 우주항공, AI 가속기 | AI 가속기 고객사, 우주항공 신규 고객 | **17%**(3Q26, 718억원) | 확대: 가동률 약 90%. 3Q26 QoQ 네트워크 +16%, 항공우주 **+36%**, 방산 +24%(신한 2026-11-02) |\n| 현재 매출 | 기타 (SiP 등) | **10~12L**(DART 연구개발 '고다층 복합사양 SiP'; 2024-03-20 사업보고서) | SiP | – | 1.4%(1Q26) | 축소·정체 |\n| 향후 기대 | FC-BGA Large Body – Physical AI | **20층**(컨콜노트 2026-06-16) | Physical AI(전장) | 북미 EV 업체(메리츠 2026-09-01) | – | 6월 컨콜에서는 4Q26 양산 예정이었으나, 최근 자료는 **1H27 본격 양산**(메리츠 NDR 2026-11-09) |\n| 향후 기대 | FC-BGA Large Body – AI 가속기·LPU(Groq 제외)·CXL 가속기(3개 제품) | 미공개(참고: 개발 과제 26L) | AI 가속기, 추론용 LPU, CXL | 미공개 | – | **2027년 말 양산 진입**(메리츠 NDR 2026-11-09, 미래에셋 2026-11-02) |\n| 향후 기대 | FC-BGA 서버용 신규 물량 | 미공개(2022년 기사의 Amkor 공동개발 20층 이상·100x100mm 이상 사양은 당시 기준 참고치이며 실제 스펙 아님) | 데이터센터 서버 | 미공개 | – | **2027년부터 본격 기여**(다올투자증권 2026-11-02) |\n| 향후 기대 | MLB 우주항공 신제품 | 미공개 | 우주항공·위성통신 | 신규 우주항공 고객사 | – | 4Q26 말 양산 시작(메리츠 NDR 2026-11-09) |\n| 향후 기대 | 메모리 PKG(LPDDR·GDDR·DDR5) 2차 판가 인상 | – | AI DC용 DRAM·NAND | 주요 메모리 고객사 | – | 1Q27부터 반영. 현재 추정치에는 빠져 있음. **10% 인상 시 2027년 영업이익 약 +250억원**(iM증권 인용) |\n| 향후 기대(개발) | 초박판 PKG(Coreless·Thin sub·ETS) | **2L ETS, 3L Coreless(75→70μm), 4L Thin sub(105μm)** | 적용 제품군 미기재 | – | – | DART 연구개발 실적(2026-03-18 사업보고서, 2026-08-13 반기보고서) |\n\n#### 캐파\n**현재 캐파·가동률** (매출 기준)\n| 대상 | 현재 캐파 | 가동률 |\n|---|---|---|\n| FC-CSP/BT | 연 약 **9,500억원**(10월 메리츠 자료는 약 9,000억원) | **풀캐파** |\n| ABF (FC-BGA) | 연 약 **4,500억원** | 매출 기준 80% 중반. Large Body 잠식을 감안하면 3Q26부터 **실질 풀가동** |\n| MLB | 연 3,000억원(분기 750억원), 2026년 상반기 증설 완료 | 3Q26 약 **90%** |\n| 전사 | 약 **1.6조원** | – |\n\n(메리츠 NDR 2026-11-09, SK증권 2026-11-02, 유안타증권 2026-10-08)\n\n**증설 계획**\n| 대상 | 추가 캐파(매출 기준) | 타임라인 | 투자액 |\n|---|---|---|---|\n| FC-CSP/BT | 9,500억 → 1.2조(1차) → **1.4조원**(2차) | 1차 2H27, 2차 2028년(완료 2H28) | 약 7,000억원 |\n| ABF (Large Body 중심) | 4,500억 → 6,500억 → **__9,800억원(+118%)__** | 2027년 중 1차분, 2028년 9,800억원 | 약 7,000억원 |\n| 2차 신규시설투자 공시 | 1·2차 합산 전사 캐파 **2.2조원(2H27) → __2.7조원(1H28)__** | 2026-10-22 ~ 2030-12-31 | **6,150억원**(자기자본의 68.54%). 1·2차 합계 **약 1.4조원**(보류했던 900억원 포함). 재원은 보유현금 약 2,000억원, 고객 선수금, 차입 |\n| MLB | 3,000억 → 3,500~3,600억원 | 1Q27까지 | 노후 설비 교체 등 소규모 |\n\n(메리츠 NDR 2026-11-09, 키움·미래에셋 2026-11-02, 하나증권 2026-11-01, 메리츠·SK 공시 코멘트 2026-10-22). 회사는 **2028년 매출 2.5조원**을 목표로 제시했다(SK증권 2026-11-02).\n\n#### 밸류에이션\n| 기준 | PER | POR | PSR |\n|---|---|---|---|\n| TTM | 26.3배 | 19.3배 | 3.10배 |\n| 12M fwd (2026E 1.5개월 + 2027E 10.5개월) | **13.0배** | 10.7배 | 2.33배 |\n| 18M fwd (2027E 8개월 + 2028E 4개월) | **11.3배** | 9.3배 | 2.11배 |\n\n- 추정치(FMP 컨센서스, 억원)\n  - 2026E: 매출 15,997, 영업이익 2,980, 순이익 2,444(11명)\n  - 2027E: 매출 20,206, 영업이익 4,474, 순이익 3,673(12명)\n  - 2028E: 매출 24,843, 영업이익 5,834, 순이익 4,792(6명)\n- 증권사 교차 확인\n  - 하나증권(2026-11-01): 2026E 매출 15,977억, 영업이익 3,008억원. 2027E 매출 20,337억, 영업이익 **4,848억원**으로 컨센서스보다 높다.\n  - 유안타(2026-10-08, 3Q 발표 전): 2028E 매출 23,110억, 영업이익 4,950억원.\n  - 신한(2026-11-02): 2027F EPS 6,941원. 발행주식수를 곱하면 지배순이익 약 3,430억원(추산).\n- 피어 대비: 메리츠 기준 2027E PER **9.4배**로, 대만 ABF 피어 평균 17.7배보다 **약 47% 할인**돼 있다(메리츠 2026-11-09, 산정 당시 주가와 메리츠 자체 추정 기준이라 위 컨센서스 배수와는 차이가 있음).\n\n#### 투자 포인트·리스크\n**투자 포인트**\n- **판가 인상 사이클**\n  - 메모리기판은 2026년 4월 두 자릿수 인상에 이어 **2차 인상이 1Q27부터 반영**된다. 이 효과는 현재 추정치에 빠져 있다.\n  - 10% 인상 시 2027년 영업이익이 약 +250억원 늘어난다(iM증권 인용; 메리츠 2026-11-09).\n- **창사 이래 최대 증설 약 1.4조원**\n  - 전사 캐파를 1.6조원에서 **2.7조원(1H28)**으로 늘린다.\n  - BT·ABF·MLB가 이미 사실상 풀가동이어서, 증설이 곧 매출 확대로 이어지는 구조다(메리츠·하나·SK).\n- **ABF Large Body 진입**\n  - 네트워크 스위치용 2개 모델이 양산 중이다.\n  - Physical AI(1H27)와 AI 가속기·LPU·CXL 3개 제품(2027년 말)이 뒤따르고, 서버용 신규 물량은 2027년부터 기여한다.\n- **MLB 고부가 전환**\n  - 3Q26 매출 718억원으로 추정치 615억원을 넘었다.\n  - AI 가속기 Compute Board(40층 근접)와 우주항공 신규 고객이 추가되고, 1Q27까지 캐파를 3,500~3,600억원으로 늘린다.\n- **LTA·선수금 구조**\n  - 2027년분 LTA를 선별적으로 체결해 협상력을 높이고 있다.\n  - 증설 재원의 일부를 고객 선수금으로 조달한다.\n\n**리스크**\n- **AI 설비투자 지속성 우려**(데이터센터 규제, 투자 집행 지연)와 Ibiden 급락 등 피어 멀티플 하락. 1개월 주가가 이미 **-35.8%**다.\n- **원화 강세**: 4Q26 회사 가이던스가 전 분기 대비 감익이고, SK증권 추정 영업이익은 약 800억원 초중반이다.\n- CCL·유리섬유·동박 등 **기판 소재 수급 차질** 가능성(SK증권).\n- **대규모 증설에 따른 자금 부담과 업황 반락**: 2차 투자액만 자기자본의 68.54%다. 2020~23년 FC-BGA 투자 직후 다운사이클을 겪은 전례가 있다. 유상증자 루머는 회사가 부인했다."}, {"code": "007810", "name": "코리아써키트 "rev": 4199.0, "gp": 381.9, "op": 264.4, "ni": 301.4, "src": "DART 정기보고서", "gpm": 9.095022624434389, "opm": 6.296737318409145}, {"q": "2026Q2", "rev": 4071.8, "gp": 303.3, "op": 192.9, "ni": 477.6, "src": "DART 정기보고서", "gpm": 7.448794145095534, "opm": 4.7374625472763885}], "g27": 109.17847412770561, "per12": null, "por12": 11.747886449212105, "sec": "### 코리아써키트 (007810.KS)\n\n#### 한눈에\n- **사업 정체성**: 연결 매출의 **92.3%가 PCB 부문**이며, 여기에는 자회사 인터플렉스의 FPCB가 포함됩니다(딜사이트 2026-09-22). 별도 매출은 **패키지기판(PKG) 40%, 메모리 모듈·SSD PCB 30%**이고, 나머지 30%는 스마트폰 HDI·Display/RF 등 레거시입니다(현대차증권 2026-05-29, 1Q26 기준).\n- **실적 모멘텀**: 연결 OPM은 **4Q25 8.0%가 정점**이었고, 이후 **2Q26 4.7%**까지 두 분기 연속 낮아졌습니다(DART). 반면 수주잔고는 **__4,266억원으로 QoQ +171%__**입니다(2026.06 기준, 아래 4) 참조). SoCAMM2 양산과 ABF 판가 인상으로 2027E 영업이익은 **1,470억원으로 사상 최대**가 예상됩니다(대신증권 2026-11-02).\n- **밸류에이션 위치**: **TTM POR 22.3배**에서 **12M fwd POR 11.7배**로 낮아집니다. 다만 이는 2027E 이익이 크게 늘어난다는 전제이고, 추정치 변동성이 큽니다. 2026E 영업이익 추정치도 크게 하향됐습니다.\n\n#### 시가총액·주가\n| 항목 | 수치 |\n|---|---|\n| 시가총액 | **2조 1,225억원** |\n| 주가 | **91,300원** (2026-11-13) |\n| 1M | +20.4% |\n| 3M | +44.7% |\n| 6M | +0.3% |\n| YTD | **__+91.2%__** |\n| 1Y | **__+212.1%__** |\n\n- 해석: 1년 기준으로 3배 넘게 올랐습니다. 6M 수익률은 보합인데 3M은 +44.7%입니다. 수익률로 역산하면 5~8월에 약 30% 조정을 받은 뒤, 최근 3개월 동안 6개월 전 수준을 되찾았습니다.\n\n#### 최근 4개 분기 실적\n| 분기 | 매출 | GPM | OPM | 영업이익 |\n|---|---|---|---|---|\n| 2025Q3 | 3,756.5억원 | 5.5% | 3.5% | 132.6억원 |\n| 2025Q4 | 4,481.4억원 | **10.9%** | **8.0%** | **360.6억원** |\n| 2026Q1 | 4,199.0억원 | 9.1% | 6.3% | 264.4억원 |\n| 2026Q2 | 4,071.8억원 | 7.4% | 4.7% | 192.9억원 |\n\n(출처: DART 정기보고서, 연결. 3Q26 실적 원문은 확보하지 못함. 대신증권은 3Q26 영업이익을 약 153억원으로 언급(2026-11-02))\n\n- 2Q26은 전년 동기(매출 3,313.5억원, 영업이익 61.6억원)보다 매출 +23%, 영업이익 약 3배로 개선됐습니다. 하지만 4Q25 정점 이후 GPM은 10.9%→7.4%, OPM은 8.0%→4.7%로 두 분기 연속 낮아졌습니다.\n- 2Q26 OPM은 **__컨센서스를 37% 밑돌았습니다__**. 인터플렉스 영업손실 52억원이 연결 수익성을 끌어내렸습니다(SK증권·메리츠 2026-08/09). 같은 분기 순이익은 477.6억원으로 영업이익보다 많은데, 영업외이익이 컸기 때문입니다.\n\n#### 수주잔고\n| 항목 | 수치 |\n|---|---|\n| 최근(2026.06) | **4,266.4억원** |\n| QoQ | **__+171%__** (2026.03 1,572.5억원 대비) |\n| YoY | **__+167%__** (2025.06 1,599.7억원 대비) |\n| 분기매출 대비 배수 | **약 1.05배** (2Q26 매출 4,071.8억원 대비) |\n\n- 트래커 추이(억원): 1,397.3(2025.03) → 1,599.7(2025.06) → 1,149.4(2025.09) → 1,991.5(2025.12) → 1,572.5(2026.03) → 4,266.4(2026.06).\n- 출처 간 불일치: 글로벌 테크 밸류체인(2026-11-13)은 4,266억원을 '3Q26'으로 적었습니다. 그러나 QoQ +171%와 YoY +167%는 2026.06 기준으로 계산할 때만 맞습니다. 메리츠(2026-08-14)는 PCB 부문 2Q26 잔고를 4,167억원으로 제시했습니다. **3Q26 잔고 공시는 확보하지 못했습니다.**\n- 성격: SoCAMM 등 ASP가 높은 제품이 증가를 이끌었습니다. 1H26 PCB ASP는 2025년 평균 대비 내수 +19.5%, 수출 +23.8%입니다. 잔고가 분기 매출 약 1배 수준이라 회전이 짧고, 실적 가시성은 1~2개 분기 정도입니다.\n\n#### 기판 사업 내용\n- 기판 비중: 1H26 연결 매출 8,271억원 중 **PCB 부문이 7,637억원(92.3%)**입니다(인터플렉스 FPCB 포함, 딜사이트 2026-09-22). 반도체 패키지기판만 보면 **1Q26 별도 매출의 40.0%**(1,016/2,537억원, 현대차증권 2026-05-29)입니다.\n\n| 구분 | 제품군 | 단수(층수) | 사용처 | 주요 고객사 | 매출 비중 | 상태·시점 |\n|---|---|---|---|---|---|---|\n| 현재 매출 | 메모리 모듈·SSD PCB(서버 RDIMM, SoCAMM2 포함) | **DDR5 6400 RDIMM 16L(IVH)**: 회사 공시 문구(2025.3Q 분기보고서~2026-08-14 반기보고서에 반복)<br>과거 8~10층에서 **12~16층 비중이 빠르게 늘어남**, BVH 공법 확대(메리츠 2026-01-28)<br>범용 8~10L → 서버향 16L 이상, **20L 이상도 공급 논의 중**(현대차 2026-01-20) | AI 서버 DRAM 모듈, SSD | 북미 고객사(SoCAMM 양산 중), 국내 메모리 고객사(SoCAMM 4Q26 출하 본격화). 서버향 모듈 고객은 SK하이닉스·Micron이며 Micron 내 점유율이 높음(현대차 2026-01-20) | **30%** (1Q26 별도, 761억원) | 확대. SoCAMM 2026-07 양산 개시, 4Q26 물량은 3Q 대비 **약 +50%**(메리츠 2026-09-03·10-20) |\n| 현재 매출 | 반도체 패키지기판: FC-BGA(ABF)·메모리 BT | ABF는 **10~12층 고부가 비중 확대**(현대차 2026-05-29)<br>Broadcom향은 현재 6~8층, **4Q26부터 12층 일부 양산**. 단 AI 가속기가 아닌 로우엔드 스위치향(Q&A 메모 2026-10-04)<br>FC-BGA 기술력 16층 이상, L/S 9/12㎛(신한 2025-10-02. 표의 열 순서를 추정해 맞춘 값이라 원본 확인 필요)<br>메모리 BT는 **2-Layer 중심에서 최대 6-Layer로 확대**(메리츠 2026-10-20) | 네트워크·AI ASIC, 전장, 서버향 메모리 패키지 | Broadcom(FC-BGA 주력), 국내 메모리 고객사 | **40%** (1Q26 별도, 1,016억원) | 확대. 4Q26 ABF 판가 인상, 메모리 기판은 4Q26~1Q27 추가 판가 인상 논의 중(메리츠 2026-10-20) |\n| 현재 매출 | Build-up(HDI) 스마트폰 메인보드 | 회사 제품 층수 자료 없음. 참고로 갤럭시S11 메인 12층·슬레이브 6~8층(디일렉 **2020-01-13**)이 있으나, 기기 적층 구조 설명이며 회사 사양으로 명시된 것은 아님 | 스마트폰 | 자료 없음 | 23% (584억원) | 정체. 2025년 2,189억원 → 2026F 2,156억원(현대차 2026-05-29) |\n| 현재 매출 | Display·RF PCB | 자료 없음 | 디스플레이, RF | 자료 없음 | 7% (177억원) | 축소. 출하 지연, 3Q26 일회성 재고평가충당금(메리츠 2026-09-03) |\n| 현재 매출 | 특수 PCB(Metal PCB, 구 테라닉스 PCB 부문) | **2Layer Metal PCB**(2010년 개발·양산, 복층 2Layer 특허) | LED TV BLU | 자료 없음 | 자료 없음 | 2026-02-25 흡수 분할합병(반기보고서 2026-08-14) |\n| 향후 기대 | SoCAMM2 모듈 PCB | 구체적인 층수 숫자는 없고 '적층 수 증가'라는 표현만 있음(대신 2026-11-02). 기존 모듈보다 회로 형성·적층 공정이 반복됨(현대차 2026-01-20) | NVIDIA Vera Rubin·Vera CPU용 LPDDR 모듈 | 2027년 1개사 → 2개사 | **__2026E 260억원 → 2027E 900억원 이상__**(대신 2026-11-02). 회사 2026 가이던스가 250억원 → 650억원으로 상향됐다는 언급(메리츠 2026-07)과 수치가 다름 | 2026-07 양산, 2027년 본격 성장 |\n| 향후 기대 | AI 서버향 메모리 모듈(SoCAMM 포함 합계) | 서버향 16L 이상, 20L 이상 논의 중(현대차 2026-01-20) | AI 서버 | SK하이닉스, Micron(현대차 2026-01-20) | **__2027E 4,700억원(+48.7% YoY)__**(대신 2026-11-02). 모듈 PCB 중 AI 서버향 비중은 2025년 약 1/3에서 2026년 절반 이상으로 추정(현대차 2026-01-20) | 2027년 |\n| 향후 기대 | AI향 FC-BGA(Broadcom 신규 진입)·전장용 FC-BGA | 6~8층 → **AI 네트워크용 10~14층 샘플 대응 중**(메리츠 2026-04-08)<br>6층 전후 → 8~10층, **일부 16층 개발 중**, PCIe 스위치 공급망 진입 목표(메리츠 2026-01-28)<br>12층은 4Q26 일부 양산하나 로우엔드 스위치향(메모 2026-10-04)<br>전장용(S사향)은 층수 정보 없음 | AI ASIC, 네트워크, 전장 | Broadcom | 자료 없음 | 4Q26 일부 AI 제품 매출 개시, 2027년 비중 확대(메리츠 2026-09-03, 대신 2026-11-02) |\n| 향후 기대 | GDDR7 패키지기판 | GDDR7 방열기판 4층 → 6층. 회사 사양이 아닌 GDDR7 세대 전체 사양(딜사이트 2026-09-22) | 서버·그래픽용 GDDR7 | SK하이닉스(대덕전자·LG이노텍에 이은 세 번째 공급사 후보, 퀄 진행 중) | 자료 없음 | 퀄 통과 시 양산, 시점 미정 |\n\n(매출 비중은 1Q26 별도 매출 2,537억원 기준, 현대차증권 2026-05-29)\n\n#### 캐파\n**현재 캐파·가동률**\n| 대상 | 캐파 | 가동률·상태 |\n|---|---|---|\n| ABF(FC-BGA) 기판 라인 | 미공시 | **4Q26에 60% 이상으로 회복 전망**. 물량 증가는 경쟁사보다 더딤(메리츠 2026-10-20) |\n| 메모리 모듈 PCB 증설 라인 | 미공시 | 설비 반입이 3Q에서 4Q로 밀려 **4Q26부터 매출 기여, 1Q27 풀가동** 전망(메리츠 2026-09-03·10-20) |\n\n**증설 계획**\n| 대상 | 추가 캐파 | 타임라인 | 투자액 |\n|---|---|---|---|\n| 메모리반도체·최첨단 패키징 생산설비(모듈 PCB/SoCAMM, AI FC-BGA) | 미공시 | 2026-01-20~2026-12-31. 4Q26 효과 반영, 1Q27 풀가동 | **993억원**(시설증설, 내부자금과 차입. DART 공시 2026-01) |\n| 추가 증설 | 미공시 | '올해 추가 증설 진행 예정'(메 p": 118.8, "op": 85.8, "ni": 7.6, "src": "DART 정기보고서", "gpm": 16.370400992145516, "opm": 11.823067383216204}, {"q": "2026Q1", "rev": 758.3, "gp": 141.7, "op": 107.2, "ni": 84.7, "src": "DART 정기보고서", "gpm": 18.686535671897666, "opm": 14.136885137808255}, {"q": "2026Q2", "rev": 882.4, "gp": 171.8, "op": 127.7, "ni": 192.8, "src": "DART 정기보고서", "gpm": 19.46962828649139, "opm": 14.471894832275611}, {"q": "2026Q3", "rev": 939.7, "gp": 207.1, "op": 165.9, "ni": 310.7, "src": "DART 정기보고서", "gpm": 22.038948600617218, "opm": 17.654570607640736}], "g27": 98.53896103896105, "per12": null, "por12": 8.533507682249102, "sec": "### 티엘비 (356860.KQ)\n\n#### 한눈에\n- **사업 정체성**: 메모리 모듈 PCB와 SSD PCB 전문업체로, 매출은 사실상 **100% PCB**에서 나옵니다. 패키지기판(FC-BGA/BT)은 하지 않습니다. 고객은 글로벌 메모리 3사입니다(IR 노트 2026-07-20).\n- **실적 모멘텀**: 3Q26 매출 940억원(+36% YoY), 영업이익 166억원(OPM **17.7%**)으로 **6개 분기 연속 최대 매출**을 냈습니다. 성장은 SOCAMM 확대, 고사양 BVH 전환, 판가 인상이 함께 이끌고 있습니다. 회사는 4Q26 OPM **20% 전후**를 제시했습니다(콥데이 2026-11-11).\n- **수주잔고**: 3Q26 수주잔고는 **2,735억원**입니다(1~9월 누계 기준, 분기보고서 2026-11-13). 2Q26 1,318억원보다 **__+107.5% QoQ__**, 3Q25 445억원보다 **__+514.6% YoY__** 늘었습니다. 3Q26 매출 940억원의 **2.9배**로 역대 최고입니다. 수주총액은 5,263억원, 기납품액은 2,528억원입니다.\n- **밸류에이션 위치**: 순이익 추정치가 없어 fwd PER은 계산하지 못했습니다. TTM POR 20.1배는 12M fwd 기준 **8.5배**로 떨어집니다. 2027E 이익이 크게 늘어나는 것이 전제입니다.\n\n#### 시가총액·주가\n| 시가총액 | 주가 | 1M | 3M | 6M | YTD | 1Y |\n|---|---|---|---|---|---|---|\n| **9,789억원** | 43,450원 | -4.6% | **+38.4%** | -8.6% | **+56.3%** | +26.4% |\n\n(기준일 2026-11-13)\n- 해석: YTD +56%로 강세지만 6M 수익률은 마이너스입니다. 연중 고점에서 조정을 받은 뒤 최근 3개월 동안 반등하는 흐름입니다.\n\n#### 최근 4개 분기 실적\n| 분기 | 매출(억원) | GPM | OPM | 영업이익(억원) |\n|---|---|---|---|---|\n| 4Q25 | 725.7 | 16.4% | 11.8% | 85.8 |\n| 1Q26 | 758.3 | 18.7% | 14.1% | 107.2 |\n| 2Q26 | 882.4 | 19.5% | 14.5% | 127.7 |\n| 3Q26 | **939.7** | **22.0%** | **17.7%** | **165.9** |\n\n(DART 정기보고서)\n- 매출과 마진이 4개 분기 연속 올랐습니다. 3Q26 영업이익은 **__전년 동기 86.5억원 대비 +92%__** 늘었고, 같은 기간 GPM은 17.4%에서 22.0%로 4.7%p 개선됐습니다. 원화 강세로 3Q26 매출이 약 100억원 줄어든 상태에서 낸 실적입니다(콥데이 11/11).\n- 3Q26 순이익 310.7억원은 영업이익보다 큽니다. 영업 외 요인이 있었을 가능성이 있어 TTM PER을 볼 때 주의가 필요합니다. 회사 4Q26 가이던스는 **__매출 약 1,200억원(QoQ +28%)·OPM 20% 전후__**입니다(콥데이 11/11).\n\n#### 수주잔고\n| 시점 | 수주잔고(억원) | QoQ | YoY | 분기매출 대비 |\n|---|---|---|---|---|\n| 2025.06 | 442 | – | – | 0.69배 |\n| 2025.12 | 526 | +18% | – | 0.72배 |\n| 2026.03 | 539 | +2% | +49% | 0.71배 |\n| 2026.06 | 1,318 | **__+145%__** | **__+198%__** | 1.49배 (2Q26 매출 기준) |\n| **2026.09** | **2,735** | **__+108%__** | **__+515%__** | **2.9배** (3Q26 매출 940억원 기준, 역대 최고) |\n\n- 성격: 고객사가 **약 3개월 단위로 확정한 수주**라 단기 가시성이 높습니다. 2Q26에 잔고가 급증한 데는 수요 증가와 함께 **SOCAMM의 긴 리드타임(재공품 누적)**이 반영돼 있습니다(IR 노트 2026-07-20, 키움 11/12).\n- 3Q26 분기보고서(2026-11-13) 수주현황(1~9월 누계)은 수주총액 5,263억원, 기납품액 2,528억원, **수주잔고 2,735억원**입니다. 2Q26 1,318억원 대비 **__QoQ +107.5%__**, 3Q25 445억원 대비 **__YoY +514.6%__**이고, 3Q26 매출의 **2.9배로 역대 최고**입니다. 콥데이(11/11)에서 나온 \"높은 수준 유지\"라는 정성 코멘트가 수치로 확인됐습니다. 오픈IR 메모(10/8)의 \"2027년 2분기 수주잔고 1,818억원\" 표기는 시점 표기 오류로 보여 계속 참고만 합니다.\n\n#### 기판 사업 내용\n- **회사 매출 중 기판(PCB) 비중: 약 100%**입니다. 구성은 메모리 모듈 PCB 63%(SOCAMM 포함), SSD PCB 33%, 기타 약 4%이고, **패키지기판 매출은 없습니다**. 고부가 제품 비중은 65%입니다(3Q26, 콥데이 2026-11-11). DART 원문은 확인하지 못했습니다.\n\n| 구분 | 제품군 | 단수(층수) | 사용처 | 주요 고객사 | 매출 비중 | 상태·시점 |\n|---|---|---|---|---|---|---|\n| 현재 매출 | 메모리 모듈 PCB(서버 RDIMM 중심, SOCAMM 제외) | RDIMM 12~16층. 고사양은 **16층 BVH(3회 적층)**. RDIMM 6400/7200에는 12~16층이 필요하다는 증권사 시각(2026-09), DDR5 8800까지 생산 중(2026-11-11) | 서버 DDR5 RDIMM(6400~8800), 일부 PC SODIMM/UDIMM. 서버향 80~90% | SK하이닉스, 마이크론, 삼성전자 | 약 42%(추정치) | 확대(BVH 전환, 판가 인상) |\n| 현재 매출 | SOCAMM(SOCAMM2) 기판 | **16층, HDI·Mass Lam 5회 적층**(IR 노트 2026-07-20). SOCAMM3는 층수와 HDI 적용 확대 전망, 구체 층수는 미언급(2026-11-11) | NVIDIA Vera Rubin용 LPDDR5X 모듈(최종 수요처 NVIDIA 100%) | SK하이닉스 약 70%(하이닉스 내 점유율 40%대), 마이크론 약 30%(점유율 20% 수준) | 약 21%(교보는 \"20% 상회\") | **__1Q26 30억원 → 3Q26 약 200억원__**. 4Q26 약 300억원 목표, 2026년 600~700억원 |\n| 현재 매출 | MRDIMM PCB | **16층 고다층**, BVH 기판 2장을 추가 라미네이션해 붙이는 구조(메리츠 2026-09). 5회 적층(2026-11-11) | 서버 고속 DDR5 과도기 제품(최대 12,800Mbps) | SK하이닉스, 마이크론 | 분기 100억원 미만(2026년 약 100억원 내외) | 양산. 2027년은 현 수준 유지 예상 |\n| 현재 매출 | SSD PCB(eSSD/EDSFF 중심) | 약 20~24층. 16층에서 20층, 24층으로 고다층화하며 BVH 확대(2025-11 리포트). 기존 SSD 18~20층 대비 Vera Rubin AI 스토리지용은 **24층 BVH(3회 적층)**(2026-06 리포트, IR 노트 2026-07-20) | 서버 eSSD(E1.S/E3.S), 일반 SSD. SSD 매출 중 eSSD 약 80% | 삼성전자(PM1773 단독 공급) | 33% | 확대. 24층 eSSD는 2Q26부터 매출 인식, ASP는 DDR5 6400/7200 BVH 대비 약 1.5배 |\n| 현재 매출 | 항공우주·방산용 초고다층 PCB | **최대 약 100층**(IR 노트 2026-07-20) | 미사일·항공우주 장비(개당 수천만원 수준) | 이스라엘 업체 | 낮음 | 품질 심사 완료, 소량 공급 |\n| 향후 기대 | SOCAMM 확대(삼성전자 신규 진입 포함) | 16층·5회 적층(현행 기준) | AI 서버 LPDDR5X 모듈. JEDEC 표준화 시 AMD 등으로 확산 가능 | SK하이닉스, 마이크론, 삼성전자(개발 샘플 납품 중) | 2027E 26~30%(키움 26%, IBK 약 28%, 메리츠 약 30%) | 2027년 회사 목표 **__약 1,500억원__**(시장 5,000~6,000억원 중 점유율 30%). 메리츠 추정 1,510억원(11/6) |\n| 향후 기대 | LPCAMM PCB | **12층, 3회 적층**(IR 노트 2026-07-20) | 노트북용 SODIMM 대체 CAMM 모듈. ASP는 고사양 RDIMM 수준 | – | – | 1Q26에 일부 매출이 났으나 이후 매출이 꾸준하지 않음(전환 과도기) |\n| 향후 기대 | CXL 모듈 PCB | 샘플 16~18층. 차세대는 **24층 이상, BVH 24층까지 개발 완료**(2026-11-11). 2024년에 삼성전자·SK하이닉스에 샘플 6종 이상을 단독 공급, 샘플 ASP는 DDR5의 약 2배(신영·메리츠 2024-03, 참고) | AI 서버 메모리 확장 | (2024년 샘플: 삼성전자, SK하이닉스) | – | 고객 수요 발생 시(미정) |\n| 향후 기대 | DDR6 모듈 PCB | 층수 미공개, **약 6회 적층 구조까지 검토**(IR 노트 2026-07-20) | 차세대 서버 메모리 모듈 | – | – | 디자인·샘플 개발 단계, 양산은 약 2~3년 뒤 |\n\n(제품 비중·상태 출처: 콥데이 2026-11-11, 교보 11/9, 오픈IR 10/8, 메리츠 11/6, 키움·IBK 11/12)\n\n#### 캐파\n**현재 캐파·가동률**\n| 사업장 | 캐파 | 가동률 |\n|---|---|---|\n| 안산 본사(1공장) 모듈·SSD PCB | 공시 약 29,000㎡(실질 완제품 기준 약 20,000㎡) | 적층을 반복하는 공정이라 공시 가동률은 낮게 나오지만 **실제 설비는 풀가동** |\n| 안산 2공장 + 베트남 1공장 Mass Lam(병목 공정) | 수치 미공개 | 2Q26부터 순차 가동, 4Q26 온전히 반영. **4Q26 물량 +10%, 2027년 물량 +20%** 예상 |\n\n(IR 노트 2026-07-20, 콥데이 2026-11-11, 오픈IR 10/8)\n\n**증설 계획**\n| 대상 | 추가 캐파 | 타임라인 | 투자액 |\n|---|---|---|---|\n| 베트남 2공장(전공정~완제품 일괄) | 약 20,000㎡. 매출 기준 약 60% 증가, **__국내+베트남 합산 20,000 → 40,000㎡(약 2배)__** | 2026년 11월 착공, 4Q27 완공 목표(내부 목표 3Q27). 매출은 **2028년부터 온전히 반영** | 유상증자 **약 1,330억원**(건축 약 500억원, 나머지 설비). 최초 계획 약 2,000억원과의 차이는 현지 외주와 차입 10 .7, "ni": 0.0, "src": "DART 정기보고서", "gpm": 18.418683973660524, "opm": 11.781704486238096}, {"q": "2026Q3", "rev": 2453.0, "gp": null, "op": 338.0, "ni": null, "src": "네이버(잠정)", "gpm": null, "opm": 13.77904606604158}], "g27": 54.90760142532994, "per12": 6.740927408282322, "por12": 5.187624485095057, "sec": "### 해성디에스 (195870.KS)\n\n#### 한눈에\n- **사업 정체성:** 금속 기판인 **리드프레임이 매출의 약 77%**(전장 중심), **BT 기반 메모리 패키지기판이 약 24%**(DDR4·DDR5용 단층·저다층, 릴투릴 공법)입니다. 두 사업 모두 반도체 기판이라 매출은 사실상 전부 기판입니다(흥국 2026-11-04·유진 2026-11-09 기준 계산).\n- **실적 모멘텀:** 3Q26 매출 **2,453억원(YoY +37.4%)**, 영업이익 **338억원(OPM 13.8%)**으로 **__영업이익이 1년 전의 약 2.1배__**입니다(네이버 잠정). 패키지기판은 가동률이 60% 중반까지 올라 **__흑자로 돌아섰습니다__**(흥국 2026-11-04).\n- **밸류에이션 위치:** 주가가 **__6개월 동안 -47.4%__** 떨어지면서 12M fwd PER이 **6.7배**, 18M fwd PER이 **6.1배**까지 내려왔습니다(FMP 컨센서스). 실적은 사상 최대 흐름인데 주가와 반대로 움직이고 있습니다.\n\n#### 시가총액·주가\n| 항목 | 수치 |\n|---|---|\n| 시가총액 | **7,718억원** |\n| 주가 | **46,050원** (2026-11-13) |\n| 1M | -19.9% |\n| 3M | -21.8% |\n| 6M | **__-47.4%__** |\n| YTD | -16.0% |\n| 1Y | -16.4% |\n\n- 해석: 3Q26 실적은 좋았지만 리드프레임 4Q 연말 재고조정 우려, 목표주가 연이은 하향, 환율 부담이 겹쳐 최근 6개월 낙폭이 컸습니다.\n\n#### 최근 4개 분기 실적\n| 분기 | 매출(억원) | GPM | OPM | 영업이익(억원) | 출처 |\n|---|---|---|---|---|---|\n| 2025Q4 | 1,799.5 | 19.6% | 12.1% | 218.0 | DART 정기보고서 |\n| 2026Q1 | 1,886.5 | 12.4% | 5.8% | 109.8 | DART 정기보고서 |\n| 2026Q2 | 2,110.9 | 18.4% | 11.8% | 248.7 | DART 정기보고서 |\n| 2026Q3 | **2,453.0** | –(잠정) | **13.8%** | **338.0** | 네이버(잠정) |\n\n- 매출은 4개 분기 연속 늘었고, 3Q26에는 **QoQ +16.2%**로 늘어나는 폭도 커졌습니다. 영업이익은 **QoQ +35.9%, __YoY +109.8%__**로 매출보다 빠르게 늘어 고정비 레버리지가 나타나고 있습니다.\n- 1Q26에는 GPM이 12.4%로 일시적으로 떨어졌지만 2Q26 18.4%, 3Q26 OPM 13.8%로 회복해 분기 최고 OPM을 다시 썼습니다. 다만 2026E 컨센서스 영업이익 1,005억원(FMP)에서 1~3분기 합계를 빼면 4Q26은 **약 309억원**으로, 3분기보다 소폭 줄어드는 그림입니다.\n\n#### 수주잔고\n- **수주잔고 공시·트래커 수치는 없습니다.** 따라서 최근 잔고, QoQ, YoY, 분기매출 대비 배수 모두 해당 사항이 없습니다.\n- 성격: 수주산업이 아니라 메모리 IDM과 차량용 반도체 업체에 반복적으로 공급하는 구조입니다. 대신 다음 신호가 거론됩니다.\n  - **2026년 4월 원재료 연동 일괄 판가 인상**이 있었습니다.\n  - **26년 말~27년 초 LPDDR·GDDR 등 고부가 메모리 기판의 추가 인상**이 예상됩니다.\n  - 메모리 IDM의 물량 선점 움직임과 **장기공급계약(LTA) 가능성**이 언급됩니다(메리츠 2026-10-08).\n  - 경쟁사들이 범용 캐파를 줄이고 있어 점유율 확대가 기대됩니다(키움 2026-11-03).\n\n#### 기판 사업 내용\n- **회사 매출 중 기판 비중은 사실상 100%입니다.** 3Q26 기준 패키지기판(PCB)이 약 590억원(**약 24%**), 리드프레임(금속 기판)이 약 1,900억원(**약 77%**)입니다. 두 비중의 합이 100%를 넘는 것은 반올림 때문입니다(흥국 2026-11-04·유진 2026-11-09).\n- 리드프레임은 3Q26 매출 **__YoY +41.1%__**로 분기 최대를 기록했고 최대 가동 중입니다. 패키지기판 매출 중 **DDR5 비중은 50%를 넘습니다**(키움 2026-11-03).\n\n| 구분 | 제품군 | 단수(층수) | 사용처 | 주요 고객사 | 매출 비중 | 상태·시점 |\n|---|---|---|---|---|---|---|\n| 현재 매출 | 메모리 패키지기판 DDR5 (D1b Prime·D1c) | **단층·저다층.** 릴투릴은 적층이 안 돼 **최대 4층**까지만 가능하며, DDR5의 정확한 층수는 어느 자료에도 없습니다(컨콜 2024-02, 2026-10-06). PC/서버 DDR5에서 삼성전자 점유율 70~80%(2024-02 컨콜, 참고). SK하이닉스 D1c는 9월 기준 **약 1/3 점유**(2026-10-06 컨콜). D1b Prime의 층수 언급은 없습니다. | DRAM 모듈·패키지, AI 데이터센터 서버 DRAM | 국내 IDM(D1b는 온양·쑤저우 사이트, D1c는 닉스향), CXMT(1Q26 퀄 통과, 2Q26 초도 공급) | 패키지기판 내 **50% 이상** (키움 2026-11-03) | **확대.** D1c는 **2026-08 초도 양산, 9월부터 물량 확대** |\n| 현재 매출 | 메모리 패키지기판 DDR4·레거시(D1a 이전) | **1L·2L BGA**(2016년 NH 리포트, 참고). 릴투릴로 1~4층까지 적층할 수 있어 삼성 D1a도 대응은 가능했지만, 설계 변경을 따라가지 못해 벤더에서 탈락했습니다(2024-12 컨콜). | 범용 DRAM | 국내 IDM | 50% 미만 추정(수치 근거 없음) | **축소**(D1a 부진) |\n| 현재 매출 | 그래픽 DRAM 패키지기판 GDDR6 | **4층.** 4층부터 수율이 급격히 떨어져 적자 제품이었습니다(2025-09-24 컨콜). | 그래픽 DRAM | 삼성 | 2024년 약 50억원, 기판 매출의 약 3% (2025-09-24 컨콜) | 삼성향 GDDR6만 양산. **GDDR7은 양산하지 않기로 결정** |\n| 현재 매출 | 리드프레임 (금속 기판, 참고) | 해당 없음(금속 에칭·스탬핑) | 전장 약 62%, IT·AI 데이터센터 전력·기타 약 38% (2Q26, 신한 2026-08-11) | 차량용 반도체 업체 | 회사 매출의 **약 77%** (3Q26) | **확대.** 최대 가동, 판가 인상, 저수익 IT 제품은 일부 외주 생산 |\n| 향후 기대 | Panel 공법 고다층 패키지기판 (DDR6·LPDDR 등 하이엔드) | **릴투릴 한계(4층)를 넘는 고다층.** 구체적인 층수는 어느 자료에도 없습니다. 회사는 4층 이상인 LPDDR·GDDR 영역을 지금은 잘 못 한다고 설명했습니다(컨콜 2024-02, 2026-10-06). | 차세대 DRAM(DDR6), 고다층·고부가 메모리 패키지 | 메모리 IDM(고객 미공개) | 연 2,000~3,000억원 규모 신규 캐파 (유안타·메리츠 2026-10-08) | 신규 제조동의 빈 3개 층(공장 건물의 층)에 패널 장비를 넣을 계획. **2027~28년 투자, 2H29 본격 양산** |\n| 향후 기대 | CXMT향 DDR5 패키지기판 | 별도 언급 없음(현재 DDR5와 같은 릴투릴 제품군) | 중국 DRAM | CXMT | – | 2Q26 초도 공급, **2027년 본격 확대**(교보 2026-11-02, 전자신문 2026-07-19 인용) |\n| 향후 기대 | 히트슬러그 (방열 부품, 기판 아님) | 해당 없음 | AI 칩 방열 | 북미 주요 팹리스 | – | 2026년 5월 말 퀄 진입, 연내 양산, **2027년부터 기여**(유안타 2026-08-11, 삼성 2026-09-17) |\n| 과거 개발(참고) | 3Layer BGA (모바일 DRAM·SSD용 다층 BGA) | **3층** | 모바일 DRAM·SSD | – | – | 2016~17년 개발. 설비 투자 약 500억원(2016년 하반기 235억, 2017년 240억)(2019 사업보고서, 2016 NH) |\n| 과거 개발(참고) | 모바일용 다층 BGA | 다층(구체적인 층수 없음) | 모바일 | – | – | 2022년 연구개발 과제. 결과는 '신규소재 승인 및 다층제품 다원화'(2024 사업보고서) |\n\n#### 캐파\n**현재 캐파·가동률**\n| 사업 | 캐파 | 가동률 | 출처 |\n|---|---|---|---|\n| 패키지기판(릴투릴, 창원) | 매출 환산 **약 3,000억원/년** | 2Q26 약 60% → 3Q26 **60% 중반(BEP)** → 4Q26 **70% 이상 예상** | 유안타 2026-10-08, 2026-09-01 메모 |\n| 리드프레임(창원 신공장 3개 층) | 수치 미확인 | **최대 가동.** 상반기에는 3개 층 중 1개 층만 가동했고, 3Q부터 가동 라인이 늘었습니다. | 2026-09-01 메모, 키움 2026-11-03 |\n\n**증설 계획**\n| 대상 | 추가 캐파 | 타임라인 | 투자액 |\n|---|---|---|---|\n| 패키지기판 Panel 공법 라인(DDR6 등) | 매출 환산 연 2,000~3,000억원. 패키지기판 캐파는 **__3,000억원에서 5,000~6,000억원으로 확대__** | 투자기간 2026-09-18~2030-12-31. 주로 2027~28년 집행, **2H29 본격 양산** | **1,900억원**(자기자본 대비 33.67%). 내부 현금 위주에 차입 300~400억원 (DART 2026-09-18, 유안타·메리츠 2026-10-08, 삼성 2026-11-02) |\n| 수도권 생산거점(안산 반월공단, 계양전기 토지·건물) | Panel 라인 부지 | 취득 예정일 2026-11-11 | **680억원**(자산 대비 7.72%) (DART 2026-09-18) |\n\n#### 밸류에이션\n| 구분 | 매출(억원) | 영업이익(억원) | PER | POR | PSR |\n|---|---|---|---|---|---|\n| TTM (4Q25~3Q26) | 8,249.9 | 914.5 | 13.9배 | 8.4배 | 0.94배 |\n| 12M fwd (26E 1.5M + 27E 10.5M) | 10,346 | 1,488 | **6.7배** | **5.2배** | 0.75배 |\n| 18M fwd (27E 8M + 28E 4M) | 10,975 | 1,640 | **6.1배** | **4.7배** | 0.70배 |\n\n- **추정치 출처는 FMP 컨센서스입니다.**\n  - 2026E(11명): 매출 8,883억원, 영업이익 1,005억원, 순이익 761억원\n  - 2027E(10명): 매출 10,555억원, 영업이익 1,557억원, 순이익 1,200억원\n  - 2028E(5명): 매출 11,815억원, 영업이익 1,807억원, 순이익 1,399억원\n- 증권사 수치와 비교하면 다음과 같습니다.\n  - 교보 2026E 영업이익 1,054억원(**__YoY +127%__**, 2026-11-02)\n  - 유안타 2027E 매출 1.04조원·영업이익 1,510억원(2026-10-08)\n- 2027E 영업이익은 2026E보다 **+55%**(FMP 기준) 늘어나는 것으로 추정됩니다. 2028E는 추정 인원이 5명뿐이라 신뢰도가 낮습니다.\n- 피어 대비 위치: 이 섹션 데이터에는 피어 배수가 없어 7사 비교표를 참조해야 합니다. 절대 수준으로는 **fwd PER 6~7배의 한 자릿수**이고, 이익이 큰 폭으로 늘어나는 구간치고는 낮은 배수입니다.\n\n#### 투자 포인트·리스크\n**투자 포인트**\n- **패키지기판 흑자전환과 레버리지:** 3Q26 매출 약 590억원, 가동률 60% 중반에서 손익분기점을 넘었고 4Q26에는 70% 이상이 예상됩니다. 고정비 비중이 커서 가동률이 오를수록 이익 탄력이 큽니다(흥국 2026-11-04, 유안타 2026-10-08).\n- **DDR5 믹스 개선과 고객 다변화:** DDR5가 패키지기판 매출의 50%를 넘습니다. SK하이닉스 D1c(9월 기준 약 1/3 점유)와 CXMT가 2027년 물량 확대를 이끌 전망입니다(키움 2026-11-03, 교보 2026-11-02).\n- **리드프레임 호조:** 3Q26 매출 약 1,900억원(**__YoY +41%__**)으로 분기 최대입니다. 전장과 AI 데이터센터 전력용 수요에 판가 인상이 더해졌고, 2Q26 OPM은 18~19% 수준입니다(유진 2026-11-09, 신한 2026-08-11).\n- **판가·LTA 옵션:** 4월 일괄 인상에 이어 고부가 메모리 기판의 추가 인상과 LTA 가능성이 있습니다(메리츠 2026-10-08).\n- **장기 성장 옵션:** Panel 공법에 1,900억원을 투자해 2H29 DDR6·LPDDR 고다층 시장에 진입하고, 패키지기판 캐파를 최대 2배로 늘립니다(DART 2026-09-18).\n\n**리스크**\n- **환율:** 매출의 95% 이상이 달러 결제입니다. 원화가 강세를 보이면 3Q26처럼 **100억원 이상의 외화환산손실**이 발생할 수 있어 이익 민감도가 큽니다.\n- **리드프레임 4Q 재고조정:** 연말 재고조정과 전방 수요 회복 지연 가능성이 있고, 목표주가 하향이 이어지고 있습니다. 컨센서스도 4Q26 영업이익이 3분기보다 소폭 줄어드는 것으로 봅니다.\n- **기술 한계와 긴 공백:** 릴투릴은 4층이 한계이고, GDDR6 4층 제품의 수율 문제와 D1a 벤더 탈락 이력이 있습니다. Panel 라인 양산은 2H29로 멀어 수율·고객 확보 리스크가 있습니다.\n- **고객 집중:** 패키지기판 고객이 메모리 IDM에 몰려 있어 메모리 사이클 변동에 그대로 노출됩니다.\n- **데이터 한계:** 정기보고서 '사업의 내용'에 나오는 공식 매출비중·가동률·수주상황과 증권사의 순이익·2028E 추정치는 확인하지 못했습니다."}], "synth": "> **한 줄 결론:** 2027E 영업이익 **+121.6%**인 삼성전기, OPM **19.0%** 심텍, **21.0%** 대덕전자 **선호** / OPM 1.5% LG이노텍 **비선호**\n\n### 핵심 인사이트\n\n1. **실적 모멘텀은 심텍 > 대덕전자 > 삼성전기 순이고, LG이노텍·코리아써키트가 최하위다**\n   - 4Q25 대비 3Q26 OPM 개선 폭은 심텍 **__+16.4%p__**(2.6%→**19.0%**), 대덕전자 **+11.9%p**(→**21.0%**, 컨센서스 13% 상회), 삼성전기 **+10.1%p**(→18.4%, 영업이익 **__YoY +165%__**) 순이다.\n   - 반대로 LG이노텍은 **-2.8%p**(→**__1.5%__**)로 뒷걸음쳤다. 코리아써키트도 OPM이 8.0%에서 4.7%로 두 분기 연속 하락했다.\n   - → 3사가 OPM **18~21%** 구간에 함께 올라섰다. 이익의 질은 판가 인상과 고부가 믹스(FC-BGA·SoCAMM)를 확보한 회사에 몰렸다.\n\n2. **제품군별로 승자가 갈린다: AI FC-BGA는 삼성전기, 메모리 기판·모듈은 심텍·대덕전자·티엘비, 모바일/BT는 LG이노텍(규모 제한)**\n   - **FC-BGA AI/네트워크**: 20L 이상 AI ASIC·NVIDIA 기판은 **삼성전기가 국내에서 독주**한다. 3Q26 FC-BGA OPM은 **약 30%**이고, 판가를 분기마다 약 10%씩 올리고 있다. LG이노텍·대덕전자는 10~20L 네트워크 스위치로 들어와 2027년 말 AI 가속기 진입을 노린다.\n   - **메모리 기판·모듈 PCB**: 심텍은 SoCAMM 3사 퍼스트벤더다. SoCAMM 매출은 2Q26 390억원에서 **__2027년 3,700억원 이상__**으로 늘어날 전망이다. 티엘비는 SOCAMM 매출을 2027년 **약 1,500억원**으로 잡았고, 삼성전자 Vera Rubin 24층 eSSD를 단독 공급한다. BT 쇼티지의 최대 수혜자는 대덕전자·심텍이다(둘 다 풀캐파, 판가 인상).\n   - **모바일/BT**: LG이노텍은 **RF-SiP 세계 1위**에 풀캐파지만, 패키지솔루션이 전사 매출의 **7.6%**에 그쳐 전사 실적을 움직이지 못한다. 코리아써키트는 레거시 비중이 30%로 7사 중 가장 높다.\n   - → 2026~27년 이익 레버리지는 **AI FC-BGA(삼성전기)**와 **SoCAMM/메모리 BT(심텍·대덕전자)**에 집중된다.\n\n3. **2027~28년 성장 가시성은 캐파 기준으로 삼성전기·대덕전자, 잔고 기준으로 티엘비·심텍이 가장 높다**\n   - **잔고**: 티엘비 3Q26 잔고는 **2,735억원**으로 QoQ **__+107.5%__**, YoY **__+514.6%__**, 분기매출 대비 **2.9배**(역대 최고, 7사 최고)다. 심텍은 절대 규모가 가장 큰 **5,892억원**(2Q26 기준, YoY +120.3%)이고, 가시성이 3개월에서 6개월로 길어졌다.\n   - **캐파**: 대덕전자는 전사 매출 캐파를 1.6조원에서 **__2.7조원__**(1H28)으로 늘린다. 선수금 유입으로 비유동부채가 **__+674%__** 늘어, 잔고 0.8배라는 숫자보다 실제 가시성이 높다. 삼성전기는 공시 투자 **6.8조원**으로 세종·베트남 연 매출 캐파를 **3조원 이상** 늘리고(2H28 양산), 2030년 FC-BGA 캐파는 **__6조원 이상__**이 된다. 투자금의 70% 이상을 고객이 분담한다.\n   - → 2027년은 기존 라인 판가와 보완투자로, 2028년은 신규 라인(삼성전기 세종 2028년 9월, 대덕전자 2.7조원, 심텍 MSAP 2.2조원)으로 성장한다. **2028년까지 성장 경로가 보이는 곳은 삼성전기·대덕전자·심텍**이다.\n\n4. **밸류에이션과 성장이 따로 움직인다: 성장 대비로 싼 곳은 해성디에스·삼성전기·심텍, 비싼 곳은 LG이노텍**\n   - 12M fwd PER ÷ 2027E OP 성장률은 해성디에스 **0.12**(6.7x / +54.9%), 삼성전기 **0.15**(18.2x / +121.6%), 심텍 **0.17**(14.1x / +83.6%) 순이다. 대덕전자와 LG이노텍은 **0.26**이다.\n   - 삼성전기 PER은 TTM **53.8x**에서 12M fwd **18.2x**, 18M fwd **__14.3x__**로 빠르게 낮아진다. 대덕전자는 메리츠 기준 2027년 PER **9.4x**로 대만 ABF 피어 평균 17.7x보다 **약 47% 할인**돼 있다. 심텍은 메리츠 2027E OP가 **5,834억원**으로 컨센서스(4,527억원)보다 **약 29% 높다**.\n   - → LG이노텍 8.0x는 **성장률 최저(+31.4%)를 감안하면 싼 게 아니다**. 진짜 저평가는 성장률이 높은 삼성전기·심텍·대덕전자 쪽에 있다.\n\n5. **주가 조정 폭과 펀더멘털이 엇갈린다: FC-BGA주는 실적과 반대로 급락했고, 모듈주는 실적 둔화에도 올랐다**\n   - 삼성전기는 1M **-37.2%**, 3M **__-44.6%__** 빠졌지만 3Q26 영업이익은 **6,910억원(YoY +165%)**이다. 대덕전자는 1M **-35.8%**인데 OPM은 **21.0%**로 3년 만에 20%대를 회복했다. 해성디에스는 6M **__-47.4%__**인데 영업이익은 **1년 전의 약 2.1배**다.\n   - 반면 코리아써키트는 3M **+44.7%**, 1M +20.4% 올랐지만 OPM은 8.0%에서 4.7%로 내려왔다. LG이노텍의 6M **-60.6%**는 OPM 1.5%를 반영한 조정으로 보인다.\n   - → AI capex 우려에 따른 조정은 **펀더멘털과 상관없이 FC-BGA 노출주 전체에 일괄 적용**됐다. 실적이 받쳐주는 삼성전기·대덕전자가 되돌림 1순위다.\n\n6. **리스크: AI capex 지속성, 추정치 편차, 환율, 레거시 적자**\n   - **추정치 편차**가 크다. 티엘비 2027E OP는 918억~1,223억원으로 벌어져 있다. 코리아써키트는 대신 단일 기준 성장률이 **+59%**로 표의 +109.2%와 차이가 크다. LG이노텍은 IBK 2027E OP가 **7,180억원**으로 컨센서스(12,013억원)보다 크게 낮다.\n   - **구조적 리스크**: 해성디에스는 달러 매출이 **95% 이상**이고, Panel 고다층 라인 양산이 **2H29**로 멀다. 코리아써키트는 인터플렉스 적자(2Q26 **-52억원**)와 추정치 하향이 부담이다. LG이노텍은 환율 영향(약 2,000억원)과 FC-BGA 적자를 안고 있다.\n   - → AI capex 우려와 피어 멀티플 하락이 FC-BGA주 변동성의 주된 원인이다. **추정치를 하향하는 곳(LG이노텍·코리아써키트)은 PER이 싸 보여도 피하는 게 낫다**.\n\n### 한 줄 성적표\n\n| 기업 | 강점 | 약점 | 12M fwd PER | 판단 |\n|---|---|---|---|---|\n| 삼성전기 | 20L+ AI FC-BGA 국내 독주, 2027E OP **__+121.6%__**, 2030년 캐파 6조원 이상 | TTM PER 53.8x, 3M -44.6%로 변동성 큼 | **18.2x** | **선호** |\n| 대덕전자 | OPM **21.0%**, 캐파 1.6조→**2.7조원**, 대만 피어 대비 약 47% 할인 | 잔고/매출 0.8배로 가장 낮음, 1M -35.8% | **13.0x** | **선호** |\n| 심텍 | OPM **__+16.4%p__**, SoCAMM 3사 퍼스트벤더(2027년 3,700억원 이상), 잔고 5,892억원 | TTM 적자(일회성), 메모리 사이클 의존 | **14.1x** | **선호** |\n| 해성디에스 | 성장 대비 PER **0.12**로 최저, 패키지기판 흑자 전환, 영업이익 약 2.1배 | 리드프레임 77%, 달러 매출 95% 이상, Panel 2H29 | **6.7x** | 중립 |\n| 티엘비 | 3Q 잔고 **2,735억원**(QoQ **__+107.5%__**·2.9배), Vera Rubin eSSD 단독, 12M fwd POR 8.5x | 2027E 추정 918~1,223억원으로 편차 큼, 3M +38.4% 선반영 | – | 중립 |\n| 코리아써키트 | 잔고 QoQ +171.3%, SoCAMM2 양산 | OPM 8.0%→4.7%, 레거시 30%, 3M +44.7%로 실적과 괴리 | – | **비선호** |\n| LG이노텍 | RF-SiP 세계 1위, PSR 0.27x | OPM **__1.5%__**, 2027E OP 성장 +31.4%로 최저, IBK 추정 컨센서스 대비 크게 낮음 | 8.0x | **비선호** |", "cat": "## Part 1. 카테고리별 비교\n\n### 1. 시가총액·주가 추이\n\n| 기업 | 시가총액 | 주가 | 1M | 3M | 6M | YTD | 1Y |\n|---|---|---|---|---|---|---|---|\n| 삼성전기 | 65.66조 | 862,500원 | 🔽37.2% | 🔽44.6% | 🔽14.6% | 🔺219.4% | 🔺289.4% |\n| LG이노텍 | 6.78조 | 288,500원 | 🔽34.7% | 🔽55.9% | 🔽60.6% | 🔺7.9% | 🔺18.0% |\n| 심텍 | 4.78조 | 126,400원 | 🔽10.4% | 🔺16.3% | 🔺26.0% | 🔺148.8% | 🔺135.8% |\n| 대덕전자 | 4.59조 | 93,100원 | 🔽35.8% | 🔽21.8% | 🔽31.4% | 🔺94.2% | 🔺88.1% |\n| 코리아써키트 | 2.12조 | 91,300원 | 🔺20.4% | 🔺44.7% | 🔺0.3% | 🔺91.2% | 🔺212.1% |\n| 티엘비 | 0.98조 | 43,450원 | 🔽4.6% | 🔺38.4% | 🔽8.6% | 🔺56.2% | 🔺26.4% |\n| 해성디에스 | 0.77조 | 46,050원 | 🔽19.9% | 🔽21.8% | 🔽47.4% | 🔽16.0% | 🔽16.4% |\n<div id=chP class=ch></div>\n\n- **주도주는 삼성전기다.** 시가총액 **65.66조원**은 나머지 6사 합계(약 20.0조원)의 약 3.3배다. 1Y 수익률은 **__+289.4%__**, YTD는 +219.4%다. 그다음은 코리아써키트(1Y **__+212.1%__**)와 심텍(YTD +148.8%)이다(주가 2026-11-13 기준).\n- **소외주는 해성디에스와 LG이노텍이다.** 해성디에스는 YTD -16.0%, 6M **-47.4%**로 7사 중 유일하게 연초 대비 하락했다. LG이노텍은 6M **__-60.6%__**로 1년 상승분(+18.0%)을 대부분 반납했다.\n- **최근 조정 폭은 ABF·대형주가 가장 크다.** 1M 기준 삼성전기 **-37.2%**, 대덕전자 -35.8%, LG이노텍 -34.7%이고, 3M 기준으로는 LG이노텍 **__-55.9%__**, 삼성전기 -44.6%다. 반면 메모리 모듈·BT 비중이 큰 코리아써키트(1M +20.4%, 3M +44.7%), 티엘비(3M +38.4%), 심텍(3M +16.3%)은 3개월 기준 플러스를 지켰다.\n- 정리하면 AI 설비투자 지속성 우려와 피어 멀티플 하락은 FC-BGA 노출 종목에 집중됐다. SoCAMM·판가 인상 모멘텀이 있는 메모리 기판주는 상대적으로 방어했다.\n\n### 2. 최근 4개 분기 실적\n\n| 기업 | 지표 | Q-3 | Q-2 | Q-1 | 최근 |\n|---|---|---|---|---|---|\n| **삼성전기** | 분기 | 4Q25 | 1Q26 | 2Q26 | 3Q26 |\n|  | 매출(억) | 29,022 | 32,091 | 34,572 | 37,633 |\n|  | 영업이익(억) | 2,395 | 2,806 | 4,404 | 6,910 |\n|  | GPM | 20.8% | 20.6% | 24.4% | –(잠정) |\n|  | OPM | 8.3% | 8.7% | 12.7% | 18.4% |\n| **LG이노텍** | 분기 | 4Q25 | 1Q26 | 2Q26 | 3Q26 |\n|  | 매출(억) | 76,098 | 55,348 | 55,272 | 63,671 |\n|  | 영업이익(억) | 3,248 | 2,953 | 2,458 | 948 |\n|  | GPM | 8.6% | 10.1% | 9.6% | 6.2% |\n|  | OPM | 4.3% | 5.3% | 4.4% | 1.5% |\n| **대덕전자** | 분기 | 4Q25 | 1Q26 | 2Q26 | 3Q26 |\n|  | 매출(억) | 3,179 | 3,463 | 4,010 | 4,181 |\n|  | 영업이익(억) | 290 | 513 | 703 | 879 |\n|  | GPM | 14.5% | 20.9% | 26.8% | –(잠정) |\n|  | OPM | 9.1% | 14.8% | 17.5% | 21.0% |\n| **심텍** | 분기 | 4Q25 | 1Q26 | 2Q26 | 3Q26 |\n|  | 매출(억) | 3,934 | 4,224 | 5,146 | 5,359 |\n|  | 영업이익(억) | 103 | 137 | 629 | 1,018 |\n|  | GPM | 9.1% | 10.4% | 18.5% | –(잠정) |\n|  | OPM | 2.6% | 3.2% | 12.2% | 19.0% |\n| **티엘비** | 분기 | 4Q25 | 1Q26 | 2Q26 | 3Q26 |\n|  | 매출(억) | 726 | 758 | 882 | 940 |\n|  | 영업이익(억) | 86 | 107 | 128 | 166 |\n|  | GPM | 16.4% | 18.7% | 19.5% | 22.0% |\n|  | OPM | 11.8% | 14.1% | 14.5% | 17.7% |\n| **코리아써키트** | 분기 | 3Q25 | 4Q25 | 1Q26 | 2Q26 |\n|  | 매출(억) | 3,756 | 4,481 | 4,199 | 4,072 |\n|  | 영업이익(억) | 133 | 361 | 264 | 193 |\n|  | GPM | 5.5% | 10.9% | 9.1% | 7.4% |\n|  | OPM | 3.5% | 8.0% | 6.3% | 4.7% |\n| **해성디에스** | 분기 | 4Q25 | 1Q26 | 2Q26 | 3Q26 |\n|  | 매출(억) | 1,800 | 1,886 | 2,111 | 2,453 |\n|  | 영업이익(억) | 218 | 110 | 249 | 338 |\n|  | GPM | 19.6% | 12.4% | 18.4% | –(잠정) |\n|  | OPM | 12.1% | 5.8% | 11.8% | 13.8% |\n\n**개선 폭 순위(4Q25 → 최근 분기)** (DART 정기보고서, 3Q26 삼성전기·대덕전자·심텍·해성디에스는 네이버 잠정. 코리아써키트는 3Q25 → 2Q26)\n\n| 순위 | 매출 성장 | GPM 개선(최근 공시 분기) | OPM 개선 |\n|---|---|---|---|\n| 1 | 해성디에스 **+36.3%** | 대덕전자 **__+12.4%p__**(→2Q26 26.8%) | 심텍 **__+16.4%p__**(2.6%→19.0%) |\n| 2 | 심텍 **+36.2%** | 심텍 +9.4%p(→2Q26 18.5%) | 대덕전자 **+11.9%p**(9.1%→21.0%) |\n| 3 | 대덕전자 +31.5% | 티엘비 +5.7%p(→3Q26 22.0%) | 삼성전기 **+10.1%p**(8.3%→18.4%) |\n| 4 | 삼성전기 +29.7% | 삼성전기 +3.7%p(→2Q26 24.4%) | 티엘비 +5.8%p(11.8%→17.7%) |\n| 5 | 티엘비 +29.5% | 코리아써키트 +1.9%p | 해성디에스 +1.7%p |\n| 6 | 코리아써키트 +8.4% | 해성디에스 -1.2%p | 코리아써키트 +1.2%p |\n| 7 | LG이노텍 -16.3% | LG이노텍 -2.4%p | LG이노텍 **-2.8%p**(4.3%→1.5%) |\n\n- **심텍·대덕전자·삼성전기는 이익률이 레벨업했다.** 세 회사 모두 3Q26 OPM이 **18~21%**에 이르렀다. 심텍은 SoCAMM 믹스, 대덕전자는 판가 인상과 비메모리 믹스, 삼성전기는 FC-BGA 판가 인상(분기 약 10%)이 동력이다(메리츠 2026-11-09, 신한 2026-11-02, iM 2026-10-20).\n- **티엘비는 8분기 연속 OPM이 상승 추세다(1.8%→17.7%).** 3Q26 GPM 22.0%로 공시 기준 개선이 확인된다.\n- **해성디에스는 매출 성장 1위지만 이익률 개선은 제한적이다.** 리드프레임 최대 가동(3Q26 약 1,900억원, YoY +41%)이 매출을 끌었고, 원화 강세 부담이 있다(유진 2026-11-09).\n- **LG이노텍과 코리아써키트는 부진하다.** LG이노텍은 4Q 계절 성수기 대비 비교라 매출이 감소했지만, YoY로는 +18.6%다. 다만 3Q26 OPM 1.5%는 환율 영향(약 2,000억원)과 FC-BGA 적자 탓이다(SK 2026-11-12). 코리아써키트는 4Q25 고점 이후 OPM이 8.0%→4.7%로 꺾였다. 인터플렉스 적자(2Q26 -52억원)가 원인이다.\n\n### 3. 수주잔고\n\n| 기업 | 2Q26 잔고 | 3Q26 잔고 | QoQ | YoY | 3Q 분기매출 대비 | 비고 |\n|---|---|---|---|---|---|---|\n| 삼성전기 | 공시 없음 | 공시 없음 | – | – | – | 수주잔고 미공시 |\n| LG이노텍 | 공시 없음 | 공시 없음 | – | – | – | 3Q 보고서 제출(2026-11-12), 수주상황 미기재 |\n| 대덕전자 | 3,328억 | 미제출 | – | – | – | 3Q 보고서 미제출(마감 11/16) — 2Q26 기준 YoY 🔺159.4% |\n| 심텍 | 5,892억 | 미제출 | – | – | – | 3Q 보고서 미제출(마감 11/16) — 2Q26 기준 YoY 🔺120.3% |\n| 티엘비 | 1,318억 | **2,735억** | 🔺107.5% | 🔺514.6% | 2.9배 | 3Q 보고서 반영(2026-11-13) |\n| 코리아써키트 | 4,266억 | 미제출 | – | – | – | 3Q 보고서 미제출(마감 11/16) — 2Q26 기준 YoY 🔺166.7% |\n| 해성디에스 | 공시 없음 | 공시 없음 | – | – | – | 수주잔고 미공시 |\n\n- **잔고 증가율은 티엘비가 1위다.** 3Q26 잔고는 2,735억원이고 QoQ **__+107.5%__**, YoY **__+514.6%__**다. 3Q 분기매출 대비 **__2.9배__**로 역대 최고이며 가시성도 가장 높다(수주총액 5,263억원, 기납품액 2,528억원, 1~9월 누계, 3Q26 분기보고서 2026-11-13). 고객이 약 3개월 단위로 확정하는 구조에 SOCAMM의 긴 리드타임이 더해졌다(티엘비 IR노트 2026-07-20, 키움 2026-11-12).\n- **코리아써키트는 2Q26 QoQ __+171.3%__로 잔고가 급증했다.** SoCAMM 등 고ASP 제품이 이끌었다. 다만 출처 간 시점 불일치가 있다. 메리츠(2026-08-14)는 2Q26을 4,167억원, 글로벌 테크 밸류체인(2026-11-13)은 3Q26을 4,266억원으로 적었다. 3Q 보고서는 아직 제출되지 않아(마감 11/16) 표는 2Q26 기준 4,266억원을 썼다. 분기매출 대비 1.0배라 회전이 짧다.\n- **심텍은 절대 규모가 가장 크다(5,892억원, 2Q26 기준 YoY +120.3%, 1.1배).** 3Q 보고서는 미제출 상태다(마감 11/16). DART 기준 1H26 말 잔고는 3억9,236만달러다. 월 수주가 1.5억달러로 늘었고(DB 2026-11-04) 가시성은 3개월에서 6개월로 길어졌다(iM 2026-08). LTA를 체결하면 양산 물량의 약 60%가 LTA로 전환될 전망이다(메리츠 2026-11-09).\n- **대덕전자는 2Q26 기준 YoY +159.4%이지만 매출 대비 0.8배로 가장 낮다(3Q 보고서 미제출, 마감 11/16).** 다만 수주가 LTA·선수금 구조로 이뤄지고, 선수금 유입으로 비유동부채가 **__+674%__** 늘어 잔고 수치보다 가시성이 높다(교보 2026-11-02).\n- **삼성전기·LG이노텍·해성디에스는 기판 잔고를 공시하지 않는다.** LG이노텍은 3Q 보고서(2026-11-12)에도 수주상황을 적지 않았다. 삼성전기는 패키지기판 수주 3,605억원(2027년 1년 계약)을 공시했고, MLCC 등을 포함한 합산 잔고는 약 **5.19조원**이다(메리츠 2026-11-02). FC-BGA는 고객 지원금·선수금으로 캐파를 사전 할당하는 구조다. LG이노텍은 북미 반도체 3사와 4~5년 LTA를 마무리하는 단계다(유안타 2026-10-08).\n\n### 4. 기판 제품군별 비교\n\n#### 4-1. FC-BGA 서버·AI/네트워크\n\n| 기업 | 단수(층수) | 사용처 | 주요 고객 | 매출 비중 | 현재/향후 |\n|---|---|---|---|---|---|\n| 삼성전기 | 고객 칩별 **14~24L**: Trainium2 16L, Trainium3 18~20L, Trainium4 24L(110×130mm), TPU v8 18L(7/31 리포트, 5/27 리포트는 22~24L), TPU v9 24L, MTIA >18L, Tomahawk 6 >20L·7 >22L, Qualcomm Cloud AI 200 14L·300 16L, OpenAI ASIC 14L, NVIDIA LPU 16L·NVLink6 18L(메리츠 2026-07-31·05-27). AI 가속기용은 약 20층으로 일 |\n\n> 경쟁 구도: **대덕전자·심텍이 메모리 BT 쇼티지의 최대 수혜자**다(둘 다 풀캐파·판가 인상). 삼성전기·LG이노텍은 BT를 보조 축으로 두고, 코리아써키트는 GDDR7 진입을 시도 중이다.\n\n#### 4-4. 메모리 모듈 PCB(RDIMM·SoCAMM·MRDIMM·CXL)\n\n| 기업 | 단수(층수) | 사용처 | 주요 고객 | 매출 비중 | 현재/향후 |\n|---|---|---|---|---|---|\n| 심텍 | SoCAMM은 층수 숫자 없이 'DDR5 서버 모듈보다 높음'. 서버·PC 모듈은 SoCAMM보다 낮음 | NVIDIA Vera Rubin SoCAMM, 서버 RDIMM, PC 모듈 | 메모리 3사(최종고객 NVIDIA) | SoCAMM **7.6%**, 서버·PC·SSD 모듈 18.2%(3Q26) | SoCAMM 3사 모두 퍼스트벤더(점유율 50% 이상). SoCAMM 합산 매출 2Q26 390억 → 4Q26 1,000억 → **__2027년 3,700억원 이상__**(회사 가이던스, 메리츠 2026-11-09). CXL 모듈 2027 |\n| 티엘비 | RDIMM **12~16L, 고사양 16층 BVH(3회 적층)**. SOCAMM **16층·5회 적층**. MRDIMM 16층·5회 적층(BVH 두 장 합침). LPCAMM 12층·3회. CXL 샘플 16~18층, 24층까지 개발. DDR6 약 6회 적층 검토 | 서버 DDR5 RDIMM(8800까지), Vera Rubin SOCAMM, MRDIMM, LPCAMM, CXL | SK하이닉스, Micron, 삼성전자 | RDIMM 등 약 42%, SOCAMM 약 **21%**(3Q26, 콥데이 2026-11-11) | 판가 인상(3Q26 ASP QoQ 10% 이상). SOCAMM 2026년 600~700억 → **2027년 약 1,500억원** 목표(시장점유율 30%). DDR6는 2~3년 뒤 |\n| 코리아써키트 | 서버 DDR5 6400 RDIMM **16L IVH**(DART). 과거 8~10층 → 12~16층 비중 확대(메리츠 2026-01-28), 서버향 20L 이상 공급 논의(현대차 2026-01-20). SoCAMM2는 '적층 수 증가' 표현만 있고 숫자 없음 | AI 서버 DRAM 모듈, SoCAMM2 | Micron(점유율 높음), SK하이닉스, 국내 메모리(SoCAMM 4Q26) | 모듈·SSD 합산 **30%**(1Q26 별도) | SoCAMM2 2026.07 양산. 매출 2026E 260억 → 2027E 900억원 이상(대신 2026-11-02, 회사 가이던스 650억원과 불일치). 모듈 합계 2027E 4,700억원(**+48.7%**) |\n\n> 경쟁 구도: SoCAMM은 **심텍(3사 퍼스트벤더) > 티엘비(하이닉스·마이크론) > 코리아써키트(1→2개사)** 순이다. RDIMM 고다층(16L BVH)은 티엘비와 코리아써키트가 겹친다. 2027년 신규 공급은 코리아써키트 증설분이 사실상 유일하다(메리츠 2026-10-20).\n\n#### 4-5. SSD PCB\n\n| 기업 | 단수(층수) | 사용처 | 주요 고객 | 매출 비중 | 현재/향후 |\n|---|---|---|---|---|---|\n| 티엘비 | eSSD·EDSFF **20~24층**, Vera Rubin 스토리지용 **24층 BVH(3회 적층)**. 기존 16~20층에서 상향 | 서버 eSSD(E1.S/E3.S), 일반 SSD | 삼성전자(PM1773 단독) | **33%**(3Q26) | 확대. 24층 ASP가 DDR5 BVH의 약 1.5배, 2027년 전 제품 판가 인상 대상 |\n| 심텍 | 층수 정보 없음 | SSD 모듈 | 메모리 3사 | 약 4.8%(258억원, 3Q26) | 축소(QoQ 감소) |\n| 코리아써키트 | 별도 층수 정보 없음 | SSD | 메모리 고객 | 모듈·SSD 합산 30%에 포함 | 모듈 증설과 함께 확대 |\n\n> 경쟁 구도: 고다층 eSSD는 **티엘비가 삼성전자 Vera Rubin 스토리지 단독 (12M fwd PER 6.7x, 18M fwd 6.1x).** 근거는 패키지기판 흑자 전환과 리드프레임 최대 가동이다. 그럼에도 싼 이유는 매출의 77%가 리드프레임이고, 달러 매출이 95% 이상이라 환율 민감도가 높으며, 고다층 대응(Panel)이 2H29로 멀기 때문이다.\n- **LG이노텍은 8.0x로 싸 보이지만 성장 대비로는 가장 비싼 축이다.** 2027E OP 성장률이 +31.4%로 최저이고, 매출의 약 85%가 카메라모듈이다. 3Q26 OPM은 1.5%였다. IBK(2026-10-28)는 2027E OP를 **7,180억원**으로 봐 FMP 컨센서스 12,013억원보다 크게 낮다.\n- **삼성전기는 TTM PER 53.8x로 가장 비싸지만**, 12M fwd 18.2x에 18M fwd 14.3x이고 2027E OP 성장률이 **__+121.6%__**로 최고라 성장 대비로는 하단이다. IBK는 2028E OP를 **8.48조원**으로 컨센서스(8.00조원)보다 높게 본다(IBK 2026-11-12).\n- **심텍은 증권사 추정이 컨센서스를 웃돈다.** 메리츠 2027E OP는 **5,834억원**으로 FMP 4,527억원 대비 약 29% 높다(메리츠 2026-11-09). 이를 반영하면 실제 배수는 표보다 낮아진다.\n- **대덕전자는 국내 비교로는 중간이지만 해외 피어 대비 할인돼 있다.** 메리츠 기준 2027년 PER은 9.4배로 대만 ABF 피어 평균 17.7배 대비 약 47% 할인이다(메리츠 2026-11-09).\n- **티엘비·코리아써키트는 성장률 해석에 주의가 필요하다.**\n  - 두 회사 모두 2026E와 2027E의 출처가 다르다. 티엘비는 2026E 대신, 2027E IBK이고, 코리아써키트는 2026E 대신(역산), 2027E FMP다.\n  - 코리아써키트는 대신 단일 기준으로 보면 2027E OP가 1,470억원, 성장률 **+59%**로 표의 109.2%보다 낮다(대신 2026-11-02).\n  - 티엘비는 2027E 추정치 편차가 크다. 메리츠 918억원부터 IBK 1,223억원까지 벌어져 있다.", "meth": "\n- 실적: DART 정기보고서 손익(분기 환산). 3Q26 보고서가 아직 없는 곳(삼성전기·대덕전자·심텍·해성디에스)은 네이버 잠정치를 썼고, 이 경우 매출총이익(GPM)이 없다. 코리아써키트는 3Q26이 아직 없어 2Q26까지만 반영했다.\n- 주가: FMP 일별 수정종가. 티엘비는 네이버 일별 종가를 쓰고, 2026-07-16 권리락 이전 가격을 수정했다. 시가총액은 국내 수급 DB 최신값이다.\n- 밸류에이션: TTM은 최근 4개 분기 합계 기준이다. 12M fwd는 2026E 1.5개월과 2027E 10.5개월을, 18M fwd는 2027E 8개월과 2028E 4개월을 가중했다. 추정치는 FMP 애널리스트 컨센서스(3명 이상)를 우선하고, 없으면 최근 증권사 추정치를 썼다. 티엘비는 증권사 추정에 순이익이 없어 선행 PER을 비웠다.\n- 수주잔고: 정기보고서 '수주상황' 기준 트래커 값이다. 3Q26은 11/13까지 보고서를 낸 티엘비만 반영했고, 대덕전자·심텍·코리아써키트는 2Q26 값이다(마감 11/16). 삼성전기·LG이노텍·해성디에스는 수주잔고를 공시하지 않는다.\n- 사업·단수·캐파: DART 사업보고서, 증권사 리포트, 업계 기사·코멘트(학습 코퍼스)에서 출처를 붙여 정리했다. 2024년 이전 자료는 참고용으로만 표시했다.\n"};
const $=id=>document.getElementById(id);

 series:[{type:'scatter',data:D.co.filter(c=>c.g27!=null&&(c.per12||c.por12)).map((c,i)=>[c.g27,c.per12||c.por12,c.mcap,c.name,c.per12?'PER':'POR']),

let qc=null;function qtab(k){$('qtabs').innerHTML=['매출','영업이익','OPM','GPM'].map(x=>`<button class="${x===k?'on':''}" onclick="qtab('${x}')">${x}</button>`).join('');
 const key={매출:'rev',영업이익:'op',OPM:'opm',GPM:'gpm'}[k];const pct=key==='opm'||key==='gpm';

  xAxis:{type:'category',data:qs.map(q=>q.slice(-1)+'Q'+q.slice(2,4)),axisLabel:{color:tc}},yAxis:{type:pct?'value':'log',axisLabel:{color:tc,formatter:v=>pct?v+'%':v.toLocaleString()},splitLine:{lineStyle:{opacity:.25}}},
  dataZoom:[{type:'inside'},{type:'slider',height:14,bottom:6}],toolbox:{right:0,top:24,feature:{dataZoom:{},restore:{}}},
  series:D.co.map((c,i)=>({name:c.name,type:pct?'line':'bar',itemStyle:{color:COL[i]},symbolSize:8,data:qs.map(q=>{const x=c.q.find(y=>y.q===q);return x&&x[key]!=null&&(pct||x[key]>0)?+x[key].toFixed(1):null;})}))};
