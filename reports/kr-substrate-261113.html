["2026-11-11", 923000], ["2026-11-12", 886000], ["2026-11-13", 862500]], "q": [{"q": "2025Q4", "rev": 29021.5, "gp": 6026.0, "op": 2395.0, "ni": -1416.0, "src": "DART 정기보고서", "gpm": 20.763916406801854, "opm": 8.252502455076408}, {"q": "2026Q1", "rev": 32091.1, "gp": 6602.9, "op": 2805.7, "ni": 0.0, "src": "DART 정기보고서", "gpm": 20.575486661410796, "opm": 8.742922492529082}, {"q": "2026Q2", "rev": 34572.0, "gp": 8445.0, "op": 4403.7, "ni": 0.0, "src": "DART 정기보고서", "gpm": 24.427282193682746, "opm": 12.737764665046857}, {"q": "2026Q3", "rev": 37632.78, "gp": null, "op": 6909.57, "ni": null, "src": "네이버(잠정)", "gpm": null, "opm": 18.360509109345628}], "g27": 121.64845629630139, "per12": 17.848202103832502, "por12": 13.414693922911324, "sec": "### 삼성전기 (009150.KS)\n\n#### 한눈에\n- **사업 정체성**: 이익의 중심은 MLCC(컴포넌트)입니다. 패키지솔루션 사업부가 FC-BGA(ABF)와 BGA(BT) 기판을 만들며, 패키지 부문은 3Q26 전사 매출의 **약 25%**를 차지했습니다(IBK 2026-11-12). FC-BGA 매출의 60% 이상이 서버·네트워크용입니다(IBK 2026-11-12).\n- **실적 모멘텀**: 3Q26 영업이익은 **6,910억원**으로 **__전년 대비 +165%__**, OPM은 **__18.4%__**였습니다(네이버 잠정). FC-BGA는 풀가동 중이고 분기마다 판가를 약 10% 올리고 있습니다(iM 2026-10-20).\n- **밸류에이션 위치**: TTM PER은 **53.8배**로 높습니다. 다만 이익 급증이 컨센서스에 반영되면서 12M fwd **17.8배**, 18M fwd **14.0배**로 빠르게 낮아집니다(FMP 컨센서스).\n\n#### 시가총액·주가\n| 항목 | 수치 |\n|---|---|\n| 시가총액 | **64조2,366억원** |\n| 주가 | **855,000원** (2026-11-13) |\n| 1M | **__-37.8%__** |\n| 3M | **__-45.1%__** |\n| 6M | -15.3% |\n| YTD | **__+216.7%__** |\n| 1Y | **__+286.0%__** |\n\n해석: 1년 동안 주가가 약 3.9배 오른 뒤, 최근 3개월은 AI 투자·메모리 사이클 우려로 **-45%까지 급격히 조정**받았습니다.\n\n#### 최근 4개 분기 실적\n| 분기 | 매출(억원) | GPM | OPM | 영업이익(억원) | 출처 |\n|---|---|---|---|---|---|\n| 4Q25 | 29,022 | 20.8% | 8.3% | 2,395 | DART |\n| 1Q26 | 32,091 | 20.6% | 8.7% | 2,806 | DART |\n| 2Q26 | 34,572 | **24.4%** | 12.7% | 4,404 | DART |\n| 3Q26 | **37,633** | –(잠정) | **__18.4%__** | **__6,910__** | 네이버(잠정) |\n\n- 매출은 4개 분기 연속 늘어 2.90조원에서 **3.76조원**이 됐습니다(3Q26 전년 대비 +30.3%, 전분기 대비 +8.9%). 영업이익은 3Q26에 **__전분기 대비 +57%, 전년 대비 +165%__** 늘었습니다.\n- GPM이 2Q26에 24.4%로 뛰었고, OPM은 4Q25 8.3%에서 3Q26 18.4%로 **2배 이상** 올랐습니다. 패키지 부문 OPM도 1Q26 8.3%에서 3Q26 **__20.5%__**로 함께 개선됐습니다(IBK 2026-11-12).\n\n#### 수주잔고\n- **트래커 수치 없음**: 기판 단독 수주잔고는 공시되지 않습니다. 따라서 최근 잔고, QoQ·YoY 증감, 분기매출 대비 배수를 산출할 수 없습니다.\n- 확인된 패키지기판 공시는 2026-10-19 **3,605억원** 1건입니다. 메모리용 BGA·FC-BGA 물량으로 계약기간은 2027.01~12, 매출 대비 3.2%이며, 이 중 BGA가 약 3,000억원으로 추정됩니다(iM 2026-10-20).\n- MLCC·실리콘 커패시터·패키지기판을 합친 수주잔고는 **약 5.19조원**입니다(Meritz 2026-11-02). 증가 과정은 AI용 MLCC 3.27조원 → 커패시터 합계 4.83조원 → 기판 포함 5.19조원입니다. 참고로 3Q26 전사 분기매출의 약 1.4배지만, 기판 외 품목이 포함된 수치입니다.\n- **성격**: FC-BGA는 단일판매 공시를 하지 않습니다. 대신 **고객 지원금·선수금과 가동률 보장 조건으로 캐파를 미리 배정**받는 구조입니다. 9/28 증설 공시 자체가 3년 뒤 물량을 확보했다는 의미이고, 회사는 2030년 이후 공급까지 고객과 논의하고 있습니다(iM 2026-09-29). Tesla와는 2029~2033년 장기 공급계약을 맺었습니다(텔레그램 2026-10).\n\n#### 기판 사업 내용\n**전사 매출 중 기판(패키지) 비중**\n- 3Q26: **약 25.0%** (패키지 9,390억원 ÷ 전사 3조7,633억원, IBK 2026-11-12)\n- 2026E: 23.9% (IBK), 23.8% (Meritz 2026-10-29)\n- 2027E: 22.4% (Meritz 2026-10-29)\n\n| 구분 | 제품군 | 단수(층수) | 사용처 | 주요 고객사 | 매출 비중 | 상태·시점 |\n|---|---|---|---|---|---|---|\n| 현재 매출 | FC-BGA 서버·AI ASIC·네트워크 스위치용 | **고객 칩별 14L~24L**: AWS Trainium2 16L(70×90mm), Trainium3 18~20L(70×90mm). Google TPU v8 18L(90×100mm). TPU v8은 Meritz 2026-05-27 표4에 22~24L로 적혀 있어 수치가 다름. Meta MTIA Athena(75×75mm)·Iris(80×90mm) >18L. Broadcom Tomahawk 6 >20L(>100×100mm). Qualcomm Cloud AI 200 14L(60×60mm), Cloud AI 300 16L(80×80mm). 2026-05-27 리포트는 Cloud AI 100을 15L로 표기. OpenAI ASIC 14L(70×80mm). 칩별 수치는 Prismark·Meritz 추정(Meritz 2026-07-31 표8). AI 가속기용은 약 20층으로 일반 제품의 2배 이상(지속가능경영보고서 SR2025). 서버용 20층(75×75mm)은 KPCA 2022 공개로 참고용 | AI ASIC, DC 스위치, 서버 CPU, LPU | Amazon(AWS), AMD, NVIDIA(네트워킹 IC, 2Q26~), Google, Meta, 신규 LPU 고객 | 패키지 매출 중 FC-BGA 전체 **약 65%**(6,100억원, SK 2026-10-29 추정). 이 중 서버·네트워크가 60% 이상(IBK) | **풀가동**, 분기 약 10% 판가 인상, 3Q26 OPM **약 30%**(iM 2026-10-20) |\n| 현재 매출 | Embedded PCB(서버 CPU용 FC-BGA) | – (데이터 없음) | 서버 CPU(MLCC 등 내장) | 기존 서버 CPU 고객, 신규 CPU 고객 | FC-BGA에 포함 | 확대. 신규 고객 4Q26부터 납품 본격화(Meritz 2026-10-29) |\n| 56.1%__** 하락했습니다. 12M fwd 기준 **PER 8.1배, PSR 0.27배**입니다(FMP 컨센서스). 기판 비중이 낮아 카메라모듈 밸류에이션의 영향을 크게 받습니다.\n\n#### 시가총액·주가\n- **시가총액 6조 8,272억원, 주가 287,000원** (2026-11-13 종가)\n\n| 1M | 3M | 6M | YTD | 1Y |\n|---|---|---|---|---|\n| -35.0% | **__-56.1%__** | **__-60.8%__** | +7.3% | +17.4% |\n\n- **해석:** 연초 및 1년 전보다는 아직 높지만, 6개월 전 대비 -60.8%로 **상반기 상승분 대부분을 되돌렸습니다**. 3Q26 이익 급감과 환율 영향이 최근 하락과 시기가 겹칩니다.\n\n#### 최근 4개 분기 실적\n(단위: 억원, DART 정기보고서 확정)\n\n| 분기 | 매출 | GPM | OPM | 영업이익 |\n|---|---|---|---|---|\n| 4Q25 | 76,098 | 8.6% | 4.3% | 3,248 |\n| 1Q26 | 55,348 | **10.1%** | **5.3%** | 2,953 |\n| 2Q26 | 55,272 | 9.6% | 4.4% | 2,458 |\n| 3Q26 | 63,671 | **6.2%** | **1.5%** | **__949__** |\n\n- 1Q26에는 GPM 10.1%, OPM 5.3%로 최근 2년 중 가장 높았습니다. 이후 두 분기 연속 내려갔고, 3Q26에는 매출이 전 분기보다 +15.2% 늘었는데도 **__영업이익은 -61.4%__** 줄었습니다. SK증권은 3Q26에 환율 영향으로 **약 2,000억원의 이익 차이**가 났다고 봅니다(SK 2026-11-12).\n- 전사 실적은 광학(아이폰 카메라)의 계절성과 환율이 좌우합니다. 기판(패키지솔루션)은 3Q26 매출 4,818억원으로 규모가 작아 아직 전사 마진을 끌어올리지 못합니다(IBK 2026-10-28).\n\n#### 수주잔고\n- **수주잔고 트래커 대상이 아니고, 숫자로 공개된 기판 수주잔고도 없습니다.** 최근·QoQ·YoY·분기매출 대비 배수 모두 해당 없음입니다.\n- **수주의 성격:**\n  - 북미 반도체 3사와 **FC-BGA LTA를 마무리하는 단계**이고, 추가 고객사와도 협의하고 있습니다.\n  - 계약 기간은 **평균 4~5년**(유안타 2026-10-08) 또는 **2032년까지**(메리츠 2026-09-21)로 논의되고 있습니다.\n  - 회사는 앞으로 기판 물량 대부분이 LTA 기반이 될 것이라고 밝혔습니다.\n- RF-SiP는 프로젝트별로 물량이 미리 정해지는 **단독 공급 구조**입니다. SK증권은 LTA 체결 자체보다 **선수금 규모와 받는 시점**이 더 중요하다고 봅니다(SK 2026-11-12).\n- 참고로 회사가 공개한 수주잔고(2025년 19.2조원, 2026년 말 20조원 이상 전망)는 **모빌리티 부문** 수치이며 기판과 관계가 없습니다.\n\n#### 기판 사업 내용\n- **회사 매출 중 기판 비중**\n  - 패키지솔루션 매출은 3Q26 **4,818억원으로 전사의 7.6%**입니다(IBK 2026-10-28).\n  - 2026E는 7.9%(IBK 2026-10-28)이고, 유안타는 2026E 8.3%, 2027E 9.6%로 추정합니다(유안타 2026-10-08).\n  - 이 수치에는 디스플레이소재·부품이 포함돼 있어 **순수 반도체 기판 비중은 더 낮습니다**.\n  - 영업이익 기준으로는 패키지솔루션 비중이 **2026E 21% → 2027E 30%(신한 2026-10-28) → __2028E 41%__(iM·메리츠 2026-07-28)**로 커질 전망입니다.\n\n| 구분 | 제품군 | 단수(층수) | 사용처 | 주요 고객사 | 매출 비중 | 상태·시점 |\n|---|---|---|---|---|---|---|\n| 현재 매출 | RF-SiP 기판(BT, mSAP, Cu-Post) | 미공개 | 스마트폰 RF 모듈, 위성통신 등 비스마트폰 RF | 브로드컴·스카이웍스·코보(최종 수요처는 북미 스마트폰 고객사) | 미공개 | **양산·풀캐파, 세계 점유율 1위**. Cu-Post는 단독 공급이고 경쟁사와 기술 격차 약 2년. **__2026년 Cu-Post 매출은 전년 대비 약 2배__** 전망 (메리츠 2026-05-06, 2026-05-18; SK 2026-11-12) |\n| 현재 매출 | FC-CSP 기판(BT) | 미공개 | 메모리(신호 속도 향상·박형화), 모바일 | 메모리 고객사(이름 미공개, 다수 제품 퀄 통과) | 미공개 | 확대 중. 수요가 견조하고 LTA 기반 증설 가능성 있음 (메리츠 2026-05-18; 신한 2026-10-28) |\n| 현재 매출 | AiP 기판(BT) | 미공개 | 스마트폰 안테나 모듈 | 미공개 | 미공개 | 양산 (메리츠 2026-09-21) |\n| 현재 매출 | FC-BGA(ABF) PC CPU용 | **2026년 주력은 10L 중반대(50mm body급)** (메리츠 2026-06-30). 개발 스펙은 **20층 이상, 120×120mm 이상**으로, 비교 표에서 A사는 26층 이상/150×150mm 이상, C사는 20층 이상/100×100mm 이상 (SK 2026-05-13, 2026-07-28) | PC CPU | 북미 팹리스 1곳(기존), 글로벌 CPU 업체(2026년 신규 진입) | **약 5%**(2026E FC-BGA 1,000억원(SK 2026-07-28) ÷ 패키지솔루션 1조 9,033억원(IBK 2026-10-28)으로 역산, 디스플레이 포함 기준). 2025년은 3%(iM 2026-07-28) | 양산·확대. 3Q26 매출은 2Q 수준이고 **여전히 적자** (SK 2026-11-12) |\n| 현재 매출 | 디스플레이소재·부품 | 해당 없음(기판 외) | 디스플레이 | 미공개 | 미공개 | 축소. 3Q26 부진, 4Q26도 부진 전망. 마진은 두 자릿수 유지 (IBK 2026-10-28; SK 2026-11-12) |\n| 향후 기대 | FC-BGA 서버 스위치·네트워크(NW)용, DPU용 | **22L 초과(100×100mm 초과)**. 메리츠는 Broadcom Tomahawk 7 공급사 후보로 NYPCB·Unimicron·SEMCO와 함께 LG이노텍을 꼽음(추정). Tomahawk 4~6 공급사에는 없음. 2027년 말부터 NW 중심으로 20L 이상(80mm body 이상) 확대 전망. DPU 단수는 근거 없음 (메리츠 2026-06-30) | 데이터센터 네트워크 스위치, DPU | 북미 빅테크·반도체 고객사(이름 미공개) | FC-BGA 전체 매출 **2027E 4,000억원 → __2028E 1조원__**(회사 로드맵) | NW용은 2H26 공급 시작, 서버 스위치·DPU용은 2027년 (iM·SK 2026-07-28; 메리츠 2026-09-21; 유안타 2026-10-08) |\n| 향후 기대 | FC-BGA AI 가속기용(대면적) | **현재 12~14L**. 메리츠 추정 공급사 명단(2026-06-30)에 오른 칩: Tesla AI4 55×55mm 12L(SEMCO·대덕·LG이노텍), Qualcomm Cloud AI 200 60×60mm 14L(SEMCO·LG이노텍), OpenAI ASIC 70×80mm 14L(SEMCO·LG이노텍). 2026년 AI용 주력은 50body·10L 중반대이고, **2027년 말부터 ASIC 중심으로 20L 이상(80mm body 이상)** 확대 전망 | AI 학습·추론 가속기 | AI 가속기 고객사(공급 협의 착수, 일부는 품질 검증 논의 중) | FC-BGA 2028E 1조원에 포함 | **2027년 양산 목표** (iM 2026-07-28; 뉴스핌 2026-10-02) |\n| 향후 기대 | FC-BGA 서버 CPU용 | 미공개 | 서버 CPU | 글로벌 CPU 업체 | 2030년 FC-BGA 목표 2조원 | 증권사는 2028년 진입 예상, 회사는 2029년 본격 공급 기대 (유안타 2026-10-08; 메리츠 2026-09-21; SK 2026-11-12) |\n| 향후 기대 | EMIB-T 등 차세대 패키징 기판 | 미공개 | 인텔 EMIB 계열 첨단 패키징 | 인텔(보도 기준), 현재 PC 칩셋을 공급받는 고객사(기술 논의) | 미공개 | 시점 미정. 공급망 진입 추진 보도(2026-11)와 메리츠 2026-05-18 언급 |\n| 향후 기대 | BT 확장(6G RF-SiP, 커스텀 통신칩용, 메모리용 FC-CSP) | 미공개 | 6G RF 모듈 추가 탑재, 통신모듈 업그레이드, 메모리 패키지 | 북미 스마트폰 고객사, 메모리 업체 | 2030년 BT 매출 목표 2조원 | 중장기 (메리츠 2026-05-18; SK 2026-11-12) |\n\n#### 캐파\n- 캐파 절대치(장비 대수·면적·금액)는 이번 데이터에 없습니다. DART 사업의 내용을 확인하지 못했기 때문입니다.\n\n**현재 캐파·가동률**\n\n| 대상 | 캐파 | 가동률 | 출처 |\n|---|---|---|---|\n| BT 계열(RF-SiP, FC-CSP) | 미공개 | **풀캐파**. FC-BGA를 뺀 가동률은 **90%대**로 추산 | SK 2026-07-28, 2026-11-12; 유안타 2026-07-28 |\n| FC-BGA(구미) | 미공개 | **2Q26 기준 50% 미만**(캐파 여유 있음) | 유안타 2026-07-08, 2026-07-28 |\n\n**증설 계획**\n\n| 대상 | 추가 캐파 | 타임라인 | 투자액 |\n|---|---|---|---|\n| 베트남 하이퐁 패키지기판 신공장(FC-BGA 등) | 미공개 | 2026-06-04 MOU 체결, **2028년 양산 목표** | **1조원 이상(약 10억달러)** (Citi 2026-06-04; 지디넷 2026-10-30) |\n| 구미 FC-BGA 추가 라인(공장 내 여유 공간 활용) | 미공개 | 검토 중 | 6,000억원 투자 진행 중(보도 기준, 지디넷 2026-10-30) |\n| ABF 기판 대규모 증설(LTA·선수금 기반) | 미공개 | 빠르면 연내 확정, 2026~2028년 투자. 장비는 미리 발주 중 | **__2조원 이상__**(증권사 추정, SK 2026-11-12; 메리츠 2026-07-28). 전사 CAPEX는 2026F 1조 240억원, 2027F 1조 4,200억원(IBK 2026-10-28) |\n| FC-CSP 증설(LTA 기반) | 미공개 | 미정 | 미공개. 선급금 동반 가능 (메리츠 2026-05-18) |\n\n#### 밸류에이션\n(시총 6조 8,272억원 기준)\n\n| 구분 | PER | POR | PSR |\n|---|---|---|---|\n| TTM | 10.8배* | 7.1배 | 0.27배 |\n| 12M fwd(2026E 1.5개월 + 2027E 10.5개월) | **8.1배** | **5.9배** | 0.27배 |\n| 18M fwd(2027E 8개월 + 2028E 4개월) | **7.2배** | **5.3배** | 0.26배 |\n\n\\* TTM 순이익 데이터가 불완전합니다(2026년 분기 순이익 미수록). 그래서 TTM PER은 참고용으로만 보는 게 맞습니다.\n\n- **추정치 출처:** FMP 컨센서스입니다.\n  - 2026E: 매출 24.37조원, OP 9,144억원(18명)\n  - 2027E: 매출 25.37조원, OP 1조 2,013억원(25명)\n  - 2028E: 매출 27.39조원, OP 1조 4,980억원(12명)\n- **IBK 추정은 훨씬 보수적입니다**(IBK 2026-10-28). 2026E OP 8,250억원, 2027E 7,180억원, 2028E 7,620억원으로, **2027E OP가 FMP 컨센서스보다 약 40% 낮습니다**. 추정치를 무엇으로 쓰느냐에 따라 fwd 배수 차이가 큽니다.\n- **피어 대비 위치:** 저마진 카메라모듈이 매출의 85%라서 **PSR이 0.3배를 밑도는 구조**입니다. 따라서 기판 전업 피어와 PSR을 직접 비교하기는 어렵고, 기판의 영업이익 기여도가 커질 때 재평가 여지가 생깁니다.\n\n#### 투자 포인트·리스크\n**투자 포인트**\n- **2030년 패키징기판 목표: 매출 __4조원__(FC-BGA 2조 + BT 2조), 영업이익 1조원.** 2026E 패키지솔루션 매출 1.9조원(IBK)의 약 2배입니다(SK 2026-11-12).\n- **FC-BGA 매출 로드맵: 2026년 1,000억원 → 2027년 4,000억원 → __2028년 1조원__**(SK 2026-07-28). 패키지 내 FC-BGA 비중은 2025년 3%에서 2028년 25%로 높아질 전망입니다(iM 2026-07-28).\n- **BT·RF-SiP는 풀캐파 상태에서 판가를 올렸고, 두 자릿수 마진을 냅니다.** Cu-Post는 단독 공급이며 경쟁사와 기술 격차가 약 2년입니다(메리츠 2026-05-18, 2026-09-21; SK 2026-11-12).\n- **북미 반도체 3사와 LTA를 마무리하는 중이며, 선수금을 받아 증설하는 구조**를 추진합니다. 수요 가시성이 높아졌습니다(메리츠 2026-07-28; SK 2026-11-12).\n- 패키지솔루션의 **영업이익 기여도는 2026E 21%에서 __2028E 41%__**로 커질 전망입니다(신한 2026-10-28; iM·메리츠 2026-07-28). 이익 구성이 바뀌면 밸류에이션 재평가의 계기가 될 수 있습니다.\n\n**리스크**\n- **FC-BGA는 여전히 적자이고 가동률이 50% 미만입니다**(2Q26). 후발주자라서 대면적·고다층 수율 확보나 고객 인증에 실패할 위험이 있습니다(유안타 2026-07-08; SK 2026-11-12).\n- **경쟁사의 공격적 증설:** 삼성전기(6.8조원), 이비덴, 신코 등이 증설하고 있어 2028년 이후 ABF 공급 과잉 위험이 있습니다. 장비 리드타임이 길어져 자사 증설이 늦어질 수도 있습니다(텔레그램 2026-10·11; 메리츠 2026-09-21).\n- **광학 의존도가 약 85%**여서 환율과 아이폰 수요가 전사 실적을 좌우합니다. 3Q26에는 환율 영향으로 **약 2,000억원**의 이익 차이가 났습니다(SK 2026-11-12; IBK 2026-10-28).\n- **증설 규모와 시점이 아직 정해지지 않았습니다.** 선수금 규모와 받는 시점에 따라 재무 부담이 크게 달라집니다(SK 2026-11-12)."}, {"code": "222800", "name": "심텍", "mcap": 48890.0, "px": [["2025-11-13", 53600], ["2025-11-14", 49900], ["2025-11-17", 55900], ["2025-11-18", 54700], ["2025-11-19", 55400], ["2025-11-20", 53900], ["2025-11-21", 49000], ["2025-11-24", 50100], ["2025-11-25", 52400], ["2025-11-26", 53600], ["2025-11-27", 53800], ["2025-11-28", 54200], ["2025-12-01", 52400], ["2025-12-02", 52100], ["2025-12-03", 57200], ["2025-12-04", 53500], ["2025-12-05", 57500], ["2025-12-08", 56500], ["2025-12-09", 53700], ["2025-12-10", 54900], ["2025-12-11", 54100], ["2025-12-12", 53200], ["2025-12-15", 50200], ["2025-12-16", 48900], ["2025-12-17", 52100], ["2025-12-18", 51700], ["2025-12-19", 52300], ["2025-12-22", 51400], ["2025-12-23", 50000], ["2025-12-24", 49100], ["2025-12-26", 49750], ["2025-12-29", 50800], ["2025-12-30", 49350], [" x**로 부담이 있습니다. 12M fwd 기준으로는 **PER 14.5x / POR 11.5x**로 내려가, 이익 성장이 이어진다는 전제의 가격입니다(FMP 컨센서스).\n\n#### 시가총액·주가\n| 항목 | 수치 |\n|---|---|\n| 시가총액 | **4조 8,890억원** |\n| 주가 | **124,800원** (2026-11-13) |\n| 1M | -11.5% |\n| 3M | +14.8% |\n| 6M | +24.4% |\n| YTD | **__+145.7%__** |\n| 1Y | **__+132.8%__** |\n\n→ 연초 이후 주가가 2.5배가량 올라 실적 턴어라운드를 상당 부분 반영했습니다. 최근 1개월은 3Q26 환손실과 순이익 미스 영향으로 조정을 받았습니다.\n\n#### 최근 4개 분기 실적\n| 분기 | 매출(억원) | GPM | OPM | 영업이익(억원) |\n|---|---|---|---|---|\n| 4Q25 | 3,933.6 | 9.1% | 2.6% | 102.6 |\n| 1Q26 | 4,223.7 | 10.4% | 3.2% | 137.1 |\n| 2Q26 | 5,145.6 | 18.5% | 12.2% | 628.9 |\n| 3Q26 | **5,359.3** | **26.1%** | **19.0%** | **__1,017.9__** |\n\n(출처: DART 정기보고서, 4개 분기 모두 확정치)\n\n- 3Q26 매출은 **YoY +43.7%**이지만 QoQ로는 +4.2%에 그쳤습니다. 반면 영업이익은 **QoQ +62%, YoY 약 8.2배**입니다. 외형보다 **믹스(SoCAMM·FC-CSP 증가, Tenting 감소)와 판가** 효과가 이익을 끌어올리는 국면입니다.\n- 순이익 데이터는 서로 맞지 않습니다. 트래커의 3Q26 순이익은 847.1억원인데, 증권사가 언급한 지배주주순이익은 **253억원**입니다(컨센서스 532억원, 달러 매출채권 평가손실 500억원 이상)(하나 2026-11-04). 어느 쪽이 맞는지에 따라 TTM PER이 크게 달라지므로 확인이 필요합니다.\n\n#### 수주잔고\n| 기준 | 수치 |\n|---|---|\n| 최근(2026.09) | **7,095.1억원** |\n| QoQ | **+20.4%** (2026.06 5,892.2억원 대비) |\n| YoY | **__+95.5%__** (2025.09 3,629.7억원 대비) |\n| 분기매출 대비 배수 | **1.32x** (3Q26 매출 5,359.3억원 대비) |\n\n- **추이:** 2025.06 2,674.9억원 → 2026.09 7,095.1억원으로 **5개 분기 연속 증가**했습니다(트래커).\n- **원문 기준:** DART에는 달러와 면적으로 공시됩니다. 1H26 말 잔고는 379,251㎡, **3억9,236만달러**입니다. 반기 수주총액 9억9,885만달러 중 6억649만달러를 납품했습니다(DART 2026.06).\n- **성격:** 일별 P.O 중심의 **단기 수주**입니다. 다만 월 수주액이 약 1.5억달러로 늘었고(DB 2026-11-04), 수주 가시성은 3개월에서 6개월로 길어졌습니다(iM 2026-08 NDR). 메모리 3사와 **3~4년 LTA를 협의 중**이며, 체결되면 연간 양산 물량의 약 60%가 LTA로 공급될 전망입니다(메리츠 2026-11-09).\n\n#### 기판 사업 내용\n**기판 비중은 회사 매출의 100%입니다.** 1H26 누적으로는 Package Substrate 76.0%, Module PCB 24.0%입니다(DART 2026.06). 3Q26에는 Substrate 73.4%(3,935억원), Module PCB 26.6%(1,425억원)였습니다(메리츠 2026-11-09).\n\n| 구분 | 제품군 | 단수(층수) | 사용처 | 주요 고객사 | 매출 비중 | 상태·시점 |\n|---|---|---|---|---|---|---|\n| 현재 매출 | MCP Substrate(모바일 LPDDR + SoCAMM향 MCP) | 공개 숫자 없음. SoCAMM향 MCP는 모바일 MCP보다 층수가 높음(컨콜노트 2025-11-26). 콥데이에서 \"4층→8층이면 단가가 훨씬 상승\"이라는 예시가 나왔으나 어느 제품인지는 특정하지 않음(2026-10-12) | 모바일·서버 LPDDR MCP, SoCAMM용 LPDDR5X | 삼성전자, SK하이닉스, Micron | **37.4%** (2,003억원, 이 중 SoCAMM향 160억원) | 확대 (메리츠 2026-11-09) |\n| 현재 매출 | Module PCB – SoCAMM(SoCAMM2) | 공개 숫자 없음. 서버용 DDR5 모듈보다 층수가 높아 캐파를 더 많이 씀(텔레그램 2026-08, 콥데이 2026-10-12) | 엔비디아 Vera Rubin향 AI 서버 LPDDR 모듈 | 메모리 3사(최종고객 엔비디아) | **7.6%** (407억원, 모듈 PCB 안에서 29%) | **확대. 메모리 3사 모두에서 퍼스트벤더, 고객별 점유율 50% 이상** (메리츠 2026-11-09, 신한 2026-11-04) |\n| 현재 매출 | Module PCB – 서버/PC/SSD | 공개 숫자 없음. SoCAMM 모듈보다 층수가 낮음(텔레그램 2026-08) | 서버 RDIMM, PC 모듈, SSD (시안 생산) | 삼성전자, SK하이닉스, Micron | 18.2% (서버 461억, PC 256억, SSD 258억원) | 서버는 확대, PC·SSD는 QoQ 감소 |\n| 현재 매출 | FC-CSP | 기존 양산 **최대 8층**. 슬림 FC-BGA(BT 기반, FC-CSP로 분류)는 **양산 최대 10층·30x30mm, 샘플 최대 14층·50x50mm**, 솔더 간격은 양산 120㎛·개발 90㎛(텔레그램 2026-09). [참고, 2022년] 고다층 MSAP는 4층 이상이며, 9공장 투자 후 비중 약 60% 목표(2022-01 공시) | SSD 컨트롤러, 서버 RDC, 전장(4Q25~), CXL 컨트롤러 | 메모리·전장 고객사 | **12.4%** (667억원, **__YoY +89%__**) | 확대. FC-CSP 내 전장 비중은 2026년 20%, 2027년 30% 전망 |\n| 현재 매출 | Tenting Substrate | 데이터 없음 | 저부가 메모리 패키지 | – | 11.6% (623억원, QoQ -22%) | 축소 |\n| 현재 매출 | GDDR Substrate | 데이터 없음 | 그래픽 메모리 | – | 6.1% (328억원) | 유지 또는 소폭 감소 |\n| 현재 매출 | SiP Substrate | SiP만의 숫자는 없음. [참고, 2022년] 고다층 MSAP(4층 이상) 범주에 RF-SiP·AiP 포함(2022-01 공시). AiP High Layer 개발 중(DART 2026.06, 숫자 없음) | 모바일 AP SiP, RF-SiP | ASE·Amkor 등 OSAT | 5.4% (287억원, YoY +54%) | 확대 |\n| 향후 기대 | SoCAMM 모듈 + MCP(고객 다변화) | 위 SoCAMM·MCP와 같음(DDR5·모바일 대비 고층, 숫자 미공개) | Vera Rubin 이후 AMD 등 추가 CPU, 중국·북미 메모리 업체 | 메모리 3사, 중국·북미 메모리, AMD(최종) | – | **4Q26 모듈 700억 + MCP 300억원**, 2027년 모듈 약 3,000억 + MCP 700억원 이상(회사 가이던스). iM은 2028년 7,000~8,000억원 전망 |\n| 향후 기대 | LPDDR6 기반 차세대 SoCAMM | – | 차세대 AI 서버 메모리 | 메모리 고객사 | – | 선행 개발 중(시점 미제시) |\n| 향후 기대 | CXL 컨트롤러용 FC-CSP, CXL 모듈 PCB | – | 범용 서버 메모리 확장 | 주요 고객사(설계·개발 완료) | – | 2027년 시장 개화 |\n| 향후 기대 | LPCAMM 컨트롤러 등 | – | PC·서버 저전력 모듈 | – | – | 2027년 가시화 기대(신한 2026-11-04) |\n| 향후 기대 | 시스템IC(FC-CSP·SiP) | 위 FC-CSP·SiP와 같음 | 전장, 모바일 AP, SSD, 서버 | – | 목표: 전사 매출의 **30% 이상** | 메리츠 추정 2025년 2,024억 → 2026년 3,251억 → 2027년 3,708억원 |\n\n(매출 비중은 3Q26 연결매출 대비, 메리츠 2026-11-09 NDR 후기 기준)\n\n#### 캐파\n**현재 캐파·가동률**\n| 구분 | 캐파 | 가동률 | 출처 |\n|---|---|---|---|\n| HDI(Module PCB 외) | 월 44,000㎡ | 1H26 공장 전체 평균 **80.41%** | DART 2026.06 |\n| SPS(Substrate 외) | 월 97,000㎡ | 위와 같음 | DART 2026.06 |\n| 전사 | 월 141,000㎡ | 3Q26 80% 중후반, **4Q26 88% 전망** | 키움·DB 2026-11-04 |\n| SoCAMM 모듈(청주 본사) | 월 4,600㎡. 2027년 모듈 매출 약 3,000억원 규모, 라인 조정 시 최대 4,000억원 | – | iM 2026-08-25, 메리츠 2026-11-09 |\n| MSAP | 월 45,000㎡ (매출 약 2조원 규모) | – | iM 2026-08 |\n\n**증설 계획**\n| 대상 | 추가 캐파 | 타임라인 | 투자액 |\n|---|---|---|---|\n| SoCAMM 모듈 전용 공장 + 고다층 MSAP | SoCAMM 월 4,600 → **7,000㎡**, MSAP 월 45,000 → 50,000㎡. **연 매출 캐파 약 4,500억원 증가**, 2028년부터 SoCAMM 연 5,000억원 이상(최대 6,000~7,000억원) | 2026.08.25~2027.12.31, 전용 공장 4Q27 가동 | **2,742억원**(자기자본 대비 47.6%), 이 중 전용 공장 약 1,500억원 |\n| 오창공장 증축(생산·물류·사무) | MSAP 매출 캐파 약 2조원 → 1Q28 약 2.2조원 | 2026.11.03~2028.08.31 | **1,054억원**(자기자본 대비 18.3%) |\n| LTA 체결 시 추가 증설 | 올해 공시한 약 3,700억원 외에 추가 캐파 필요하다고 언급 | LTA 체결 후 미정 | 미정(재원은 선수금과 ASP 상승에 따른 자체 현금) |\n\n(출처: 메리츠·iM 공시 코멘트 2026-08, 메리츠 2026-11-03 공시 코멘트, 메리츠 2026-11-09)\n\n#### 밸류에이션\n| 구간 | PER | POR | PSR | 기준 이익(억원) |\n|---|---|---|---|---|\n| TTM | 37.1x | 25.9x | 2.62x | 매출 18,662 / 영업이익 1,887 / 순이익 1,317 |\n| 12M fwd | **14.5x** | **11.5x** | 2.01x | 매출 24,338 / 영업이익 4,269 / 순이익 3,382 |\n| 18M fwd | **12.2x** | **9.7x** | 1.86x | 매출 26,216 / 영업이익 5,028 / 순이익 4,018 |\n\n- **가중 방식:** 12M fwd는 2026E 1.5개월 + 2027E 10.5개월, 18M fwd는 2027E 8개월 + 2028E 4개월입니다.\n- **추정치 출처:** FMP 컨센서스입니다. 영업이익은 2026E 2,465억원(7명), 2027E 4,527억원(7명), 2028E 6,030억원(4명)입니다.\n- **메리츠 추정은 컨센서스보다 높습니다** (2026-11-09). 영업이익이 2026E 2,987억원, 2027E **__5,834억원(OPM 23.5%)__**, 2028E 7,580억원입니다. 이를 적용하면 12M fwd POR은 약 **8.9x**입니다(자체 계산).\n- **주의:** TTM 순이익에는 위의 3Q26 순이익 불일치가 걸려 있어 TTM PER은 참고용으로만 봐야 합니다.\n- **피어 대비 위치:** 이 섹션 데이터에는 피어 배수가 없어 비교표를 따라야 합니다. 자체 수치만 보 09-15", 96700], ["2026-09-16", 101700], ["2026-09-17", 100700], ["2026-09-18", 103200], ["2026-09-21", 101900], ["2026-09-22", 112300], ["2026-09-23", 119400], ["2026-09-28", 123300], ["2026-09-29", 130200], ["2026-09-30", 132500], ["2026-10-01", 149400], ["2026-10-02", 147800], ["2026-10-06", 157900], ["2026-10-07", 151300], ["2026-10-08", 157700], ["2026-10-12", 146900], ["2026-10-13", 146900], ["2026-10-14", 145000], ["2026-10-15", 129500], ["2026-10-16", 131700], ["2026-10-19", 133800], ["2026-10-20", 132300], ["2026-10-21", 132000], ["2026-10-22", 127500], ["2026-10-23", 124200], ["2026-10-26", 119700], ["2026-10-27", 127700], ["2026-10-28", 138000], ["2026-10-29", 138200], ["2026-10-30", 119400], ["2026-11-02", 116500], ["2026-11-03", 101000], ["2026-11-04", 99500], ["2026-11-05", 79800], ["2026-11-06", 71200], ["2026-11-09", 75200], ["2026-11-10", 80000], ["2026-11-11", 91100], ["2026-11-12", 93400], ["2026-11-13", 93100]], "q": [{"q": "2025Q4", "rev": 3178.9, "gp": 460.6, "op": 289.5, "ni": 326.1, "src": "DART 정기보고서", "gpm": 14.489288747680016, "opm": 9.106923778665577}, {"q": "2026Q1", "rev": 3463.1, "gp": 724.0, "op": 513.0, "ni": 455.0, "src": "DART 정기보고서", "gpm": 20.906124570471544, "opm": 14.813317547861743}, {"q": "2026Q2", "rev": 4009.8, "gp": 1076.4, "op": 702.8, "ni": 1031.8, "src": "DART 정기보고서", "gpm": 26.844231632500374, "opm": 17.527058706169882}, {"q": "2026Q3", "rev": 4181.2, "gp": 1061.2, "op": 878.7, "ni": 1575.5, "src": "DART 정기보고서", "gpm": 25.38027360566345, "opm": 21.01549794317421}], "g27": 50.142160291428354, "per12": 12.791750946648907, "por12": 10.501549505267679, "sec": "### 대덕전자 (353200.KS)\n\n#### 한눈에\n- **사업 정체성:** 매출 **100%가 기판**인 회사다. PKG(BT 기판 FC-CSP·CSP, ABF 기판 FC-BGA)와 MLB(고다층 PCB)로 구성되며, 2025년 매출 기준 PKG 84.7%, MLB 15.3%다(SK증권 2026-04-30).\n- **실적 모멘텀:** 3Q26 매출 **4,181억원(+46% YoY)**, 영업이익 **879억원(OPM 21.0%)**으로 3년 만에 20%대 이익률을 회복했다(DART). 컨센서스를 13% 상회했고, 메모리기판 2차 판가 인상이 1Q27부터 반영될 예정이다(신한·메리츠 2026-11).\n- **밸류에이션 위치:** 1개월 동안 주가가 37% 하락해 12M fwd PER은 **12.8배**, 18M fwd PER은 **11.1배**다(FMP 컨센서스). 메리츠 기준 2027년 PER **9.4배**로, 대만 ABF 피어 평균 17.7배보다 약 47% 낮다(메리츠 2026-11-09).\n\n#### 시가총액·주가\n| 항목 | 수치 |\n|---|---|\n| 시가총액 | **4조 5,711억원** |\n| 주가 | **91,300원** (2026-11-13) |\n| 1M | **__-37.0%__** |\n| 3M | -23.3% |\n| 6M | -32.8% |\n| YTD | **__+90.4%__** |\n| 1Y | +84.4% |\n\n- 해석: 연간으로는 판가 인상과 ABF 재평가로 주가가 2배 가까이 올랐다. 다만 10월 말 이후 AI 설비투자 우려와 Ibiden 등 피어 멀티플 하락이 겹치면서 고점 대비 크게 조정받았다(메리츠 2026-11-09: 10/28 대비 -48%).\n\n#### 최근 4개 분기 실적\n(단위: 억원, DART 정기보고서)\n\n| 분기 | 매출 | GPM | OPM | 영업이익 |\n|---|---|---|---|---|\n| 4Q25 | 3,178.9 | 14.5% | 9.1% | 289.5 |\n| 1Q26 | 3,463.1 | 20.9% | 14.8% | 513.0 |\n| 2Q26 | 4,009.8 | 26.8% | 17.5% | 702.8 |\n| 3Q26 | **4,181.2** | 25.4% | **21.0%** | **878.7** |\n\n- 매출은 4개 분기 연속 증가했다. 3Q26 영업이익은 전년 동기 244.5억원에서 **__+259% YoY(3.6배)__** 늘었다. 3Q26 GPM은 전 분기보다 1.5%p 낮아졌는데, 원화 강세 영향이 컸다. 그런데도 OPM은 3.5%p 올랐다. 판가 인상과 비메모리 중심 믹스 개선이 효과를 냈다(신한투자증권 2026-11-02).\n- 3Q26 순이익은 1,575.5억원으로 영업이익보다 많다. 영업외 이익이 반영된 결과여서 TTM 순이익 기반 지표는 실제보다 좋게 보인다. 4Q26은 회사 가이던스가 **QoQ 감익**이며, SK증권은 영업이익을 약 800억원 초중반으로 추정한다.\n\n#### 수주잔고\n| 구분 | 수치 |\n|---|---|\n| 최근(2026.09) | **4,847억원** |\n| QoQ (vs 2026.06 3,328억원) | **__+45.6%__** |\n| YoY (vs 2025.09 3,110억원) | **+55.9%** |\n| 3Q26 분기매출 대비 | **1.16배** |\n\n- 성격: 위 수치는 트래커 기준이다. 증권사 자료에서는 별도 수주잔고 수치를 확인하지 못했다. 수주 구조는 **LTA(장기공급계약)와 고객 선수금**이다. 2026년분 LTA 선수금 협상은 끝났고 2027년분은 협상 중이다. 회사는 공급 부족을 바탕으로 LTA를 선별적으로 체결하고 있다(메리츠 NDR 2026-11-09).\n- 선수금이 들어오면서 비유동부채가 **__전년 대비 +674%__** 늘었다(교보증권 2026-11-02). 잔고가 분기매출의 약 1.2배 수준이라 장기 확정 물량이라기보다 단기 회전 성격이 강하다.\n\n#### 기판 사업 내용\n- **기판 비중 100%**(기판 외 사업 없음). 2025년 PKG 9,019억원(84.7%), MLB 1,630억원(15.3%)이고, 1Q26은 PKG 84%, MLB 16%다(SK증권 2026-04-30). 3Q26 MLB 매출은 718억원으로 전사의 약 17%다(신한투자증권 2026-11-02).\n\n| 구분 | 제품군 | 단수(층수) | 사용처 | 주요 고객사 | 매출 비중 | 상태·시점 |\n|---|---|---|---|---|---|---|\n| 현재 매출 | FC-CSP (BT) | **8L 이상**(DART 연구개발 '8L+ PKG용 FCCSP', 2020~2025년 보고서 반복 기재. 사업보고서 2024-03-20 등) | SSD 컨트롤러(FC-CSP 내 약 50%), 모바일 AP, 메모리 | 주요 메모리 고객사 | **38%**(1Q26 전사 대비, PKG 대비 45%) | 확대: 준쇼티지·풀캐파, 판가 인상(SK증권 2026-04-30) |\n| 현재 매출 | CSP (BT, DDR5·LPDDR·GDDR) | 데이터 없음 | DRAM 메모리 패키지 | 주요 메모리 고객사 | **21%**(1Q26, PKG 대비 25%) | 확대: 2026년 4월 1차 판가 인상, **2차 인상 1Q27 반영 예정**(메리츠 2026-11-09) |\n| 현재 매출 | FC-BGA (ABF) | 개발 스펙 **20층 이상**·100x100mm 이상·미세회로 10μm 이하(SK증권 2026-04-30). 개발 과제 **26L**(120x150mm, 2.7mmT)(DART 반기보고서 2026-08-13). 네트워크 스위치용 Large Body는 **10층대 1종(2026년 6월 양산)**, **20층 1종(4Q26 양산)**(컨콜노트 2026-06-16). 9월 말 양산한 다른 네트워크 고객용 Large Body는 '면적·층수 확대'로만 나오고 층수는 미공개(메리츠 2026-09-01). 참고: 2022년 Amkor 서버용 공동개발 시 20층 이상 역량 확보(2022년 기사, 현재 제품 스펙 아님) | 전장·자율주행, 광모듈, 네트워크 스위치(FC-BGA 내 전장+광모듈 약 75%) | 북미 EV 업체(대신증권 2026-11-02), 네트워크 스위치 고객 | **23%**(1Q26, PKG 대비 27%) | 확대: 실질 풀가동, Large Body로 믹스 전환, AI 네트워크용 수율 약 70%(메리츠 2026-11-09) |\n| 현재 매출 | MLB (고다층 PCB) | **AI 가속기 20~30층**, **방산 10~30층**(컨콜노트 2026-06-16). AI 가속기 Compute Board는 **40층 근접**(메리츠 2026-09-01). 우주항공은 층수 미공개 | 네트워크, 방산, 우주항공, AI 가속기 | 주요 AI 가속기 고객사(메리츠 2026-09-01), 우주항공 신규 고객 | **17%**(3Q26, 718억원) | 확대: 가동률 약 90%, 3Q26 QoQ 네트워크 +16%·항공우주 +36%·방산 +24%(신한 2026-11-02) |\n| 현재 매출 | 기타 (SiP) | **10~12L**(DART '고다층 복합사양 SiP', 사업보고서 2024-03-20) | SiP | – | 1.4%(1Q26) | 축소/정체 |\n| 향후 기대 | FC-BGA Large Body (Physical AI) | **20층**(컨콜노트 2026-06-16) | Physical AI(전장) | 북미 EV 업체로 확대(메리츠 2026-09-01) | – | 4Q26 양산 예정(2026-06 컨콜), **1H27 본격 양산**(메리츠 2026-11-09) |\n| 향후 기대 | FC-BGA Large Body (AI 가속기·LPU·CXL 3개 제품) | 데이터 없음 | AI 가속기, 추론용 LPU(Groq 제외), CXL 가속기 | 미공개 | – | **2027년 말 양산 진입**(메리츠·미래에셋 2026-11) |\n| 향후 기대 | FC-BGA 서버용 신규 물량 | 데이터 없음 | 데이터센터 서버 | 미공개 | – | 2027년부터 본격 기여(다올 2026-11-02) |\n| 향후 기대 | MLB 우주항공 신제품 | 미공개 | 우주항공·위성통신 | 신규 우주항공 고객사 | – | 4Q26 말 양산 시작(메리츠 2026-11-09) |\n| 향후 기대 | 메모리 PKG(LPDDR·GDDR·DDR5) 2차 판가 인상 | – | AI 데이터센터용 DRAM·NAND | 주요 메모리 고객사 | 현 추정치 미반영. 10% 인상 시 2027년 영업이익 약 +250억원(iM증권) | 1Q27부터 반영 |\n| 향후 기대 | 초박판 PKG (Coreless/Thin sub/ETS) | **2L ETS**, **3L Coreless**(75→70μm), **4L Thin sub**(105μm)(DART 반기보고서 2026-08-13, 사업보고서 2026-03-18) | 적용 제품군 미기재 | – | – | 개발·양산화 진행(DART 연구개발) |\n\n#### 캐파\n**현재 캐파·가동률** (모두 매출 기준)\n\n| 대상 | 현재 캐파 | 가동률 |\n|---|---|---|\n| FC-CSP/BT | 연 약 **9,500억원**(10월 메리츠 자료는 약 9,000억원) | **풀캐파**(메리츠 2026-11-09, SK 2026-11-02) |\n| ABF (FC-BGA) | 연 약 **4,500억원** | 매출 기준 80% 중반. Large Body 잠식을 감안하면 **3Q26부터 실질 풀가동** |\n| MLB | 연 3,000억원(분기 750억원), 1H26 증설 완료 | 3Q26 약 90% |\n| 전사 | 약 **1.6조원**(유안타 2026-10-08) | 3Q26 매출 단순 연환산 약 1.67조원으로 캐파 상단 |\n\n**증설 계획**\n\n| 대상 | 추가 캐파(매출 기준) | 타임라인 | 투자액 |\n|---|---|---|---|\n| FC-CSP/BT | 9,500억 → 1.2조(1차) → **1.4조원**(2차) | 1차 2027년 하반기, 2차 2028년(하반기 완료) | 약 7,000억원 |\n| ABF (Large Body 중심) | 4,500억 → 6,500억 → **__9,800억원(2.2배)__** | 2027년 중 1차 반영, 2028년 9,800억원 | 약 7,000억원 |\n| MLB | 3,000억 → 3,500~3,600억원 | 1Q27까지 | 노후 설비 교체 등 소규모 |\n| 전사(1·2차 합산) | 1.6조 → **2.2조원**(2027년 하반기) → **__2.7조원__**(2028년 상반기) | 2차 신규시설투자 기간 2026-10-22~2030-12-31 | 2차 공시 **6,150억원**(자기자본 대비 68.54%, 2026-10-22). 1·2차 합계 **약 1.4조원**. 재원은 현금 약 2,000억원, 고객 선수금, 차입 |\n\n- 회사가 제시한 2028년 매출 목표는 **2.5조원**이다(SK증권 2026-11-02). 창사 이래 최대 규모의 증설이다.\n\n#### 밸류에이션\n| 구분 | 매출 | 영업이익 | 순이익 | PER | POR | PSR |\n|---|---|---|---|---|---|---|\n| TTM (4Q25~3Q26) | 14,833 | 2,384 | 3,388 | 13.5배 | 19.2배 | 3.08배 |\n| 12M fwd | 19,635 | 4,353 | 3,573 | **12.8배** | **10.5배** | 2.33배 |\n| 18M fwd | 21,829 | 5,036 | 4,136 | **11.1배** | **9.1배** | 2.09배 |\n\n(단위: 억원. 12M fwd = 2026E 1.5개월 + 2027E 10.5개월, 18M fwd = 2027E 8개월 + 2028E 4개월 가중)\n\n- 추정치 출처는 **FMP 컨센서스**다. 2026E 매출 15,933억원·영업이익 2,970억원(11명), 2027E 20,163억원·4,550억원(12명), 2028E 25,160억원·6,008억원(6명).\n- 증권사 추정치와 비교하면 다음과 같다.\n  - 2026E·2027E: 하나증권(2026-11-01)은 2026E 매출 15,977억원·영업이익 3,008억원, 2027E 20,337억원·**4,848억원**으로 FMP와 비슷하다.\n  - 2028E: 유안타(2026-10-08)는 23,110억원·4,950억원으로 FMP보다 낮다. FMP 2028E는 추정 인원이 6명으로 적고, 매출이 회사 목표(2.5조원) 수준이다.\n- TTM PER은 3Q26 영업외 이익 때문에 낮게 나온다. 이익 체력은 **POR 기준 TTM 19.2배 → 12M fwd 10.5배**로 보는 것이 맞다.\n- 피어 대비: 메리츠 기준 2027년 PER **9.4배**로, 대만 ABF 피어 평균 17.7배 대비 **약 47% 할인** 거래 중이다(메리츠 2026-11-09).\n\n#### 투자 포인트·리스크\n**투자 포인트**\n- **판가 인상 사이클**\n  - BT·CSP가 풀캐파인 상태에서 2026년 4월 두 자릿수 인상에 이어 **2차 인상이 1Q27부터 반영**된다. 현 추정치에는 반영되지 않았다(메리츠 2026-11-09).\n  - 10% 인상 시 2027년 영업이익이 약 +250억원 늘어난다(iM증권).\n- **창사 최대 증설 1.4조원:** ABF 캐파가 2.2배, 전사 캐파가 1.6조원에서 2.7조원으로 늘어난다(2028년 상반기). 고객 선수금과 LTA가 투자 재원과 물량을 함께 뒷받침한다.\n- **ABF Large Body 진입**\n  - 네트워크 스위치 2개 모델이 양산 중이다.\n  - Physical AI(1H27)와 AI 가속기·LPU·CXL 3개 제품(2027년 말)이 추가돼 전장 중심에서 AI 인프라로 믹스가 넓어진다.\n- **MLB 고부가 전환:** 3Q26 매출 718억원으로 추정치 615억원을 웃돌았다. 40층에 가까운 AI Compute Board와 우주항공 신규 고객이 성장 요인이다.\n- **밸류에이션:** 1개월 -37% 조정 후 12M fwd PER 12.8배, POR 10.5배다.\n\n**리스크**\n- **AI 설비투자 지속성:** 데이터센터 규제나 투자 집행 지연 우려가 있고, Ibiden 급락 등 피어 멀티플 하락이 함께 영향을 줄 수 있다.\n- **원화 강세:** 4Q26은 회사 가이던스상 **QoQ 감익**이다(SK증권 4Q26 영업이익 약 800억원 초중반 추정). 3Q26에도 GPM이 1.5%p 하락했다.\n- **소재 수급 차질 가능성:** CCL·유리섬유·동박 등 기판 소재가 대상이다(SK증권).\n- **대규모 증설 부담**\n  - 자기자본의 약 69%에 해당하는 2차 투자를 차입과 선수금으로 조달한다.\n  - 2020~23년 FC-BGA 투자 직후 다운사이클을 겪은 전례가 있다.\n  - 유상증자 루머는 회사가 부인했다.\n- **수주잔고 해석 한계:** 트래커 수치 외에 공식 잔고가 확인되지 않는다. 2027년분 LTA는 아직 협상 중이다."}, {"code": "007810", "name": "코리아써키트", "mcap": 21824.0, "px": [["2025-11-13", 29250], ["2025-11-14", 26600], ["2025-11-17", 32150], ["2025-11-18", 30900], ["2025-11-19", 31450], ["2025-11-20", 30150], ["2025-11-21", 28200], ["2025-11-24", 28350], ["2025-11-25", 30300], ["2025-11-26", 30750], ["2025-11-27", 31950], ["2025-11-28", 31250], ["2025-12-01", 36150], ["2025-12-02", 34100], ["2025-12-03", 37200], ["2025-12-04", 35100], ["2025-12-05", 39000], ["2025-12-08", 39200], ["2025-12-09", 39400], ["2025-12-10", 39900], ["2025-12-11", 38850], ["2025-12-12", 37250], ["2025-12-15", 36000], ["2025-12-16", 33900], ["2025-12-17", 35900], ["2025-12-18", 35700], ["2025-12-19", 35100], ["2025-12-22", 38400], ["2025-12-23", 37400], ["2025-12-24", 37450], ["2025-12-26", 40100], ["2025-12-29", 43650], ["2025-12-30", 48300], ["2026-01-02", 47750], ["2026-01-05", 47350], ["2026-01-06", 46100], ["2026-01- 니다. 다만 2027E 영업이익 추정치가 출처마다 크게 달라(FMP 1,933억원, 대신 1,470억원) fwd 배수의 신뢰도는 낮습니다.\n\n#### 시가총액·주가\n| 항목 | 수치 |\n|---|---|\n| 시가총액 | **2조 1,824억원** (2026-11-13) |\n| 주가 | **90,200원** (2026-11-13) |\n| 1M | +19.0% |\n| 3M | **+42.9%** |\n| 6M | -0.9% |\n| YTD | **+88.9%** |\n| 1Y | **__+208.4%__** |\n\n- **해석:** 1년간 3배 넘게 재평가됐습니다. 연중 조정으로 6M 수익률은 보합권이었고, 최근 3개월 동안 SoCAMM2·판가 인상 기대가 반영되며 반등한 흐름입니다.\n\n#### 최근 4개 분기 실적\n| 분기 | 매출(억원) | GPM | OPM | 영업이익(억원) |\n|---|---|---|---|---|\n| 4Q25 | 4,481.4 | 10.9% | 8.0% | 360.6 |\n| 1Q26 | 4,199.0 | 9.1% | 6.3% | 264.4 |\n| 2Q26 | 4,071.8 | 7.4% | 4.7% | 192.9 |\n| 3Q26 | **4,560.6** | 7.0% | **3.3%** | **148.9** |\n\n(출처: 4개 분기 모두 DART 정기보고서 확정치)\n- **추이 1:** 3Q26 매출은 QoQ +12.0%, YoY +21.4%로 늘었습니다. 반면 영업이익은 QoQ **-22.8%**로 4개 분기 연속 감소했습니다. 2Q26에는 인터플렉스 적자(영업손실 52억원)가, 3Q26에는 Display 재고평가충당금(일회성)이 수익성을 낮췄습니다(메리츠 2026-09-03).\n- **추이 2:** 2Q26·3Q26 순이익(477.6억원·421.5억원)은 영업이익의 2~3배입니다. 영업외 요인이 크다는 뜻이므로, 이익 체력은 순이익보다 영업이익으로 판단해야 합니다.\n\n#### 수주잔고\n| 시점 | 잔고(억원) |\n|---|---|\n| 2025.06 | 1,599.7 |\n| 2025.09 | 1,149.4 |\n| 2025.12 | 1,991.5 |\n| 2026.03 | 1,572.5 |\n| 2026.06 | 4,266.4 |\n| **2026.09** | **9,076.7** |\n\n- **최근(3Q26):** **9,076.7억원**, **__QoQ +112.7%, YoY +689.7%__**. 분기 매출 대비 **약 2.0배**(3Q26 매출 4,560.6억원 기준)로, 2Q26 약 1.05배에서 높아졌습니다(수주잔고 트래커).\n- **성격:** 증가를 이끈 것은 SoCAMM 등 ASP가 높은 제품입니다. 1H26 PCB ASP는 2025년 평균 대비 내수 +19.5%, 수출 +23.8%입니다. 과거 잔고가 분기 매출 0.3~0.5배 수준이었던 만큼 회전이 짧은 구조였습니다(글로벌 테크 밸류체인 2026-11-13).\n- **출처 간 불일치:** 글로벌 테크 밸류체인(2026-11-13)은 '3Q26 4,266억원, QoQ +171%, YoY +167%'로 적었습니다. 그런데 이 수치는 트래커의 2026.06 값, 그리고 2026.03·2025.06 대비 증가율과 일치합니다. **한 분기 밀려 표기됐을 가능성**이 있습니다. 메리츠(2026-08-14)의 2Q26 수치 4,167억원도 트래커와 약 100억원 차이가 납니다. 잔고 집계 범위(연결·별도·PCB 한정 여부)는 확인하지 못했습니다.\n\n#### 기판 사업 내용\n- **기판 비중:** 1H26 연결 매출 8,271억원 중 **PCB 부문이 7,637억원(92.3%)**입니다(딜사이트 2026-09-22). 여기에는 인터플렉스 FPCB가 포함되고, 나머지는 OSAT 자회사 시그네틱스 등입니다. 반도체 패키지(PKG)만 보면 **1Q26 별도 매출의 40.0%**(1,016억원/2,537억원)입니다(현대차증권 2026-05-29).\n\n| 구분 | 제품군 | 단수(층수) , 영업이익 **165.9억원(__+91.8% YoY__)**, OPM **17.7%**로 6개 분기 연속 최대 매출입니다. 회사는 4Q26 매출 **약 1,200억원·OPM 20% 전후**를 제시했습니다(DART 3Q26; 콥데이 2026-11-11).\n- **밸류에이션 위치:** TTM POR **21.3배**가 12M fwd **9.0배**, 18M fwd **8.4배**로 낮아집니다. 이익 성장이 이어진다는 전제에서 fwd 배수가 크게 낮아지는 구조입니다.\n\n#### 시가총액·주가\n| 시가총액 | 주가 | 1M | 3M | 6M | YTD | 1Y |\n|---|---|---|---|---|---|---|\n| **10,357억원** | 43,450원 | -4.6% | **+38.4%** | -8.6% | **__+56.3%__** | +26.4% |\n\n(종가 기준일 2026-11-13)\n\n- **해석:** YTD +56%로 크게 올랐습니다. 다만 6M이 -8.6%라 중간에 큰 조정이 있었고, 3M +38%로 다시 반등한 뒤 최근 1M은 숨 고르기 구간입니다.\n\n#### 최근 4개 분기 실적\n| 분기 | 매출(억원) | GPM | OPM | 영업이익(억원) |\n|---|---|---|---|---|\n| 4Q25 | 725.7 | 16.4% | 11.8% | 85.8 |\n| 1Q26 | 758.3 | 18.7% | 14.1% | 107.2 |\n| 2Q26 | 882.4 | 19.5% | 14.5% | 127.7 |\n| 3Q26 | **939.7** | **22.0%** | **17.7%** | **165.9** |\n\n(전 분기 DART 정기보고서 확정치)\n\n- 매출은 4개 분기 연속 늘었고(3Q26 +6.5% QoQ), GPM은 16.4%에서 **__22.0%로 5.6%p 상승__**했습니다. 3Q26 영업이익은 **+29.9% QoQ**로 매출 증가율보다 훨씬 가파릅니다. 판가 인상(3Q26 ASP QoQ +10% 이상)과 SOCAMM·24층 eSSD 같은 고부가 제품 비중(65%) 상승이 함께 작용한 결과입니다(콥데이 2026-11-11).\n- 원화 강세로 3Q26 매출이 약 100억원 줄었는데도 마진이 올랐습니다. 4Q26 가이던스(OPM 20% 전후)를 감안하면 마진 상승 추세가 이어질 가능성이 큽니다. 한편 3Q26 순이익 310.7억원은 영업이익을 크게 웃돌아 영업외 요인이 포함된 것으로 보입니다(DART).\n\n#### 수주잔고\n| 시점 | 수주잔고(억원) |\n|---|---|\n| 2025.06 | 442 |\n| 2025.09 | 445 |\n| 2025.12 | 526 |\n| 2026.03 | 539 |\n| 2026.06 | 1,318 |\n| **2026.09** | **2,735** |\n\n- **최근(3Q26):** **2,735억원**, QoQ **__+107.5%__**, YoY **__+514.6%__**. 3Q26 분기 매출 대비 **약 2.9배**입니다(정기보고서 기반 트래커).\n- **성격:** 고객사가 약 3개월 단위로 확정한 수주라 단기 가시성이 높습니다. 다만 최근 급증에는 수요 증가 외에 **SOCAMM의 긴 리드타임(재공품 누적)**도 반영돼 있어, 잔고 배수를 그대로 매출로 환산하기는 어렵습니다(IR 노트 2026-07-20; 키움 2026-11-12). 오픈IR 메모에 있는 '2027년 2분기 1,818억원' 표기는 시점 오류로 보여 반영하지 않았습니다(오픈IR 2026-10-08).\n\n#### 기판 사업 내용\n- **기판(PCB) 매출 비중: 사실상 약 100%**입니다. 구성은 메모리 모듈 PCB 63%(SOCAMM 포함), SSD PCB 33%, 기타 약 4%이며, 패키지기판 매출은 **없습니다**(3Q26 기준, 콥데이 정리본 2026-11-11). DART 원문으로는 확인하지 못했습니다.\n\n| 구분 | 제품군 | 단수(층수) | 사용처 | 주요 고객사 | 매출 비중 | 상태·시점 |\n|---|---|---|---|---|---|---|\n| 현재 매출 | 메모리 모듈 PCB(서버 RDIMM 중심, SOCAMM 제외) | RDIMM **12~16층**, 고사양품 **16층 BVH(3회 적층)**. RDIMM 6400/7200에 12~16층 필요(증권사 리포트 2026-09-09). DDR5 **8800까지 생산** 중(콥데이 2026-11-11) | 서버 DDR5 RDIMM(6400~8800), 일부 PC·노트북 SODIMM/UDIMM. 서버향 80~90% | SK하이닉스, 마이크론, 삼성전자 | **약 42%**(추정: 63%−SOCAMM 21%) | 확대: BVH 전환, 판가 인상(IR 노트 2026-07-20; 콥데이 2026-11-11) |\n| 현재 매출 | SOCAMM(SOCAMM2) 기판 | **16층, HDI·Mass Lam 공법 5회 적층**(IR 노트 2026-07-20; 콥데이 2026-11-11). SOCAMM3는 층수 증가·HDI 확대 전망이나 구체 층수는 미언급(2026-06) | NVIDIA Vera Rubin용 LPDDR5X 서버 모듈(최종 수요처 NVIDIA 100%) | SK하이닉스 약 70%(SK하이닉스 내 점유율 40%대), 마이크론 약 30%(점유율 20% 수준) | **약 21%**(약 200억원/940억원). 교보는 '20% 상회'(2026-11-09) | 확대: 1Q26 30억원 → 2Q26 100억원 미만 → 3Q26 **약 200억원** → 4Q26 약 300억원 목표. 2026년 600~700억원(콥데이 2026-11-11; 오픈IR 2026-10-08) |\n| 현재 매출 | MRDIMM PCB | **16층**, BVH 기판 2장을 추가 라미네이션으로 합치는 구조(메리츠 2026-09). **5회 적층**(오픈IR 2026-10-08) | 서버용 고속 DDR5 과도기 제품(최대 12,800Mbps) | SK하이닉스, 마이크론 | 분기 100억원 미만, 2026년 약 100억원 내외 | 양산 중. 2027년은 현 수준 유지 예상(콥데이 2026-11-11) |\n| 현재 매출 | SSD PCB(eSSD/EDSFF 중심) | **20~24층**. Vera Rubin 스토리지용은 **24층 BVH(3회 적층)**. 16층→20→24층으로 고다층화(2025-11 리포트). 기존 SSD 18~20층 대비 Vera Rubin용 24층(2026-06 리포트) | 서버 eSSD(E1.S/E3.S), 일반 SSD. SSD 매출 중 eSSD 약 80% | 삼성전자(PM1773 단독 공급) | **33%** | 확대: 24층 eSSD는 2Q26부터 매출 인식. ASP는 DDR5 6400/7200 BVH의 약 1.5배(IR 노트 2026-07-20; 콥데이 2026-11-11) |\n| 현재 매출 | 항공우주·방산용 초고다층 PCB | **최대 약 100층** | 미사일·항공우주 장비. 개당 수천만원 수준 | 이스라엘 업체 | 낮음 | 품질 심사 완료 후 소량 공급(IR 노트 2026-07-20) |\n| 향후 기대 | SOCAMM 확대(삼성전자 신규 진입 포함) | 16층·5회 적층(현행 기준) | AI 서버 LPDDR5X 모듈. JEDEC 표준화 시 AMD 등으로 확산 가능 | SK하이닉스, 마이크론, 삼성전자(개발 샘플 납품 중) | 2027년 목표 **약 1,500억원**(시장 5,000~6,000억원 중 점유율 30%). 메리츠 1,510억원(비중 약 30%), 키움 26%, IBK 약 28% | 2027년(콥데이 2026-11-11; 메리츠 2026-11-06; 키움·IBK 2026-11-12) |\n| 향후 기대 | LPCAMM PCB | **12층, 3회 적층** | 노트북 SODIMM 대체 CAMM 모듈. ASP는 고사양 RDIMM 수준 | – | – | 전환 과도기. 1Q26 일부 매출 이후 매출이 꾸준하지 않음(IR 노트 2026-07-20; 오픈IR 2026-10-08) |\n| 향후 기대 | CXL 모듈 PCB | 샘플 **16~18층**, 차세대 **  패키지기판은 **__BEP를 넘어 흑자전환__**했다(흥국 2026-11-04).\n- **밸류에이션 위치**: TTM PER **13.9배**에서 12M fwd **6.8배**로 낮아진다. 실적은 좋아지는데 주가는 6M **__-48.1%__** 떨어져, 컨센서스 이익이 맞다면 저평가 구간이다.\n\n#### 시가총액·주가\n| 항목 | 수치 |\n|---|---|\n| 시가총액 | **7,803억원** |\n| 주가 | **45,450원** (2026-11-13) |\n| 1M | -21.0% |\n| 3M | -22.8% |\n| 6M | **__-48.1%__** |\n| YTD | -17.1% |\n| 1Y | -17.5% |\n\n- 해석: 분기 이익은 사상 최대 수준이다. 그런데도 리드프레임 4Q 재고조정 우려, 목표주가 하향, 환율 부담(3Q26 외화환산손실 100억원 이상)이 겹쳐 6개월 만에 주가가 절반 가까이 빠졌다.\n\n#### 최근 4개 분기 실적\n| 분기 | 매출(억원) | GPM | OPM | 영업이익(억원) | 출처 |\n|---|---|---|---|---|---|\n| 4Q25 | 1,799.5 | 19.6% | 12.1% | 218.0 | DART |\n| 1Q26 | 1,886.5 | 12.4% | 5.8% | 109.8 | DART |\n| 2Q26 | 2,110.9 | 18.4% | 11.8% | 248.7 | DART |\n| 3Q26 | **2,453.0** | –(잠정) | **13.8%** | **338.0** | 네이버(잠정) |\n\n- 매출은 4개 분기 연속 늘었다. 3Q26은 QoQ **+16.2%**, 영업이익은 QoQ **+35.9%**다. 1Q26에 OPM이 5.8%로 잠시 꺾였다가 2~3Q에 두 자릿수로 회복해 최고치를 경신했다.\n- 리드프레임 판가 인상과 최대 가동에 패키지기판 흑자전환이 더해져 영업레버리지가 커지고 있다. 다만 매출의 95% 이상이 달러여서 분기 마진이 환율에 따라 크게 흔들린다.\n\n#### 수주잔고\n- **수주잔고 공시나 트래커 수치는 없다**(트래커 대상은 대덕전자·심텍·티엘비·코리아써키트뿐). 최근·QoQ·YoY·매출 대비 배수는 **해당 없음**.\n- 수주 성격의 정성 정보는 다음과 같다.\n  - 2026년 4월 원재료 가격을 반영한 일괄 판가 인상이 있었다. 26년 말~27년 초에는 LPDDR·GDDR 등 고부가 메모리 기판의 추가 인상이 예상된다(메리츠 2026-10-08).\n  - 메모리 IDM들이 물량을 선점하려 하고 있어 **장기공급계약(LTA) 가능성**이 거론된다(메리츠 2026-10-08).\n  - 경쟁사들이 범용 캐파를 줄이고 있어 점유율 확대가 기대된다(키움 2026-11-03).\n\n#### 기판 사업 내용\n- **기판 비중**: 3Q26 매출 2,453억원 중 **패키지기판 약 590억원(약 24%)**, **리드프레임 약 1,900억원(약 77%, YoY +41.1%)**이다. 두 사업 모두 반도체 기판이라 **사실상 100%**다(흥국 2026-11-04·유진 2026-11-09). 패키지기판 매출 중 **DDR5 비중은 50% 이상**이다(키움 2026-11-03).\n\n| 구분 | 제품군 | 단수(층수) | 사용처 | 주요 고객사 | 매출 비중 | 상태·시점 |\n|---|---|---|---|---|---|---|\n| 현재 매출 | 메모리 패키지기판 DDR5 (D1b Prime·D1c) | 단층·저다층. 릴투릴 적층 한계인 **1~4층** 안에서 생산하며, **DDR5 정확한 층수는 자료 없음**. 회사는 \"릴투릴은 쌓기가 안 돼 최대 4 Layers\"라고 설명(2024-02 컨콜, 참고). D1b Prime 층수 언급 없음 | DRAM 모듈·패키지, AI 데이터센터 서버 DRAM | 국내 IDM(D1b 온양·쑤저우, D1c 하이닉스향 **약 1/3 점유, 2026-09 기준**), 삼성 PC/서버 DDR5 점유율 70~80%(2024-02 컨콜, 참고), CXMT(1Q26 퀄 통과·2Q26 초도 공급) | 패키지기판 내 **50% 이상** (키움 2026-11-03) | **확대**. D1c는 2026-08 초도 양산, 9월부터 물량 확대(2026-10-06 컨콜) |\n| 현재 매출 | 메모리 패키지기판 DDR4·레거시(D1a 이전) | PC·서버 DRAM용 **1L·2L BGA**(2016 NH 리포트, 참고). D1a도 릴투릴 최대 4층 범위에서 대응 가능했으나 설계 변경을 못 따라가 벤더에서 탈락(2024-12 컨콜, 참고) | 범용 DRAM | 국내 IDM | 50% 미만 추정(근거 수치 없음) | **축소**(D1a 부진, 2026-09-01 메모) |\n| 현재 매출(2025-09 기준) | 그래픽 DRAM 패키지기판 GDDR6 | **4층**. \"GDDR6부터는 4층짜리라 수율이 급격히 떨어짐\" | 그래픽 DRAM | 삼성 | 2024년 매출 약 50억원, 기판 매출의 약 3% | 적자 제품. **GDDR7은 양산하지 않기로 결정**(2025-09-24 컨콜) |\n| 과거 개발(참고) | 3Layer BGA (모바일 DRAM·SSD용 다층 BGA) | **3층** | 모바일 DRAM·SSD | – | – | 2016~17년 개발, 다층 BGA 설비에 약 500억원 투자(2019 사업보고서·2016 NH, 참고) |\n| 과거 개발(참고) | 모바일용 다층 BGA | 다층(층수 자료 없음) | 모바일 | – | – | 2022년 개발 과제, \"신규소재 승인 및 다층제품 다원화\"(2024 사업보고서) |\n| 현재 매출(참고) | 리드프레임(금속 기판) | 해당 없음(에칭·스탬핑) | 전장 약 62%, IT·AI 데이터센터 전력·기타 약 38%(2Q26) | 차량용 반도체 업체 | 회사 매출의 **약 77%** | 최대 가동, 판가 인상, 저수익 IT 제품 일부 외주(신한 2026-08-11, 유진 2026-11-09) |\n| 향후 기대 | Panel 공법 고다층 패키지기판 (DDR6·LPDDR 등) | 릴투릴 한계인 **4층 초과** 고다층(구체적 층수 자료 없음). 회사는 \"4층 이상은 LPDDR·GDDR 영역이라 현재는 잘 못 함\"이라고 설명(2024-02 컨콜) | 차세대 DRAM(DDR6)·LPDDR | 메모리 IDM(미공개) | 연 **2,000~3,000억원** 신규 캐파(2029년) | 2027~28년 투자 집행, **2H29 본격 양산**. 신규 제조동의 빈 3개 층에 패널 장비 도입(2026-10-06 컨콜, 유안타·메리츠 2026-10-08) |\n| 향후 기대 | CXMT향 DDR5 패키지기판 | 단층·저다층(릴투릴) | 중국 DRAM | CXMT | – | 2Q26 초도 공급, **2027년 본격 확대**(전자신문 2026-07-19, 교보 2026-11-02) |\n| 향후 기대(인접) | 히트슬러그 | 해당 없음(방열 부품) | 북미 팹리스 AI 칩 | 북미 주요 팹리스 | – | 2026-05말 퀄 진입, 연내 양산, 2027년부터 기여(유안타 2026-08-11, 삼성 2026-09-17) |\n\n#### 캐파\n**현재 캐파·가동률**\n| 대상 | 캐파 | 가동률 | 출처 |\n|---|---|---|---|\n| 패키지기판(릴투릴, 창원) | 매출 환산 **약 3,000억원/년** | 2Q26 약 60% → 3Q26 60% 중반(BEP) → **4Q26 70% 이상 예상** | 유안타 2026-10-08, 2026-09-01 메모 |\n| 리드프레임(창원 신공장 3개 층) | 자료 없음 | **최대 가동**. 상반기에는 3개 층 중 1개 층만 가동, 3Q부터 라인 증가 | 2026-09-01 메모, 키움 2026-11-03 |\n\n**증설 계획**\n| 대상 | 추가 캐파 | 타임라인 | 투자액 | 출처 |\n|---|---|---|---|---|\n| 패키지기판 Panel 공법 라인(DDR6 등) | 연 2,000~3,000억원. 패키지기판 캐파 **__3,000억원 → 5,000~6,000억원__** | 투자기간 2026-09-18~2030-12-31, 주로 2027~28년 집행, 2H29 양산 | **1,900억원**(자기자본 대비 33.67%), 내부 현금 위주에 차입 300~400억원 | DART 2026-09-18, 유안타·메리츠 2026-10-08, 삼성 2026-11-02 |\n| 안산 반월공단 토지·건물(계양전기) | Panel 라인 부지 | 취득 예정일 2026-11-11 | **680억원**(자산 대비 7.72%) | DART 2026-09-18 |\n\n#### 밸류에이션\n| 기준 | 매출(억원) | 영업이익(억원) | 순이익(억원) | PER | POR | PSR |\n|---|---|---|---|---|---|---|\n| TTM(4Q25~3Q26) | 8,249.9 | 914.5 | – | **13.9배** | 8.5배 | 0.95배 |\n| 12M fwd | 10,346 | 1,488 | 1,145 | **6.8배** | 5.2배 | 0.75배 |\n| 18M fwd | 10,975 | 1,640 | 1,266 | **6.2배** | 4.8배 | 0.71배 |\n\n- 가중 방식: 12M fwd는 2026E 1.5개월 + 2027E 10.5개월, 18M fwd는 2027E 8개월 + 2028E 4개월이다.\n- 추정치 출처: FMP 컨센서스. 2026E 매출 8,883억원·영업이익 1,005억원(6명), 2027E 10,555억원·1,557억원(11명), 2028E 11,815억원·1,807억원(5명).\n- 증권사 추정치 참고: 교보 2026-11-02는 2026E 매출 8,906억원·영업이익 1,054억원(YoY **__+127%__**), 유안타 2026-10-08은 2027E 매출 1.04조원·영업이익 1,510억원.\n- 컨센서스 2026E 영업이익에서 3Q 누적 696.5억원을 빼면 4Q26 영업이익은 약 308억원이다. 3Q보다 다소 낮은 수준을 반영하고 있다.\n- 피어 대비 위치: 피어 수치는 7사 비교표를 참조. 이 회사만 보면 TTM에서 fwd로 갈 때 PER이 **13.9배 → 6.8배로 절반 이하**가 된다. 컨센서스가 이익 성장을 크게 반영하고 있다는 뜻이고, PSR은 1배 미만이다.\n\n#### 투자 포인트·리스크\n**투자 포인트**\n- **패키지기판 흑자전환**: 3Q26 매출 약 590억원으로 가동률 60% 중반에서 BEP를 넘었고, 4Q26에는 70% 이상이 예상된다. 고정비 비중이 커서 매출이 늘면 이익이 크게 늘어나는 구조다(흥국 2026-11-04, 유안타 2026-10-08).\n- **DDR5 비중 50% 이상**: D1c(하이닉스향 2026-08 양산)와 CXMT 신규 고객이 2027년 물량 확대를 이끈다(키움 2026-11-03, 교보 2026-11-02).\n- **리드프레임 분기 최대**: 3Q26 약 1,900억원(YoY +41%)이고, 2Q26 OPM은 18~19%다. 전장과 AI 데이터센터 전력용 수요에 판가 인상 효과가 더해졌다(유진 2026-11-09, 신한 2026-08-11).\n- **판가 인상·LTA 가능성**: 고부가 메모리 기판의 추가 인상과 IDM의 물량 선점 움직임이 있다(메리츠 2026-10-08).\n- **Panel 1,900억원 투자**: 패키지기판 캐파를 **__2배 수준__**으로 늘려 DDR6·LPDDR 고다층에 진입한다(DART 2026-09-18).\n\n**리스크**\n- **환율**: 매출의 95% 이상이 달러다. 원화가 강세면 3Q26처럼 100억원 이상의 외화환산손실이 나며, 영업이익 대비 민감도가 높다.\n- **리드프레임 수요**: 4Q 연말 재고조정과 전방 수요 회복 지연 가능성이 있다. 목표주가 하향도 이어지고 있다.\n- **기술·실행**: 릴투릴은 4층이 한계이고 GDDR6 4층에서도 수율 문제를 겪었다. Panel 라인 양산은 2H29로 멀어 수율과 고객 확보 리스크가 있다.\n- **고객·사이클 집중**: 패키지기판 고객이 메모리 IDM에 몰려 있어 메모리 사이클 변동에 그대로 노출된다.\n- **데이터 한계**: 정기보고서 '사업의 내용'(공식 매출비중·가동률·수주상황)을 확인하지 못했다. 위 매출비중은 증권사 리포트 수치로 계산한 값이다."}], "synth": "> **한 줄 결론:** AI FC-BGA는 **삼성전기(27E OP +121.6%)**, 메모리 기판은 **심텍·대덕전자**를 선호합니다. 주가가 **-37% 조정**받아 매수 기회입니다.\n\n### 핵심 인사이트\n\n**1. 실적 모멘텀은 심텍 > 대덕전자 > 삼성전기 순이고, LG이노텍·코리아써키트만 거꾸로 갔습니다**\n- 심텍은 OPM이 **__1Q26 3.2%에서 3Q26 19.0%로__** 올랐습니다. 3Q26 영업이익은 1,018억원으로 YoY **__약 8.2배__**이며, 4Q25→3Q26 OPM 개선 폭 **+16.4%p**도 7사 중 1위입니다.\n- 대덕전자는 3Q26 매출 **+46.1% YoY**, **OPM 21.0%(7사 최고)**로 컨센서스를 13% 웃돌았습니다. 삼성전기는 영업이익 **6,910억원(__YoY +165%__)**, OPM **18.4%**입니다.\n- 반대로 LG이노텍은 영업이익이 **__YoY -53.4%__**(OPM 1.5%)로 줄었습니다. 코리아써키트는 OPM이 **__3개 분기 연속 하락해 3.3%__**까지 내려왔습니다.\n- 시사점: 3Q26 실적은 **메모리 기판 믹스 개선과 FC-BGA 판가 인상**을 동시에 가진 업체가 이끌었습니다. 카메라모듈·자회사 적자를 안고 있는 업체는 기판 호황을 실적으로 연결하지 못했습니다.\n\n**2. 제품군별 승자: AI/네트워크 FC-BGA는 삼성전기, 메모리 기판·모듈 PCB는 심텍·대덕전자·티엘비입니다. 모바일/BT 쪽에는 뚜렷한 승자가 없습니다**\n- **FC-BGA AI/네트워크:** 20층 이상 AI ASIC·NVIDIA급은 **삼성전기가 사실상 국내 단독**입니다. 풀가동 상태에서 분기마다 판가를 약 10%씩 올리고 있고, FC-BGA OPM은 약 30%입니다. 패키지 부문 OPM도 **__1Q26 8.3%에서 3Q26 20.5%로__** 올랐습니다. LG이노텍(가동률 50% 미만, 적자)과 코리아써키트(12층 로우엔드)는 아직 이 시장에 들어오지 못했습니다.\n- **메모리 기판·모듈 PCB:** 심텍은 SoCAMM 퍼스트벤더로 **점유율 50% 이상**이며, SoCAMM 매출을 2027년 **__3,700억원 이상__**으로 제시했습니다. 대덕전자는 FC-CSP가 준쇼티지·풀캐파 상태이고 2차 판가 인상이 1Q27부터 반영됩니다. 티엘비는 고다층 eSSD(24층 BVH)를 사실상 혼자 맡고 있으며 SOCAMM 매출 목표는 2027년 **약 1,500억원**입니다.\n- **모바일/BT:** LG이노텍은 RF-SiP 세계 1위지만 패키지솔루션이 전사 매출의 **7.6%**에 그칩니다. 코리아써키트의 스마트폰 HDI는 정체입니다.\n- 시사점: 이익 레버리지가 가장 큰 곳은 **AI 서버향 FC-BGA와 SoCAMM/고다층 메모리 기판** 두 축입니다. 모바일 노출이 큰 업체는 상대적으로 불리합니다.\n\n**3. 2027~28년 성장 가시성은 '잔고'로는 모듈 PCB 3사, '캐파'로는 삼성전기·대덕전자가 가장 높습니다**\n- 수주잔고는 코리아써키트 **__9,077억원(YoY +689.7%)__**, 티엘비 **2,735억원(QoQ +107.5%, 분기매출의 2.9배)**, 심텍 **7,095억원(YoY +95.5%, 6개 분기 연속 증가)**, 대덕전자 **4,847억원(QoQ +45.6%)**입니다.\n- 증설 계획을 보면 삼성전기는 **__6.8조원__**을 투자해 세종·베트남에서 연 매출 **3조원 이상**의 캐파를 더하고, 2028년 하반기 양산합니다. 대덕전자는 전사 캐파를 **1.6조원 → 2.2조원(2H27) → 2.7조원(1H28)**으로 늘립니다. 티엘비 캐파는 2028년에 **약 2배(약 40,000㎡)**가 됩니다.\n- 시사점: **2027년은 판가 인상과 잔고 소화, 2028년은 신규 캐파 가동**이 성장을 이끄는 구간입니다. 고객이 투자비의 70% 이상을 부담하는 삼성전기의 캐파 선할당 구조가 가장 견고합니다.\n\n**4. 밸류에이션과 성장 사이의 괴리: 해성디에스·삼성전기·심텍은 싸고, 코리아써키트는 비쌉니다**\n- PER÷2027E OP 성장률은 해성디에스 **0.12(PER 6.8x, +54.9%)**, 삼성전기 **0.15(17.8x, __+121.6%__)**, 심텍 **0.17(14.5x, +83.6%)** 순으로 낮습니다. 대덕전자는 0.24, LG이노텍은 0.26입니다.\n- 삼성전기 PER은 TTM **53.8x**에서 12M fwd **17.8x**, 18M fwd **14.0x**로 빠르게 내려갑니다. 대덕전자는 메리츠 기준 2027년 PER **9.4x**로, 대만 ABF 피어 평균 17.7x보다 **약 47% 할인**돼 있습니다.\n- 코리아써키트는 12M fwd POR **12.1x**로 모듈 PCB 3사 중 가장 비쌉니다. 연결 OPM이 3%대인 점을 감안하면 부담스러운 수준입니다. 티엘비는 POR **9.0x**로 3사 중 상대적으로 쌉니다.\n- 시사점: 헤드라인 TTM 배수만 보면 삼성전기·심텍이 비싸 보입니다. 그러나 fwd 기준으로는 **성장 대비 가장 싼 축**에 속합니다.\n\n**5. 주가가 크게 빠진 종목일수록 펀더멘털은 오히려 좋아졌습니다**\n- 삼성전기는 1M **-37.8%**, 3M **-45.1%** 하락했지만, 같은 기간 3Q26 영업이익은 **YoY +165%**였습니다. 대덕전자는 1M **-37.0%**(10/28 대비 **__-48%__**) 하락한 반면 OPM은 **21.0%**로 3년 만에 20%대를 회복했습니다.\n- 해성디에스는 6M **__-48.1%__** 하락했지만 3Q26 영업이익은 **YoY +109.8%**였고, 패키지기판은 **흑자로 전환**했습니다.\n- 코리아써키트는 반대로 움직였습니다. 1M **+19.0%**, 3M **+42.9%** 올랐지만 OPM은 3개 분기 연속 하락했습니다.\n- 시사점: 이번 조정은 **AI 투자 둔화 우려에 따른 섹터 디레이팅**이지 실적 훼손이 아닙니다. 대형·FC-BGA주(삼성전기, 대덕전자)에서는 펀더멘털 대비 과도하게 빠진 구간이 생겼습니다.\n\n**6. 리스크: AI 투자 사이클, 추정치 편차, 잔고의 질**\n- 삼성전기는 AI 투자 둔화 우려로 1개월간 **KOSPI 대비 -28%** 부진했습니다. FC-BGA 판가·풀가동 전제가 꺾이면 fwd 배수 하락 논리도 함께 무너집니다.\n- 2027E 영업이익 추정이 출처마다 크게 다릅니다. LG이노텍은 FMP **12,013억원** vs IBK **7,180억원**, 코리아써키트는 **1,933억원** vs **1,470억원**, 티엘비는 **1,223억원** vs **918억원**입니다.\n- 잔고의 질도 따져봐야 합니다. 티엘비 잔고 증가분에는 SOCAMM의 긴 리드타임 효과가 일부 섞여 있습니다. 심텍 잔고는 일별 P.O 중심이며 LTA는 아직 협의 중입니다. 해성디에스는 매출의 95% 이상이 달러라 환율 민감도가 큽니다.\n- 시사점: 추정 편차가 큰 **LG이노텍·코리아써키트·티엘비의 fwd 배수는 할인해서 봐야** 합니다.\n\n### 한 줄 성적표\n\n| 기업 | 강점 | 약점 | 12M fwd PER | 판단 |\n|---|---|---|---|---|\n| 삼성전기 | 20층 이상 AI FC-BGA 국내 단독, **27E OP +121.6%**, 6.8조원 캐파 선할당 | AI 투자 둔화 우려, TTM PER 53.8x | **17.8x** | **선호** |\n| 심텍 | **OPM 3.2%→19.0%**, SoCAMM 점유율 50% 이상, 잔고 YoY +95.5% | 단기 P.O 중심 잔고, LTA 미체결 | **14.5x** | **선호** |\n| 대덕전자 | **OPM 21.0%(최고)**, 캐파 2.7조원(1H28), 2차 판가 인상 미반영 | 잔고 배수 1.2배로 낮음, AI 가속기 기여는 2027년 말 | **12.8x** | **선호** |\n| 티엘비 | 잔고/분기매출 **2.9배**, eSSD 24층 사실상 독점, POR 9.0x | 추정 편차(27E OP 918~1,223억원), 리드타임 효과 | – (POR 9.0x) | 중립 |\n| 해성디에스 | **PER 6.8x**, OP YoY +109.8%, 패키지기판 흑자전환 | 저다층(4층 이하) 한계, Panel 라인은 2H29, 환율 민감 | **6.8x** | 중립 |\n| LG이노텍 | RF-SiP 세계 1위, FC-BGA 2028E 1조원 목표 | 기판 비중 7.6%, **OP -53.4%**, FC-BGA 적자 | 8.1x | 비선호 |\n| 코리아써키트 | 잔고 **9,077억원(YoY +689.7%)**, SoCAMM2 확대 | **OPM 3.3%**(3개 분기 연속 하락), POR 12.1x로 가장 비쌈 | – (POR 12.1x) | **비선호** |\n\n---\n- **판단 기준:** 7사 중 선호 3곳(삼성전기·심텍·대덕전자), 중립 2곳, 비선호 2곳으로 나눴습니다. 티엘비는 잔고와 POR만 보면 선호에 가깝지만, 2027E 영업이익 추정 편차(918억~1,223억원)를 감안해 중립에 뒀습니다. 다르게 보신다면 알려 주세요. 수정하겠습니다.\n- **한 줄 결론 길이:** 요청하신 '90자 이내'의 기준이 모호해 첫 줄이 기준을 넘었을 수 있습니다. '한 줄 결론' 라벨까지 포함해 공백 포함으로 세면 90자를 조금 넘습니다. 문장만, 또는 공백 제외로 세면 90자 이내입니다. 더 줄여야 한다면 말씀해 주세요.", "cat": "## Part 1. 카테고리별 비교\n\n### 1) 시가총액·주가 추이\n\n| 기업 | 시가총액 | 주가 | 1M | 3M | 6M | YTD | 1Y |\n|---|---|---|---|---|---|---|---|\n| 삼성전기 | 64.24조 | 855,000원 | 🔽37.8% | 🔽45.1% | 🔽15.3% | 🔺216.7% | 🔺286.0% |\n| LG이노텍 | 6.83조 | 287,000원 | 🔽35.0% | 🔽56.1% | 🔽60.8% | 🔺7.3% | 🔺17.4% |\n| 심텍 | 4.89조 | 124,800원 | 🔽11.5% | 🔺14.8% | 🔺24.4% | 🔺145.7% | 🔺132.8% |\n| 대덕전자 | 4.57조 | 91,300원 | 🔽37.0% | 🔽23.3% | 🔽32.8% | 🔺90.4% | 🔺84.4% |\n| 코리아써키트 | 2.18조 | 90,200원 | 🔺19.0% | 🔺42.9% | 🔽0.9% | 🔺88.9% | 🔺208.4% |\n| 티엘비 | 1.04조 | 43,450원 | 🔽4.6% | 🔺38.4% | 🔽8.6% | 🔺56.2% | 🔺26.4% |\n| 해성디에스 | 0.78조 | 45,450원 | 🔽21.0% | 🔽22.8% | 🔽48.1% | 🔽17.1% | 🔽17.5% |\n<div id=chP class=ch></div>\n\n- **주도주는 삼성전기·코리아써키트·심텍입니다.** 1Y 수익률은 삼성전기 **+286.0%**, 코리아써키트 **+208.4%**, 심텍 **+132.8%**입니다. 삼성전기 시가총액 **64.24조원**은 나머지 6사 합계(20.29조원)의 **약 3.2배**입니다(2026-11-13 종가 기준).\n- **소외주는 해성디에스와 LG이노텍입니다.** 해성디에스는 7사 중 유일하게 YTD **-17.1%**, 1Y **-17.5%**로 하락했습니다. LG이노텍은 YTD +7.3%에 그쳤고 6M 기준 **-60.8%**입니다.\n- **최근 조정은 대형·FC-BGA주에 몰렸습니다.** 1M 등락률은 삼성전기 **-37.8%**, 대덕전자 **-37.0%**, LG이노텍 **-35.0%**입니다. 3M 기준으로는 LG이노텍 **-56.1%**, 삼성전기 **-45.1%**입니다. 대덕전자는 10/28 대비 48% 하락했습니다(메리츠 2026-11-09). 삼성전기는 AI 투자 둔화 우려로 1개월간 KOSPI 대비 -28% 부진했습니다(IBK 2026-11-12).\n- **반면 메모리 모듈 PCB(SoCAMM) 쪽은 버텼습니다.** 코리아써키트는 1M **+19.0%**, 3M **+42.9%**이고, 티엘비는 3M **+38.4%**입니다. 심텍은 1M -11.5%로 조정이 상대적으로 작았습니다.\n\n### 2) 최근 4개 분기 실적\n\n| 기업 | 지표 | Q-3 | Q-2 | Q-1 | 최근 |\n|---|---|---|---|---|---|\n| **삼성전기** | 분기 | 4Q25 | 1Q26 | 2Q26 | 3Q26 |\n|  | 매출(억) | 29,022 | 32,091 | 34,572 | 37,633 |\n|  | 영업이익(억) | 2,395 | 2,806 | 4,404 | 6,910 |\n|  | GPM | 20.8% | 20.6% | 24.4% | –(잠정) |\n|  | OPM | 8.3% | 8.7% | 12.7% | 18.4% |\n| **LG이노텍** | 분기 | 4Q25 | 1Q26 | 2Q26 | 3Q26 |\n|  | 매출(억) | 76,098 | 55,348 | 55,272 | 63,671 |\n|  | 영업이익(억) | 3,248 | 2,953 | 2,458 | 948 |\n|  | GPM | 8.6% | 10.1% | 9.6% | 6.2% |\n|  | OPM | 4.3% | 5.3% | 4.4% | 1.5% |\n| **대덕전자** | 분기 | 4Q25 | 1Q26 | 2Q26 | 3Q26 |\n|  | 매출(억) | 3,179 | 3,463 | 4,010 | 4,181 |\n|  | 영업이익(억) | 290 | 513 | 703 | 879 |\n|  | GPM | 14.5% | 20.9% | 26.8% | 25.4% |\n|  | OPM | 9.1% | 14.8% | 17.5% | 21.0% |\n| **심텍** | 분기 | 4Q25 | 1Q26 | 2Q26 | 3Q26 |\n|  | 매출(억) | 3,934 | 4,224 | 5,146 | 5,359 |\n|  | 영업이익(억) | 103 | 137 | 629 | 1,018 |\n|  | GPM | 9.1% | 10.4% | 18.5% | 26.1% |\n|  | OPM | 2.6% | 3.2% | 12.2% | 19.0% |\n| **티엘비** | 분기 | 4Q25 | 1Q26 | 2Q26 | 3Q26 |\n|  | 매출(억) | 726 | 758 | 882 | 940 |\n|  | 영업이익(억) | 86 | 107 | 128 | 166 |\n|  | GPM | 16.4% | 18.7% | 19.5% | 22.0% |\n|  | OPM | 11.8% | 14.1% | 14.5% | 17.7% |\n| **코리아써키트** | 분기 | 4Q25 | 1Q26 | 2Q26 | 3Q26 |\n|  | 매출(억) | 4,481 | 4,199 | 4,072 | 4,561 |\n|  | 영업이익(억) | 361 | 264 | 193 | 149 |\n|  | GPM | 10.9% | 9.1% | 7.4% | 7.0% |\n|  | OPM | 8.0% | 6.3% | 4.7% | 3.3% |\n| **해성디에스** | 분기 | 4Q25 | 1Q26 | 2Q26 | 3Q26 |\n|  | 매출(억) | 1,800 | 1,886 | 2,111 | 2,453 |\n|  | 영업이익(억) | 218 | 110 | 249 | 338 |\n|  | GPM | 19.6% | 12.4% | 18.4% | –(잠정) |\n|  | OPM | 12.1% | 5.8% | 11.8% | 13.8% |\n\n| 순위 | 매출 성장(3Q26 YoY) | GPM 개선 폭(4Q25→3Q26) | OPM 개선 폭(4Q25→3Q26) |\n|---|---|---|---|\n| 1 | 대덕전자 **+46.1%** | 심텍 **__+16.9%p__** | 심텍 **__+16.4%p__** |\n| 2 | 심텍 **+43.7%** | 대덕전자 **+10.9%p** | 대덕전자 **+11.9%p** |\n| 3 | 해성디에스 +37.4% | 티엘비 +5.7%p | 삼성전기 **+10.1%p** |\n| 4 | 티엘비 +36.4% | LG이노텍 -2.4%p | 티엘비 +5.8%p |\n| 5 | 삼성전기 +30.3% | 코리아써키트 -3.9%p | 해성디에스 +1.7%p |\n| 6 | 코리아써키트 +21.4% | – | LG이노텍 -2.8%p |\n| 7 | LG이노텍 +18.6% | – | 코리아써키트 -4.8%p |\n\n주: 삼성전기·해성디에스의 3Q26 GPM은 잠정치라 공개되지 않았습니다. 참고로 4Q25→2Q26 개선 폭은 삼성전기 +3.7%p, 해성디에스 -1.2%p입니다(DART 정기보고서, 삼성전기·해성디에스 3Q26은 네이버 잠정).\n\n- **심텍의 개선 폭이 가장 큽니다.** OPM이 1Q26 3.2%에서 3Q26 **__19.0%__**로 올랐고, 3Q26 영업이익은 1,018억원으로 YoY **__약 8.2배__**입니다. Tenting 비중이 줄고 SoCAMM·FC-CSP(YoY +89%)가 늘어난 믹스 효과입니다(메리츠 2026-11-09).\n- **대덕전자는 OPM 21.0%로 7사 중 최고입니다.** 3년 만에 20%대 이익률을 회복했고, 판가 인상과 비메모리 믹스 개선이 환율 하락을 상쇄했습니다.\n- **삼성전기는 3Q26 영업이익 6,910억원(OPM 18.4%)입니다.** 영업이익이 2분기 연속 크게 늘었습니다. 패키지 부문 OPM은 1Q26 8.3%에서 3Q26 **20.5%**로 올랐습니다(IBK 2026-11-12).\n- **역행한 곳은 LG이노텍과 코리아써키트입니다.** LG이노텍은 3Q26 OPM 1.5%로, 매출의 약 85%를 차지하는 광학 부문의 환율 영향(약 2,000억원 이익 차이)이 컸습니다(SK 2026-11-12). 코리아써키트는 OPM이 3분기 연속 하락해 3.3%가 됐습니다. 자회사 인터플렉스 적자와 디스플레이 재고평가충당금이 원인입니다(메리츠 2026-09-03).\n\n### 3) 수주잔고\n\n| 기업 | 2Q26 잔고 | 3Q26 잔고 | QoQ | YoY | 3Q 분기매출 대비 | 비고 |\n|---|---|---|---|---|---|---|\n| 삼성전기 | 공시 없음 | 공시 없음 | – | – | – | 수주잔고 미공시 |\n| LG이노텍 | 공시 없음 | 공시 없음 | – | – | – | 3Q 보고서 제출(2026-11-12), 수주상황 미기재 |\n| 대덕전자 | 3,328억 | **4,847억** | 🔺45.6% | 🔺55.9% | 1.2배 | 3Q 보고서 반영(2026-11-13) |\n| 심텍 | 5,892억 | **7,095억** | 🔺20.4% | 🔺95.5% | 1.3배 | 3Q 보고서 반영(2026-11-13) |\n| 티엘비 | 1,318억 | **2,735억** | 🔺107.5% | 🔺514.6% | 2.9배 | 3Q 보고서 반영(2026-11-13) |\n| 코리아써키트 | 4,266억 | **9,077억** | 🔺112.7% | 🔺689.7% | 2.0배 | 3Q 보고서 반영(2026-11-13) |\n| 해성디에스 | 공시 없음 | 공시 없음 | – | – | – | 수주잔고 미공시 |\n\n- **잔고 증가율은 코리아써키트가 가장 큽니다.** 3Q26 잔고가 **9,077억원**으로 QoQ **__+112.7%__**, YoY **__+689.7%__** 늘었습니다. SoCAMM 등 ASP가 높은 제품이 증가를 이끌었습니다. 다만 다른 자료(글로벌 테크 밸류체인 2026-11-13)는 3Q26 잔고를 4,266억원으로 적고 있습니다. 여기서는 3Q26 정기보고서 기준치를 썼습니다.\n- **가시성은 분기매출 대비 배수가 높은 티엘비(2.9배)와 코리아써키트(2.0배)가 높습니다.** 티엘비 잔고는 2,735억원으로 QoQ **+107.5%**입니다. 다만 SOCAMM의 긴 리드타임(재공품 누적)이 반영된 수치라 일부는 납기 구조 효과입니다(키움 2026-11-12).\n- **심텍은 잔고 7,095억원으로 6개 분기 연속 늘었습니다(YoY +95.5%).** 분기매출 대비 1.3배이며 일별 P.O 중심의 단기 수주입니다. 메모리 3사와 3~4년 LTA를 협의 중이고, 체결되면 연간 물량의 약 60%가 LTA로 공급됩니다(메리츠 2026-11-09).\n- **대덕전자는 잔고 4,847억원, QoQ +45.6%, 분기매출 대비 1.2배입니다.** 2027년분 LTA 선수금은 협상 중입니다(메리츠 2026-11-09).\n- **잔고 미공시 3사는 다른 지표로 봐야 합니다.**\n  - 삼성전기: 2027년 패키지기판 계약 3,605억원(2026-10-19 공시)이 있고, 세종 증설은 고객 지원금·가동률 보장 구조로 캐파를 미리 할당합니다(iM 2026-09-29).\n  - LG이노텍: 북미 반도체 3사와 FC-BGA LTA를 마무리하는 단계입니다(SK 2026-11-12).\n  - 해성디에스: 수주잔고 수치를 확인할 수 없습니다.\n\n### 4) 기판 제품군별 비교\n\n**① FC-BGA 서버·AI/네트워크**\n\n| 기업 | 단수(층수) | 사용처 | 주요 고객 | 매출 비중 | 현재/향후 |\n|---|---|---|---|---|---|\n| 삼성전기 | AI 가속기용 약 20층(일반 제품의 2배 이상), 서버용 20층·75×75mm(KPCA 2022). 칩별로는 Trainium2 16L, Trainium3 18~20L, Trainium4 24L, TPU v8 18L(5/27 리포트는 22~24L), TPU v9 24L, MTIA >18L, Tomahawk 6 >20L, Tomahawk 7 >22L, Qualcomm Cloud AI 200 14L·300 16L(5/27 리포트는 Cloud AI 100을 15L로 표기), OpenAI ASIC 14L, NVIDIA LPU 16L, NVLink6 18L. 개발 스펙 **26층 이상·150×150mm 이상**. 2.1D 오가닉 브리지 RDL 5~7층(메리츠 2026-07-31·05-27, SK 2026-05-14) | AI ASIC, 네트워크 스위치, 서버 CPU(Embedded PCB), LPU | AWS, AMD, NVIDIA(2Q26~), Google, Meta, 신규 LPU 고객 | FC-BGA가 패키지 매출의 **약 65%(6,100억원)**(SK 2026-10-29 추정). FC-BGA 중 서버·네트워크 60% 이상(IBK 2026-11-12) | 풀가동, 분기 약 10% 판가 인상, OPM 약 30%(iM 2026-10-20). NVIDIA GPU·스위치는 2026년부터 다년 공급하며 2028년에는 캐파의 상당 부분을 차지할 전망 |\n| LG이노텍 | 현재 12~14L(Tesla AI4 12L, Qualcomm Cloud AI 200 14L, OpenAI ASIC 14L). Tomahawk 7(>22L, >100×100mm) 공급사 후보. 2027년 말부터 20L 이상·80mm body 이상으로 확대 전망. 개발 스펙 20층 이상·120×120mm 이상(메리츠 2026-06-30, SK 2026-05-13). DPU 층수는 근거 없음 | NW용(2H26~), 서버 스위치·DPU(2027), AI 가속기(2027), 서버 CPU(2028~2029) | 북미 빅테크·반도체 고객(이름 미공개) | FC-BGA 전체 2026E 약 1,000억원으로, 패키지솔루션의 약 5%(역산) | 적자, 2Q26 가동률 50% 미만. FC-BGA 매출 2027E 4,000억원, 2028E **__1조원__**(회사 로드맵, SK 2026-07-28) |\n| 대덕전자 | 네트워크 스위치 Large Body 10층대 1종(2026년 6월 양산), 20층 1종(4Q26 양산). 개발 스펙 20층 이상·100×100mm 이상·미세회로 10μm 이하. 개발 과제 26L(120×150mm, 2.7mmT)(컨콜 2026-06-16, DART 2026 반기) | 네트워크 스위치, 광모듈. 향후 AI 가속기·LPU·CXL 가속기, 서버 | Q26, 콥데이 2026-11-11) | SOCAMM은 2026년 600~700억원에서 2027년 **약 1,500억원** 목표. 3Q26 ASP QoQ 10% 이상 인상 |\n| 코리아써키트 | DDR5 6400 RDIMM 16L IVH(DART 공시). 과거 8~10층에서 12~16층으로 확대. 서버향은 16L 이상이고 20L 이상도 논의 중(현대차 2026-01-20). SoCAMM2는 숫자 없음(\"적층 수 증가\") | 서버 RDIMM, SoCAMM2 | SK하이닉스, Micron(점유율 높음), 북미 SoCAMM 고객 | 모듈·SSD 합산 30%(1Q26 별도) | SoCAMM2 2026E 260억원에서 2027E 900억원 이상, 모듈 합계 2027E 4,700억원(대신 2026-11-02). 회사 가이던스 650억원과 차이 있음 |\n\n경쟁 구도: SoCAMM은 **심텍 퍼스트벤더 > 티엘비(하이닉스 내 40%대) > 코리아써키트(2027년 고객 2사)** 순서입니다. 고다층 RDIMM은 3사가 모두 16층 수준에서 경쟁합니다.\n\n**⑤ SSD PCB**\n\n| 기업 | 단수(층수) | 사용처 | 주요 고객 | 매출 비중 | 현재/향후 |\n|---|---|---|---|---|---|\n| 티엘비 | eSSD·EDSFF 20~24층. Vera Rubin 스토리지용은 **24층 BVH(3회 적층)**. 기존 16~20층에서 상향 | 서버 eSSD(E1.S/E3.S, 약 80%) | 삼성전자(PM1773 단독) | **33%**(3Q26) | 확대. 24층 ASP는 DDR5 BVH 대비 약 1.5배 |\n| 심텍 | 자료 없음 | SSD 모듈 | 메모리 3사 | 약 4.8%(258억원, 3Q26) | 축소(QoQ 감소) |\n| 코리아써키트 | 자료 없음 | SSD | – | 모듈 30%에 포함 | – |\n\n경쟁 구도: **고다층 eSSD는 티엘비 중심**이고, 심텍·코리아써키트는 비중이 작습니다.\n\n**⑥ MLB·고다층 PCB(HDI 포함)**\n\n| 기업 | 단수(층수) | 사용처 | 주요 고객 | 매출 비중 | 현재/향후 |\n|---|---|---|---|---|---|\n| 대덕전자 | AI 가속기 20~30층, 방산 10~30층, **AI 가속기 Compute Board 40층 근접**. 우주항공은 층수 없음 | 네트워크, 방산, 우주항공, AI 가속기 | 주요 AI 가속기 고객, 신규 우주항공 고객 | **17%(718억원)**(3Q26, 신한 2026-11-02) | 가동률 약 90%. 3Q26 QoQ 성장률은 항공우주 +36%, 방산 +24%, 네트워크 +16%. 우주항공 신규 고객 4Q26 말 양산 |\n| 티엘비 | 최대 약 100층 | 미사일·항공우주 | 이스라엘 업체 | 낮음 | 소량 공급 |\n| 코리아써키트(HDI) | 2020년 기사 기준 갤럭시S11 메인 12층·슬레이브 6~8층(참고, 자사 사양 아님). Metal PCB 2Layer(2010년) | 스마트폰 메인보드, Display·RF | – | Build-up 23%, Display·RF 7%(1Q26 별도) | 스마트폰은 정체, Display·RF는 축소 |\n\n경쟁 구도: **AI·방산 고다층 MLB는 대덕전자가 유일한 의미 있는 규모**입니다. 티엘비는 초고다층 틈새, 코리아써키트는 레거시 HDI입니다.\n\n**⑦ RF-SiP·AiP·SiP**\n\n| 기업 | 단수(층수) | 사용처 | 주요 고객 | 매출 비중 | 현재/향후 |\n|---|---|---|---|---|---|\n| LG이노텍 | 자료 없음(BT, mSAP, Cu-Post) | 스마트폰 RF 모듈·안테나(AiP), 위성통신 | 브로드컴, 스카이웍스, 코보(최종 북미 스마트폰) | 미공개. 패키지솔루션 전체가 3Q26 4,818억원, 전사 7.6%(디스플레이소재 포함, IBK 2026-10-28) | **RF-SiP 세계 1위**, 풀캐파. Cu-Post 단독 공급(2026년 2배). 6G RF-SiP 포함 2030년 BT 매
