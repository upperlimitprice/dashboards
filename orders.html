<script>
const OB=JSON.parse(document.getElementById('obd').textContent);
const fmt=v=>v>=10000?(v/10000).toFixed(1)+'조':Math.round(v).toLocaleString()+'억';
const pc=v=>`<span class='${v>0?'up':'dn'}'>${v>0?'+':''}${v.toFixed(1)}%</span>`;
const qlab=p=>{const[y,m]=p.split('.');return (m/3|0)+'Q'+y.slice(2);};
// 파생지표
const rows=[];
for(const tk in OB){
  const e=OB[tk],ps=Object.keys(e.series).sort();
  const last=e.series[ps[ps.length-1]],lastP=ps[ps.length-1];
  const prev=ps.length>1?e.series[ps[ps.length-2]]:null;
  const [y,m]=lastP.split('.');const yoyP=(y-1)+'.'+m;
  const yoyV=e.series[yoyP]!==undefined?e.series[yoyP]:null;
  let streak=0;
  for(let i=ps.length-1;i>0;i--){if(e.series[ps[i]]>e.series[ps[i-1]])streak++;else break;}
  const isHigh=last>=Math.max(...ps.map(p=>e.series[p]));
  const cov=e.ttm&&e.ttm>50?last/e.ttm:null;
  if(cov!=null&&cov>40)continue;  // 잔고가 연매출 40배 초과 = 다중통화 표 등 파싱 신뢰불가 → 제외
  rows.push({tk,n:e.name,last,lastP,qoq:prev?(last-prev)/Math.abs(prev)*100:null,
             yoy:yoyV?(last-yoyV)/Math.abs(yoyV)*100:null,streak,np:ps.length,hi:isHigh,src:e.src,cov,ttm:e.ttm});
}
// 툴팁 공용
let tip=null;
function tipShow(html,ev){
  if(!tip){tip=document.createElement('div');tip.id='obtip';document.body.appendChild(tip);}
  tip.innerHTML=html;tip.style.display='block';
  tip.style.left=Math.min(window.innerWidth-210,ev.clientX+14)+'px';
  tip.style.top=(ev.clientY+window.scrollY+10)+'px';}
function tipHide(){if(tip)tip.style.display='none';}
// 탭 리스트
const nm2=r=>(r.src==='u'?'<span style="color:#1f8a4c">✔</span> ':'')+r.n+(r.hi?' 🏆':'');
const base=[['기업',nm2],['잔고',r=>fmt(r.last)],['QoQ',r=>r.qoq!=null?pc(r.qoq):'-'],['YoY',r=>r.yoy!=null?pc(r.yoy):'-'],['연속↑',r=>r.streak? r.streak+'분기':'-'],['잔고/매출(TTM)',r=>r.cov!=null?'<b>'+r.cov.toFixed(2)+'x</b>':'-']];
const TABS={
 high:{cols:base,list:()=>rows.filter(r=>r.hi&&r.np>=8&&r.last>=300).sort((a,b)=>(b.yoy??-999)-(a.yoy??-999)).slice(0,40)},
 qoq:{cols:base,list:()=>rows.filter(r=>r.qoq!=null&&r.last>=300).sort((a,b)=>b.qoq-a.qoq).slice(0,40)},
 yoy:{cols:base,list:()=>rows.filter(r=>r.yoy!=null&&r.last>=300).sort((a,b)=>b.yoy-a.yoy).slice(0,40)},
 streak:{cols:base,list:()=>rows.filter(r=>r.streak>=3&&r.last>=300).sort((a,b)=>b.streak-a.streak||(b.qoq??0)-(a.qoq??0)).slice(0,40)},
 cov:{cols:base,list:()=>rows.filter(r=>r.cov!=null&&r.last>=300).sort((a,b)=>b.cov-a.cov).slice(0,40)},
 size:{cols:base,list:()=>rows.slice().sort((a,b)=>b.last-a.last).slice(0,40)}};
function rowTip(tk){
  const e=OB[tk],ps=Object.keys(e.series).sort().slice(-4);
  return `<b>${e.name}</b><br>`+ps.map(p=>`${qlab(p)}: ${fmt(e.series[p])}`).join('<br>');}
function showTab(k){
  document.querySelectorAll('#tabs .tab').forEach(b=>b.classList.toggle('on',b.dataset.t===k));
  const t=TABS[k],list=t.list();
  document.getElementById('tabc').innerHTML='<table><tr>'+t.cols.map(c=>`<th>${c[0]}</th>`).join('')
    +'</tr>'+list.map(r=>`<tr class='rowc' data-tk='${r.tk}' onclick='show("${r.tk}")'>`
    +t.cols.map(c=>`<td>${c[1](r)}</td>`).join('')+'</tr>').join('')+'</table>';
  document.querySelectorAll('#tabc tr.rowc').forEach(tr=>{
    tr.addEventListener('mousemove',ev=>tipShow(rowTip(tr.dataset.tk),ev));
    tr.addEventListener('mouseleave',tipHide);});
}
showTab('high');
// 검색
const q=document.getElementById('q'),sug=document.getElementById('sug');
q.addEventListener('input',()=>{
  const v=q.value.trim();sug.innerHTML='';
  if(v.length<1)return;
  const hits=rows.filter(r=>r.n.includes(v)).slice(0,12);
  sug.innerHTML=hits.map(r=>`<li onclick='show("${r.tk}")'>${r.n} <small>${fmt(r.last)}</small></li>`).join('');
});
// 차트 (공란 기본 → 검색/클릭 시 데이터)
const SEGC=['#2660c4','#f28e2b','#2e9e5b','#8e5cc8','#c0392b','#0f6b66','#b8860b','#7f8c8d'];
const W=980,H=260,L=56,B=34,T=14,R=8;
function frame(mx,n,ps){
  let s=`<svg id='obsvg' viewBox='0 0 ${W} ${H}' style='width:100%;background:#fbfcfe;border:1px solid #e3e9ef;border-radius:8px'>`;
  for(let g=1;g<=4;g++){const y=T+(H-T-B)*g/4;
    s+=`<line x1='${L}' y1='${y}' x2='${W-R}' y2='${y}' stroke='#eef1f5'/>`;
    if(mx)s+=`<text x='${L-5}' y='${T+(H-T-B)*(1-g/4)+4}' font-size='9' fill='#8a94a0' text-anchor='end'>${fmt(mx*g/4)}</text>`;}
  const X=i=>L+(W-L-R)*(n===1?0.5:i/(n-1));
  ps.forEach((p,i)=>{if(n<=24||i%2===n%2)s+=`<text x='${X(i).toFixed(1)}' y='${H-16}' font-size='8.5' fill='#8a94a0' text-anchor='middle'>${qlab(p)}</text>`;});
  return s;
}
function emptyChart(){
  const ps=[];for(let y=2021;y<=2026;y++)for(const m of['03','06','09','12']){
    if(y===2021&&m==='03')continue;if(y===2026&&m>'06')continue;ps.push(y+'.'+m);}
  document.getElementById('chart').innerHTML=frame(0,ps.length,ps)
    +`<text x='${W/2}' y='${H/2}' font-size='13' fill='#b7c1cb' text-anchor='middle'>기업 검색 또는 랭킹 클릭 → 분기별 수주잔고 (법인·부문별 누적)</text></svg>`;
}
emptyChart();
function show(tk){
  const e=OB[tk],ps=Object.keys(e.series).sort();
  const r=rows.find(x=>x.tk===tk);
  document.getElementById('cname').textContent=`${e.name} (${tk}) — 수주잔고 추이`;
  document.getElementById('cstats').innerHTML=
    (e.ind?`<b>${e.ind}</b>${e.prod?' · '+e.prod:''} · `:'')
    +`최신 ${qlab(r.lastP)} <b>${fmt(r.last)}</b>${r.hi?' 🏆<b style="color:#d63c2f">역대 최고</b>':''} · QoQ ${r.qoq!=null?pc(r.qoq):'-'} · YoY ${r.yoy!=null?pc(r.yoy):'-'} · 연속증가 ${r.streak}분기${r.cov!=null?` · 잔고/매출(TTM) <b>${r.cov.toFixed(2)}x</b>`:''} · ${r.np}개 분기`
    +` · <small style='color:${r.src==='u'?'#1f8a4c':'#889'}'>${r.src==='u'?'✔ 수기 검증본(참고)':'사업보고서 자동 파싱'}</small>`;
  const n=ps.length,vals=ps.map(p=>e.series[p]),mx=Math.max(...vals)*1.12;
  const X=i=>L+(W-L-R)*(n===1?0.5:i/(n-1)),bw=Math.max(3,Math.min(34,(W-L-R)/Math.max(1,n)*0.66));
  const P=e.parts||{};
  const segs=[];ps.forEach(p=>Object.keys(P[p]||{}).forEach(sg=>{if(!segs.includes(sg))segs.push(sg);}));
  const lp=ps[ps.length-1];
  segs.sort((a,b)=>((P[lp]||{})[b]||0)-((P[lp]||{})[a]||0));
  let s=frame(mx,n,ps);
  ps.forEach((p,i)=>{
    const v=vals[i],x=(X(i)-bw/2).toFixed(1),prt=P[p];
    if(prt&&segs.length){
      let y0=H-B;
      segs.forEach((sg,si)=>{const sv=prt[sg];if(!sv)return;
        const hp=(H-T-B)*sv/mx;y0-=hp;
        s+=`<rect x='${x}' y='${y0.toFixed(1)}' width='${bw.toFixed(1)}' height='${hp.toFixed(1)}' fill='${SEGC[si%8]}' opacity='0.88'/>`;});
    }else{
      const up=i>0&&v>vals[i-1];const Y=T+(H-T-B)*(1-v/mx);
      s+=`<rect x='${x}' y='${Y.toFixed(1)}' width='${bw.toFixed(1)}' height='${(H-B-Y).toFixed(1)}' fill='${up?'#c0392b':'#2660c4'}' opacity='0.82'/>`;}
  });
  s+='</svg>';
  let lg="<p style='font-size:.75rem;color:#889;margin:6px 0 0'>";
  if(segs.length)lg+="누적 막대 = 법인·부문별 분해(외화는 분기 평균환율 환산 후 합산): "
    +segs.map((sg,si)=>`<span style='color:${SEGC[si%8]}'>■</span> ${sg}`).join(' · ');
  else lg+="막대 색: 직전 분기 대비 증가=빨강 · 감소=파랑";
  lg+=" · 마우스를 올리면 분기별 수치</p>";
  document.getElementById('chart').innerHTML=s+lg;
  const svg=document.getElementById('obsvg');
  svg.addEventListener('mousemove',ev=>{
    const rc=svg.getBoundingClientRect();
    const vx=(ev.clientX-rc.left)*W/rc.width;
    const i=Math.max(0,Math.min(n-1,Math.round(n===1?0:(vx-L)/((W-L-R)/(n-1)))));
    const p=ps[i],prt=P[p];
    let h=`<b>${qlab(p)}</b><br>합계 <b>${fmt(e.series[p])}</b>`;
    if(prt)Object.entries(prt).sort((a,b)=>b[1]-a[1]).forEach(([sg,sv])=>{
      const si=segs.indexOf(sg);
      h+=`<br><span style='color:${SEGC[si>=0?si%8:7]}'>■</span> ${sg}: ${fmt(sv)}`;});
    tipShow(h,ev);});
  svg.addEventListener('mouseleave',tipHide);
  document.getElementById('chart').scrollIntoView({behavior:'smooth',block:'center'});
}
</script>
