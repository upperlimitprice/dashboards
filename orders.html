<script>
const OB=JSON.parse(document.getElementById('obd').textContent);
const fmt=v=>v>=10000?(v/10000).toFixed(1)+'조':Math.round(v).toLocaleString()+'억';
const pc=v=>`<span class='${v>0?'up':'dn'}'>${v>0?'+':''}${v.toFixed(1)}%</span>`;
// 파생지표
const rows=[];
for(const tk in OB){
  const e=OB[tk],ps=Object.keys(e.series).sort();
  const last=e.series[ps[ps.length-1]],lastP=ps[ps.length-1];
  const prev=ps.length>1?e.series[ps[ps.length-2]]:null;
  const [y,m]=lastP.split('.');const yoyP=(y-1)+'.'+m;
  const yoyV=e.series[yoyP]!==undefined?e.series[yoyP]:null;
  let streak=0;
  for(let i=ps.length-1;i>0;i--){if(e.series[ps[i]]>e.series[ps[i-1]])streak++;else break;}
  rows.push({tk,n:e.n,s:e.sector||e.s,last,lastP,qoq:prev?(last-prev)/Math.abs(prev)*100:null,
             yoy:yoyV?(last-yoyV)/Math.abs(yoyV)*100:null,streak,np:ps.length});
}
function tbl(el,list,cols){
  document.getElementById(el).innerHTML='<table><tr>'+cols.map(c=>`<th>${c[0]}</th>`).join('')+'</tr>'
    +list.map(r=>`<tr class='rowc' onclick='show("${r.tk}")'>`+cols.map(c=>`<td>${c[1](r)}</td>`).join('')+'</tr>').join('')+'</table>';
}
const base=[['기업',r=>r.n],['잔고',r=>fmt(r.last)],['QoQ',r=>r.qoq!=null?pc(r.qoq):'-'],['YoY',r=>r.yoy!=null?pc(r.yoy):'-']];
tbl('t_qoq',rows.filter(r=>r.qoq!=null&&r.last>=300).sort((a,b)=>b.qoq-a.qoq).slice(0,20),base);
tbl('t_yoy',rows.filter(r=>r.yoy!=null&&r.last>=300).sort((a,b)=>b.yoy-a.yoy).slice(0,20),base);
tbl('t_streak',rows.filter(r=>r.streak>=3&&r.last>=300).sort((a,b)=>b.streak-a.streak||b.qoq-a.qoq).slice(0,20),
    [['기업',r=>r.n],['연속↑',r=>r.streak+'분기'],['잔고',r=>fmt(r.last)],['QoQ',r=>r.qoq!=null?pc(r.qoq):'-']]);
tbl('t_size',rows.sort((a,b)=>b.last-a.last).slice(0,20),base);
// 검색
const q=document.getElementById('q'),sug=document.getElementById('sug');
q.addEventListener('input',()=>{
  const v=q.value.trim();sug.innerHTML='';
  if(v.length<1)return;
  const hits=rows.filter(r=>r.n.includes(v)).slice(0,12);
  sug.innerHTML=hits.map(r=>`<li onclick='show("${r.tk}")'>${r.n} <small>${fmt(r.last)}</small></li>`).join('');
});
function show(tk){
  const e=OB[tk],ps=Object.keys(e.series).sort();
  const r=rows.find(x=>x.tk===tk);
  document.getElementById('chartbox').style.display='block';
  document.getElementById('cname').textContent=`${e.n} (${tk})`;
  document.getElementById('cstats').innerHTML=
    `최신 ${r.lastP} 수주잔고 <b>${fmt(r.last)}</b> · QoQ ${r.qoq!=null?pc(r.qoq):'-'} · YoY ${r.yoy!=null?pc(r.yoy):'-'} · 연속증가 ${r.streak}분기 · 데이터 ${r.np}개 분기`;
  const W=980,H=250,L=56,B=34,T=14,R=8,n=ps.length;
  const vals=ps.map(p=>e.series[p]),mx=Math.max(...vals)*1.12;
  const X=i=>L+(W-L-R)*(n===1?0.5:i/(n-1)),Y=v=>T+(H-T-B)*(1-v/mx),bw=Math.max(3,Math.min(34,(W-L-R)/n*0.66));
  let s=`<svg viewBox='0 0 ${W} ${H}' style='width:100%;background:#fbfcfe;border:1px solid #e3e9ef;border-radius:8px'>`;
  for(let g=1;g<=4;g++){const y=T+(H-T-B)*g/4;
    s+=`<line x1='${L}' y1='${y}' x2='${W-R}' y2='${y}' stroke='#eef1f5'/>`;
    s+=`<text x='${L-5}' y='${T+(H-T-B)*(1-g/4)+4}' font-size='9' fill='#8a94a0' text-anchor='end'>${fmt(mx*g/4)}</text>`;}
  ps.forEach((p,i)=>{const v=vals[i],up=i>0&&v>vals[i-1];
    s+=`<rect x='${(X(i)-bw/2).toFixed(1)}' y='${Y(v).toFixed(1)}' width='${bw}' height='${(H-B-Y(v)).toFixed(1)}' fill='${up?'#c0392b':'#2660c4'}' opacity='0.82'><title>${p}: ${fmt(v)}</title></rect>`;
    if(n<=24||i%2===n%2)s+=`<text x='${X(i).toFixed(1)}' y='${H-16}' font-size='8.5' fill='#8a94a0' text-anchor='middle'>${p.slice(2)}</text>`;});
  s+='</svg><p style="font-size:.75rem;color:#889">막대 색: 직전 분기 대비 증가=빨강 · 감소/동일=파랑 · 마우스 올리면 값</p>';
  document.getElementById('chart').innerHTML=s;
  window.scrollTo({top:0,behavior:'smooth'});
}
</script>
